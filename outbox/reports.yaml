  - key: build-it-better-idea-spec-switches-to-rebuild-after-a-change
    findings: [CYM-build-it-better-idea-keeps-the-new-app-spec-after-a-change]
    severity: low
    category: logic
    url: https://cymetica.com/api/v1/build-it-better/requests/ET-30773
    title: >-
      Build it Better: after a BB-CHANGE, an idea's BB-SPEC switches to the rebuild wording ("does the job you
      use <Name> for ... never <Name>'s logos"), forbidding the idea's own logo; 4 of 4 ideas
    expected: >
      An idea (is_idea true) is a new app its requester names. Its first BB-SPEC says "<Name>, a new page on
      EventTrader that does what you described ... never anyone else's logos, copy or trademarks", and a
      BB-CHANGE amends that spec: the spec written after it still builds a new app under the idea's own name.
    actual: >
      Read on 2026-10-11 between 12:13 and 12:16 UTC from the board and each idea's record. All four ideas that
      got a BB-CHANGE switch wording at their first one: ET-30773 (Agent Tournaments, change at 2026-10-10 21:34
      UTC), ET-28203 (Team Dump Radar, 2026-09-28 18:38), ET-26924 (Agent League, 2026-09-24 10:46) and ET-26776
      (EIDOLON, 2026-09-23 19:08). On ET-30773 the spec before the change says "What we will build: Agent
      Tournaments, a new page on EventTrader that does what you described" and "never anyone else's logos, copy
      or trademarks"; every spec after it says "What we will build: a page on EventTrader that does the job you
      use Agent Tournaments for, with these changes" and "never Agent Tournaments's logos, copy or trademarks",
      which read literally forbids the name, logo and copy the idea is made of. The requester sent a second
      BB-CHANGE to say the name and logo are theirs; the spec after it still carries the clause. The two ideas
      with no BB-CHANGE (ET-28934, ET-27875) keep the new-app wording.
    steps:
      - 'GET https://cymetica.com/api/v1/build-it-better/requests -> six items with is_idea true: ET-30773, ET-28934, ET-28203, ET-27875, ET-26924, ET-26776'
      - 'GET https://cymetica.com/api/v1/build-it-better/requests/ET-30773 -> messages: BB-SPEC 21:31:57 "What we will build: Agent Tournaments, a new page on EventTrader that does what you described" ... "never anyone else''s logos"; BB-CHANGE 21:34:47; BB-SPEC 21:34:47 "What we will build: a page on EventTrader that does the job you use Agent Tournaments for, with these changes" ... "never Agent Tournaments''s logos, copy or trademarks"'
      - 'GET the same for ET-28203, ET-26924, ET-26776 -> the same switch at the first BB-CHANGE'
    body: >
      How to fix it is yours: keep the idea's own wording in every spec regenerated after a change. On a ticket
      that is in its 24-hour build, a spec that forbids the app's own name and logo is a line the builder may
      follow. Our check reads the board and every idea's record anonymously, judges the newest idea whose log
      has a BB-SPEC written after a BB-CHANGE, and fails while that spec uses the rebuild wording or forbids the
      idea's own logos. The four specs above are frozen, so our check can show a fix only on the next idea that
      gets a BB-CHANGE after it; we will read your fix time before saying anything about it.

  - key: build-it-better-withdraw-route-missing-from-openapi
    findings: [CYM-build-it-better-rest-routes-are-in-the-openapi]
    severity: low
    category: documentation
    url: https://cymetica.com/openapi-public.json
    title: >-
      Documentation: POST /api/v1/build-it-better/requests/{ticket}/withdraw is in llms.txt, mcp.json
      (bb_withdraw_request) and the page's own button, but not in /openapi-public.json
    expected: >
      A route llms.txt documents is also in the OpenAPI an agent reads, with its parameters and responses
      described, as the other Build it Better request routes are: accept, change and verdict are.
    actual: >
      Read on 2026-10-11 between 14:30 and 14:45 UTC. llms.txt's "## Build it Better" section names
      `POST .../requests/{ticket}/accept|change|verdict|withdraw` and says "`POST
      .../requests/{ticket}/withdraw` takes back your own request while it is requested or funded (not once it
      is building); the ticket is then marked declined". /.well-known/mcp.json lists the MCP tool
      bb_withdraw_request, and the page's "Withdraw this request" button posts to that route (its script calls
      act('/withdraw') against /api/v1/build-it-better). /openapi-public.json (345 paths) declares accept, change
      and verdict under /api/v1/build-it-better/requests/{ticket}/ and has no withdraw route there: the only
      paths containing "withdraw" are /api/v1/cloned-bots/{instance_id}/withdraw and
      /api/v1/withdrawals/token-gates. /openapi.json (27 paths) has no Build it Better route. Of the 15 routes
      the section names, 14 are in /openapi-public.json; this is the one that is not. The schema already knows
      the outcome (the message kinds list BB-WITHDRAW and closed_reason lists "withdrawn") but names the three
      other actions only: the 201's request_token ("the X-BB-Token for accept/change/verdict"), `yours`, and the
      endpoint table of /build-it-better/api, which has no withdraw row either.
    steps:
      - 'GET https://cymetica.com/llms.txt -> "## Build it Better": "`POST .../requests/{ticket}/accept|change|verdict|withdraw` (request token in the body)" and "`POST .../requests/{ticket}/withdraw` takes back your own request while it is requested or funded"'
      - 'GET https://cymetica.com/openapi-public.json -> 345 paths; /api/v1/build-it-better/requests/{ticket}/accept, /change and /verdict are there, /withdraw is not; the only paths containing "withdraw" are /api/v1/cloned-bots/{instance_id}/withdraw and /api/v1/withdrawals/token-gates'
      - 'GET https://cymetica.com/openapi.json -> 27 paths, none under /api/v1/build-it-better'
      - 'GET https://cymetica.com/.well-known/mcp.json -> tools[] bb_withdraw_request: "BB-WITHDRAW — take back your own request before it is built"'
      - 'GET https://cymetica.com/build-it-better -> the page script: the #bb-withdraw click calls act(''/withdraw''), which posts to API + ''/requests/'' + ticket + path with API = ''/api/v1/build-it-better'''
      - 'GET https://cymetica.com/build-it-better/api -> the endpoint table lists /requests/{ticket}/accept, /change and /verdict; no /withdraw row'
    body: >
      How to fix it is yours: add the route to /openapi-public.json with its token and auth parameters, its 200
      response and what it answers once the build has started (llms.txt says it is refused), and a withdraw row
      to the endpoint table of /build-it-better/api; the descriptions of the 201's request_token and of `yours`
      can then name withdraw too. A visitor who reads the schema cannot find the call that takes a request back.
      Our check reads /llms.txt and /openapi-public.json anonymously and fails while a route the Build it
      Better section names, in full or as .../x with a|b read as one route each, is not a path of the OpenAPI
      with that method. Not about what the route does or answers.

  - key: build-it-better-request-token-place-llms-vs-openapi
    findings: [CYM-build-it-better-request-token-place-is-documented-one-way]
    severity: low
    category: documentation
    url: https://cymetica.com/llms.txt
    title: >-
      Documentation: llms.txt says the Build it Better request token goes "in the body" on
      accept|change|verdict|withdraw; /openapi-public.json, the API page and the 201 say the X-BB-Token header
    expected: >
      One place for the request token: the llms.txt line and the OpenAPI that describes the same routes name the
      same one, so a reader of either can call accept, change and verdict.
    actual: >
      Read on 2026-10-11 between 14:30 and 14:45 UTC. llms.txt's "## Build it Better" section writes
      `POST .../requests/{ticket}/accept|change|verdict|withdraw` (request token in the body). /openapi-public.json
      declares, on accept, change and verdict, an optional header parameter x-bb-token and no token in any request
      body: accept has no requestBody, BBChangeIn is {changes} and BBVerdictIn is {verdict, note}. The 201 of POST
      /api/v1/build-it-better/requests says request_token "is the X-BB-Token for accept/change/verdict" and that
      `yours` means "accept/change/verdict allowed without X-BB-Token"; the endpoint table of /build-it-better/api
      gives "X-BB-Token, or the signed-in session of the account that filed it" for the same three; and the page's
      own script sets the X-BB-Token header before it posts any of its actions. So a reader of llms.txt puts the
      token in a body the OpenAPI does not define, and a reader of the OpenAPI sends a header llms.txt does not
      mention.
    steps:
      - 'GET https://cymetica.com/llms.txt -> "## Build it Better": "`POST .../requests/{ticket}/accept|change|verdict|withdraw` (request token in the body)"'
      - 'GET https://cymetica.com/openapi-public.json -> POST /api/v1/build-it-better/requests/{ticket}/accept: parameters ticket, x-bb-token (header), authorization, x-api-key and no requestBody; /change: requestBody BBChangeIn {changes}; /verdict: requestBody BBVerdictIn {verdict, note}'
      - 'Same document, POST /api/v1/build-it-better/requests -> 201 schema: request_token "New filings only: keep it — it is the X-BB-Token for accept/change/verdict."; yours "True when the signed-in caller filed this build (accept/change/verdict allowed without X-BB-Token)."'
      - 'GET https://cymetica.com/build-it-better/api -> the endpoint table: "X-BB-Token, or the signed-in session of the account that filed it" on /accept, /change and /verdict'
      - 'GET https://cymetica.com/build-it-better -> the page script act(): if (tok) hdr[''X-BB-Token''] = tok, then POST with a JSON body that carries no token'
    body: >
      We sent no write to see what the server accepts, so this does not say a token in the body is refused: it
      says the two documents name different places. How to fix it is yours: name the header in llms.txt, or, if
      a body token works too, declare it in the schema and say both places. The same four routes are in the
      companion report on the missing withdraw path in /openapi-public.json (#193). Our check reads
      /llms.txt and /openapi-public.json anonymously, route by route, and fails while the place llms.txt gives
      for the token and the places the OpenAPI declares for that route (the x-bb-token header, a token field
      of the request body) have nothing in common.

  - key: agent-tournaments-offers-deleted-bots
    findings: [CYM-agent-tournaments-offers-only-bots-that-exist]
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/agent-tournaments/my-bots
    title: >-
      Agent Tournaments: /api/v1/agent-tournaments/my-bots offers 12 bots that no longer exist for a seat
      (profile 404 "Bot not found."), and one of them holds seat 1 at table 2 with 0 trades
    expected: >
      The list an owner seats a bot from holds only bots that exist and can trade, so a seat goes to a bot that
      starts trading on approval, as the rules say: "On approval your bot gets the table's trading capital from
      your paper USDC and starts trading."
    actual: >
      Read on 2026-10-11 between 17:30 and 18:50 UTC with our X-API-Key. GET /api/v1/agent-tournaments/my-bots
      lists 53 bots. GET /api/v1/cloned-bots/my-clones lists 41 (paper and live together). For each of the 12
      others, GET /api/v1/cloned-bots/{id}/profile answers 404 {"detail":"Bot not found."}: they are clones that
      were deleted. One of them is "lab MACD Hunter" (996cd23e-2838-432c-aca7-5437fbd1ecbc), which we deleted on
      2026-09-28 (DELETE /api/v1/cloned-bots/{id} -> 200, success true), twelve days before Agent Tournaments
      shipped; /my-bots lists it with trading: true. Table 2 (paper, Pro, status running since 2026-10-11 16:46
      UTC) has a member seat, seat_id 1, named "lab MACD Hunter", with 0 trades and 0 volume, while the house
      seats have 1 to 20 trades each; it counts in seats_taken (10 of 10) and the table's pot is 100 USDC.
    steps:
      - 'GET https://cymetica.com/api/v1/agent-tournaments/my-bots (X-API-Key) -> 53 bots, each {instance_id, name, species, species_id, trading}'
      - 'GET https://cymetica.com/api/v1/cloned-bots/my-clones?mode=paper and ?mode=live (X-API-Key) -> 41 clones together'
      - 'GET https://cymetica.com/api/v1/cloned-bots/996cd23e-2838-432c-aca7-5437fbd1ecbc/profile -> 404 {"detail":"Bot not found."}; the same 404 for the other 11 offered bots not in my-clones'
      - 'The same /my-bots answer -> {"instance_id": "996cd23e-2838-432c-aca7-5437fbd1ecbc", "name": "lab MACD Hunter", "trading": true}'
      - 'GET https://cymetica.com/api/v1/agent-tournaments/tables/2 -> status running, seats_taken 10, pot_usdc 100.0; standings: seat_id 1 "lab MACD Hunter", trades 0, volume_usdc 0.0, house false'
    body: >
      In a paper table this costs a member seat for seven days and a buy-in in the pot for a bot that can never
      trade; in a live table the buy-in would be real money. How to fix it is yours: leave deleted bots out of
      /my-bots, refuse a seat for a bot that no longer exists, and decide what happens to a seat whose bot is
      deleted while the table runs. We do not know who asked for seat 1: our account's view of table 2 reads
      my_seat null. Our check reads /my-bots against our clone lists and, for the rest, each bot's profile, and
      fails while any offered bot's profile answers 404. GET requests only.

  - key: agent-tournaments-no-free-pro-table
    findings: [CYM-agent-tournaments-always-has-a-free-table]
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/agent-tournaments/lobby
    title: >-
      Agent Tournaments: no Pro table has a free seat while table 5 waits at 10 of 10 on one pending
      approval; the rules say "there is always a free table at each buy-in"
    expected: >
      What GET /api/v1/agent-tournaments/rules says under new_tables: "When a table fills, a new open table of
      the same buy-in opens at once, so there is always a free table at each buy-in." So at any moment each of
      the two buy-ins (Micro $5, Pro $50) has an open paper table with at least one free seat.
    actual: >
      Read on 2026-10-12 between 08:00 and 08:45 UTC, anonymous. The paper lobby holds three tables: Micro #1
      open with 10 free seats; Pro #2 running; Pro #5 open with seats_taken 10 and seats_free 0 -- nine seats
      seated and seat 28 ("Fibonacci Phoenix") pending its owner's approval. No Pro table has a free seat, so a
      $50 player cannot sit anywhere. Table 5 has not started because, per the rules' start line, "A table starts
      when its 10th seat is approved", and the new table opens only when one starts. The approval can wait up to
      a day: the Take a seat card says "request lapses in 24h", and seat 28's id is below that of seat 29, which
      was requested on 2026-10-11 at 18:54 UTC. Meanwhile the lobby draws Pro #5 as "OPEN · 0 SEATS LEFT" with a
      TAKE A SEAT button, the lobby's hero offers the same table, and table 5's own next_open_url is
      /agent-tournaments/table/5.
    steps:
      - 'GET https://cymetica.com/api/v1/agent-tournaments/rules -> new_tables "When a table fills, a new open table of the same buy-in opens at once, so there is always a free table at each buy-in."; start "A table starts when its 10th seat is approved, or when a seated member fills the free seats with house bots, and runs 7 days."; tiers micro and pro'
      - 'GET https://cymetica.com/api/v1/agent-tournaments/lobby -> mode paper; open_seats 10; tables: id 1 micro open seats_free 10; id 2 pro running seats_free 0; id 5 pro open seats_taken 10, seats_free 0, seated 9, seats[seat_id 28].status "pending"'
      - 'GET https://cymetica.com/api/v1/agent-tournaments/tables/5 -> status open, seats_free 0, pending_requests 1, next_open_url "/agent-tournaments/table/5" (read 08:30 UTC)'
      - 'Open https://cymetica.com/agent-tournaments -> the hero card and the Tables grid show "Pro #5", "OPEN - 0 SEATS LEFT", "Starts when full", "TAKE A SEAT"; no other Pro table is open'
    body: >
      How to fix it is yours: open the next table when the 10th seat is requested rather than approved, or do
      not count a pending seat as taken, or let the pending request lapse sooner. A full table that has not
      started should not offer TAKE A SEAT either. We do not know whose seat 28 is; ours at table 5 is seat 29,
      seated. Our check reads /rules and /lobby anonymously and fails while a buy-in the rules list has no open
      table of the lobby's mode with a free seat; it also counts the tables at 10 of 10 waiting to start, since
      the case comes and goes with approvals. GET requests only.

