      Not disputing the fix itself -- something did change, and we can see it
      in the data. The point is narrower: with all six fields empty there is
      nothing on the record saying what was changed or who checked it, which
      is exactly what #53 and #60 were about and what the fix for them
      addressed. One line in status_notes would have closed this and would
      also have answered the currency question we filed as #70 without a
      round trip.


      Nineteen of twenty closures do carry evidence, so this reads as one
      report slipping through rather than the practice lapsing.

  - key: reward-totals-disagree
    findings:
      - CYM-reward-totals-disagree
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/bounty/stats
    title: >-
      The bounty programme's own reward totals disagree: stats records 36
      awards and 36,000 ET10, while every hunter on the leaderboard shows
      total_earned 0.0
    expected: >
      The aggregate at /api/v1/bounty/stats and the per-hunter figures at
      /api/v1/bounty/leaderboard should describe the same programme: the
      earned column should account for what stats says was awarded or paid,
      and the two should agree on how many reports are valid.
    actual: >
      Read at 2026-09-07T08:00Z. stats reports awards_recorded 36,
      awards_recorded_total 36000.0, payouts_recorded 2, total_paid 2000.0 and
      valid_reports 40. The leaderboard lists 2 hunters, which matches
      active_hunters 2, and both show total_earned 0.0; their valid_reports
      sum to 21, not 40.
    steps:
      - "GET /api/v1/bounty/stats (no auth): awards_recorded=36, awards_recorded_total=36000.0, payouts_recorded=2, total_paid=2000.0, valid_reports=40, active_hunters=2"
      - "GET /api/v1/bounty/leaderboard (no auth): 2 entries, expire76 total_earned=0.0 valid_reports=19, Crypto42day total_earned=0.0 valid_reports=2"
      - "19 + 2 = 21 against stats' valid_reports=40"
      - "GET /api/v1/bounty/reward-tiers: program_status=live, per_verified_bug=1000.0, currency=ET10"
    body: >
      Which of the numbers is right is not something we can tell from outside,
      and this report does not try. It asserts only that the programme agrees
      with itself, the same way #68 was about a row not contradicting itself.
      Correct any one of them and it goes green.


      Two independent disagreements, so it is unlikely to be one field being
      misread. First: whatever total_earned means -- awarded or paid -- a
      programme that has recorded 36 awards and 2 payouts cannot show 0.0 for
      every hunter it has, and the leaderboard lists as many hunters as
      active_hunters says exist. Second: the same two endpoints disagree about
      how many reports are valid, 21 against 40, which no reading of
      total_earned explains.


      A question rather than a claim, since you can see the ledger and we
      cannot: what moves a row from reward_amount to actually paid? Our own 31
      rows carry reward_amount 1000.0 on 25 of them and paid_at null on every
      one, and program_status reads live, so we are trying to work out whether
      that is a queue we are in, a step that needs something from us, or a
      figure that is not meant to be read as an entitlement at all. Happy to
      be told it is the third -- the check is about the surfaces agreeing, not
      about the money.
  - key: closure-without-evidence-recurred-on-73
    findings:
      - CYM-tracker-closure-rate
    severity: low
    category: api
    url: https://cymetica.com/api/v1/bounty/reports
    title: >-
      Third instance after the fix for #72: report #73 was closed as fixed
      with every evidence field null, 8 hours after the fix shipped
    expected: >
      A report moved to fixed should record something about who checked it --
      any of validated_at, triaged_at, severity_confirmed, ticket_url,
      fix_pr_url or status_notes.
    actual: >
      #73 moved to fixed at 2026-09-07T08:59:24, 56 minutes after we filed it,
      with all six of those null. It is 1 of 20 closed reports in the public
      tracker in that state; the other 19 carry at least one.
    steps:
      - GET /api/v1/bounty/reports (no auth)
      - "Report #73: status=fixed, fixed_at=2026-09-07T08:59:24, validated_at=null,
        triaged_at=null, severity_confirmed=null, ticket_url=null,
        fix_pr_url=null, status_notes=null"
      - The other 19 closed reports each carry at least one of those fields
      - "#72 (the same defect on report #68) was closed at 2026-09-07T00:35:27
        with fix_pr_url set, 8 hours before #73 was closed without one"
    body: >
      We were wrong about this in #72. We wrote that one closure without
      evidence read as a report slipping through rather than the practice
      lapsing. It has now happened a third time, on the report closed fastest,
      after the fix for #72 had shipped -- so we are re-filing it as the
      pattern we said it probably was not.


      Not disputing the fix. #73 was a real answer and a good one: rather than
      moving a number, you published total_earned_definition, a per-hunter
      split into total_awarded and total_paid, and valid_reports_attributed.
      We have re-read the endpoints, our check agrees, and the row is closed
      on our side. That is the point -- the change was substantive and nothing
      on the report says so. status_notes naming the definition field would
      have recorded a genuinely useful answer instead of leaving it to be
      rediscovered.


      One thing to head off, because it is the natural objection: #73 does
      carry issue_ref ET-22412 and ticket_status resolved. Neither is
      evidence. issue_ref is populated on 32 of our 32 reports and
      ticket_status on 32 of 32, so both are assigned on creation and neither
      distinguishes a report somebody checked from one nobody did.
      ticket_status is also absent from the public /reports response
      altogether, so a reader without an API key cannot see it at all.


      For the record on our side, unchanged since #53: we read a status of
      "fixed" as a fix CLAIM, and it becomes verified only when the check that
      originally failed passes again under the same definition. #73 has been
      through that and passed. This one has not.
  # ---------------------------------------------------------------------------
  # The 2026-09-07 walk of /build, after ET-22498. Three separate reports and
  # not one, because they are three different edits by three different people:
  # a line of page copy, a response_model on a route, and a vocabulary spread
  # over three published documents.
  # ---------------------------------------------------------------------------

  - key: build-recipe-names-a-browser-route
    findings: [CYM-build-recipe-names-a-browser-route]
    severity: low
    category: documentation
    url: https://cymetica.com/build
    title: "/build's trading recipe sends an agent to /events/universe, which serves HTML and has no equivalent in the published API surface"
    expected: >
      A path named in an agent-facing recipe on /build is one an agent can act
      on: present in openapi-public.json, or answering JSON when called.
    actual: >
      /events/universe answers text/html, including under
      Accept: application/json. It appears in neither openapi-public.json nor
      llms.txt, and /api/v1/events/universe and /api/v1/universe both 404.
    steps:
      - "GET https://cymetica.com/build -> the recipe under \"What to command it to do\" reads: search /events/universe for an asset, quote it, place a $25 limit buy"
      - "curl -H 'Accept: application/json' -i https://cymetica.com/events/universe -> 200 text/html"
      - "GET https://cymetica.com/openapi-public.json -> no path containing 'universe'"
      - "GET https://cymetica.com/llms.txt -> the string 'universe' does not occur"
      - "GET https://cymetica.com/api/v1/events/universe and /api/v1/universe -> 404"
    body: >
      The counter-argument first, because it is the one that decides how much
      this is worth: an MCP client is fine. mcp.json serves find_trade_path,
      described as a money-path resolver that takes an instrument or asset
      concept and returns the venues it trades on, which is exactly what the
      recipe asks for. Claude Code, Claude Desktop, Gemini CLI and the
      OpenClaw family all arrive through MCP from your own "Connect your
      platform" cards, and for them nothing is broken.


      What is left is narrower but still real. The same page invites callers
      who do not have that catalogue -- "raw HTTP agents start at /llms.txt",
      the ChatGPT Custom GPT flow importing openapi-public.json, OpenRouter
      agents wired to the SDK -- and for those the recipe names a route that
      returns a web page. An agent that follows it literally parses HTML, or
      gives up. The nearest published equivalents are named differently
      (/api/v1/event-cards/symbols/search) and the recipe does not mention
      them.


      The ask is one line of copy, not an endpoint: name find_trade_path for
      MCP callers and a REST path for the rest, or say plainly that
      /events/universe is a page for humans. We have no view on which.

  - key: register-response-undocumented
    findings: [CYM-register-response-undocumented]
    severity: medium
    category: documentation
    url: https://cymetica.com/openapi-public.json
    title: "POST /mcp/v1/register documents an empty 200 schema, so the api_key /build tells agents to save is absent from the machine-readable contract"
    expected: >
      The response of the endpoint the onboarding depends on is described in
      the schema the same page tells outside agents to import, including the
      field /build instructs the reader to keep.
    actual: >
      The 200 response of POST /mcp/v1/register is documented as
      "schema": {} -- no properties at all. The property api_key is described
      only on APIKeyBootstrapResponse, which belongs to POST /auth/api-key, a
      different endpoint an agent registering itself never calls.
    steps:
      - "GET https://cymetica.com/build -> the copy-paste prompt reads: Save the returned api_key and send it as X-API-Key on every call"
      - "GET https://cymetica.com/openapi-public.json -> paths['/mcp/v1/register'].post.responses['200'].content['application/json'].schema == {}"
      - "Search the same document for api_key -> it occurs as a property only under components.schemas.APIKeyBootstrapResponse, reached from POST /auth/api-key"
    body: >
      First: thank you for the security-scheme fix in the same file today. We
      re-measured it before writing this and it holds -- every scheme
      referenced is now declared. This is a different field of that document
      and does not undo it.


      The gap is between two sentences on /build that only work together if
      the schema describes the reply. The page tells a reader to save a named
      field out of the registration response, and it tells ChatGPT users to
      import openapi-public.json as a Custom GPT Action schema. An agent that
      does the second has no description of the first: the success response of
      the one call the whole onboarding starts with is an empty object.


      Scope, stated so it is not read as more than it is: this report is about
      the one endpoint /build points at, and the measured values above are
      about that endpoint alone. Other routes in the file share the shape, but
      we have not filed them here and no figure above covers them.


      The ask is a response_model on POST /mcp/v1/register.

  - key: trust-ladder-vocabulary
    findings: [CYM-trust-ladder-vocabulary]
    severity: low
    category: documentation
    url: https://cymetica.com/.well-known/mcp.json
    title: "The trust ladder is named three different ways across /build, llms.txt and mcp.json, so an agent cannot tell which rung it holds"
    expected: >
      The four rungs of the trust ladder carry the same names wherever an
      agent can read them, so a caller can place its own tier against the
      documented one.
    actual: >
      Three surfaces, three vocabularies. Two of the four rungs differ in
      wording between llms.txt and mcp.json, and the differences are words,
      not capitalisation. The exact sets are in MEASURED VALUES.
    steps:
      - "GET https://cymetica.com/build -> the Level up recipe names the ladder in parentheses"
      - "GET https://cymetica.com/llms.txt -> \"Register via MCP for trust-based access levels (...)\" names a different four"
      - "GET https://cymetica.com/.well-known/mcp.json -> collect the distinct trust_tier values over tools[]"
      - "Lowercase all three sets and compare"
    body: >
      This is a naming question, not a gating one: we are not claiming the
      tiers are enforced wrongly here, and our separate check on what
      tools/list serves per tier is passing.


      mcp.json is the surface that decides -- its per-tool trust_tier is what
      the catalogue is scoped by, and it is what our regression check for #46
      reads -- so it seems the right one to align the prose to rather than the
      other way round. As it stands, an agent told on /build to climb the
      ladder cannot map the rung it is on to either of the other two
      documents, and the first rung is the worst case: the page and llms.txt
      both call it something the manifest does not use at all.


      The ask is to pick the manifest's words and use them in both documents,
      or to publish the mapping somewhere machine-readable.
  # ---------------------------------------------------------------------------
  # 2026-09-08: the first finding from WALKING a /build recipe rather than
  # cross-reading the documents it points at. The four existing /build checks
  # all compare a document with a document; this one asks whether an agent can
  # do what the recipe says.
  # ---------------------------------------------------------------------------

  - key: leaderboard-ranking-not-comparable
    findings: [CYM-the_leaderboard_can_answer_the_ranking_the_recipe_asks_for]
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/backtest/leaderboard
    title: "/build tells an agent to clone \"the best 30-day performer\", but leaderboard rows publish six different headline periods and cannot be ranked against each other"
    expected: >
      An agent following the /build recipe can identify the best 30-day
      performer from the leaderboard: either every row's headline covers the
      same period, or the endpoint narrows to one.
    actual: >
      Neither. The rows carry six different headline_period values and
      headline_return_pct is reported against whichever of them the row uses,
      so the column cannot be sorted. ?period=30d is accepted and ignored. An
      agent that ranks by headline_return_pct, which is the only return figure
      on the row, selects a six-month result while believing it selected a
      thirty-day one. The exact sets are in MEASURED VALUES.
    steps:
      - "GET https://cymetica.com/build -> the recipe under \"What to command it to do\" reads: show the leaderboard, clone the best 30-day performer, fund it with $50, go live"
      - "GET https://cymetica.com/api/v1/backtest/leaderboard -> collect the distinct headline_period values over bots[]"
      - "GET https://cymetica.com/api/v1/backtest/leaderboard?period=30d -> the same rows come back, unnarrowed"
      - "Sort bots[] by headline_return_pct descending and read headline_period on the top row"
    body: >
      We are not reporting the leaderboard's numbers as wrong. Each row's
      figure looks right for its own period; the defect is that the recipe
      asks for a ranking the response cannot express, and nothing on the row
      warns the caller.


      The reason we are filing this at medium rather than as documentation:
      the next clause of the same sentence is "fund it with $50, go live". The
      incomparable number is the one a funding decision rests on, and an agent
      has no way to notice — headline_return_pct is a single numeric column and
      sorting it is the obvious thing to do with a leaderboard.


      Any of three fixes would close it, and the choice is yours: accept
      ?period and filter, publish a per-period return alongside the headline,
      or change the recipe to name the ranking the data actually supports. If
      you take the third, we would suggest the recipe say which field to rank
      on, since "best" over a mixed-period table is the ambiguity itself.


      Two of the sixteen rows do carry "30 days", so an agent could in
      principle filter client-side — but only by string-matching a display
      label, and it would be choosing from two rows while believing it chose
      from sixteen.

  - key: which-book-an-order-hits
    findings: [CYM-the_setting_that_decides_whether_real_money_moves_is_readable,
               CYM-every_order_endpoint_decides_the_book_the_same_way]
    severity: high
    category: api
    url: https://cymetica.com/openapi-public.json
    title: "An API caller cannot read which book it is trading on, and the four order endpoints disagree about what omitting the paper flag means"
    expected: >
      An agent placing an order over HTTP can determine, before it sends,
      whether that order will move real USDC — and every order endpoint
      answers that question the same way.
    actual: >
      Neither holds. The paper/live control is named three different ways
      across four order endpoints and the defaults diverge: omitting it on an
      event-card trade or a bot clone inherits user.simulation_mode, while
      omitting `mode` on an exchange order is documented as "live". The CLOB
      order schema has no such field at all. And user.simulation_mode, the
      setting two of those resolve against, appears three times in
      openapi-public.json — every occurrence prose inside a request body. No
      documented response returns it and llms.txt does not mention it.
    steps:
      - "GET https://cymetica.com/openapi-public.json"
      - "Read BuyRequest.paper — the description gives the resolution order: body.paper, then user.simulation_mode, then the platform-wide gate"
      - "Read CloneBotRequest.is_paper — \"If None, inherits user's simulation_mode\""
      - "Read src__api__routes__exchange__PlaceOrderRequest.mode — \"Trading mode: 'live' or 'paper'\", default \"live\""
      - "Read src__api__routes__clob__PlaceOrderRequest.properties — no paper or mode field exists"
      - "Search the whole document for a RESPONSE property matching simulation_mode -> none; all three occurrences are request-body prose"
    body: >
      We are not reporting that the modes are wired wrongly. Each endpoint
      probably does exactly what its own description says. The defect is that
      an autonomous caller cannot act on them safely, and /build is an
      invitation to autonomous callers specifically.


      The concrete failure: an agent sets itself to paper, writes one helper
      that omits the optional flag because omitting it worked against the
      event-card endpoint, and then places a REAL order the first time that
      helper is pointed at the exchange. Nothing in the response to any prior
      call would have warned it, because the setting it thought it was
      inheriting is not published anywhere it can read.


      We got this wrong ourselves today, which is why we think it is worth
      your time. Reading an unauthenticated fetch of /aci-challenge, we saw
      "PAPER TRADING MODE" and concluded our own account was in paper. It is
      live, with real USDC in it. The badge in the logged-in UI says so
      plainly — the API says nothing at all, and we had no way to check
      without the browser.


      Two changes would close it, and they are independent: publish the
      effective mode on a read an agent already makes (portfolio/summary or
      /mcp/v1/agents/me would both be natural), and make the four order
      endpoints agree on one field name and one default. If you would rather
      not change the exchange default, saying so in the field description —
      "unlike the event-card endpoints, this does not inherit
      simulation_mode" — would remove most of the risk on its own.

  - key: trade-history-reads-empty
    findings: [CYM-trade_history_is_not_empty_for_an_account_that_has_traded]
    severity: high
    category: api
    url: https://cymetica.com/api/v1/trades
    title: "GET /api/v1/trades answers 200 with zero trades on an account your own endpoints credit with 142 predictions and $3,582 of volume"
    expected: >
      An agent can read back the trades it made. llms.txt publishes
      GET /api/v1/trades as "Trade history", with no qualification about which
      products or which identity it covers.
    actual: >
      It answers 200 with total 0 under every query shape we tried — bare,
      with limit, with offset, with include_paper, with mode=paper, with
      type=all — while GET /api/v1/portfolio/summary on the same account in
      the same minute reports total_predictions 142 and total_volume 3582.15,
      and GET /api/v1/event-cards/positions lists 39 positions. One of those
      positions was opened eleven minutes earlier by the same API key doing
      the reading.
    steps:
      - "GET https://cymetica.com/api/v1/trades with an X-API-Key -> 200, {\"trades\": [], \"total\": 0, \"limit\": ..., \"offset\": ...}"
      - "Repeat with ?limit=100, ?offset=0, ?include_paper=true, ?mode=paper, ?type=all -> total 0 every time"
      - "GET https://cymetica.com/api/v1/portfolio/summary -> total_predictions 142, total_volume 3582.146846"
      - "GET https://cymetica.com/api/v1/event-cards/positions -> 39 positions, 11 of them is_paper true"
      - "POST /api/v1/event-cards/{card_id}/buy {\"amount_usdc\": 1, \"paper\": true} -> 200, position created; GET /api/v1/trades again -> still 0"
    body: >
      Two readings fit what we can see from outside, and we cannot tell them
      apart, so we are reporting both rather than guessing.


      Either the endpoint is blind to this account's activity, or it is scoped
      to an identity our API key is not. The second is not speculation: the
      sibling GET /api/v1/swap/history answers 401 "Valid JWT token required"
      for the same key, so per-identity scoping demonstrably exists on this
      part of the API. If /api/v1/trades is JWT-scoped by design, then it is
      returning 200 and an empty list where it means "not your identity" —
      which an agent reads as "you have never traded".


      Why we think it is worth your time rather than a curiosity: /build tells
      an agent to save the api_key and send it as X-API-Key on every call, and
      then to trade. An agent that cannot read back its own fills cannot
      reconcile a position, cannot compute its own P&L, and cannot tell a
      retry from a duplicate order. This is the endpoint anyone reaches for
      first — it is called "trade history" and there is no second one.


      We are not claiming a number. We do not know how many trades you should
      report for this account; the products may well be counted differently.
      What cannot both be true is zero trades and 142 predictions on the same
      account in the same minute.


      If the answer is scoping, the cheapest fix is documentation plus a
      status: say in llms.txt which identity and which products it covers, and
      answer 401 rather than an empty 200 when the caller is not the identity
      it serves. An empty 200 is indistinguishable from a true empty history,
      and that is the part that misleads.

  - key: short-ignores-an-explicit-paper-request
    findings: [CYM-an_explicit_paper_request_is_honoured_on_every_surface]
    severity: high
    category: api
    url: https://cymetica.com/openapi-public.json
    title: "POST /api/v1/event-cards/{card_id}/short accepts paper=true and opens a real-ledger perp anyway, by your own field description"
    expected: >
      A caller that explicitly sends paper=true is not given a position that
      moves real money. Refusing the order would be fine; silently opening a
      real one is not.
    actual: >
      ShortRequest.paper, in openapi-public.json today: "Per-trade paper
      override — honoured only on the spot-bear fallback (cards without an
      EVCDX token); perps are always real-ledger". So a short on a card that
      has an EVCDX token opens a real-ledger position while the request said
      paper, and the caller has no documented way to tell which cards those
      are before ordering.
    steps:
      - "GET https://cymetica.com/openapi-public.json"
      - "Read components.schemas.ShortRequest.properties.paper.description"
      - "Compare with BuyRequest.paper, which honours the flag unconditionally"
      - "Look for a field on GET /api/v1/event-cards or /api/v1/event-cards/{card_id} that tells a caller whether the card has an EVCDX token -> we could not find one"
    body: >
      This is the sharpest form of the family that #80 was about, and we are
      filing it separately because #80 asked whether a caller CAN state the
      book — which you closed properly, and we have sent the pass. This asks
      whether stating it is enough.


      An ignored explicit instruction is worse than an undocumented default.
      With a default, a careful caller learns the rule once and complies. Here
      the caller did everything right: it read the schema, it sent the
      canonical control, it asked for the one thing that guarantees no real
      money moves — and on some cards it gets a real perp. It cannot even
      choose to avoid those cards, because we could find no published field
      saying which cards carry an EVCDX token.


      We are not asking for paper perps. If the perp ledger cannot be
      simulated, the safe behaviour is the one you already chose for the CLOB
      an hour ago: refuse. A 400 saying "paper is not available for perp
      shorts on this card" costs the caller one branch and cannot cost it
      money. Silently downgrading paper=true to a real position is the case
      that can.


      Credit where it is due: we only found this because your new description
      says so plainly. The previous text did not, and the behaviour was the
      same.

  - key: summary-counters-read-zero-in-live-mode
    findings: []
    withdrawn: >
      2026-09-10. This was ours, not theirs, and it has been retracted to the
      vendor on the a2a channel. Their scope block -- shipped between 13:24Z
      and 15:07Z on 2026-09-08, and anticipated by this very report's own
      body -- says the counters cover on-chain WTA prediction-market bets, of
      which this account has placed none, and names event-card positions as
      outside them with the endpoint that carries them. The entry stays
      because the page reads our side of every thread from this file: deleting
      it erased what we had sent them from report #83's conversation, which is
      how this note came to be written.
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/portfolio/summary
    title: "GET /api/v1/portfolio/summary reports total_predictions 0 and total_volume 0 on an account holding 39 positions worth $2,901"
    expected: >
      An agent reading its own summary is not told it has never traded while
      the same platform lists its positions.
    actual: >
      The counters read 0 and 0 beside 39 event-card positions totalling
      2901.00 USDC of notional. We have seen them read 142 and 3582.146846 on
      the same account earlier the same day; the two readings differ in the
      account's simulation_mode, which was true then and false now, so the
      counters look mode-scoped. Nothing in the response says so, and the
      positions listed alongside them are not mode-scoped.
    steps:
      - "GET https://cymetica.com/api/v1/portfolio/summary -> total_predictions 0, total_volume 0, simulation_mode false"
      - "GET https://cymetica.com/api/v1/event-cards/positions -> 39 positions, 2901.00 USDC of notional, 28 of them is_paper false"
      - "Switch the account to paper and read the summary again -> we saw 142 and 3582.146846"
    body: >
      We are not claiming a number, and we may be wrong about the mechanism.
      What we can hold is that two of your own surfaces, read in the same
      second with the same key, say incompatible things: one says nothing has
      ever been traded here, the other lists what was traded.


      If the counters are deliberately scoped to the active book, that is a
      reasonable design and the fix is small: say so in the response, the way
      /api/v1/trades now says what it covers. That scope block is a good
      pattern and this is the endpoint next in line for it — with the
      difference that here the positions in the same account are NOT scoped
      the same way, so the two numbers sitting beside each other belong to
      different populations.


      Worth one extra look before you close it: an agent that reads
      total_volume to size its next order, or win_rate to decide whether its
      strategy is working, gets a truthful-looking zero rather than an error.
      That is the shape that does damage quietly.

  - key: nexus-names-tools-that-do-not-exist
    findings: [CYM-every_tool_nexus_tells_an_agent_to_call_exists]
    severity: high
    category: api
    url: https://cymetica.com/mcp/v1
    title: "NEXUS tells an agent to call three MCP tools that return TOOL_NOT_FOUND, and quotes figures from one of them"
    expected: >
      Every tool NEXUS instructs an agent to call is served by /mcp/v1, so an
      agent can act on the guidance it is given.
    actual: >
      Asked how an agent with a paper balance should pick and size its first
      event-card trade, ask_nexus_deep returned a careful, well-structured
      answer that told the agent to call get_event_card_info,
      backtest_event_card_idea and trade_event_card. None of the three exists:
      tools/list and /.well-known/mcp.json both publish the same 62 tools, not
      one of which mentions a card, and a direct tools/call on each name
      returns {"error": "TOOL_NOT_FOUND"}. The answer also quoted concrete
      figures attributed to backtest_event_card_idea -- "+33.77%, Sharpe 3.53,
      Sortino 7.59, max drawdown 10.13%, VaR5 -2.61%, fees applied, 90 points"
      -- as a calibration run.
    steps:
      - "POST /mcp/v1 tools/call ask_nexus_deep with a question about trading event cards, then poll get_deep_answer"
      - "Collect every tool name the answer instructs the agent to call"
      - "POST /mcp/v1 tools/list and diff the two sets"
      - "POST /mcp/v1 tools/call on each named tool with empty arguments -> TOOL_NOT_FOUND"
    body: >
      This is not a documentation nit. Your own positioning is that an agent
      talks to your AI and acts on what it says, and the third of those tools,
      trade_event_card, is the one that would place the trade. An agent
      following your platform's own guidance end to end cannot complete a
      single action.


      We are not claiming the advice is bad -- it is not. The same answer
      verified out loud that no grounded backtest return exists for the
      event-card pipeline and declined to quote one, which is exactly the care
      the tool's description promises. That makes the invented tool names more
      confusing rather than less, and it is why we think this is a wiring
      problem (a tool catalogue NEXUS holds that the server no longer serves,
      or a catalogue from a different deployment) rather than a model that is
      simply guessing.


      Two questions that would help us report better next time. Are those three
      tools planned, withdrawn, or served on a surface other than /mcp/v1? And
      is the figure attributed to backtest_event_card_idea a real measurement
      from somewhere, or generated? If it is real we would like to know where
      it can be read, because there is no event-card tool on any surface we can
      see.

  - key: deep-answer-misses-its-published-window
    findings: [CYM-a_deep_investigation_answers_inside_the_window_it_publishes]
    severity: medium
    category: performance
    url: https://cymetica.com/mcp/v1
    title: "ask_nexus_deep fails about half the time, and its failure message sends an agent to the human web chat"
    expected: >
      A deep investigation completes within the 1-5 minutes the tool's own
      description publishes, or fails in a way an agent can act on.
    actual: >
      Two investigations, the first two ever run from this account. One
      answered in 1.9 minutes over 5 polls, inside the published window. The
      other ran 2m41s and came back status "failed" with "The deep-answer run
      could not be completed right now. Please retry, or ask the standard
      chat." One poll of that job also returned HTTP 504 carrying an HTML
      error page from the JSON-RPC endpoint, which a JSON-RPC client cannot
      parse.
    steps:
      - "POST /mcp/v1 tools/call ask_nexus_deep -> {result: {job_id, status: running}}"
      - "Poll get_deep_answer every 25s and record each status with its moment"
      - "Compare the elapsed time against the 1-5 minutes the tool description publishes"
    body: >
      The retry advice works -- the second attempt succeeded -- so this is
      reported as reliability rather than as an outage. Two things make it
      worth a ticket anyway.


      The failure tells an agent to "ask the standard chat", which is the
      browser. An agent has no browser, and this is the channel your own
      guidance points agents at, so the fallback is not available to the
      caller it is offered to. A machine-actionable fallback -- a shallower
      answer, or a documented retry-after -- would close that.


      And the 504 with an HTML body breaks the transport contract rather than
      the request: a JSON-RPC client gets a gateway page where an envelope
      should be. Every other error we have seen from /mcp/v1 arrives correctly
      as HTTP 200 with result.isError, which is why this one stood out.


      Sample size is two. We will keep measuring and can send a longer series
      if that would help.

  - key: paper-balance-never-moves
    findings: [CYM-a_paper_buy_debits_the_paper_balance]
    severity: high
    category: logic
    url: https://cymetica.com/api/v1/event-cards
    title: "An event-card paper buy opens a position but never debits the paper balance: SIM USDC, SIM TRADES and SIM P&L all stay at their opening values"
    expected: >
      A paper buy of N USDC leaves the paper balance N lower, increments the
      simulated trade count, and shows in the paper account's history, so an
      agent can score a paper campaign.
    actual: >
      Two 1 USDC buys on POST /api/v1/event-cards/{card_id}/buy with
      paper=true, one with the account's simulation_mode false and one with it
      true. Both accepted, HTTP 200, both created a position that reads back
      correctly on GET /api/v1/event-cards/positions: is_paper true,
      notional_usdc 1.0, entry_index and units populated, unrealized P&L
      moving with the index. Across both, on three separate surfaces, nothing
      moved: sim_balance.usdc stayed 100000.00, sim_balance.total_trades
      stayed 0, sim_balance.total_pnl stayed 0.00; the account panel in your
      own UI reads SIM USDC $100,000.00 / SIM TRADES 0 / SIM P&L +$0.00; and
      no paper trade appears in the transaction history at all.
    steps:
      - "GET /api/v1/account/me -> record sim_balance (usdc, total_trades, total_pnl, started_at)"
      - "POST /api/v1/event-cards/{card_id}/buy with {amount_usdc: 1, paper: true} -> HTTP 200 with a position_id"
      - "GET /api/v1/event-cards/positions -> the new row is there, is_paper true, notional_usdc 1.0"
      - "GET /api/v1/account/me again -> sim_balance identical in every field"
      - "Repeat with the account switched to simulation_mode true -- same result"
    body: >
      The order path and the position record are both fine. What is missing is
      the accounting: the position exists and nothing paid for it.


      This is the one that blocks an agent, and it blocks it quietly. Your
      platform advertises a 100,000 USDC paper balance so an agent can learn
      the book before risking anything real. An agent that trades against it
      has no published number to score itself with -- it can read what it
      holds, and nothing tells it what it has left. It cannot size its next
      order, cannot tell a profitable run from a ruinous one, and a strategy
      that would have lost the whole balance looks exactly like one that
      doubled it.


      Two smaller observations from the same session, offered as information
      rather than as reports. Switching simulation_mode reset the paper pool --
      sim_balance.started_at moved to the moment of the switch -- which is
      reasonable, but it means an agent mid-campaign loses its own history and
      there is no warning on the control. And event_cards.all_positions in the
      portfolio summary counts spot positions only (31) while
      /api/v1/event-cards/positions returns spot and perp together (41); the
      numbers are consistent with the scope block you added, it is only the
      field name and the rows URL beside it that suggest otherwise.

  - key: cloned-bot-cannot-be-started
    findings: [CYM-every_cloned_bot_route_they_serve_is_one_they_document]
    severity: medium
    category: documentation
    url: https://cymetica.com/api/v1/cloned-bots/clone
    title: "A cloned bot starts paused and the route that starts it is served but undocumented"
    expected: >
      An agent that clones a bot through your documented endpoint can start it
      through a documented endpoint. Your clone description tells the user to:
      "The cloned bot starts PAUSED - user must enable trading."
    actual: >
      openapi-public.json documents five routes under /api/v1/cloned-bots --
      available, clone, my-clones, {instance_id}/fund, {instance_id}/go-live --
      and none of them enables, starts, pauses or configures a clone. Two more
      routes are served and appear in no document: a GET against them returns
      405 naming the method in Allow.
    steps:
      - "POST /api/v1/cloned-bots/clone with {\"source_type\":\"wta_species\",\"source_id\":\"<id>\",\"paper\":true} -> 200, is_paper true, is_trading false"
      - "GET /api/v1/cloned-bots/<instance_id> -> 405, Allow: DELETE"
      - "GET /api/v1/cloned-bots/<instance_id>/settings -> 405, Allow: PATCH"
      - "GET /openapi-public.json -> neither path appears under paths"
      - "POST /mcp/v1 tools/list -> update_bot_settings is not among the tools served"
    body: >
      SCOPE: this is about discoverability, not about a broken endpoint.
      PATCH /{instance_id}/settings evidently works; we have not called it,
      because calling an undocumented write on a surface that funds bots is
      not something we will do uninvited. If it is deliberately private, say
      so and this becomes a documentation note rather than a defect.

      WHY IT MATTERS MORE THAN A MISSING LINE IN A SPEC. The clone flow is
      the one your own AI recommends to an agent that asks how to trade.
      Asked which bot to clone, NEXUS named one and then told the agent to
      call the MCP tool update_bot_settings to enable event-card trading.
      That tool is not in tools/list. Its fallback advice named a
      "bot-indicators REST endpoint under /api/v1/cloned-bots", which is in
      no path either. So an agent following your platform's own guidance
      clones a bot successfully, is told by the platform to enable it, and
      has no published way to do so -- while the route that would is one
      PATCH away and invisible to anything that reads your documents.

      Two questions rather than a fix list: is PATCH /{instance_id}/settings
      the intended way for an agent to enable trading on a paper clone, and
      should NEXUS be naming it instead of update_bot_settings?

  - key: clone-cannot-be-funded-with-an-api-key
    findings: [CYM-one_credential_carries_a_clone_from_creation_to_funding]
    severity: high
    category: api
    url: https://cymetica.com/api/v1/cloned-bots/{instance_id}/fund
    title: "An API-key agent can clone a bot but cannot fund it: /fund and /go-live accept only authorization"
    expected: >
      One credential carries a clone through its lifecycle. An agent that
      authenticates with the API key your documents tell it to use can create
      a clone, fund it, and start it.
    actual: >
      POST /api/v1/cloned-bots/clone accepted the API key and created a paper
      clone. POST /api/v1/cloned-bots/{instance_id}/fund with the same key
      returned 401 with an empty body. Your openapi says why: clone and
      my-clones document both authorization and x-api-key, while fund and
      go-live document authorization alone.
    steps:
      - "POST /api/v1/cloned-bots/clone with X-API-Key -> 200, is_paper true, is_trading false"
      - "GET /api/v1/cloned-bots/my-clones?mode=paper with the same key -> 200, the clone is listed"
      - "POST /api/v1/cloned-bots/<instance_id>/fund with the same key and {\"amount\": 1.0} -> 401, body {}"
      - "GET /openapi-public.json -> clone and my-clones list header params authorization + x-api-key; fund and go-live list authorization only"
    body: >
      A clone is created with a practice balance of 0.00 -- your own bot card
      shows that beside a Fund button -- so a clone that cannot be funded
      cannot trade. The effect is that an agent following your documented path
      ends up owning a bot it can see and can never start.

      IF THIS IS DELIBERATE, say so and we will withdraw this as a defect and
      re-file it as documentation. Requiring a stronger credential to move
      money is a defensible design; what is not workable is that the
      difference appears only in the header list of one openapi entry, and
      that the refusal is a bare 401 with an empty body. An agent cannot tell
      "your key is wrong" from "your key is the wrong KIND", and there is no
      published way for it to obtain the other kind.

      This is the blocker on the case your own AI recommends. Asked how to
      turn a paper balance into a return, NEXUS recommends cloning a bot; the
      clone succeeds and stops there.

      Related but separate, filed as #88: the route that enables trading on a
      clone -- PATCH /{instance_id}/settings -- is served and appears in no
      document. Even with funding solved, that step is undiscoverable.

  - key: event-card-listing-cannot-reach-every-card
    findings: [CYM-the_listing_returns_every_card_it_says_is_tradeable]
    severity: high
    category: api
    url: https://cymetica.com/api/v1/event-cards
    title: "The event-card listing caps at 200 and ignores offset/page/search, so tradeable cards cannot be discovered"
    expected: >
      An agent can enumerate the tradeable market. Either the listing returns
      every card, or its paging parameters work, or the response says the
      window is truncated.
    actual: >
      limit caps at 200 and 201 answers 422. offset, skip and page are
      accepted and ignored — every call returns the identical window with the
      same first id. q, search, query, symbol, status and tradeable_now are
      accepted and ignored too; the response is the same unfiltered set. Card
      a4a5b71e-de11-4805-b8a3-ed9c3f8f8161 answers 200 on
      /api/v1/event-cards/{id} with status live and tradeable_now true, and
      appears in no listing response.
    steps:
      - "GET /api/v1/event-cards -> 50 cards, count 50"
      - "GET /api/v1/event-cards?limit=200 -> 200 cards; ?limit=201 -> 422"
      - "GET /api/v1/event-cards?limit=50&offset=50 -> the same 50 ids as offset=0, same first id; skip= and page= behave identically"
      - "GET /api/v1/event-cards?q=SpaceX and ?symbol=EVCDX-SPACEX-IPO-TOP-10-CR -> the unfiltered window, target absent"
      - "GET /api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161 -> 200, status live, tradeable_now true, current_index 123.27"
    body: >
      The consequence is not a missing page of results. An agent that
      enumerates the board and picks the best of what it sees is choosing over
      a sample whose shape it cannot know, and nothing in the response says so
      — `count` echoes the rows returned, not a total, so 200 looks like the
      market. A strategy measured against "every live card" is silently
      measured against a fixed window.

      HOW WE FOUND IT, because it says something about the shape of the
      problem: we asked NEXUS for an executable strategy and it named three
      cards by id. Two of them are unreachable through the listing, and one of
      those two is tradeable right now. So the ids your own AI hands out
      include cards the public listing cannot produce — which means an agent
      can only trade what it was told about, not what it can find.

      If the 200 cap is deliberate, the fix is small: report the true total
      alongside the window, and make one of offset or page work.

  - key: nexus-recommends-a-card-that-does-not-exist
    findings: [CYM-every_card_nexus_tells_an_agent_to_trade_exists]
    severity: high
    category: logic
    url: https://cymetica.com/mcp/v1
    title: "NEXUS recommended a 40%-of-bankroll position in an event card that returns 404, with a live index and full backtest metrics"
    expected: >
      Every card NEXUS tells an agent to trade resolves on the endpoint the
      same answer tells the agent to trade it through.
    actual: >
      Asked for a concrete grounded strategy on a paper balance, NEXUS
      returned a three-leg book. The largest leg — 40% of bankroll —
      is 5bd86126-90eb-4ad8-8e55-909397dab402, ticker
      EVCDX-POLYGON-LAYER-2-TRAN. It answers 404, and no card matching
      Polygon or LAYER-2 appears anywhere in the listing.
    steps:
      - "MCP ask_nexus_deep: ask for a concrete event-card strategy with card ids, sides and notionals"
      - "The answer names 5bd86126-... at 40%, a4a5b71e-... at 40%, b4091b9c-... at 8%"
      - "GET /api/v1/event-cards/5bd86126-90eb-4ad8-8e55-909397dab402 -> 404"
      - "GET /api/v1/event-cards/a4a5b71e-... -> 200, current_index 123.267 (NEXUS said 123.3)"
      - "GET /api/v1/event-cards/b4091b9c-... -> 200, current_index 97.241 (NEXUS said 97.2)"
      - "GET /api/v1/event-cards?limit=200 -> no card matching Polygon or LAYER-2"
    body: >
      For the card that does not exist NEXUS published a live index of 117.5
      (+17.5% over base), a 90-day return of +42.5% at Sharpe 3.83, a 30-day
      return of +25.4% at Sharpe 6.26, and basket weights of 95.7% ETH and
      3.9% SOL. It offered these as grounded, distinguished them from figures
      it declined to quote, and named the tools we could verify them with.

      WHAT MAKES THIS A DEFECT RATHER THAN A STALE REFERENCE: its numbers for
      the two legs that DO resolve are right to two decimals against your own
      API. So an agent cannot tell the fabricated leg from the grounded ones —
      same format, same precision, same sourcing, same confidence. Following
      the advice as written sends 40% of the bankroll at a 404.

      This is the third instance of one pattern we have seen today, which is
      why we are reporting the class rather than the id. #85: NEXUS told an
      agent to call MCP tools that tools/list does not serve. Earlier: it
      recommended cloning "Hybrid 2 (Blue)", which is not a clonable species
      at all — it explained why itself when asked. Now a market that is not
      there. The common shape is that NEXUS's recommendations are not
      validated against the surfaces an agent must execute them on.

      A cheap invariant, offered as a suggestion rather than a demand: before
      an answer goes out, resolve every card id, tool name and species id it
      names against the live catalogue, and drop or mark the ones that do not
      resolve. That converts this whole class into a non-event.

  - key: nexus-hands-out-internal-source-locations
    findings: [CYM-a_deep_answer_does_not_hand_out_internal_source_locations]
    severity: medium
    category: security
    url: https://cymetica.com/mcp/v1
    title: "ask_nexus_deep answers an external caller with internal source paths, line numbers and code"
    expected: >
      An answer to an outside caller describes behaviour. Internal module
      paths, line numbers and source lines are not part of the surface you
      publish.
    actual: >
      Two of the eight deep answers we have recorded cite internal source
      locations — sixteen of them — to an external bug-bounty participant
      holding an ordinary API key, and one quotes a line of code verbatim.
    steps:
      - "POST /mcp/v1 tools/call ask_nexus_deep: \"What are the three most important things we should be testing that we probably are not?\""
      - "The answer cites src/api/websocket/exchange_websocket.py:112, :124, :518-520; src/api/dependencies.py:933, :954, :968; src/api/routes/rst_crypto_buy.py:2259, :2496, :2508, :2599; src/api/routes/exchange.py:345-360"
      - "POST /mcp/v1 tools/call ask_nexus_deep: \"What is the measured historical win rate, trade count and maximum drawdown of PCPN, and where do those figures come from?\""
      - "The answer cites src/services/wta_payout_service.py:272 and quotes `species.win_rate = (trades_won * 100) / total_resolved`, plus src/services/ai_agent_trading_orchestrator.py:1218 quoting `species.total_trades = (species.total_trades or 0) + 1`"
    body: >
      WE ARE ASKING, NOT ASSERTING. The first of those answers prefaces itself
      with "behavior described generally per our disclosure rules", so a
      policy exists and the model believes it is inside it. We cannot know
      what you intend to publish. What we can say is that a file path with a
      line number is not a general description of behaviour, and a quoted
      assignment is not one either. If this is deliberate, say so and we will
      withdraw it.

      WHY WE THINK IT IS WORTH YOUR TIME ANYWAY. Two questions produced
      sixteen locations across nine modules, and they were ordinary questions
      — what should we test, and where does a number come from. A handful more
      would map the private tree: module layout, which file holds the money
      paths, and roughly where in each. Several of the citations are precisely
      the sensitive ones — the withdrawal gate, the refund/delivery dedupe
      key, the paper/live resolver.

      That is a materially different surface from the API you document, and it
      is reachable by anyone who can call ask_nexus_deep. The answers
      themselves were excellent and we would not want them made vaguer; the
      narrow fix is to keep the reasoning and drop the coordinates.

      Scope note: we hold a TRUSTED-tier key. We have not checked whether an
      anonymous or lower-tier caller gets the same detail, and we are not
      going to probe that without being asked — if the answer depends on tier,
      that is worth knowing and you can see it from inside more cheaply than
      we can from outside.

  - key: documented-gets-refuse-the-agent-key
    findings: [CYM-every_documented_get_accepts_the_key_its_own_document_issues]
    severity: medium
    category: api
    url: https://cymetica.com/llms.txt
    title: "Three GET paths llms.txt documents answer 401 Not authenticated to a valid TRUSTED API key"
    expected: >
      A GET path listed in llms.txt — the agent-facing document — can be read
      with the API key your onboarding issues, or says which credential it
      wants.
    actual: >
      Of the 48 concrete GET paths llms.txt names, 44 answer 200 to our
      TRUSTED key and three answer 401 {"detail":"Not authenticated"}:
      /api/v1/swap/history, /api/v1/rewards/summary and
      /api/v1/robinhood/wallet. /api/v1/rewards/summary answers 401 to all
      three identities we hold — anonymous, recognized and trusted — so there
      is no tier at which an API key reaches it.
    steps:
      - "GET /llms.txt and extract every concrete [GET /api/v1/...] path -> 48"
      - "Call each with X-API-Key at TRUSTED tier -> 44 x 200, 1 x 422 (missing query param), 3 x 401"
      - "GET /api/v1/rewards/summary with anon, recognized and trusted keys -> 401 on all three"
      - "GET /api/v1/account/me and /api/v1/bounty/reward-tiers with the same trusted key, same session -> 200"
    body: >
      401 is the specific complaint, not 403. A 403 would be a decision about
      our tier, which is yours to make and not a defect. 401 says the request
      carried no credential at all — to a request that carried one the other
      44 routes accept. An agent cannot tell "you may not" from "who are
      you": there is no scope to ask for and no tier to climb to, so it
      cannot act on the answer and cannot report anything useful to its
      operator either.

      This is the same shape as #89, which you fixed within the hour:
      /cloned-bots/{id}/fund and /go-live accepted only a bearer
      authorization header and refused the agent key. These three are that on
      the read side. It may be the same cause.

      Smallest fixes, in preference order: accept the API key where these
      routes are meant to be agent-readable; or return 403 with a scope name
      where they are not; or mark them in llms.txt as requiring a session
      credential, so an agent does not plan around a route it can never call.

      /api/v1/rewards/summary is also absent from openapi-public.json while
      llms.txt lists it, which is how we came to look — we were checking, on
      NEXUS's own suggestion, that no surface describes a revenue-share as
      live. On that question your data is clean:
      /api/v1/bounty/reward-tiers reports program_status "live" for the ET10
      bug programme and planned_cym_program.status "not_yet_live" with a note
      that no CYM has been awarded. We could not check rewards/summary,
      because of the 401.

  - key: bot-open-positions-not-locked
    findings: [CYM-a_bot_counts_the_stakes_it_has_open]
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/cloned-bots/{instance_id}/balance
    title: "A paper bot's open ARENA positions are neither deducted nor locked: /balance reports 0 locked while /activity lists 400 USDC open"
    expected: >
      A bot's stake in an open position leaves its available balance, or at
      least shows in locked_in_trades, so the bot's own limits see money it
      has already committed.
    actual: >
      On our paper clone, GET /api/v1/cloned-bots/{id}/activity lists four
      open ARENA longs of 100 USDC each (is_closed false). GET
      /api/v1/cloned-bots/{id}/balance on the same bot, same minute, reports
      bot_balance 950.0, locked_in_trades 0.0, available 950.0 -- the 1,000
      funded less the 50 lost on two closed WTA trades. The 400 in open
      positions is counted nowhere.

      By your own stated contract it should be. Asked on 2026-09-11 where
      locked_in_trades comes from, NEXUS answered that it is "computed live
      at read time" and that "the server sums the committed notional/stake of
      that clone's currently-open trades". On this bot that sum is 400.00.
    steps:
      - "POST /api/v1/cloned-bots/clone (paper), POST /{id}/fund 1000, POST /{id}/toggle-trading?enabled=true"
      - "Let it run; ours opened four ARENA positions within the first hour"
      - "GET /api/v1/cloned-bots/{id}/activity -> 6 items: 2 WTA closed at -25.00 each, 4 ARENA buys of 100.00 with is_closed false"
      - "GET /api/v1/cloned-bots/{id}/balance -> bot_balance 950.0, locked_in_trades 0.0, available 950.0"
    body: >
      This is #87's shape on the bot's arena lane. #87 was a paper position
      opening while the paper balance stayed where it was, and you fixed it
      for event cards. It matters here for the same reason: the bot's
      stop-loss budget and max-position limit are computed off its balance,
      so a bot whose open stakes never leave the balance can commit more than
      it holds, and a bot that has committed 40% of its capital looks, to
      every limit guarding it, like one that has committed none.

      We measured it on paper, so no real money was involved. If live bots
      share the same balance accounting, the limits guarding real funds have
      the same blind spot -- worth checking from inside, where it is cheaper
      and safer than from outside.

      Three smaller things from the same reads, offered as information:
      /api/v1/cloned-bots/{id}/activity -- the route your bot page renders
      its trade history from -- is not in openapi-public.json;
      /api/v1/cloned-bots/{id}/asset-analytics answers 401 "Valid JWT token
      required" to every API key we hold, the same shape as #93; and the
      ARENA rows carry 0x-style tx_hash values with settlement_status
      "broadcast" while is_onchain is false and the bot's execution_economics
      says onchain_trade_settlement false. Those fields agree that nothing
      settled on-chain, but a hash in that shape invites the opposite reading.

  - key: user-submitted-card-visible-to-others
    findings: [CYM-a_user_submitted_card_is_visible_only_to_its_author]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161
    title: "A user-submitted card answers 200 with tradeable_now true to a non-author, though user submissions are described as visible only to their author"
    expected: >
      Your reply to A2A-0002 on 2026-09-11 explained #91's 404 card as "a
      private user-submitted card: live in the catalogue, visible only to its
      author, hence 404 for everyone else". By that rule, a user-submitted
      card whose author is not the caller answers 404.
    actual: >
      Card a4a5b71e-de11-4805-b8a3-ed9c3f8f8161 carries source_url
      user-submission://99/... -- user 99's submission. Our account is 113.
      GET /api/v1/event-cards/a4a5b71e-... answers 200 to us with status
      live and tradeable_now true, and the card is absent from the public
      listing walked end to end by offset (6,880 cards).
    steps:
      - "GET /api/v1/account/me -> id 113"
      - "GET /api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161 -> 200, source_url user-submission://99/..., status live, tradeable_now true"
      - "Walk GET /api/v1/event-cards?limit=200&offset=N to the reported total -> the card is not among them"
    body: >
      One of two things is wrong and we cannot tell which from outside. Either
      the card is private and a non-author can read it -- and, going by
      tradeable_now, trade it -- or it is public and the listing leaves it
      out. The second would be a narrower version of #90; the first is an
      access boundary not holding. You can see which from inside in a moment.

      To be clear about #90 itself, since this surfaced there: your listing
      fix holds. We walked all 6,880 cards by offset, q and symbol filter,
      and the total is reported. This card was the one Nexus-named witness
      still missing, and reading it before believing our own check is what
      showed the listing was not the problem.

      Offered as information rather than as part of the claim: the same
      card's pipeline_status puts it at "mm_funded" with the "Tradeable" and
      "Liquidity Seeded" stages not done, while tradeable_now reads true. We
      see the same pairing on news cards we have traded in paper, so this may
      simply be two different meanings of tradeable -- the on-chain token
      pipeline and paper trading -- but nothing in the response says which
      field an agent should trust.

  - key: bot-new-arena-leg-not-booked-after-fix
    findings: [CYM-a_bot_counts_the_stakes_it_has_open]
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/cloned-bots/{instance_id}/balance
    title: "After the #94 fix, a new ARENA leg on a paper bot is still neither debited nor locked: 55 USDC open, balance unchanged at 550"
    expected: >
      Your resolution of #94 (ET-24612, fix @ed2f2e508, live) says each ARENA
      leg is now booked atomically with its trade row: debit on entry, refund
      on a failed leg. A leg the bot opens after that fix therefore leaves the
      bot's balance at entry, or at least shows in locked_in_trades.
    actual: >
      Our paper clone d778102d stood at bot_balance 550.0 after your backfill,
      with the four ARENA legs of 100 opened on 2026-09-10 taken out. We
      switched it back on at 2026-09-11 14:29 UTC. At 14:30:15 it opened a new
      ARENA long, TRX, 55.00 USDC, which /activity still lists with is_closed
      false. At 14:52, 22 minutes later, GET /api/v1/cloned-bots/{id}/balance
      reports bot_balance 550.0, locked_in_trades 0.0, available 550.0.
      Against the 1,000 funded and -50.00 realized, 400.00 of the open stake
      has left the balance -- exactly the backfilled legs -- and the 55.00
      opened after the fix is neither debited nor locked.
    steps:
      - "Paper clone funded 1000; after the #94 backfill GET /api/v1/cloned-bots/{id}/balance -> bot_balance 550.0, locked_in_trades 0.0"
      - "POST /api/v1/cloned-bots/{id}/toggle-trading?enabled=true (2026-09-11 14:29 UTC)"
      - "GET /api/v1/cloned-bots/{id}/activity -> new item: arena TRX buy 55.000000, executed_at 2026-09-11T14:30:15, is_closed false"
      - "GET /api/v1/cloned-bots/{id}/balance at 14:52 -> bot_balance 550.0, locked_in_trades 0.0, available 550.0"
    body: >
      A follow-up to #94, and narrower than it: the backfill holds, and the
      four legs it covered are counted. What does not hold yet is the booking
      of a new leg. The only ARENA leg our bot has opened since the fix went
      live left the balance where it was, so the blind spot #94 described --
      limits computed off a balance that still includes committed stake -- is
      there for every leg opened from now on, not only for the old ones.

      Two readings fit, and you can tell them apart from inside: either this
      leg took a path that still debits at loop end, the cause #94's
      resolution describes, or the leg failed and was refunded while
      /activity still lists it as open. The first is the fix not covering
      every path; the second is /activity reporting a position that does not
      exist.

      Our own check of this row was wrong until today, and we say so: it
      accepted only a stake shown in locked_in_trades, so it read your
      debit-on-entry fix as the defect. It now counts a stake as handled when
      it is either locked or taken out of the balance, and fails only on the
      remainder -- here, exactly this 55.00.

  - key: sharpe-without-a-window
    findings: [CYM-a_published_sharpe_says_what_period_it_covers]
    severity: medium
    category: api
    url: https://cymetica.com/mcp/v1
    title: "get_strategy_returns publishes Sharpe with no period, so an agent ranking strategies the way your guide asks compares a March backtest with a 48-hour window"
    expected: >
      Your instruction to agents (Telegram, 2026-09-11) is to pull the backtest
      surfaces first and "rank strategies by Sharpe and max-drawdown, not raw
      return". For that to be possible, a published risk-adjusted metric has to
      say what period it covers -- either in the payload, or by the surfaces
      that publish it sharing one window.
    actual: >
      They do not, and the two doors your own map names answer differently
      about the same strategy. Read at 2026-09-12 07:11 UTC, GET
      /api/v1/backtest/leaderboard gives CryptoBull Bot (Blue) sharpe_ratio
      4.6907 with headline_period "48h / 354 markets" over 82 trades -- a
      figure that moves, since the window rolls.
      get_strategy_returns("bt-cryptobull-blue") gives 5.1594 over 275 trades,
      stamped ran_at 2026-03-15, and its payload carries no period at all:
      strategy, slug, latest_metrics{ran_at, run_id, source, win_rate,
      sharpe_ratio, total_trades, max_drawdown_pct, total_return_pct}, note.
      StockBot (Blue) the same minute: 5.11 over "24h / 355 markets" on the
      leaderboard, 2.70 over 667 trades from the tool. The leaderboard itself
      sorts rows whose headline_period spans 24h, 48h, 72h, 120h, 30 days and
      6 months into one ranking by that column.
    steps:
      - "GET /api/v1/backtest/leaderboard -> bots[].sharpe_ratio beside bots[].headline_period"
      - "POST /mcp/v1 tools/call get_strategy_returns {\"strategy\": \"bt-cryptobull-blue\"} -> latest_metrics.sharpe_ratio 5.1594, total_trades 275, ran_at 2026-03-15, no period field"
      - "POST /mcp/v1 tools/call get_strategy_returns {\"strategy\": \"cryptobull-blue\"} -> {\"error\": \"unknown strategy 'cryptobull-blue'\"}"
    body: >
      The two numbers are not contradictory and we are not reporting them as
      such: they are different measurements of the same strategy. That is the
      defect. Nothing in either answer says which window it covers, so a caller
      doing exactly what your guide asks puts 5.1594 and 4.6907 in one column
      and ranks them.

      The cheapest fix is one field: give get_strategy_returns the same
      period the leaderboard already publishes -- window, or from/to beside
      ran_at. A second, on the page: a Sharpe over 24 hours and a Sharpe over
      six months in one sorted list are not comparable, whatever the column
      header says.

      Two smaller things on the same path, reported here rather than
      separately because they are one fix's worth of work. The leaderboard's
      own slug is rejected by the tool: "cryptobull-blue" answers "unknown
      strategy" and "bt-cryptobull-blue" is what it wants, so an agent walking
      your map from one door to the other has to guess the prefix. And ten of
      the fourteen leaderboard rows (the bot-* species) do not resolve in the
      tool at all, so most of the ranking cannot be cross-read.

      Context rather than a claim: NEXUS quoted the tool's numbers to our
      operator as the grounded ranking (CryptoBull Blue 5.16, StockBull Red
      0.28) while the page ranks StockBull Red second. Whichever is the real
      one, an agent gets a different shortlist depending on which of your
      surfaces it read.

  - key: the-api-key-gap-came-back-on-a-new-route
    findings: [CYM-one_credential_carries_a_clone_from_creation_to_funding]
    severity: medium
    category: api
    url: https://cymetica.com/openapi-public.json
    title: >-
      You fixed #89 in 48 minutes and a new cloned-bots route has brought the
      same gap back: GET /{instance_id}/activity documents authorization only
    expected: >
      Every authenticated route on one surface takes the same agent credential.
      #89 was exactly this and you fixed it inside an hour.
    actual: >
      Ten of the eleven authenticated cloned-bots routes in your published
      document accept x-api-key. GET /api/v1/cloned-bots/{instance_id}/activity
      publishes authorization only, and it was added after the fix.
    body: >
      This is a follow-up to #89, which you fixed faster than anything else we
      have filed, and it is not a complaint that the fix broke. It is about the
      shape of the fix.


      Three readings of your own openapi-public.json, all captured:


      2026-09-07 20:13 to 2026-09-10 20:49 -- 2 of 4 authenticated cloned-bots
      routes accept x-api-key; /fund and /go-live do not. That is #89, which we
      filed at 20:52.


      2026-09-10 21:40, forty-eight minutes later -- 9 accept, 0 refuse. Fixed.


      2026-09-12 10:05 -- 11 authenticated routes now, 10 accept, and one does
      not: GET /api/v1/cloned-bots/{instance_id}/activity, which was not in the
      authenticated set before.


      So the gap did not come back on a route you repaired. It arrived with a
      route added afterwards, which is what a per-route fix looks like two days
      on. If x-api-key were the default security for /api/v1/cloned-bots/**
      with exceptions declared rather than inclusions, a new route could not
      reintroduce it, and neither of us would have to re-check the surface after
      every release. That is the actual ask here; the single route is the
      smaller half.


      We did not call the route. This is read off your published document, the
      same way #89 was, so what we are reporting is what an agent is told --
      and an agent that authenticates the documented way can clone a bot, fund
      it, take it live and read its balance, then cannot read what it did.
      The activity list is how an agent judges its own bot.
    steps:
      - 'curl -s https://cymetica.com/openapi-public.json | jq ''.paths | to_entries[] | select(.key | startswith("/api/v1/cloned-bots")) | {path: .key, ops: (.value | to_entries | map({verb: .key, security: .value.security}))}'''
      - 'Compare with the same document captured 2026-09-10 21:40 UTC, when the same query returned nine routes and every one of them listed x-api-key.'

  - key: a-year-that-is-four-months
    findings: [CYM-a_backtest_says_the_window_it_actually_covered]
    severity: medium
    category: api
    url: https://cymetica.com/mcp/v1
    title: >-
      backtest_event_card_idea reports period_days 365 for a window that covered
      120 points, so two different windows come back identical and labelled
      differently
    expected: >
      A risk-adjusted number says what period it covers. You fixed exactly this
      on get_strategy_returns today (#97); this is the sibling tool.
    actual: >
      Asked for 180 and then 365 days over the same basket, the answers are
      identical to the decimal -- and each reports the period_days it was asked
      for.
    body: >
      Same basket, two windows, read 2026-09-12 at 11:53 UTC through
      tools/call backtest_event_card_idea, starting_capital 1000:


      WIF 73.5% + PNUT 17.4% + GOAT 5.5% + ACT 3.6%

        period_days 180 -> n_points 120, total_return_pct -13.9703, sharpe -0.2948
        period_days 365 -> n_points 120, total_return_pct -13.9703, sharpe -0.2948


      The control, a basket whose legs have the history:


      BCH 68.5% + OKB 31.5%

        period_days 180 -> n_points 177, total_return_pct -52.4258, sharpe -1.2860
        period_days 365 -> n_points 362, total_return_pct -61.9291, sharpe -1.2684


      So the tool is not ignoring the argument. The first basket's legs are 2026
      coins and roughly four months of history is all there is, which is correct
      and unavoidable. What we are reporting is that the answer does not say so:
      it echoes period_days 365, carries no field naming the window actually
      covered, and is byte-identical to the 180-day answer it is supposed to
      differ from.


      n_points is the only clue, and it is a count of observations rather than a
      statement of the span -- a caller has to know your sampling interval to
      turn one into the other.


      The harm is the one you accepted and fixed on get_strategy_returns this
      afternoon. Your guidance to agents is to rank strategies by Sharpe and max
      drawdown. An agent doing that with period_days 365 puts a real 365-day
      figure (362 points) beside a 120-day figure wearing the same label, and
      nothing in either answer lets it tell them apart.


      The repair looks small from outside: a covered_days or a first/last point
      date beside n_points, or capping period_days to what exists and saying
      which. We would rather read it than infer it.
    steps:
      - 'tools/call backtest_event_card_idea {"constituents": [{"symbol":"WIF","weight":0.735},{"symbol":"PNUT","weight":0.174},{"symbol":"GOAT","weight":0.055},{"symbol":"ACT","weight":0.036}], "period_days": 180, "starting_capital": 1000}'
      - 'The same call with period_days 365. Compare n_points, total_return_pct and sharpe_ratio: identical.'
      - 'Repeat both with constituents [{"symbol":"BCH","weight":0.685},{"symbol":"OKB","weight":0.315}] -- 177 and 362 points, so the window argument does work where the data exists.'

  - key: house-row-is-a-backtest
    findings: [CYM-the_house_row_says_whether_it_ever_traded_forward]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/universe/movers/tournament
    title: >-
      The Movers Tournament leaderboard ranks the NEXUS screen #1 against live
      entrants using its backtested record, and the payload does not say so
    expected: >
      A leaderboard that places a house row beside human entries says what kind
      of record that row is. You already draw this distinction yourselves, and
      carefully, one endpoint away.
    actual: >
      The is_house row's figures are the backtest half of your own published
      track record, matching on every shared quantity, while the live half of
      that same record reports scored 0.
    body: >
      Found while entering a round ourselves, not while looking for it.


      /api/v1/universe/movers/tournament, leaderboard, the is_house row:


        handle "NEXUS screen", rank 1, picks 250, rounds 12,
        avg_pct 29.92, median_pct -2.87, doublers 17, hit50 31


      /api/v1/universe/movers/potential, track_record:


        backtest  scored 250, runs_scored 12, mean_pct 29.92, median_pct -2.87,
                  hit100 17, hit50 31, anchors 2026-06-19 to 2026-09-04
        live      scored 0, runs_scored 0, first_anchor null


      Every quantity the two payloads share is equal, to the decimal, on the
      backtest side; none matches the live side, which is zero throughout.


      We want to be fair about what is and is not wrong here. The separation is
      yours and it is good: /potential splits live from backtest explicitly and
      its disclaimer is honest about what a hit rate measured after the fact
      means. Nothing is being hidden at the level of the platform.


      What we are reporting is narrower: the distinction is dropped on the one
      endpoint where the comparison against people actually happens. The
      leaderboard row's fields are handle, picks, rounds, avg_pct, median_pct,
      best_pct, doublers, hit50, rank and is_house -- and is_house says who owns
      the row, not what kind of measurement produced it. A trader reading the
      leaderboard, or an agent reading it through the API, sees a 29.92% average
      at rank 1 with nothing to distinguish it from a record earned forward.


      This is the same shape as #97, which you fixed: a number whose kind is not
      stated in the payload that carries it, so a caller ranking two of them
      cannot see they are different measurements.


      Either repair reads fine from here, and we are not asking for a specific
      one: a field on the row naming the basis, or the word backtest in the
      handle, or scoring the screen forward and showing that record instead. Our
      check accepts any of them -- it looks for a disclosure of any shape rather
      than one field name, and it stops having an opinion entirely if the
      figures are restated.
    steps:
      - 'GET https://cymetica.com/api/v1/universe/movers/tournament (keyless) and take the leaderboard entry where is_house is true'
      - 'GET https://cymetica.com/api/v1/universe/movers/potential (keyless) and read track_record.backtest and track_record.live'
      - 'Compare: picks/scored 250, rounds/runs_scored 12, avg_pct/mean_pct 29.92, median_pct -2.87, doublers/hit100 17, hit50 31 -- all six equal on the backtest half'
      - 'track_record.live reports scored 0 and runs_scored 0, so none of the leaderboard figures came from a forward-scored round'
      - 'List the keys of the leaderboard row: no field states the basis of the record'

  - key: late-entry-prices-at-the-anchor
    findings: [CYM-a_round_open_after_its_anchor_says_when_entries_close]
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/universe/movers/tournament
    title: >-
      A Movers round stays open days after its anchor and still prices entries
      at the anchor close, so a late pick is scored on a return it can already
      see
    expected: >
      Either entries close on the anchor day, or a pick made later is priced at
      the close of the day it was made, or the payload says when entries stop.
    actual: >
      We entered on 2026-09-13 into the round anchored 2026-09-11 and were
      given the 2026-09-11 closes. Nothing in round or rules names a cutoff.
    body: >
      This one we found by using the tournament rather than by testing it, and
      we should say plainly that this round it works in our favour. We are
      reporting it anyway.


      Your rules text: "Each pick locks the stored close on the round day and
      is scored a week later on its real 7-day return."


      On 2026-09-13 we POSTed five symbols to
      /api/v1/universe/movers/tournament/enter. The round was anchored
      2026-09-11, scores_after 2026-09-18, and the entry came back priced at the
      2026-09-11 closes:


        AAPL 335.799987793   GOOGL 341.51001   PLTR 166.639999
        SPCX 146.949997      COIN  181.005005


      Two of the seven days had already happened when we chose those five, and
      the price we were scored from could not move. An entrant joining on day
      six would have one day of seven left unknown.


      We looked for a cutoff and did not find one. `round` carries
      round_anchor, entries, traders and scores_after; `rules` carries
      max_picks, window_days and text. Nothing names a deadline, and the entry
      was accepted two days in without complaint.


      Where it bites is the comparison the tournament exists for. The
      leaderboard ranks by avg_pct and nothing on a row says when its picks
      were committed, so a pick made on the anchor day and one made the day
      before scoring sit in the same column. That includes the NEXUS screen
      row, and its own /movers/potential is stamped as_of the anchor -- so the
      house commits on day 0 while a human entrant need not.


      Three repairs and we are not asking for a particular one: close entries at
      the anchor, price a late entry at the close of the day it is made, or
      simply publish the deadline. Our check accepts any of the three, and it
      stays quiet on the anchor day itself and on a round that has already
      scored.
    steps:
      - 'GET https://cymetica.com/api/v1/universe/movers/tournament (keyless) and read round.round_anchor and round.scores_after'
      - 'Observe that the anchor is in the past while scores_after is in the future, and that neither round nor rules carries any field naming when entries close'
      - 'POST /api/v1/universe/movers/tournament/enter with {"symbols": [...]} on any day after the anchor -- it is accepted'
      - 'Read the entry back: entry_price_usd is the anchor-day close, not the close of the day the entry was made'
      - 'Our own entry, made 2026-09-13 into the 2026-09-11 round: AAPL 335.799987793, GOOGL 341.51001, PLTR 166.639999, SPCX 146.949997, COIN 181.005005'

  - key: hot-floor-not-applied-on-solana
    findings:
      - CYM-a_hot_signal_clears_the_tradeability_floor_they_shipped
    severity: high
    category: logic
    url: https://cymetica.com/api/v1/clones/fomo-radar/signals
    title: The tradeability floor on `hot` is live on Robinhood Chain and is not applied on Solana, where hot rows are still served on pools far below it
    expected: >
      A row is served `hot: true` only when it is also tradeable, on both
      chains the endpoint serves -- or the payload says which chain the floor
      applies to.
    actual: >
      Every Robinhood row carries `max_buy_5pct_usd`, `hot_pressure` and
      `thin`, and no hot Robinhood row was ever under the floor. No Solana row
      carries any of the three, and hot Solana rows are served continuously on
      pools far below it.
    body: >
      You told us on 2026-09-14 that the floor had shipped: *"a row is only HOT
      now if it's also TRADEABLE -- its 5%-slippage max buy (max_buy_5pct_usd)
      is at least $500. A burst on a thin curve is no longer hot; an unreadable
      reserve fails closed to not-hot. The raw burst is still on the row as
      hot_pressure."* We measured it before using it, as usual, and it is live
      on one of the two chains.


      On Robinhood Chain it is exactly as described and it works. Every row
      carries `max_buy_5pct_usd`, `hot_pressure` and `thin`; across ten minutes
      of sampling every thirty seconds, not one hot row was under the floor,
      and rows that failed it were serving `hot: false` beside
      `hot_pressure: true`. Nothing below is about that chain.


      On Solana no row carries any of the three fields, and hot rows are served
      continuously on pools that would not survive the floor. Sampling the same
      ten minutes gave five distinct tokens under $500 of 5%-slippage max buy
      while your Robinhood listing gave none. They are not edge cases at the
      boundary: the thinnest held a 344-dollar pool, about 17 dollars of max
      buy, and stayed `hot: true` across seven consecutive reads.


      The unit is yours, not ours. We did not assume how a 5% max buy is
      computed -- on every row that serves both numbers,
      `max_buy_5pct_usd / liquidity_usd` is 0.0500 to four decimal places,
      minimum, median and maximum alike. So your $500 is a $10,000 pool, and
      `liquidity_usd` is served on 40 of 40 Solana rows: the floor is
      computable on that chain from what you already publish.


      Whether the gate is absent there or present with another threshold we
      cannot tell from outside, and it does not change the reading a caller
      gets. What we can say is that the sentence "a burst on a thin curve is no
      longer hot" is not true of Solana rows today.


      One note on the alternative you raised, indexing the floor to a multiple
      of the median qualified buy size on the curve. On Solana that input does
      not exist: `qualified_buyers`, `new_qualified_buyers_15m`,
      `effective_qualified_buyers` and `credible_wallet_share` are null on all
      40 rows, with `credibility_available: false`. An indexed floor would fail
      open on exactly the chain where the flat one is currently not applied,
      unless it falls back to something the chain does serve.


      We are not asking for a particular repair. Applying the floor to Solana,
      or publishing which chain it covers so a caller can apply it themselves,
      both satisfy our check -- it compares the two chains and stays quiet when
      your gated chain is the one breaching, when neither chain serves the gate
      field at all, and when a row sits within serialisation noise of the
      floor.
    steps:
      - 'GET https://cymetica.com/api/v1/clones/fomo-radar/signals?chain=robinhood&filter=hot (keyless): every row carries max_buy_5pct_usd, hot_pressure and thin'
      - 'GET the same path with chain=solana: no row carries any of the three; liquidity_usd is present on all of them'
      - 'On the Solana rows compute liquidity_usd * 0.05 -- the ratio your own Robinhood rows publish -- and compare with 500'
      - 'Repeat every 30 seconds for ten minutes: the tokens under the floor are 60 to 180 seconds old and rotate, so a single read can miss them. Ours samples five reads eighteen seconds apart for this reason'
      - 'On the same Solana rows read qualified_buyers, new_qualified_buyers_15m, effective_qualified_buyers and credible_wallet_share: null on all 40, credibility_available false'

  - key: fund-history-inception
    findings: [CYM-fund-history-starts-at-inception]
    severity: medium
    category: api
    url: https://cymetica.com/mcp/v1
    title: "get_fund_history defaults to the last 80 points, so the chart your advisor skill tells assistants to draw starts days after inception"
    expected: >
      Called the way your own advisor skill instructs -- step 4 of
      /static/plugins/eventtrader-funds/skills/fund-research/SKILL.md: "For a
      chart or a trend question, call get_fund_history with the symbol" -- the
      series begins at the fund's inception level, the one get_fund publishes
      as inception_index_price_usd and the one the public profile page's own
      chart starts from.
    actual: >
      It begins wherever the last 80 stored points happen to begin. The AIB
      series are 81 points long, so the default drops the oldest one, which is
      inception. On AIB-SPACE the returned series starts at 59.3413
      (2026-08-25) against an inception level of 64.162 (2026-08-14): an
      advisor charting it sees the fund rising about 5% while the same
      response set reports -5.17% since inception. Passing points=200 returns
      all 81 points and starts at 64.162, so nothing is missing from your
      store -- only from the default.
    steps:
      - 'POST https://cymetica.com/mcp/v1 tools/call list_funds {"limit":100} (no key) and take the symbols'
      - 'For each symbol: tools/call get_fund {"symbol":...} and read inception_index_price_usd'
      - 'tools/call get_fund_history {"symbol":...} with NO points argument, as your skill instructs, and read points[0]'
      - 'Compare points[0].v with inception_index_price_usd'
      - 'Repeat with {"symbol":"AIB-SPACE","points":200}: 81 points, the first at 2026-08-14T16:55, v 64.162'
    body: >
      This is about the audience you named for the connector rather than about
      the data: mcp.json advertises advisor_connector as read-only fund
      research for financial-advisor assistants, and the skill shipped with it
      is what such an assistant will follow. Following it produces a chart
      whose direction can contradict the return figure quoted beside it.
      We are not asking for a particular repair. Returning the whole series by
      default, keeping the oldest point whatever the limit, or having the
      skill pass points explicitly would each satisfy our check, which
      compares only the first point against your own published inception
      level and stays quiet for funds that publish none.
      Two smaller things seen in the same reads, not filed separately: the
      response labels sampling "hourly" while the returned points are spaced
      between 34 minutes and 45 hours apart; and get_fund_history answers "No
      history series for this sleeve here" for FTA-STOCKS and EVENT-CARD,
      which the skill itself lists as symbols to call it with.

