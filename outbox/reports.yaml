  - key: bb-message-log-cuts-bodies-at-8000
    findings: [CYM-the_message_log_carries_each_message_whole]
    severity: low
    category: api
    url: https://cymetica.com/api/v1/build-it-better/requests/ET-27671
    title: >-
      Build it Better request log silently cuts a message body at 8000
      characters: ET-27671's logged BB-SPEC ends mid-word
    expected: >
      A request's record (GET /api/v1/build-it-better/requests/{ticket}, the
      REST twin of the read-only MCP tool bb_get_request) publishes the
      conversation as `messages`. A logged BB-SPEC should be the spec that
      was sent, or say that it was shortened.
    actual: >
      On ET-27671 the latest logged BB-SPEC is exactly the first 8000
      characters of the record's own `spec_text`, and ends mid-word ("Typed
      OpenAPI schemas for all of i"). The rest -- the end of item 27, all of
      item 28, and the requester's BB-CHANGE amendment -- is only in
      `spec_text`. Nothing in the message says it was shortened, so a reader
      of the log concludes that the spec dropped two requirements and a
      change, which is what our own spec check concluded before we found
      `spec_text`. Two BB-SPEC messages on ET-26924 are also exactly 8000
      characters and end mid-word.
    steps:
      - 'GET https://cymetica.com/api/v1/build-it-better/requests/ET-27671 -> messages[kind=BB-SPEC] (latest): body length 8000; spec_text: length 9392 and begins with that body'
      - 'Same GET for ET-26924 -> two BB-SPEC bodies of exactly 8000 characters, each ending mid-word'
    body: >
      Low impact, easy to mislead: the log is the conversation an agent reads
      to find out what was agreed. Either store the whole body or mark the
      cut ("... [truncated, full spec in spec_text]"). Seen on the way, same
      surface, cosmetic: ET-26608's `spec_text` is re-rendered under the
      current app name, which rewrote the requester's own amendment into
      'Rename the request and the app from "Gem Screener" to "Gem
      Screener"'; the logged spec still has it as written.

  - key: gem-screener-pick-link-opens-another-token
    findings: [CYM-a_degen_pick_opens_the_coin_it_names]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/gem-screener/picks
    title: >-
      Gem Screener: the Degen pick "Definitive" (EDGE) links to ?coin=EDGE, and
      that opens a different token, edgeX
    expected: >
      A Degen pick's own link and its symbol route should open the coin the pick
      names. The picks route gives each pick a `detail_url`, and the coin route
      `GET /api/v1/gem-screener/coins/{symbol}` is how an agent or a shared link
      reaches it.
    actual: >
      `GET /api/v1/gem-screener/picks` lists "Definitive" (EDGE, market cap about
      $30M) with `detail_url` "https://cymetica.com/gem-screener?coin=EDGE".
      `GET /api/v1/gem-screener/coins/EDGE` and the page at that link both answer
      edgeX, a different token with a market cap of about $182M, which fails the
      very gates the pick passed (not vetted, business not growing) and shows
      Degen level 5 where Definitive shows 6. The card in the Top Picks tab opens
      Definitive correctly, so the page can tell them apart; the API route and
      the deep link cannot. Four tickers are shared by two apps each (EDGE, UP,
      MET, INDEX), and for each the symbol route answers one of the two: Definitive,
      Unlock Protocol, Metronome and Index Coop cannot be reached by ticker.
      The route does accept a slug (`/coins/definitive` answers Definitive), so the
      pick's link only needs to carry the slug.
    steps:
      - 'GET https://cymetica.com/api/v1/gem-screener/picks -> picks[symbol=EDGE]: name "Definitive", market_cap 30.3M, detail_url https://cymetica.com/gem-screener?coin=EDGE'
      - 'GET https://cymetica.com/api/v1/gem-screener/coins/EDGE -> name "edgeX", market_cap 182.3M'
      - 'GET https://cymetica.com/api/v1/gem-screener/coins/definitive -> name "Definitive": the same route reaches it by slug'
      - 'Open https://cymetica.com/gem-screener?coin=EDGE -> the detail panel is edgeX (Degen level 5/10)'
    body: >
      This matters for the exact reader the Degen picks are written for: someone
      follows the pick's link or their agent reads the pick and then fetches the
      coin by its ticker, and is shown another token's risk checks, liquidity and
      level. It is a link and a route, not the data, which is correct on both
      coins. Our check compares each pick with what its symbol opens, by name and
      market cap, so it clears as soon as the link carries the slug (or the route
      resolves by the pick's key). Everything else we compared on the page held
      up, which is why this one stands out: market cap, revenue and pool liquidity
      match CoinGecko, DefiLlama and DexScreener within a median of 1 %.

  - key: gem-screener-runrate-multiplier-is-not-the-one-stated
    findings: [CYM-the_runrate_uses_the_multipliers_its_page_states]
    severity: low
    category: documentation
    url: https://cymetica.com/gem-screener/app?view=apps
    title: >-
      Gem Screener: the run-rate says "last 30 days x 12" but every such row is
      30-day revenue x 12.1667 (x 365/30)
    expected: >
      The run-rate's own tooltip gives the three estimates as "last 30 days x 12",
      "last 90 days x 4" and "median of the last three months x 12". A row whose
      estimate is the 30-day one should carry 12 x its 30-day revenue.
    actual: >
      All 45 rows whose run-rate basis is "30d" carry exactly 12.1667 x `rev30d`
      (SKY: rev30d 12,995,681, run-rate 158,114,119, ratio 12.16667; SECZ 2,640,468
      -> 32,125,694; ORE 2,481,308 -> 30,189,247), which is 365/30, not 12 - the
      run-rate is 1.39 % above what the page says it is. Recomputed from
      DefiLlama's daily revenue, the 90-day basis does the same (x 365/90 = 4.0556
      where the page says x 4, LISTA and FXN) while the median basis really is 12
      x the median of the three latest 30-day windows (12 apps recomputed, all
      within 0.2 %). The
      difference flows into price/revenue and the upside: SKY shows P/S 11.521
      where market cap over 12 x revenue is 11.681.
    steps:
      - 'GET https://cymetica.com/gem-screener/app?view=apps -> the tooltip dictionary: 30d: "last 30 days x 12"; 90d: "last 90 days x 4"; med3: "median of the last three months x 12"'
      - 'snapshot-data: the 45 apps with runrate.basis "30d" all have runrate.value / rev30d = 12.1667 (none 12)'
      - 'snapshot-data SKY: ps 11.521 = mcap / runrate.value; mcap / (12 x rev30d) = 11.681'
    body: >
      It is small. The rest of what we recomputed from the snapshot's own inputs
      (price/revenue, earnings after emissions, the 30x test, slippage, the
      gates, a theme's edge over BTC) agrees on every row that carries them, and
      the calendar months and the 6-month growth regression agree with
      DefiLlama's daily revenue within about 1 % on the 12 apps we recomputed.
      Either the tooltip should say "x 365/30" (and "x 365/90")
      or the code should use 12 and 4; our check compares the multiplier the
      page states with the one on the 30-day rows, so it clears whichever way
      the two are made to agree.

  - key: chart-analyzer-score-does-not-average-what-it-marks-counted
    findings: [CYM-chart-analyzer-score-averages-what-it-counts]
    severity: low
    category: logic
    url: https://cymetica.com/api/v1/chart-analyzer/analyze?contract=0x63a72806098bd3d9520cc43356dd78afe5d386d9&chain=avalanche&timeframe=1d
    title: >-
      Chart Analyzer: a pattern confirmed twice is marked counted twice but
      averaged once, so chart_rate and the score disagree with the answer's
      own list
    expected: >
      Every analyze answer states its rule: "The score is the average success
      rate of the patterns confirmed in the last 10 candles". The same answer
      marks each pattern it found with `counted_in_score` and states the
      average it put on the scale as `chart_rate`. The average of the
      patterns marked counted should be that chart_rate.
    actual: >
      AAVE on avalanche (1d) marks three patterns counted_in_score: "20-bar
      breakout on volume" (0.4836, 2 bars ago) and "Bearish engulfing after a
      rise" (0.4694) at 4 and at 8 bars ago. chart_rate is 0.4765, the
      average of the two pattern types; the average of the three counted
      patterns is 0.4741, which is 56 on the answer's own scale against the
      57 served. In our run of 1 Oct (06:34 UTC) all 6 sampled Gem Screener
      coins whose counted patterns repeat one disagree the same way; the
      largest, 0xcf6bb5389c92bdda8a3747ddb454cb7a64626c63 on bsc, states
      chart_rate 0.5037 against 0.4946 for its six counted patterns, about
      72 against 67 on the scale. The Gem Screener batch
      (/api/v1/chart-analyzer/batch/gem-screener?timeframe=1d) lists the same
      three names for AAVE, the engulfing twice, as its counted_patterns
      beside the score of 57.
    steps:
      - 'GET https://cymetica.com/api/v1/chart-analyzer/analyze?contract=0x63a72806098bd3d9520cc43356dd78afe5d386d9&chain=avalanche&timeframe=1d -> patterns[] with counted_in_score true: breakout_volume 0.4836, bearish_engulfing 0.4694 (bars_ago 4), bearish_engulfing 0.4694 (bars_ago 8); chart_rate 0.4765; score 57'
      - '(0.4836 + 0.4694 + 0.4694) / 3 = 0.4741; on the answer''s scale (1 = 0.359, 50 = 0.4635, 100 = 0.5533) that is 56'
      - 'GET https://cymetica.com/api/v1/chart-analyzer/batch/gem-screener?timeframe=1d -> the same coin: score 57, counted_patterns ["20-bar breakout on volume", "Bearish engulfing after a rise", "Bearish engulfing after a rise"]'
    body: >
      It moves a score by up to five points in our sample, and it is the
      published arithmetic: the batch publishes the repeated name too.
      Either reading is defensible: count a pattern type once (then mark it
      counted once, and list it once in the batch), or count every
      confirmation (then average all of them). The rule text does not say
      which; saying so would settle it. Our check compares chart_rate with
      the average of what the same answer marks counted_in_score, so it
      clears whichever way the two are made to agree.

  - key: gem-screener-sectors-theme-priced-on-two-dates
    findings: [CYM-a_theme_is_priced_on_one_date]
    severity: high
    category: logic
    url: https://cymetica.com/gem-screener/app?view=sectors
    title: >-
      Gem Screener Sectors: when CoinGecko fails, one coin's live move multiplies
      a whole theme's 1M return (RWA +111.6 % where its weekly closes give about
      +56 %)
    expected: >
      Every coin of a basket is priced at the same moment: all with a live point,
      or none, falling back to the last weekly close for all of them. That is what
      the snapshot's own fetch_warnings says happened ("no live point: last weekly
      close").
    actual: >
      In snapshot 1790921065 (2026-10-02 06:04 UTC) fetch_warnings holds
      api.coingecko.com HTTP 403 and 429 for theme_prices.live, and
      theme_prices.live has a price for only 11 of 320 coins. RWA has 1 live member
      of 12 (zebec-network: last weekly close 0.0020492567, live 0.00277118, +35.2 %
      in four days), DePIN 1 of 15, L2 1 of 15, Privacy 6 of 15. The 1M returns
      shown are RWA +111.55 %, DePIN +96.26 % and Privacy +33.02 %; taking Zebec's
      factor of 1.3523 out of the published RWA and DePIN returns leaves +56.4 %
      and +45.1 %. The stage and the "Hot right now" line (RWA +52 %, DePIN +41 %
      against the median sector) are built on these returns. The page never shows
      the warning: its script reads fetch_warning_count nowhere.
    steps:
      - 'GET https://cymetica.com/api/v1/gem-screener -> fetch_warnings: two entries, source api.coingecko.com, http_status 403 and 429, affected includes "theme_prices.live"'
      - 'theme_prices.live has 11 keys (ycash, zama, zano, zcash, zclassic, zcoin, zebec-network, zencash, zephyr-protocol, zksync, zora); theme_prices.coins has 320'
      - 'themes[key=rwa]: 12 members, only zebec-network is in theme_prices.live; theme_4w 1.1155; (1 + 1.1155) / 1.3523 - 1 = 0.564, where 1.3523 = live 0.00277118 / last weekly close 0.0020492567 (stamp 1790553600)'
      - 'themes[key=depin]: 15 members, only zebec-network live; theme_4w 0.9626; (1 + 0.9626) / 1.3523 - 1 = 0.451'
    body: >
      This is a case that comes and goes with a partial fetch, so our check passes
      on any snapshot in which every theme is covered (all its coins, none of
      them, or at least 95 % of its weight) and watches for the next one; the
      figures above are from the one snapshot in which we saw it. It does not
      assume how you fix it: pricing every basket at the last weekly close when
      part of it has no live point, or retrying the live fetch, both clear it.
      Showing on the page that a source failed is the other half: today a reader
      cannot tell a 1M return built on 11 live coins from one built on all of them.

