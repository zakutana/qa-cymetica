  - key: clone-bet-labelled-stopped-when-it-ran-to-its-epoch-end
    findings:
      - CYM-paper-bot-bet-exit-reason-is-how-it-ended
    severity: low
    category: logic
    url: https://cymetica.com/api/v1/cloned-bots/31d18d91-14ae-4ebf-a2d3-b56db92ba6c8/activity
    title: >-
      Clone bot activity: the bet whose settlement trips take-profit or stop-loss is labelled
      exit_reason take_profit/stop_loss although it ran to its epoch's end (15 of 92 bets)
    expected: >
      exit_reason says how the trade ended. A 5-minute bet held to the end of its epoch and settled
      on the epoch's price reads like every other bet of that epoch (epoch_resolved, resolution_path
      epoch_close); the pause it caused is the bot's (auto_pause_reason, the stop_loss_triggered or
      take_profit_triggered event).
    actual: >
      Read on 2026-10-04 at 18:12 and 18:18 UTC over all 92 settled bets of our listed paper clones:
      15 bets closed at or after their epoch's end carry exit_reason take_profit or stop_loss; 12 of
      them have the same price_at_exit as a bet of the same epoch labelled epoch_resolved. Example:
      MACD Hunter clone 31d18d91, its only bet, a BTC YES of epoch 5970199 (ended 2026-10-03
      20:40:00), closed 20:40:05 at 84863.35 with exit_reason stop_loss and resolution_path null;
      the BTC bet of the same epoch on clone 1b81dff7 closed 20:40:06 at 84863.35 as epoch_resolved,
      epoch_close. The bot's stop_loss_triggered event came after the settlement. A reader of the
      feed is told a stop closed the bet early, and it did not.
    steps:
      - 'GET https://cymetica.com/api/v1/cloned-bots/31d18d91-14ae-4ebf-a2d3-b56db92ba6c8/activity -> epoch_id 5970199, epoch_end 20:40:00, closed_at 20:40:05, price_at_exit 84863.35, exit_reason stop_loss, resolution_path null'
      - 'GET https://cymetica.com/api/v1/cloned-bots/1b81dff7-8a27-4f9e-abd8-b3265f1a6244/activity -> the BTC bet of epoch 5970199: closed_at 20:40:06, price_at_exit 84863.35, exit_reason epoch_resolved, resolution_path epoch_close'
      - 'GET https://cymetica.com/api/v1/agents/instances/31d18d91-14ae-4ebf-a2d3-b56db92ba6c8/events -> stop_loss_triggered, pnl_pct -5.0, created 20:40:07'
    body: >
      How to fix it is yours: keep the bet's own exit reason and leave the pause reason on the bot.
      Our check reads every settled bet of our listed paper clones and fails while a bet closed at or
      after its epoch_end carries take_profit or stop_loss as its exit_reason.

  - key: clone-species-described-by-indicators-it-does-not-trade-on
    findings:
      - CYM-cloned-species-trades-its-described-strategy
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/cloned-bots/available
    title: >-
      Clone bots: 9 species are described by their indicators, but their clones' own
      live_decision_source decides on another bot's epoch rule (Bollinger Bandit clones bet on
      epoch-number parity)
    expected: >
      What a species says it does where it is chosen (GET /api/v1/cloned-bots/available, and llms.txt:
      "Cloned bot species are price-series indicator strategies") is what its clone decides its bets
      on; or the list says what the clone decides on.
    actual: >
      Read on 2026-10-04 at 18:12 and 18:18 UTC. On our paper clones (GET my-clones?mode=paper),
      live_decision_source has differs_from_display true for 9 wta species whose description names
      their indicators: Bollinger Bandit ("Exploits volatility expansions and contractions using
      Bollinger Bands") and ATR Alpha decide on STAT, "Epoch-number parity heuristic (streak
      continuation or reversion)"; Trend Titan ("Multi-timeframe trend follower using EMA ribbons and
      ADX") and Ichimoku Empress on SYNC, "Deterministic epoch-parity alternation (even epoch=YES,
      odd=NO)"; RSI Sniper, Stochastic Striker and Fibonacci Phoenix on DELTA, "Prior-epoch price
      swing - reverts big moves (>0.5%), follows small ones"; MACD Hunter ("Hunts for momentum shifts
      using MACD crossovers") and Volume Viper on CORR, "Prior-epoch direction (cross-market
      correlation)". Their bets' trade_rationale names that bot ("Stat Oracle takes YES on BTC" on
      a Bollinger Bandit clone). The clone's own page states "Live/PAPER decision source: ..." after
      cloning; the list a species is chosen from and llms.txt do not.
    steps:
      - 'GET https://cymetica.com/api/v1/cloned-bots/available -> wta_species, Bollinger Bandit: description "Exploits volatility expansions and contractions using Bollinger Bands. ...", primary_indicators Bollinger_Bands, Bollinger_%B, Bandwidth'
      - 'GET https://cymetica.com/api/v1/cloned-bots/my-clones?mode=paper (our key) -> the Bollinger Bandit clone 1b81dff7: live_decision_source {"strategy_symbol": "STAT", "label": "Epoch-number parity heuristic (streak continuation or reversion)", "differs_from_display": true}'
      - 'GET https://cymetica.com/api/v1/cloned-bots/1b81dff7-8a27-4f9e-abd8-b3265f1a6244/activity -> trade_rationale "Stat Oracle takes NO on ETH ..."'
      - 'GET https://cymetica.com/llms.txt -> "Cloned bot species are price-series indicator strategies and do NOT trade event cards."'
    body: >
      How to fix it is yours: either a clone decides on its species' strategy, or the species is
      described where it is chosen by what its clone will decide on. Someone choosing Bollinger
      Bandit for its Bollinger Bands gets bets placed on the parity of the epoch number. Not about
      whether any of these rules is good. Perceptron Oracle's clone carries no live_decision_source
      and is not counted. Our check reads our paper clones and the species list, and fails while a
      clone whose decision source differs from its display belongs to a species whose description
      names one of its own indicators.

  - key: backtest-leaderboard-ranked-on-synthetic-trades
    findings:
      - CYM-backtest-leaderboard-ranks-historical-trades
    severity: medium
    category: logic
    url: https://cymetica.com/backtest
    title: >-
      Backtest leaderboard: 10 of 16 bots (the top one +61.2% over 6 months) are ranked on trades
      all marked is_synthetic, priced 90-110 for every asset (BTC at 92.56), under "historical data"
    expected: >
      /backtest says "Backtest your AI trading strategies against historical data on EventTrader",
      and the leaderboard rows name their data_sources (polymarket, kalshi, eventtrader). A bot
      ranked there is ranked on trades at its assets' historical prices, or the leaderboard and
      page say the run is synthetic.
    actual: >
      Read on 2026-10-04 at 18:38 and 18:44 UTC. Of the 16 bots on GET /api/v1/backtest/leaderboard,
      the ten bot-* bots, including the top four (Multi-Indicator Ensemble 61.2%, Hybrid RSI ML
      52.8%, Gradient Boost Classifier 47.3%, Bollinger Breakout 41.5%, each over "6 months"), rest
      on 1,521 trades and all 1,521 carry is_synthetic: true on /api/v1/backtest/bots/{slug}/trades.
      Every entry price lies between 90.00 and 110.00 whatever the symbol: Trend Following SMA
      bought BTC on 2026-04-07 at 92.56, and TSLA, AAPL, ETH and SOL trade in the same band. Neither
      the leaderboard row nor the bot profile says synthetic. The page's trade table
      (backtest-ops.js) labels a row "LABS/SYNTHETIC" only when it has no entry and exit times and
      no prices, so these rows are drawn as ordinary trades.
    steps:
      - 'GET https://cymetica.com/backtest -> meta description "Backtest your AI trading strategies against historical data on EventTrader."'
      - 'GET https://cymetica.com/api/v1/backtest/leaderboard?limit=50 -> bots[0] bot-multi-indicator-ensemble, headline_return_pct 61.2, headline_period "6 months", data_sources ["polymarket", "kalshi", "eventtrader"]; no field says synthetic'
      - 'GET https://cymetica.com/api/v1/backtest/bots/bot-trend-following-sma/trades?limit=200 -> 67 trades, all is_synthetic true; {"entry_time": "2026-04-07T18:22:09", "symbol": "BTC", "entry_price": 92.56, "exit_price": 93.1613}'
      - 'The same for the other nine bot-* slugs: 1,521 of 1,521 trades is_synthetic, entry prices 90.00-110.00'
    body: >
      How to fix it is yours: run these backtests on the assets' historical prices, or say on the
      leaderboard, the profile and the page that the run is synthetic and what its return means.
      Someone ranking strategies by this board reads a synthetic run as a six-month backtest of BTC
      and TSLA. Not about whether any strategy is good, nor whether a headline follows from its
      trade list. Our check reads the page, the leaderboard and every listed bot's trade list,
      anonymously, and fails while a ranked bot's trades are marked synthetic and the page says its
      backtests run against historical data.

  - key: gem-screener-degen-meter-empty-on-every-row
    findings:
      - CYM-gem-screener-degen-meter-has-levels
    severity: medium
    category: logic
    url: https://cymetica.com/gem-screener/app?view=apps
    title: >-
      Gem Screener: the Degen meter is empty on every row (dlevel is null for all 232 apps and 33 chains
      in the published snapshot), and the page does not say why
    expected: >
