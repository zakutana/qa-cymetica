      (the page's degenMeter() reads row.dlevel.level), as it did on 2026-10-02 when dlevel_meta
      carried checks_run and nearly every row had a level. When a level cannot be computed, the
      page or the snapshot says so.
    actual: >
      Read on 2026-10-07. The snapshot generated 02:52 UTC (7 h old, its 6-hour refresh overdue and
      /api/v1/gem-screener/status still "refreshing": true) has "dlevel": null on all 232 apps and
      all 33 chains, "dlevel_meta": null, and the coin detail answers "degen_level": null. The
      seven gates did run: degen.n_ok is 8 of 232. Every row of the table shows the dash with
      dotted empty cells; the page's own aria-label is "Degen meter not available". The same
      snapshot carries CoinGecko 429 and DeFiLlama source warnings (fetch_warning_count 7), one of
      them naming coin_meta. No notice on the page or in the snapshot says the meter is off.
