  - key: usage-dynamic-card-tells-a-signed-in-user-to-log-in
    findings: [CYM-the_dynamic_plan_card_takes_a_cookie_session_as_signed_in]
    severity: medium
    category: logic
    url: https://cymetica.com/usage
    title: >-
      /usage: the Dynamic plan card tells a signed-in user "Log in to see your forecast and switch." because it
      decides signed-in from getAuthToken() alone, which is empty for a cookie session
    expected: >
      A signed-in user on /usage sees their 30-day forecast and the Switch to Dynamic control in the Dynamic
      plan card, as the usage card beside it shows their plan. The card decides "signed out" the way the rest of
      the page does: from the server's answer (a 401) or the page's session helpers (window.hasSession()).
    actual: >
      Seen on 2026-10-22 around 18:30 UTC in a signed-in browser session on /usage: the usage card drew the
      account's live data (plan Max 5x, session 0.650 of 5.00 units, week 4.34 of 30.00), while the Dynamic plan
      card (#nxd-body) read "Transaction fee 0.05% on top of measured cost · BRRR payments discounted · smallest
      BRRR buy $0.01" and "Log in to see your forecast and switch." In that tab window.getAuthToken() returned
      nothing, and fetch('/api/v1/nexus/dynamic', {credentials: 'same-origin'}) from the same page answered HTTP
      200 with the account's forecast (with_fee_usd "163.57" at that time). So the server knows the session; the
      card never asks it. Cause, read from the page as it is served to everyone: the card's inline script (the
      one with var API = '/api/v1/nexus/dynamic') runs load(), which does if (!tok()) { fetch('/api/v1/nexus/plans')
      ... 'Log in to see your forecast and switch.' ... return; } before it requests /api/v1/nexus/dynamic, and
      tok() is window.getAuthToken(), which reads only bearer tokens stored in localStorage / sessionStorage.
      auth.js removes those stored tokens whenever the et_session cookie is present, and the page's own head
      script says so ("Audit #20: the credential is an httpOnly cookie, so getAuthToken() is null for a
      perfectly valid session"). So with a cookie session the card always shows the signed-out text, and the
      Switch to Dynamic button, which is drawn only after that request, never appears. The usage card
      (/static/js/nexus-usage.js) requests with the cookie and treats a 401 as signed out, which is why it works.
    steps:
      - 'Sign in on https://cymetica.com (cookie session) and open https://cymetica.com/usage: the usage card shows the plan, the Dynamic plan card says "Log in to see your forecast and switch."'
      - 'In that tab: window.getAuthToken() -> null; fetch("/api/v1/nexus/dynamic", {credentials: "same-origin"}) -> HTTP 200 with forecast.with_fee_usd'
      - 'GET https://cymetica.com/usage -> the inline script with var API = ''/api/v1/nexus/dynamic'': function tok() returns window.getAuthToken(); function load(msg) { ... if (!tok()) { fetch(''/api/v1/nexus/plans'', ...) ... ''Log in to see your forecast and switch.'' ... return; } call(''GET'', '''') ... }'
      - 'GET https://cymetica.com/static/js/auth.js?v=20261021-1 -> the AuthManager constructor removes accessToken, access_token, auth_token, refreshToken and refresh_token from localStorage and sessionStorage when hasSessionCookie() (et_session) is true'
    body: >
      Every user signed in with the cookie session is told to log in on /usage and cannot see their Dynamic
      forecast or switch to Dynamic from the page. Deciding signed-out the way nexus-usage.js does (request
      /api/v1/nexus/dynamic with the cookie and treat a 401 as signed out), or adding window.hasSession() to the
      gate, would fix it. Our check reads the card's script on the live page: it fails while a gate that tests
      only a bearer token sends the card to its signed-out view without requesting /api/v1/nexus/dynamic or
      consulting the session, passes whichever way that gate is changed, and is inconclusive if the card or its
      script is gone. GET requests only.

  - key: airdrop-farmer-lists-farms-whose-token-trades
    findings: [CYM-airdrop_farmer_lists_no_farm_whose_token_trades]
    severity: medium
    category: logic
    url: https://cymetica.com/airdrop-farmer
    title: >-
      Airdrop Farmer: six farms in the list gated "No token live yet" have a token that already trades (Fables,
      Zircuit, Travala, Sonic SVM, INFINIT, Rivalz); chips come from name-matched headlines
    expected: >
      Every farm in GET /api/v1/airdrop-farm/farms passes the gate the same response publishes, whose first line is
      "No token live yet", as the page promises ("Every farm here passed the automatic checks"). A farm whose token
      is already out has had its airdrop: an agent farming it for a user farms nothing.
    actual: >
      Read on 2026-10-24 around 08:40 UTC: the list held 49 farms, and six of them have a token priced and traded
      that day, with 24-hour volume from CoinGecko /coins/markets (DexScreener for FABLES): Fables (FABLES on
      Robinhood Chain, about $253,000), Zircuit Staking (ZRC, about $398,000), and the Galxe task farms Travala.com
      (AVA, about $38 million), Sonic SVM (SONIC, about $2.1 million), INFINIT (IN, about $205 million) and Rivalz
      Network (RIZ, about $11,000). Cause, read in each row's own evidence array: the chips and the token test are
      fed by news headlines matched on the farm's name. Axis carries TOKEN CONFIRMED on "Axis Robotics price today,
      AXIS to USD live price" (a different project); Ink network carries TOKEN CONFIRMED on "Fire Country Musical
      Guest INK Brought Her Superfan Mom To Set" (a TV singer); Tempo network carries POINTS LIVE on "Tempo Guard
      Kiki Rice Named to 2026 WNBA All-Rookie Team - Toronto Tempo"; Fables carries POINTS LIVE on "Royal Fables
      Season 16 - The Heirloom Series". The same matches fill news.n7 and news.n30, which feed heat.
    steps:
      - 'curl -s https://cymetica.com/api/v1/airdrop-farm/farms -> gate[0] "No token live yet"; farms with id fables, zircuit-staking, task-travala, task-sonicsvm, task-infinit, task-rivalznetwork'
      - 'curl -s "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=zircuit,concierge-io,sonic-svm,infinit,rivalz-network" -> each with a current_price and total_volume'
      - 'curl -s https://api.dexscreener.com/latest/dex/pairs/robinhood/0xcce8dcf7c4dcfee6b6588db724240d9d6a22ee456f9387bb831c8fcea970869e -> FABLES/WETH with 24h volume and liquidity'
      - 'In the same /farms answer, the evidence array of axis, ink, tempo and fables: the headlines quoted above, under the chips TOKEN CONFIRMED / POINTS LIVE'
    body: >
      Users are offered farms whose airdrop already happened, under a gate that says it cannot happen, and the chips
      that tell them a token is coming or points are live are drawn from unrelated news. Checking each farm's token
      against a market source (a CoinGecko id or a DEX pair) before it is listed, and matching news on the project's
      own handle or domain rather than its bare name, would fix both. Our check reads the farms list and the six
      tokens' markets: it fails while any of these six is listed with a token that traded at least $5,000 in 24
      hours, finds a renamed row by its id, name or page, passes once they are gone (or their token stops trading),
      and is inconclusive if the list or a market cannot be read or the gate no longer promises tokenless farms. GET
      requests only.

  - key: traffic-agent-visits-are-not-the-agents-requests-by-area
    findings: [CYM-traffic-agent-visits-are-the-agents-requests]
    severity: low
    category: logic
    url: https://cymetica.com/traffic
    title: >-
      /traffic: "AI-agent visits" and the AI agents' requests by area are both defined as every request an agent
      makes, but over the same 14 days they read 115,550 and 89,910
    expected: >
      On https://cymetica.com/traffic the tile "AI-agent visits" (filled from GET /api/v1/traffic/public ->
      ai_agents.total) is defined in the AI Agents panel as "Visits = every request an agent makes (one crawler
      reading 300 pages is 300 visits)". The list "AI agents requests" under "What visitors do" (GET
      /api/v1/traffic/activity -> requests.ai_agent.range, shown when "Selected range" is chosen) is defined as
      "Every request, landings AND the pages and API calls after them, grouped by product area", and it ends in
      an "Everything else" row, so it is the whole and not a top ten. Over the same range the list adds up to the
      tile, or the page says what one of the two leaves out.
    actual: >
      Read on 2026-10-25 at 23:50 UTC, both endpoints with days=14 and the same since (2026-10-11T07:00:00+00:00):
      ai_agents.total is 115,550, and the 11 rows of requests.ai_agent.range, the last one "Everything else", add
      up to 89,910. 25,640 agent requests (22 %) are in the tile and in no area of the list. An earlier read the
      same evening (23:17 UTC, the two endpoints generated four seconds apart) gave 115,359 against 89,770 at
      days=14, 67,113 against 59,030 at days=7 (12 %) and 195,354 against 133,871 at days=30 (31 %). The gap
      grows with the older days (September 25 to October 10 alone: 79,995 against 44,101), so it is not the few
      minutes the two caches can lie apart.
    steps:
      - 'GET https://cymetica.com/traffic -> the tile <div class="v" id="k-agents"> labelled "AI-agent visits"; the paragraph "<strong>Visits</strong> = every request an agent makes (one crawler reading 300 pages is 300 visits)."; above <ul id="tl-do-agent">, the paragraph "Every request, landings AND the pages and API calls after them, grouped by product area."'
      - 'GET https://cymetica.com/api/v1/traffic/public?days=14 -> since "2026-10-11T07:00:00+00:00", ai_agents.total 115550'
      - 'GET https://cymetica.com/api/v1/traffic/activity?days=14 -> since "2026-10-11T07:00:00+00:00", requests.ai_agent.range: 11 rows, the last "Everything else", whose requests add up to 89910'
    body: >
      A reader of the page gets two different counts of what the page says is the same thing, and cannot tell
      which one to believe. Making the two agree, or saying in either definition what it leaves out, would fix
      it. Low: a statistics page, nothing is exposed. Our check reads the page's two definitions and both
      endpoints at days=14. It fails while both definitions say every request without naming an exception and
      the totals differ by more than 2 %; it passes when they agree within 2 %, or when a definition names what
      it leaves out or stops claiming every request; it is inconclusive if a read fails, the two ranges differ,
      the snapshots were generated more than 30 minutes apart or the list has no remainder row. GET requests
      only.


  - key: event-cards-left-swipe-stamp-says-sell-but-skips
    findings: [CYM-event_cards_swipe_stamp_names_what_the_swipe_does]
    severity: low
    category: ui_ux
    url: https://cymetica.com/events
    title: "/events: dragging an Event Card left shows a red SELL stamp, but letting go only skips the card"
    expected: >
      The stamp that fades in while a card is dragged names what letting go will do. On
      https://cymetica.com/events a right drag shows BUY and a right swipe opens the Buy sheet, so that side is
      right. A left swipe skips the card (the keyboard hint on /events/{id} says "Skip" for the left arrow), so
      the left stamp names no trade, or a left swipe sells.
    actual: >
      Read on 2026-10-26 at 09:38 UTC. The deck script /events loads (event-cards.js?v=20261022-1) builds the
      left stamp with the class ec-stamp--skip and the text "SELL", fades it in while the card is dragged more
      than 20 px left, and on a release past the threshold runs animateSwipe(el, 'skip'), whose own comment says
      "left = skip (fly off)": the card leaves, the next card comes, no Sell sheet opens and nothing is sold. In a
      browser, signed out: held 40 px to the left, the red stamp read SELL across the card's top left corner, at
      1440 px and at 390 px alike (further left it slides off with the card's left edge, at 70 px only "LL"
      shows); held 220 px, its opacity was 1 and the card had ec-card--glow-skip; let go, the deck showed the
      next card and no sheet was open.
    steps:
      - 'Open https://cymetica.com/events, press on the top card and drag it about 40 px to the left without letting go -> a red stamp "SELL" fades in at the card''s top left corner'
      - 'Drag it past about 120 px and let go -> the card flies off and the next card shows; no Sell sheet opens and no order is placed'
      - 'GET https://cymetica.com/static/js/event-cards.js?v=20261022-1 -> skipLabel.className = ''ec-stamp ec-stamp--skip''; skipLabel.textContent = ''SELL''; ... } else if (curX < -20) { skipStamp.style.opacity = ratio; ... if (dir === ''right'') { animateSwipe(el, ''bull''); openBuySheet(card); } else { animateSwipe(el, ''skip''); }'
    body: >
      A trader who holds the card and drags it left to sell sees SELL on the card, lets go, and still holds the
      position; one who only meant to pass on the card is told they are selling. Changing the left stamp's text to
      SKIP (or an icon), or making a left swipe sell, would fix it. Low: nothing is traded by mistake, the label
      is wrong. Our check reads the script /events loads and fails while a stamp that names a trade shows on a
      side whose release neither makes that trade nor opens its sheet; it passes when the left stamp names no
      trade, when a left swipe sells or opens the Sell sheet, or when no stamp shows on a left drag; it is
      inconclusive if the page or the script cannot be read, or the stamps, the drag handler or the release
      cannot be found. GET requests only.

  - key: event-cards-past-their-close-stay-live
    findings: [CYM-a_card_past_its_close_is_not_live]
    severity: medium
    category: logic
    url: https://cymetica.com/events
    title: "Event Cards: six news cards whose contracts closed 6 to 10 weeks ago still read status live, and one is still tradeable"
    expected: >
      llms.txt: "A card is tradeable when status=live; trading_closes_at is null on open-ended cards (they trade until
      they resolve)". A card whose contract resolves at trading close (contract_spec.resolution_basis "trading_close")
      stops being live at its trading_closes_at, the same moment as its resolution_at_utc, and leaves the live list that
      /events deals its deck from. Your own answer on Telegram the same day: news cards leave the live list after 72
      hours.
    actual: >
      Read on 2026-10-26 at 13:40 UTC, all 647 cards of GET /api/v1/event-cards/ (limit 200, offset 0 to 600). Six news
      cards with resolution_basis "trading_close" closed between 15 August and 15 September and still read status "live":
      17ffc5da (Launch HN: Discovered Materials, closed 2026-08-15), 95a368ab (SK Hynix and SanDisk Climb 8%, 2026-08-16),
      ecffc892 (Moderna, Merck cancer vaccine, 2026-08-22), 8395df1f (Chinese automakers following Tesla's bet,
      2026-09-02), 65bd2864 (Utilities racing to link up with fusion startups, 2026-09-07) and e1de450c (SpaceX CFO sets
      timeline for orbital data centers, 2026-09-15). 95a368ab reads tradeable_now true with no trading_blocked_reason, 71
      days after its contract resolved. The other five read tradeable_now false, with the reason "This card's price is
      not currently available", never that trading has closed. All six sit in the live list at positions 503 to 616.
    steps:
      - 'GET https://cymetica.com/api/v1/event-cards/?limit=200&offset=600 -> cards[id=95a368ab-...]: status "live", trading_closes_at "2026-08-16T14:26:50", contract_spec.resolution_basis "trading_close", contract_spec.resolution_at_utc the same, tradeable_now true'
      - 'The same pages, offset 0 to 600 (total 647) -> five more cards with resolution_basis "trading_close", status "live" and trading_closes_at between 2026-08-15 and 2026-09-15'
      - 'GET https://cymetica.com/llms.txt -> "A card is tradeable when status=live"'
    body: >
      A contract that resolved weeks ago is still offered as live, and one of them can still be bought, at a price whose
      contract has already ended. Settling these cards (or closing them) when their trading_closes_at passes would fix
      it. Medium: a resolved contract is tradeable. Our check reads every page of the live list and fails while a live
      card's close (trading_closes_at, or resolution_at_utc on a "trading_close" contract) is more than 24 hours past; it
      passes when every such card is settled, closed or gone from the list, within a day of its close, or open-ended; it
      is inconclusive if the list cannot be read whole, is empty, or holds a close it cannot parse. GET requests only.

  - key: quant-search-rows-fit-the-list-grid
    findings: [CYM-quant-search-rows-fit-the-list-grid]
    severity: low
    category: ui_ux
    url: https://cymetica.com/company/app/experiments
    title: "Quant Lab search results (ET-32976): the model name and the reason are set in a 22 px column, one to three letters a line"
    expected: >
      A search result on /company/app/experiments reads like the bot list above it: the name of the model and
      market ("stockbull_blue · DOT") and the reason ("lost 3.09% on the held-back period (59 trades)") in the wide
      column, the return and the counts to the right.
    actual: >
      Read on 2026-10-27 at 14:30 UTC, signed in, at 1315 px (and on the owner's 1960 px screen): after a search with
      5 combinations checked on the held-back period, each of the 5 THROWN OUT rows draws its name cell 22 px wide, so
      "stockbull_blue · DOT" breaks into "st / oc / kb / ul / l_ / bl / ue / . / DO / T" and the reason into pieces
      of three characters, down the left of the card, while the return (-3.09%) sits 776 px to the right. Measured
      per row: the four cells are 22 px (name), 776 px (return), 70 px and 80 px. The cause is in the public files:
      xp.css lays every .qrow out as a grid of "22px minmax(0,1fr) 70px 80px 70px 70px 70px auto", made for the
      rank cell the bot list draws first (quantlab.js: <span class="rk">), and quantsearch.js draws the search row
      with no such cell (its first child is <div class="qn">), so the name lands in the 22 px track. The same
      grid under 760 px gives the name an 18 px track.
    steps:
      - 'GET https://cymetica.com/static/company/xp.css?v=6ae0a522 -> .qrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) 70px 80px 70px 70px 70px auto; ... }'
      - 'GET https://cymetica.com/static/company/quantlab.js?v=6ae0a522 -> the bot row: ''<div class="qrow ...">'' + ''<span class="rk">'' + ... + ''<div class="qn">'''
      - 'GET https://cymetica.com/static/company/quantsearch.js?v=6ae0a522 -> the search row: ''<div class="qrow ...">'' + ''<div class="qn">'' ... with no .rk cell'
      - 'Signed in with a Pro plan, open https://cymetica.com/company/app/experiments after a search -> getComputedStyle of #sres .qrow: grid-template-columns 22px 776px 70px 70px ..., the .qn cell 22 px wide'
    body: >
      A user who runs the search cannot read which model and market were thrown out or kept, or why, which is the
      result the search exists to show. Adding an empty <span class="rk"></span> as the first cell of the search row
      (or giving the search list its own grid) would fix it. Low: the return and the counts still show. Our check
      reads the page's public script and stylesheet and fails while a script draws a .qrow row whose first cell is
      not the rank cell, with the stylesheet's first track a fixed 22 px; it passes when every such row starts with
      the rank cell or the first track is no longer a narrow fixed one; it is inconclusive if the page, a script or
      the .qrow rule cannot be read, or no script draws a .qrow row. GET requests only.

