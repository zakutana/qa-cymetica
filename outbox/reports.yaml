    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?contract=0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984&chain=dogechain -> HTTP 500 INTERNAL_SERVER_ERROR'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?contract=0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984&chain=tron -> HTTP 500 INTERNAL_SERVER_ERROR'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?contract=0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984&chain=foo -> HTTP 500 INTERNAL_SERVER_ERROR'
    body: >
      Our check sends those three reads and fails while one answers anything but a documented
      answer (a 400 with one of the documented codes, or a 200 if you decide to read the
      chain). It uses UNI, a Gem Screener coin, because reading a contract the analyzer has
      not seen adds it to your public weekly ledger. So that the ledger's count does not
      surprise you: /ledger said 245 lines at 08:45 UTC and 251 at 09:25 UTC, and in between
      we read six contracts outside the Gem Screener once each (PEPE on ethereum and on base,
      BabyDoge on bsc, WIF on solana, 0x...dEaD on ethereum, UNI's address on bsc); all six
      answered status "unknown". We cannot see the lines, so we cannot confirm they are those
      six, but the count matches.

