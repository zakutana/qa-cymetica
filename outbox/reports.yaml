    url: https://cymetica.com/api/v1/bounty/a2a/send
    title: "The async a2a lane sends only its automatic first pass: the investigation the agent card promises in 1-10 minutes does not arrive"
    expected: >
      /.well-known/agent-card.json, communication_guide.async_endpoint:
      POST /api/v1/bounty/a2a/send is where "NEXUS investigates source code,
      DB, or on-chain state", with a response_time of "1-10 minutes", read
      back from GET /api/v1/bounty/a2a/inbox/{agent_id}. Every automatic
      first pass the lane sends says the same: "any deeper investigation
      reply is posted to this same inbox".
    actual: >
      For our newest five async messages, sent 2026-09-26 between 07:28 and
      09:38 UTC, the inbox holds only the automatic first pass
      (metadata.auto = true) -- no other reply paired to them by
      parent_message_id, after two to four hours. Since 24 Sep one of our
      ten async messages got more than the first pass. The first pass
      itself is often off-topic: a question about which build path to use
      received the Gem Screener product description.
    steps:
      - 'GET https://cymetica.com/.well-known/agent-card.json -> communication_guide.async_endpoint.response_time "1-10 minutes"'
      - 'POST https://cymetica.com/api/v1/bounty/a2a/send with a question (we sent five on 26 Sep, 07:28-09:38 UTC)'
      - 'GET https://cymetica.com/api/v1/bounty/a2a/inbox/expire76-qa?unread_only=false -> for each, one reply with metadata.auto=true, kind first_pass; nothing else with that parent_message_id an hour later'
    body: >
      Your team answered the same questions on Telegram, so nothing is lost
      for us. The report is about an agent that only has a2a, which the
      agent card tells to use exactly this lane: it gets the first pass and
      a promise that is not kept. Either the investigation step is not
      running, or its reply is not posted to the inbox. If answers are
      meant to come by another route, the card and the first-pass text
      should say so. Our check reads only the inbox and our own record of
      what we sent; it judges the newest five messages that are an hour
      old, allowing six times your ten minutes, so it goes green on the
      next five that get their reply.

  - key: bot-stop-loss-exceeds-its-budget
    findings: [CYM-a_bot_paused_by_its_stop_loss_lost_no_more_than_the_stop]
    severity: high
    category: logic
    url: https://cymetica.com/api/v1/cloned-bots/my-clones?mode=paper
    title: "A paper bot's stop-loss lets it lose twice the stop: 5% stop, 10% lost, pause event records -5%"
    expected: >
      The clone settings page (/clone/{id}, "Stop Loss %"): "Max capital
      drawdown from your resume baseline. Trading pauses when total P&L falls
      below this %, and each trade's stake is auto-capped so a single loss
      cannot exceed the remaining stop-loss budget." A bot with a 5% stop
      should not end a stop-loss pause more than about 5% down.
    actual: >
      Four paper clones we started on 28 Sep 07:28-07:32 UTC, 477 USDC each,
      all paused by stop_loss within minutes. Corr Catcher, Sent Surfer and
      Delta Hunter (stop 5%) each opened a BTC and an ETH position of 23.85
      at the same time, lost both stakes whole, and stand at -47.70, i.e.
      -10.0% of 477 -- twice the stop. Their own stop_loss_triggered events
      record pnl_pct -5.0 with threshold_pct 5.0, so the record understates
      the loss by half. Divergence Dragon (stop 6%) is down 9.7% (its event
      says -10.48). Each stake fit the remaining budget on its own; two
      opened together spent it twice.
    steps:
      - "GET /api/v1/cloned-bots/my-clones?mode=paper -> auto_pause_reason stop_loss, current_balance_usdc 429.30, total_profit_usdc -47.70 (Corr Catcher 5124b7be, Sent Surfer 17efa669, Delta Hunter 741a60e4)"
      - "GET /api/v1/agents/instances/{id}/events -> one trading_resumed, then stop_loss_triggered pnl_pct -5.0, threshold_pct 5.0"
      - "GET /api/v1/cloned-bots/{id}/asset-analytics -> BTC 1 trade, ETH 1 trade, each total_pnl -23.85 on total_volume 23.85"
      - "GET /api/v1/cloned-bots/{id}/profile -> settings.stop_loss_pct 5.0, max_position_pct 10.0, max_open_positions 5"
    body: >
      SCOPE: the stop-loss budget with more than one position open at once.
      Not the trailing profit floor or what happens after a pause, which
      your P2T2 forward test covered. All four are paper clones on their
      default settings, nothing changed by us. The cap works per stake but
      not across stakes that open together: with max_open_positions 5, a 5%
      stop can in principle be overrun five times. Either cap the combined
      open stake at the remaining budget, or say on the page that the stop
      is checked per trade. The pause event's pnl_pct should also carry the
      loss it actually paused at. Our check judges only bots that resumed
      once and hold no position, using your own threshold_pct and balances.

  - key: h2h-matchup-stuck-running-past-its-window
    findings: [CYM-a_matchup_past_its_window_does_not_read_running]
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/head-to-head/mine
    title: "Head-to-head matchups a day past their 3-day window still read running, scoreboard frozen at creation (0 trades)"
    expected: >
      A matchup created with days: 3 has result.window.end three days on.
      After that it should read finished (or settled), with a scoreboard
      as of the end of the window -- /head-to-head/mine is the only place an
      agent can read its matchups, since a private matchup's page and
      /api/v1/head-to-head/{slug} answer 404 to the API key.
    actual: >
      Ten matchups we created on 2026-09-24 19:10 UTC (days: 3, window.end
      2026-09-27 19:10) on 2026-09-28 still read status "running" and
      window.live true. Their result.window.as_of is the creation second
      itself, so every scoreboard shows 0 trades on each side and verdict
      "insufficient" -- while the same bots' my-clones rows read 4 to 8
      trades executed and all four surviving bots paused on take-profit
      with +28 to +67 USDC.
    steps:
      - "GET /api/v1/head-to-head/mine -> e.g. slug h9zss19bgw (Stochastic Striker vs ATR Alpha): status running, window.end 2026-09-27T19:10:25, window.as_of 2026-09-24T19:10:25, original.trades 0, improved.trades 0"
      - "GET /api/v1/cloned-bots/my-clones?mode=paper -> Stochastic Striker trades_executed 7, total_profit_usdc +67.04; ATR Alpha 8 trades, +53.89"
      - "GET /api/v1/head-to-head/h9zss19bgw -> 404; GET /h2h/h9zss19bgw with the API key -> 404"
    body: >
      Two things, possibly one cause: the matchup never leaves running after
      its window, and the result stored in the list is the one computed at
      creation and never recomputed. If the page computes the scoreboard
      live on open, the API list should do the same, or at least carry
      as_of and status that say it is stale. Our check reads only our own
      matchups and judges only those an hour past their window end.

  - key: bb-sla-missed-recurred-on-et-27671
    findings: [CYM-a_build_ships_inside_the_24_hours_it_publishes]
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/build-it-better/requests/ET-27671
    title: >-
      Follow-up on #112: Build it Better's 24-hour deadline missed again, this
      time on ET-27671 (Gem Screener) -- 19.8h overdue, stage building,
      nothing shipped
    expected: >
      #112 (ET-26036) paid: a request should ship inside the 24 hours the
      product publishes for it, from clock_started_at to deadline_at, or the
      deadline should say something else. That promise, not one ticket, is
      what the check reads.
    actual: >
      ET-27671 (Gem Screener, our own follow-up request to the already-shipped
      ET-26608) started its clock at 2026-09-26T19:08:09.811Z with deadline_at
      2026-09-27T19:08:09.811Z. The funding gate is honoured correctly this
      time -- waived true, waived_at equal to clock_started_at, so this is not
      #108 again. At the read behind this report (elapsed_seconds 157634,
      about 43.8h after the clock started, 19.8h past deadline_at) the record
      still shows stage "building", queue_status "building", ready_to_build
      true, our_url null, resolved_at null, verdict null and on_time false.
      Nothing has shipped.
    steps:
      - 'GET https://cymetica.com/api/v1/build-it-better/requests -> item ET-27671: clock_started_at 2026-09-26T19:08:09.811386+00:00, deadline_at 2026-09-27T19:08:09.811386+00:00, elapsed_seconds 157634, stage "building", queue_status "building", our_url null, resolved_at null, verdict null, on_time false'
      - 'Same response: funding.waived true, funding.waived_at 2026-09-26T19:08:09.811386+00:00 (equal to clock_started_at), funding.funded false, funding.raised_usd 0.0 -- the gate opened when the clock started, not #108'
    body: >
      This is the same promise #112 was paid for, breached again on a
      different ticket -- so the fix that closed #112 addressed that request
      and not the SLA itself. Our check reads every request on the board and
      only counts one that is past its own published deadline with nothing
      shipped, so it would clear the moment ET-27671 ships or its deadline is
      corrected.
      Cymetica's own Telegram answer today (ref ET-27671, the same message
      that confirmed the board-stage bug ET-28090 was fixed) already says
      "it is still in progress ... it moves to Shipped with a BB-SHIPPED post
      when the build is done" -- so this is not new information to you. It is
      filed anyway because the tracker, not a chat thread, is the record we
      hold #112 against, and the same clock is still the one the page
      publishes to a stranger who has not seen that message.

  - key: async-a2a-off-topic-first-pass-recurred-a2a-0019
    findings: [CYM-async-a2a-investigation-arrives]
    severity: low
    category: api
    url: https://cymetica.com/api/v1/bounty/a2a/send
    title: >-
      Follow-up on #132 (ET-27609): a2a first pass is off-topic again and no
      investigation arrived -- A2A-0019, 42+ hours, no reply beyond the
      automatic first pass
    expected: >
      #132's fix (e2d47716c, 71736a04e, 28fbd3191, shipped 2026-09-26) makes
      every a2a question start a NEXUS deep investigation whose answer, or a
      did-not-run note, is posted to the same inbox -- and, when deep runs are
      at capacity, the first pass itself should say so rather than promise
      1-10 minutes.
    actual: >
      A2A-0019, sent 2026-09-26T20:45:00Z (nearly 8 hours after the fix
      shipped, so not a pre-fix message), asked five numbered questions about
      a fund's redemption reserve. Its only reply, 6 seconds later, is the
      automatic first pass -- and its text is not about the question at all:
      a list of Telegram group links ("Everywhere you can find us"). No
      capacity note, no deeper reply, nothing else paired to it by
      parent_message_id in the 42+ hours since. Among our five newest due
      async messages at this read, A2A-0019 is the one still missing an
      investigation reply within the check's one-hour allowance (six times
      the card's own ten minutes).
    steps:
      - 'POST https://cymetica.com/api/v1/bounty/a2a/send at 2026-09-26T20:45:00Z, accepted (via a2a_b4eaa665ec784af6)'
      - 'GET https://cymetica.com/api/v1/bounty/a2a/inbox/expire76-qa?unread_only=false -> one reply to a2a_b4eaa665ec784af6, kind first_pass, auto=true, text begins "Everywhere you can find us: Telegram main group ..."; nothing else paired to it since'
    body: >
      Not disputing that #132 changed something -- four of our five newest
      due messages got paired beyond the first pass this time, which is new
      since the original report. This one is narrower: the fix's own stated
      fallback ("the first pass ... say so instead of promising 10 min" when
      at capacity) is not what A2A-0019 got. It got a reply that answers none
      of the five questions and names no capacity limit, on a topic (a fund's
      segregated reserve) the platform can presumably speak to. Whatever the
      cause -- a routing miss on this message, or the deep step silently
      dropping it -- the inbox is the only record an a2a-only agent has, and
      it currently shows the same shape #132 was filed for, on one message
      out of five. Our check reads only the newest five due messages, so a
      reply here clears it.

