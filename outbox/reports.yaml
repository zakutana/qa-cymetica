  - key: supply-analyzer-pile-shrinks-past-all-of-it
    findings:
      - CYM-supply-analyzer-a-pile-cannot-shrink-more-than-all-of-it
    severity: medium
    category: logic
    url: https://cymetica.com/supply-analyzer?symbol=stonkfun
    title: >-
      Supply Analyzer: STONK's sellable pile is shown changing -130% to -114% a year, and its curve keeps
      buying back 86.2M a month after the pile is empty (1.03B bought back by Oct 2027, max supply 1B)
    expected: >
      A sellable pile can lose at most all of it. The hero, "Yearly change of the sellable pile", is
      never below -100%, and the 24-month curve takes nothing out of a pile that holds nothing: what
      goes out in a month is at most what the pile holds plus what comes in that month, so the
      bought-back slice never holds more tokens than exist.
    actual: >
      Read on 2026-10-08 between 05:27 and 05:46 UTC (batch as_of 05:27, record refreshed 00:53).
      StonkFun (STONK) is the only one of 245 rows with a yearly figure below -100% (the next is
      PONS at -47.37): status "range", yearly_pct -114.31, yearly_range [-129.65, -114.31], which
      the page prints as "-130% to -114%" "a year". The arithmetic follows /definitions ("The yearly
      change = (in - out) x 12 / the pile, in %"): (10,199,876 typical inflow - 86,217,494 buyback)
      x 12 / 797,998,322 = -114.31%, and -129.65% with no inflow. The buyback input matches its
      source: DeFiLlama's holders' revenue for StonkFun, $14,438,154 in 30 days at $0.167462
      (DeFiLlama showed $13,917,445 at our read). But the record's own months empty the pile in
      11 months: in Aug 2027 the curve takes out 86,217,494 while the pile holds 37,822,138 and
      10,199,876 comes in, and from Sep 2027, with the pile at 0, it keeps taking out 86,217,494 a
      month (14 months take out more than there is, Aug 2027 to Sep 2028). "Bought back, kept"
      grows to 1,034,609,929 in Oct 2027, above the
      1,000,000,000 max supply, and keeps growing. The same rate on later months of the slider
      reads -801.31% a year in Jul 2027 and -2,411.85% in Aug 2027. The pressure number is not
      affected (10, the top of its scale).
    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/batch/gem-screener -> items[token.slug=stonkfun]: status "range", yearly_pct -114.31, yearly_range [-129.65, -114.31], pile_today 797998321.98, pile_24m 0.0 from index 11 (Sep 2027); no other row is below -47.37'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/definitions -> "The yearly change = (in - out) x 12 / the pile, in %. It is the hero number."'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=stonkfun -> months[10] Aug 2027: pile 37822138.02, in.total 10199875.72, out.total 86217494.12; months[11] Sep 2027: pile 0.0, out.total 86217494.12, slices.bb_kept 948392435.3; months[12] Oct 2027: pile 0.0, slices.bb_kept 1034609929.42; max_supply 1000000000.0'
      - 'GET https://cymetica.com/static/js/supply-analyzer.js -> the hero prints yearly_range[0] "to" yearly_range[1] with "a year"; its tooltip is titled "Yearly change of the sellable pile"'
    body: >
      How to fix it is yours: stop the curve when the pile is empty (what goes out is at most what
      is there), and state a yearly change the pile can actually undergo, or say on the hero that
      the figure is a monthly rate times 12. A visitor reads "-114% a year" as more than the whole
      pile gone in a year, and the curve's pie as more tokens bought back than will ever exist. Not
      about whether StonkFun's buybacks are real or will continue. Our check reads the batch and
      /definitions, and the record of every row whose curve reaches 0, anonymously, and fails while
      a record states a yearly change below -100% (judged only while /definitions calls the hero
      "The yearly change") or a month of a curve takes out more than the pile holds plus what comes
      in. Every Supply Analyzer read names a Gem Screener coin, so none adds a line to your weekly
      ledger.

  - key: supply-analyzer-pile-grows-past-max-supply
    findings:
      - CYM-supply-analyzer-a-pile-cannot-grow-past-its-max-supply
    severity: medium
    category: logic
    url: https://cymetica.com/supply-analyzer?symbol=yearn
    title: >-
      Supply Analyzer: YFI's sellable pile is shown changing "0% to 15.1%" a year with 590 YFI (1.64%)
      left before its 36,666 max supply; 32 of 190 coins state a yearly growth past their max supply
    expected: >
      The hero, "Yearly change of the sellable pile", never states a growth the pile cannot undergo.
      In a year the pile can gain at most what lies between it and the max supply, which /definitions
      calls "a cap the market feed states"; the hero's own definition says what comes in "is at most
      what the reserve outside the pile still holds".
    actual: >
      Read on 2026-10-10 at 09:18 UTC (batch as_of 09:18:19). Yearn (YFI): status "range",
      yearly_range [0.0, 15.1], pile_today 36,075.94, reserve_today 590.06, max_supply 36,666, which
      the page prints as "0% to 15.1%". 15.1% of 36,075.94 is 5,447 YFI; 590.06 exist outside the
      pile. The record's own curve gains 454.02 in Oct 2026 and 136.04 in Nov 2026 and stands at
      36,666.0 from Dec 2026 on: +1.64% for the year. The hero is the first month times 12
      ((454.02 in - 0 out) x 12 / 36,075.94 = 15.1%), the inflow side of what #177 fixed for the
      outflow. Liquity (LQTY): yearly_range [0.38, 14.08], pile 98,840,059.58, max_supply and total
      supply 100,000,000, reserve 1,159,940.42 (1.17% of the pile); the top is the whole reserve
      times 12 (1,159,940.42 x 12 / 98,840,059.58 = 14.08%). Of the 190 records with a max supply,
      32 state a top above the room to it, among them SHROOM, INDEX, GROYP, SIS and LQ at 15.1%
      with 1.4% to 3.4% left, ETHFI at 20.51% with 3.59%, and AAVE at 15.53% with 3.66%.
    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/batch/gem-screener -> items[token.slug=yearn]: status "range", yearly_range [0.0, 15.1], pile_today 36075.94, reserve_today 590.06, max_supply 36666.0; 32 of the 190 rows with a max_supply have yearly_range[1] above 100 x (max_supply - pile_today) / pile_today'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=yearn&include_months=true -> months[0] Oct 2026: pile 36075.94, in.total 454.02; months[1] Nov 2026: in.total 136.04; months[2] Dec 2026: pile 36666.0, in.total 0.0; months[12]: pile 36666.0'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/definitions -> "The yearly change = (in - out) x 12 / the pile, in %. It is the hero number. ... what comes in ... is at most what the reserve outside the pile still holds"'
      - 'GET https://cymetica.com/static/js/supply-analyzer.js -> heroAt() prints yearly_range[0] "to" yearly_range[1]; the hero tooltip is titled "Yearly change of the sellable pile"'
    body: >
      How to fix it is yours: state a yearly change the pile can undergo (the curve already stops at
      the max supply), or say on the hero that the figure is a monthly rate times 12. A visitor reads
      "15.1% a year" for YFI as 5,447 new sellable YFI against a cap 590 away. Not about whether
      these tokens will vest or be emitted. Our check reads the batch and /definitions anonymously
      and fails while a record with a max supply states a yearly change above 100 x (max supply -
      pile) / pile (judged only while /definitions calls the hero "The yearly change"). Every
      Supply Analyzer read names a Gem Screener coin, so none adds a line to your weekly ledger.

  - key: gem-screener-runrate-counts-missing-days-as-zero
    findings:
      - CYM-a_runrate_states_only_the_days_its_revenue_has
    severity: low
    category: logic
    url: https://cymetica.com/gem-screener/app?view=apps&coin=kyberswap
    title: >-
      Gem Screener: KyberSwap's run-rate and P/S rest on 19 days of revenue summed as 30 (runrate
      cov30 30, sparse false; 11 days absent from DeFiLlama too); 4 of 233 apps
    expected: >
      A run-rate counts the days it has. runrate.cov30, the days of the last 30 the revenue rests on,
      matches the row's own daily series, and a 30-day window with days missing is marked sparse or
      annualised from the days present, not summed as if the missing days earned $0.
    actual: >
      Read on 2026-10-10 (snapshot generated 03:54:24 UTC). KyberSwap (KNC): rev_series ends
      2026-10-09 and holds 19 of the 30 days from 2026-09-10; absent are 12 to 20, 23 and 24
      September. DeFiLlama's daily revenue for kyberswap has no point on those 11 days either. runrate
      is {"value": 4599776.72, "basis": "30d", "cov30": 30, "sparse": false}; rev30d 378,063.84 is
      the sum of the 19 days present, 378,063.84 x 365 / 30 = 4,599,776.72, and ps 6.322 = mcap
      29,077,918 / 4,599,776.72. From the 19 days present the run-rate would be 378,063.84 / 19 x 365
      = 7,262,806 and P/S 4.00. The same on DeepBook (DEEP, 19 of 30, basis med3), Fulcrom (FUL, 24
      of 30, basis 30d) and Derive (DRV, 29 of 30, basis 90d), each with cov30 30 and sparse false.
    steps:
      - 'GET https://cymetica.com/api/v1/gem-screener -> apps[symbol=KNC]: rev_series has 19 daily points between 2026-09-10 and 2026-10-09 (none for 2026-09-12..20, 09-23, 09-24); runrate {"value": 4599776.72, "basis": "30d", "cov30": 30, "sparse": false}; rev30d 378063.84; mcap 29077918; ps 6.322'
      - 'GET https://api.llama.fi/summary/fees/kyberswap?dataType=dailyRevenue -> totalDataChart has no point for 2026-09-12 to 2026-09-20, 2026-09-23 or 2026-09-24'
    body: >
      How to fix it is yours: count cov30 as the days present and mark a window with gaps as sparse,
      or annualise from the days present. A visitor reads KyberSwap at 6.3x revenue where its own
      19 days of data say 4.0x. This is item 5 of ET-28597 (asked 2026-09-30); item 4 there is
      answered, the page now prints DeFiLlama's raw holders share beside the 100%. Our check reads
      /api/v1/gem-screener anonymously and fails while a row's runrate.cov30 is larger than the days
      its own rev_series holds in the 30 days ending at its last day. It passes the moment they agree.

  - key: event-card-index-moves-after-resolution
    findings:
      - CYM-a_settled_card_shows_its_index_at_resolution
    severity: medium
    category: logic
    url: https://cymetica.com/events/6fb50de3-c116-4c99-9295-903d09c6abf2
    title: >-
      Event cards: a settled card's index keeps moving after resolution; 6fb50de3 resolved at 100.42
      and shows 203.16 (+102%), the step 26 h after trading closed; 4 of 7 cards settled in 72 h
    expected: >
      Once a card resolves (contract_spec.resolution_at_utc, the same moment as trading_closes_at;
      methodology "last-tick", max_price_staleness "30s"), its index stops there: a settled card
      shows the index it had at resolution, and its index-history ends at that point.
    actual: >
      Read on 2026-10-10 at 10:45 UTC, the newest 50 settled cards, of which 7 resolved between 2 and
      72 hours earlier. 4 of the 7 show a current_index more than 0.5% from their last index-history
      point at or before resolution_at_utc, the history running on after it: 6fb50de3 ("KMM Group
      Expands Leadership ...") 100.42 at 2026-10-08 09:06 UTC, shown 203.16 (63 points after, the
      last 2026-10-09 16:11); ee01fadb, the same basket, 100.28 at 2026-10-08 13:48, shown 202.98 (59
      points after); f4bd9964 100.29 at 2026-10-08 10:38, shown 104.76 (27 points after); 29aa15ca
      103.39 at 2026-10-08 12:25, shown 107.25 (64 points after). In 6fb50de3's history the index
      reads 99.80 at 2026-10-09 11:28 and 203.23 at 11:59, 26 hours after trading closed. That step
      is one leg: TSGMY (23.6% of the basket), an OTC ADR whose quote sat at $66.00 with no volume
      on any day from 24 September to 7 October, then printed 200 ADRs at $355 on 8 October
      (Yahoo Finance daily bars), while the Tokyo shares it stands for (6101.T) closed at 5,710 yen
      on 5 October and 5,580 on 8 October. In a wider read of 25 settled cards earlier that morning,
      13 differed by more than 0.5%, among them 50c6fca6 (crypto legs only, 100.47 at resolution,
      93.13 shown, 182 points after).
    steps:
      - 'GET https://cymetica.com/api/v1/event-cards?status=settled&limit=50 -> cards[id=6fb50de3-c116-4c99-9295-903d09c6abf2]: status "settled", current_index 203.162223, index_base 100.0, contract_spec.resolution_at_utc "2026-10-08T09:06:53.220722+00:00", trading_closes_at the same'
      - 'GET https://cymetica.com/api/v1/event-cards/6fb50de3-c116-4c99-9295-903d09c6abf2/index-history -> points: 2026-10-08T08:59:33 index 100.42 (the last at or before resolution); 2026-10-09T11:28:40 99.80316; 2026-10-09T11:59:14 203.233801; last point 2026-10-09T16:11:31 203.162223'
      - 'GET https://cymetica.com/api/v1/event-cards/6fb50de3-c116-4c99-9295-903d09c6abf2 -> basket: XMTR 0.3669, PATK 0.2404, TSGMY 0.2362, HURC 0.0798, SSYS 0.0311, MTLS 0.0306, DDD 0.0135, VEEMF 0.0015, all asset_type "stock", venue "finnhub"'
    body: >
      How to fix it is yours: freeze a card's index at its resolution and show that figure once it is
      settled, or say which moment a settled card's index belongs to. A visitor reads 6fb50de3 as a
      card that doubled, where it resolved at +0.42%. Whether positions were paid on the figure at
      resolution or on the one shown is not visible to us; these four cards show no bull or bear
      notional. Separately, a basket leg quoted for two weeks without a trade (TSGMY at $66.00, no
      volume) can double a stock card on its first print; two cards on the same
      basket (46255539, 99f255da) resolved after that print and settled at 197.63 and 199.14. Our
      check reads the settled listing and each card's index-history anonymously and fails while a
      card settled 2 to 72 hours ago shows an index more than 0.5% from its last point at or before
      resolution_at_utc; cards resolved earlier are not judged again, so a fix shows within three days.

  - key: station-default-clob-tab-404
    findings:
      - CYM-the_station_opens_every_default_tab_for_its_default_symbol
    severity: low
    category: ui_ux
    url: https://cymetica.com/station?symbol=BTC&tabs=clob%2Cweekly%2Cnews%2Calerts
    title: >-
      Trading Station: the default BTC station opens its "Order book & trade" tab on /exchange/btc-pro,
      a 404, and its "Trade BTC on the CLOB" button goes there too; BTC is not a CLOB market
    expected: >
      /api/v1/station/apps says "A tab is any app already live on the platform; nothing gets a tab before
      it ships", and the page says "One symbol drives the chart and every tab around it". So every tab the
      station opens by default works for the symbol it opens with, and the "Trade {symbol} on the CLOB"
      button leads to a market that exists.
    actual: >
      Read on 2026-10-10 at 14:42 UTC. /api/v1/station/apps: default_symbol "BTC", default_tabs chart,
      clob, weekly, news, alerts; the clob app's url is "/exchange/{sym_lower}-pro". For BTC that is
      /exchange/btc-pro, which answers HTTP 404, and the tab shows "404 Page Not Found ... Let's get you
      back to trading" inside the station; the "Trade BTC on the CLOB" button links to the same address,
      and /exchange/btc redirects (301) there. /api/v1/exchange/markets lists 16 markets (ET10, BRRR,
      VAIX, SBIO, ... AIB-COMPUTE) and BTC is not one of them. This is the link posted on X
      (utm_source=x). For other symbols the same tab answered: ETH 200 (/exchange/eth-pro), and 404 for
      SOL, XRP, DOGE, NVDA and PEPE. The other four default tabs open for BTC.
    steps:
      - 'GET https://cymetica.com/api/v1/station/apps -> default_symbol "BTC", default_tabs ["chart","clob","weekly","news","alerts"], apps[id=clob].url "/exchange/{sym_lower}-pro", takes_symbol true; rule "A tab is any app already live on the platform; nothing gets a tab before it ships."'
      - 'GET https://cymetica.com/exchange/btc-pro -> HTTP 404, title "404 - Page Not Found | EventTrader"'
      - 'GET https://cymetica.com/exchange/btc -> HTTP 301 to /exchange/btc-pro'
      - 'GET https://cymetica.com/api/v1/exchange/markets -> 16 markets, none with symbol BTC'
    body: >
      How to fix it is yours: open the station on a symbol every default tab can serve, give the CLOB
      tab and the Trade button only to symbols that have a market (or say "no BTC market yet" in the
      tab), or list BTC/USDC. A visitor who follows the posted link sees a 404 in the first trading tab.
      Our check reads /api/v1/station/apps and each default tab's page for the default symbol
      anonymously, and fails while one of them answers outside 2xx. Not covered by it: the News tab
      for BTC (/headlines?q=BTC) also lists headlines on BNP Paribas, BTS and BTQ, a text match rather
      than the symbol.

  - key: gem-screener-dilution-caution-above-red
    findings:
      - CYM-the_dilution_caution_band_lies_below_the_red_band
    severity: low
    category: logic
    url: https://cymetica.com/gem-screener/app?view=picks
    title: >-
      Gem Screener: the dilution "caution" line (1.5253% a week) lies above the "red" line (1%), so no coin can
      read caution: 0 of 233 apps, 19 red (10 caution on 2026-10-02)
    expected: >
      Caution is the lower level of the two: a coin reads caution from a lower weekly dilution than it
      reads red, so the caution line is below the red line and both levels occur.
    actual: >
      Read on 2026-10-10 (snapshot generated 10:21 UTC). /api/v1/gem-screener, dilution_meta: gate_pct 1,
      caution_pts 0.5, red_pts 1, caution_line 1.5253, red_line 1, bench_week_pct 1.0253, levels
      {ok 97, caution 0, red 19, unknown 117}. The Stader coin panel's tooltip reads "New tokens in the next
      30 days at today's price, as a share of the market cap a week ... Caution above 1.5% a week, red above
      1%." Every app over 1% a week is red (the lowest red is 1.0054%, the highest ok is 0.981%), and the
      caution band between 1.0% and 1.5253% can never be reached, because red starts at 1%. The 1.5253 is
      the benchmark's 1.0253 plus the 0.5-point caution step; the red line is the gate, 1%, not the
      benchmark plus 1 point (2.0253). At ET-28821 (2026-10-02) 88 apps read ok, 10 caution and 19 red.
    steps:
      - 'GET https://cymetica.com/api/v1/gem-screener -> dilution_meta: gate_pct 1, caution_pts 0.5, red_pts 1, caution_line 1.5253, red_line 1, bench_week_pct 1.0253, levels {"ok":97,"caution":0,"red":19,"unknown":117}'
      - 'GET https://cymetica.com/api/v1/gem-screener -> apps[].dilution.level counted: ok 97 (week_pct 0 to 0.981), red 19 (1.0054 to 27.2604), caution 0'
      - 'GET https://cymetica.com/gem-screener/app?view=apps&coin=stader -> the "+0.3% new tokens a week" tile, its tooltip: "Caution above 1.5% a week, red above 1%."'
    body: >
      How to fix it is yours: put the caution line below the red line (for example 0.5% a week, red at 1%),
      or drop the caution level and say so in the tooltip. A visitor reads "Caution above 1.5%, red above
      1%" and cannot tell what a coin at 1.2% is. Our check reads dilution_meta anonymously and fails
      while caution_line is at or above red_line; it passes the moment caution is below red.

  - key: gem-screener-report-access-missing-from-openapi
    findings:
      - CYM-every_gem_screener_route_llms_txt_names_is_in_the_openapi
    severity: low
    category: documentation
    url: https://cymetica.com/openapi-public.json
    title: >-
      Documentation: GET /api/v1/gem-screener/report-access is in llms.txt but not in /openapi-public.json,
      which /api-docs is built from
    expected: >
      A route llms.txt documents is also in the OpenAPI document an agent reads from /api-docs, with its
      response described. Your reply on ET-28821 (point 4, 2026-10-10) says report-access "is in both
      llms.txt and the OpenAPI".
    actual: >
      Read on 2026-10-10 at 15:10 UTC. /llms.txt describes `GET /api/v1/gem-screener/report-access`
      ("may THIS caller ask for a Degen report? {can_ask, reason}"), and the route answers
      {"can_ask":false,"reason":"sign_in"} HTTP 200 anonymously. /openapi-public.json (340 paths) lists
      no path containing "report-access"; the other seven Gem Screener routes llms.txt names are in it
      (/api/v1/gem-screener, /altseason, /coins/{symbol}, /coins/{symbol}/degen-report, /picks, /ranked,
      /status). /openapi.json (23 paths) does not list it either.
    steps:
      - 'GET https://cymetica.com/llms.txt -> the Gem Screener line: "`GET /api/v1/gem-screener/report-access`: may THIS caller ask for a Degen report? {can_ask (true | false | null), reason (ok | sign_in | plan | unknown)}"'
      - 'GET https://cymetica.com/api/v1/gem-screener/report-access -> HTTP 200 {"can_ask":false,"reason":"sign_in"}'
      - 'GET https://cymetica.com/openapi-public.json -> paths: 340 entries, none ending in /report-access'
    body: >
      How to fix it is yours: add the route and its two response fields to the OpenAPI. Our check reads
      /llms.txt and /openapi-public.json anonymously and fails while a route under /api/v1/gem-screener
      that llms.txt names is missing from the OpenAPI.

  - key: account-history-offset-repeats-the-page
    findings:
      - CYM-the_account_history_pages_forward
    severity: medium
    category: api
    url: https://cymetica.com/transactions
    title: >-
      Account history: /api/v1/account/me/transactions answers the same 100 rows at every offset for
      currency=USDC (and unfiltered from offset 100); USDC history cannot be paged back
    expected: >
      The endpoint returns {transactions, has_more, total_count} and takes limit (at most 100, its own 422
      says so) and offset. When has_more is true, the next offset holds the next rows, so a client can read
      the whole history page by page, as it does for currency=ET10.
    actual: >
      Read on 2026-10-10 at 19:10 UTC with our own account's key. currency=USDC: offsets 0, 100 and 200
      answer the same 100 rows (ids 1613303830 to 371000858), with total_count 1000 and has_more true; an
      earlier read the same day saw the same page at offsets 0, 100, 200, 900, 1000 and 2000. No filter:
      offset 0 answers a first page (ids 81674124 to 1392891235), and offsets 100 and 200 both answer that
      same USDC page (total_count 4710). currency=ET10 pages forward (653 rows, three different pages). Only
      from_date and to_date reach older USDC rows. The endpoint, which the Transaction History page reads, is
      in none of llms.txt, llms-full.txt, openapi.json or openapi-public.json, so neither paging nor the date
      filters are documented.
    steps:
      - 'GET https://cymetica.com/api/v1/account/me/transactions?currency=USDC&limit=100&offset=0 (X-API-Key) -> 100 rows, first id 1613303830, last 371000858, has_more true, total_count 1000'
      - 'GET https://cymetica.com/api/v1/account/me/transactions?currency=USDC&limit=100&offset=100 -> the same 100 rows (and the same at offset 200)'
      - 'GET https://cymetica.com/api/v1/account/me/transactions?limit=100&offset=100 and offset=200 -> the same 100 rows both times, total_count 4710'
      - 'GET https://cymetica.com/api/v1/account/me/transactions?currency=ET10&limit=100&offset=100 -> a different page (first id 61463805): ET10 pages forward'
    body: >
      How to fix it is yours: honour offset for every currency filter (or return a cursor), and document the
      endpoint with limit, offset, currency, from_date and to_date. We found it reconciling our own ET10
      purchases, where the USDC side of each purchase could only be read by date windows. Our check reads the
      history with our own read key, GETs only, for no filter, USDC and ET10, offsets 0, 100 and 200, and fails while a page that says has_more is followed by the same page again or by none.

  - key: crypto-dashboard-supply-figures-contradict
    findings:
      - CYM-a_coins_supply_figures_can_all_be_true
    severity: medium
    category: api
    url: https://cymetica.com/crypto/hbar
    title: >-
      Crypto dashboards: HBAR prints "circulating supply 44.00B of 1.00B" and an FDV 44x under its market cap;
      IOTA, ICP, TAG have a max supply below their total, flags empty
    expected: >
      A dashboard states that "a number that failed a plausibility check is withheld, never guessed" (the
      crypto_dashboard tool description), and it does withhold: 10 of the 371 coins carry
      `stats.flags: ["circulating_supply"]` with `circulating_supply` null, each of them a coin whose derived
      circulating supply (market cap / price, `circulating_is_derived: true`) is above its max supply, or above
      its total supply when no max is published. So the figures a dashboard does publish can be true together:
      circulating not above max, total not above max, and the fully diluted value not below the market cap.
    actual: >
      Read on 2026-10-11 at 03:03 UTC (HBAR also at 02:50 and as text; the other coins twice, 20 seconds apart).
      GET /api/v1/crypto/hbar (market cap rank 38): max_supply 1,000,000,000, total_supply 50,000,000,000,
      circulating_supply 43,997,753,874 (derived), market_cap $4.06B, fdv $92.3M, pct_issued 1.0, flags []. The
      summary and /crypto/hbar.txt read "circulating supply 44.00B of 1.00B". CoinPaprika, which the dashboard
      names as its source, lists the same two figures for HBAR (max 1,000,000,000, total 50,000,000,000, no
      circulating supply), so the dashboard republishes them and builds on them. The same shape, flags empty:
      ICP (rank 58) circulating 557.4M and total 555.1M against a max of 469.2M, fdv $1.45B under a market cap of
      $1.72B; IOTA (rank 178) circulating 4.31B and total 4.83B against a max of 2.78B, fdv $142.8M under a market
      cap of $221.5M; TAG (rank 327) total 405.38B against a max of 400.00B. CHZ has ICP's relation (total 9.44B
      against a max of 8.89B, derived circulating 1.19x the max, as ICP's is 1.19x its max) and IS withheld
      (flags ["circulating_supply"], circulating null); HBAR, ICP and IOTA are not. Of the 140 largest coins by
      market cap, these 4 fail on both reads.
    steps:
      - 'GET https://cymetica.com/api/v1/crypto/hbar -> stats: max_supply 1000000000, total_supply 50000000000, circulating_supply 43997753874.0, circulating_is_derived true, market_cap 4.06e9, fdv 9.23e7, pct_issued 1.0, flags []'
      - 'GET https://cymetica.com/crypto/hbar.txt -> "... Market cap $4.06B; circulating supply 44.00B of 1.00B."'
      - 'GET https://api.coinpaprika.com/v1/tickers/hbar-hedera-hashgraph -> total_supply 50000000000, max_supply 1000000000, circulating_supply null (same for icp-internet-computer: total 555123004, max 469213710; miota-iota: total 4831556199, max 2779530283)'
      - 'GET https://cymetica.com/api/v1/crypto/icp and /iota -> flags [], fdv below market_cap (0.84x and 0.65x), circulating_supply above max_supply'
      - 'GET https://cymetica.com/api/v1/crypto/chz -> flags ["circulating_supply"], circulating_supply null, total_supply 9444481889 above max_supply 8888888888: the same relation, withheld'
    body: >
      How to fix it is yours: apply the check that withholds a circulating supply also to the max supply (a max
      below the total or the derived circulating supply is not a max), and leave fdv and pct_issued out when
      their base is withheld, since an FDV under the market cap cannot be true and pct_issued is capped at 1.0
      where the ratio is 44. Our check reads GET /api/v1/crypto and the dashboard of the 140 largest coins by
      market cap, anonymously, and fails while a coin with empty flags publishes a circulating or total supply
      more than 1% above its max supply, or an fdv more than 5% under its market cap, on two reads 20 seconds
      apart; it passes the moment those coins are withheld or consistent.

  - key: launchpad-token-list-without-a-chain-is-empty
    findings: [CYM-launchpad-tokens-without-a-chain-lists-launches]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/launchpad/onchain/tokens
    title: >-
      GET /launchpad/onchain/tokens without chain_id answers 200 [] while chain_id=5042 lists 518 launches;
      the screener and launchpad_list_tokens list both chains
    expected: >
      The schema declares chain_id on GET /api/v1/launchpad/onchain/tokens as anyOf [integer, null] with no
      default, and the developer page (/launchpad/robinhood/api) lists it among the query parameters of "List
      launches -- a JSON array of token rows". The screener on the same page has the identical chain_id
      declaration and answers without one with the launches of every chain, and so does the MCP twin
      launchpad_list_tokens. So the call that names no chain should return launches (any of them), or a 422 that
      names chain_id. A 200 with an empty array is the one answer that reads, to a caller with no reason to
      suspect a missing parameter, as "there are no launches".
    actual: >
      Read on 2026-10-11 between 05:30 and 06:00 UTC, anonymously, every variant at least twice. GET
      /api/v1/launchpad/onchain/tokens with no chain_id answers HTTP 200 with [] for the default call and for
      sort=volume, sort=graduating, limit=5, limit=200, offset=0 and include_internal=true. The same endpoint with
      chain_id=4663 returns 1 launch and with chain_id=5042 returns 518 (read in pages of 200). The unfiltered
      GET /api/v1/launchpad/onchain/screener?include_external=false&limit=500 returns 500 rows from both chains
      (499 on 5042, 1 on 4663), and launchpad_list_tokens with no arguments returns 25 rows (24 on 5042, 1 on
      4663). Our check reads the unfiltered list twice, 20 seconds apart, and counts it only when both reads are [].
    steps:
      - 'GET https://cymetica.com/api/v1/launchpad/onchain/tokens -> 200 []  (also ?sort=volume, ?sort=graduating, ?limit=5, ?limit=200, ?offset=0, ?include_internal=true)'
      - 'GET https://cymetica.com/api/v1/launchpad/onchain/tokens?chain_id=4663 -> 1 row (RUG)'
      - 'GET https://cymetica.com/api/v1/launchpad/onchain/tokens?chain_id=5042&limit=200&offset=0, 200, 400 -> 200, 200 and 118 rows'
      - 'GET https://cymetica.com/api/v1/launchpad/onchain/screener?include_external=false&limit=500 -> 500 rows, chains 5042 (499) and 4663 (1)'
      - 'MCP launchpad_list_tokens with {} -> 25 rows, chain_id 5042 (24) and 4663 (1)'
    body: >
      The Launchpad page itself always passes chain_id, so a person never sees this; an agent or script that
      follows the developer page and does not pass one gets an empty list. How to fix it is yours. One thing we
      noticed and cannot confirm from outside: launch/prepare documents "Default: the first enabled chain", and
      GET /api/v1/launchpad/onchain/config currently answers chains [] with 4663, 5042 and 5042002 all in
      paused_chain_ids, so if the list follows that convention the empty answer would be explained, but a paused
      chain asked for by number is still listed (the page does it), so the unfiltered call returning nothing is
      not what a paused chain should mean. A separate gap, not part of our check: paused_chain_ids is not
      described in openapi-public.json, llms.txt, llms-full.txt, /launchpad/robinhood/api or /launchpad/arc/api
      (we searched all five), while llms.txt ("Launch a token on Robinhood Chain for $0") and the
      launchpad_launch_token description offer launching without mentioning a pause; the Robinhood page says
      "Token launches on this chain are paused for now". We did not call the launch endpoints and do not know
      what they answer. Our check passes the moment the unfiltered call returns any row, or a 422.

