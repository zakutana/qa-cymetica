# The findings as they will be filed, grouped one report per fix.
#
# 16 findings become 8 reports because a report is a unit of WORK, not a unit
# of observation. Four disagreeing counts across four documents are one job --
# reconcile the published figures -- and filing them separately would put four
# tickets in front of someone who has to do one thing.
#
# `body` is editorial: the framing, the scope limit, the ask. Every NUMBER in
# the filed description is injected from state/findings.json at send time, so a
# figure can never go stale between measuring it and reporting it.
#
# severity uses THEIR enum: critical / high / medium / low / suggestion
# category uses THEIR enum: security / smart_contract / api / ui_ux / logic /
#                           performance / documentation / compatibility

reports:

  - key: anon-tool-surface
    findings: [CYM-anon-tool-surface]
    severity: high
    category: security
    url: https://cymetica.com/mcp/v1
    title: "MCP tools/list returns the full 46-tool set to unauthenticated callers, ignoring declared trust_tier"
    expected: >
      An unauthenticated tools/list returns only the tools mcp.json declares at
      trust_tier "unknown" (25 of them), consistent with llms.txt stating
      "anonymous = PUBLIC tools".
    actual: >
      It returns all 46. The response is byte-identical to the same call made
      with a TRUSTED-tier API key, so the credential makes no difference to the
      advertised surface.
    steps:
      - "POST https://cymetica.com/mcp/v1 with {\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"} and no X-API-Key header"
      - "Count result.tools -> 46"
      - "Repeat with a TRUSTED X-API-Key header -> 46, identical set"
      - "GET /.well-known/mcp.json, count tools where trust_tier == 'unknown' -> 25"
    body: >
      SCOPE, stated up front: this establishes the ADVERTISED surface only. I
      have not called any of these tools without a key, so it does not show
      that an unauthenticated tools/call on place_order or create_aib_fund
      succeeds. Those are two different defects with very different severity
      and I am not merging them. If the listing is intentional and the
      enforcement happens at call time, say so and I will record it as a
      documentation defect instead of a security one.
      INVARIANT worth adding either way: a test asserting that the anonymous
      tools/list set equals the set declared trust_tier "unknown" in mcp.json,
      so the two cannot drift apart again silently.

  - key: hunter-attribution
    findings: [CYM-bounty-filing-unauthenticated]
    severity: high
    category: security
    url: https://cymetica.com/api/v1/bounty/reports
    title: "Bounty hunter attribution is spoofable: wallet_address binds the profile but is public and unauthenticated"
    expected: >
      A report can only be attributed to a hunter profile by someone able to
      prove control of that profile.
    actual: >
      Per ET-21999, the profile is keyed to wallet_address and hunter_name is an
      optional label. Wallet addresses are returned publicly by
      GET /api/v1/bounty/reports, and POST /api/v1/bounty/reports has no
      credential mechanism. Anyone who reads the tracker can therefore file
      reports that accrue to another hunter's profile.
    steps:
      - "GET https://cymetica.com/api/v1/bounty/reports and read wallet_address off any existing report"
      - "POST /api/v1/bounty/reports with a valid title, description and severity_reported, plus that wallet_address, and no credential of any kind"
    body: >
      SCOPE: I did NOT complete step 2. A probe carrying a valid title and
      description was stopped only by a deliberately invalid severity enum,
      which shows format validation is the sole remaining gate -- it does not
      prove acceptance, and proving it would mean creating a real record under
      someone else's wallet. I am not willing to do that to make a point.
      Rewards still route to the wallet owner, so this is not theft. The
      realistic harm is the other direction: a third party can pad or pollute a
      hunter's profile, and valid-report ratio is what the leaderboard ranks on.
      SUGGESTED FIX: require a signature over the report payload from the
      wallet's key, or bind submissions to the API key that already exists
      elsewhere on the platform.

  - key: agent-names
    findings: [CYM-agent_names]
    severity: high
    category: documentation
    url: https://cymetica.com/llms.txt
    title: "llms.txt tells agents to clone 10 named trading agents; none of the 10 symbols exist on the platform"
    expected: >
      The agent symbols named in llms.txt resolve to real species that can be
      cloned.
    actual: >
      llms.txt names DELTA, STAT, CORR, SENT, SYNC, CRASH, DREAD, GLOOM, FADE,
      VORTX. GET /api/v1/agents/species returns MACD, RSI, BOLL, VOL, TREND,
      STOCH, ICHI, FIB, ATR, DIV, PCPN. The intersection of the two sets is
      empty. Not one documented name resolves.
    steps:
      - "GET https://cymetica.com/llms.txt and find the sentence beginning 'Clone any of 10 AI trading agents'"
      - "GET https://cymetica.com/api/v1/agents/species and read the symbol of each entry"
      - "Intersect the two sets -> empty"
    body: >
      Filed as documentation rather than as a bug because the endpoint works
      correctly -- it is the document that is wrong. Severity is high anyway:
      cloning an agent is the single most prominently advertised action for AI
      callers, and an agent following your own machine-readable guidance to
      clone "DELTA" cannot succeed. The counts disagree too, across four
      sources: 8 (agentbook), 10 (llms.txt and agent-card.json), 11 (species),
      16 (mcp.json description).

  - key: documented-404
    findings: [CYM-documented-404]
    severity: medium
    category: documentation
    url: https://cymetica.com/llms.txt
    title: "26 endpoints documented in llms.txt and agent-skills.json return 404"
    expected: >
      Every path published in a machine-readable document resolves, or is not
      published.
    actual: >
      26 documented paths return 404 at both anonymous and TRUSTED identities.
      Four of them are the declared endpoints of skills in agent-skills.json,
      so those skills are not actionable as written.
    steps:
      - "Collect every /api/v1 and /mcp/v1 path mentioned in llms.txt, agent-skills.json, openapi.json and udc.json"
      - "GET each path that takes no path parameter, with and without an API key"
      - "26 return 404 at both identities"
    body: >
      PLEASE DO NOT COLLAPSE THESE INTO ONE ANSWER. A 404 has at least three
      distinct causes needing different fixes: (a) the endpoint was removed and
      the document is stale, (b) it was never built and the document is
      aspirational, (c) the path is a typo for a working endpoint. "We will
      update the docs" is only correct for (a) and (c).
      The four agent-skills.json entries look like case (c) specifically:
      /api/v1/clob/order (openapi has /clob/orders, plural), /api/v1/bots/clone
      (openapi has /agents/clone), /api/v1/exchange/buy, /api/v1/tuatara/discover.
      If those are typos they are a one-line fix each and worth doing first.

  - key: mcp-tool-docs
    findings: [CYM-mcp_tool_count, CYM-mcp_tool_names_declared_vs_served, CYM-mcp_resource_count]
    severity: medium
    category: documentation
    url: https://cymetica.com/llms.txt
    title: "7 of the 11 MCP tool names documented in llms.txt do not exist, and the tool count differs across three sources"
    expected: >
      One authoritative tool list, and every documented tool name present on the
      server.
    actual: >
      llms.txt documents 11 tools by name. Four exist (get_market, get_prices,
      get_orderbook, search_markets); seven do not (get_markets, get_price,
      get_trades, get_leaderboard, get_market_summary, get_trending_markets,
      get_featured_market). The count itself reads 11 in llms.txt, 46 in
      mcp.json, and 46 from a live tools/list.
    steps:
      - "GET https://cymetica.com/llms.txt and extract the tool names linked as /mcp/v1/tools/<name>"
      - "POST /mcp/v1 tools/list and collect result.tools[].name"
      - "Diff the two sets"
    body: >
      Note also that llms.txt renders these as fetchable URLs of the form
      /mcp/v1/tools/<name>. Those answer 405, so the shape in the document is
      wrong even for the four tools that do exist -- they are JSON-RPC methods,
      not REST resources. Low-severity on its own, but it is the same document
      that carries the names and the count, which suggests the whole MCP
      section of llms.txt predates the current server.

  - key: skills-disagree
    findings: [CYM-skill_ids, CYM-skill_count]
    severity: low
    category: documentation
    url: https://cymetica.com/.well-known/agent-card.json
    title: "agent-card.json and agent-skills.json advertise different skill sets, and neither is a subset of the other"
    expected: >
      The two skill manifests agree, or one is clearly derived from the other.
    actual: >
      agent-card.json lists 13 skills, agent-skills.json lists 10. Seven ids
      appear only in the first, four only in the second. Six are shared.
    steps:
      - "GET /.well-known/agent-card.json and collect skills[].id"
      - "GET /.well-known/agent-skills.json and collect skills[].id"
      - "Compare: neither set contains the other"
    body: >
      An outside agent that discovers you through one manifest sees a different
      product from one that discovers you through the other. Worth deciding
      which is authoritative and generating the other from it, rather than
      correcting both by hand and having them drift again.

  - key: headline-figures
    findings: [CYM-commit_count, CYM-clob_pair_count, CYM-chain_count, CYM-agent_count]
    severity: medium
    category: documentation
    url: https://cymetica.com/llms.txt
    title: "Published headline figures disagree across sources: commits, CLOB pairs, settlement chains and agent count"
    expected: >
      A figure published in more than one place carries the same value in each,
      or is generated from one source.
    actual: >
      Four quantities disagree between the platform's own documents and its own
      live API. Full measured values are listed below.
    steps:
      - "GET /llms.txt, /.well-known/mcp.json, /api/v1/build-stats, /api/v1/swap/chains, /api/v1/agents/species, /api/v1/agentbook/agents"
      - "Extract each quantity from each source and compare"
    body: >
      The commit figure is the one I would prioritise. llms.txt says 11,700+
      while your own /api/v1/build-stats reports 21,840 -- an understatement of
      roughly 47% of your headline AI-authorship metric, and the number outside
      parties are most likely to quote back at you. Under-claiming is a strange
      failure mode and suggests these are hand-maintained constants rather than
      generated values.
      INVARIANT: generate each of these from the live endpoint at build time.
      A figure that is typed by hand will drift again.

  - key: tracker-closure
    findings: [CYM-tracker-closure-rate, CYM-own-reports-unverified]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/bounty/reports
    title: "Bounty tracker reports 100% closure with no validation recorded: all 15 items read fixed, validated_at null on every one"
    expected: >
      A bug tracker retains open, triaged, disputed and wont_fix items, and
      populates the validation fields its own schema defines.
    actual: >
      GET /api/v1/bounty/reports returns 15 records, all with status "fixed".
      The schema carries validated_at, triaged_at and severity_confirmed; none
      is populated on any record. Five records carry no resolution notes,
      ticket or PR link either.
    steps:
      - "GET https://cymetica.com/api/v1/bounty/reports"
      - "Group by status -> {fixed: 15}"
      - "Count records with a non-null validated_at -> 0"
    body: >
      CREDIT WHERE DUE: the resolution notes on the six reports filed under
      expire76 are specific -- they name files, line numbers and commit hashes.
      That is more than most vendors provide and I am not questioning that work
      happened. The problem is measurement, not effort: a queue with a 100%
      closure rate and an unpopulated validation field cannot be used to answer
      "how are we doing", by you or by anyone else.
      TWO QUESTIONS: is this a filtered public view, or does the tracker not
      retain unresolved items? And are those six reports bound to the wallet
      <wallet, sent in the wallet_address field>?
      For the record on my side: I record a status change to "fixed" as a fix
      CLAIM, not as fixed. It becomes verified only when I re-run the check
      that originally failed, and I report either outcome accurately.

  - key: trusted-tier-over-served
    findings: [CYM-trusted-receives-nothing-above-its-tier]
    severity: high
    category: security
    url: https://cymetica.com/mcp/v1
    title: "The tool-catalog tier bug from report #46 is still live one tier up: TRUSTED is served 5 allied tools"
    expected: >
      A caller at a given trust tier receives that tier's tools and everything
      below it, and nothing above.
    actual: >
      A TRUSTED-tier key is served all 46 tools. Per mcp.json it is entitled to
      41 (unknown 25 + recognized 13 + trusted 3). The five declared allied --
      create_aib_fund, edit_aib_fund_basket, list_my_aib_funds,
      register_webhook, subscribe_prices -- are served one tier below their
      declaration.
    steps:
      - "POST https://cymetica.com/mcp/v1 tools/list with a TRUSTED X-API-Key -> 46 tools"
      - "GET /.well-known/mcp.json, group tools by trust_tier -> unknown 25, recognized 13, trusted 3, allied 5"
      - "Subtract: 46 served, 41 entitled, the 5 allied are the excess"
    body: >
      Found by re-running your fix for report #46 one tier ABOVE where it was
      reported. Your root cause there was a falsy-default on TrustLevel.UNKNOWN
      (IntEnum 0) in the listing path; the anonymous case is genuinely fixed and
      verified, but the same listing path still over-serves at TRUSTED.
      SCOPE, as before: this is the advertised catalog only. Call-time
      authorization holds -- anonymous tools/call on place_order,
      create_aib_fund and get_deposit_address all return INSUFFICIENT_TRUST, and
      that is now a standing check on our side rather than something taken on
      trust. I have not tested calling an allied tool with the TRUSTED key,
      because the finding is reachability and the test would create a fund.
      INVARIANT: assert served_set(tier) is a subset of the union of declared
      tiers up to and including that tier, for every tier -- not just for
      anonymous. A fix that only corrects the tier it was reported at is not a
      fix for the class, which is exactly what this report is.

      CORRECTIONS FROM US, on our own earlier reports:
      Two checks we filed were wrong and we withdraw them. In report #52 the
      chain-count item compared "settlement on 10 chains" against the 16 chains
      /api/v1/swap/chains supports for swaps -- two different mechanisms, and
      netting them was our error, not your defect. In report #50 the tool-count
      item asserted the anonymous count should equal the manifest total; that
      only held while the tier gating was broken, and after your fix our own
      check was reporting correct behaviour as a failure. Both are retracted.

  - key: llms-self-contradiction
    findings: [CYM-llms_agent_count_self_consistent]
    severity: low
    category: documentation
    url: https://cymetica.com/llms.txt
    title: "llms.txt gives two different agent counts in its own text: 10 in one sentence, 11 in another"
    expected: >
      A single document quotes one value for one quantity.
    actual: >
      llms.txt contains both "CLOB exchange, 10 AI trading agents, on-chain
      settlement on Base L2" and "Clone any of our 11 AI trading agent species
      with customizable strategies". The live catalogue has 11.
    steps:
      - "GET https://cymetica.com/llms.txt"
      - "grep for '10 AI trading agents' and 'any of our 11 AI trading agent species' -- both present"
    body: >
      Your resolution on report #52 corrected the count and named what each
      figure measures, which was the right fix. One occurrence was missed. A
      document that contradicts itself is worse than two documents that
      disagree, because a reader has no basis to choose between them.
      INVARIANT: generate the count from /api/v1/agents/species at build time
      rather than writing it in prose, in every occurrence. This is the second
      time a hand-maintained constant in llms.txt has drifted.

  - key: skills-subset-model
    findings: [CYM-skills_subset]
    severity: low
    category: documentation
    url: https://cymetica.com/.well-known/agent-skills.json
    title: "The stated agent-card/agent-skills subset model does not hold: 2 skill ids appear only in agent-skills.json"
    expected: >
      Per your resolution on report #51, agent-card.json is the full discovery
      card and agent-skills.json the endpoint-actionable subset -- so every id
      in agent-skills.json should appear in agent-card.json.
    actual: >
      asset-discovery and portfolio-management are in agent-skills.json and
      absent from agent-card.json. The relationship is an overlap, not a subset.
    steps:
      - "GET /.well-known/agent-card.json, collect skills[].id -> 13"
      - "GET /.well-known/agent-skills.json, collect skills[].id -> 10"
      - "Subtract: asset-discovery and portfolio-management are not in the card"
    body: >
      The two renames you made did land -- get-market-data became market-data
      and exchange-crypto became exchange-tokens in both files, verified. This
      is only about the model you described alongside them. We changed our own
      check to test your stated model rather than demanding the files be
      identical, because your model is the better one; it just does not hold on
      two ids yet.
      INVARIANT: generate agent-skills.json from agent-card.json by filtering on
      "has an endpoint", so the subset relationship is true by construction
      rather than by maintenance.

  - key: documented-404-remainder
    findings: [CYM-documented-404]
    severity: low
    category: documentation
    url: https://cymetica.com/llms.txt
    title: "Three paths from report #49 still 404: one rename landed in openapi.json but not in agent-skills.json"
    expected: >
      A path either appears in the documentation and answers, or is removed
      from the documentation.
    actual: >
      Three of the 26 paths from report #49 are still published and still
      return 404. /api/v1/clob/order is the interesting one: the resolution
      note says it was renamed to clob/orders, and it was -- in openapi.json.
      The old name is still in agent-skills.json.
    steps:
      - "GET /.well-known/agent-skills.json -> still contains /api/v1/clob/order"
      - "GET /api/v1/clob/order -> 404"
      - "GET /llms.txt -> still contains /api/v1/account and /api/v1/agentbook/post"
      - "GET /api/v1/account -> 404"
      - "GET /api/v1/agentbook/post -> 404"
    body: >
      Most of report #49 is genuinely fixed and we re-checked it path by path,
      which is why this is a short list rather than a re-file of the original.
      We pinned all 26 paths at the moment we first reported them, so we can
      tell apart the three ways a path can stop failing: fixed in place, still
      broken, or removed from the documentation. 23 are no longer documented.
      These three are still documented and still 404.
      The clob/order case suggests the rename was applied to openapi.json and
      not to agent-skills.json, so the two discovery documents now disagree
      with each other as well as with the platform.
      INVARIANT: after a rename, assert the old path appears in NO published
      document -- llms.txt, openapi.json and every .well-known file -- rather
      than only in the one where it was noticed.

  - key: closed-without-fixing
    findings: [CYM-tracker-closure-rate]
    severity: high
    category: api
    url: https://cymetica.com/api/v1/bounty/reports
    title: "Report #59 was marked fixed within the hour with no evidence recorded, and none of the three paths it names has changed"
    expected: >
      A report reaches "fixed" because something was fixed, and the row
      records what: a validation timestamp, a note, a ticket or a commit.
    actual: >
      #59 reads status "fixed" in the public tracker with validated_at,
      triaged_at, status_notes, ticket_url and fix_pr_url all null. All three
      paths it reports are still published and still answer 404. Nothing about
      them changed between filing and closure.
    steps:
      - "GET /api/v1/bounty/reports -> report 59, status fixed, every evidence field null"
      - "GET /api/v1/account -> 404, and the path is still present in llms.txt"
      - "GET /api/v1/agentbook/post -> 404, and the path is still present in llms.txt"
      - "GET /api/v1/clob/order -> 404, and the path is still present in agent-skills.json"
    body: >
      This is report #53 caught in the act, on a report whose subject we can
      verify precisely. #53 observed that every report in the tracker read
      fixed with validated_at null; the answer was that closure is recorded
      differently. #59 is a case where the closure can be checked against the
      thing reported, and the thing reported has not moved.
      We are not assuming bad faith: an automated triage step, a default
      status on write, or a batch job would all produce this. But the effect
      is that "fixed" in this tracker carries no information, which makes the
      whole bounty channel unusable as a record for either side. We cannot
      tell your real fixes from your defaults, and neither can you.
      Separately and relevant to it: GET /api/v1/bounty/my-reports now returns
      zero rows for our wallet, where it returned twelve earlier today. That
      is the only view a hunter has of their own submissions, so while it is
      empty we cannot check any closure you make.
      INVARIANT: refuse the transition to a closed status unless at least one
      evidence field is set. A status with no evidence behind it should not be
      writable at all, rather than writable and unverifiable.

  - key: api-reports-absent-from-work-tracker
    findings: [CYM-bounty-pipeline-deadend]
    severity: high
    category: api
    url: https://cymetica.com/leaderboard/bugs
    title: "None of the 11 reports we filed through the bounty API appears in /leaderboard/bugs, the tracker that carries triage state"
    expected: >
      A report accepted by the filing API becomes visible in the tracker where
      triage and fixing happen.
    actual: >
      Zero of the eleven reports we filed via POST /api/v1/bounty/reports can
      be found in /leaderboard/bugs, matched on their own titles. They exist in
      the API's own list, which is a different surface with different states
      and no Linear links.
    steps:
      - "POST /api/v1/bounty/reports -> report accepted, id returned"
      - "GET /leaderboard/bugs -> search the page for the report's exact title"
      - "Repeat for all 11 of our reports: none is present"
    body: >
      We match on title rather than on report id on purpose: a bare number
      matches by coincidence in 250KB of markup, and a check that can pass by
      accident is not a check.
      /leaderboard/bugs is where work is visible -- it carries pending,
      qa_testing, implementing, resolved, wont_fix and the Linear ticket
      links. The API list carries a status field and little else. If filings
      land only in the second, the bounty API accepts reports into a place
      nobody works from, and a hunter has no way to see a report progress.
      This is also why we cannot tell your real closures from defaults: the
      surface that would show the work is the one our reports never reach.
      INVARIANT: after a successful POST to the filing endpoint, assert the
      report is retrievable in the work tracker, not only in the API's own
      list.

  # A retraction, filed through the reporting endpoint because it is the only
  # channel there is. Titled so triage can route it out of the work queue.
  - key: corrections-52-53-54
    findings: [CYM-clob_pair_count]
    severity: suggestion
    category: documentation
    url: https://cymetica.com/mcp/v1
    title: "CORRECTION from the reporter: reports #52 and #53 were wrong, and your rejection of #54 was right"
    expected: >
      No action is requested. This retracts figures we filed that were
      artefacts of how we read your API, so your records are not left holding
      our mistakes.
    actual: >
      Three of the four items in your 2026-09-05 reply were our errors, and
      all three were the same error: a check read nothing usable and then used
      the nothing as a measured value.
    steps:
      - "#52: we called list_clob_pairs with no arguments and counted len(pairs) = 200. The same object states total=569, limit=200, offset=0. We filed a page size as a catalogue size."
      - "#53: we called GET /api/v1/bounty/my-reports with no X-API-Key. The 401 body carries no `reports` key, our reader defaulted it to an empty list, and we filed 'we cannot see our own reports'. With the credential it answers 200 with all 20 rows."
      - "#54: we took the caller's tier from the name of our own config variable (QA_TRUSTED_KEY) and demanded trusted-tier entitlement. GET /mcp/v1/agents/me reports allied, trust_score 9419."
    body: >
      CORRECTIONS, in order.
      #52 (CLOB pair count) is retracted as filed. Our "200 vs 568" compared a
      page against a document; list_clob_pairs paginates and says so in every
      response. Verified since: limit=2000 returns 569 rows, offset=200
      returns the next window, total reads 569 in all three calls, and paging
      by offset traverses the collection exactly once, with no duplicate and
      no gap. Your pagination is correct and we reported it as a discrepancy.
      Separately, your replacement shipped while we were writing this, and it
      verifies: llms.txt now reads "500+ CLOB pairs (live count: MCP tool
      list_clob_pairs, field `total`)". 569 >= 500, and the sentence now
      points at the value instead of freezing it.
      #53 (my-reports) is withdrawn entirely. The 401 was ours. The endpoint
      requires authentication by design and behaves correctly. Thank you for
      finding the case-sensitive wallet comparison while answering a report
      that should not have been filed -- reports #7 through #12 were genuinely
      missing from that view, and that part was real.
      #54 (trust tier): your rejection was correct, and we can now show it
      rather than concede it. The check reads GET /mcp/v1/agents/me, which
      reports this caller as allied, and compares the served set against the
      entitlement mcp.json declares for that tier: 56 served, 56 entitled, 0
      above it. As a negative control the same served set is judged at every
      rung -- it fails at unknown, recognized and trusted, and passes only at
      allied. Both operands are now your own statements; neither is our label
      for our own key.
      WHAT WE CHANGED so this class stops reaching you: a source that did not
      answer can no longer become a measured value. Reading a field that is
      absent, a key no row carries, or a size taken by len() of a paginated
      response now raises "cannot measure" together with the reason, instead
      of returning a number that flows on into a comparison. Four of our
      checks were wrong that way in a single day; the four shapes are held
      down by tests now.
      NO ACTION REQUESTED. Please close this as invalid or duplicate -- it
      exists so that #52 and #53 are not left standing against you.

  - key: bounty-rewards-unrecorded
    findings: [CYM-bounty-rewards-unrecorded]
    severity: high
    category: api
    url: https://cymetica.com/api/v1/bounty/reports
    title: "No verified report records what it earned: 30 bugs fixed, reward_amount null on every row, stats total_paid 0.0"
    expected: >
      A report the tracker marks fixed carries the award it earned in
      reward_amount / reward_currency, so a hunter can read their accrued
      backlog from the API. Payment may legitimately still be pending -- that
      is what paid_at is for.
    actual: >
      reward_amount is null on all 20 rows the public tracker returns, all of
      which are closed as fixed, and on all 21 rows my-reports returns for our
      wallet. GET /api/v1/bounty/stats reports bugs_fixed 30 and total_paid
      0.0. The leaderboard shows total_earned 0.0 for both ranked hunters.
    steps:
      - "GET /api/v1/bounty/reports -> 20 rows, every status fixed, every reward_amount null"
      - "GET /api/v1/bounty/stats -> bugs_fixed 30, total_paid 0.0, total_cym_allocated 0.0"
      - "GET /api/v1/bounty/leaderboard -> expire76 valid_reports 16 total_earned 0.0; Crypto42day valid_reports 2 total_earned 0.0"
      - "GET /api/v1/bounty/my-reports with X-API-Key -> 21 rows, reward_amount and paid_at null on every one"
    body: >
      SCOPE, stated up front: this is not a claim that anything is owed to us,
      and we are not asking to be paid. It is a claim about what your API can
      say. We are also not treating your announcement as a specification --
      the finding stands on your own schema and your own totals.
      Your report rows separate reward_amount from paid_at, which is the right
      shape, because an award and a payment are different events: the award is
      earned when a report is verified, the payment can wait for whatever the
      recipient still has to do. Only the second of those is deferred here.
      The first is simply never written, so there is no state in which a
      hunter can read what they have accrued, and no way to reconcile a
      payment against the report that earned it.
      Worth knowing on your side: our operator reports having been paid 1000
      ET10 several times for the six reports filed before we moved to the API
      (#7-#12). Those six also carry reward_amount null and paid_at null. So
      money has moved that this tracker has no record of, which makes
      total_paid 0.0 an understatement rather than a true zero -- and that is
      a harder problem than an unpopulated column.
      INVARIANT: after a report reaches a verified state, reward_amount and
      reward_currency are non-null, and any payment made against it sets
      paid_at on that report.

  - key: bounty-rewards-undocumented
    findings: [CYM-bounty-rewards-undocumented]
    severity: low
    category: documentation
    url: https://cymetica.com/llms.txt
    title: "The bug-report reward programme appears in no machine-readable surface, while ET10 revenue share is documented in two"
    expected: >
      An earning programme a machine reader can act on is described in the
      files published for machine readers, as ET10 revenue share already is.
    actual: >
      Searching llms.txt, agent-card.json, agent-skills.json, openapi.json and
      mcp.json for a description of the bug-report reward finds nothing. ET10
      appears throughout as an asset, and /api/v1/rewards/summary and /rewards
      are listed, but both concern staking and revenue share. Nothing states
      that filing a verified bug earns anything.
    steps:
      - "GET /llms.txt, /.well-known/agent-card.json, /.well-known/agent-skills.json, /openapi.json, /.well-known/mcp.json"
      - "Search each for a bug/report term within 80 characters of a reward/earn/payout term"
      - "0 matches in all five; the same search finds the ET10 revenue-share programme in agent-card.json and agent-skills.json, with triggers and an endpoint"
      - "GET /.well-known/mcp.json -> no tool named for bounty, bug, report or reward"
    body: >
      Raised because of what this platform says it is for. agent-card.json and
      agent-skills.json exist so an agent can discover what it can do here,
      and they already carry the other earning programme -- et10-revenue-share
      has a description, triggers, and an endpoint to check eligibility. The
      bug-report reward has none of that, so the readers those files were
      written for cannot learn the programme exists, cannot check whether a
      report qualifies, and cannot read a balance.
      Two concrete gaps: no discovery document mentions it, and no MCP tool is
      named for it, so an agent holding a trust-tiered catalogue has no way to
      reach it either.
      Lowest severity deliberately -- nothing is broken. It is an
      inconsistency between what you publish for humans and what you publish
      for agents, on a platform whose stated posture is that the second is
      first class.
      INVARIANT: an earning programme open to agents is described in at least
      one machine-readable surface, next to the programmes that already are.

  - key: account-me-rejects-its-api-key
    findings: [CYM-account-me-rejects-its-documented-credential]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/account/me
    title: "GET /api/v1/account/me answers 401 to the X-API-Key that opens /api/v1/account/me/portfolio in the same request run"
    expected: >
      A route agent-skills.json sends an agent to, marked
      authentication_required, opens to a scheme agent-card.json lists as
      accepted.
    actual: >
      /api/v1/account/me returns 401 {"detail":"Not authenticated"} to an
      X-API-Key header. The sibling route /api/v1/account/me/portfolio returns
      200 to the identical header, from the same client, seconds apart. The
      same key also opens /mcp/v1/agents/me and /api/v1/bounty/my-reports, so
      it is a live key on an ALLIED account. Sending it as a bearer token
      instead gives 401 "Could not validate credentials".
    steps:
      - "GET /api/v1/account/me with header X-API-Key: <key> -> 401 {\"detail\":\"Not authenticated\"}"
      - "GET /api/v1/account/me/portfolio with the SAME header -> 200 with the full asset list"
      - "GET /mcp/v1/agents/me with the same header -> 200, trust_level allied"
      - "GET /api/v1/account/me with Authorization: Bearer <key> -> 401 \"Could not validate credentials\""
    body: >
      The sibling route is what makes this a report rather than a support
      question. If both refused, the honest reading would be that our
      credential is not what we think it is. One of them answering, to the
      same header in the same run, means the key is good and one route
      disagrees with the catalogue that advertises it.
      Why it matters more than one endpoint: agent-skills.json points the
      et10-revenue-share skill at exactly this route, with the triggers "am i
      earning" and "et10 rewards". An agent following your own machine-readable
      catalogue, with a credential your own agent-card lists, to answer a
      question you invite it to ask, is refused. We hit it doing precisely
      that.
      If the route is JWT-only by design, then the finding moves to the
      documents rather than the code: agent-card.json offers two schemes
      without saying which routes accept which, and agent-skills.json marks the
      skill authentication_required without naming a scheme. Either way an
      agent cannot get this right from what you publish.
      INVARIANT: for every route a discovery document sends an agent to,
      at least one of the authentication schemes that document lists is
      accepted -- or the route names the scheme it requires.

  - key: qa-agent-cannot-report-its-own-data
    findings: [CYM-qa-agent-cannot-report-its-own-data]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/bounty/qa-agent/ask
    title: "The A2A QA agent cannot report values the platform publishes, and escalating a low-confidence answer returns the routing guide"
    expected: >
      Asked for a value served at a documented endpoint, the channel
      agent-card.json names for exactly this purpose answers with that value.
      A question escalated under the platform's own confidence rule receives
      something other than the rule itself.
    actual: >
      Asked which currency GET /api/v1/bounty/reward-tiers returns and what
      the critical severity range is, the sync channel returned rewards-FAQ
      marketing copy containing neither the currency (CYM) nor either bound
      (400,000-1,000,000), at confidence 0.6, citing faq-rewards-1 and
      faq-revenue-share-1. Escalating to the async channel, as the documented
      rule instructs below 0.7, produced a reply whose content is the
      communication guide: "Try sync first. If response.confidence < 0.7,
      re-send via async" -- the step just taken.
    steps:
      - "GET /api/v1/bounty/reward-tiers -> {\"currency\": \"CYM\", \"severity_rewards\": {\"critical\": {\"min\": 400000, \"max\": 1000000}, ...}}"
      - "POST /api/v1/bounty/qa-agent/ask {\"question\": \"What currency does GET /api/v1/bounty/reward-tiers return in its currency field, and what is the reward range for a critical severity report?\"}"
      - "Read response.answer -> contains neither 'CYM' nor 400000 nor 1000000; confidence 0.6; sources faq-rewards-1, faq-revenue-share-1"
      - "POST /api/v1/bounty/a2a/send with the same question, then GET /api/v1/bounty/a2a/inbox/{agent_id} -> the reply is the sync/async routing guide"
    body: >
      The question was chosen so the verdict does not rest on anyone's
      judgement of tone. Its correct answer is a value you serve yourself, one
      GET away, at an endpoint your own discovery documents name. A channel
      that cannot report its own published data is failing a test it set for
      itself: agent-card.json says of this endpoint that "Answers cite source
      files, database state", and offers it as the way to check a claim the
      card does not already list.
      The escalation loop is the more serious half. Your decision rule sends a
      sub-0.7 answer to the async channel, and the async channel replies with
      the decision rule. A caller who follows your documentation exactly is
      returned to where they started, so no question the fast path cannot
      answer can ever reach a conclusion through the published route.
      SEPARATE OBSERVATION, not a defect claim, because I would rather ask
      than guess -- and asking is what failed above. Your surfaces began
      stating today that bounty rewards are paid in CYM (llms.txt,
      agent-card.json, agent-skills.json, and reward-tiers with a TGE/vesting
      schedule). I cannot locate CYM: not among the four contracts
      agent-card.json declares under verification.contracts, not in the 569
      pairs list_clob_pairs returns (CYM42/USDC is a different asset), and
      bounty/stats reports total_cym_allocated 0.0. The announcement in the
      support channels promised 1000 ET10 per verified report, ET10 is
      declared and source-verified, and ET10 is what was actually paid. If CYM
      is pre-TGE, what should a hunter read today to know what a verified
      report has earned?
      NOT ASKING FOR A DIFFERENT TONE. The marketing register is a product
      decision. The finding is that the answer did not contain the data.
      INVARIANT: for a question whose answer is a value served at a documented
      endpoint, the sync channel's answer contains that value, or reports a
      confidence below its own floor AND the async channel returns something
      other than the routing guide.

  # A follow-up on their own fix, not a new defect class. Both halves of #66
  # were addressed; two properties they stated about the async half do not
  # hold as published.
  - key: a2a-first-pass-deviations
    findings: [CYM-a2a-first-pass-contract, CYM-a2a-first-pass-not-grounded]
    severity: low
    category: api
    url: https://cymetica.com/api/v1/bounty/a2a/send
    title: "Follow-up on #66: the async first-pass reply is not tagged metadata.is_answer and is not grounded, though the sync half now is"
    expected: >
      The two properties stated in the fix note: an automated reply carries
      metadata.is_answer=false so an agent can filter it, and every async
      question receives a grounded first-pass reply.
    actual: >
      No message in the inbox carries an is_answer field at any nesting level.
      The metadata object is {"auto": true, "kind": "first_pass",
      "in_reply_to": "...", "sources": []}. The first-pass replies carry
      sources [] and confidence 0.6 -- the value that triggers your own
      escalation rule -- and a question about your two OpenAPI documents was
      answered with market-data copy.
    steps:
      - "POST /api/v1/bounty/a2a/send {\"from_agent_id\": \"expire76-qa\", \"content\": \"<a question naming GET /openapi-public.json>\"}"
      - "GET /api/v1/bounty/a2a/inbox/expire76-qa?unread_only=false (needs X-API-Key) -> 3 messages"
      - "Inspect metadata on each: {auto, kind, in_reply_to, sources}. 'is_answer' does not appear anywhere in the response body"
      - "Read confidence and metadata.sources on the kind=first_pass replies -> 0.6 and []"
    body: >
      CREDIT FIRST, because most of that release holds. The session-commit
      root cause is genuinely fixed: async messages now persist and a reply
      arrives in seconds, where before only the routing prompt could reach the
      inbox. The sync channel is genuinely grounded -- it appends the live
      reward-tiers JSON verbatim, cites the endpoint under sources, and
      answers at 0.85. The finding as I framed it in #66 is closed on its own
      terms, and I said the register was your call, so the marketing preamble
      is not what this is about.
      TWO NARROW POINTS, both on the async half.
      The filter works, but not under the name you published. metadata.auto
      and metadata.kind='first_pass' both distinguish it perfectly. A client
      written to metadata.is_answer filters nothing and treats a routing
      prompt as an answer -- which is the exact failure the tag was added to
      prevent. Either ship the field or correct the note; I do not mind which.
      The async first-pass is not grounded the way the sync half is. Same
      release, same question class, different behaviour: sync cited GET
      /api/v1/bounty/reward-tiers and answered at 0.85; async cited nothing at
      0.6. If the grounding layer is only wired into the sync path, the
      escalation route still cannot answer the questions it exists for.
      SEPARATE, and the reason I was asking in the first place: after
      ET-22232 there are two OpenAPI documents. GET /openapi.json serves 13
      paths; GET /openapi-public.json serves 49. llms.txt, udc.json and
      mcp.json point at the second; agent-card.json and agent-skills.json
      point at neither. /openapi.json is the conventional path a generated
      client tries first, and it carries nothing indicating a fuller document
      exists, so a client built from it silently gets a quarter of the
      surface. Is openapi-public.json the spec of record, and should
      /openapi.json redirect, mirror, or carry a pointer? For scale: 65 live
      /api/v1 endpoints referenced by your own published sources appear in
      neither document. The backtest slice I reported is now fully covered --
      this is the rest of it.
      INVARIANT: an automated reply is distinguishable by a documented field,
      and the conventional spec path either serves the full surface or names
      the document that does.

  - key: award-contradicts-its-own-tier
    findings: [CYM-award-contradicts-its-own-tier]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/bounty/reports
    title: "Every awarded report records 1000 ET10 beside an eligible_reward_range of 5,000-1,000,000 CYM for its own confirmed severity"
    expected: >
      A report's recorded award is expressed in the currency of the
      entitlement published on the same row, and falls inside it.
    actual: >
      All 20 rows on the public tracker pair reward_currency ET10 with an
      eligible_reward_range denominated in CYM, and every recorded amount is
      below the minimum that range publishes for the row's own
      severity_confirmed. Report #8 is confirmed critical: it publishes
      400,000-1,000,000 CYM and records 1,000 ET10. Report #67 is confirmed
      low: it publishes 5,000-25,000 CYM and records 1,000 ET10.
    steps:
      - "GET /api/v1/bounty/reports -> 20 rows, all with reward_status awarded"
      - "On each row compare reward_amount / reward_currency against eligible_reward_range"
      - "20 of 20 disagree on currency (ET10 vs CYM) and 20 of 20 record an amount below eligible_reward_range.min"
      - "GET /api/v1/bounty/reward-tiers confirms the ranges are the published policy: currency CYM, critical 400000-1000000"
    body: >
      CREDIT FIRST, because the larger half of this landed and it is the part
      that mattered. Report #63 asked the tracker to be able to say what a
      verified report had earned, and it can: 35 awards are recorded,
      reports_pending_award is 0, and all 24 of our eligible reports read
      awarded with an amount. That includes the 15 filed through the API,
      which until #65 shipped could not reach the reward lane at all.
      What arrived with it is a row that contradicts itself. Two fields on the
      same object make incompatible claims about the same report, and a hunter
      reading it cannot tell which is the programme they are in.
      WHICH ONE IS RIGHT IS YOURS TO SAY, NOT OURS, and this check does not
      assume. Both readings are coherent: the flat 1,000 ET10 matches the
      announcement in the support channels and matches what has actually been
      paid, in which case eligible_reward_range is advertising a programme
      nobody is in yet; or the CYM tiers are the policy and the recorded
      amounts are a legacy rate. Either way one of the two fields is currently
      wrong on every row.
      Related, and probably the same story: /stats reports
      awards_recorded_total 35000 with payouts_recorded 0 and total_paid
      2000.0, while the leaderboard shows total_earned 0.0 for both ranked
      hunters. Four numbers about the same money, none of which agree.
      NOT A PAYMENT REQUEST. We are not asking to be paid, or to be paid more.
      The check goes green the moment a row stops disagreeing with itself,
      whichever way you resolve it.
      INVARIANT: reward_currency equals eligible_reward_range.currency, and
      reward_amount falls within [min, max] for the row's severity_confirmed.

  # #67 was marked fixed at 11:07:30 UTC, stating the async grounding layer
  # shipped @b66f344fea. A fresh inbox read after that timestamp still shows
  # the pre-fix behaviour -- this is not a stale message from before the fix,
  # it is a new message that postdates the vendor's own fixed_at.
  - key: a2a-grounding-still-ungrounded-after-fixed
    findings: [CYM-a2a-first-pass-not-grounded]
    severity: low
    category: api
    url: https://cymetica.com/api/v1/bounty/a2a/send
    title: "Follow-up on #67: async first-pass replies still carry confidence 0.5 and sources [] after your fixed_at of 11:07:30 UTC"
    expected: >
      Per the resolution note on #67, async first-pass grounding via the same
      live-platform-facts resolvers as the sync path shipped @b66f344fea, live
      as of fixed_at 2026-09-06T11:07:30Z.
    actual: >
      A question sent at 2026-09-06T16:02:09Z -- five hours after your own
      fixed_at -- produced a first-pass reply with confidence 0.5 and
      metadata.sources: []. This is not a stale pre-fix message: it is the
      newest message in the inbox, timestamped after the fix was declared
      live.
    steps:
      - "POST /api/v1/bounty/a2a/send {\"from_agent_id\": \"expire76-qa\", \"content\": \"<any question>\"} at 2026-09-06T16:02:09Z"
      - "GET /api/v1/bounty/a2a/inbox/expire76-qa?unread_only=false (needs X-API-Key)"
      - "The newest message (id a2a_f8b9d0b9, created_at 2026-09-06T16:02:09) has metadata.kind=first_pass, confidence 0.5, metadata.sources: []"
      - "Compare against fixed_at on report #67: 2026-09-06T09:22:15Z (server) / 11:07:30Z (our observed transition) -- both earlier than the message tested"
    body: >
      Not disputing that something shipped @b66f344fea -- the session-commit
      fix from #66 clearly did, replies now arrive at all. What I can't
      confirm is the grounding claim specifically: nine consecutive first-pass
      replies since the fix, spanning 06:06 to 16:02 UTC, all read confidence
      0.5-0.6 with empty sources, matching the pre-fix behaviour exactly. If
      the resolver wiring is conditional on something (question phrasing,
      which endpoint is named, a feature flag not yet flipped for this
      agent_id), that would explain it and I'd rather know the condition than
      keep re-testing blind.
      INVARIANT: an async first-pass reply sent after fixed_at either cites a
      source in metadata.sources or reports confidence >= 0.7, matching what
      the sync channel already does for the same question class.


  - key: award-currency-still-contradicts-its-tier
    findings:
      - CYM-award-contradicts-its-own-tier
    severity: low
    category: api
    url: https://cymetica.com/api/v1/bounty/reports
    title: >-
      Follow-up on #68: the amounts are resolved, but every row still names an
      award currency its own published entitlement contradicts
    expected: >
      A row publishing eligible_reward_range in one currency should name that
      same currency for its award, so the two statements on one row can both
      be true.
    actual: >
      Read at 2026-09-06T18:10Z, all 20 rows on GET /api/v1/bounty/reports
      carry reward_status pending_award and reward_amount 0.0 -- so the half
      of #68 about an amount sitting outside its band is genuinely resolved,
      and our check no longer asserts it. The currency half is untouched:
      19 rows name ET10 and one names USDC, every one of them beside an
      eligible_reward_range published in CYM.
    steps:
      - "GET /api/v1/bounty/reports (no auth)"
      - "Every row: reward_status=pending_award, reward_amount=0.0"
      - "19 rows: reward_currency=ET10 beside eligible_reward_range.currency=CYM"
      - "Report #68: reward_currency=USDC beside eligible_reward_range {min 25000, max 100000, currency CYM, severity medium}"
      - "Report #68: severity_confirmed=null, while the band it publishes is keyed to severity=medium, which is its severity_reported"
    body: >
      Crediting the part that moved: zeroing the amounts and marking the rows
      pending_award is an honest answer to the amount half, and it retired that
      half of the check rather than papering over it. Our own check had to be
      repaired to see it -- it was reading any numeric reward_amount as a
      recorded award and so kept reporting "0 recorded against 25000-100000"
      about reports that had been awarded nothing. That was our error and it is
      fixed on our side.


      What still reads as two statements about one row that cannot both be
      true: the award currency. Nothing has been paid, so this is not a
      payment dispute -- it is that a row promises an entitlement in CYM and
      names a different currency for the award beside it.


      Two details that may point at the cause. First, #68 is the only row of
      the twenty that reads USDC; the other nineteen still read ET10. Since #68
      is the report that raised this, it looks like the row that was named got
      edited rather than the mechanism that fills the field -- and it moved to
      a third currency, so #68 now disagrees with both its own band and its
      nineteen siblings. Second, #68 carries severity_confirmed=null while the
      band beside it is keyed to severity=medium, which is its
      severity_reported. If the entitlement is derived from the reporter's own
      severity claim rather than a confirmed one, that is worth knowing
      independently of the currency.


      #68 was moved to fixed at 2026-09-06T17:39:26 with status_notes null and
      fix_pr_url null, so there is nothing on the record saying what changed.
      If the intended resolution is that awards are paid in ET10 or USDC and
      the CYM ranges are legacy copy, saying so on the report closes this
      without any code change -- the check only asserts that the two agree, not
      which of them is right.

  - key: rewards-unreadable-after-the-zeroing
    findings:
      - CYM-bounty-rewards-unrecorded
    severity: low
    category: api
    url: https://cymetica.com/api/v1/bounty/reports
    title: >-
      Follow-up on #63: zeroing the awards made paid and never-awarded
      indistinguishable, while stats still reports total_paid 2000.0
    expected: >
      A verified report should be readable as either awarded or not awarded,
      and the aggregate in /api/v1/bounty/stats should agree with the rows it
      aggregates.
    actual: >
      Read at 2026-09-06T21:53Z. All 20 rows on GET /api/v1/bounty/reports are
      closed as fixed, every one carries reward_status pending_award and
      reward_amount 0.0, and none can be read as paid or awarded. Meanwhile
      GET /api/v1/bounty/stats reports total_paid 2000.0, awards_recorded 2,
      awards_recorded_total 2000.0, payouts_recorded 0 and
      reports_pending_award 34.
    steps:
      - "GET /api/v1/bounty/reports (no auth): 20 rows, all status=fixed, all reward_status=pending_award, all reward_amount=0.0"
      - "GET /api/v1/bounty/stats (no auth): total_paid=2000.0, payouts_recorded=0, awards_recorded=2, reports_pending_award=34"
      - "No row in the public list can be read as one of the 2 awards_recorded"
    body: >
      This one appears to be a side effect of the change that answered #68, so
      it is offered as a heads-up rather than a complaint. #63 asked the
      tracker to be able to say what a verified report had earned, and it
      could: the fields shipped. Setting every reward_amount to 0.0 and every
      reward_status to pending_award has taken that back -- a report that was
      paid and one whose award was never recorded now read identically.


      Two specifics that look like genuine contradictions rather than
      presentation. total_paid is 2000.0 beside payouts_recorded 0, so
      whatever total_paid counts, it is not payments; if it means "awarded",
      the name is doing real damage to anyone reading the programme's numbers.
      And awards_recorded is 2, but no row in the 20 the public endpoint
      returns can be read as either of them, so the two awards are not
      locatable from outside.


      Our check for this had been passing since your fix and went red on
      today's sweep, which is why you are hearing about it now rather than
      earlier.

  - key: closure-without-evidence-recurred-on-68
    findings:
      - CYM-tracker-closure-rate
    severity: low
    category: api
    url: https://cymetica.com/api/v1/bounty/reports
