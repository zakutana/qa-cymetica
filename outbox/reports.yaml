  - key: openapi-documents-disagree
    findings: [CYM-published-openapi-documents-agree]
    severity: low
    category: documentation
    url: https://cymetica.com/openapi-public.json
    title: "Three public GETs are in /openapi.json but missing from /openapi-public.json, the schema llms.txt tells agent builders to import"
    expected: >
      llms.txt links two machine-readable schemas for the same API -- the
      curated https://cymetica.com/openapi-public.json ("importable by ChatGPT
      Custom-GPT Actions and schema-driven tool layers") and /openapi.json
      ("Machine-readable API schema") -- so an endpoint that is public and
      declared in one is declared in the other.
    actual: >
      /openapi.json declares 13 paths, /openapi-public.json 109, and only 5
      are in both. Eight are in the small document alone. Five of those may
      fairly be absent from a public schema (401 on /api/v1/account/me/balances
      and /api/v1/account/me/portfolio; GET 405 on /api/v1/agents/clone,
      /api/v1/backtest/bots/{slug}/run-backtest and /api/v1/funding/withdraw).
      Three answer 200 to an anonymous GET and are still missing:
      /api/v1/prices, /api/v1/arena/market and /api/v1/clob/book/hybrid.
    steps:
      - 'GET https://cymetica.com/openapi.json and collect paths (13)'
      - 'GET https://cymetica.com/openapi-public.json and collect paths (109); the intersection is 5'
      - 'For each path in the first and not the second, GET it with no credentials'
      - '/api/v1/prices, /api/v1/arena/market and /api/v1/clob/book/hybrid answer 200'
    body: >
      Small, and only in one direction: we are not asking why the curated
      document has 104 paths the other lacks -- that is a curated list doing
      its job. The asymmetry that costs a caller something is the other way
      round, because an agent framework importing the file you recommend does
      not get /api/v1/prices.
      Either adding those three to the curated schema or dropping them from
      /openapi.json satisfies our check. It skips templated paths, and it
      counts nothing that answers 401, 403, 404 or 405 -- a private endpoint
      is allowed to be absent from a public schema.

  - key: coin-outlook-missing-btc
    findings: [CYM-coin-outlook-answers-for-its-own-roster]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/crypto-outlook/BTC.txt
    title: "Coin Outlook answers 404 for BTC, the first coin on its own roster, on both the text and JSON views"
    expected: >
      Your published schema describes GET /api/v1/crypto-outlook/{symbol}.txt
      as "Plain text for chat assistants. Always 200 for a known coin: a cold
      coin is waited on briefly, then answered with a come-back line." A
      symbol taken from your own roster at
      /api/v1/crypto-outlook/coins is a known coin, so it answers 200 -- a
      come-back line included.
    actual: >
      BTC, the first entry of that roster, answers {"detail":"Not Found"} with
      HTTP 404 on the text view and on the JSON view, every time we look. RAIN
      does the same, having answered 200 on an earlier pass. The other ten
      coins we sampled from the head of the roster (ETH, BNB, XRP, SOL, TRX,
      ZEC, HYPE, XMR, WBT, LINK) answer 200.
    steps:
      - 'GET https://cymetica.com/api/v1/crypto-outlook/coins -- 147 coins, BTC first'
      - 'GET https://cymetica.com/api/v1/crypto-outlook/BTC.txt -> 404 {"detail":"Not Found"}'
      - 'GET https://cymetica.com/api/v1/crypto-outlook/BTC -> 404, the same body'
      - 'Wait 15 s and repeat both: still 404'
      - 'GET https://cymetica.com/api/v1/crypto-outlook/ETH.txt -> 200, so the route itself works'
    body: >
      The text view is the one you wrote for chat assistants, and the coin an
      assistant is most likely to be asked about is the one that does not
      answer. Worth saying plainly: we do not know whether BTC is missing from
