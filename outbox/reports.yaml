  - key: chart-analyzer-live-candle-is-hours-old
    findings: [CYM-the_forming_candle_of_a_gem_screener_coin_is_current_or_agrees_with_its_pool]
    severity: medium
    category: logic
    url: https://cymetica.com/chart-analyzer?contract=CARDSccUMFKoPRZxt5vt3ksUbxEFEcnZ3H2pd3dKxYjp&chain=solana&tf=1d
    title: >-
      Chart Analyzer: the "LIVE" forming candle of a Gem Screener coin is hours old and
      5% off its pool (Collector Crypt 0.2567 against 0.2707), and candles_stale says false
    expected: >
      A candle the page labels "LIVE" and the score is computed on is current, or the
      response says the candles are stale: `candles_stale` true, or the label does not
      read LIVE.
    actual: >
      Collector Crypt (CARDS), daily, Solana, read at 14:38 UTC on 2026-10-02:
      `candles_fetched_at` 12:24:02 UTC (134 minutes earlier), `last_candle_forming` true,
      the forming candle closes at 0.25675 (high 0.25867). The same Raydium CARDS/USDC pool
      (HnhpJPJgBG2KwniMTNW8cVBHvk1hFog3RC3kjnyc23tD) has a daily candle at GeckoTerminal
      that closes at 0.27074 (high 0.27492), and DexScreener prices it at 0.2738: the
      forming candle is 5.2% below the pool, on a day the token was up about 36%. The page
      says "LIVE - DEX POOL" and the answer has `candles_stale: false`; the score of 53
      is computed on that candle. The owner saw 0.257 on the page and 0.273 on DEXTools at
      14:36 UTC. The 12:24 time is the Gem Screener's six-hourly batch (llms.txt: daily
      candles of every Gem Screener coin "are kept fresh in a shared cache"); opening
      the page did not refresh it. `candles_stale` is a boolean with no description in
      /openapi-public.json.
    steps:
      - 'GET https://cymetica.com/api/v1/chart-analyzer/analyze?contract=CARDSccUMFKoPRZxt5vt3ksUbxEFEcnZ3H2pd3dKxYjp&chain=solana&timeframe=1d&include_candles=true -> candles_fetched_at 2026-10-02T12:24:02+00:00, candles_stale false, last_candle_forming true, candles[-1] = [1790899200, 0.21212, 0.25867, 0.20239, 0.25675, 4874730]'
      - 'GET https://api.geckoterminal.com/api/v2/networks/solana/pools/HnhpJPJgBG2KwniMTNW8cVBHvk1hFog3RC3kjnyc23tD/ohlcv/day?limit=1 -> [1790899200, 0.21212, 0.27492, 0.20239, 0.27074, 6068768] (the same day, the same pool)'
      - 'GET https://api.dexscreener.com/latest/dex/tokens/CARDSccUMFKoPRZxt5vt3ksUbxEFEcnZ3H2pd3dKxYjp -> raydium CARDS/USDC priceUsd 0.2738'
    body: >
      Any of three fixes clears it: refresh a coin's candles when its page is opened, a
      shorter cache for the forming candle, or an honest flag (candles_stale true with a
      stated age, and no LIVE label) once the cache is older than you choose. Our check
      takes up to three Gem Screener coins with a pool of at least $500K and fails only
      when a forming candle is BOTH more than an hour old and more than 2% from the
      pool's current candle at GeckoTerminal, so a fresh candle that drifted, or an old
      one that still agrees, passes. Separate, small: please describe `candles_stale`
      in /openapi-public.json (what age sets it).

  - key: backtest-rally-run-shape-and-themes
    findings:
      - CYM-a_stored_run_carries_the_fields_its_schema_lists
      - CYM-a_run_on_a_theme_is_listed_with_that_theme
    severity: low
    category: documentation
    url: https://cymetica.com/backtest-rally
    title: >-
      Backtest Rally: GET /research-backtest/runs/{run_id} does not return the fields its
      schema lists, and a run on a theme is listed with no theme
    expected: >
      The stored run carries the properties /openapi-public.json lists for it (run_id,
      label, created_at, algo_model, themes, n_baskets, hold_days, mean_basket_gain_pct,
      mean_vs_btc_pct, hit_rate_pct, baskets), and a run whose parameters name a theme is
      listed under it, so `?theme=` finds it.
    actual: >
      Read 2026-10-03 on the three stored runs (all created 2026-06-24). The run
      document has run_id, label, created_at, `parameters`, `summary` and `rows`. Eight of
      the eleven documented properties are not at the top level: algo_model, themes,
      n_baskets, hold_days, mean_basket_gain_pct, mean_vs_btc_pct, hit_rate_pct and
      baskets. The figures sit under `summary`, the rest under `parameters`, and
      the per-basket detail is called `rows`. The schema requires only run_id and allows
      extra properties, so a response validates while a client written from it reads
      nothing. Second: run best-params-macd-gated-20260624T200425 has
      parameters.theme "defi tokens" (and a defi theme_regex) but is listed with
      `themes: []` in both GET /runs and its own parameters.themes, so
      GET /runs?theme=defi%20tokens returns only the other defi run.
    steps:
      - 'GET https://cymetica.com/openapi-public.json -> paths["/api/v1/research-backtest/runs/{run_id}"].get 200 schema properties: run_id, label, created_at, algo_model, themes, n_baskets, hold_days, mean_basket_gain_pct, mean_vs_btc_pct, hit_rate_pct, baskets'
      - 'GET https://cymetica.com/api/v1/research-backtest/runs/defaults-theme-all-20260624T204140 -> keys: run_id, label, created_at, parameters, summary, rows'
      - 'GET https://cymetica.com/api/v1/research-backtest/runs -> best-params-macd-gated-20260624T200425 themes []; GET .../runs/best-params-macd-gated-20260624T200425 -> parameters.theme "defi tokens", parameters.themes []'
    body: >
      Either side can change: bring the schema to the answer or the answer to the schema.
      Our two checks read the newest run against the properties the schema lists, and every
      run on a named theme against its listed themes, so they clear whichever way it
      is fixed. Related, for the same page and not part of this report's checks: the
      Rally Card creation call (POST /research-backtest/runs/{id}/launch-rally-card) and
      GET /research-backtest/chart are used by the page but appear in neither /openapi-public.json
      nor /llms.txt; and the headline figures (table, tiles, GET /runs, the leaderboard) are
      before the run's own 0.6-point round-trip cost while the equity curve uses
      the net figure, without a label saying so.

  - key: nexus-plan-differs-between-usage-and-subscription
    findings: [CYM-the_account_has_one_plan_on_every_nexus_endpoint]
    severity: low
    category: logic
    url: https://cymetica.com/api/v1/nexus/subscription
    title: >-
      GET /nexus/subscription says plan "free" for an account that GET /nexus/usage says is
      on Pro
    expected: >
      One account has one plan. The word `plan` in a response that lists the plans
      (free / pro / max5 ...) names the same plan on every Nexus endpoint.
    actual: >
      Read with the same API key (account expire76, id 113) within a minute on
      2026-10-03: GET /api/v1/nexus/usage -> plan "pro", plan_name "Pro", price_usdc
      "20.00", extra_usage enabled. GET /api/v1/nexus/subscription -> plan "free", tier
      "free", is_premium false, subscription null, build_plans_enabled true, and a `plans`
      list that contains "pro". The two endpoints share the plan vocabulary and disagree
      about the account. An agent that reads the subscription endpoint concludes it is on
      Free (our own session did, and told its operator that the Pro plan had not arrived).
    steps:
      - 'GET https://cymetica.com/api/v1/nexus/usage (x-api-key) -> {"plan": "pro", "plan_name": "Pro", "price_usdc": "20.00", ...}'
      - 'GET https://cymetica.com/api/v1/nexus/subscription (same key) -> {"tier": "free", "plan": "free", "is_premium": false, "subscription": null, "build_plans_enabled": true, "plans": [{"code": "free"}, {"code": "pro"}, ...]}'
    body: >
      If /nexus/subscription is about the older premium subscription and not the build
      plans, then it should not carry a field called `plan` with the build-plan codes, or it
      should be renamed; if it is meant to show the build plan, it should read the same
      source as /nexus/usage. Our check compares the two `plan` values only when the
      subscription endpoint lists the usage plan among its own plans, so it clears
      whichever way this is fixed.

  - key: gem-screener-sectors-bubble-needs-two-clicks-with-a-mouse
    findings: [CYM-one_click_on_a_sectors_bubble_does_what_the_caption_says]
    severity: low
    category: ui_ux
    url: https://cymetica.com/gem-screener/app?view=sectors
    title: >-
      Gem Screener Sectors chart: "Click a bubble for the sector" takes two clicks with a
      mouse, because the first click pins the hover card that is already showing
    expected: >
      On a device with a mouse (hover: hover, pointer: fine), where hovering a bubble
      already shows its dark card, one click on a bubble opens that sector's detail
      panel, as the chart's caption says. Or, at the least, the caption says what one
      click does.
    actual: >
      With a mouse, the first click on a bubble changes nothing a visitor can see: it
      pins the dark card that the hover is already showing. The detail panel opens only
      on the second click on the same bubble. The caption under the chart, written in
      renderThemeScatter, still ends "Click a bubble for the sector." The cause is in the
      served script: a capture-phase document click listener for ".thcard.cardtip,
      #themeScatter g.pt" calls stopPropagation() and pinHost(el) on the first click,
      and only when popoverOwner === el does it close the card and let the click reach
      the bubble's own listener, which calls openThemePanel. Its comment reads "ET-28990
      #3: a click or tap on a hot-sector card or a point of the Sectors chart pins the
      same dark card hover and Tab show; a second click on the same one opens its detail,
      as before."
    steps:
      - 'Open https://cymetica.com/gem-screener/app?view=sectors in a desktop browser with a mouse (we used 1398 px wide).'
      - 'Hover the AI bubble: the dark card "AI · Hot" appears. Click it once: the card stays (#tip gets class "open"), and #themeBody stays hidden, so no panel opens.'
      - 'Click the same bubble again: the card closes and the side panel opens on "AI".'
      - 'GET https://cymetica.com/gem-screener/app?view=sectors -> the script has renderThemeScatter setting the caption to "... Click a bubble for the sector." and, after it, the capture-phase click listener commented "ET-28990 #3" that pins the card on the first click.'
    body: >
      We understand the two steps are deliberate (ET-28990 #3), and on a touch screen,
      which has no hover, the first tap is the only way to see the card. This report is
      about devices that do hover. There the card is already on screen before the
      click, so the first click looks broken, and the caption promises one click. Two
      fixes would clear it: keep the first-click card for touch only (for example when
      matchMedia("(hover: hover) and (pointer: fine)") does not match, or when the
      click's pointerType is not "mouse"), or make the caption say what one click does.
      What we verified: real mouse clicks on the AI bubble at 1398 px on 2026-10-04, and
      the served script. What we did not verify: a tap on a real touch screen. Our check
      reads the served script, so it clears either way. If the listener is rewritten so
      that the script alone cannot tell, the check reports that it cannot tell rather
      than passing.

  - key: chart-analyzer-verdict-fields-missing-from-openapi
    findings: [CYM-chart-analyzer-verdict-fields-are-in-its-openapi-schema]
    severity: low
    category: documentation
    url: https://cymetica.com/openapi-public.json
    title: >-
      Chart Analyzer: verdict, structures, setups, indicators and weekly_signal are not in
      /openapi-public.json, whose analyze schema forbids extra keys; /calls and
      /study/expert have empty schemas
    expected: >
      The fields Build it Better ET-29001 added are documented in /openapi-public.json, as
      the request asked and your answer says: the 200 schema of GET
      /api/v1/chart-analyzer/analyze lists verdict, structures, setups, indicators and
      weekly_signal (and swings, expert_study_url, calls_url, which every answer also
      carries), and GET /api/v1/chart-analyzer/calls and GET
      /api/v1/chart-analyzer/study/expert have 200 schemas that list their fields.
    actual: >
      Read repeatedly on 2026-10-04 between 07:29 and 08:33 UTC. The 200 schema of GET
      /api/v1/chart-analyzer/analyze lists 27 properties, none of them verdict,
      structures, setups, indicators, weekly_signal, swings, expert_study_url or
      calls_url, and sets additionalProperties: false, so a client that validates answers
      against the published schema rejects every answer. GET /api/v1/chart-analyzer/calls
      and GET /api/v1/chart-analyzer/study/expert are listed, each with a 200 schema of {}
      (no properties). llms.txt and /api-docs do describe the new fields in prose.
    steps:
      - 'GET https://cymetica.com/openapi-public.json -> paths["/api/v1/chart-analyzer/analyze"].get.responses["200"].content["application/json"].schema: additionalProperties false, 27 properties, no verdict / structures / setups / indicators / weekly_signal'
      - 'GET https://cymetica.com/api/v1/chart-analyzer/analyze?symbol=BTC&timeframe=1M&closed_only=true -> top-level keys include verdict, structures, setups, indicators, weekly_signal, swings, expert_study_url, calls_url'
      - 'The same document -> paths["/api/v1/chart-analyzer/calls"].get and paths["/api/v1/chart-analyzer/study/expert"].get: 200 schema {}'
    body: >
      Our check reads every top-level key of a live /analyze, /calls and /study/expert
      answer and fails while one is not listed in that endpoint's 200 schema (followed
      through $ref and allOf) with a type the schema allows, so it clears however the
      schema is written. Setting additionalProperties to true without listing the fields
      does not clear it, because the request asked for the fields to be documented.
      Related, in the same documents and not part of this check: the "Input" list in the
      Chart Analyzer section of llms.txt still says the timeframe is "1h, 4h, 1d (default)
      or 1w" (a later line lists 5d, 2w, 1M and auto), and the /api-docs endpoint table
      still says "timeframe 1h, 4h, 1d, 1w" and "Returns score 1-100, band, patterns[]
      ... rule, base_rate, as_of" for GET /analyze.

  - key: chart-analyzer-ledger-call-on-a-future-candle
    findings: [CYM-chart-analyzer-calls-are-on-closed-candles]
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/chart-analyzer/calls
    title: >-
      Chart Analyzer public ledger: a READY TO POP call for BTC/USDT 1h was recorded at
      06:21 UTC on 4 Oct on a candle that opens on 26 Oct, at a close of 229.26
    expected: >
      Every call in the public ledger is on a closed candle of the chart it names. The
      endpoint says "recorded when made (closed candles only)", and its rule says "A call
      is recorded once per chart, timeframe and closed candle".
    actual: >
      GET /api/v1/chart-analyzer/calls holds id "sym:BTC/USDT|1h|1792972800": who
      sym:BTC/USDT, timeframe 1h, made_at 2026-10-04T06:21:46+00:00, candle_time
      1792972800 (2026-10-26T00:00:00Z, 22 days after it was made), close 229.263278,
      verdict READY TO POP, probability 0.4734, base_rate 0.38, cases 39480, status open.
      BTC/USDT's own candles from the same API do not reach that price: its 110 monthly
      candles since 2017-08-01 range from 2,817 to 126,200. We cannot see how the row was
      written; we send no POST to the analyzer. When we first read the ledger at 07:30 UTC
      it held two calls, this one and COTI/USDT 1d (made 07:27 on the closed candle of 3
      Oct, whose close and verdict match the analyze answer). Read five more times up to
      08:36 UTC, unchanged.
    steps:
      - 'GET https://cymetica.com/api/v1/chart-analyzer/calls?limit=1000 -> calls[] holds {"id": "sym:BTC/USDT|1h|1792972800", "made_at": "2026-10-04T06:21:46+00:00", "candle_time": 1792972800, "close": 229.263278, "verdict": "READY TO POP", "status": "open", ...}'
      - '1792972800 is 2026-10-26T00:00:00Z; the call was made 2026-10-04T06:21:46Z'
      - 'GET https://cymetica.com/api/v1/chart-analyzer/analyze?symbol=BTC&timeframe=1M&include_candles=true&closed_only=true -> 110 monthly candles from 2017-08-01, lows and highs between 2,817 and 126,200'
    body: >
      Any fix that keeps the ledger to closed candles of the named chart clears it:
      remove the row, or give it a status other than open or scored with a reason (our
      check reads that as your correction), and close whatever path wrote it (we cannot
      see which). Our check reads /calls only, so it adds nothing to the ledger, and fails
      while any open or scored call was made before the candle it names had closed (1M
      closes on the 1st of the next month). So that the ledger's other rows do not
      surprise you: GET /analyze records every READY TO POP or READY TO DUMP it serves on
      a closed candle, whoever asks. 17 of the 19 calls on the ledger at 08:36 UTC were
      written by our own verification reads between 07:36 and 08:16 UTC; all of them are
      on closed candles.

  - key: chart-analyzer-probability-outside-its-own-range
    findings: [CYM-chart-analyzer-probability-lies-inside-its-range]
    severity: low
    category: logic
    url: https://cymetica.com/chart-analyzer?symbol=SOL&tf=5d
    title: >-
      Chart Analyzer: in 25 of 105 usable calibration bins the calibrated probability lies
      outside the 95% range given with it (5d: 43.1% shown with a range of 59.5% to 68.1%)
    expected: >
      A probability and its 95% range belong together (llms.txt: `range` is "the 95% range
      of that probability"): the probability lies inside the range shown with it, in the
      calibration tables of /study/expert and on every answer's verdict.up and
      verdict.down, which the page prints under "The numbers".
    actual: >
      In /study/expert (v3, generated 2026-10-04T06:17:59Z), 25 of the 105 calibration
      bins marked usable give a `calibrated` value outside that bin's `ci95`: 11 on 5d, 8
      on 1w, 5 on 1d, 1 on 4h. The widest: 5d up bin 9 (477 cases, bin rate 0.6394):
      calibrated 0.4307, ci95 0.5954-0.6812; 5d down bin 10 (477 cases): calibrated
      0.5575, ci95 0.3188-0.4046. The calibrated values look pooled across neighbouring
      bins (5d up bins 7 to 15 all read 0.4307, while their own rates run from 0.3836 to
      0.6394), but ci95 stays each bin's own interval. The answers carry the same pairs:
      GET /analyze?symbol=SOL&timeframe=5d&closed_only=true gives verdict.up calibrated
      0.4307 with range [0.5954, 0.6812] and verdict.down 0.5575 with range [0.3188,
      0.4046]. The page /chart-analyzer?symbol=SOL&tf=5d (forming candle) printed under
      "The numbers" at 07:57 UTC: "RISE FIRST 43.1% calibrated (raw model 51.3%); range
      49% to 56%; 855 calibration cases in this bin" and "FALL FIRST 55.8% calibrated (raw
      model 48.7%); range 43% to 50%". No label we saw was affected: in the bins that can
      give a label, the probability is inside its range.
    steps:
      - 'GET https://cymetica.com/api/v1/chart-analyzer/study/expert -> timeframes["5d"].calibration.up, bin 9: {"n": 477, "rate": 0.6394, "calibrated": 0.4307, "ci95": [0.5954, 0.6812], "usable": true}'
      - 'GET https://cymetica.com/api/v1/chart-analyzer/analyze?symbol=SOL&timeframe=5d&closed_only=true -> verdict.up {"calibrated": 0.4307, "range": [0.5954, 0.6812], ...}, verdict.down {"calibrated": 0.5575, "range": [0.3188, 0.4046], ...}'
      - 'Open https://cymetica.com/chart-analyzer?symbol=SOL&tf=5d and click "The numbers" -> the rise-first and fall-first lines, each with a probability outside the range beside it'
    body: >
      Either of two fixes clears it, and the choice is yours: give the range of the value
      you show (for a pooled value, the interval over the pooled cases), or show the
      bin's own rate with its own range. Our check reads every usable bin of /study/expert
      and the up and down sides of three 5d answers (SOL, BTC, ETH; 5d never carries a
      label, so these reads add nothing to the public ledger), and fails while a
      probability lies outside the range given with it, allowing 0.0001 for rounding.

  - key: chart-analyzer-dex-pool-coin-gets-a-verdict-llms-says-none
    findings: [CYM-chart-analyzer-dex-pool-coin-gets-no-verdict-as-documented]
    severity: low
    category: documentation
    url: https://cymetica.com/llms.txt
    title: >-
      Chart Analyzer: llms.txt says a DEX-pool coin gets no verdict, but Gem Screener coins
      read from their DEX pool get READY TO POP / READY TO DUMP and enter the public ledger
    expected: >
      What the Chart Analyzer section of llms.txt says holds: "A verdict is given for symbol
      pairs the study covers; a DEX-pool coin or your own candles get the drawings and the
      setups with coverage_note saying the asset is not covered", and "a DEX-pool coin gets
      the drawings and setups but no verdict (coverage_note)". Or the documents agree with
      the page about what a DEX-pool coin gets.
    actual: >
      On 1h, Gem Screener coins read by contract from their DEX pool are labelled. At
      07:45-07:48 UTC on 2026-10-04: SKY (ethereum
      0x56072c95faa701256059aa122697b133aded9279) READY TO POP, 0.4734 against a base rate
      of 0.38 on 39,480 cases; XVS (bsc 0xcf6bb5389c92bdda8a3747ddb454cb7a64626c63) and
      PENDLE (bsc 0xb3ed0a426155b79b898849803e3b36552f7ed507) READY TO DUMP. In three
      reads between 08:15 and 08:33 UTC, LDO (polygon
      0xc3c7d422809852031b44ab29eec9f1eff2a58756) READY TO DUMP, 0.435 against 0.3833 on
      172,454 cases. Each answer has verdict.coverage
      "asset_not_covered" and the coverage_note "This asset's candles were not in the
      study (it measured exchange candles; these come from a DEX pool or your file). The
      same table is applied; the probability is the study's, not this asset's own." The
      public ledger records them as contract: calls. The study's limits say the same table
      is applied to a DEX pool's candles "and the page says so"; llms.txt says no verdict.
      The request asked that records be measured on the same kind of candles the score is
      computed on.
    steps:
      - 'GET https://cymetica.com/llms.txt -> section "## Chart Analyzer": "... a DEX-pool coin gets the drawings and setups but no verdict (`coverage_note`)."'
      - 'GET https://cymetica.com/api/v1/chart-analyzer/analyze?contract=0xc3c7d422809852031b44ab29eec9f1eff2a58756&chain=polygon&timeframe=1h&closed_only=true -> verdict.label "READY TO DUMP", probability 0.435, base_rate 0.3833, cases 172454, coverage "asset_not_covered" (a 1h label changes with the hour; any DEX-pool coin whose up/down figures qualify shows it)'
      - 'GET https://cymetica.com/api/v1/chart-analyzer/calls -> rows whose who starts with "contract:", e.g. contract:ethereum:0x56072c95faa701256059aa122697b133aded9279 READY TO POP'
    body: >
      Which way to resolve it is yours: withhold the label for a DEX-pool coin, as llms.txt
      says and as the request asked (records on the same kind of candles), or change
      llms.txt to say that the same table is applied and a label can be given beside the
      coverage note. Our check reads the promise from the Chart Analyzer section of
      llms.txt; while it is there, it reads up to 8 Gem Screener coins on 1h and fails if
      one whose own up/down figures qualify under your published rule (5 points over the
      base rate, the range above it, 300 or more cases) carries a label. It stops at the
      first such coin, so it adds at most one call to the ledger per run. If the sentence
      is removed, our check reports that it can no longer tell rather than calling it
      fixed. The contract: rows on the ledger are ours: GET /analyze records each label it
      serves, and our reads requested these coins.

  - key: supply-analyzer-burned-slice-is-max-minus-total
    findings: [CYM-supply-analyzer-burned-slice-is-a-measured-burn]
    severity: medium
    category: logic
    url: https://cymetica.com/supply-analyzer?symbol=ore
    title: >-
      Supply Analyzer: "Bought back, burned" is max supply minus total supply, so supply not
      minted yet is shown as burned (ORE 83% of its pie) while the record lists burns as unknown
    expected: >
      The "Bought back, burned" slice holds tokens that were burned, from a source that
      measures burns, as the page promises every figure "with its source and date". Where no
      burn is measured, the record does not show one: your own text says burns are "named as
      unknown" and "Unknown never counts as good". Supply that has not been minted yet stays
      in the reserve that pays emissions.
    actual: >
      Read on 2026-10-04 between 08:45 and 10:09 UTC, three times. 81 of the 244 rows of
      /batch/gem-screener show a burned slice. In each of the 12 records with the largest
      burned share, the only input behind it is burned_so_far, source "max supply minus total
      supply (CoinGecko figures)", as_of null, and the same record lists burns as unknown
      ("Fee and supply burns a month are not on any feed we read; counted as 0."): RUSH
      2,056,917 (98.4% of the pie), PHAR 469,371,969 (93.3%), BEAN 2,861,934 (93.0%), RAM
      756,287,109 (90.1%), STG 879,202,268 (87.9%), ORE 2,499,496 (83.3%), and six more. For
      a token still being minted, max minus total is supply not issued yet, and taking it
      out of the reserve also stops the emissions the record itself knows: ORE's record
      carries emissions_month 42,097.5 (DeFiLlama unlock schedule) but a reserve of 40.11, so
      month 0 counts 40.11 new tokens; ORE is shown -52.11% a year, 10/10 Squeezing, "Buybacks
      outweigh new tokens 543 to 1", and its 24-month curve reaches 0 in September 2028. The
      Gem Screener snapshot records $3,000,944 of ORE emissions in 30 days (1.07% a week). Of
      the 12 sampled records, 5 count less than 90% of their own emission input in month 0:
      BEAN 42,825 a month, 0 counted (-190.89% a year, Squeezing); STREAM 6,868,132, 0
      counted; STG 1,442, 0 counted; MOR 349,870, 294,470 counted; ORE as above.
    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/batch/gem-screener -> 81 items with slices_today[key=bb_burned].amount > 0'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=ore-protocol -> slices_today bb_burned 2499495.62 (share_pct 83.32); inputs[key=burned_so_far] source "max supply minus total supply (CoinGecko figures)", as_of null; inputs[key=emissions_month] value 42097.5; unknown[input=burns] "counted as 0"; reserve_today 40.11; months[0].in.emissions 40.11; yearly_pct -52.11, pressure 10, band Squeezing'
      - 'GET https://cymetica.com/api/v1/gem-screener -> apps[slug=ore-protocol].dilution: week_pct 1.0707, basis "emissions", emissions_usd30 3000944.31'
    body: >
      How to fix it is yours: show a burned amount only where a source measures one (a burn
      address, a published burn), and leave max minus total supply in the reserve, or name
      it "not minted or burned: unknown". Our check reads the 12 rows of the batch with the
      largest burned share (a sample of a population that moves with every refresh) and fails
      while any of them takes its burned amount only from max supply minus total supply. It
      does not decide which tokens really burned: for some (BNB, for example) the difference
      is a burn, for ORE and BEAN it is supply not minted yet, and the record cannot tell the
      reader which. Every Supply Analyzer read of this check names a Gem Screener coin, so
      none adds a line to your weekly ledger.

  - key: supply-analyzer-payouts-booked-as-buybacks
    findings: [CYM-supply-analyzer-buyback-is-a-purchase-of-the-token]
    severity: medium
    category: logic
    url: https://cymetica.com/supply-analyzer?symbol=giga
    title: >-
      Supply Analyzer: fees paid out to ve-lockers and voters are counted as buybacks of the
      token, so coins whose fees are paid out show as Squeezing (9 of 23 sampled)
    expected: >
      /api/v1/supply-analyzer/definitions: "Buybacks: DeFiLlama's holders' revenue of the last
      30 days (the share of fees that buys the token), at today's price." A buyback is taken
      out of the sellable pile only where that revenue buys the token. Where DeFiLlama's
      methodology says the revenue is paid out to lockers, voters or stakers, nothing is
      bought and the pile does not shrink.
    actual: >
      Read on 2026-10-04 between 09:45 and 10:09 UTC, three times. A sample: the 23 rows of
      /batch/gem-screener shown Squeezing (pressure 8-10) or whose sellable pile reaches 0
      inside its 24-month curve. For 9 of them the record's buyback_month comes from
      DeFiLlama holders' revenue of protocols whose DeFiLlama HoldersRevenue methodology
      describes only a payout: BEND, Squeezing, -102.81% a year, 418,956,196 tokens "bought"
      a month from $17,308 ("Protocol's share of borrow interest, 100% distributed to veBEND
      holders proportionally."); GIGA, Squeezing, -582.19% ("Share of swap fees distributed
      to veGIGA stakers (all of the protocol's share)."); ABX, Squeezing, -346.69% ("... forwarded
      to veABX voters ..."); TITN, Squeezing, -191.16% ("50% of THORChain/Maya/Near Intents fees
      distributed to $TITN stakers ..."); KITTEN, Squeezing, -78.91% ("100% of swap fees are
      distributed weekly to veKITTEN voters/holders."); BLACK, Squeezing, -61.45% ("...
      distributed to veBLACK voters"); RAM, Squeezing, -41.49% ("Swap fees and bribes going to
      holders."); MET, Squeezing, -6.89% ("MET distributed to holders."); TOPAZ, Flooding,
      whose pile reaches 0 ("Entire swap fees and bribes go to holders"). Six of these piles
      reach 0 inside the curve (GIGA in 3 months, ABX 4, TITN 7, TOPAZ 15, KITTEN 16, BLACK
      20). The other 14 rows were not
      judged: their methodology names buying (PONS "used to buyback and burn", BEAN, ORE and
      others) or says neither. In a wider read the same morning (the 15 records with the
      largest buyback against their pile), 12 were of this kind, adding PHAR, UP, HYBR and
      NEST, which are shown Flooding.
    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=giga -> inputs[key=buyback_month] value 28225411.0, source "DeFiLlama holders'' revenue, last 30 days (GIGA V2, GIGA V3), at today''s price", note "$184,576 in 30 days"; yearly_pct -582.19; band Squeezing'
      - 'GET https://api.llama.fi/summary/fees/giga?dataType=dailyHoldersRevenue -> childProtocols[name=GIGA V2].methodology.HoldersRevenue "Share of swap fees distributed to veGIGA stakers (all of the protocol''s share)."'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/definitions -> sources and definitions: buybacks are holders'' revenue, "the share of fees that buys the token"'
    body: >
      How to fix it is yours: count holders' revenue as a buyback only where the protocol buys
      its token (DeFiLlama's breakdownMethodology names the stream for most protocols), and
      otherwise name buybacks as unknown. Our check reads the batch, takes the rows shown
      Squeezing or whose pile reaches 0, and for each one whose buyback comes from holders'
      revenue reads DeFiLlama's methodology for every protocol the record names. It fails
      while one is booked as a buyback although every one of those sentences describes a
      payout and none describes buying; a sentence that names any buying, or says neither, is
      not judged. It is a sample of a population that moves with every refresh. Every Supply
      Analyzer read names a Gem Screener coin, so none adds a line to your weekly ledger.

  - key: supply-analyzer-pile-larger-than-supply
    findings: [CYM-supply-analyzer-sellable-pile-fits-inside-the-supply]
    severity: medium
    category: logic
    url: https://cymetica.com/supply-analyzer?symbol=curve-finance
    title: >-
      Supply Analyzer: in 17 records the sellable pile is larger than the total supply the same
      record states (CRV 3.25B against 2.42B, THOR 600M against 253M)
    expected: >
      The sellable pile ("the tokens in circulation that are not locked, plus the staked
      tokens that can leave at any time") is part of the supply, so it is never larger than
      the total supply the record states.
    actual: >
      Read on 2026-10-04 between 09:41 and 10:09 UTC, three times. 17 records state a
      pile_today larger than their own total_supply. In every one the pile is circulating
      plus staked_total, with circulating_includes_staked false: CRV pile 3,245,081,474
      against total_supply 2,422,992,570 (circulating 1,570,993,126 plus staked
      1,674,088,348); THOR 599,595,886 against 253,198,973; FOX 29,882,588 against 10,321,540;
      RAIL 142,343,727 against 60,000,000; GMX 22,800,370 against 10,460,789; BIFI 187,035
      against 80,000; also INV, OHM, LON, LQTY, USUAL, CVX, BEAN, VVV, OGN, PENDLE, RSUP. In 10
      of them staked_total alone ("DeFiLlama protocol staking TVL at today's price") is larger
      than the total supply (BIFI: 107,035 staked of 80,000). For CRV the pie's tokens in play
      (3,852,391,935) then exceed the max supply (3,030,303,031), the reserve is set to 0, and
      the emissions paid from the reserve drop to 0 too: the record knows 8,777,646 new CRV a
      month and counts none.
    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=curve-finance -> pile_today 3245081474.0, total_supply 2422992570.14, circulating 1570993126.0, inputs[key=staked_total] 1674088348.26 "DeFiLlama protocol staking TVL at today''s price", circulating_includes_staked false, reserve_today 0.0'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=beefy -> pile_today 187034.52, total_supply 80000.0, max_supply 80000.0, staked_total 107034.52'
    body: >
      Two things go wrong here, as far as we can see from the outside: staking TVL divided by
      the price can count more than the token (BIFI, OHM, GMX: staked above the total supply),
      and staked tokens are added on top of a circulating figure that, for these tokens, may
      already contain them. How to fix it is yours. Our check preselects the rows whose pile
      exceeds the total supply in the Gem Screener snapshot (or that have staking and no
      total there), reads each record, and fails while one states a pile larger than its own
      total_supply (its max_supply when it states no total). A row that crosses between the
      two snapshots can be missed, so it is a sample. Every Supply Analyzer read names a Gem
      Screener coin, so none adds a line to your weekly ledger.

  - key: supply-analyzer-hyperliquid-sources-and-link
    findings: [CYM-supply-analyzer-cited-sources-say-what-they-are-credited-with, CYM-supply-analyzer-gem-screener-link-opens-its-coin, CYM-supply-analyzer-typical-inflow-is-the-stated-one]
    severity: medium
    category: logic
    url: https://cymetica.com/supply-analyzer?symbol=HYPE
    title: >-
      Supply Analyzer, Hyperliquid: "kept" credited to a page that says burned, a dead vesting
      link, a Gem Screener link that opens "Not in the Gem Screener", and a 5.0% typical inflow
    expected: >
      Every figure carries a source that says it (the page: "Every input with source and
      date"). The Gem Screener's "Open in Supply Analyzer" opens the coin: OpenAPI says symbol
      takes a "Ticker (Gem Screener coins), slug or CoinGecko id". An unknown inflow counts
      as "the typical token's (the median of the tokens with data)", one figure, which
      /definitions states.
    actual: >
      Read on 2026-10-04 between 08:45 and 10:09 UTC, three times. (1) HYPE's record says the
      buyback is "kept" and credits "Hyperliquid docs: Fees (Assistance Fund) and HYPE burn",
      https://hyperliquid.gitbook.io/hyperliquid-docs/trading/fees; the page shows it under
      "Sources that disagree" as the project's docs saying kept. That page, read the same
      morning, says "HYPE in the assistance fund is burned". (2) The vesting schedule is
      cited to https://hyperliquid.gitbook.io/hyperliquid-docs/hyperliquid-l1/hype-and-staking,
      which answers 404. (3) The Gem Screener's link on both Hyperliquid rows is
      /supply-analyzer?symbol=hyperliquid (the coin's CoinGecko id); the API answers 404
      UNKNOWN_SYMBOL "No token called HYPERLIQUID is in the Gem Screener" and the page shows
      "Not in the Gem Screener". symbol=HYPE works. (4) /definitions states a typical inflow of
      12.34% a year, and the page's "How the numbers are made" prints "12.3% of the pile a
      year". HYPE's range adds 5.0% ("the typical token's (5.0% a year)" on the same page):
      24.73% to 29.73%. Across the batch, 174 of 185 ranges add a figure other than the
      stated 12.34%: 5.0% on 57, 10.68% on 31, 15.08% on 28, 12.88% on 24, and five others.
    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=HYPE -> inputs[key=buyback_disposition] value "kept", url https://hyperliquid.gitbook.io/hyperliquid-docs/trading/fees; inputs[key=vesting_schedule] url https://hyperliquid.gitbook.io/hyperliquid-docs/hyperliquid-l1/hype-and-staking; typical_inflow_pct 5.0; yearly_range [24.73, 29.73]'
      - 'GET https://hyperliquid.gitbook.io/hyperliquid-docs/trading/fees -> "HYPE in the assistance fund is burned, removing the tokens permanently from the circulating and total supply."'
      - 'GET https://hyperliquid.gitbook.io/hyperliquid-docs/hyperliquid-l1/hype-and-staking -> HTTP 404'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=hyperliquid -> HTTP 404 UNKNOWN_SYMBOL'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/definitions -> typical_inflow_pct 12.34290441022498'
    body: >
      Hyperliquid is the request's own worked example, so these are the first things a reader
      checks. Not part of our checks, and not a claim that you are wrong: the record puts the
      next core-contributor unlock at 2026-10-28 (23.7 days); third parties put the monthly
      date on the 6th: Tokenomist ("The next unlock for Hyperliquid is scheduled for October
      6, 2026. Released to Core Contributors."), the Blockworks token transparency filing for
      HYPE (9.92 million HYPE "on September 6, 2026", vesting "completing between 2027 and
      2028", the record's last tranche is 2027-10-28), and CoinMarketCap quoting the
      co-founder ("on the sixth of each month"). We found no primary Hyperliquid page with the
      schedule. Our checks: one reads every url HYPE's record cites for a hand-entered input
      and fails on a 404 or on a page that contradicts what it is credited with; one resolves
      every link identifier the Gem Screener uses for more than one row (today only
      "hyperliquid"); one compares the width of every range in the batch with the typical
      inflow /definitions states. Every Supply Analyzer read names a Gem Screener coin, so
      none adds a line to your weekly ledger.

