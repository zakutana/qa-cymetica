      Read on 2026-10-18 around 08:19 UTC. Rainbow (RNBW): tiles.dilution_12m pct 64.35, new_tokens_12m
      115,833,333 against 180M circulating, month_tokens 0, kinds [], schedule_known true. GET /analyze for
      RNBW shows where the 115.8M come from: months[0] to months[2] take in 0, months[3] takes in 69.5M of
      vesting (next_unlock: 2027-02-05, Investors and Team), months[4] to months[11] 5.79M of vesting each. So
      the 64.3% is right and all of it is vesting, but the Supply column's tooltip, the coin drawer's Supply
      tile and the Supply Analyzer page's tile all read "0 new RNBW a month · " and stop. kinds, like
      month_tokens, describes only the first of the 12 months, so it is empty whenever that month brings
      nothing. Four more rows read the same: Kinetiq (KNTQ) +45.1%, 142.1M new, next 12.9M on 2026-11-28 to
      Core Contributors and Investors; HumidiFi (WET) +167.4%, 385.0M new, next 192.5M on 2026-12-04 to
      Ecosystem, Foundation and Labs; Lighter (LIT) +53.3%, 133.2M new, next 8.2M on 2027-01-16 to Investors
      and Team; edgeX (EDGE) +4.2%, 14.6M new, next 2.1M on 2027-03-31 to Ecosystem & Community.
    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/batch/gem-screener -> items[token.slug=rainbow].tiles.dilution_12m: pct 64.35, new_tokens_12m 115833333.36, month_tokens 0.0, kinds []; next_unlock: ts 1801785600, tokens 69500000, who "Investors, Team"'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=RNBW -> months[0..2].in.total 0; months[3].in.vesting 69500000; months[4..11].in.vesting 5791666.67 each; together 115833333'
      - 'GET https://cymetica.com/gem-screener/app?view=apps -> saDilLine (Supply column tooltip) and the drawer tile: saTok(d.month_tokens) + '' new '' + sym + '' a month · '' + (d.kinds || []).join('' + '')'
      - 'GET https://cymetica.com/static/js/supply-analyzer.js -> tile 3: tok(g.month_tokens) + '' new '' + sym + '' a month · '' + (g.kinds || []).join('' + '')'
    body: >
      A red +64.3% stands over a line that names no source, on the three surfaces that show it. Naming the
      kinds of the whole 12 months (here "vesting") would fix it; the monthly figure can stay the first
      month's. Low: the percentage itself is right. Our check passes when every row with new tokens in its
      next 12 months names at least one kind, and is inconclusive if the line stops joining kinds after "a
      month · ". GET requests only.

  - key: traffic-mine-page-promises-the-api-key-the-endpoint-refuses
    findings: [CYM-traffic-mine-accepts-the-key-its-page-names]
    severity: low
    category: documentation
    url: https://cymetica.com/traffic/mine
    title: >-
      /traffic/mine tells AI agents to call GET /api/v1/traffic/mine with their API key as X-API-Key, but the
      endpoint answers 401 "Sign in" to that key
    expected: >
      The page's "For AI agents - copy & paste" prompt says: "Traffic for every public page you created
      (features, Build it Better apps, companies, event cards, creator perps, Agent League pages): GET
      https://cymetica.com/api/v1/traffic/mine?days=14 with your api_key as X-API-Key." So the endpoint accepts
      the API key in X-API-Key and answers with the account's traffic, or the prompt stops telling agents to
      use the key.
    actual: >
      Read on 2026-10-18 around 11:55 UTC, twice. GET https://cymetica.com/api/v1/traffic/mine?days=14 with
      our API key in the X-API-Key header answers HTTP 401, content-type application/json, body
      {"detail":"Sign in to see traffic for what you created."}. The same key in the same header answers HTTP
      200 on GET https://cymetica.com/api/v1/company/mine, so the key is valid and recognised. The sentence
      above is the data-agent-prompt attribute of the element #agentPasteBar on the page, and is shown beside
      a Copy button as the text for an agent to paste.
    steps:
      - 'GET https://cymetica.com/traffic/mine -> <div class="agent-paste-bar" id="agentPasteBar" data-agent-prompt="Traffic for every public page you created (...): GET https://cymetica.com/api/v1/traffic/mine?days=14 with your api_key as X-API-Key. ...">'
      - 'GET https://cymetica.com/api/v1/traffic/mine?days=14 with header X-API-Key: <your api_key> -> HTTP 401 {"detail":"Sign in to see traffic for what you created."}'
      - 'GET https://cymetica.com/api/v1/company/mine with the same header X-API-Key: <your api_key> -> HTTP 200'
    body: >
      An agent that follows the page's own prompt cannot read the traffic it is told it can read, and gets a
      "Sign in" message that offers it no other credential to use. Accepting X-API-Key on the endpoint, or
      removing the sentence about the key from the prompt, would fix it. Low: the page's instruction is
      wrong, nothing is exposed. Our check passes when the endpoint answers 200 to the key, and is inconclusive
      if the prompt stops naming X-API-Key for that endpoint. GET requests only.

