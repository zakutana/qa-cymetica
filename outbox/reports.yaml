    url: https://cymetica.com/api/v1/launchpad/onchain/tokens?chain_id=4663
    title: >-
      launchpad_list_tokens lists the 5 test launches that GET /launchpad/onchain/tokens keeps behind
      include_internal ("Admin/debug") on chain 4663
    expected: >
