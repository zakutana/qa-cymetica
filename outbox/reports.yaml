      - 'GET https://cymetica.com/api/v1/agent-tournaments/seats/57/bot-settings (X-API-Key) -> 200 {"seat_id": 57, "table_id": 13, "bot": "lab Wave 2 Fibonacci Phoenix", "can_change": true, ...}'
