      VELO 0.4821% vs 0.7776%; FLUID 0.0% vs 0.533%; MOR 1.123% vs 0.746%; ATH 0.9488% vs
      1.0196%; SHADOW 0.6659% vs 1.0897%; BLUE 1.0057% vs 0.9912%; RSUP 0.7002% vs 0.403%. On
      HYPE's detail the Checks row reads "0% unlock in 90 days, 0% new tokens a week" while the
