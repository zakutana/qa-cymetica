  - key: clone-summary-line-leaves-markets-out
    findings: [CYM-clone-summary-names-every-market-it-trades]
    severity: low
    category: logic
    url: https://cymetica.com/api/v1/cloned-bots/my-clones?mode=paper
    title: >-
      Clone summary line (ET-28100 item 1): 30 of our 41 paper clones trade nine 5-min-epoch markets and read
      "BTC/ETH/VAIX/SBIO 5-min epochs" with no "+5"; a clone with both lists off reads "CLOB NONE"
    expected: >
      Your ET-28100 item 1 message: the line "is built from the bot's live settings: perpetual epochs, CLOB pairs,
      arena, ..." and agents get the same line as trades_summary from GET /api/v1/cloned-bots/{id}/profile. The
      settings form reads a market list as "'NONE' = explicitly off, CSV = those symbols". So the line names every
      market the settings switch on, or counts the rest the way its own CLOB part does ("+N" past four), and never
      prints a list that is off as a market.
    actual: >
      Read on 2026-10-11 between 12:13 and 12:16 UTC with our own key: my-clones?mode=paper and each of our 41 paper
      clones' /profile. 30 clones have perpetual_markets "BTC,ETH,VAIX,SBIO,ET10,ETLP,CYM42,TBIG,TBIGS" and a
      trades_summary of "This bot trades: BTC/ETH/VAIX/SBIO 5-min epochs (paper)", some with " · Arena headline
      assets": ET10, ETLP, CYM42, TBIG and TBIGS are neither named nor counted. One clone (f6af3fd1) has
      custom_markets "NONE" and perpetual_markets "NONE" and reads "This bot trades: CLOB NONE · Arena headline
      assets (paper)". The page's client-side twin of the rule (static/js/cloned-bot-profile.js,
      ClonedBotProfile.tradesSummary) shows both: the epochs part is perp.slice(0, 4).join('/') with no count,
      while the CLOB part uses listed(), which adds " +N" past four; and custom_markets "NONE" is split as a symbol.
    steps:
      - 'GET https://cymetica.com/api/v1/cloned-bots/my-clones?mode=paper (X-API-Key) -> 41 paper clones'
      - 'GET https://cymetica.com/api/v1/cloned-bots/{id}/profile for clone 3453bac2 (X-API-Key) -> settings.perpetual_markets "BTC,ETH,VAIX,SBIO,ET10,ETLP,CYM42,TBIG,TBIGS", trades_summary "This bot trades: BTC/ETH/VAIX/SBIO 5-min epochs · Arena headline assets (paper)"'
      - 'GET the same for clone f6af3fd1 -> settings.custom_markets "NONE", settings.perpetual_markets "NONE", trades_summary "This bot trades: CLOB NONE · Arena headline assets (paper)"'
      - 'GET https://cymetica.com/static/js/cloned-bot-profile.js -> tradesSummary: perp.slice(0, 4).join(''/'') + '' 5-min epochs''; ''CLOB '' + listed(clob), listed() adding '' +'' + (items.length - 4)'
    body: >
      How to fix it is yours: name all the epoch markets or count the rest as the CLOB part does, and treat 'NONE'
      as off there too. The line itself is there: all 41 of our paper clones carry it, and 10 of them read
      right. Our check reads our own paper clones'
      profiles with our key, GETs only, and fails while a trades_summary leaves a switched-on market out without
      a count covering it, or prints a list set to 'NONE' as a market.

