  - key: supply-analyzer-next-unlock-is-one-recipient-of-its-day
    findings: [CYM-supply-analyzer-next-unlock-states-its-whole-day]
    severity: low
    category: logic
    url: https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=arbitrum
    title: >-
      Supply Analyzer: next_unlock carries one recipient's tranche of its day: ARB 56.1M (Team) on Oct 16 while
      the record's own tranches release 92.6M that day; 12 of the 20 largest dated coins
    expected: >
      The next unlock a record serves says what unlocks on that day: when the record's own tranches put several
      recipients on the next unlock's date, next_unlock carries that day's total, or names every recipient of it.
      We read it by its name, because nothing defines it: /api/v1/supply-analyzer/definitions has no line on it,
      and openapi-public.json types it as an object with no properties.
    actual: >
      Read on 2026-10-11 between 12:13 and 12:16 UTC (and at 11:15). ARB: next_unlock {ts 1792108800 (2026-10-16),
      tokens 56,125,000, who "Team, Contributors & Advisors"}, while the same record's today.tranches and
      months[0].tranches hold two tranches at ts 1792108800: 56,125,000 to Team, Contributors & Advisors and
      36,520,833 to Investors, 92,645,833 in all. Of the 20 dated rows of the Gem Screener batch with the largest
      market cap, 12 are short the same way, among them PUMP 4,166,666,667 (Team) of 6,875,000,000 on 2026-10-13
      (Existing Investors 2,708,333,333 the same day), MON 4,925,000,000 of 5,912,500,000 on 2026-11-25, STABLE
      694,444,444 of 1,388,888,889 on 2027-01-08 and XPL 69,444,444 of 227,777,778 on 2026-10-26. The batch, which
      llms.txt describes as what the Gem Screener's Supply column and card read, serves the same next_unlock object.
    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=arbitrum -> next_unlock {"ts": 1792108800, "tokens": 56125000.0, "who": "Team, Contributors & Advisors"}; today.tranches: {"ts": 1792108800, "amount": 56125000.0, "who": "Team, Contributors & Advisors"}, {"ts": 1792108800, "amount": 36520833.33, "who": "Investors"}, {"ts": 1794268800, "amount": 15400410.68, "who": "Foundation"}'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=pump -> next_unlock 4166666666.67 "Team" at 1791849600; tranches at that ts: Team 4166666666.67, Existing Investors 2708333333.33'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/batch/gem-screener -> items[token.slug=arbitrum].next_unlock: the same object'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/definitions and /openapi-public.json -> no definition of next_unlock ("next_unlock": {"type": "object", "properties": {}})'
    body: >
      How to fix it is yours: carry the day's total in next_unlock (in tokens or in a field of its own), or list
      every recipient of that day, and say in /definitions and the schema what next_unlock is. An agent or a page
      reading next_unlock for ARB prepares for 56.1M tokens on Oct 16; the record's own schedule releases 92.6M.
      Not about which recipient it names or whether the schedule is right. Our check reads the batch and the
      records of the 20 dated rows with the largest market cap, anonymously, and fails while a record's
      next_unlock carries less than its own tranches put on that day and neither states the day's total in any
      field nor names every recipient of it. Every Supply Analyzer read names a Gem Screener coin, so none adds a
      line to your weekly ledger.

  - key: movers-page-ranks-the-first-100-cards
    findings: [CYM-movers-page-ranks-every-event-card]
    severity: medium
    category: logic
    url: https://cymetica.com/movers
    title: >-
      /movers ranks only the first 100 of 641 event cards: its biggest loser is TTD -19.17% while Corteva is at
      -83.92%; none of the true ten biggest losers is among the cards it reads
    expected: >
      The page says "What is hot on EventTrader right now, products only: event cards, index funds and platform
      tokens ranked by move and by activity", and llms.txt lists it as "Biggest gainers, losers and most active
      across EventTrader's own products". So "Biggest gainers" and "Biggest losers" rank every card of the live
      listing, not one page of it.
    actual: >
      Read on 2026-10-11 between 12:13 and 12:16 UTC (also 2026-10-10 at 22:00 and 2026-10-11 at 11:20). The page's
      board script fetches /api/v1/event-cards/?limit=100 once, with no offset; the listing's total is 641 and the
      endpoint refuses limit=500 with HTTP 422, so the boards rank the first 100 of 641 cards. Over every card, by
      the page's own move (current_index / index_base - 1), the biggest loser is SAIB: CTVA (Corteva) at -83.92%,
      then "Traders are skeptical of Iran timeline for Strait of Hormuz" -47.79% and SAIB: BULL (Webull) -35.42%;
      the page's biggest loser is SAIB: TTD (Trade Desk) at -19.17%. None of the true ten biggest losers is among
      the cards the page reads, and 7 of the true ten biggest gainers are not either, among them SAIB: MRNA
      (Moderna) +54.91% and SAIB: PTC +42.30%.
    steps:
