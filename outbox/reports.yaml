      On 2026-09-23 card 5d91bf43-a597-47b0-9abe-5c7f52618bbd ("AIB-Privacy --
      Privacy Crypto Index Basket", evcdx_symbol AIB-PRIVACY, pw_live false)
      read status live, tradeable_now true, trading_blocked_reason null. With
      the account in simulation_mode and sim_balance.usdc 88598.91, POST
      /api/v1/event-cards/{id}/buy with {"amount_usdc": 480.36, "paper":
      true} answered HTTP 409 {"detail": "Insufficient USDC balance: you have
      7.650006."} at 05:59:13 and again at 06:00:24 UTC. A paper buy of 5 USDC
      on another card from the same account (30015006-abff-44b6-bdb0-
      f659faf4f3f4, no EVCDX symbol, pw_live true) was accepted at 06:01:16.
      7.650006 is neither the paper book nor the balance_usdc
      /api/v1/account/me reports (0.00).
    steps:
      - 'GET https://cymetica.com/api/v1/account/me -> simulation_mode true, sim_balance.usdc "88598.91"'
      - 'GET https://cymetica.com/api/v1/event-cards/5d91bf43-a597-47b0-9abe-5c7f52618bbd -> status live, tradeable_now true, trading_blocked_reason null, evcdx_symbol "AIB-PRIVACY"'
      - 'POST https://cymetica.com/api/v1/event-cards/5d91bf43-a597-47b0-9abe-5c7f52618bbd/buy {"amount_usdc": 480.36, "paper": true} -> 409 {"detail": "Insufficient USDC balance: you have 7.650006."}'
      - 'The same POST on 30015006-abff-44b6-bdb0-f659faf4f3f4 with {"amount_usdc": 5, "paper": true} -> 200 with a position_id'
    body: >
      The buy appears to be checked against a balance other than the paper
      book -- which one, only you can say; the card carrying an EVCDX token
      listing is the visible difference from the card that took the order.
      Your Nexus picked this card for a paper trade (NEX-0088, "status =
      live, tradeable_now = true"), so an agent following it on paper cannot
      open the position. Either the paper buy draws on the paper book, or
      tradeable_now reads false for a paper account on cards it cannot buy,
      with the reason.

      Our check places no order: it reads our own record of each buy -- the
      body sent, the card's gate and the paper book read just before -- and
      judges every card ever refused this way by its newest buy. It goes
      green when a paper buy of that card is accepted.

  - key: creator-leads-tool-filter-falls-through-on-unknown-values
    findings:
      - CYM-creator-reddit-leads-tool-filter-honours-unknown-values
      - CYM-creator-twitter-leads-tool-filter-honours-unknown-values
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/creator/reddit-leads
    title: "The `tool` filter on the creator lead queues (reddit-leads, twitter-leads) returns the whole queue for a value that matches no real tool"
    expected: >
      openapi-public.json's own parameter description for `tool` on both
      GET /api/v1/creator/reddit-leads and GET /api/v1/creator/twitter-leads:
      "One queue per tool: a site path such as /pineconnector (or just
      pineconnector) keeps only threads whose best-matching page is that
      tool. Empty = every tool." The only stated case for "every tool" is an
      EMPTY value; a non-empty value that names no real site tool cannot be
      any lead's best-matching page, so the documented behaviour is an empty
      result, same as any other tool with nothing currently matching it.
    actual: >
      A real, currently-empty tool correctly returns zero leads -- the "no
      match" case works when the value is a real site path. A value that
      matches no real tool at all returns every lead the account has instead,
      spanning dozens of distinct tool_path values, on both endpoints. The
      parameter is read and does narrow for a real value (?tool=/build and
      the doc's own alternative spelling ?tool=build both narrow correctly to
      only /build leads); only a value the lookup does not recognise falls
      through to unfiltered rather than to empty.
    steps:
      - "GET /api/v1/creator/reddit-leads?limit=200&tool=/coinglass (a real site tool, no reddit leads at the time) -> 200, 0 leads"
      - "GET /api/v1/creator/reddit-leads?limit=200&tool=/qa-fixture-does-not-exist-1234 -> 200, 200 leads (the full page), spanning 55 distinct tool_path values"
      - "GET /api/v1/creator/twitter-leads?limit=200&tool=/qa-fixture-does-not-exist-1234 -> 200, 145 leads (every lead the account has), spanning 46 distinct tool_path values"
      - "GET /api/v1/creator/reddit-leads?limit=30&tool=/build -> 30 leads, every one tool_path /build (positive control: a real, populated tool narrows correctly)"
    body: >
      SCOPE: read-only. Every call above is a GET; nothing was claimed,
      replied to or skipped, and no lead of ours was touched.

      An agent that scopes its own work with this filter -- pull only the
      leads for the one tool I have a page for, per the parameter's own "one
      queue per tool" framing -- gets every other tool's leads back the
      moment it passes a value the server does not recognise: a typo, a tool
      since renamed on the site, or (as above) a site path this account
      simply has zero current leads for under the wrong spelling. Nothing in
      the response distinguishes that from a correctly scoped answer, so the
      caller has no way to tell "your filter matched nothing" from "your
      filter was silently ignored" without independently recomputing the
      match itself.

      Our check makes no claim about mistyped-case values (e.g. /Build vs
      /build) since the doc does not commit to case-sensitivity either way --
      only about a value that corresponds to no real site tool at all, where
      the "keeps only threads whose best-matching page is that tool" promise
      leaves no room for a full-queue answer.

  - key: head-to-head-surface-undocumented
    findings: [CYM-head-to-head-surface-is-documented]
    severity: medium
    category: documentation
    url: https://cymetica.com/api/v1/head-to-head/sides
    title: "The head-to-head paper-matchup routes answer live and appear in neither OpenAPI document nor llms.txt"
    expected: >
      llms.txt (lines 30, 643) tells an agent builder to import
      /openapi-public.json or /openapi.json for the REST surface, and its own
      prose separately names every other REST section under a "## REST API"
      heading (markets, event cards, agents, movers, cloned bots, the
      creator dashboard, and so on). A route an agent can call should be
      discoverable from at least one of the documents it is told to read.
    actual: >
      GET /api/v1/head-to-head/sides answers 200 with the callable sides of a
      matchup; GET /api/v1/head-to-head/mine answers 200 with an (empty but
      200, i.e. real list-endpoint) result; GET /api/v1/head-to-head itself
      answers 405 with Allow: POST. All three are live, routed endpoints.
      None of the three, and no path containing "head", appears in
      /openapi.json (13 paths) or /openapi-public.json (173 paths), and no
      case-insensitive match for "head-to-head", "head to head", "h2h",
      "matchup" or "duel" appears anywhere in llms.txt's 71 KB of text. An
      agent that reads either schema, or the prose that tells it which schema
      to import, cannot discover this feature exists.
    steps:
      - "GET /api/v1/head-to-head/sides -> 200, a body naming the account's own bot and paper clones as callable sides"
      - "GET /api/v1/head-to-head/mine -> 200, {\"items\": []}"
      - "GET /api/v1/head-to-head -> 405, Allow: POST"
      - "OPTIONS /api/v1/head-to-head/sides -> 405, Allow: GET; OPTIONS /api/v1/head-to-head/mine -> 405, Allow: GET"
      - "GET /openapi.json and /openapi-public.json -> 0 of 13 and 0 of 173 paths mention \"head\""
      - "GET /llms.txt -> no case-insensitive match for head-to-head, head to head, h2h, matchup or duel"
    body: >
      SCOPE: discoverability only, same shape as the cloned-bots finding
      above (#88/#89) but one step earlier in the flow -- there the routes
      existed and started a bot; here the whole feature is unnamed anywhere
      an agent is told to look. We placed no matchup: POST /api/v1/head-to-
      head is a write and out of scope for this pass; every call above is a
      GET or OPTIONS.

      If this is deliberately unpublished (a feature still in front-end-only
      rollout, say), this becomes a note rather than a defect and we will
      record it that way. If it is meant to be callable by an outside agent,
      the fix is the same one that closed #88: a paths entry (or at minimum
      a mention under llms.txt's own REST-API prose, the way every sibling
      feature gets one).

  - key: paper-close-reports-proceeds-it-does-not-credit
    findings: [CYM-closing_a_paper_position_returns_its_money]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161/sell
    title: "A paper close answers proceeds_usdc 20.0 and status closed, and the paper balance is never credited"
    expected: >
      Your own statement of 2026-09-10: "a paper close returns the proceeds
      and books total_pnl." A close that answers status "closed" with
      proceeds_usdc 20.0 puts 20.0 back into sim_balance.usdc on GET
      /api/v1/account/me, as the close of another card from the same account
      did 17 seconds earlier.
    actual: >
      On 2026-09-25, from an account in simulation_mode, we opened two 20 USDC
      paper positions and closed both in full. Both buys debited 20.00. The
      first close (position 60a470ac-7714-4ce2-a689-8732f5716fb6, card
      5d91bf43, 08:09:34 UTC) answered proceeds_usdc 20.026915, and
      sim_balance.usdc moved 88763.11 -> 88783.13, sim_total_trades 50 -> 51.
      The second close (position d95dede0-eb95-4b7a-875d-816a452eab92, card
      a4a5b71e "SpaceX IPO: Top 10 Crypto Plays", 08:09:53 UTC) answered
      HTTP 200 {"closed_fraction": 1.0, "proceeds_usdc": 20.0,
      "realized_pnl_usdc": 0.0, "status": "closed", "paper": true}, and
      sim_balance.usdc stayed 88783.13 and sim_total_trades stayed 51 -- read
      4 s after the close and again at 08:26:24, 17 minutes later.
      GET /api/v1/event-cards/positions lists d95dede0 as status "closed". So
      the position is gone and the 20.00 it held is in neither the position
      nor the balance.
    steps:
      - 'GET https://cymetica.com/api/v1/account/me -> simulation_mode true, sim_balance.usdc "88783.13", sim_total_trades 51'
      - 'POST https://cymetica.com/api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161/sell {"position_id": "d95dede0-eb95-4b7a-875d-816a452eab92", "fraction": 1.0, "paper": true} -> 200 {"proceeds_usdc": 20.0, "status": "closed", "paper": true}'
      - 'GET https://cymetica.com/api/v1/account/me 4 s and 17 min later -> sim_balance.usdc "88783.13", sim_total_trades 51 (unchanged)'
      - 'GET https://cymetica.com/api/v1/event-cards/positions -> d95dede0 status "closed", realized_pnl_usdc 0.0'
    body: >
      The one visible difference from the close that did credit is the card:
      a4a5b71e is the card whose paper buys answered 500 "Buy failed" until
      #117 was fixed; its first accepted buy was this one, at 08:09:10 UTC.
      A book that debits on the way in and does not credit on the way out
      reads every strategy on that card as losing its whole stake.

      Our check places no order: it reads our own record of the newest close
      -- the account read either side of it, each with its capture -- and
      goes green when a close credits what it answered.

  - key: card-index-jumps-past-its-basket
    findings: [CYM-a_card_index_moves_no_further_than_its_basket_can]
    severity: high
    category: api
    url: https://cymetica.com/api/v1/event-cards/d23b4cf2-c65c-4bb9-b484-3d7c469cd777/index-history
    title: "Two event-card indices moved +142 % and -85 % in one step while their large-cap baskets moved ~1-3 % -- one leg is priced at several times, or a fraction of, its market price"
    expected: >
      An event card is a basket: GET /api/v1/event-cards/{id} lists its legs
      with weights, and current_index is that basket's value against
      index_base 100 -- pw_index over pw_base is the same ratio, the mean of
      the legs' prices now against at creation. A position's
      current_value_usdc on GET /api/v1/event-cards/positions is its units
      times that index. So a card whose weight sits in TRX, XTZ or BCH moves
      about as much as those coins do.
    actual: >
      On 2026-09-25, GET /api/v1/event-cards/{id}/index-history:
      d23b4cf2 "Alchemy Expands into APAC, PARTNERS with DSRV ..." (TRX
      0.4879, XTZ 0.472, ENJ 0.0402) went 100.437 at 10:27:07 to 243.393 at
      10:30:21 UTC, +142.3 % between two points three minutes apart, and has
      stayed near 238 since; its pw_index/pw_base read 0.551/0.2315. 97b827ad
      "CME Group to Expand Crypto Derivatives Suite with Bitcoin Cash and
      Uniswap Futures" (BCH 0.9723, UNI 0.0275, DUSK 0.0003) went 100.519 at
      13:12:57 to 14.925 at 13:29:25, -85.2 % in one step; pw_index/pw_base
      17.09/114.64. Over the same day TRX, XTZ and BCH moved -0.9 %, -1.1 %
      and -3.5 % (CoinGecko), and BCH traded between about 331 and 344 USD.
      With pw_base the plain mean of the legs' prices at creation (0.2315 is
      (0.337 + 0.327 + 0.028) / 3), the Alchemy mean now implies one leg at
      roughly 1.29 USD instead of about 0.33, and the CME mean implies BCH
      at roughly 41 USD instead of about 331. A paper bull position of
      476.85 USDC on d23b4cf2, opened at 07:22 UTC, reads
      current_value_usdc 1135.37 (+658.52) from that step alone.
    steps:
      - 'GET https://cymetica.com/api/v1/event-cards/d23b4cf2-c65c-4bb9-b484-3d7c469cd777/index-history -> 10:27:07 index 100.436996, 10:30:21 index 243.39287'
      - 'GET https://cymetica.com/api/v1/event-cards/d23b4cf2-c65c-4bb9-b484-3d7c469cd777 -> basket TRX 0.4879 (rank 8), XTZ 0.472 (rank 133), ENJ 0.0402; pw_base 0.231505, pw_index ~0.551, current_index ~238'
      - 'GET https://cymetica.com/api/v1/event-cards/97b827ad-b61d-4d3f-8398-8548ebc2a242/index-history -> 13:12:57 index 100.519, 13:29:25 index 14.925'
      - 'GET https://cymetica.com/api/v1/event-cards/97b827ad-b61d-4d3f-8398-8548ebc2a242 -> basket BCH 0.9723 (rank 23), UNI 0.0275, DUSK 0.0003; pw_base 114.6434, pw_index ~17.1'
      - 'GET https://cymetica.com/api/v1/event-cards/positions -> position 8a80db7d on d23b4cf2: notional 476.85, current_value_usdc 1135.37'
    body: >
      Which leg is mispriced we cannot see: the basket rows carry no price.
      The legs' own weights and market_cap_rank say these are large-cap
      baskets, and nothing in them moved by a multiple that day. A paper
      account can take 138 % on a TRX/XTZ card here, and a live one would
      pay or lose on the same index. Both jumps are in the last day's history
      and both cards still read tradeable_now true.

      Our check reads every card we hold an open position on and fails a
      published step of over 40 % within an hour on a basket whose top-200
      legs (by your market_cap_rank) carry at least 90 % of the weight, over
      the last 24 hours. It places no order.

