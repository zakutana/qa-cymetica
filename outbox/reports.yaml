      - 'GET https://cymetica.com/openapi-public.json -> the documented paths'
      - 'GET https://cymetica.com/ -> 70 linked pages; GET each page and its /static/js scripts -> the /api/v1 literals they name'
      - 'GET each undocumented read-shaped path, no key -> 50 answer 200 application/json'
    body: >
      We are not asking you to document all 50. Your platform moves fast
      and some of these may be leftovers that no page should call any more.
      The list is for your own triage: document what outside agents should
      rely on, retire or lock down what is obsolete. What we can say is that
      each one is named by a page linked from your home page today and
      answers without a key.

      Excluded on purpose: paths with an id we would have to guess, anything
      shaped like an action (buy, create, submit, ...), per-user reads, CSRF,
