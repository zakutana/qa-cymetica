  - key: gem-screener-all-out-while-issuing
    findings: [CYM-gem-screener-tokens-out-counts-the-max-supply]
    severity: low
    category: logic
    url: https://cymetica.com/gem-screener/app?coin=ore-protocol
    title: >-
      Gem Screener: ORE shows "100% of tokens out" and FDV equal to market cap while 16.7% of
      its 3M max supply circulates and the snapshot records $3.0M of new ORE in 30 days
    expected: >
      For a coin that is still being minted, the share of tokens out and the FDV count the
      tokens still to come (the max supply), as the request's FDV view and the Checks row
      ("x% of tokens out") describe.
    actual: >
      Read on 2026-10-04 between 08:47 and 10:09 UTC, three times, and seen in ORE's detail in
      the browser around 09:11 UTC. /api/v1/gem-screener, ORE: supply.out_pct 99.9956, fdv
      65,400,201 against mcap 65,397,326, cg.max 3,000,000, circulating 500,630 (16.7% of the
      max), while the same row's dilution says 1.0707% a week, basis "emissions", $3,000,944
      in 30 days. The detail's Checks row reads "100% of tokens out, 0% unlock in 90 days, 1%
      new tokens a week". GMX (78.9% of max out, $12,714 of emissions in 30 days) and STG
      (12.1%, $582) are shown 100% out the same way. In all, 9 apps are shown at least 99% out
      while under 90% of their max supply circulates; for the other 6 the snapshot records no
      issuance, so the difference may be burned and we do not count them.
    steps:
      - 'GET https://cymetica.com/api/v1/gem-screener -> apps[slug=ore-protocol]: supply.out_pct 99.9956, fdv 65400201, mcap 65397326, cg.max 3000000.0, supply.circ 500629.75, dilution.week_pct 1.0707, dilution.basis "emissions", dilution.emissions_usd30 3000944.31'
      - 'Open https://cymetica.com/gem-screener/app?coin=ore-protocol -> CHECKS, Supply: "100% of tokens out, 0% unlock in 90 days, 1% new tokens a week"'
    body: >
      Our check reads the snapshot and fails while an app whose own row records new tokens
      being issued is shown at least 99% out with under 90% of its max supply circulating.
      Where no issuance is on record it does not judge, because max minus total supply can
      be a burn. The Supply Analyzer reads the same difference for ORE as "Bought back,
      burned" (reported separately).

  - key: supply-analyzer-pharaoh-locked-tokens-shown-as-reserve
    findings: [CYM-supply-analyzer-tokens-locked-by-holders-are-not-a-reserve]
    severity: medium
    category: logic
    url: https://cymetica.com/supply-analyzer?symbol=pharaoh-exchange
    title: >-
      Supply Analyzer, PHAR: the 497M PHAR its holders have locked in xPHAR is shown as the
      project's "Reserve, outside the pie", and staking as 11.4M
    expected: >
      Tokens holders have locked in the token's own staking contract show as staked or locked,
      not as a reserve. The page describes the reserve as "Max supply minus every token in
      play, plus the project's own stake. It enters the pile only on a decision". Pharaoh's
      docs (docs.phar.gg, xPHAR and Contract Addresses pages) say xPHAR is minted 1:1 from
      PHAR with "50% of the PHAR used in the mint" burned, is "non-transferable", and redeems
      back to PHAR with a "50% penalty"; they list PHAR at
      0x13A466998Ce03Db73aBc2d4DF3bBD845Ed1f28E7 and xPHAR at
      0xE8164Ea89665DAb7a553e667F81F30CfDA736B9A on Avalanche.
    actual: >
      Read on 2026-10-04 between 10:20 and 10:45 UTC, on chain through Routescan and through
      a public Avalanche RPC: PHAR totalSupply 530,627,320; the xPHAR contract holds
      497,139,188 PHAR (93.7% of the supply); xPHAR supply 994,278,376, of which 992,673,877
      are staked in the VoteModule (0x34F233F868CdB42446a18562710eE705d66f846b). PHAR's
      record, read three times: total_supply 530,628,031, circulating 33,493,321 (which is
      the supply outside xPHAR, correct), "Reserve, outside the pie" 497,134,710 (the PHAR
      in xPHAR, to 0.001%), and staked_total 11,351,535 ("DeFiLlama protocol staking TVL at
      today's price", 2.3% of the locked PHAR), shown as "Staked, free to unlock". So the page
      shows 93% of PHAR as either "Bought back, burned" (469,371,969) or the project's
      reserve, and almost nothing staked, where on chain the holders have 93.7% of it locked.
      Two related readings: the Minter minted 4,939,305 PHAR at the 1 October epoch flip
      (transaction 0x97a2069df223503a3b2f73336e4e864ea97378248aa3f70e181882eb0e042886) under a
      MAX_SUPPLY() of 1,000,000,000, so part of the 469M "burned" is supply still to be minted
      (#156); and the record's emissions_month of 22,880,209 agrees with the Minter's
      weeklyEmissions() of 4,939,305 (21.5M per 30.4 days) within 7%.
    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=pharaoh-exchange -> reserve_today 497134709.9, circulating 33493320.9, total_supply 530628030.8, inputs[key=staked_total] 11351535.32 "DeFiLlama protocol staking TVL at today''s price"'
      - 'GET https://api.routescan.io/v2/network/mainnet/evm/43114/etherscan/api?module=account&action=tokenbalance&contractaddress=0x13A466998Ce03Db73aBc2d4DF3bBD845Ed1f28E7&address=0xE8164Ea89665DAb7a553e667F81F30CfDA736B9A&tag=latest -> 497139187985913367719307621 (497,139,188 PHAR)'
      - 'Same API, module=account action=tokenbalance contractaddress=0xE8164Ea89665DAb7a553e667F81F30CfDA736B9A address=0x34F233F868CdB42446a18562710eE705d66f846b -> 992,673,877 xPHAR staked'
      - 'GET https://docs.phar.gg/pages/contract-addresses -> PHAR Token 0x13A4..., xPHAR Token 0xE816..., VoteModule 0x34F2...'
    body: >
      The reserve is max supply minus the tokens in play, and for PHAR that equals total
      supply minus circulating: exactly the PHAR its holders have locked in xPHAR. Reading
      the staking contract Pharaoh publishes would put them where they are. Our check reads
      the PHAR record, Pharaoh's contract-addresses page and the chain through Routescan; it
      fails while the record calls the PHAR held by xPHAR its reserve (within 1%) or shows
      under half of it as staked, and reports that it cannot tell if Pharaoh's docs stop
      listing the two addresses. Not judged: the exit rule. Your record says an unknown exit
      rule is counted as free to unlock, the cautious reading, and that is documented. We
      looked at PHAR because its holders say most of it is locked, and the page did not show
      that.

  - key: supply-analyzer-unknown-schedule-served-as-none
    findings: [CYM-supply-analyzer-an-unknown-schedule-is-not-none-scheduled]
    severity: medium
    category: logic
    url: https://cymetica.com/gem-screener/app?coin=arbitrum
    title: >-
      Supply Analyzer: all 174 records whose vesting schedule is unknown say "none scheduled",
      which the Gem Screener prints as "none"; DeFiLlama lists 92.6M ARB unlocking on 15 October
    expected: >
      "Unknown never counts as good ... the unknown input is named" (/definitions), and, from
      ET-28934 item 10, "none in 90 days" is shown only when the schedule says so, "unknown"
      otherwise. The Gem Screener card has an unknown tile for this: "No vesting or unlock
      schedule on any feed the Supply Analyzer reads. Unknown, not zero."
    actual: >
      Read on 2026-10-04 between 08:45 and 10:45 UTC, three times. In
      /api/v1/supply-analyzer/batch/gem-screener, 174 rows list "vesting schedule" in
      unknown_names (the record's reason: "No unlock schedule on any feed we read and none
      hand-entered from a published document for this token."), and all 174 carry
      next_unlock {"kind": "none_scheduled"}. The Gem Screener's Supply card prints that as
      "none" over "next unlock scheduled", with the tooltip "Next unlock: none scheduled" and
      "The schedule on file has no tranche ahead" (seen on ORE's detail around 09:11 UTC). For
      2 of the 19 chains among them, DeFiLlama's unlock file, the feed the analyzer names and
      reads for 68 other coins, lists dated unlocks: ARB
      (https://defillama-datasets.llama.fi/emissions/arbitrum), 56,125,000 Team, Contributors
      & Advisors and 36,520,833 Investors tokens on 2026-10-15, with 10 events ahead; STRK
      (https://defillama-datasets.llama.fi/emissions/starknet), 53,309,113 Early Contributors
      and 53,309,113 Investors tokens on 2026-10-30. Both records are status "unknown",
      pressure "?", and say no feed they read has a schedule.
    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/batch/gem-screener -> items[token.slug=arbitrum]: unknown_names includes "vesting schedule"; next_unlock {"kind": "none_scheduled"}; status "unknown"'
      - 'GET https://defillama-datasets.llama.fi/emissions/arbitrum -> metadata.events: timestamp 1792072833 (2026-10-15T14:00:33Z), noOfTokens [56125000], "Team, Contributors & Advisors", unlockType cliff; the same timestamp, [36520833.33], "Investors"'
      - 'Open https://cymetica.com/gem-screener/app?coin=ore-protocol -> Supply card: "none" / "next unlock scheduled"; tooltip "The schedule on file has no tranche ahead"'
    body: >
      Two separate things, one check. Serving "none_scheduled" for an unknown schedule is the
      first; the card's own unknown tile is never reached for these coins. The second is
      that the feed the record says it read does carry ARB's and STRK's schedules (perhaps
      a matching key: the two files carry no gecko_id). Our check reads the batch and fails
      while any record that names its vesting schedule unknown serves "none_scheduled"; for
      the chains among them it reads DeFiLlama's unlock file to show what is scheduled. Every
      Supply Analyzer read names a Gem Screener coin, so none adds a line to your weekly
      ledger.

  - key: supply-analyzer-max-supply-from-a-schedule
    findings: [CYM-supply-analyzer-max-supply-is-a-cap-not-a-schedule-end]
    severity: medium
    category: logic
    url: https://cymetica.com/supply-analyzer?symbol=ethereum
    title: >-
      Supply Analyzer: ETH, SOL and TRX show a "max supply" that is the end of DeFiLlama's
      issuance schedule (ETH 127.9M), and the gap to it as "Bought back, burned"
    expected: >
      The max supply chip and input state a cap the token has, or say there is none: Ether,
      Solana's SOL and TRX have no maximum supply. Supply still to be issued under a schedule
      is future inflow, not tokens "bought back and destroyed, or burned so far: out of play
      for good" (the page's words for that slice).
    actual: >
      Read on 2026-10-04 between 10:53 and 11:06 UTC, twice through our check and once
      before. In a sample of 48 records (every chain, and every app whose Gem Screener
      snapshot has no max supply while the analyzer states one), 30 take max_supply from a
      DeFiLlama unlock schedule, the end total of its issuance horizon: ETH 127,869,954
      ("DeFiLlama unlock schedule (ethereum)", total 122,101,617), SOL 722,609,018 (total
      635,149,992), TRX 126,770,094,880 (total 94,980,615,708), also AERO, CFG, FIL, FLR, MON,
      XTZ, VELO, NEAR, ICP, SEI, SNX and others. For 13 of them the record then shows max
      minus total as "Bought back, burned", with burned_so_far sourced to "max supply minus
      total supply (CoinGecko figures)" although the max is not CoinGecko's: ETH 5,768,336
      burned, SOL 87,459,026, TRX 31,789,479,172. CoinGecko lists no max supply for ETH, SOL
      or TRX. Solana's own RPC (getSupply) gives a total of 635,228,290 and circulating
      588,216,328, matching the record's total and circulating; the 87.5M "burned" is the
      rest of DeFiLlama's issuance horizon.
    steps:
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=ethereum -> max_supply 127869953.59 with inputs[key=max_supply].source "DeFiLlama unlock schedule (ethereum)"; slices_today bb_burned 5768336.31; inputs[key=burned_so_far].source "max supply minus total supply (CoinGecko figures)"'
      - 'GET https://cymetica.com/api/v1/supply-analyzer/analyze?symbol=solana -> max_supply 722609017.66 (DeFiLlama unlock schedule (solana)), total_supply 635149992.01, bb_burned 87459025.65'
      - 'POST https://api.mainnet-beta.solana.com {"method":"getSupply"} -> total 635,228,290 SOL, circulating 588,216,328 (no max supply exists)'
    body: >
      How to fix it is yours: take a max supply only from a source that states a cap, and
      show "no max" where there is none (your page already does "3.2M (total)" for a coin
      without one); never derive a burn from a schedule's end. Our check samples every chain
      and every app whose Gem Screener snapshot has no max supply while the analyzer states
      one, reads each record, and fails while any takes its max supply from an unlock
      schedule. It is a sample of a population that moves with every refresh. Every Supply
      Analyzer read names a Gem Screener coin, so none adds a line to your weekly ledger.

  - key: gem-screener-qi-market-cap-is-not-price-times-supply
    findings:
      - CYM-the_market_caps_rest_on_the_supply_and_price_coingecko_reports
      - CYM-every_derived_figure_follows_its_published_definition
    severity: low
    category: logic
    url: https://cymetica.com/gem-screener/app?view=apps
    title: >-
      Gem Screener: Benqi (QI) shows a market cap 2.3% below its own price x circulating supply
      (20.29M against 20.78M); the other 210 rows are within 0.7%
    expected: >
      A row's market cap is its price times the circulating supply the same row shows, as it is
      on every other row (largest gap 0.63%), or the row says which supply it used.
    actual: >
      Read on 2026-10-04 at about 11:30 UTC, from the snapshot generated 08:47 UTC. Row QI
      (key parent#benqi): price 0.002886040 (market_source "defillama_price", price time 08:31
      UTC), supply.circ 7,200,000,000 (circ_source coingecko; total and max are also 7.2B,
      DeFiLlama's unlocked figure is 7.2B, out_pct 100), mcap and fdv both 20,293,618.38. Price
      times circulating is 20,779,490.03, so the market cap is 2.34% lower; market cap divided
      by price is 7,031,647,655 tokens, 168,352,345 fewer than the row's own circulating figure.
      Our check first flagged QI at 2026-10-03 18:31 UTC and again at 00:40, 04:16 and 05:37
      UTC. It measured the same 2.338% gap on the snapshot generated 02:37 UTC (read at 04:16
      and 05:37) and on this one, 6 hours later, while DeFiLlama's hourly QI price moved from
      0.002830 (02:31 UTC) to 0.002886 (08:31 UTC); a gap that does not move with the price is
      not a timing difference between two reads. The price/revenue, the 30x test and the upside
      of the row stand on this market cap.
    steps:
      - 'GET https://cymetica.com/gem-screener/app?view=apps -> the embedded snapshot, apps[symbol=QI]: price 0.002886040281598961, mcap 20293618.37951519, supply.circ 7200000000'
      - '0.002886040281598961 x 7,200,000,000 = 20,779,490.03; mcap / price = 7,031,647,655'
      - 'The same ratio over every other row: the largest gaps are DEXT 0.63% and JOULE 0.54%; QI is 2.34%'
    body: >
      How to fix it is yours: recompute the market cap from the price and circulating supply the
      row shows, or show which supply the market cap used. We cannot see where 7,031,647,655
      comes from. Our two checks read the one page, anonymously, and fail while any row's market
      cap is more than 2% from its own price times circulating supply; every other row passes
      with a wide margin.

  - key: gem-screener-chain-stablecoins-are-a-token-count
    findings:
      - CYM-gem-screener-chain-stablecoins-are-dollars
    severity: low
    category: logic
    url: https://cymetica.com/gem-screener/app?view=chains
    title: >-
      Gem Screener Chains: Stablecoins shows DeFiLlama's token count, not dollars: Stellar $840.9M
      against DeFiLlama's $909.7M, Sei $273.1M against $305.7M (USDY is priced at $1.147)
    expected: >
      The page defines the input as "Stablecoins: dollars parked on the chain. Source: DeFiLlama."
      The figure in the Adoption tooltip, the chain detail and adoption itself is DeFiLlama's
      dollar value of the USD-pegged stablecoins on the chain for the day the snapshot dates it.
    actual: >
      Read on 2026-10-04 between 14:30 and 15:15 UTC, from the snapshot generated 08:47 UTC, over
      all 33 chains. Every chain's adoption.inputs.stablecoins equals DeFiLlama's
      totalCirculating.peggedUSD for 2026-10-04 (the token count) to the dollar, not
      totalCirculatingUSD.peggedUSD (the dollar value). The two differ where a coin is not worth
      $1: Stellar shows $840.9M against $909.7M (-7.6%; $909.5M when first read at 14:30) and Sei
      $273.1M against $305.7M (-10.7%). Both hold USDY, which DeFiLlama prices at $1.147; on its
      chart the gap between the two totals is that $0.147 on about 467M USDY on Stellar and about
      222M on Sei. The other 31 chains are within 2.5% (27 within 0.9%). The same chain record carries
      stablecoin_supply 910,363,363 for Stellar, DeFiLlama's dollar figure from its chain list.
      The figure enters adoption at the fourth root, so the Upside of Stellar and Sei is about 2%
      and 3% low.
    steps:
      - 'GET https://cymetica.com/gem-screener/app?view=chains -> snapshot chains[slug=stellar].adoption.inputs.stablecoins 840929169.43, adoption.as_of.stablecoins 1791072000 (2026-10-04)'
      - 'GET https://stablecoins.llama.fi/stablecoincharts/Stellar -> the point with date 1791072000: totalCirculating.peggedUSD 840929169.43, totalCirculatingUSD.peggedUSD 909694432.63 (909523394 at 14:30)'
      - 'GET https://stablecoins.llama.fi/stablecoins?includePrices=true -> USDY (Ondo) price 1.1468; it is on both Stellar and Sei'
      - 'The same for Sei: page 273077616.29, DeFiLlama token count 273077616.29, dollar value 305744653.97'
    body: >
      How to fix it is yours: read DeFiLlama's dollar value (totalCirculatingUSD) where the page
      says dollars. Our check reads the Chains tab and DeFiLlama's stablecoin chart of every
      chain, anonymously, and fails while any chain's stablecoins are more than 3% from
      DeFiLlama's dollar value of its USD-pegged coins on the snapshot's own day. Non-dollar
      stablecoins (EUR and others) are not counted, as the page does not count them.

  - key: gem-screener-chain-price-tag-described-as-fees-and-a-leader
    findings:
      - CYM-gem-screener-chain-price-tag-described-as-computed
    severity: low
    category: documentation
    url: https://cymetica.com/llms.txt
    title: >-
      Gem Screener: llms.txt and the chain agent prompt still describe a chain's price tag as
      yearly activity fees against a named leader chain; the page uses adoption and the median
    expected: >
      What llms.txt tells an agent about the Chains tab, and the "Paste into your agent" prompt in
      a chain's detail, describe the price tag the snapshot computes: market cap / adoption (daily
      users, DEX volume, TVL and stablecoins, "no fees in it") against the median price tag of the
      large chains, as the snapshot's bench_chains and llms.txt's own "Chains from ET-28821" line
      say.
    actual: >
      Read on 2026-10-04 at about 15:10 UTC. The snapshot (generated 08:47 UTC) has
      bench_chains.basis "market_cap/adoption", kind "median", 19 members, mult 127.927, and the
      ranked API labels price_vs_revenue for chains "market cap / adoption". llms.txt's Gem
      Screener section opens: "a chain's is market cap / yearly activity fees (what users paid
      to the apps on the chain and to the chain itself), compared with a named leader chain, not
      the median"; its field list says "price_vs_revenue (x): market cap / annual run-rate
      (chains: market cap / yearly activity fees)"; the older Chains line says "benchmark names
      the leader chain ... trading volume and TVL are not used". A few lines lower the same
      section says the opposite ("a chain is priced on adoption ... benchmark is the median price
      tag of the large chains"). The chain detail's agent prompt asks: "tell me about Stellar
      (XLM): its adoption (daily users and fees), its upside against the benchmark chain and its
      trajectory". Also, on chain rows the ranked API labels strength_3m "x (revenue growth /
      price growth)" while the page says that on Chains it is the growth of stablecoins.
    steps:
      - 'GET https://cymetica.com/llms.txt -> section "## Gem Screener", "What it is:" line; the "price_vs_revenue" line; the "Chains (kind=chains, ET-28378)" line; then the "Chains from ET-28821" line'
      - 'GET https://cymetica.com/gem-screener/app?view=chains -> snapshot bench_chains: basis market_cap/adoption, kind median, mult 127.927, n_members 19'
      - 'Open a chain on the Chains tab (e.g. ?view=chains&coin=stellar), expand the agent section: "Paste into your agent" prompt'
      - 'GET https://cymetica.com/api/v1/gem-screener/ranked?kind=chains&limit=100 -> items[].price_vs_revenue.unit "x (market cap / adoption: ...)", items[].strength_3m.unit "x (revenue growth / price growth)"'
    body: >
      How to fix it is yours: say once, in llms.txt and in the agent prompt, what a chain's price
      tag is today. An agent reading the opening sentence will explain a chain's Upside with the
      wrong measure. Our check reads llms.txt and the Chains tab, anonymously, and fails while any
      sentence of the Gem Screener section or the agent prompt describes the price tag as something
      the live snapshot does not compute; the same words beside a snapshot on fees and a leader
      would pass.

  - key: gem-screener-chain-adoption-names-two-measures
    findings:
      - CYM-gem-screener-chain-adoption-is-one-measure
    severity: low
    category: logic
    url: https://cymetica.com/gem-screener/app?view=chains&coin=mantle
    title: >-
      Gem Screener Chains: "Adoption" names two measures; Growth 6M, the trajectory and the
      Declining/Post-crash tags that decide "Vetted only" read a stablecoins and DEX volume index
    expected: >
      One word, one measure. The Adoption column, its tooltip and Upside are the four-input
      measure (users, DEX volume, TVL, stablecoins), which the page says "has no monthly history".
      A reading the page calls Adoption measures that, or the page names it for what it is.
    actual: >
      Read on 2026-10-04 at about 15:10 UTC (snapshot 08:47 UTC). Mantle's detail shows
      "Adoption 11.0M" (four inputs) and, below it, "Adoption growth 6M -12.8%"; its tags say
      "Declining. Adoption falling 12.8% a month for six months." and "Post-crash. Adoption is at
      29% of its best quarter: cheap because it fell."; its trajectory card says "Adoption grew
      3.6% a month over the last 3 months". The page's own longer text for those tags says
      "Adoption (stablecoins and DEX volume) has been falling ...", and the row-history endpoint
      serves that series as "index (weekly mean)". The 12-month column says the four-input
      measure is "Not the adoption measure, which has no monthly history", and Strength 3M says
      "the four-input adoption the ranking uses has no 3-month history". "Vetted: ... adoption not
      declining, close to its peak" is decided on the index: 9 of 33 chains are not vetted on it
