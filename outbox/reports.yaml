      their /static/js scripts, name 50 /api/v1 paths that answer an
      anonymous GET with HTTP 200 JSON and match no path in
      /openapi-public.json. Examples: /api/v1/fta-fund/history and
      /api/v1/ma-fund/history (the charts on /fund-performance; MCP
      get_fund_history refuses FTA-STOCKS), /api/v1/headlines,
      /api/v1/agentbook/feed, /api/v1/microfunds, /api/v1/economic-calendar,
      /api/v1/prop/stats, /api/v1/rewards/stats. Full list: agentbook/channels,
      agentbook/feed, agentbook/posts, agentbook/reputation/leaderboard,
      agents/species, ai-apps/leaderboard, ai-due-diligence,
      ai-due-diligence/history, ai-due-diligence/pivot/history, arena/chart,
      arena/featured-events, arena/headlines, arena/trades,
      backtest/leaderboard, btc-pool/state, build-stats/recent,
      card-track/race, card-track/standings, ceo-ai-leaderboard,
      ceo-ai-leaderboard/methodology, ceo-ai-leaderboard/profile/{slug},
      cloned-bots/backtest/queue, clones/fomo-radar/calibration,
      economic-calendar, exchange/et10/orderbook, features, fta-fund/history,
      headlines, irc-newsfeed, launchpad/arc/clock, ma-fund/history,
      ma-ripple/live-deals, marketplace/trending, marr/reports/{id},
      microfunds, nexus/plans, ontology/datacenter,
      ontology/datacenter/stock-graph, perpetual/markets/{symbol}/status,
      prediction-pools/wta-funding-stats, prices/{symbol}, products-stream,
