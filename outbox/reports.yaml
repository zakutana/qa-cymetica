      - 'GET https://cymetica.com/api/v1/event-cards/?limit=100 -> count 100, total 641'
      - 'GET https://cymetica.com/api/v1/event-cards/?limit=500 -> HTTP 422'
      - 'GET https://cymetica.com/api/v1/event-cards/?limit=100&offset=0 ... offset=600 -> 641 cards; SAIB: CTVA current_index / index_base - 1 = -83.92%, not on the first page'
    body: >
      How to fix it is yours: read every page of the listing, sort it by move on your side, or give the page an
      endpoint of its own. A visitor reads the boards as the biggest movers on EventTrader; today they are the
      biggest movers of one page in the listing's default order. Not about whether a move since listing is the
      right window, or about the token rows. Our check reads /movers, the request its board script makes and
      every page of /api/v1/event-cards/, anonymously, and fails while a card of the true ten biggest gainers or
