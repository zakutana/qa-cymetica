    steps:
      - 'Open https://cymetica.com/gem-screener/app?view=chains&coin=mantle -> stats "Adoption 11.0M", "Adoption growth 6M -12.8%"; the row tags "Declining", "Post-crash"; "Why not to trust this number"'
      - 'GET https://cymetica.com/api/v1/gem-screener/row-history?view=chains&key=mantle -> unit "index (weekly mean)"'
      - 'The Chains tab, column headers: 12 months info ("Not the adoption measure, which has no monthly history"), Strength 3M info'
    body: >
      How to fix it is yours: name the index for what it is (stablecoins and DEX volume) wherever
      it is shown and wherever it vets a chain, or measure those readings on the four-input
      adoption. Our check reads the Chains tab's source, anonymously, and fails while the page
      calls a reading Adoption that its own words say is stablecoins and DEX volume, or that it
      says adoption cannot have.

  - key: gem-screener-chain-left-out-for-no-market-data-that-coingecko-lists
    findings:
      - CYM-gem-screener-chain-left-out-for-a-true-reason
    severity: low
    category: logic
    url: https://cymetica.com/gem-screener/app?view=chains
    title: >-
      Gem Screener Chains: tokens are left out "for no market data" that CoinGecko lists (BCH $6.4bn,
      ETC $1.4bn; earlier ZEC $22.5bn, VET, THETA), with no missing input named
    expected: >
      The Chains note says which tokens of the listing rule are left out and why. A token left out
      "for no market data" has none, and one that lacks a DeFiLlama input says which (as the note
      does for BTC, LTC, INJ and the others).
    actual: >
      Read on 2026-10-04. The snapshot generated 08:47 UTC lists BCH and ETC under "Not listed, no
      market data" with chains_universe.left_out[].missing [] (no input missing), while
      CoinGecko's markets answered Bitcoin Cash $6.38bn and Ethereum Classic $1.40bn, above the
      $200M floor. On DeFiLlama, Bitcoin Cash has no stablecoin chart (404) and Ethereum Classic no
      DEX volume, so each lacks an input the note does not name. The snapshot generated 04:10 UTC
      (served at ?view=apps from the cache at 15:01) said the same of ZEC ($22.5bn on CoinGecko),
      VET and THETA, which the 08:47 snapshot lists as missing an input: the set moves between
      snapshots and the reason is false each time. The other 25 reasons held.
    steps:
      - 'GET https://cymetica.com/gem-screener/app?view=chains -> snapshot chains_universe.left_out: {"symbol": "BCH", "gecko_id": "bitcoin-cash", "reason": "no_market_data", "missing": []}, the same for ETC; the note "Not listed, no market data: BCH, ETC."'
      - 'GET https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin-cash,ethereum-classic -> market_cap 6383422929 and 1403766651'
      - 'GET https://stablecoins.llama.fi/stablecoincharts/Bitcoincash -> 404; GET https://api.llama.fi/overview/dexs/EthereumClassic -> no volume'
    body: >
      How to fix it is yours: give the reason the token actually fails (the missing input), and say
      "no market data" only when the market source has none. No number on the tab changes: both
      tokens would be left out anyway. Our check reads the Chains tab and CoinGecko's markets for
      the tokens left out for that reason, anonymously, and fails while CoinGecko answers a market
      cap at least the listing floor for any of them.

  - key: paper-bot-bet-settled-after-its-epoch
    findings:
      - CYM-paper-bot-bet-settles-at-epoch-end
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/cloned-bots/my-clones
    title: >-
      Paper clone bets are settled on the price when settlement runs, not at epoch_end (ETH epoch
      5967592: 2697.01 of 19:25:53, not 2694.62 of 19:25:00); 9 bets pay the opposite result
    expected: >
      Each settled 5-minute bet in a clone's activity names its epoch (epoch_start, epoch_end) and,
      settled normally, resolution_path "epoch_close". Its price_at_exit is the asset's price at
      epoch_end, and is_winner follows from price_at_entry and that price.
    actual: >
      Read on 2026-10-04 at 18:12 and 18:18 UTC over all 92 settled 5-minute bets of our 21 listed
      paper clones (every page of /activity), against Binance spot 1-second klines. 25 bets on 9
      epoch/asset pairs have a price_at_exit more than 0.01% from Binance at epoch_end; where the
      exit was taken on time, the prices sat within 0.0089% of it. 12 of the 25 equal Binance at the
      second of their closed_at, 13 to 54 s after epoch_end: ETH epoch 5967592 (2026-09-24) ended
      19:25:00 at 2694.62 and its bets were closed 19:25:53-54 at 2697.01, Binance's price at
      19:25:53; ETH epoch 5970201 (2026-10-03) ended 20:50:00 at 2687.21 and was settled 20:50:18 at
      2688.14. One is a price from before the end: BTC epoch 5967591 was settled at 84557.30,
      Binance's price at 19:19:36-45, while it stood at 84615.22 at 19:20:00. Taking each bet's own
      price_at_entry and the price at epoch_end, 9 bets on 3 epoch/asset pairs pay the opposite
      result: BTC 5967591 (entry 84584.00, end 84615.22: three YES paid as losses, one NO as a win),
      ETH 5967593 (a YES entered at 2697.00, end 2697.30, settled 19:30:30 at 2695.81 and paid as a
      loss) and ETH 5970201 (entry 2687.54, end 2687.21: two YES paid as wins, two NO as losses).
    steps:
      - 'GET https://cymetica.com/api/v1/cloned-bots/4076d1b0-f78b-452f-b66f-f02506a4f219/activity?page_size=100 (our paper clone) -> the ETH bet of epoch_id 5967592: epoch_end 2026-09-24T19:25:00, closed_at 19:25:53, price_at_exit 2697.01, resolution_path epoch_close'
      - 'GET https://data-api.binance.vision/api/v3/klines?symbol=ETHUSDT&interval=1s&startTime=1790277899000&limit=60 -> close of 19:24:59 is 2694.62, close of 19:25:53 is 2697.01'
      - 'GET https://cymetica.com/api/v1/cloned-bots/1b81dff7-8a27-4f9e-abd8-b3265f1a6244/activity -> the ETH buy of epoch 5970201: price_at_entry 2687.54, price_at_exit 2688.14, closed_at 20:50:18, is_winner true; Binance ETHUSDT 1s kline at 1791060599000 (20:49:59) closes at 2687.21'
    body: >
      How to fix it is yours: take each bet's exit at its epoch_end, whenever the settlement runs.
      Scope: paper clones only, our own; BTC and ETH, the two assets our bots bet on. Binance is our
      reference, not necessarily your source: where your exits were on time they agree with it
      within 0.0089%, far inside the 0.01% our check allows. The effect runs both ways (it does not
      favour the bots); it changes which bets win. Our check reads every settled bet of our listed
      paper clones and Binance's 1-second price at each epoch_end, and fails while any price_at_exit
      is more than 0.01% from it.

