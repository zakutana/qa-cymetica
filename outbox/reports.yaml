      carries no reason and the roster still lists it. Either the roster and
      the outlook should agree, or an unavailable coin should come back with
      the documented come-back line rather than a not-found.
      Our check looks at the head of the roster, not all 147, and only counts
      a symbol that answers 404 twice 15 seconds apart -- RAIN flickered
      between the two passes, and a cold coin being computed is exactly what
      your description says may happen.

  - key: launchpad-screener-limit
    findings: [CYM-launchpad-screener-honours-its-limit]
    severity: low
    category: api
    url: https://cymetica.com/api/v1/launchpad/onchain/screener
    title: "The launchpad screener returns twice its own limit: limit=5 answers 10 rows, limit=500 answers 1000"
    expected: >
      Your published schema declares limit on GET
      /api/v1/launchpad/onchain/screener as an integer with default 200 and
      maximum 500, so a caller asking for N rows receives at most N.
    actual: >
      With include_external left at its documented default of true, the limit
      is applied to each source separately and the two lists are
      concatenated: limit=5 returns 10 rows, limit=50 returns 100, the default
      returns 400, and limit=500 -- your documented maximum -- returns 1000
      rows, about 2 MB. With include_external=false, limit=5 returns exactly
      5, so the external half is added on top of the limit rather than
      counted in it.
    steps:
      - 'GET https://cymetica.com/api/v1/launchpad/onchain/screener?limit=5 -> 10 rows'
      - 'GET ...?limit=50 -> 100 rows; ...?limit=500 -> 1000 rows'
      - 'GET ...?limit=5&include_external=false -> 5 rows'
      - 'In the doubled response, half the rows carry source "eventtrader" and the full field set, half carry source "pons" or "pools_trade" and fifteen fields'
    body: >
      Low, and easy to miss from inside: the page presumably wants both
      halves. It costs a caller that sizes a buffer or a page by the limit,
      and at the documented maximum it doubles a two-megabyte response.
      Either counting external rows toward the limit or documenting that the
      limit is per source satisfies our check -- it compares the row count
      with the limit it asked for and nothing else.
      One observation we are NOT filing, because your schema declares the
      items only as "type: object": the two halves are different shapes. The
      EventTrader rows carry current_price, market_cap, total_supply and
      holder_count; the external ones carry fifteen fields, several null, and
      no chain_name. A caller iterating the list has to branch on which half
      it is in.

  - key: bb-spec-funding-gate
    findings: [CYM-the_spec_s_funding_gate_is_the_one_the_build_actually_waits_on]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/build-it-better/requests/ET-26036
    title: >-
      Every BB-SPEC says the 24-hour clock waits for a $100 MicroFund gate; your
      tools say there is nothing to fund, and your board agrees with the tools
    expected: >
      The scope a requester is asked to lock should describe what actually
      starts the build. Your MCP tool descriptions say it twice:
      bb_file_request -- "nothing is charged or locked; there is no fee and
      nothing to fund. The 24-hour clock starts when you accept the scope" --
      and bb_accept_spec -- "BB-ACCEPT - lock the proposed scope. This starts
      the 24-hour clock; there is nothing to fund."
    actual: >
      Every generated BB-SPEC ends with a different rule: "The 24-hour clock
      starts when this spec is accepted AND the $100 MicroFund gate is filled
      (or waived)." On ET-26036 the gate is neither filled nor waived -- the
      record shows funding.raised_usd 0.0 against goal_usd 100.0, funded
      false, status open, backers 0 -- and the clock started anyway at
      2026-09-19T20:25:59Z, one hour and 33 minutes after BB-ACCEPT, with
      deadline_at 2026-09-20T20:25:59Z, stage "funded", queue_status "queued"
      and ready_to_build true. So the sentence in the spec is not describing a
      waiver; it names a gate nothing is waiting on.
    steps:
      - 'GET https://cymetica.com/api/v1/build-it-better/requests/ET-26036 -> spec_text ends with the $100 MicroFund sentence'
      - 'Same response: funding.funded false, funding.raised_usd 0.0, funding.goal_usd 100.0, funding.status "open"'
      - 'Same response: clock_started_at 2026-09-19T20:25:59Z, deadline_at 2026-09-20T20:25:59Z, stage "funded", ready_to_build true'
      - 'GET https://cymetica.com/.well-known/mcp.json -> bb_accept_spec description: "This starts the 24-hour clock; there is nothing to fund"'
    body: >
      Filed because it costs the requester in both directions, and we paid it
      ourselves: our own notes recorded this build as blocked on a $100 gate
      we had decided not to pay, while it had been queued and ready to build
      since the evening before. A requester who believes the spec either sends
      a hundred dollars they do not owe or walks away from a build that is
      already running.
      The fix is one sentence in the spec generator, since the behaviour is
      the documented one and only the spec disagrees with it. Our check reads
      four facts from the single request payload -- the spec makes the claim,
      the gate is unfilled, the clock has started, the build is queued -- and
      goes quiet if any one of them is absent, so a genuinely waived gate or a
      clock that has not started is not a failure.
      Separately and not filed: your REST routes under
      /api/v1/build-it-better are in mcp.json and in no OpenAPI document, so
      an agent reading openapi-public.json cannot find the board at all. Say
      if you would like that as its own report.

  - key: bb-socket-undiscoverable
    findings: [CYM-a_socket_a_page_advertises_is_named_where_a_machine_reads]
    severity: low
    category: documentation
    url: https://cymetica.com/build-it-better/api
    title: >-
      The Build it Better websocket is live and named only in page HTML: an
      agent reading llms.txt, mcp.json or the OpenAPI cannot find it
    expected: >
      An agent discovers this platform through llms.txt, mcp.json and
      openapi-public.json. A live channel named in none of the three is one
      the agent it was built for never learns exists. You made exactly this
      fix today for the Build it Better REST routes, which were in mcp.json
      and in no OpenAPI document, and all six are now declared per operation.
    actual: >
      wss://cymetica.com/ws/build-it-better appears in the HTML of
      /build-it-better/api and in none of /llms.txt, /.well-known/mcp.json or
      /openapi-public.json, each searched whole. It is live, not a dead link:
      it accepts a connection with no credential and greets with {"type":
      "hello", "channel": "build-it-better"}. For contrast, llms.txt names
      wss://cymetica.com/ws/agent-board/feed and wss://cymetica.com/ws/
      agentbook/feed, and mcp.json names /ws/agent-board/feed, /ws/clob and
      /ws/prices, so the convention exists and this channel is outside it.
    steps:
      - 'GET https://cymetica.com/build-it-better/api -> the page names wss://cymetica.com/ws/build-it-better'
      - 'GET https://cymetica.com/llms.txt -> that URL does not appear; two other ws feeds do'
      - 'GET https://cymetica.com/.well-known/mcp.json -> it does not appear; three other ws endpoints do'
      - 'GET https://cymetica.com/openapi-public.json -> it does not appear, including after today''s build-it-better additions'
      - 'Connect to wss://cymetica.com/ws/build-it-better with no credential -> {"type": "hello", "channel": "build-it-better"}'
    body: >
      Filed at low severity against your own bar: a stranger is misled, in
      this case by absence. The board is the part of Build it Better that
      changes while an agent waits -- a spec regenerated, a stage moving to
      building, a build shipping -- and an agent that cannot find the channel
      polls the REST route instead, or misses the change entirely.
      Our check is GET-only and asserts presence: it takes every websocket URL
      the Build it Better pages advertise and reports which machine-readable
      documents name that same URL. A document we cannot read is inconclusive,
      never an absence. It does not open the socket -- that would put the call
      outside the transport that classifies everything else we do.
      We are not filing a second thing we noticed while reading: your OpenAPI
      carries one ws URL whose host is a replacement character, in the
      description of /ws/backtest/{instance_id}. Say if you would like that
      separately.

  - key: build-stats-window
    findings: [CYM-the_build_totals_reach_back_to_the_date_they_are_published_under]
    severity: low
    category: logic
    url: https://cymetica.com/build-stats
    title: >-
      /build-stats publishes SINCE 2025-11-23 over session totals that hold
      only 17 days of February 2026
    expected: >
      A total shown under a start date should cover the period from that date.
      Your own page pairs them: the header reads SINCE 2025-11-23, the tiles
      read SESSIONS 315 / "301 days active", MESSAGES 608.2K / "1.9K/session",
      TOOL CALLS 60.5K, and under RECORDS, First Session 2025-11-23. The
      commit half of the same response does exactly that -- daily_commits runs
      2025-11-23 to today, 301 days, and sums to totals.commits.
    actual: >
      The session half does not. In the same GET /api/v1/build-stats,
      daily_activity carries 17 rows, 2026-01-31 to 2026-02-16, and
      totals.sessions, totals.messages and totals.tool_calls are each EXACTLY
      the sum of those 17 rows (315, 608185 and 60519). A total that equals
      the sum of its own series holds nothing outside it, so those three
      figures cannot include the session your own first_session field dates to
      2025-11-23 -- nor anything in the seven months since 2026-02-16, while
      the commit series beside them reaches today. Measured 2026-09-20.
    steps:
      - 'GET https://cymetica.com/api/v1/build-stats -> daily_activity has 17 rows, first date 2026-01-31, last date 2026-02-16'
      - 'Same response: sum of daily_activity sessions = 315 = totals.sessions; messages = 608185 = totals.messages; tool_calls = 60519 = totals.tool_calls'
      - 'Same response: first_session = "2025-11-23", which is before the first row of daily_activity'
      - 'Same response: daily_commits has 301 rows, 2025-11-23 to 2026-09-20, and sums to totals.commits (23100) -- so the commit series is current and the session series is not'
      - 'Open https://cymetica.com/build-stats -> the header renders SINCE 2025-11-23 and SESSIONS 315 / 301 days active over those figures. This is where it is visible, not where it is wrong: the defect is in the payload above, and the page renders it faithfully'
    body: >
      Filed because the page is a claim about your own build, made to a reader
      who cannot check it, and the two halves of it are measured over
      different periods without saying so. A visitor divides 608.2K messages
      by 301 days, or reads "315 sessions since 2025-11-23", and gets a rate
      for a period the data does not cover.
      We cannot tell from outside which end is wrong, and the report does not
      guess: either the session feed stopped on 2026-02-16 and the page still
      labels it as the whole history, or the history exists and the totals
      leave it out. Either fix closes this.
      Low severity by your own bar: nothing is lost and no API consumer
      breaks -- a reader is misled about a number on a page about
      trustworthiness.
      Our check asserts only what the response says about itself: totals that
      equal the sum of their series are that series, so first_session must
      fall inside it. It says nothing when a total is LARGER than its series,
      which is the normal shape of a lifetime total over a recent window, and
      it does not require the series to reach today.

  - key: agent-board-ranking
    findings: [CYM-the_board_is_ranked_by_the_key_its_own_document_publishes]
    severity: low
    category: documentation
    url: https://cymetica.com/api/v1/agent-board/search
    title: >-
      llms.txt says the Agent Returns Board is ranked by verified return x
      replications; it is ranked by age, and nothing on it is verified
    expected: >
      llms.txt is the document an agent reads instead of asking, and it makes
      exactly one statement about how the board is ordered: "GET
      /api/v1/agent-board/search: Search playbooks (ranked by verified return
      x replications)". An agent that trusts it reads the first row as the
      playbook with the best proven record -- a return somebody verified,
      multiplied by the number of agents who reproduced it.
    actual: >
      Measured 2026-09-20 over all three playbooks the board serves. Every one
      has replications {confirmed 0, failed 0}, evidence_verified false and
      pnl_usdc null, so the published key is nil for all of them and orders
      nothing. `rank` comes back as the same value for the same row under
      q= and q=agent (0.3637, 0.1488, 0.0798), so it is not a relevance score
      for the query either. The order is exactly newest first -- 2026-09-19,
      2026-09-13, 2026-09-05 -- and the value drifts down by about a
      millionth between two calls seconds apart, which is a time decay. So
      the board is ranked by age and its readers are told it is ranked by
      proof.
    steps:
      - 'GET https://cymetica.com/llms.txt -> "[GET /api/v1/agent-board/search](/api/v1/agent-board/search): Search playbooks (ranked by verified return × replications)"'
      - 'GET https://cymetica.com/api/v1/agent-board/search?q= -> 3 rows, ranks 0.3637 / 0.1488 / 0.0798, each with replications.confirmed 0, evidence_verified false, pnl_usdc null'
      - 'GET https://cymetica.com/api/v1/agent-board/search?q=agent -> the same three ranks to five decimals, so rank does not depend on the query'
      - 'Same rows: created_at 2026-09-19, 2026-09-13, 2026-09-05 -- the rank order is exactly the recency order'
      - 'Repeat either call a few seconds later -> every rank is slightly lower (0.363741 -> 0.363627), a decay over time'
    body: >
      Filed because the board is built for agents and this is the one line
      that tells an agent what the top of it means. Following it the way it is
      written sends a copier to the newest playbook believing it is the
      best-proven one, on a board where nothing is proven at all.
      We are not saying the ordering is wrong -- recency is a reasonable
      default for a board with no verified returns yet. What cannot both be
      true is the ordering and the sentence describing it. Publishing what
      `rank` is would close this; so would ranking by the key you published.
      Our check opens this only when three things hold together: no row
      carries a confirmed replication or verified evidence, `rank` is
      unchanged across two different queries, and the order is exactly
      recency. It reads the claim out of llms.txt live rather than quoting it,
      so rewording that line stops the check instead of leaving it arguing
      with a sentence you no longer publish. With fewer than two playbooks on
      the board it reports inconclusive rather than a defect.

  - key: bb-sla-missed
    findings: [CYM-a_build_ships_inside_the_24_hours_it_publishes]
    severity: medium
    category: logic
    url: https://cymetica.com/api/v1/build-it-better/requests/ET-26036
    title: >-
      Build it Better missed its own 24-hour deadline on ET-26036: the clock
      expired with the request still queued and nothing built
    expected: >
      Build it Better's headline promise is a build inside 24 hours, and the
      product keeps that clock itself: every accepted request carries
      clock_started_at and deadline_at, and the board renders the countdown.
      A request that is ready to build when the clock starts should ship
      before it runs out, or the deadline should say something else.
    actual: >
      ET-26036 (Tickeron) started its clock at 2026-09-19T20:25:59Z with
      deadline_at 2026-09-20T20:25:59Z, stage "funded", queue_status "queued"
      and ready_to_build true from the beginning. At 2026-09-20T20:28:18Z,
      two minutes after its own deadline, the record still read stage
      "funded", queue_status "queued", our_url null and shipped_at null --
      the build had not started, let alone shipped. The board's own counters
      agreed: building 0, shipped 0. Nothing about the request changed in the
      24 hours it was queued.
    steps:
      - 'GET https://cymetica.com/api/v1/build-it-better/requests/ET-26036 -> clock_started_at 2026-09-19T20:25:59.571403Z, deadline_at 2026-09-20T20:25:59.571403Z'
      - 'Same response at 2026-09-20T20:28:18Z (2.3 minutes past the deadline): stage "funded", queue_status "queued", ready_to_build true, our_url null, shipped_at null'
      - 'GET https://cymetica.com/api/v1/build-it-better/requests -> stats {"total":2,"requested":0,"funded":2,"building":0,"shipped":0}'
    body: >
      Filed because the 24 hours is the product's promise, not a detail: it is
      what the page leads with and what the requester is told when the clock
      starts. We are the requester here, so this is our own ticket and we can
      say what it cost: a day of waiting against a deadline that was never
      going to be met, with the board showing a countdown the whole time.
      Our check reads only the platform's own two timestamps and its own
      stage, over every request on the board rather than over ours alone, and
      it says nothing about a request whose clock has not started. Whatever
      you correct -- shipping inside the window, or publishing a deadline the
      queue can actually meet -- closes it.
      One thing that is not in this report and may be related: while ET-26036
      sat queued, the board's "Building now" tile read 1, because the page
      computes it as funded + building. We sent that separately over Telegram.

  - key: bb-building-tile
    findings: [CYM-the_boards_building_tile_counts_only_what_is_building]
    severity: low
    category: logic
    url: https://cymetica.com/build-it-better
    title: >-
      The live build board's "Building now" tile counts queued requests, so it
      contradicts the BUILDING column directly beneath it
    expected: >
      The board opens with five counters and puts four columns immediately
      under them -- REQUESTED, QUEUED, BUILDING, SHIPPED -- fed by the same
      data and read in one glance. "Building now" should be the number of
      builds that are running, which is what the column beneath it shows and
      what your API calls `stats.building`.
    actual: >
      Measured 2026-09-20 at 20:13 UTC, twelve minutes before ET-26036's
      24-hour deadline expired: the tile read 1 while the BUILDING column read
      0 and the only request sat in QUEUED. GET
      /api/v1/build-it-better/requests returned stats {"total":1,
      "requested":0,"funded":1,"building":0,"shipped":0} with the item at
      stage "funded", queue_status "queued", shipped_at null -- so the API
      agrees with the column, not with the tile. The page's own script is
      where the two part: `text($('bs-building'), (s.funded || 0) +
      (s.building || 0));`. Funded is added to building, so a request that is
      only accepted and queued is displayed as running. The column next to it
      filters `b.stage === 'building'` and does not.
    steps:
      - "GET https://cymetica.com/build-it-better -> the script contains text($('bs-building'), (s.funded || 0) + (s.building || 0));"
      - 'Same page: the BUILDING column is built from all.filter(b => b.stage === "building")'
      - 'GET https://cymetica.com/api/v1/build-it-better/requests -> stats.building 0 while stats.funded is non-zero'
      - 'Open the page with one funded, queued request -> the tile reads 1 and the column reads 0'
    body: >
      Filed low, and not as a UI defect: the number is wrong about your own
      state on the surface the product leads with, and it is wrong in one
      line of arithmetic rather than in a stylesheet. We normally leave the
      front end alone -- it is outside the scope we published -- and this one
      is here because a requester waiting on the 24-hour clock reads that tile
      to find out whether their build has started. On ET-26036 it said the
      build was running for the whole day it spent in the queue.
      Our check reads the assignment out of the served page and fails only
      when it adds another stage to building. If it cannot find the assignment
      at all it reports inconclusive rather than a fix, so a rewrite of the
      front end will not be mistaken for a correction.

  - key: deep-answer-arrives-cut
    findings: [CYM-a_deep_answer_arrives_whole]
    severity: medium
    category: api
    url: https://cymetica.com/mcp/v1
    title: "get_deep_answer serves a finished investigation with its start cut off, mid-word"
    expected: >
      A finished ask_nexus_deep job returns the whole answer in result.answer
      -- the tool's own description tells the caller to poll get_deep_answer
      with the job_id, and that field is the only copy the caller gets.
    actual: >
      Job bfb44eb7-1d12-4e78-abdb-67ddcc4d52d3, asked 2026-09-21 07:36 UTC,
      finished in about five minutes with status "done". Its result.answer
      begins, verbatim, "...ols with the hot basket is the predicted outcome"
      -- mid-word -- and runs 1665 characters. No other field of the result
      holds the rest, and re-reading the job returns the same text, so it is
      what the server stores. The question asked three things, (a) to (c);
      what survives is the tail of the last one and a closing list. The one
      concrete rule the question asked for is in the part that was cut.
    steps:
      - 'POST https://cymetica.com/mcp/v1 tools/call get_deep_answer {"job_id":"bfb44eb7-1d12-4e78-abdb-67ddcc4d52d3"} with our key'
      - 'Read result.content[0].text -> {"result": {"status": "done", "answer": "...ols with the hot basket is ..."}}'
      - 'Our other deep answers of the same week begin normally and run up to 7416 characters, so this is not a uniform length cap'
    body: >
      Filed medium because nothing tells the caller the answer was cut: the
      status is "done", the text reads fluently from the second sentence on,
      and an agent that does not notice the leading ellipsis acts on the
      closing advice with the reasoning it rested on missing. A deep
      investigation is also the expensive lane -- a retry costs another slot
      in your capacity window.
      Our check re-reads, live, every deep job we asked in the last 72 hours
      and fails only on an answer that begins with an ellipsis, so it goes
      green once the window holds none -- whether you repair stored answers or
      only new ones. If the cut is a deliberate tail-truncation for long
      answers, a flag in the result (truncated: true, or the full length)
      would let a caller know to ask again, and would satisfy us as well.

  - key: product-radar-duplicate-rows
    findings: [CYM-the_product_radar_lists_each_product_once]
    severity: low
    category: logic
    url: https://cymetica.com/api/v1/product-radar/leaderboard
    title: "Product Trend Radar ranks the same product on two rows, splitting its mentions between them"
    expected: >
      The leaderboard -- "which apps, products and services are gaining
      attention, ranked" (llms.txt) -- lists each product once, so its score
      carries all of its mentions and it holds one place in the ranking.
    actual: >
      Measured 2026-09-21 with our key, the day the API opened to keys: Hylo
      Protocol is on two rows (ids 3048 and 50379) and Gains Network on two
      (3056 and 3019) in every window -- 7, 14 and 30 days -- and EventTrader
      on two in the 30-day window (9513 "product" at rank 1, 28370 "app" at
      rank 6). Each pair has the same kind and category; one row carries the
      project URL and the other none, which looks like one product recorded
      once from chat and once from a web source.
    steps:
      - 'GET https://cymetica.com/api/v1/product-radar/leaderboard?window=7&limit=500 with an X-API-Key'
      - 'Group items by name: "Hylo Protocol" and "Gains Network" each appear twice with different ids'
      - 'Repeat with window=30: "EventTrader" also appears twice (ids 9513 and 28370)'
      - 'GET /api/v1/product-radar/products/3048 and /50379 -> the same project'
    body: >
      Thank you for opening the radar to API keys the same morning we asked --
      it answers 200 with our key, the window and limit bounds hold (6 and 31,
      0 and 501 are all refused with 422), and chat links and handles are
      absent from the mentions as llms.txt says.
      This one is about the ranking itself: a product split over two rows
      shows up twice and scores lower than it should on each, and the top of
      the 30-day board is one of those pairs. Our check groups the leaderboard
      by name and fails only when a name is on two rows, so merging the
      duplicates satisfies it. If any pair really is two different products,
      tell us which and we will withdraw that part.
      Related, and not part of this finding: in the 30-day window the top row,
      EventTrader, draws 28 of its mentions from CyMetica's own community, and
      rank 10 is "EventTraderQABot" -- our own Telegram handle, counted as a
      product from your chat. You may want own-community mentions weighted
      differently on a board that says "not an endorsement".

  - key: fta-crypto-return-backfilled
    findings: [CYM-the_fta_crypto_return_starts_where_its_own_record_does]
    severity: medium
    category: logic
    url: https://cymetica.com/fund-performance
    title: "FTA Fund -- Cryptos publishes a return from before it held anything, while the methodology says nothing is backfilled"
    expected: >
      get_fund_methodology, the text your advisor connector hands to
      assistants: "Return is measured since the fund's own inception from real
      market prices with timestamped entries -- nothing backfilled, no
      backtest." So a fund's return since inception starts where its own
      record starts.
    actual: >
      get_fund FTA-CRYPTOS (a LIVE fund, taking real USDC) publishes
      inception_date 2026-07-26 and return_since_inception_pct around -19 %,
      with last_composition_change 2026-08-17. The fund's own history,
      GET /api/v1/fta-fund/history, says inception 2026-08-09 and its first
      point is 2026-08-21. /fund-performance shows the same figure as
      "Return since inception (short)" and says why, under the tile: "Short
      return of the index since 2026-07-26 (inception) -- today's composition
      applied across the full period, matching the chart." The page's own
      script comments that the period before the first held position "is
      pro-forma (today's composition applied to past closes) and must NOT
      feed the headline change". The headline is exactly the figure that it
      feeds.
    steps:
      - 'POST https://cymetica.com/mcp/v1 tools/call get_fund_methodology {} -> methodology.returns: "... nothing backfilled, no backtest."'
      - 'tools/call get_fund {"symbol":"FTA-CRYPTOS"} -> inception_date 2026-07-26, last_composition_change 2026-08-17'
      - 'GET https://cymetica.com/api/v1/fta-fund/history -> inception 2026-08-09, points[0].t 2026-08-21'
      - 'GET https://cymetica.com/fund-performance -> "today''s composition applied across the full period" under Return since inception (short)'
    body: >
      Filed medium because of who reads it: the advisor connector exists so an
      assistant can brief a client, and the one sentence it is given about
      returns is the one this contradicts, on a fund that takes deposits.
      Your page is honest about it in small print, and your chart code already
      separates the pro-forma stretch from the held one -- the headline tile
      and get_fund just do not use that separation.
      Our check compares the inception get_fund publishes with the one the
      fund's own history publishes, while the methodology says nothing is
      backfilled. Either fix satisfies it: start the published return where
      the record starts, or say in the methodology that a short book's early
      stretch is pro-forma. We are not asking for either one in particular.
      Related, and not part of this finding: M&A Ripple, also LIVE, is live
      since 2026-08-11 by its own history, and 10.0 of its roughly 17 points
      since inception accrued before that date (index 100 to 110.0); since
      going live it is up about 6.4 %. If the pre-live stretch is a model
      track rather than held positions, the same sentence applies to it.

  - key: tradeable-card-buy-500
    findings: [CYM-a_card_that_reads_tradeable_now_takes_a_paper_buy]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161/buy
    title: "A card reading tradeable_now true answers a paper buy with HTTP 500 \"Buy failed\""
    expected: >
      The card's own tradeability block: tradeable_now is "True when a
      position can be opened on this card RIGHT NOW via POST /buy, /sell or
      /short (paper or live per your account mode); False carries
      trading_blocked_reason. This is the only trade gate." So a paper buy on
      a card reading true opens a position, or is refused with a reason.
    actual: >
      Card a4a5b71e-de11-4805-b8a3-ed9c3f8f8161 ("SpaceX IPO: Top 10 Crypto
      Plays") reads status live, tradeable_now true, trading_blocked_reason
      null, pw_live true. A paper POST /buy of 1,189.04 USDC answered HTTP 500
      {"detail": "Buy failed"} twice, at 17:01:28 and 17:04:10 UTC on
      2026-09-21. No position was created and the account did not change. The
      same account's buys on two other cards were accepted earlier the same
      day, and when a buy is refused for a reason the platform names it (a 400
      "This card's price is not currently available" on 2026-09-13).
    steps:
      - 'GET https://cymetica.com/api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161 -> tradeable_now true, trading_blocked_reason null'
      - 'POST /api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161/buy with an X-API-Key, paper, 1189.04 USDC -> HTTP 500 {"detail":"Buy failed"}'
      - 'Repeat three minutes later -> the same 500; GET the account and positions -> unchanged'
    body: >
      Your own Nexus picked this card for us, confirming tradeable_now itself
      before naming it, so an agent following Nexus's advice to the letter
      hits a 500 with nothing to act on. A guess at the cause, clearly
      labelled as one: six of the card's ten legs carry weight 0.0 (NEO, CKB,
      BANANA, ANKR, FIL, ONT), which is the one thing unusual about its basket
      next to the cards that bought fine.
      Our check places no order: it reads the outcome of our newest paper buy,
      and fails only when that buy got a 5xx on a card still reading
      tradeable_now true. So it goes green the next time a buy we place is
      accepted, or is refused with a 4xx that names its reason -- either
      satisfies us.

  - key: refused-clone-says-try-again
    findings: [CYM-a_refused_paper_clone_says_why]
    severity: low
    category: api
    url: https://cymetica.com/api/v1/cloned-bots/clone
    title: "A paper clone is refused 400 \"Invalid clone request. Please try again.\" and trying again is refused the same way"
    expected: >
      Your openapi entry for POST /api/v1/cloned-bots/clone says "Paper mode
      clones are free -- no deposit required", takes CloneBotRequest
      (source_type and source_id required; paper / is_paper true = paper
      clone) and documents two responses, 200 CloneBotResponse and 422
      HTTPValidationError; llms.txt adds "Clone any of 11 AI trading agent
      species". So a schema-valid paper clone of a bot that
      /api/v1/cloned-bots/available lists is made, or refused with a reason an
      agent can act on -- the way your other refusals already are: /fund
      answers {"detail":{"error":{"code":"UNAUTHORIZED","message":"Valid JWT
      token required"}}}, and the MCP wording filter answers QUERY_RESTRICTED
      with a reason and a hint.
    actual: >
      A paper clone of Perceptron Oracle (wta_species
      23441934-8475-4aa0-bbff-75c03ecd3284), sent with an X-API-Key and the
      same body shape that had just cloned MACD Hunter (13:38:10), Fibonacci
      Phoenix (13:38:34) and RSI Sniper (13:38:45) on the same account,
      answered HTTP 400 {"detail": "Invalid clone request. Please try again."}
      at 13:39:02 UTC on 2026-09-22. Trying again at 17:47:14 UTC: the same
      400, the same sentence. We found no limit on cloning in the openapi
      entry, llms.txt or /api-docs.
    steps:
      - 'GET https://cymetica.com/openapi-public.json -> POST /api/v1/cloned-bots/clone documents responses 200 and 422; description "Paper mode clones are free -- no deposit required"'
      - 'POST /api/v1/cloned-bots/clone with an X-API-Key and {"source_type":"wta_species","source_id":"23441934-8475-4aa0-bbff-75c03ecd3284","paper":true,"is_paper":true} -> HTTP 400 {"detail":"Invalid clone request. Please try again."}'
      - 'Repeat the same request, as the message asks -> the same 400 and the same sentence'
    body: >
      "Please try again" tells an agent the failure is transient, so an agent
      that does what it is told retries -- and every retry is refused the same
      way. Our account already holds a paper clone of Perceptron Oracle
      (d778102d, cloned 2026-09-10), so a limit of one clone per species per
      account may be the reason. That is a guess, clearly labelled as one. If
      it is the reason, saying so in the refusal, and in the openapi entry, is
      the whole of what we are asking for.

      Our check places no clone: it reads our own recorded attempts and the
      response captured for each, judges every species a clone of ours was
      refused on by its newest attempt, and fails only when the refusal asks
      for a retry that a retry has already refuted, or carries no detail at
      all. A clone that is made, or a refusal that names its reason, clears
      it.

      CORRECTION TO #89 (fixed and paid, 2026-09-10). We wrote there that
      POST /api/v1/cloned-bots/{id}/fund refused our key with "a bare 401 with
      an empty body", and argued that an agent could not tell a wrong key from
      the wrong kind of key. That was our error, not yours: your response
      carried {"detail":{"error":{"code":"UNAUTHORIZED","message":"Valid JWT
      token required"}}}, which names the kind. Our recorder dropped the body
      of every refusal and wrote {} in its place. It is fixed, and this report
      is the first written from the corrected record. The finding in #89 --
      the key was not accepted on /fund -- stands, and you fixed it the same
      day.

  - key: api-docs-clone-example-missing-required
    findings: [CYM-every_request_example_on_api_docs_carries_what_its_route_requires]
    severity: low
    category: documentation
    url: https://cymetica.com/api-docs
    title: "The /api-docs example for POST /api/v1/cloned-bots/clone sends bot_id; the route requires source_type and source_id"
    expected: >
      A curl example on /api-docs is a request its route accepts.
      /openapi-public.json -- the schema llms.txt tells agent builders to
      import -- gives POST /api/v1/cloned-bots/clone a CloneBotRequest body
      whose required fields are source_type and source_id.
    actual: >
      /api-docs shows curl -X POST https://cymetica.com/api/v1/cloned-bots/clone
      -d '{"bot_id": "bot_abc123", "is_paper": true}'. That body carries
      neither required field, and bot_id is not a CloneBotRequest property at
      all, so it is a request your own schema documents as a 422
      (HTTPValidationError). The response block under it ({"clone_id",
      "source_bot_id", "simulated_balance": 10000.00, "status": "active"}) is
      not what the route returns either: llms.txt says a clone "starts PAUSED
      with 0 balance", and the live response carries id, source_id, is_paper
      and is_trading false. The other five request examples on the page that
      target a route the schema publishes carry every field it requires.
    steps:
      - 'GET https://cymetica.com/api-docs -> the code block under POST /api/v1/cloned-bots/clone sends {"bot_id": "bot_abc123", "is_paper": true}'
      - 'GET https://cymetica.com/openapi-public.json -> components.schemas.CloneBotRequest.required = ["source_type", "source_id"]; its properties are source_type, source_id, custom_name, is_paper, paper'
      - 'GET https://cymetica.com/api/v1/cloned-bots/available -> the source_type (by group) and source_id (per bot) the example should carry'
    body: >
      The right shape is one GET away, but an agent that learns the route from
      /api-docs sends bot_id and gets a validation error back.

      Our check reads every curl example with a JSON body on /api-docs,
      matches it to its route in /openapi-public.json, and fails when a field
      the route requires is left out. It judges the request only, not the
      response block. It goes green when the clone example carries
      source_type and source_id.

  - key: nexus-arena-routes-unpublished
    findings: [CYM-every_route_nexus_tells_an_agent_to_call_is_published]
    severity: low
    category: documentation
    url: https://cymetica.com/api/v1/arena/state
    title: "Nexus sends agents to three Arena REST routes /openapi-public.json does not publish, and one of them answers 404"
    expected: >
      A REST route your own AI tells an agent to call is one the agent can
      find in /openapi-public.json, the schema llms.txt tells agent builders
      to import -- and one the server serves.
    actual: >
      NEX-0076 (ask_nexus_deep, answered 2026-09-22 18:35:51 UTC), asked how
      the Arena settles, names REST twins for its Arena tools: POST
      /api/v1/arena/order, GET /api/v1/arena/state and GET
      /api/v1/arena/positions. None of the three is in /openapi-public.json,
      whose only Arena path is /api/v1/arena/market. Read anonymously at
      19:5x UTC: /api/v1/arena/state answers 404 {"detail":"Not Found"},
      /api/v1/arena/positions answers 401 "Authentication required", and
      /api/v1/arena/order answers 405 to a GET -- so two are served and
      unpublished, and the one named for reading the Arena's state does not
      exist.
    steps:
      - 'ask_nexus_deep "How does the CyMetica-42 Arena settle? ... Name the tool that shows it." -> the answer names "REST twin: GET /api/v1/arena/state", "GET /api/v1/arena/positions" and "REST POST /api/v1/arena/order"'
      - 'GET https://cymetica.com/openapi-public.json -> the only path containing "arena" is /api/v1/arena/market'
      - 'GET https://cymetica.com/api/v1/arena/state -> 404 {"detail":"Not Found"}'
    body: >
      An agent that follows the answer either reaches a 404 or has to call
      routes it cannot find in the schema it was told to import. The MCP
      tools the same answer names (get_arena_state, get_arena_positions,
      place_arena_order) are served; it is the REST twins that are not where
      the answer says. The same gap was relayed on Telegram on 2026-09-21 for
      another route (MSG-0039).

      Our check reads the newest recorded Nexus answer that names a route and
      fails when a named /api/v1 path is not in /openapi-public.json. It does
      not test whether the route works. It goes green when the routes Nexus
      names are published, or when Nexus names the ones that are.

  - key: card-tradeable-now-disagrees-mcp-rest
    findings: [CYM-a_card_is_tradeable_on_every_surface_or_on_none]
    severity: medium
    category: api
    url: https://cymetica.com/mcp/v1
    title: "get_event_card_info says tradeable_now true for stock cards that GET /api/v1/event-cards/{id} says are closed"
    expected: >
      One answer to "can a position be opened on this card right now". The
      card's tradeability block on GET /api/v1/event-cards/{id} says of
      tradeable_now: "True when a position can be opened on this card RIGHT
      NOW via POST /buy, /sell or /short ... False carries
      trading_blocked_reason. This is the only trade gate." The MCP tool
      get_event_card_info returns a field of the same name for the same card,
      so the two have to agree.
    actual: >
      On 2026-09-22 between 23:20 and 23:25 UTC, with US equity markets closed
      (your listing itself said us_market_open: false), 21 of 25 live stock
      cards read tradeable_now false on REST -- "US equity markets are closed
      -- this card holds stocks and trades during US market hours" -- and
      tradeable_now true through get_event_card_info in the same minute. A
      second sample of 16 cards gave 8 disagreeing, a70b8d5e-c57f-4ef7-ac53-
      b29148e5b920 among them. The tool's trading_window reads only the card's
      close date ("closes 2026-09-25T23:17Z"). Your Nexus reads cards through
      that tool: asked for one card "live and tradeable right now", it answered
      with a70b8d5e, "Verified live and tradeable this run ...
      get_event_card_info returned status: live, tradeable_now: true", while
      the REST gate reported it closed.
    steps:
      - 'GET https://cymetica.com/api/v1/event-cards/a70b8d5e-c57f-4ef7-ac53-b29148e5b920 outside US market hours -> tradeable_now false, trading_blocked_reason "US equity markets are closed ..."'
      - 'tools/call get_event_card_info {"query": "a70b8d5e-c57f-4ef7-ac53-b29148e5b920"} on /mcp/v1 in the same minute -> result.cards[0].tradeable_now true, trading_window "closes 2026-09-25T..."'
      - 'The same for any card GET /api/v1/event-cards marks closed that has stock legs (has_stock_legs true)'
    body: >
      An agent on MCP, and your own Nexus, are told a stock card can be traded
      when the trade gate says it cannot: the tool's tradeable_now appears to
      follow the card's trading window only, not US market hours. During US
      market hours the two agree, so it shows between 20:00 and 13:30 UTC and
      at weekends. Either the tool applies the same gate as REST, or the field
      carries a different name so it cannot be read as that gate.

      Our check reads up to twelve cards the listing marks closed and four it
      marks open, on both surfaces, and fails on any disagreement; with
      nothing closed it is inconclusive, never a pass.

  - key: report-created-behind-a-500
    findings: [CYM-a_report_the_server_creates_is_answered_as_created]
    severity: low
    category: api
    url: https://cymetica.com/api/v1/bounty/reports
    title: "POST /api/v1/bounty/reports answers HTTP 500 for reports it has created (#110, #113, #122)"
    expected: >
      llms.txt documents POST /api/v1/bounty/reports as the route a hunter
      files through. A 5xx tells the client the request was not completed, so
      a created report is answered 2xx with its id, and a 5xx means nothing
      was created.
    actual: >
      Three of our submissions were answered HTTP 500 and the report existed
      anyway: #110 (2026-09-20 17:40 UTC), #113 (2026-09-20 21:01 UTC) and
      #122 (2026-09-22 23:55 UTC -- your server_created_at 23:55:08, the 500
      at 23:55:18). Each was found only because our client reconciles an
      unclear outcome against GET /api/v1/bounty/my-reports. That is three of
      about thirteen submissions over those three days.
    steps:
      - 'POST /api/v1/bounty/reports with an X-API-Key and a well-formed report -> intermittently HTTP 500'
      - 'GET /api/v1/bounty/my-reports seconds later -> the report is there, with an id and a created_at before the 500'
    body: >
      A client that does what a 500 says -- assumes nothing was filed and
      retries -- files the report twice; your 409 on a duplicate title within
      24 hours only catches a retry that keeps the title. A guess, labelled
      as one: the created_at before the 500 suggests a step after the insert
      fails and its error is returned in place of the created report.

      Our check files nothing: it reads our own journal of submissions and
      judges the newest twelve. A 5xx whose report exists fails it; twelve
      clean ones pass it, since at the rate we saw a clean twelve happens by
      chance less than one time in twenty.

