  - key: agent-league-prize-log-stops-at-200
    findings: [CYM-the_prize_log_reaches_every_prize_it_recorded]
    severity: low
    category: logic
    url: https://cymetica.com/api/v1/agent-league/prizes?limit=200
    title: >-
      Agent League: the prize log answers its newest 200 records and no more, so every credited prize of
      October (ids 1-46) can no longer be read, and month_committed_et10 cannot be reconciled with the list
    expected: >
      llms.txt names "Terms and the prize log: GET /api/v1/agent-league/prizes". A log reaches every record
      it holds: by paging, by a filter for one player, or by a route that answers an owner's own prizes. The
      response's month_committed_et10 can be checked against the rows it is made of.
    actual: >
      Read on 2026-10-17 around 06:45 UTC, anonymously. GET /prizes answers the newest 50; ?limit=200 answers
      ids 47-246, all 200 "capped"; ?limit=201 is a 422 ("less than or equal to 200"). offset=200, before=47,
      before_id=47, page=2, cursor=47, player_id and status all return the same window. GET /me carries no
      prizes; /me/prizes and /players/{id}/prizes are 404. So ids 1-46, which hold October's credited prizes
      (on 2026-10-12, when the log had 90 rows, ids 4, 5 and 9-14 were 1,000 ET10 each, credited to player
      2), cannot be read by anyone, and month_committed_et10 49,585 sits beside 200 rows worth 0 ET10. The
      answer to our question on capped prizes said "ask for more rows and it is there"; that holds only while
      a record is among the newest 200, and the log grows by about 35 a day (id 47 at 2026-10-11 13:47 UTC,
      id 246 at 2026-10-17 06:00 UTC).
    steps:
      - 'GET https://cymetica.com/api/v1/agent-league/prizes?limit=200 -> 200 rows, min id 47, max id 246, every status "capped"; month_committed_et10 49585.0'
      - 'GET https://cymetica.com/api/v1/agent-league/prizes?limit=201 -> 422 {"type": "less_than_equal", "ctx": {"le": 200}}'
      - 'GET https://cymetica.com/api/v1/agent-league/prizes?limit=200&offset=200 (also before=47, page=2, player_id=2, status=credited) -> the same ids 47-246'
    body: >
      An owner cannot see a prize credited to them once 200 newer ones exist, and nobody can audit the
      monthly cap from the log. An offset or before_id parameter, or a player_id filter, would fix it. Low:
      the ET10 itself is credited. Our check passes when the list is short of its ceiling or any paging
      parameter reaches a record older than the window. GET requests only.

  - key: account-claim-deposit-hidden-when-nothing-pending
    findings: [CYM-the_claim_form_opens_when_nothing_is_pending]
    severity: low
    category: logic
    url: https://cymetica.com/account
    title: >-
      My Balances: the only "Submit tx hash" control sits in the Pending Deposits card, which is hidden when
      nothing is pending, so an undetected deposit cannot reach the claim form
    expected: >
      The Claim Missing Deposit form on /account says: "If your deposit wasn't detected automatically, paste
      the transaction hash below." A deposit that was not detected is exactly the case with nothing pending,
      so the control that opens the form is there when the pending list is empty.
    actual: >
      Read on 2026-10-17 from the public /account page and the scripts it loads. The only control that opens
      the form, the button data-click="openClaimDepositForm" ("Deposit not showing? Submit tx hash"), is inside
      the card #accountPendingDeposits. The page script's loadAccountPendingDeposits runs
      "if (pending.length === 0) { container.style.display = 'none'; return; }" on that card. No other element
      and no script on the page calls openClaimDepositForm. So with an empty pending list the button is hidden,
      and an undetected deposit leaves the list empty. The Deposit dialog's "Sent a deposit but don't see it?
      Scan all networks" is a different, automatic scan (POST /api/v1/funding/deposit/full-scan), not the
      tx-hash form.
    steps:
      - 'GET https://cymetica.com/account -> the button data-click="openClaimDepositForm" is a descendant of <div id="accountPendingDeposits">; the form <div id="claimDepositForm"> follows it'
      - 'GET https://cymetica.com/account/page-script.e2561648e3d33fa3.js -> loadAccountPendingDeposits: var container = document.getElementById(''accountPendingDeposits''); ... if (pending.length === 0) { container.style.display = ''none''; return; }'
      - 'The 23 scripts /account loads (its page script among them) and its inline scripts contain no other call of openClaimDepositForm'
    body: >
      A user whose deposit was not detected, the case the form exists for, sees no way to submit the
      transaction hash on /account. Moving the button out of the Pending Deposits card, or keeping the card
      (with its button) visible when nothing is pending, would fix it. Low: the Deposit dialog's network scan
      may still find the deposit. Our check passes when a control outside the card or a script call opens the
      form, or when the card is no longer hidden on an empty list. GET requests only.

