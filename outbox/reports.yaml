      - 'GET https://cymetica.com/api/v1/gem-screener/coins/STONK -> "degen_level": null'
      - 'GET https://cymetica.com/api/v1/gem-screener/status -> age_seconds about 25000, refresh_every_seconds 21600, "refreshing": true'
      - 'Open https://cymetica.com/gem-screener/app?view=apps -> the Degen meter column is a dash with empty segments on every row'
