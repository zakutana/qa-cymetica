  - key: tradeable-card-not-priceable
    findings: [CYM-a_card_that_reads_tradeable_now_can_be_priced]
    severity: medium
    category: api
    url: https://cymetica.com/api/v1/event-cards/8ffd61fa-f469-45be-a717-a4dcfe9f9508/buy
    title: "A card reading tradeable_now true, with no blocked reason, is refused a paper buy: 400 \"Basket is not fully priceable right now\""
    expected: >
      The card's own tradeability block: tradeable_now is "True when a
      position can be opened on this card RIGHT NOW via POST /buy, /sell or
      /short (paper or live per your account mode); False carries
      trading_blocked_reason. This is the only trade gate." So while a card
      reads true, a paper buy on it opens a position; when the basket cannot
      be priced the gate reads false and says why.
    actual: >
      Card 8ffd61fa-f469-45be-a717-a4dcfe9f9508 (five legs ARB, STRK, OP, ZK
      and SOON at 0.2 each) read status live, tradeable_now true,
      trading_blocked_reason null on every read we made on 2026-10-12,
      including one a few seconds before each order. A paper POST /buy of 593.63 USDC
      answered HTTP 400 {"detail": "Basket is not fully priceable right now
      -- try again shortly"} twice, 23 minutes apart, at 16:25:45 and
      16:48:39 UTC. No position was created and the account did not change.
      In the first minute another card took a paper buy (HTTP 200). The card
      itself still showed a current_index of 105.29 when the check read it at
      17:02 UTC, so the card prices; the buy does not.
    steps:
      - 'GET https://cymetica.com/api/v1/event-cards/8ffd61fa-f469-45be-a717-a4dcfe9f9508 -> status live, tradeable_now true, trading_blocked_reason null (16:25:40 and 16:48:35 UTC)'
      - 'POST /api/v1/event-cards/8ffd61fa-f469-45be-a717-a4dcfe9f9508/buy with an X-API-Key, {"amount_usdc": 593.63, "paper": true} -> HTTP 400 {"detail":"Basket is not fully priceable right now — try again shortly"} (16:25:45 UTC)'
      - 'Repeat 23 minutes later, the card read true again a few seconds before -> the same 400 (16:48:39 UTC); GET the account and positions -> unchanged'
    body: >
      Not #117: that was a 500 "Buy failed" and its fix arrived as an answer
      that names its reason, which is what we asked for there. What is left is
      the gate itself, which reads true and carries no reason while the buy is
      refused for one. A refusal of the same kind on another card, on
      2026-09-13 (HTTP 400 "This card's price is not currently available"),
      is not counted: we did not record the gate then. How to fix it is yours: fold the pricing of the
      basket into tradeable_now so an agent that trusts the flag is told, or
      say in the docs that the flag does not cover it. We do not know which
      leg cannot be priced. Our check places no order: it reads our own record
      of every paper buy and the gate we read just before it, and fails while
      the newest buy of a card refused this way is still refused and the card
      still reads true. It goes green when a buy of that card is accepted, or
      when the card reads false with a reason.

  - key: agent-tournaments-table-goes-dead
    findings: [CYM-agent-tournaments-running-table-keeps-trading]
    severity: low
    category: logic
    url: https://cymetica.com/api/v1/agent-tournaments/tables/2
    title: >-
      Agent Tournaments: on a running table every house bot stops trading for most of the day, five of
      them at exactly 40 trades; the rules promise 7 days of trading and name no limit
    expected: >
      GET /api/v1/agent-tournaments/rules says a table "runs 7 days" and that each house bot is "a
      different strategy trading the same paper capital". It names no limit on how many trades a seat
      makes, and neither do llms.txt or the OpenAPI (we read them for per day, daily, allowance, quota,
      max trades and trade cap). So a running table keeps trading, and its standings and race chart keep
      moving, through its 7 days.
    actual: >
      Table 2 (Pro, started 2026-10-11 16:46 UTC) read on 2026-10-12 at 20:27 and 20:34 UTC, anonymous:
      volume_usdc 5604.4 and every standing unchanged between the two (ROI +132.95, +46.04, +26.80 ...).
      The table's own race lines, one point an hour, show the last ROI move of any seat at hour 14
      (06:46 UTC), so nothing closed for 13.8 h. Trades per house seat:
      Ichimoku Empress, Trend Titan, Fibonacci Phoenix, Stochastic Striker and Divergence Dragon at
      exactly 40; Perceptron Oracle 31, Bollinger Bandit 31, ATR Alpha 30. The two member seats show 0 (one
      is the deleted bot of #195). Table 11 (the same house bots, started 18:14 UTC) at 20:28 and again
      at 20:34 UTC: Ichimoku Empress, Divergence Dragon, Stochastic Striker, MACD Hunter and RSI Sniper
      at exactly 20 and unchanged between the two reads, while ATR Alpha went 16 to 17 and the member bot
      StockBot (Blue) Clone 52 to 54 in the same six minutes. So the market was trading and a member bot
      was not held to 20 or 40. Read together, every house seat on both tables fits "20 trades a UTC day"
      (on table 2, trades minus 20 is between 10 and 20 for all eight), which would leave a house-filled
      table's standings frozen for most of each day. That is our reading of the numbers; the page and
      the API say nothing about it.
    steps:
      - 'GET https://cymetica.com/api/v1/agent-tournaments/rules -> start "runs 7 days"; house_bots "Each house bot is a different strategy trading the same paper capital"; no limit on trades'
      - 'GET https://cymetica.com/api/v1/agent-tournaments/tables/2 at 20:27 UTC -> status running, day 2, volume_usdc 5604.4; standings[].trades 40, 40, 31, 0, 0, 40, 30, 40, 31, 40; race.lines[].points identical from index 14 on'
      - 'GET https://cymetica.com/api/v1/agent-tournaments/tables/11 at 20:28 and 20:34 UTC -> five house seats trades 20 and unchanged; ATR Alpha 16 then 17; StockBot (Blue) Clone 52 then 54'
    body: >
      How to fix it is yours: publish the allowance in /rules and on the table page if it is meant, or
      lift it if it is not; if it is a stalled runner, restart it. We do not know which, and a read
      after 00:00 UTC will tell a daily allowance from a stall. Our check reads every running table of
      the lobby anonymously, and fails while one that is more than 12 h in has a stretch of 12 h or
      more in its race history with no seat's ROI line moving (the same table's longest quiet stretch
      while it was trading is 3 h). It cannot tell a limit from a stall. If the limit is published, we
      retire the check. GET requests only.

  - key: event-card-index-history-hole-on-live-crypto-card
    findings: [CYM-live-crypto-card-index-history-has-no-multi-day-hole]
    severity: low
    category: logic
    url: https://cymetica.com/api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161/index-history?interval=30d
    title: >-
      Event cards: the live BTC-basket card a4a5b71e has no index-history point for 51.6 h
      (Sep 23 14:16 to Sep 25 17:54 UTC) while 14 other crypto cards kept recording
    expected: >
      A card that reads status live, tradeable_now true and trading_closes_at null, and whose basket
      is 99% BTC, is priced around the clock, and its index-history keeps its cadence. Nothing in
      llms.txt, the OpenAPI or the card says its history may stop recording for days.
    actual: >
      GET /api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161/index-history?interval=30d,
      anonymous, read on 2026-10-12 (the same on an earlier read the same day): one point every
      3 h, 8 a day, on every day of the window except Sep 23 (5 points, the last 14:16:52 UTC, index
      137.714), Sep 24 (none) and Sep 25 (3 points, the first 17:54:33 UTC, index 134.256). That is
      51.6 h between two consecutive points, while the index moved by 3.46. interval=all shows the
      same hole (56.8 h). It is this card only: all 14 of the other open crypto cards that already
      had history (among them 30408a4b, 30015006 and 5d91bf43, 17, 17 and 18 points) recorded points
      inside those same hours, and no other open crypto card has a gap over 12 h. The only stretch
      every card shares is Sep 17 14:40 to 20:59 UTC (6.3 h). The card reads live and tradeable
      today (trading_closes_at null, trading_blocked_reason null).
    steps:
      - 'GET https://cymetica.com/api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161 -> status live, tradeable_now true, trading_closes_at null, basket BTC 0.9922'
      - 'GET https://cymetica.com/api/v1/event-cards/a4a5b71e-de11-4805-b8a3-ed9c3f8f8161/index-history?interval=30d -> points[].t: 2026-09-23T14:16:52Z, then 2026-09-25T17:54:33Z'
      - 'GET /api/v1/event-cards/{id}/index-history?interval=30d for the ids starting 30408a4b, 30015006 and 5d91bf43 (ids from /api/v1/event-cards) -> 17, 17 and 18 points between those two times. The proxy is in /api/v1/event-cards only with include_user_submitted=true.'
    body: >
      Why this matters to a client: we use this card as the BTC benchmark, and 46 of our paper rooms
      had a window spanning the hole, so a return was set against a series that was not recording.
      How to repair it is yours: backfill the missing hours if the prices exist, or say on the card
      that a history can have holes. We do not know the cause and do not assert one. Our check reads
      every open crypto card of the list and fails while one has more than 12 h between two points of
      its 30-day history; it will read the hole until it leaves that window around Oct 25, so a pass
      after that date is the window, and a backfill is what we would see before it. GET requests only.

  - key: vaix-orderbook-arbitrage-buys-on-an-excluded-venue
    findings: [CYM-vaix-orderbook-arbitrage-does-not-use-an-excluded-venue]
    severity: low
    category: logic
    url: https://cymetica.com/api/v1/vaix/orderbook
    title: >-
      VAIX orderbook: arbitrage.buy_chain is base at 0.00031 (+514 %), the same venue and figure
      excluded_venues lists as price_divergence -83.75 %
    expected: >
      A response that sets a chain aside as a price divergence from its reference price does not
      then offer that chain's price as the buy leg of an arbitrage with a 514 % profit. If
      `arbitrage` is meant to range over the excluded venues too, the route says so. It does not:
      /api/v1/vaix/orderbook is one line in llms.txt ("VAIX orderbook") and is in neither
      openapi-public.json (397 paths, none with vaix) nor /api-docs, so what `excluded_venues` and
      `arbitrage` mean is written nowhere we can read.
    actual: >
      GET /api/v1/vaix/orderbook, anonymous, read on 2026-10-12 at 22:32:27 UTC (figures below), and
      again at 22:39:04 and 22:39:37 with the same overlap (base 0.00031079, potential_profit_pct
      514.44). `orderbook.excluded_venues` holds base (mid 0.00031077, divergence_pct -83.75, reason
      price_divergence), arbitrum (-54.91) and solana (-80.54), with `reference_price` 0.00191274. In
      the same object `orderbook.arbitrage` reads buy_chain base, buy_price 0.00031077 (the excluded
      mid to the last digit), sell_chain ethereum, sell_price 0.00191274, spread_pct 515.48,
      potential_profit_pct 514.48. From the same body, base holds liquidity_usd 164.17, arbitrum
      13.16 and solana 7.26, against ethereum's 25,128.27.
    steps:
      - 'GET https://cymetica.com/api/v1/vaix/orderbook -> orderbook.excluded_venues.base: {mid, divergence_pct -83.75, reason price_divergence}'
      - 'same body -> orderbook.arbitrage: {buy_chain base, buy_price equal to that mid, potential_profit_pct about 514}'
      - 'GET https://cymetica.com/openapi-public.json -> no path containing vaix (397 paths); GET /llms.txt -> "VAIX orderbook" and nothing about either block'
    body: >
      We do not know which is meant, and do not assert one. A client that reads `excluded_venues` as
      "do not trust these prices" and a client that reads `arbitrage` as "a trade the book offers" are
      both reading the response as written, and they disagree about base. It is either an arbitrage
      computed over venues the book itself withholds (then say so, or leave it out of the headline),
      or a block that should have used the venues the book kept. Our check fails only while both of
      two reads, thirty seconds apart, show a leg of `arbitrage` that is a key of `excluded_venues`;
      it passes when `arbitrage` is absent or neither leg is excluded, and we retire it if you
      publish that the overlap is intended. GET requests only.

