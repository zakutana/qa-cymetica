<div class="pc" id="pc" data-view="deck">
<svg class="pc-defs" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="pc-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00cfff"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
</defs></svg>

<!-- the Den: the room, the card in Nexus's hand, Nexus in front of it (build_scene.py) -->
<img class="pc-room" src="/_pc/scene.webp" alt="" aria-hidden="true">
<div class="pc-nx" aria-hidden="true"><img src="/_pc/nexus.webp" alt=""><i class="pc-eye a"></i><i class="pc-eye b"></i></div>

<header class="pc-bar" id="bar">
  <a class="pc-brand" href="#" data-tab="deck" aria-label="Pitch Cards">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="6" width="15" height="21" rx="4" transform="rotate(-12 12.5 16.5)" fill="none" stroke="#00cfff" stroke-opacity=".55" stroke-width="1.6"/>
      <rect x="11" y="4.5" width="15.5" height="22" rx="4.2" transform="rotate(8 18.7 15.5)" fill="#0b1422" stroke="url(#pc-g)" stroke-width="2"/>
      <path d="M14.6 20.4l3.2-3.4 2.2 1.9 3.9-5.6" transform="rotate(8 18.7 15.5)" fill="none" stroke="#00ff88" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="pc-w"><span>PITCH</span><b>CARDS</b></span>
  </a>
  <nav class="pc-tabs" aria-label="Pitch Cards">
    <button type="button" data-tab="deck" class="on">Pitches<i id="nNew"></i></button>
    <button type="button" data-tab="deals">My deals<i id="nDeals"></i></button>
    <button type="button" data-tab="board">Profit Board</button>
  </nav>
</header>

<section class="pc-view pc-deckview" data-v="deck">
  <div class="pc-copy" id="copy">
    <h1>Nexus pitches.<br>You swipe.<br><span>Every result public.</span></h1>
  </div>
  <div class="pc-deck" id="deck"></div>
  <div class="pc-acts" id="acts">
    <button type="button" class="pc-pass" id="no" title="Pass (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>Pass</button>
    <button type="button" class="pc-go" id="yes" title="Invest (→)">Invest<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
  </div>
</section>

<section class="pc-view pc-page" data-v="deals">
  <h2 class="pc-h2">My deals</h2>
  <div class="pc-stats" id="dealTiles"></div>
  <div class="pc-list" id="dealList"></div>
</section>

<section class="pc-view pc-page pc-pb" data-v="board">
  <h2 class="pc-pbh">What would have made you money <span>on Cymetica.</span></h2>
  <div class="pb-tabs" id="boardSeg"></div>
  <p class="pb-asof" id="boardSrc"></p>
  <table class="pb-table">
    <thead id="boardHead"></thead>
    <tbody id="board"></tbody>
  </table>
  <button type="button" class="pb-more" id="more">Show more</button>
</section>

<a class="pc-push" id="push" href="#" hidden>
  <img src="/_pc/nexus-face.webp" alt="">
  <span class="pc-push-t"><em>Nexus · now</em><b id="pushT"></b><span id="pushS"></span></span>
</a>
<div class="pc-toast" id="toast" hidden></div>
</div>
