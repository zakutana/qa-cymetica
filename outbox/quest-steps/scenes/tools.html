<!doctype html>
<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
} }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { TTFLoader } from 'three/addons/loaders/TTFLoader.js';
import { Font } from 'three/addons/loaders/FontLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || innerWidth), H = +(Q.get('h') || innerHeight);

await new Promise((r) => {
  const links = [...document.querySelectorAll('link[href*="fonts.googleapis"]')];
  let left = links.length;
  if (!left) return r();
  links.forEach((l) => { if (l.sheet) { if (!--left) r(); } else l.onload = l.onerror = () => { if (!--left) r(); }; });
});
await Promise.all([
  document.fonts.load('400 248px "Archivo Black"'),
  document.fonts.load('800 32px "JetBrains Mono"')
]);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.94;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(31.2, W / H, 0.1, 300);

// ---- Custom HDR Cyber-Foundry Studio Environment for crisp metallic & clearcoat speculars
{
  const ec = document.createElement('canvas'); ec.width = 1024; ec.height = 512;
  const ex = ec.getContext('2d');
  const bg = ex.createLinearGradient(0, 0, 0, 512);
  bg.addColorStop(0, '#0c182b'); bg.addColorStop(0.48, '#050a14'); bg.addColorStop(0.52, '#03050a'); bg.addColorStop(1, '#08141e');
  ex.fillStyle = bg; ex.fillRect(0, 0, 1024, 512);
  const strip = (x, y, w, h, c0, c1) => {
    const g = ex.createRadialGradient(x, y, 2, x, y, Math.max(w, h));
    g.addColorStop(0, c0); g.addColorStop(0.45, c1); g.addColorStop(1, 'rgba(0,0,0,0)');
    ex.save(); ex.translate(x, y); ex.scale(1, h / w); ex.fillStyle = g;
    ex.beginPath(); ex.arc(0, 0, w, 0, Math.PI * 2); ex.fill(); ex.restore();
  };
  strip(512, 68, 360, 40, 'rgba(255,255,255,1)', 'rgba(205,235,255,0.48)');
  strip(280, 128, 190, 32, 'rgba(240,252,255,0.95)', 'rgba(0,207,255,0.38)');
  strip(744, 132, 190, 32, 'rgba(240,255,248,0.95)', 'rgba(0,255,136,0.38)');
  strip(132, 232, 200, 28, 'rgba(0,207,255,0.95)', 'rgba(0,150,220,0.30)');
  strip(892, 232, 200, 28, 'rgba(0,255,136,0.92)', 'rgba(0,190,110,0.28)');
  strip(512, 392, 280, 42, 'rgba(0,235,195,0.38)', 'rgba(0,120,160,0.08)');
  const envTex = new THREE.CanvasTexture(ec);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(envTex).texture;
  scene.environmentIntensity = 0.96;
  envTex.dispose(); pmrem.dispose();
}

let seed = 23;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const TAU = Math.PI * 2;
const UP = new THREE.Vector3(0, 1, 0);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = (x) => { x = clamp01(x); return 1 - Math.pow(1 - x, 3); };
const settle = (x) => { x = clamp01(x); const c = 1.75; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a, b) => clamp01((t - a) / (b - a));
const bump = (t, a, b) => Math.sin(Math.PI * win(t, a, b));
const lerpV = (a, b, k) => a.clone().lerp(b, k);

// ---- The pipeline's six chambers, the page's own (anim.js CH, quest.css .ch), and the seconds each one works on the clock
// the page's panel reads ("ted i ty barvy zarad do animace robotickych rukou", 2026-11-01): the whole forge works in the
// colour of the chamber the panel is in
const CHAMBERS = ['#5b9bff', '#b76dff', '#00cfff', '#ffc83d', '#ff5a68', '#00ff88'].map((h, i) => ({ c: new THREE.Color(h), t0: 2.0 + i * 0.7 }));
const IDLE_A = new THREE.Color(0x00cfff), IDLE_B = new THREE.Color(0x00ff88);
function rainbow(u, out) {
  const n = ((u % 6) + 6) % 6, i = Math.floor(n), f = n - i;
  return out.copy(CHAMBERS[i].c).lerp(CHAMBERS[(i + 1) % 6].c, f * f * (3 - 2 * f));
}
// the colour of the moment: the idle one, each chamber's while it works, all six going round while the product is live
function pal(t, out, idle = IDLE_A) {
  if (t < 1.85 || t >= 9.6) return out.copy(idle);
  if (t < 2.0) return out.copy(idle).lerp(CHAMBERS[0].c, win(t, 1.85, 2.0));
  if (t < 6.2) {
    const k = (t - 2.0) / 0.7, i = Math.floor(k), f = k - i;
    out.copy(CHAMBERS[i].c);
    return f > 0.88 && i < 5 ? out.lerp(CHAMBERS[i + 1].c, (f - 0.88) / 0.12) : out;
  }
  rainbow(5 + (t - 6.2) * 1.15, out);
  return t < 8.85 ? out : out.lerp(idle, ease(win(t, 8.85, 9.6)));
}
const RAINBOW_GLSL = `
  uniform vec3 uCol[6];
  vec3 rainbowAt(float u) { float n = mod(u, 6.0); int i = int(floor(n)); float f = n - floor(n); f = f * f * (3.0 - 2.0 * f); return mix(uCol[i], uCol[(i + 1) % 6], f); }`;
const chamberColours = () => CHAMBERS.map((c) => c.c.clone());

function glowTex(inner, mid, outer = 'rgba(0,0,0,0)') {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), gr = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, inner); gr.addColorStop(0.24, mid); gr.addColorStop(1, outer);
  x.fillStyle = gr; x.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW_C = glowTex('rgba(235,255,255,1)', 'rgba(0,207,255,0.52)');
const GLOW_G = glowTex('rgba(230,255,244,1)', 'rgba(0,255,136,0.52)');
const GLOW_W = glowTex('rgba(255,255,255,1)', 'rgba(255,195,95,0.62)');
const GLOW_N = glowTex('rgba(255,255,255,1)', 'rgba(255,255,255,0.46)');   // tinted by its material, each moment's colour
const makeSprite = (map, s, op = 1) => {
  const o = new THREE.Sprite(new THREE.SpriteMaterial({ map, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: op }));
  o.scale.set(s, s, 1); return o;
};

// Filmed on pure black (#000000) so anim.js `data-key` keys the Quest page's live nebula & twinkling stars behind the forge!

// ---- PBR Heavy Aerospace & Cybernetics Materials
const M = {
  armor: new THREE.MeshPhysicalMaterial({ color: 0xdfe8f2, roughness: 0.19, metalness: 0.16, clearcoat: 1.0, clearcoatRoughness: 0.09 }),
  armorAlt: new THREE.MeshPhysicalMaterial({ color: 0x90a3b8, roughness: 0.25, metalness: 0.72, clearcoat: 0.65, clearcoatRoughness: 0.16 }),
  titanium: new THREE.MeshStandardMaterial({ color: 0x5c6d80, roughness: 0.24, metalness: 0.93 }),
  gunmetal: new THREE.MeshStandardMaterial({ color: 0x1c2836, roughness: 0.30, metalness: 0.88 }),
  obsidian: new THREE.MeshStandardMaterial({ color: 0x111a26, roughness: 0.36, metalness: 0.80 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xf0f6fc, roughness: 0.06, metalness: 1.0 }),
  copper: new THREE.MeshStandardMaterial({ color: 0xd98a54, roughness: 0.20, metalness: 0.96 }),
  cable: new THREE.MeshStandardMaterial({ color: 0x131d29, roughness: 0.50, metalness: 0.38 }),
  deck: new THREE.MeshStandardMaterial({ color: 0x101928, roughness: 0.22, metalness: 0.84 }),
  deckPlate: new THREE.MeshStandardMaterial({ color: 0x162436, roughness: 0.26, metalness: 0.86 }),
  hexBody: new THREE.MeshStandardMaterial({ color: 0x132338, roughness: 0.40, metalness: 0.72 }),
  cyan: new THREE.MeshStandardMaterial({ color: 0x00cfff, emissive: 0x00cfff, emissiveIntensity: 2.7, roughness: 0.25 }),
  green: new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 2.7, roughness: 0.25 })
};

// ---- Curved Honeycomb Architectural Matrix + Crisp Double-Tube "Build it Better" Neon Truss
const hexCells = [];
{
  const R = 6.9, r = 0.305, dx = r * Math.sqrt(3), dy = r * 1.5, raw = [];
  for (let row = 0; row < 14; row++) for (let col = -16; col <= 16; col++) {
    const s = col * dx + (row % 2 ? dx / 2 : 0), ang = s / R, y = 0.76 + row * dy;
    const e = Math.pow(ang / 0.55, 2) + Math.pow((y - 2.82) / 2.28, 2);
    if (e > 1.10 || (e > 0.66 && rnd() < (e - 0.66) * 1.95)) continue;
    raw.push({ ang, y, dz: (rnd() - 0.5) * 0.08, e, ph: rnd(), k: [1, 2, 3][Math.floor(rnd() * 3)], baseLit: rnd() < 0.15 ? (0.06 + rnd() * 0.16) : 0.012, isGreen: rnd() < 0.28 });
  }
  const geo = new THREE.CylinderGeometry(r * 0.93, r * 0.96, 0.16, 6); geo.rotateX(Math.PI / 2);
  const bodyMesh = new THREE.InstancedMesh(geo, M.hexBody, raw.length); bodyMesh.receiveShadow = true;
  const faceMesh = new THREE.InstancedMesh(new THREE.CircleGeometry(r * 0.74, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92, depthWrite: false, blending: THREE.AdditiveBlending }), raw.length);
  const rimMesh = new THREE.InstancedMesh(new THREE.RingGeometry(r * 0.87, r * 0.93, 6, 1), new THREE.MeshBasicMaterial({ color: 0x1b66b4, transparent: true, opacity: 0.34, depthWrite: false }), raw.length);
  const dummy = new THREE.Object3D(), c0 = new THREE.Color(0, 0, 0);
  raw.forEach((cell, i) => {
    const px = Math.sin(cell.ang) * (R + cell.dz), pz = -Math.cos(cell.ang) * (R + cell.dz) + 1.55;
    cell.wx = px; cell.wy = cell.y; cell.wz = pz;
    dummy.position.set(px, cell.y, pz);
    dummy.rotation.set(0, -cell.ang, Math.PI / 6); dummy.updateMatrix();
    bodyMesh.setMatrixAt(i, dummy.matrix);
    dummy.position.addScaledVector(new THREE.Vector3(-Math.sin(cell.ang), 0, Math.cos(cell.ang)), 0.084); dummy.updateMatrix();
    faceMesh.setMatrixAt(i, dummy.matrix); rimMesh.setMatrixAt(i, dummy.matrix);
    faceMesh.setColorAt(i, c0);
    hexCells.push({ ...cell, i });
  });
  faceMesh.instanceColor.needsUpdate = true;
  scene.add(bodyMesh, faceMesh, rimMesh);
  scene.userData.hexFace = faceMesh;
}

// The name ("vytun ten napis build it better", 2026-11-01; it was a picture on a plane, 235 px wide on a 2000 px page):
// real channel letters in Archivo Black on a titanium truss, a body of polished metal with a bevel, a smoked face, a neon
// tube round every outline, each letter's own light on the wall behind it. White and green as the page's own headings,
// and only those ("ten napis build it better nedavej do vsech barev to je tragicke": the six colours are the forge's, a
// rainbow name was thrown away): at half power at rest; as the pipeline goes each letter strikes to full, left to right;
// a surge runs along them going live; on the launch they drain back, so the last frame leads into the first
const signGroup = new THREE.Group();
signGroup.position.set(0, 3.5, -3.86);   // in front of the wall where it curves forward
scene.add(signGroup);
const LETTERS = [];
const SIGN_WHITE = new THREE.Color(0.86, 0.95, 1.0), SIGN_GREEN = new THREE.Color(0x00ff88);
const SIGN_W = 7.0;
{
  const font = new Font(await new TTFLoader().loadAsync('https://cdn.jsdelivr.net/npm/@fontsource/archivo-black@5.0.19/files/archivo-black-latin-400-normal.woff'));
  const TXT = 'Build it Better', g = font.data.glyphs;
  const size = SIGN_W / ([...TXT].reduce((a, ch) => a + g[ch].ha, 0) / font.data.resolution), k = size / font.data.resolution;
  const DEPTH = 0.22, BEVEL = 0.016, extr = { depth: DEPTH, curveSegments: 10, bevelEnabled: true, bevelThickness: BEVEL, bevelSize: 0.009, bevelSegments: 3 };
  const box = new THREE.ExtrudeGeometry(font.generateShapes('B', size), extr); box.computeBoundingBox();
  const CAP = box.boundingBox.max.y - box.boundingBox.min.y - 0.018; box.dispose();
  const side = new THREE.MeshStandardMaterial({ color: 0xc4cfdb, roughness: 0.14, metalness: 1.0 });
  const n = [...TXT].filter((ch) => ch !== ' ').length;
  let x = -SIGN_W / 2, i = 0;
  for (const ch of TXT) {
    const adv = g[ch].ha * k;
    if (ch !== ' ') {
      const shapes = font.generateShapes(ch, size);
      const body = new THREE.ExtrudeGeometry(shapes, extr);
      body.translate(x, -CAP / 2, -(DEPTH + BEVEL));
      const face = new THREE.MeshStandardMaterial({ color: 0x050a12, roughness: 0.6, metalness: 0.1, envMapIntensity: 0.2, emissive: 0x000000 });
      const bodyMesh = new THREE.Mesh(body, [face, side]); bodyMesh.castShadow = true; signGroup.add(bodyMesh);
      const tubes = [];
      shapes.forEach((s) => [s.getPoints(14), ...s.holes.map((h) => h.getPoints(14))].forEach((pts) => {
        if (pts.length > 2 && pts[0].distanceTo(pts[pts.length - 1]) < 1e-4) pts = pts.slice(0, -1);
        const p3 = pts.filter((p, q) => !q || p.distanceTo(pts[q - 1]) > 1e-3).map((p) => new THREE.Vector3(p.x + x, p.y - CAP / 2, 0.014));
        tubes.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p3, true, 'catmullrom', 0.04), Math.max(96, p3.length * 10), 0.0118, 6, true));
      }));
      const tubeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      signGroup.add(new THREE.Mesh(mergeGeometries(tubes), tubeMat));
      // its light on the wall behind it
      const hc = document.createElement('canvas'); hc.width = hc.height = 256;
      const hx = hc.getContext('2d'); hx.filter = 'blur(13px)'; hx.font = '400 150px "Archivo Black"'; hx.textAlign = 'center'; hx.textBaseline = 'middle'; hx.fillStyle = '#ffffff'; hx.fillText(ch, 128, 132);
      const hTex = new THREE.CanvasTexture(hc); hTex.colorSpace = THREE.SRGBColorSpace;
      const haloMat = new THREE.MeshBasicMaterial({ map: hTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, color: 0x000000 });
      const halo = new THREE.Mesh(new THREE.PlaneGeometry(CAP * 2.5, CAP * 2.5), haloMat);
      halo.position.set(x + adv / 2, 0, -0.42); signGroup.add(halo);
      const tig = 2.0 + (i + 0.35) / n * 4.2;
      LETTERS.push({ i, ch, tube: tubeMat, face, halo: haloMat, tig, c: i < 7 ? SIGN_WHITE : SIGN_GREEN, x01: (x + adv / 2 + SIGN_W / 2) / SIGN_W,
        world: new THREE.Vector3(x + adv / 2, 0, 0.1).add(signGroup.position), wx: x + adv / 2 });
      i++;
    }
    x += adv;
  }
  // the truss they stand on, held off the wall
  for (const sy of [-CAP * 0.29, CAP * 0.29]) {
    const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, SIGN_W * 1.045, 16), M.titanium);
    rail.rotation.z = Math.PI / 2; rail.position.set(0, sy, -0.33); signGroup.add(rail);
  }
  const STEP = SIGN_W * 1.04 / 18;
  for (let j = 0; j < 18; j++) {
    const ax = -SIGN_W * 0.52 + j * STEP, up = j % 2 ? 1 : -1, a = new THREE.Vector3(ax, up * CAP * 0.29, -0.33), b = new THREE.Vector3(ax + STEP, -up * CAP * 0.29, -0.33);
    const d = b.clone().sub(a), web = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, d.length(), 8), M.gunmetal);
    web.position.copy(a).addScaledVector(d, 0.5); web.quaternion.setFromUnitVectors(UP, d.normalize()); signGroup.add(web);
  }
  LETTERS.forEach((L) => {
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.14, 10), M.chrome);
    pin.rotation.x = Math.PI / 2; pin.position.set(L.wx, CAP * 0.29, -0.27); signGroup.add(pin);
  });
  for (const sx of [-1, 1]) {
    const cap = new THREE.Mesh(new RoundedBoxGeometry(0.16, CAP * 0.86, 0.16, 3, 0.03), M.gunmetal);
    cap.position.set(sx * SIGN_W * 0.525, 0, -0.33); signGroup.add(cap);
  }
}

// ---- Multi-Tiered Floating Orbital Forge Deck (100% framed inside viewport with zero clipping!)
const deck = new THREE.Group();
scene.add(deck);
const DECK_RX = 3.72, DECK_RZ = 2.66;
const RIM = new THREE.ShaderMaterial({
  uniforms: { uCol: { value: chamberColours() }, uFill: { value: [0, 0, 0, 0, 0, 0] }, uOff: { value: new THREE.Color(0x0a4a66) }, uPow: { value: 1 } },
  vertexShader: 'varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform vec3 uCol[6]; uniform float uFill[6]; uniform vec3 uOff; uniform float uPow; varying vec2 vU;
    void main(){
      float f = mod((0.75 - vU.x) * 6.0, 6.0); int i = int(floor(f)); float s = f - floor(f);
      float gap = smoothstep(0.0, 0.025, s) * smoothstep(1.0, 0.975, s);
      float p = uFill[i], on = smoothstep(p + 0.015, p - 0.015, s) * step(0.001, p);
      float sd = (s - p) * 16.0, head = exp(-sd * sd) * step(0.001, p) * step(p, 0.999);
      vec3 col = mix(uOff, uCol[i] * (1.5 * uPow), on) + vec3(3.0) * head;
      gl_FragColor = vec4(col * (0.25 + 0.75 * gap), 1.0);
    }`
});
{
  const baseGroup = new THREE.Group();
  baseGroup.scale.set(DECK_RX / 3.2, 1, DECK_RZ / 3.2);
  deck.add(baseGroup);

  const mainDisc = new THREE.Mesh(new THREE.CylinderGeometry(3.16, 3.26, 0.18, 96), M.deck);
  mainDisc.position.y = -0.09; mainDisc.receiveShadow = true; baseGroup.add(mainDisc);

  const outerBevel = new THREE.Mesh(new THREE.CylinderGeometry(3.28, 3.04, 0.22, 64, 1, true), M.gunmetal);
  outerBevel.position.y = -0.19; baseGroup.add(outerBevel);
  const underHull = new THREE.Mesh(new THREE.CylinderGeometry(2.82, 1.62, 0.28, 32), M.obsidian);
  underHull.position.y = -0.34; baseGroup.add(underHull);
  const underGlow = new THREE.Mesh(new THREE.TorusGeometry(2.12, 0.018, 8, 96), M.cyan);
  underGlow.rotation.x = Math.PI / 2; underGlow.position.y = -0.32; baseGroup.add(underGlow);

  for (let i = 0; i < 12; i++) {
    const a0 = i / 12 * TAU + 0.03, a1 = (i + 1) / 12 * TAU - 0.03;
    const plate = new THREE.Mesh(new THREE.CylinderGeometry(3.04, 3.04, 0.024, 16, 1, false, a0, a1 - a0), M.deckPlate);
    plate.position.y = 0.002; plate.receiveShadow = true; baseGroup.add(plate);
  }
  for (let i = 0; i < 32; i++) {
    const a = i / 32 * TAU;
    const isLug = i % 4 === 0;
    const lug = new THREE.Mesh(
      new THREE.BoxGeometry(isLug ? 0.18 : 0.09, isLug ? 0.14 : 0.042, isLug ? 0.12 : 0.03),
      isLug ? M.titanium : (i % 2 === 0 ? M.cyan : M.obsidian)
    );
    lug.position.set(Math.cos(a) * 3.23, isLug ? -0.06 : -0.11, Math.sin(a) * 3.23);
    lug.rotation.y = -a + Math.PI / 2;
    baseGroup.add(lug);
  }
  // the deck's rim is the pipeline's dial: six arcs, left to right along the front as the panel runs, each filling in its
  // chamber's colour while that chamber works
  const outerRim = new THREE.Mesh(new THREE.TorusGeometry(3.17, 0.03, 10, 240), RIM);
  outerRim.rotation.x = Math.PI / 2; outerRim.position.y = 0.016; baseGroup.add(outerRim);
  const midRim = new THREE.Mesh(new THREE.TorusGeometry(1.88, 0.009, 8, 128), M.cyan);
  midRim.rotation.x = Math.PI / 2; midRim.position.y = 0.014; baseGroup.add(midRim);
}

// Radial Conduit Traces racing inward toward the Crucible
const traces = [];
{
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x0d6b90, transparent: true, opacity: 0.62, depthWrite: false });
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * TAU + 0.19;
    const p0 = new THREE.Vector3(Math.cos(a) * 1.12, 0.016, Math.sin(a) * 1.12);
    const p1 = new THREE.Vector3(Math.cos(a) * (DECK_RX * 0.92), 0.016, Math.sin(a) * (DECK_RZ * 0.92));
    const dir = p1.clone().sub(p0), L = dir.length(), mid = p0.clone().addScaledVector(dir, 0.5);
    const seg = new THREE.Mesh(new THREE.PlaneGeometry(L, 0.014), lineMat);
    seg.rotation.x = -Math.PI / 2; seg.rotation.z = -Math.atan2(dir.z, dir.x);
    seg.position.copy(mid); scene.add(seg);
    const pulse = makeSprite(GLOW_N, 0.25);

  centerBand.rotation.x = Math.PI / 2; g.add(centerBand);
  for (const s of [1, -1]) {
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.78, r * 0.85, 0.024, 40), M.armorAlt);
    cap.rotation.x = Math.PI / 2; cap.position.z = s * (len / 2 + 0.01); g.add(cap);

    const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 0.87, r * 0.048, 10, 64), ringMat);

function makeHydraulicPiston(accentMat) {

function updatePiston(p, a, b) {
  const d = new THREE.Vector3().subVectors(b, a), L = Math.max(0.05, d.length());
  const n = d.clone().normalize(), q = new THREE.Quaternion().setFromUnitVectors(UP, n);
  const bl = Math.min(L * 0.58, 0.74);
  p.barrel.position.copy(a).addScaledVector(n, bl * 0.5); p.barrel.scale.set(1, bl, 1); p.barrel.quaternion.copy(q);
  p.sleeve.position.copy(a).addScaledVector(n, bl * 0.25); p.sleeve.quaternion.copy(q);
  p.rod.position.copy(a).addScaledVector(n, (bl + L) * 0.5 - 0.02); p.rod.scale.set(1, Math.max(0.02, L - bl + 0.04), 1); p.rod.quaternion.copy(q);
  p.collar.position.copy(a).addScaledVector(n, bl);
  p.collar.quaternion.copy(q).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2));
}

// Exact Full-3D Analytical Inverse Kinematics Solver (Wide Predatory Elbow-Up + Full 3D Wrist Gimbal)
const _qEl = new THREE.Quaternion(), _qTool = new THREE.Quaternion(), _qRoll = new THREE.Quaternion();
const _pA = new THREE.Vector3(), _pB = new THREE.Vector3();
function solveArm3D(arm, tipTarget, toolDir, roll = 0) {
  const dir = toolDir.clone().normalize();
  const Wp = tipTarget.clone().addScaledVector(dir, -arm.toolLen);
  const Sx = arm.root.position.x, Sy = arm.root.position.y + arm.HS, Sz = arm.root.position.z;
  const dx = Wp.x - Sx, dy = Wp.y - Sy, dz = Wp.z - Sz;
  const r = Math.hypot(dx, dz), y = dy;
  arm.turret.rotation.y = Math.atan2(-dz, dx);

  const minD = Math.abs(arm.L1 - arm.L2) + 0.04, maxD = arm.L1 + arm.L2 - 0.015;
  const D = clamp(Math.hypot(r, y), minD, maxD);
  const cosB = clamp((D * D - arm.L1 * arm.L1 - arm.L2 * arm.L2) / (2 * arm.L1 * arm.L2), -1, 1);
  const beta = Math.acos(cosB);
  const gamma = Math.atan2(r, y);
  const alpha = Math.atan2(arm.L2 * Math.sin(beta), arm.L1 + arm.L2 * Math.cos(beta));
  const phi = gamma - alpha;

  arm.shoulder.rotation.z = -phi;
  arm.elbow.rotation.z = -beta;

  arm.root.updateMatrixWorld(true);
  arm.elbow.getWorldQuaternion(_qEl);
  _qTool.setFromUnitVectors(UP, dir);
  if (roll !== 0) { _qRoll.setFromAxisAngle(UP, roll); _qTool.multiply(_qRoll); }
  arm.wrist.quaternion.copy(_qEl).invert().multiply(_qTool);
  arm.root.updateMatrixWorld(true);
  arm.pistons.forEach(([p, a, b]) => { a.getWorldPosition(_pA); b.getWorldPosition(_pB); updatePiston(p, _pA, _pB); });
}

function createHoloModule({ w, h, pos, rot, accent, kind, spawnSide }) {
  const g = new THREE.Group();
  g.userData = { w, h, targetPos: new THREE.Vector3(...pos), targetRot: new THREE.Euler(...rot), spawnSide };

  const frameGeo = new RoundedBoxGeometry(w, h, 0.028, 4, 0.04);
  const glassMesh = new THREE.Mesh(frameGeo, new THREE.MeshPhysicalMaterial({
    color: 0x051828, roughness: 0.12, metalness: 0.20, transparent: true, opacity: 0.68, clearcoat: 1, depthWrite: false
  }));
  g.add(glassMesh);

  // High-contrast crisp holographic UI shader (dark glass contrast + vivid self-lit pixels!)
  const uiTex = makeUICanvas(kind);
  const uiMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: {
      tMap: { value: uiTex },
      uCompile: { value: 0 },
      uLive: { value: 0 },
      uAlpha: { value: 1 },
      uTime: { value: 0 }
    },
    vertexShader: 'varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `
      uniform sampler2D tMap; uniform float uCompile, uLive, uAlpha, uTime; varying vec2 vU;
      void main(){
        vec4 tex = texture2D(tMap, vU);
        float reveal = smoothstep(uCompile + 0.05, uCompile - 0.02, vU.x);
        float edge = exp(-pow((vU.x - uCompile) * 30.0, 2.0)) * step(0.01, uCompile) * step(uCompile, 0.99);
        float scanline = 0.92 + 0.08 * sin(vU.y * 220.0);
        float sheen = exp(-pow((vU.x + vU.y * 0.35 - fract(uTime * 0.35) * 1.6 + 0.2) * 8.0, 2.0)) * 0.16 * uLive;
        vec3 col = tex.rgb * scanline * (1.05 + 0.32 * uLive) + vec3(0.2, 1.0, 0.72) * edge * 0.95 + vec3(0.3, 1.0, 0.8) * sheen;
        gl_FragColor = vec4(col, tex.a * (0.22 + 0.76 * reveal) * uAlpha);
      }`
  });
  const uiPlane = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.965, h * 0.945), uiMat);
  uiPlane.position.z = 0.018; g.add(uiPlane);

  const borderMat = new THREE.LineBasicMaterial({ color: new THREE.Color(accent).multiplyScalar(1.8), transparent: true, opacity: 0.95 });

  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    const br = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.044), M.titanium);
    br.position.set(sx * (w / 2 - 0.03), sy * (h / 2 - 0.03), 0); g.add(br);
  }

  // Molten plasma weld seam along lower edge
  const seam = new THREE.Mesh(
    new THREE.BoxGeometry(w * 0.92, 0.020, 0.034),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })
  );
  seam.position.set(0, -h / 2, 0.018); g.add(seam);

  // Blueprint wireframe ghost (snaps into place at t=1.60s when Idea detonates!)
  const ghost = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, 0.02)),
    new THREE.LineBasicMaterial({ color: 0x00cfff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  ghost.position.set(...pos); ghost.rotation.set(...rot);
  appGroup.add(ghost);

  g.userData.glassMesh = glassMesh;
  g.userData.uiMat = uiMat;
  g.userData.borderMat = borderMat;
  g.userData.baseBorderColor = new THREE.Color(accent).multiplyScalar(1.6);
  g.userData.seam = seam;
  g.userData.ghost = ghost;
  appGroup.add(g);
  return g;

  const side2 = dir.clone().cross(side1).normalize();
  for (let i = 0; i <= n; i++) {
    const u = i / n, env = Math.sin(Math.PI * u) * amp;
    const j1 = Math.sin(u * 19.3 + tSeed * 47.0) * env;
    const j2 = Math.cos(u * 23.7 - tSeed * 53.0) * env;
    arr[i * 3]     = p0.x + dir.x * u + side1.x * j1 + side2.x * j2;
    arr[i * 3 + 1] = p0.y + dir.y * u + side1.y * j1 + side2.y * j2;
    arr[i * 3 + 2] = p0.z + dir.z * u + side1.z * j1 + side2.z * j2;
  }
  line.geometry.attributes.position.needsUpdate = true;
}

function updateLance(lance, arcs, active, p0, p1, t, seedOff) {
  lance.core.visible = lance.sheath.visible = lance.flare.visible = lance.hot.visible = active;
  arcs.forEach((a) => { a.visible = active; });
  lance.light.intensity = active ? 9.5 + 3.2 * Math.sin(t * 95 + seedOff) : 0;
  if (!active) return;
  const vec = p1.clone().sub(p0), len = Math.max(0.02, vec.length());
  const q = new THREE.Quaternion().setFromUnitVectors(UP, vec.clone().normalize());
  for (const b of [lance.core, lance.sheath]) {
    b.position.copy(p0).addScaledVector(vec, 0.5);
    b.scale.set(1, len, 1);
    b.quaternion.copy(q);
  }
  lance.flare.position.copy(p1);
  lance.hot.position.copy(p1);
  lance.light.position.copy(p1).add(new THREE.Vector3(0, 0.08, 0.14));
  const fl = 0.68 + 0.32 * Math.abs(Math.sin(t * 52 + seedOff));
  lance.flare.scale.setScalar(fl * 1.15);

}

// Smooth C1 Keyframe Track Evaluator (guarantees zero discontinuities and exact t=0 == t=10 loop!)
function evalTrack(keys, t) {
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t >= a.t && t <= b.t) {
      const u = b.t > a.t ? ease((t - a.t) / (b.t - a.t)) : 0;
      return {
        pos: new THREE.Vector3().lerpVectors(a.p, b.p, u),
        aim: new THREE.Vector3().lerpVectors(a.aim, b.aim, u),
        jaw: (a.jaw || 0) + ((b.jaw || 0) - (a.jaw || 0)) * u
      };
    }
  }
  const last = keys[keys.length - 1];
  return { pos: last.p.clone(), aim: last.aim.clone(), jaw: last.jaw || 0 };
}

function modWorld(i, lx, ly, lz = 0) {
  return modules[i].localToWorld(new THREE.Vector3(lx, ly, lz));

// Compute Active Weld/Spot Points at any timestamp `tb` (used both for live beams AND particle history!)
function getFirePoints(tb) {
  let pL = null, pR = null, pSpot = null;
  // Chamber 3 (Build: 3.40 - 4.10s): Dual Mirrored Lower Seam Welding!
  if (tb >= 3.40 && tb <= 4.10) {
    const u = clamp01((tb - 3.40) / 0.70);
    pL = V3(-1.56 + 1.34 * u, 1.14 - 0.02 * u, 0.24 - 0.24 * u);
    pR = V3( 1.56 - 1.34 * u, 1.14 - 0.02 * u, 0.24 - 0.24 * u);
  }
  // Chamber 4 (Security: 4.22 - 4.76s): Dual Vertical Structural Hinge Welding!
  else if (tb >= 4.22 && tb <= 4.76) {
    const u = clamp01((tb - 4.22) / 0.54);
    pL = V3(-0.88, 1.20 + 0.78 * u, 0.04);
    pR = V3( 0.88, 1.20 + 0.78 * u, 0.04);
  }
  // Chamber 5 (Deploy: 4.92 - 5.54s): Twin Converging Plasma Fusion into Pedestal AI Core!
  else if (tb >= 4.92 && tb <= 5.54) {
    pL = V3(-0.12, 0.88, 0.20);
    pR = V3( 0.12, 0.88, 0.20);
  }
  // Rear-Left Spot Welder Staccato Bursts!
  if (tb >= 2.28 && tb <= 2.52) pSpot = V3(-0.85, 2.06, -0.02);
  else if (tb >= 3.16 && tb <= 3.40) pSpot = V3(-1.34, 2.02, 0.18);
  else if (tb >= 3.58 && tb <= 3.86) pSpot = V3(-0.66, 2.34, 0.10);
  else if (tb >= 4.38 && tb <= 4.64) pSpot = V3(-0.88, 1.82, 0.04);
  return { pL, pR, pSpot };
}

const _sparkDummy = new THREE.Object3D();
const _sparkVel = new THREE.Vector3();
const _sparkCol = new THREE.Color();
const C_NOW = new THREE.Color(), C_LAG = new THREE.Color(), C_ARM = new THREE.Color(), C_TMP = new THREE.Color();
const WHITE = new THREE.Color(1, 1, 1);
const addC = (col, c, k) => { col.r += c.r * k; col.g += c.g * k; col.b += c.b * k; };
// a tube striking: on, off, on, nearly off, on
const strike = (d) => (d < 0.03 ? 1 : d < 0.07 ? 0.08 : d < 0.11 ? 1 : d < 0.14 ? 0.2 : 1);

function render(t) {
  t = ((t % PERIOD) + PERIOD) % PERIOD;
  const ph = t / PERIOD * TAU;

  // The colour of this moment, through everything that lights the forge, and a beat as each chamber starts
  pal(t, C_NOW); pal(t - 0.2, C_LAG, IDLE_B);
  M.cyan.color.copy(C_NOW); M.cyan.emissive.copy(C_NOW);
  M.green.color.copy(C_LAG); M.green.emissive.copy(C_LAG);
  let beat = 0;
  CHAMBERS.forEach((c) => { const d = t - c.t0; if (d >= 0 && d < 0.7) beat = Math.exp(-d * 5.5); });
  const isLive = t >= 6.2 && t < 8.85;
  rimCyan.color.copy(C_NOW); rimCyan.intensity = 2.45 + 2.6 * beat;
  if (isLive) rainbow(2 + (t - 6.2) * 1.15, rimGreen.color); else rimGreen.color.copy(C_LAG);
  rimGreen.intensity = 1.75 + 2.6 * beat;

  // Locked-off Heroic Cinema Camera (zero background drift, everything razor-sharp inside frame!)
  camera.position.set(0.0, 3.76, 10.55);
  camera.lookAt(0.0, 1.38, -0.15);

  // ---- Beat 1: Orbital Courier Drone delivers Crystalline Idea Singularity (0.0 - 1.60s)
  const cIn = settle(win(t, 0.0, 0.82)), cOut = ease(win(t, 1.58, 2.38));
  const cPos = lerpV(COURIER_FROM, COURIER_HOVER, cIn).lerp(COURIER_EXIT, cOut);
  if (t >= 9.25) cPos.copy(COURIER_FROM).lerp(V3(-5.8, 5.1, 1.15), win(t, 9.25, 10.0));
  courier.visible = t < 2.38 || t > 9.35;
  courier.position.copy(cPos);
  courier.position.y += 0.032 * Math.sin(ph * 4);
  courier.rotation.set(0.08 * (1 - cIn) - 0.14 * cOut, 0.30 - 0.55 * cOut, -0.10 * (1 - cIn) + 0.18 * cOut);
  courier.userData.rotors.forEach((r, i) => { r.rotation.y = t * 68 + i * 1.1; });

  const dropK = ease(win(t, 0.76, 1.54)), detonate = win(t, 1.48, 1.76), vanish = win(t, 1.62, 1.92);
  const iPos = t < 0.76
    ? courier.position.clone().add(V3(0, -0.26, 0))
    : lerpV(COURIER_HOVER.clone().add(V3(0, -0.26, 0)), IDEA_DROP, dropK);
  const appear = win(t, 0.0, 0.32);
  ideaOrb.position.copy(iPos);
  ideaOrb.visible = t < 1.92;
  const orbScale = (1 + 0.62 * Math.sin(Math.PI * detonate)) * (1 - vanish) * appear;
  ideaCore.scale.setScalar(orbScale * (1 + 0.12 * Math.sin(t * 28)));
  ideaCage.rotation.set(t * 2.4, t * 3.2, 0); ideaCage.scale.setScalar(orbScale * (1 + 0.35 * detonate));
  ideaRing.rotation.set(Math.PI / 3 + t * 4.0, t * 2.5, 0); ideaRing.scale.setScalar(orbScale);
  ideaGlow.scale.setScalar((1.05 + 2.5 * Math.sin(Math.PI * detonate)) * appear * (1 - vanish * 0.85));
  ideaGlow.material.opacity = appear * (1 - vanish);
  ideaLight.intensity = (4 + 16 * Math.sin(Math.PI * detonate)) * appear * (1 - vanish);

  const tracK = bump(t, 0.50, 1.58);
  tractorCone.visible = tracK > 0.01;
  if (tractorCone.visible) {
    const topY = courier.position.y - 0.06, len = Math.max(0.05, topY - iPos.y);
    tractorCone.position.set(courier.position.x, topY - len / 2, courier.position.z);
    tractorCone.scale.set(1, len, 1);
    tractorCone.material.opacity = 0.28 * tracK;
  }

  // Agile Inspector Drone orbiting upper-left and tracking the assembly
  inspector.position.set(-2.45 + 0.20 * Math.sin(ph * 2), 2.68 + 0.09 * Math.sin(ph * 3), -0.42 + 0.16 * Math.cos(ph * 2));
  inspector.rotation.set(0.10, 0.58 + 0.12 * Math.sin(ph), -0.06 * Math.cos(ph * 2));
  inspector.userData.rotors.forEach((r, i) => { r.rotation.y = t * 62 + i; });

  // ---- Holographic Modules + Blueprint Wireframe + Pedestal AI Core + Live Levitation + Hyper-Launch
  const liveK = ease(win(t, 6.18, 6.85));
  const launchK = ease(win(t, 8.78, 9.42));
  const fadeAll = 1 - ease(win(t, 8.76, 9.20));

  appGroup.position.copy(APP_BASE);
  appGroup.position.y += 0.22 * liveK * (1 - launchK) + 1.55 * Math.pow(launchK, 1.85);
  appGroup.scale.set(1 - 0.86 * ease(win(t, 8.78, 9.26)), 1 + 0.45 * bump(t, 8.78, 9.22), 1 - 0.86 * ease(win(t, 8.78, 9.26)));
  appGroup.rotation.y = 0.15 * Math.sin(win(t, 6.20, 8.80) * Math.PI) * liveK;

  let portalFlashL = 0, portalFlashR = 0;
  modules.forEach((m, i) => {
    const cfg = MOD_TIMES[i];
    const fly = win(t, cfg.start, cfg.start + cfg.fly), k = settle(fly);
    const spawned = t >= cfg.start - 0.12 && t < 9.46;
    if (m.userData.spawnSide < 0) portalFlashL = Math.max(portalFlashL, bump(t, cfg.start - 0.20, cfg.start + 0.25));
    if (m.userData.spawnSide > 0) portalFlashR = Math.max(portalFlashR, bump(t, cfg.start - 0.20, cfg.start + 0.25));

    const ghostIn = ease(win(t, 1.58 + i * 0.05, 1.92 + i * 0.05));
    const ghostOut = ease(win(t, cfg.start + cfg.fly * 0.65, cfg.start + cfg.fly));
    m.userData.ghost.material.opacity = 0.44 * ghostIn * (1 - ghostOut) * fadeAll;

    m.visible = spawned && fadeAll > 0.005;
    if (m.visible) {
      const spawnWorld = m.userData.spawnSide === 0
        ? V3(0, 0.55, 0.05)
        : V3(m.userData.spawnSide * 1.56, 0.48, 0.28);
      const startLocal = appGroup.worldToLocal(spawnWorld);
      m.position.lerpVectors(startLocal, m.userData.targetPos, clamp01(k));
      m.position.y += Math.sin(Math.PI * clamp01(fly)) * 0.28;

      const tr = m.userData.targetRot;
      m.rotation.set(tr.x * k + 0.25 * (1 - k), tr.y * k - m.userData.spawnSide * 0.65 * (1 - k), tr.z * k);
      m.scale.setScalar(0.32 + 0.68 * clamp01(fly * 1.35));

      const lockFlash = bump(t, cfg.start + cfg.fly - 0.04, cfg.start + cfg.fly + 0.24);
      m.userData.glassMesh.material.opacity = (0.64 + 0.18 * liveK + 0.16 * lockFlash) * fadeAll;
      m.userData.uiMat.uniforms.uCompile.value = ease(win(t, cfg.comp0, cfg.comp1));
      m.userData.uiMat.uniforms.uLive.value = liveK;
      m.userData.uiMat.uniforms.uAlpha.value = fadeAll;
      m.userData.uiMat.uniforms.uTime.value = t;

      rainbow(i * 1.5 + t * 1.1, C_TMP).multiplyScalar(1.9);
      m.userData.borderMat.color.copy(m.userData.baseBorderColor)
        .lerp(WHITE_HOT, lockFlash * 0.6)
        .lerp(C_TMP, liveK * 0.9);
      m.userData.borderMat.opacity = fadeAll;

      // Molten plasma weld seam along lower edge during Build (3.40 - 4.10s)
      const wk = win(t, 3.40, 4.08);
      const cool = win(t, 3.65, 5.10);
      const seam = m.userData.seam;
      seam.visible = wk > 0 && fadeAll > 0.01;
      seam.scale.x = Math.max(0.001, wk);
      seam.material.color.copy(WHITE_HOT).lerp(CYAN_HOT, cool).lerp(GREEN_HOT, liveK * 0.85);
      seam.material.opacity = (0.95 - 0.50 * cool + 0.30 * liveK) * fadeAll;
    }
  });

  [portalFlashL, portalFlashR].forEach((fl, idx) => {
    const p = matPortals[idx];
    p.beam.material.color.copy(C_NOW); p.glow.material.color.copy(C_NOW);
    p.beam.material.opacity = 0.42 * fl;
    p.glow.material.opacity = 0.25 + 0.60 * fl;
    p.ring.scale.setScalar(1 + 0.14 * fl);
  });

  // Pedestal 3D Crystalline AI Reactor Core (rises at 4.78s during Deploy, cleanly below Dashboard!)
  const coreIn = settle(win(t, 4.75, 5.15));
  const coreFuse = bump(t, 4.92, 5.56);
  aiCoreGroup.visible = t >= 4.75 && fadeAll > 0.01;
  if (aiCoreGroup.visible) {
    aiCoreGroup.scale.setScalar(Math.max(0.001, coreIn) * (1 + 0.10 * liveK));
    aiCrystal.rotation.set(t * 2.2, t * 3.4, 0);
    aiCrystal.material.color.copy(C_NOW); aiCrystal.material.emissive.copy(C_NOW); aiWire.material.color.copy(C_LAG); aiHalo.material.color.copy(C_NOW);
    aiCrystal.material.emissiveIntensity = 1.9 + 3.0 * coreFuse + 1.5 * liveK;
    aiWire.rotation.set(-t * 1.8, t * 2.6, 0);
    aiGyro1.rotation.set(t * 3.8, t * 2.1, 0.4);
    aiGyro2.rotation.set(-0.6, t * 3.5, t * 2.4);
    aiHalo.scale.setScalar((0.62 + 0.65 * coreFuse + 0.22 * liveK) * fadeAll);
    aiHalo.material.opacity = 0.72 * fadeAll;
    const busOp = ease(win(t, 5.05, 5.55)) * (0.55 + 0.35 * liveK) * fadeAll;
    coreBusbars.forEach((bm) => { bm.opacity = busOp; });
  }
  liveOrbitRing.material.color.copy(C_NOW).multiplyScalar(1.6);
  liveOrbitRing.material.opacity = 0.68 * liveK * fadeAll;
  liveOrbitRing.rotation.z = t * 1.4;

  scene.updateMatrixWorld(true);

  // ---- Evaluate 4-Arm Synchronized Keyframe Kinematics + Active Fire States!
  const fireNow = getFirePoints(t);
  const isWeldingL = !!fireNow.pL;
  const isWeldingR = !!fireNow.pR;
  const isSpotting = !!fireNow.pSpot && Math.sin(t * 62) > -0.25;
  const isScanning = (t >= 2.35 && t <= 4.82) || (t >= 5.20 && t <= 5.55);

  const stWeld  = evalTrack(KEYS_WELD, t);
  const stGrip  = evalTrack(KEYS_GRIP, t);
  const stClamp = evalTrack(KEYS_CLAMP, t);
  const stScan  = evalTrack(KEYS_SCAN, t);

  // Subtle high-frequency servo micro-recoil when firing plasma torches!
  if (isWeldingL) stWeld.pos.add(V3(-0.015 * Math.sin(t * 75), 0.012 * Math.cos(t * 68), 0.015 * Math.sin(t * 60)));
  if (isWeldingR) stGrip.pos.add(V3( 0.015 * Math.sin(t * 72), 0.012 * Math.cos(t * 64), 0.015 * Math.cos(t * 58)));
  stWeld.pos.y += 0.014 * Math.sin(ph * 3);
  stGrip.pos.y += 0.014 * Math.sin(ph * 3 + 1.2);

  const dirWeld  = (fireNow.pL || stWeld.aim).clone().sub(stWeld.pos).normalize();
  const dirGrip  = (fireNow.pR || stGrip.aim).clone().sub(stGrip.pos).normalize();
  const dirClamp = (fireNow.pSpot || stClamp.aim).clone().sub(stClamp.pos).normalize();
  const dirScan  = stScan.aim.clone().sub(stScan.pos).normalize();

  solveArm3D(ARM_WELD,  stWeld.pos,  dirWeld,  0);
  solveArm3D(ARM_GRIP,  stGrip.pos,  dirGrip,  0.18 * Math.sin(ph * 2));
  solveArm3D(ARM_CLAMP, stClamp.pos, dirClamp, 0);
  solveArm3D(ARM_SCAN,  stScan.pos,  dirScan,  0);

  ARM_WELD.spin.rotation.y = isWeldingL ? t * 20.0 : t * 1.6;
  ARM_GRIP.spin.rotation.y = isWeldingR ? -t * 16.0 : 0.25 * Math.sin(ph * 2);
  gripHead.jaws.forEach(({ pivot }, idx) => {
    pivot.rotation.z = (idx === 0 ? 1 : 0.85) * (0.30 * stGrip.jaw - 0.12);
  });

  // The arms in the chamber's colour, the wave running from the front pair to the rear; while the product is live each
  // holds its own place in the six, going round
  [
    [ARM_WELD,  isWeldingL ? 1 : 0, 0],
    [ARM_GRIP,  (isWeldingR || stGrip.jaw > 0.7) ? 1 : 0, 0.05],
    [ARM_CLAMP, isSpotting ? 1 : 0, 0.12],
    [ARM_SCAN,  isScanning ? 1 : 0, 0.17]
  ].forEach(([a, work, lag], idx) => {
    pal(t - lag, C_ARM);
    if (isLive) rainbow(idx * 1.5 + (t - 6.2) * 1.15, C_ARM);
    const boost = 1.0 + 0.2 * (0.5 + 0.5 * Math.sin(ph * 5 + idx)) + 0.7 * work + 1.1 * beat + 0.25 * liveK;
    a.ledMat.color.copy(C_ARM).multiplyScalar(boost);
    a.ringMat.color.copy(C_ARM); a.ringMat.emissive.copy(C_ARM);
    a.ringMat.emissiveIntensity = 1.15 + 0.8 * work + 1.1 * beat + 0.35 * liveK;
  });

  // ---- Update Dual Plasma Lances, Lightning Arcs, Magnetic Claw Tethers & Galvo Laser Sheet: all in the chamber's colour
  const nozL = weldHead.tip.getWorldPosition(new THREE.Vector3());
  const nozR = gripHead.plasmaTip.getWorldPosition(new THREE.Vector3());
  [[lanceL, weldArcsL], [lanceR, weldArcsR]].forEach(([l, arcs]) => {
    l.sheath.material.color.copy(C_NOW); l.flare.material.color.copy(C_NOW); l.light.color.copy(C_NOW);
    l.hot.material.color.copy(C_NOW).lerp(WHITE, 0.7);
    arcs[0].material.color.copy(C_NOW).lerp(WHITE, 0.55); arcs[1].material.color.copy(C_NOW);
  });
  [weldHead.glow, gripHead.plasmaGlow, spotHead.glow, scanHead.glow, spotFlare].forEach((s) => { s.material.color.copy(C_NOW); });
  spotLight.color.copy(C_NOW);
  gripArcs.forEach((arc) => { arc.material.color.copy(C_NOW); });
  laserFan.material.color.copy(C_NOW); laserBar.material.color.copy(C_NOW).lerp(WHITE, 0.5);
  weldHead.glow.material.opacity = isWeldingL ? 1.0 : 0.35;
  gripHead.plasmaGlow.material.opacity = isWeldingR ? 1.0 : 0.35;
  updateLance(lanceL, weldArcsL, isWeldingL, nozL, fireNow.pL || nozL, t, 0.0);
  updateLance(lanceR, weldArcsR, isWeldingR, nozR, fireNow.pR || nozR, t, 3.7);

  spotFlare.visible = isSpotting;
  spotLight.intensity = isSpotting ? 9.0 : 0;
  spotHead.glow.material.opacity = isSpotting ? 1.0 : 0.15;
  if (isSpotting) {
    spotFlare.position.copy(fireNow.pSpot);
    spotFlare.scale.setScalar(0.50 + 0.34 * Math.abs(Math.sin(t * 72)));
    spotLight.position.copy(fireNow.pSpot).add(V3(0, 0.1, 0.1));
  }

  // Magnetic Claw Tether Arcs when ARM_GRIP clamps Dashboard (2.10-2.50s) or carries Right Wing (2.68-3.28s)
  const gripTargetMod = (t >= 2.12 && t <= 2.50) ? 0 : ((t >= 2.68 && t <= 3.28) ? 2 : -1);
  gripArcs.forEach((arc, idx) => {
    arc.visible = gripTargetMod >= 0;
    if (gripTargetMod >= 0) {
      const jawTip = gripHead.jaws[idx].tipObj.getWorldPosition(new THREE.Vector3());
      const m = modules[gripTargetMod];
      const anchor = modWorld(gripTargetMod, m.userData.w * 0.42, (idx - 1) * 0.18, 0.02);
      updateArc(arc, jawTip, anchor, 0.024, t + idx);
    }
  });

  // Volumetric Galvo Laser Raster Fan Sheet from ARM_SCAN
  laserFan.visible = laserBar.visible = isScanning;
  scanHead.glow.material.opacity = isScanning ? 0.95 : 0.30;
  if (isScanning) {
    const pLens = scanHead.tip.getWorldPosition(new THREE.Vector3());
    const aimPt = stScan.aim;
    const pTop = aimPt.clone().add(V3(0,  0.42, 0.02));
    const pBot = aimPt.clone().add(V3(0, -0.42, 0.02));
    const fa = laserFanGeo.attributes.position.array;
    fa[0] = pLens.x; fa[1] = pLens.y; fa[2] = pLens.z;
    fa[3] = pTop.x;  fa[4] = pTop.y;  fa[5] = pTop.z;
    fa[6] = pBot.x;  fa[7] = pBot.y;  fa[8] = pBot.z;
    laserFanGeo.attributes.position.needsUpdate = true;
    updateArc(laserBar, pTop, pBot, 0.005, t);
  }

  // ---- 650 Volumetric Motion-Streaked Sparks Bouncing Across the Metallic Forge Deck!
  {
    const cZero = _sparkCol.setRGB(0, 0, 0);
    for (let j = 0; j < SPARK_N; j++) {
      const s = sparkData[j];
      const age = ((t - s.born) % SPARK_LIFE + SPARK_LIFE) % SPARK_LIFE;
      const tb = ((t - age) % PERIOD + PERIOD) % PERIOD;
      const fp = s.source === 3 ? null : getFirePoints(tb);
      const L = s.source === 3 ? LETTERS[j % LETTERS.length] : null;
      const origin = L ? (tb >= L.tig && tb <= L.tig + 0.3 ? L.world : null) : (s.source === 0 ? fp.pL : (s.source === 1 ? fp.pR : fp.pSpot));
      if (!origin) {
        _sparkDummy.scale.set(0, 0, 0);
        _sparkDummy.updateMatrix();
        sparkMesh.setMatrixAt(j, _sparkDummy.matrix);
        sparkMesh.setColorAt(j, cZero);
        continue;
      }
      // Ballistic trajectory + elastic bounce & scatter off the Forge Deck (y = 0.024)
      let x = origin.x + s.vx * age;
      let z = origin.z + s.vz * age;
      let y = origin.y + s.vy * age + 0.5 * GRAV * age * age;
      let vyNow = s.vy + GRAV * age;
      if (y < 0.024) {
        // Exact impact time tHit where y(tHit) = 0.024
        const disc = Math.max(0, s.vy * s.vy - 2 * GRAV * (origin.y - 0.024));
        const tHit = clamp((-s.vy - Math.sqrt(disc)) / GRAV, 0, age);
        const dtB = age - tHit;
        const vyImpact = -(s.vy + GRAV * tHit) * 0.44;
        y = Math.max(0.022, 0.024 + vyImpact * dtB + 0.5 * GRAV * dtB * dtB);
        vyNow = vyImpact + GRAV * dtB;
      }
      _sparkVel.set(s.vx, vyNow, s.vz);
      const speed = Math.max(0.2, _sparkVel.length());
      _sparkDummy.position.set(x, y, z);
      _sparkDummy.quaternion.setFromUnitVectors(UP, _sparkVel.multiplyScalar(1 / speed));
      const fade = Math.pow(1 - age / SPARK_LIFE, 1.35);
      const w = (0.022 + 0.014 * s.size) * (0.45 + 0.55 * fade);
      const len = clamp(0.055 + speed * 0.042, 0.06, 0.30) * s.size;
      _sparkDummy.scale.set(w, len, w);
      _sparkDummy.updateMatrix();
      sparkMesh.setMatrixAt(j, _sparkDummy.matrix);

      // each spark the colour of the chamber it was struck in
      if (L) _sparkCol.copy(L.c); else pal(tb, _sparkCol);
      if (s.hot) _sparkCol.lerp(WHITE, 0.72);
      _sparkCol.multiplyScalar(3.7 * fade);
      sparkMesh.setColorAt(j, _sparkCol);
    }
    sparkMesh.instanceMatrix.needsUpdate = true;
    sparkMesh.instanceColor.needsUpdate = true;
  }

  // ---- Helical Verification Scan (5.52 - 6.22s), Elliptical Deck-Clamped Shockwaves & Hyper-Launch Beam
  const scanU = win(t, 5.52, 6.24);
  scanGroup.visible = scanU > 0 && scanU < 1;
  if (scanGroup.visible) {
    scanGroup.position.y = 0.16 + 2.48 * ease(scanU);
    scanGroup.rotation.y = t * 4.5;
    const sOp = Math.sin(Math.PI * scanU);
    scanRing1.material.opacity = sOp;
    scanRing2.material.opacity = sOp * 0.85;
    scanCurtain.material.opacity = sOp * 0.35;
  }

  // Elliptical Shockwaves Clamped Strictly Inside the Forge Deck!
  const swIdea = win(t, 1.54, 2.30), swLive = win(t, 6.18, 7.25);
  shockRingA.visible = swLive > 0 && swLive < 1;
  const rA = 0.55 + 2.42 * easeOut(swLive);
  shockRingA.scale.set(rA * (DECK_RX / 3.2), rA * (DECK_RZ / 3.2), 1);
  shockRingA.material.uniforms.uOp.value = 0.92 * Math.sin(Math.PI * swLive);
  shockRingA.material.uniforms.uSpin.value = t * 2.2;

  shockRingB.visible = swIdea > 0 && swIdea < 1;
  const rB = 0.45 + 2.35 * easeOut(swIdea);
  shockRingB.scale.set(rB * (DECK_RX / 3.2), rB * (DECK_RZ / 3.2), 1);
  shockRingB.material.uniforms.uOp.value = 0.86 * Math.sin(Math.PI * swIdea);
  shockRingB.material.uniforms.uSpin.value = -t * 2.2;

  // the beat each chamber sends across the deck, and the dial its arc fills on the rim
  const rimDrain = 1 - ease(win(t, 8.9, 9.55));
  CHAMBERS.forEach((c, i) => {
    const d = (t - c.t0) / 0.62, m = chShocks[i];
    m.visible = d >= 0 && d < 1;
    if (m.visible) {
      const r = 0.7 + 2.3 * easeOut(d);
      m.scale.set(r * (DECK_RX / 3.2), r * (DECK_RZ / 3.2), 1);
      m.material.opacity = Math.pow(1 - d, 1.3);
    }
    RIM.uniforms.uFill.value[i] = win(t, c.t0, c.t0 + 0.7) * rimDrain;
  });
  RIM.uniforms.uPow.value = 1 + 0.2 * liveK * rimDrain;

  const hb = bump(t, 8.76, 9.52);
  hyperBeam.visible = hb > 0.01;
  hyperBeamMat.uniforms.uOp.value = 0.88 * hb;
  hyperBeamMat.uniforms.uTime.value = t;
  const hbPinch = 1 - 0.45 * ease(win(t, 8.95, 9.52));
  hyperBeam.scale.set(hbPinch, 1, hbPinch);

  holoColumn.material.uniforms.uC.value.copy(C_NOW);
  holoColumn.material.uniforms.uInt.value = 0.85 + 1.5 * liveK * fadeAll + 1.3 * hb + 1.6 * beat;
  crucLight.color.copy(C_NOW);
  crucLight.intensity = 3.0 + 5.5 * liveK * fadeAll + 3.8 * hb + 12 * beat;
  crucGlow.material.color.copy(C_NOW); crucVernierA.material.color.copy(C_NOW); crucVernierB.material.color.copy(C_LAG);
  crucVernierA.rotation.z = -ph * 2;
  crucVernierB.rotation.z = ph * 3;

  // Rising Spiral Energy Motes during Live Celebration
  {
    const mLive = win(t, 6.25, 6.85) * (1 - win(t, 8.65, 9.25));
    motes.visible = mLive > 0.01;
    if (motes.visible) {
      motes.material.opacity = 0.88 * mLive;
      const arr = motes.geometry.attributes.position.array;
      motes.userData.seed.forEach(([a0, r, d0, sp], j) => {
        const u = ((t - 6.2) * sp * 0.65 + d0) % 1.8, a = a0 + u * 2.5;
        arr[j * 3]     = Math.cos(a) * r * (1 - u * 0.22);
        arr[j * 3 + 1] = 0.25 + u * 2.15;
        arr[j * 3 + 2] = 0.05 + Math.sin(a) * r * (1 - u * 0.22);
      });
      motes.geometry.attributes.position.needsUpdate = true;
    }
  }

  // Deck Conduit Pulses
  traces.forEach((tr) => {
    const u = (t / PERIOD * tr.k + tr.ph) % 1;
    tr.pulse.position.lerpVectors(tr.p1, tr.p0, u);
    tr.pulse.material.color.copy(C_NOW);
    tr.pulse.material.opacity = Math.sin(Math.PI * u) * (0.72 + 0.28 * liveK);
  });

  // ---- The name: each letter at half power until it strikes to full; a surge along them going live; on the
  // launch they drain back, from the last to the first
  const surgeU = win(t, 6.2, 6.9);
  const surgeAt = -0.2 + 1.4 * surgeU;
  LETTERS.forEach((L, i) => {
    const d = t - L.tig;
    const on = (d >= 0 ? strike(d) : 0) * (1 - ease(win(t, 8.9 + (12 - i) * 0.03, 9.2 + (12 - i) * 0.03)));
    const surge = surgeU > 0 && surgeU < 1 ? Math.exp(-Math.pow((L.x01 - surgeAt) * 6, 2)) : 0;
    // a tired tube at rest, as neon has
    const hum = (L.i === 4 && t > 0.62 && t < 0.67) || (L.i === 11 && t > 1.2 && t < 1.25) ? 0.45 : 1;
    L.tube.color.copy(L.c).lerp(WHITE, 0.6 * surge).multiplyScalar(hum * (1.35 + 0.6 * on + 3.0 * surge));
    L.face.emissive.copy(L.c);
    L.face.emissiveIntensity = hum * (0.03 + 0.08 * on + 0.22 * surge);
    L.halo.color.copy(L.c).multiplyScalar(hum * (0.12 + 0.2 * on + 0.5 * surge));
  });

  // Curved Hex Matrix Breathing, a ripple in each chamber's colour as it starts, the name's light on the cells behind it,
  // and all six flowing across it while the product is live
  {
    const face = scene.userData.hexFace, col = new THREE.Color();
    const cBlue = new THREE.Color(0x1f6ef5), cCyan = new THREE.Color(0x00cfff);
    const rIdea = win(t, 1.54, 2.65) * 6.5, wIdea = bump(t, 1.54, 2.65);
    const rLive = win(t, 6.18, 7.60) * 6.8, wLive = bump(t, 6.18, 7.60);
    const flow = ease(win(t, 6.2, 6.9)) * (1 - ease(win(t, 8.85, 9.4)));
    hexCells.forEach((h) => {
      const dist = Math.hypot(h.wx, h.wy - 2.1);
      const rip1 = wIdea * Math.exp(-Math.pow((dist - rIdea) * 2.1, 2)) * 0.42;
      const rip2 = wLive * Math.exp(-Math.pow((dist - rLive) * 1.9, 2)) * 0.55;
      const base = h.baseLit * (0.55 + 0.45 * Math.sin(ph * h.k + h.ph * TAU));
      col.copy(h.isGreen ? cCyan : cBlue).multiplyScalar(base);
      if (rip1 > 0.002) addC(col, cCyan, rip1);
      CHAMBERS.forEach((c) => {
        const u = (t - c.t0) / 1.05;
        if (u <= 0 || u >= 1) return;
        const w = Math.sin(Math.PI * u) * Math.exp(-Math.pow((dist - u * 6.2) * 2.0, 2)) * 0.34;
        if (w > 0.002) addC(col, c.c, w);
      });
      if (rip2 > 0.002) addC(col, rainbow(h.wx * 0.8 + t * 3, C_TMP), rip2);
      if (flow > 0.002) addC(col, rainbow(h.wx * 0.62 - h.wy * 0.4 + t * 1.5, C_TMP), flow * (h.ph > 0.62 ? 0.075 : 0.012));
      // the cells behind the name darker, so it stands off them, and the letter nearest it lights them a little
      const near = Math.abs(h.wy - signGroup.position.y);
      if (near < 1.25 && Math.abs(h.wx) < SIGN_W * 0.56) {
        col.multiplyScalar(0.3 + 0.7 * clamp01((near - 0.35) / 0.7));
        const L = LETTERS[clamp(Math.round((h.wx / SIGN_W + 0.5) * (LETTERS.length - 1)), 0, LETTERS.length - 1)];
        addC(col, L.c, 0.045 * (1 - near / 1.25));
      }
      face.setColorAt(h.i, col);
    });
    face.instanceColor.needsUpdate = true;
  }

  composer.render();
}

window.PERIOD = PERIOD;
window.render = render;
if (Q.has('frames')) {
  render(0); render(0);
  window.READY = true;
} else {
  let n = 0; const t0 = performance.now();
  (function loop() {
    render((performance.now() - t0) / 1000);
    if (++n === 6) window.READY = true;
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
