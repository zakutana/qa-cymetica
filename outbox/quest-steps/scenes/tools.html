<title>Build it Better: the robot arms (scene for the Quest page)</title>
<!-- Step 02 of the Quest page: the robot arms build your product (the operator, 2026-10-29: "nejaky huste naradi vesmirne
     space roboticke"). Twelfth take (2026-10-31: "mnohem lepsi animace, musis dbat na detaily, ted je to takove ploche a
     basic ta animace robotickych rukou", and "dat tam nejak do pozadi logo Build It Better napis neonovy"): a workshop in
     space before a curved wall of hexagons (Build it Better's own, from its picture), its name in neon on it; a drone
     brings the idea down a beam of light; two arms with pistons, cables and running lights, one gripping each glass
     panel of the app and carrying it in, the other welding it on, the seam white-hot and cooling, sparks that fall and
     bounce; then a scan of light up the finished app, which lights green and rises. Drawn frame by frame by record.py
     workshop (render(t), a function of t alone over PERIOD, so it loops without a seam); never loaded by the page. -->

<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || innerWidth), H = +(Q.get('h') || innerHeight);
// the sign's type: its stylesheet first, then the face itself
await new Promise((r) => { const l = document.querySelector('link[href*="Archivo"]'); if (l.sheet) r(); else { l.onload = r; l.onerror = r; } });
await document.fonts.load('400 160px "Archivo Black"');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.34;
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 400);

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const TAU = Math.PI * 2;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
// eased with a little overshoot, as a heavy arm settles
const settle = (x) => { x = clamp01(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a, b) => clamp01((t - a) / (b - a));
const bump = (t, a, b) => Math.sin(Math.PI * win(t, a, b));

// ---- deep space: a dark dome, stars, a warm sun far off
scene.add(new THREE.Mesh(new THREE.SphereGeometry(180, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `varying vec3 vP;
    void main(){
      vec3 base = mix(vec3(0.006, 0.009, 0.016), vec3(0.010, 0.020, 0.036), smoothstep(-0.2, 0.6, vP.y));
      base += vec3(0.0, 0.07, 0.11) * smoothstep(0.7, 1.0, dot(vP, normalize(vec3(0.85, 0.35, -0.4)))) * 0.3;
      base += vec3(0.0, 0.08, 0.05) * smoothstep(0.8, 1.0, dot(vP, normalize(vec3(-0.9, 0.2, -0.4)))) * 0.2;
      gl_FragColor = vec4(base, 1.0);
    }`
})));
{
  const n = 2600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = rnd() * 2 - 1, a = rnd() * TAU, r = Math.sqrt(1 - u * u);
    pos.set([Math.cos(a) * r * 150, u * 150, Math.sin(a) * r * 150], i * 3);
    const b = 0.35 + rnd() * 0.65;
    col.set(rnd() < 0.12 ? [b * 0.7, b * 0.9, b] : [b, b, b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.42, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.9, depthWrite: false })));
}
function glowTex(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), gr = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, inner); gr.addColorStop(0.25, outer); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW_C = glowTex('rgba(220,255,255,1)', 'rgba(0,207,255,0.5)'), GLOW_G = glowTex('rgba(210,255,235,1)', 'rgba(0,255,136,0.45)');
const sprite = (map, s) => { const o = new THREE.Sprite(new THREE.SpriteMaterial({ map, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true })); o.scale.set(s, s, 1); return o; };
const sun = sprite(glowTex('rgba(255,248,232,1)', 'rgba(255,214,160,0.35)'), 9); sun.position.set(-60, 34, -130); scene.add(sun);

// ---- materials
const M = {
  shell: new THREE.MeshPhysicalMaterial({ color: 0xd2dae2, roughness: 0.3, metalness: 0.0, clearcoat: 0.9, clearcoatRoughness: 0.18 }),
  joint: new THREE.MeshStandardMaterial({ color: 0x1b222b, roughness: 0.36, metalness: 0.85 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x0b1017, roughness: 0.45, metalness: 0.8 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x9aa6b3, roughness: 0.22, metalness: 1.0 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xdfe8f0, roughness: 0.08, metalness: 1.0 }),
  cyan: new THREE.MeshStandardMaterial({ color: 0x00cfff, emissive: 0x00cfff, emissiveIntensity: 3.2, roughness: 0.4 }),
  green: new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 3.0, roughness: 0.4 }),
  floor: new THREE.MeshStandardMaterial({ color: 0x0a0f16, roughness: 0.24, metalness: 0.7 }),
  cable: new THREE.MeshStandardMaterial({ color: 0x10151c, roughness: 0.55, metalness: 0.3 }),
  hex: new THREE.MeshStandardMaterial({ color: 0x0d1622, roughness: 0.42, metalness: 0.75 })
};

// ---- the wall behind: Build it Better's hexagons (its picture: a honeycomb in the dark, a few cells lit blue), curved
// round the workshop, and its name on it in neon
const CENTER = new THREE.Vector3(0.15, 0, 0.2);
const hexLit = [];
{
  // an island of cells behind the work, not a wall: an oval round the sign, its edge breaking up into the dark
  const R = 6.8, r = 0.34, dx = r * Math.sqrt(3), dy = r * 1.5, cells = [];
  for (let row = 0; row < 16; row++) for (let col = -16; col <= 16; col++) {
    const s = col * dx + (row % 2 ? dx / 2 : 0), ang = s / R, y = 0.6 + row * dy;
    const e = Math.pow(ang / 0.6, 2) + Math.pow((y - 3.7) / 3.0, 2), keep = rnd();
    if (e > 1.15 || (e > 0.62 && keep < (e - 0.62) * 1.9)) continue;
    cells.push([ang, y, (rnd() - 0.5) * 0.12, e]);
  }
  const geo = new THREE.CylinderGeometry(r * 0.94, r * 0.94, 0.16, 6);
  geo.rotateX(Math.PI / 2);
  const mesh = new THREE.InstancedMesh(geo, M.hex, cells.length); mesh.receiveShadow = true;
  const face = new THREE.InstancedMesh(new THREE.CircleGeometry(r * 0.72, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }), cells.length);
  const edge = new THREE.InstancedMesh(new THREE.RingGeometry(r * 0.9, r * 0.94, 6, 1), new THREE.MeshBasicMaterial({ color: new THREE.Color(0x1f6fd6).multiplyScalar(0.7), transparent: true, opacity: 0.3, depthWrite: false }), cells.length);
  const m = new THREE.Object3D(), c0 = new THREE.Color(0, 0, 0);
  cells.forEach(([ang, y, dz, e], i) => {
    m.position.set(CENTER.x + Math.sin(ang) * (R + dz), y, CENTER.z - Math.cos(ang) * (R + dz));
    m.rotation.set(0, -ang, Math.PI / 6); m.updateMatrix();
    mesh.setMatrixAt(i, m.matrix);
    m.position.addScaledVector(new THREE.Vector3(-Math.sin(ang), 0, Math.cos(ang)), 0.085); m.updateMatrix();
    face.setMatrixAt(i, m.matrix); edge.setMatrixAt(i, m.matrix);
    face.setColorAt(i, c0);
    // a few cells lit, as in its picture: blue, some cyan, one in eight; each breathes on a period dividing the loop
    if (rnd() < 0.08) hexLit.push({ i, ph: rnd(), k: [1, 2, 5][Math.floor(rnd() * 3)], c: rnd() < 0.7 ? new THREE.Color(0x2a6ff0) : new THREE.Color(0x00cfff), a: (0.08 + rnd() * 0.16) * (1.2 - Math.min(1, e)) });
  });
  face.instanceColor.needsUpdate = true;
  scene.add(mesh, face, edge);
  scene.userData.face = face;
}
// the sign: its name in tubes of light, "Build it" cyan, "Better" green, on a dark plate held off the wall
const sign = new THREE.Group(); sign.position.set(CENTER.x, 4.1, CENTER.z - 6.25); scene.add(sign);
const neon = (() => {
  const c = document.createElement('canvas'); c.width = 2400; c.height = 420;
  const x = c.getContext('2d'); x.font = '400 230px "Archivo Black"'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  const a = 'Build it ', b = 'Better', wa = x.measureText(a).width, wb = x.measureText(b).width, x0 = (c.width - wa - wb) / 2, y = c.height / 2 + 6;
  const tube = (s, px, col, core) => {
    x.shadowColor = col;
    for (const [w, blur, st, al] of [[16, 60, col, 0.35], [9, 26, col, 0.8], [5, 10, core, 1], [2.2, 0, '#ffffff', 1]]) {
      x.globalAlpha = al; x.lineWidth = w; x.shadowBlur = blur; x.strokeStyle = st; x.strokeText(s, px, y);
    }
    x.globalAlpha = 1; x.shadowBlur = 0;
  };
  tube(a, x0, '#00cfff', '#b8f2ff'); tube(b, x0 + wa, '#00ff88', '#c4ffe4');
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
})();
const signW = 6.4, signH = signW * 420 / 2400;
const plate = new THREE.Mesh(new RoundedBoxGeometry(signW * 1.04, signH * 1.18, 0.08, 4, 0.08), M.dark); plate.position.z = -0.05; plate.receiveShadow = true; sign.add(plate);
const neonMat = new THREE.MeshBasicMaterial({ map: neon, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: new THREE.Color(2.2, 2.2, 2.2) });
const neonMesh = new THREE.Mesh(new THREE.PlaneGeometry(signW, signH), neonMat); neonMesh.position.z = 0.02; sign.add(neonMesh);
for (const sx of [-1, 1]) for (const sy of [-1, 1]) { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.14, 16), M.steel); b.rotation.x = Math.PI / 2; b.position.set(sx * signW * 0.5, sy * signH * 0.5, -0.02); sign.add(b); }
const signLight = new THREE.PointLight(0x40ffd0, 5, 7, 1.6); signLight.position.set(0, -0.4, 1.0); sign.add(signLight);

// ---- the workshop floor: a dark disc, a lit rim, traces of light running in to the pad
const deck = new THREE.Group(); scene.add(deck);
{
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.35, 0.22, 96), M.floor);
  disc.position.y = -0.11; disc.receiveShadow = true; deck.add(disc);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(4.22, 0.018, 8, 160), M.cyan); rim.rotation.x = Math.PI / 2; rim.position.y = 0.004; deck.add(rim);
  const rim2 = new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.008, 8, 120), new THREE.MeshStandardMaterial({ color: 0x00cfff, emissive: 0x00cfff, emissiveIntensity: 1.2 }));
  rim2.rotation.x = Math.PI / 2; rim2.position.y = 0.004; deck.add(rim2);
  // a skirt round the deck's edge: panels with lights
  for (let i = 0; i < 48; i++) {
    const a = i / 48 * TAU, l = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.02), i % 4 ? M.dark : M.cyan);
    l.position.set(Math.cos(a) * 4.3, -0.12, Math.sin(a) * 4.3); l.rotation.y = -a + Math.PI / 2; deck.add(l);
  }
}
// the traces: lines from the rim to the pad, a pulse of light running in along each
const traces = [];
{
  const mat = new THREE.MeshBasicMaterial({ color: 0x0b5f80, transparent: true, opacity: 0.6, depthWrite: false });
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * TAU + 0.11, L = 2.8;
    const ln = new THREE.Mesh(new THREE.PlaneGeometry(L, 0.012), mat);
    ln.rotation.x = -Math.PI / 2; ln.rotation.z = -a;
    const mid = 1.35 + L / 2; ln.position.set(CENTER.x + Math.cos(a) * mid, 0.004, CENTER.z + Math.sin(a) * mid); scene.add(ln);
    const p = sprite(i % 3 ? GLOW_C : GLOW_G, 0.32); scene.add(p);
    traces.push({ a, p, ph: rnd(), k: i % 2 ? 2 : 4 });   // 4 or 2 runs a loop
  }
}

// ---- a robot arm: base, turret, shoulder, upper arm, elbow, forearm, wrist, tool; pistons, cables, running lights
function joint(r, len, ringMat) {
  const g = new THREE.Group();
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 48), M.joint); c.rotation.x = Math.PI / 2; c.castShadow = true; g.add(c);
  for (const s of [1, -1]) {
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.72, r * 0.72, 0.012, 48), M.steel); cap.rotation.x = Math.PI / 2; cap.position.z = s * (len / 2 + 0.006); g.add(cap);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 0.84, r * 0.06, 10, 64), ringMat); ring.position.z = s * (len / 2 + 0.002); g.add(ring);
    // bolts round the cap
    for (let k = 0; k < 8; k++) { const b = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.06, r * 0.06, 0.02, 10), M.chrome); b.rotation.x = Math.PI / 2; b.position.set(Math.cos(k / 8 * TAU) * r * 0.55, Math.sin(k / 8 * TAU) * r * 0.55, s * (len / 2 + 0.012)); g.add(b); }
  }
  return g;
}
function link(w, len, d, ledMat) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, len, d, 6, Math.min(w, d) * 0.42), M.shell);
  m.position.y = len / 2; m.castShadow = true; m.receiveShadow = true; g.add(m);
  // a seam of dark panel down each side, and a running light in it
  for (const s of [1, -1]) {
    const seam = new THREE.Mesh(new THREE.BoxGeometry(0.012, len * 0.7, d * 0.5), M.dark); seam.position.set(s * w / 2, len / 2, 0); g.add(seam);
  }
  const led = new THREE.Mesh(new THREE.BoxGeometry(0.016, len * 0.5, 0.03), ledMat); led.position.set(w / 2 + 0.004, len / 2, 0); g.add(led);
  return { g, led };
}
const HS = 0.64, L1 = 1.15, L2 = 0.95;
function piston(parent) {
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1, 20), M.joint); body.castShadow = true;
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1, 16), M.chrome); rod.castShadow = true;
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.047, 0.006, 6, 24), M.cyan);
  scene.add(body, rod, band);
  return { body, rod, band };
}
const up = new THREE.Vector3(0, 1, 0);
function placePiston(p, a, b) {
  const d = new THREE.Vector3().subVectors(b, a), L = d.length(), n = d.clone().normalize(), q = new THREE.Quaternion().setFromUnitVectors(up, n);
  const bl = Math.min(L * 0.62, 0.62);
  p.body.position.copy(a).addScaledVector(n, bl / 2); p.body.scale.set(1, bl, 1); p.body.quaternion.copy(q);
  p.rod.position.copy(a).addScaledVector(n, (bl + L) / 2 - 0.02); p.rod.scale.set(1, L - bl + 0.04, 1); p.rod.quaternion.copy(q);
  p.band.position.copy(a).addScaledVector(n, bl - 0.01); p.band.quaternion.copy(q).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2));
}
function arm(ledColor) {
  const ledMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(ledColor).multiplyScalar(2.4) });
  const root = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.52, 0.16, 64), M.joint); base.position.y = 0.08; base.castShadow = true; root.add(base);
  // a band of stripes round the base: cyan and dark, as the deck's skirt
  for (let k = 0; k < 24; k++) { const s = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.04, 0.02), k % 2 ? M.dark : M.cyan); const a = k / 24 * TAU; s.position.set(Math.cos(a) * 0.5, 0.09, Math.sin(a) * 0.5); s.rotation.y = -a + Math.PI / 2; root.add(s); }
  const bring = new THREE.Mesh(new THREE.TorusGeometry(0.43, 0.012, 8, 96), M.cyan); bring.rotation.x = Math.PI / 2; bring.position.y = 0.165; root.add(bring);
  const turret = new THREE.Group(); turret.position.y = 0.16; root.add(turret);
  const tbody = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.36, 0.36, 64), M.shell); tbody.position.y = 0.18; tbody.castShadow = true; turret.add(tbody);
  const vent = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.16, 0.2), M.dark); vent.position.set(0.33, 0.2, 0); turret.add(vent);
  const led = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.02, 0.16), ledMat); led.position.set(-0.335, 0.24, 0); turret.add(led);
  const sh = new THREE.Group(); sh.position.y = HS - 0.16; turret.add(sh);
  sh.add(joint(0.22, 0.46, M.cyan));
  const shoulder = new THREE.Group(); sh.add(shoulder);
  const up1 = link(0.26, L1, 0.3, ledMat); shoulder.add(up1.g);
  const el = new THREE.Group(); el.position.y = L1; shoulder.add(el);
  el.add(joint(0.17, 0.38, M.cyan));
  const elbow = new THREE.Group(); el.add(elbow);
  const up2 = link(0.2, L2, 0.23, ledMat); elbow.add(up2.g);
  const wr = new THREE.Group(); wr.position.y = L2; elbow.add(wr);
  wr.add(joint(0.12, 0.26, M.cyan));
  const wrist = new THREE.Group(); wr.add(wrist);
  const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.2, 40), M.joint); flange.position.y = 0.12; flange.castShadow = true; wrist.add(flange);
  const spin = new THREE.Group(); spin.position.y = 0.22; wrist.add(spin);
  const tool = new THREE.Group(); spin.add(tool);
  // cables: along the upper arm, and from the forearm round the wrist
  const c1 = new THREE.CatmullRomCurve3([new THREE.Vector3(0.17, 0.05, 0.0), new THREE.Vector3(0.21, 0.6, 0.06), new THREE.Vector3(0.16, 1.12, 0.0)]);
  shoulder.add(new THREE.Mesh(new THREE.TubeGeometry(c1, 40, 0.026, 10, false), M.cable));
  const c2 = new THREE.CatmullRomCurve3([new THREE.Vector3(-0.13, 0.1, 0.05), new THREE.Vector3(-0.16, 0.55, 0.09), new THREE.Vector3(-0.12, 0.92, 0.06)]);
  elbow.add(new THREE.Mesh(new THREE.TubeGeometry(c2, 30, 0.018, 8, false), M.cable));
  // pistons: turret to upper arm, upper arm to forearm (placed each frame between these anchors)
  const a1 = new THREE.Object3D(); a1.position.set(-0.24, 0.2, 0.2); turret.add(a1);
  const b1 = new THREE.Object3D(); b1.position.set(-0.05, 0.62, 0.2); shoulder.add(b1);
  const a2 = new THREE.Object3D(); a2.position.set(0.02, 0.78, -0.19); shoulder.add(a2);
  const b2 = new THREE.Object3D(); b2.position.set(0.0, 0.32, -0.16); elbow.add(b2);
  return { root, turret, shoulder, elbow, wrist, spin, tool, leds: [led, up1.led, up2.led], ledMat, pist: [[piston(), a1, b1], [piston(), a2, b2]] };
}
function aim(a, target, reach, psi) {
  const b = a.root.position, dx = target.x - b.x, dz = target.z - b.z;
  a.turret.rotation.y = Math.atan2(dz, -dx);
  const tr = Math.hypot(dx, dz), ty = target.y - HS;
  const wr = tr - reach * Math.sin(psi), wy = ty - reach * Math.cos(psi);
  const D = Math.min(Math.hypot(wr, wy), L1 + L2 - 1e-3);
  const t2 = Math.acos(THREE.MathUtils.clamp((D * D - L1 * L1 - L2 * L2) / (2 * L1 * L2), -1, 1));
  const g = Math.atan2(wr, wy), al = Math.atan2(L2 * Math.sin(t2), L1 + L2 * Math.cos(t2));
  a.shoulder.rotation.z = g - al;
  a.elbow.rotation.z = t2;
  a.wrist.rotation.z = psi - (g - al) - t2;
}
const _a = new THREE.Vector3(), _b = new THREE.Vector3();
function pistons(a) { a.pist.forEach(([p, x, y]) => { x.getWorldPosition(_a); y.getWorldPosition(_b); placePiston(p, _a, _b); }); }
function gripper(tool) {
  const palm = new THREE.Mesh(new RoundedBoxGeometry(0.32, 0.1, 0.17, 4, 0.03), M.joint); palm.position.y = 0.05; palm.castShadow = true; tool.add(palm);

    tractor.position.set(top.x, top.y - len / 2, top.z); tractor.scale.set(1, len, 1); tractor.material.opacity = 0.28 * tk; }
  // the watcher drone, hovering by the work
  watcher.position.set(-1.6 + 0.08 * Math.sin(ph), 2.75 + 0.07 * Math.sin(ph * 3), 1.35); watcher.rotation.set(0.12, 0.6 + 0.08 * Math.sin(ph), -0.08);
  watcher.userData.rotors.forEach((r, i) => { r.rotation.y = t * 55 + i; });

  // the product: done, scanned, lifted, then given back
  const done = ease(win(t, 6.6, 7.4)), back = ease(win(t, 8.6, 9.6));
  app.position.copy(APP0); app.position.y += 0.2 * done * (1 - back) - 0.25 * back;
  app.rotation.y = -0.16 * done * (1 - back) + 0.03 * Math.sin(ph);
  panels.forEach(([p, pos, rot], i) => {
    const fly = win(t, START(i), START(i) + FLY), k = settle(fly), show = (fly > 0 ? 1 : 0) * (1 - back);
    p.position.set(pos[0] * k + 1.2 * (1 - k), -0.05 + (pos[1] + 0.05) * k, pos[2] * k + 0.6 * (1 - k));
    p.rotation.set(rot[0] * k, rot[1] * k + (1 - k) * 1.3, rot[2] * k);
    p.scale.setScalar(0.2 + 0.8 * Math.min(1, k));
    p.visible = show > 0.001;
    const lock = bump(t, START(i) + FLY - 0.05, START(i) + FLY + 0.35);
    p.userData.mats.forEach(([m, op, col]) => {
      m.opacity = Math.min(1, op * (0.6 + 0.4 * Math.min(1, fly * 2)) * (1 + 1.5 * lock) + 0.25 * done) * (1 - back);
      m.color.copy(col).lerp(GREEN.clone().multiplyScalar(col.r + col.g + col.b > 1.2 ? 2.4 : 0.5), done * (1 - back) * 0.85);
    });
    // what it shows, drawn in as it locks
    const drawK = ease(win(t, START(i) + FLY, START(i) + FLY + 1.1)) * (1 - back);
    p.userData.draw.forEach((f) => f(drawK));
    // its seam: drawn by the laser, white-hot, cooling to cyan, then a faint line
    const a = START(i) + FLY, wk = win(t, a, a + WELD), cool = win(t, a + 0.1, a + WELD + 1.2), seam = p.userData.seam;
    seam.visible = wk > 0 && back < 1;
    seam.scale.x = Math.max(0.001, wk); seam.position.x = -p.userData.w * 0.45 * (1 - wk);
    seam.material.color.copy(WHITE).lerp(CYANC, cool).lerp(GREEN.clone().multiplyScalar(2), done * (1 - back) * 0.8);
    seam.material.opacity = (1 - 0.6 * cool) * (1 - back);
  });
  scene.updateMatrixWorld(true);
  const onPanel = (i, x, y) => panels[i][0].localToWorld(new THREE.Vector3(x, y, 0));
  // the gripper: to each panel as it flies, holding its right edge, then back to rest; its fingers close on it
  let aT = A_REST.clone(), grip = 0;
  for (let i = 0; i < panels.length; i++) {
    const w = panels[i][0].userData.w;
    const go = ease(win(t, START(i) - 0.4, START(i) + 0.02)), leave = ease(win(t, START(i) + FLY + 0.05, START(i) + FLY + 0.4));
    if (t >= START(i) - 0.4 && t < START(i) + FLY + 0.4) aT = lerpV(lerpV(i ? onPanel(i - 1, panels[i - 1][0].userData.w * 0.38, 0) : A_REST, onPanel(i, w * 0.38, 0), go), i === panels.length - 1 ? A_REST : onPanel(i, w * 0.38, 0), leave);
    else if (t >= START(i) + FLY + 0.4 && i < panels.length - 1 && t < START(i + 1) - 0.4) aT = onPanel(i, w * 0.38, 0);
    grip = Math.max(grip, win(t, START(i) - 0.12, START(i) + 0.02) * (1 - win(t, START(i) + FLY - 0.02, START(i) + FLY + 0.12)));
  }
  aT.y += 0.02 * Math.sin(ph * 4);
  aim(A, aT, 0.5, THREE.MathUtils.degToRad(98));
  A.spin.rotation.y = 0.25 * Math.sin(ph * 2);
  fingers.forEach(([f, s]) => { f.position.x = s * (0.135 - 0.05 * grip); f.rotation.z = s * 0.18 * (1 - grip); });
  // the laser: along each panel's lower edge, left to right, just after it locks
  let bT = B_REST.clone(), welding = false;
  for (let i = 0; i < panels.length; i++) {
    const w = panels[i][0].userData.w, h = panels[i][0].userData.h;
    const a = START(i) + FLY, k = win(t, a, a + WELD);
    if (t >= a - 0.3 && t < a + WELD + 0.3) {
      const along = onPanel(i, w * (-0.45 + 0.9 * k), -h * 0.5);
      bT = lerpV(lerpV(B_REST, along, ease(win(t, a - 0.3, a))), B_REST, ease(win(t, a + WELD, a + WELD + 0.3)));
      if (t >= a && t < a + WELD) { welding = true; bT = along; }
    }
  }
  bT.y += 0.015 * Math.sin(ph * 5);
  aim(B, bT, 0.67 + 0.32, THREE.MathUtils.degToRad(104));
  B.spin.rotation.y = welding ? t * 9 : 0;
  scene.updateMatrixWorld(true);
  pistons(A); pistons(B);
  // running lights: a pulse down each arm's lights; brighter while it works
  [[A, grip], [B, welding ? 1 : 0]].forEach(([a, w], j) => { const v = 1.4 + 1.2 * (0.5 + 0.5 * Math.sin(ph * 6 + j)) + 1.6 * w; a.ledMat.color.setHSL(j ? 0.53 : 0.42, 1, 0.5).multiplyScalar(v); });
  const tipW = new THREE.Vector3(); torch.tip.getWorldPosition(tipW);
  beam.visible = beamHalo.visible = flare.visible = welding; weldLight.intensity = welding ? 6 + 2 * Math.sin(t * 90) : 0;
  torch.glow.material.opacity = welding ? 1 : 0.35; torch.ring.material = welding ? M.green : M.cyan;
  if (welding) {
    const dir = new THREE.Vector3().subVectors(bT, tipW), len = Math.max(0.01, dir.length());
    for (const b of [beam, beamHalo]) { b.scale.set(1, len, 1); b.position.copy(tipW).addScaledVector(dir, 0.5); b.quaternion.setFromUnitVectors(up, dir.clone().normalize()); }
    flare.position.copy(bT); weldLight.position.copy(bT);
    flare.scale.setScalar(0.5 + 0.28 * Math.abs(Math.sin(t * Math.PI * 14)));
  }
  // the sparks: alive only while a weld is on; each from where the weld was when it was born
  {
    const pos = sparks.geometry.attributes.position.array, col = sparks.geometry.attributes.color.array;
    const weldAt = (tb) => { for (let i = 0; i < panels.length; i++) { const a = START(i) + FLY; if (tb >= a && tb < a + WELD) return [i, (tb - a) / WELD]; } return null; };
    sparks.userData.s.forEach((s, j) => {
      const age = ((t - s.born) % SPARK_LIFE + SPARK_LIFE) % SPARK_LIFE, tb = t - age, w = weldAt(tb);
      let o = j * 6;
      if (!w) { for (let k = 0; k < 6; k++) { pos[o + k] = 0; col[o + k] = 0; } return; }
      const [i, k] = w, p0 = onPanel(i, panels[i][0].userData.w * (-0.45 + 0.9 * k), -panels[i][0].userData.h * 0.5);
      const at = (u) => { const y = p0.y + s.v.y * u + 0.5 * G * u * u; return new THREE.Vector3(p0.x + s.v.x * u, y < 0.01 ? 0.01 + (0.01 - y) * 0.3 : y, p0.z + s.v.z * u); };
      const a1 = at(age), a0 = at(Math.max(0, age - 0.035)), f = Math.pow(1 - age / SPARK_LIFE, 1.6);
      pos[o] = a1.x; pos[o + 1] = a1.y; pos[o + 2] = a1.z; pos[o + 3] = a0.x; pos[o + 4] = a0.y; pos[o + 5] = a0.z;
      const c = s.warm ? [3.0 * f, 1.8 * f, 0.9 * f] : [2.2 * f, 3.0 * f, 3.2 * f];
      col[o] = c[0]; col[o + 1] = c[1]; col[o + 2] = c[2]; col[o + 3] = c[0] * 0.2; col[o + 4] = c[1] * 0.2; col[o + 5] = c[2] * 0.2;
    });
    sparks.geometry.attributes.position.needsUpdate = true; sparks.geometry.attributes.color.needsUpdate = true;
  }
  // the scan, the lift, the burst, the motes
  const sk = win(t, 6.2, 7.2);
  scan.visible = sk > 0 && sk < 1; scan.position.y = 0.15 + 2.6 * ease(sk);
  scanRing.material.opacity = Math.sin(Math.PI * sk); scanSheet.material.opacity = 0.35 * Math.sin(Math.PI * sk);
  burst.scale.setScalar(0.4 + 3.4 * ease(win(t, 7.0, 8.2)));
  burst.material.opacity = 0.9 * Math.sin(Math.PI * win(t, 7.0, 8.2));
  cone.material.uniforms.k.value = 1 + 1.6 * done * (1 - back);
  ringB.rotation.z = -ph * 2;
  appLight.intensity = 4 + 6 * done * (1 - back);
  {
    const live = win(t, 6.9, 7.3) * (1 - win(t, 8.4, 8.9)), pos = motes.geometry.attributes.position.array;
    motes.visible = live > 0; motes.material.opacity = 0.9 * live;
    motes.userData.seed.forEach(([a0, r, d0, sp], j) => {
      const u = ((t - 6.9) * sp * 0.6 + d0) % 1.6, a = a0 + u * 2.4;
      pos[j * 3] = 0.15 + Math.cos(a) * r * (1 - u * 0.25); pos[j * 3 + 1] = 0.4 + u * 2.2; pos[j * 3 + 2] = 0.2 + Math.sin(a) * r * (1 - u * 0.25);
    });
    motes.geometry.attributes.position.needsUpdate = true;
  }
  // the floor's traces: a pulse running in along each to the pad
  traces.forEach((tr) => { const u = (t / PERIOD * tr.k + tr.ph) % 1, r = 4.1 - 2.75 * u; tr.p.position.set(CENTER.x + Math.cos(tr.a) * r, 0.02, CENTER.z + Math.sin(tr.a) * r); tr.p.material.opacity = Math.sin(Math.PI * u) * 0.9; });
  // the wall's lit cells breathe; the neon steady, but for one stutter a loop
  { const face = scene.userData.face, c = new THREE.Color();
    hexLit.forEach((h) => { const v = h.a * (0.55 + 0.45 * Math.sin(ph * h.k + h.ph * TAU)); face.setColorAt(h.i, c.copy(h.c).multiplyScalar(v)); });
    face.instanceColor.needsUpdate = true; }
  const fl = (t > 3.62 && t < 3.7) || (t > 3.78 && t < 3.82) ? 0.35 : 1;
  neonMat.color.setScalar(1.8 * fl); signLight.intensity = 4 * fl;
  composer.render();
}
window.PERIOD = PERIOD;
window.render = render;
if (Q.has('frames')) { render(0); render(0); window.READY = true; }
else { let frames = 0; const t0 = performance.now(); (function loop() { render((performance.now() - t0) / 1000); if (++frames === 8) window.READY = true; requestAnimationFrame(loop); })(); }
</script>
