<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point, Line, Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body.black { background: #000; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  /* one sentence in three beats, one beat on screen at a time */
  #words { position: absolute; left: 0; right: 0; bottom: 3.2%; height: 1.2em; text-align: center; pointer-events: none;
    font: 400 min(4.6vw, 8.15vh)/1.2 'Archivo Black', sans-serif; letter-spacing: -.012em; color: #fff; text-shadow: 0 2px 14px rgba(0, 0, 0, .75); }
  #words span { position: absolute; left: 0; right: 0; top: 0; opacity: 0; white-space: nowrap; will-change: opacity, transform; }
  #words em { font-style: normal; color: #00ff88; }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js"
} }</script>
</head>
<body>
<div id="words" aria-label="Your idea. Build it Better. A real product.">
  <span id="w1">Your idea.</span>
  <span id="w2">Build it <em>Better.</em></span>
  <span id="w3">A real <em>product.</em></span>
</div>
<script type="module">
import * as THREE from 'three';

/* A point becomes a line, the line rises, and where it has been there is a finished thing.
   Point: your idea. Line: Build it Better. Object: a real product. Nothing else is on screen.
   Every frame is a pure function of t. No bloom, no shadows, no transmission: the glass is
   shaded analytically on one mesh, so the cost is one fragment shader on the pixels it covers. */

const T = 12;
const Q = new URLSearchParams(location.search);
const BLACK = Q.get('black') === '1';
if (BLACK) document.body.classList.add('black');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, BLACK ? 1 : 0);
renderer.toneMapping = THREE.NoToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, 1, .1, 60);

/* ---- the object: a thick slab, outline a superellipse, its edge a true rounded bevel */
function slabGeometry(N = 280, BS = 10, hw = 1, r = .07, h = .21, n = 5) {
  const rows = [];
  const out = [];
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    const x = hw * Math.sign(c) * Math.abs(c) ** (2 / n), y = hw * Math.sign(s) * Math.abs(s) ** (2 / n);
    let nx = Math.sign(c) * Math.abs(c) ** (2 * (n - 1) / n), ny = Math.sign(s) * Math.abs(s) ** (2 * (n - 1) / n);
    const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    out.push([x, y, nx, ny]);
  }
  for (let j = BS; j >= 0; j--) { const f = j / BS * Math.PI / 2; rows.push({ off: r * (Math.cos(f) - 1), z: -(h - r) - r * Math.sin(f), nc: Math.cos(f), nz: -Math.sin(f) }); }
  for (let j = 0; j <= BS; j++) { const f = j / BS * Math.PI / 2; rows.push({ off: r * (Math.cos(f) - 1), z: (h - r) + r * Math.sin(f), nc: Math.cos(f), nz: Math.sin(f) }); }
  const pos = [], nor = [], idx = [];
  for (const R of rows) for (const [x, y, nx, ny] of out) {
    pos.push(x + nx * R.off, y + ny * R.off, R.z);
    nor.push(nx * R.nc, ny * R.nc, R.nz);
  }
  const at = (j, i) => j * N + ((i + N) % N);
  for (let j = 0; j < rows.length - 1; j++) for (let i = 0; i < N; i++) {
    idx.push(at(j, i), at(j, i + 1), at(j + 1, i + 1), at(j, i), at(j + 1, i + 1), at(j + 1, i));
  }
  const cf = pos.length / 3; pos.push(0, 0, h); nor.push(0, 0, 1);
  const cb = pos.length / 3; pos.push(0, 0, -h); nor.push(0, 0, -1);
  const last = rows.length - 1;
  for (let i = 0; i < N; i++) { idx.push(cf, at(last, i), at(last, i + 1)); idx.push(cb, at(0, i + 1), at(0, i)); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}

const COMMON = /* glsl */`
  float ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(.06711056, .00583715)))); }
  vec3 finish(vec3 c) {               // filmic shoulder, sRGB, a little dither so no dark gradient bands
    c = 1. - exp(-c);
    c = pow(c, vec3(1. / 2.2));
    return c + (ign(gl_FragCoord.xy) - .5) / 255.;
  }
`;

const uni = {
  uCut: { value: -2 }, uTrail: { value: 0 }, uKey: { value: 1 }, uRim: { value: 1 }, uVis: { value: 0 },
  uIg: { value: new THREE.Vector3() }, uRun: { value: new THREE.Vector3() }, uGlass: { value: 1 }, uFull: { value: 0 },
  uCam: { value: new THREE.Vector3() }, uRot: { value: new THREE.Matrix3() }
};

const bodyMat = new THREE.ShaderMaterial({
  uniforms: uni, side: THREE.DoubleSide, transparent: true, depthWrite: true, depthTest: true,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
  vertexShader: /* glsl */`
    varying vec3 vP, vN;
    void main() { vP = position; vN = normal; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec3 vP, vN;
    uniform float uCut, uTrail, uKey, uRim, uVis, uGlass, uFull;
    uniform vec3 uIg, uRun;
    uniform vec3 uCam; uniform mat3 uRot;
    const float H = .21;
    const vec3 GREEN = vec3(.0, 1., .11), CYAN = vec3(.0, .50, 1.);   // what comes out as #00ff88 and #00cfff after finish()
    ${COMMON}

    float band(vec2 p, vec2 c, vec2 h, float s) { vec2 d = abs(p - c) - h; return smoothstep(s, -s, d.x) * smoothstep(s, -s, d.y); }

    // the one light: a tall soft box leaning a little, seen in the glass, plus the dark it stands in
    vec3 env(vec3 R, float faceW) {
      vec3 c = vec3(.006, .010, .016) * (1.2 + R.y);
      if (R.z > .02) {
        vec2 p = R.xy / R.z;
        p = mat2(.961, -.276, .276, .961) * p;
        // on the flat of the face it is a breath of soft light; on the curve of the bevel, a bright clean line
        // one hard edge and a long soft tail, as a real light in black glass has
        float sweep = smoothstep(-.012, .012, p.x) * exp(-max(p.x, 0.) / .10);
        float tight = band(p, vec2(0., .2), vec2(.13, 2.2), .05);
        c += vec3(.90, .97, 1.) * uKey * mix(10. * tight, .72 * sweep, faceW);
      }
      c += vec3(.86, .95, 1.) * uRim * 3.4 * smoothstep(.62, .92, R.y);                  // its light along the top edge
      c += vec3(.55, .80, 1.) * uRim * .50 * smoothstep(.82, 1., abs(R.x));              // and just enough on the sides to draw them
      c += vec3(.00, .30, .42) * uRim * .10 * smoothstep(.70, 1., -R.y);
      return c;
    }

    // the mark: two chevrons inside the glass, at different depths
    // the mark is the film's own two figures, in the object for good: a line that climbs, and at its end the point
    const float TH = .054, RD = .098;
    const vec2 M0 = vec2(-.56, -.33), M1 = vec2(-.17, -.02), M2 = vec2(.07, -.19), M3 = vec2(.47, .27);
    float seg(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0., 1.)); }
    float lineD(vec2 p) { return min(seg(p, M0, M1), min(seg(p, M1, M2), seg(p, M2, M3))) - TH; }
    float dotD(vec2 p) { return length(p - M3) - RD; }
    float shape(vec2 p, float kind) { return kind < .5 ? lineD(p) : dotD(p); }
    float fold(float x, float e) { float a = abs(x); return a > e ? sign(x) * (2. * e - a) : x; }
    vec2 hit(vec3 p, vec3 rd, float z, out float ok) {
      float dz = z - p.z;
      ok = (abs(rd.z) > .04 && rd.z * dz > 0.) ? 1. : 0.;
      vec3 q = p + rd * (dz / (abs(rd.z) > .04 ? rd.z : -.04));
      return vec2(fold(q.x, .985), fold(q.y, .985));
    }
    // solid inside the glass, not drawn on it: march the ray through its depth
    // x: how much of it the ray crosses, weighted to the front; y: the bright heart of the front face; z: distance, for its light
    vec3 solid(vec3 p, vec3 rd, float zF, float zB, float kind, float half_) {
      float okF; vec2 qF = hit(p, rd, zF, okF);
      float dF = shape(qF, kind), aa = fwidth(dF) + .0015;
      float sum = 0., tot = 0.;
      for (int i = 0; i < 6; i++) {
        float u = (float(i) + .5) / 6., w = mix(1., .22, u), ok;
        vec2 q = hit(p, rd, mix(zF, zB, u), ok);
        sum += w * ok * smoothstep(aa, -aa, shape(q, kind));
        tot += w;
      }
      float front = smoothstep(aa, -aa, dF) * okF;
      float heart = smoothstep(-half_ * .15, -half_, dF) * okF;
      return vec3(max(sum / tot * .55, front), heart, okF > .5 ? max(dF, 0.) : 9.);
    }

    void main() {
      if (vP.y > uCut) discard;
      if (!gl_FrontFacing) {
        if (uFull > .5) discard;
        // the fresh cut, looked into from above: flat, hot, the light itself
        // the fresh cut, looked into from above: the line runs down its middle and the glass is lit from there
        vec3 dc = vP - uCam;
        vec3 cp = uCam + dc * ((uCut - uCam.y) / dc.y);
        float zc = abs(cp.z);
        vec3 cc = vec3(.0, 1., .22) * (.05 + .22 * exp(-zc / .07)) + vec3(.5, 1., .62) * 1.6 * exp(-zc / .010);
        gl_FragColor = vec4(finish(cc), 1.);
        return;
      }
      vec3 n0 = normalize(vN);
      vec3 n = normalize(n0 + vec3(vP.xy * .13 * max(n0.z, 0.), 0.));
      vec3 v = normalize(uCam - vP);
      float nv = max(dot(n, v), 0.);
      float F = .05 + .95 * pow(1. - nv, 5.);
      vec3 R = uRot * reflect(-v, n);
      vec3 col = env(R, smoothstep(.985, .9995, n0.z)) * F;

      // into the glass
      vec3 rd = refract(-v, n, 1. / 1.5);
      float okC;
      vec2 qC = hit(vP, rd, -H + .01, okC);
      // the line sits deep, the point nearer: turning the object shows how thick the glass is
      vec3 ln = solid(vP, rd, .03, -.09, 0., TH);
      vec3 pt = solid(vP, rd, .12, -.06, 1., RD);
      float okL; vec2 qL = hit(vP, rd, .03, okL);

      float dy = max(uCut - vP.y, 0.);
      float hot = uTrail * exp(-dy * 5.2);

      // the mark unlit is only a darker shape in the dark; lit, it is the only source in the glass
      vec3 inner = vec3(0.);
      // current climbs the line from its foot, cyan going green, and arrives at the point
      float run = 1. - smoothstep(uRun.x - .06, uRun.x, qL.x);
      vec3 lineCol = mix(CYAN, GREEN, smoothstep(-.42, .28, qL.x));
      float litL = run * uIg.x, litP = uIg.y;
      inner += mix(lineCol, lineCol + vec3(.06, .04, .06), ln.y * .6) * ln.x * (1. - pt.x * min(litP, 1.)) * (litL * (2.0 + ln.y * .9) + .003 + hot * .10);
      inner += mix(GREEN, vec3(.32, 1., .42), pt.y * .85) * pt.x * (litP * (2.2 + pt.y * 2.2) + .003 + hot * .11);
      inner += lineCol * litL * .060 * exp(-ln.z * 22.) * (1. - ln.x) * (1. - pt.x * min(litP, 1.));
      inner += GREEN * litP * (.11 * exp(-pt.z * 15.) + .012 * exp(-pt.z * 3.2)) * (1. - pt.x);
      // what falls on the back of the slab, seen further in, so the depth reads: a pool, not a drawing
      vec2 a0 = qC - M3;
      inner += okC * GREEN * litP * .012 * exp(-dot(a0, a0) * 3.5);
      // base of the glass: black with the page's blue in it
      vec3 base = vec3(.0005, .0009, .0017) * (1. + .8 * smoothstep(-.2, 1., vP.y));
      vec3 body = base + inner;

      // what a lit core does to an edge of real glass: a thin line of its colour where the bevel gathers it
      float edge = pow(clamp(1. - n0.z, 0., 1.), 1.6);
      float near = exp(-length(vP.xy) * 1.1);
      body += GREEN * uIg.y * edge * near * .11;

      // the line passing: the surface just made is still hot, and cools as it rises away
      float tight = uTrail * exp(-dy * 20.);
      body += vec3(.04, 1., .26) * (tight * .030 + hot * edge * .55);

      vec3 c = col + body * (1. - F);
      float a = mix(uGlass, 1., clamp(F * 2.2 + edge * .6, 0., 1.));
      a = max(a, clamp(max(max(c.r, c.g), c.b), 0., 1.));
      gl_FragColor = vec4(finish(c) * uVis, a * uVis);
    }`
});
bodyMat.extensions = { derivatives: true };
const body = new THREE.Mesh(slabGeometry(), bodyMat);
body.renderOrder = 1;
scene.add(body);

/* ---- additive light: rgb with zero alpha, so it adds to whatever sky is behind */
const ADD = { transparent: true, depthWrite: false, depthTest: false, blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
  blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor };

/* The light: one formula, the distance to a segment of half-length uL. At uL = 0 it is a point; open it and it is a line. */
const lightUni = { uL: { value: 0 }, uI: { value: 0 }, uW: { value: 1 }, uS: { value: new THREE.Vector2(1, 1) } };
const light = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  ...ADD, uniforms: lightUni,
  vertexShader: /* glsl */`
    uniform vec2 uS; varying vec2 vL;
    void main() { vL = position.xy * uS; gl_Position = projectionMatrix * modelViewMatrix * vec4(vL, 0., 1.); }`,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vL; uniform float uL, uI, uW; uniform vec2 uS;
    ${COMMON}
    void main() {
      float x = abs(vL.x), y = vL.y;
      float r = length(vec2(max(x - uL, 0.), y));
      float along = uL > .001 ? 1. - .55 * pow(min(x / uL, 1.), 2.) : 1.;
      float open = smoothstep(0., .4, uL);
      float core = exp(-pow(r / mix(.018, .0085, open), 2.)) * 3.4 * along;
      float near = exp(-r / mix(.05, .026, open)) * .30 * along;
      float far  = exp(-r / .11) * .012 * along;
      float streak = exp(-pow(y / .0065, 2.)) * exp(-max(x - uL, 0.) / .20) * .5;   // what the point already wants to become
      vec3 c = vec3(.72, 1., .80) * core + vec3(.0, 1., .22) * (near + far) + vec3(.10, 1., .34) * streak;
      vec2 e = smoothstep(vec2(1.), vec2(.72), abs(vL) / uS);
      c *= uI * e.x * e.y;
      gl_FragColor = vec4(finish(c), 0.);
    }`
}));
light.renderOrder = 3;
scene.add(light);

/* The payoff's one glow, behind the object only, wide and faint */
const haloUni = { uI: { value: 0 } };
const halo = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), new THREE.ShaderMaterial({
  ...ADD, uniforms: haloUni,
  vertexShader: /* glsl */`
    varying vec2 vL;
    void main() { vL = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vL; uniform float uI;
    ${COMMON}
    void main() {
      // written in display values, not light: it is meant to be seen as a colour, faintly, close to the object and nowhere else
      float r = length(vL);
      float f = smoothstep(2.3, .7, r);
      vec3 c = vec3(0., 1., .53) * .085 * f * f * uI;
      gl_FragColor = vec4(c + (ign(gl_FragCoord.xy) - .5) / 255., 0.);
    }`
}));
halo.position.z = -.6;
halo.renderOrder = 0;
scene.add(halo);

/* ---- the clock: everything below is a function of t and of nothing else */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const io = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const lerp = (a, b, u) => a + (b - a) * u;
const wrap = (x) => ((x % T) + T) % T;
/* a window on the loop: fades up over f from a, down over g to b; a may be before 0 */
const win = (t, a, b, f = .45, g = f) => { const u = wrap(t - a), L = wrap(b - a); return u > L ? 0 : ss(0, f, u) * (1 - ss(L - g, L, u)); };

const TOP = 1, BOT = -1, SPARK_Y = 1.18, LINE = 1.72;
const w1 = document.getElementById('w1'), w2 = document.getElementById('w2'), w3 = document.getElementById('w3');
const words = (el, o) => { el.style.opacity = o.toFixed(3); el.style.transform = `translate3d(0,${((1 - o) * .13).toFixed(3)}em,0)`; };

function pose(t) {
  t = wrap(t);
  const TAU = Math.PI * 2;

  // object: turns slowly and stays square-on as the reflection crosses it at 8.6 s
  const phase = TAU * (t - 8.6) / T;
  const yaw = .23 * Math.sin(phase);
  body.rotation.y = yaw;

  // camera: above and slowly closing in towards the payoff, and back
  const dist = 7.55 - .30 * Math.cos(phase);
  const lift = .46 + .10 * Math.cos(phase);
  camera.position.set(0, lift - .17, dist);
  camera.lookAt(0, -.17, 0);

  // point -> falls -> opens into the line -> rises -> closes into the top
  const fall = io(1.5, 2.65, t);
  const open = io(2.6, 3.05, t) * (1 - io(6.2, 6.82, t));
  const rise = io(2.85, 6.45, t);
  const y = t < 2.85 ? lerp(SPARK_Y, BOT, fall) : lerp(BOT, TOP, rise);
  const L = open * LINE;
  const breathe = 1 + .1 * Math.sin(TAU * 3 * t / T);
  const lightOn = t < 7 ? 1 - ss(6.78, 7.02, t) : ss(11.2, 11.95, t);
  light.position.y = t > 8 ? SPARK_Y : y;
  light.position.z = .0;
  lightUni.uL.value = L;
  lightUni.uI.value = lightOn * breathe;
  lightUni.uS.value.set(L + 1.05, .42);
  light.visible = lightOn > .002;
  light.rotation.y = yaw * open;    // the line lies in the object, so it runs down the middle of the cut; the point lies level

  // what the line has already made
  const built = t >= 2.85;
  const cut = built ? (t < 6.45 ? lerp(BOT - .02, TOP + .02, rise) : 2) : -2;
  uni.uCut.value = cut;
  const done = t >= 6.45;
  uni.uFull.value = done ? 1 : 0;
  uni.uTrail.value = built ? (1 - ss(6.35, 7.05, t)) * ss(2.85, 3.2, t) : 0;

  const down = 1 - ss(10.1, 10.75, t);
  // the payoff: the big line closes; a small one climbs inside the glass and arrives at the point, which comes on
  const pop = (a) => { const u = t - a; return u < 0 ? 0 : (1 - Math.exp(-u * 6)) * (1 + .7 * Math.exp(-u * 2.4)); };
  uni.uIg.value.set(ss(6.95, 7.1, t) * down, pop(7.68) * down, 0);
  uni.uRun.value.set(lerp(-.66, .55, io(6.98, 7.74, t)), 0, 0);
  uni.uKey.value = (t < 7 ? .7 : .7 + .3 * ss(7, 7.8, t)) * (1 - ss(10.55, 11.05, t));
  uni.uRim.value = (.75 + .25 * ss(7, 7.8, t)) * (1 - ss(10.45, 11.05, t));
  uni.uVis.value = built ? 1 - ss(10.6, 11.1, t) : 0;
  uni.uGlass.value = lerp(1, .9, ss(6.45, 7.6, t));
  body.visible = built && t < 11.11;

  haloUni.uI.value = ss(7.5, 8, t) * (1 + .55 * Math.exp(-Math.max(t - 8, 0) * 1.5)) * (1 - ss(10.0, 10.7, t));
  halo.visible = haloUni.uI.value > .002;
  halo.quaternion.copy(camera.quaternion);

  // the camera for the object's shader, in the object's space
  camera.updateMatrixWorld();
  body.updateMatrixWorld();
  const inv = body.matrixWorld.clone().invert();
  uni.uCam.value.copy(camera.position).applyMatrix4(inv);
  uni.uRot.value.setFromMatrix4(body.matrixWorld);

  // the words
  words(w1, win(t, 11.55, 2.55, .5, .35));
  words(w2, win(t, 2.75, 6.8, .4, .35));
  words(w3, win(t, 7.2, 10.6, .4, .55));
}

function fit() {
  const w = +(Q.get('w') || innerWidth), h = +(Q.get('h') || innerHeight);
  renderer.setPixelRatio(Math.min(+(Q.get('dpr') || devicePixelRatio || 1), 1.5));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // the object keeps its share of the height; on a tall narrow frame the width governs instead
  camera.fov = w / h >= 1.2 ? 24 : 2 * Math.atan(Math.tan(12 * Math.PI / 180) * 1.2 / (w / h)) * 180 / Math.PI;
  camera.updateProjectionMatrix();
}
function draw(t) { pose(t); renderer.render(scene, camera); }

await Promise.race([
  Promise.all([document.fonts.load('400 58px "Archivo Black"'), document.fonts.ready]),
  new Promise((r) => setTimeout(r, 3000))
]);

let live = true, raf = 0, t0 = performance.now();
function frame(now) { if (!live) return; draw((now - t0) / 1000); raf = requestAnimationFrame(frame); }
fit();
addEventListener('resize', () => { fit(); if (!live) draw(last); });
let last = 0;
window.QUEST_SCENE = {
  T,
  seek(t) { live = false; cancelAnimationFrame(raf); last = t; draw(t); }
};
raf = requestAnimationFrame(frame);
</script>
</body>
</html>
