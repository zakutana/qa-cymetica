<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build it Better: five studios</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* one entry live at a time (five WebGL scenes at once would judge his laptop, not the work), on the page's own sky */
  :root { --green: #00ff88; --cyan: #00cfff; --text: #e8f1ff; --mute: #7f93ad; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; color: var(--text); background: #05070c; }
  #sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: url(../pics/space.webp) 50% 50% / cover no-repeat, #05070c; }
  main { position: relative; z-index: 1; width: min(1800px, 100%); margin: 0 auto; padding: 18px 16px 40px; }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  nav button { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border: 0; border-radius: 12px; cursor: pointer; color: var(--mute); background: rgba(10, 14, 23, .78);
    box-shadow: inset 0 0 0 1px rgba(127, 147, 173, .35); font: 800 14px 'JetBrains Mono', monospace; letter-spacing: .04em; transition: color .2s, box-shadow .2s; }
  nav button b { font: 400 20px/1 'Archivo Black', sans-serif; }
  nav button:hover { color: var(--text); }
  nav button.on { color: var(--green); box-shadow: inset 0 0 0 1.5px var(--green); }
  nav button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .frame { display: block; width: 100%; border: 0; background: transparent; }
  #scene { width: min(1100px, 100%); aspect-ratio: 1100 / 620; margin: 14px auto 0; }
  #buttons { height: 520px; margin-top: 14px; border-radius: 14px; }
</style>
</head>
<body>
<div id="sky"></div>
<main>
  <nav id="tabs" aria-label="Studios"></nav>
  <iframe id="scene" class="frame" title="The animation" allowtransparency="true"></iframe>
  <iframe id="buttons" class="frame" title="The buttons"></iframe>
</main>
<script>
  const STUDIOS = [['a', 'One light'], ['b', 'Line to solid'], ['c', 'Machine'], ['d', 'Glass'], ['e', 'Wild card']];
  const tabs = document.getElementById('tabs'), scene = document.getElementById('scene'), buttons = document.getElementById('buttons');
  const show = (id) => {
    [...tabs.children].forEach((b) => { const on = b.dataset.id === id; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    scene.src = id + '/scene.html';
    buttons.src = id + '/buttons.html';
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  };
  // the buttons' page as tall as it is, so nothing scrolls inside a frame
  buttons.addEventListener('load', () => { try { buttons.style.height = buttons.contentDocument.documentElement.scrollHeight + 'px'; } catch (e) {} });
  STUDIOS.forEach(([id, name]) => {
    const b = document.createElement('button');
    b.dataset.id = id; b.innerHTML = '<b>' + id.toUpperCase() + '</b>' + name; b.onclick = () => show(id);
    tabs.append(b);
  });
  addEventListener('keydown', (e) => { const k = '12345'.indexOf(e.key); if (k >= 0) show(STUDIOS[k][0]); });
  show(STUDIOS.some(([id]) => id === location.hash.slice(1)) ? location.hash.slice(1) : 'a');
</script>
</body>
</html>
