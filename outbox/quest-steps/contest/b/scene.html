<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build it Better: the drawing becomes the thing</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  html.black, html.black body { background: #000000; }
  canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; }
</style>
<script>if (/[?&]black=1/.test(location.search)) document.documentElement.classList.add('black');</script>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
} }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* The idea is typed. Its line leaves the caret, runs across and plots the product as a blueprint: one pen, one colour.
   Then a single level rises from the ground: under it everything is real, the name included; above it, still the drawing.
   The product's screen comes on. Hold. Everything goes; the page's sky was always behind it.
   Every frame is a function of t. Nothing accumulates. */

const T = 12;
const Q = new URLSearchParams(location.search);
const BLACK = Q.get('black') === '1';
const DW = 1100, DH = 620;                                  // the design's frame, in css px at full size

// ---- the score, in seconds
const S = {
  typeA: 0.3, typeB: 1.35,      // the idea typed
  goA: 1.7, goB: 2.05,          // the line leaves the caret
  consA: 2.05, consB: 2.75,     // construction lines
  edgeA: 2.75, edgeB: 5.05,     // the object
  dimA: 5.05, dimB: 5.4,        // dimensions
  riseA: 5.75, riseB: 7.85,     // the level rises: line becomes real
  onA: 8.05, onB: 8.85,         // its screen comes on
  outA: 11.15, outB: 11.85      // everything goes
};

const clamp01 = (x) => Math.min(1, Math.max(0, x));
const win = (t, a, b) => clamp01((t - a) / (b - a));
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => { x = clamp01(x); return 1 - Math.pow(1 - x, 3); };
const TAU = Math.PI * 2;

// ---- fit: the canvas keeps the design's proportions, whatever the frame
const availW = +(Q.get('w') || innerWidth), availH = +(Q.get('h') || innerHeight);
const fit = Math.min(availW / DW, availH / DH);
const CW = Math.round(DW * fit), CH = Math.round(DH * fit);
const DPR = Math.min(window.devicePixelRatio || 1, +(Q.get('dpr') || 1.5));

await new Promise((r) => {
  const l = document.querySelector('link[href*="fonts.googleapis"]');
  if (l.sheet) r(); else { l.onload = l.onerror = r; setTimeout(r, 4000); }
});
await Promise.race([
  Promise.all([
    document.fonts.load('400 112px "Archivo Black"'),
    document.fonts.load('500 26px "JetBrains Mono"'),
    document.fonts.load('700 20px "JetBrains Mono"')
  ]),
  new Promise((r) => setTimeout(r, 4000))
]);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: !BLACK, premultipliedAlpha: true, preserveDrawingBuffer: true, powerPreference: 'default', stencil: false });
renderer.setPixelRatio(DPR);
renderer.setSize(CW, CH);
renderer.setClearColor(0x000000, BLACK ? 1 : 0);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.localClippingEnabled = true;
renderer.autoClear = false;
renderer.info.autoReset = false;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// ---- the lens: very long, and shifted, so verticals stay vertical and parallels stay parallel, as a product drawing has them
const PX = 124;                                                               // design px per world unit at the object's axis
const FOV = 10, DIST = DH / (2 * PX * Math.tan(THREE.MathUtils.degToRad(FOV / 2))), ELEV = 15.5;
const CAM_Y = DIST * Math.tan(THREE.MathUtils.degToRad(ELEV));
const OX = 812, OY = 312;                                                     // where the object's centre stands in the frame
const camera = new THREE.PerspectiveCamera(FOV, DW / DH, 12, 60);
camera.setViewOffset(DW, DH, DW / 2 - OX, CAM_Y * PX + DH / 2 - OY, DW, DH);
const ENV_SPIN = 1;
const azimuth = (t) => THREE.MathUtils.degToRad(33 - 14 * (t / T));           // turns slowly towards the viewer, the whole loop
function placeCamera(t) {
  const a = azimuth(t);
  camera.position.set(Math.sin(a) * DIST, CAM_Y, Math.cos(a) * DIST);
  camera.lookAt(0, CAM_Y, 0);
  camera.updateMatrixWorld();
  scene.environmentRotation.y = a * ENV_SPIN;  // the studio travels with the camera: a turntable under fixed lights
  QUIET.forEach(([m]) => { m.envMapRotation.y = a * ENV_SPIN; });
}
const P = new THREE.Vector3();
const toPx = (x, y, z) => { P.set(x, y, z).project(camera); return [(P.x + 1) / 2 * DW, (1 - P.y) / 2 * DH]; };
const worldYtoPx = (y) => OY - y * PX;
const pxToWorldY = (py) => (OY - py) / PX;

// ---- a studio, no more: real softboxes, brighter than white, so a satin surface and a bevel can catch them. It travels with
// the camera: a turntable under fixed lights, and the one soft panel in front slides across the face as the thing turns
{
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(20, 24, 12), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.1, 0.125, 0.15), side: THREE.BackSide })));
  const panel = (az, el, w, h, v, tilt = 0, tint = [1, 1, 1]) => {
    const A = THREE.MathUtils.degToRad(az), E = THREE.MathUtils.degToRad(el), dist = 10;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(2 * dist * Math.tan(THREE.MathUtils.degToRad(w / 2)), 2 * dist * Math.tan(THREE.MathUtils.degToRad(h / 2))),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(tint[0] * v, tint[1] * v, tint[2] * v), side: THREE.DoubleSide }));
    m.position.set(Math.sin(A) * Math.cos(E) * dist, Math.sin(E) * dist, Math.cos(A) * Math.cos(E) * dist);
    m.lookAt(0, 0, 0); m.rotateZ(THREE.MathUtils.degToRad(tilt));
    env.add(m);
  };
  panel(-30, -14, 30, 70, 4.2, 24);              // the soft panel the face looks into
  panel(-92, -10, 40, 60, 2.0);                  // its dimmer neighbour, so the face is never dead
  panel(0, 62, 80, 34, 7);                       // overhead: every upward bevel
  panel(180, 18, 90, 26, 3);                     // behind: the top face at a grazing angle
  panel(130, -4, 44, 70, 1.4, 0, [0.82, 0.93, 1]); // the side wall, kept darker than the face
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.02).texture;
  scene.environmentIntensity = 1;
  pm.dispose();
}
const key = new THREE.DirectionalLight(0xffffff, 1.25);
key.position.set(-5, 10, 11);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -3; key.shadow.camera.right = 3; key.shadow.camera.top = 3.5; key.shadow.camera.bottom = -3.5;
key.shadow.camera.near = 4; key.shadow.camera.far = 26;
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.01; key.shadow.radius = 4;
scene.add(key);

// ---- the product: a pocket chart reader. A lens that reads, a screen that says, one green button
const W = 2.6, H = 3.5, D = 0.74, R = 0.3, B = 0.06;
const ZF = D / 2;                                 // its face
const SEAM = -0.12;

// the level: everything of the solid under it, everything of the drawing above it
const planeSolid = new THREE.Plane(new THREE.Vector3(0, -1, 0), -100);
const planeLine = new THREE.Plane(new THREE.Vector3(0, 1, 0), 100);

const M = {
  body: new THREE.MeshPhysicalMaterial({ color: 0xe2e8ed, roughness: 0.5, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.3, vertexColors: true }),
  barrel: new THREE.MeshStandardMaterial({ color: 0x8e9ca8, roughness: 0.26, metalness: 1, emissive: 0x18242c }),
  barrelIn: new THREE.MeshStandardMaterial({ color: 0x20303a, roughness: 0.5, metalness: 0.6, emissive: 0x16242c }),
  glass: new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.2, metalness: 0, emissive: 0xffffff, envMapIntensity: 0.07 }),
  screen: new THREE.MeshStandardMaterial({ color: 0x06121a, roughness: 0.2, metalness: 0, emissive: 0x0a2230, envMapIntensity: 0.11 }),
  button: new THREE.MeshStandardMaterial({ color: 0x00c86a, roughness: 0.44, metalness: 0, emissive: 0x00ad5c, envMapIntensity: 0.5 }),
  knob: new THREE.MeshStandardMaterial({ color: 0xc8d4dc, roughness: 0.24, metalness: 1, emissive: 0x1c2830 }),
  hole: new THREE.MeshBasicMaterial({ color: 0x1b2a33 }),
  ringG: new THREE.MeshBasicMaterial({ color: 0x00ff88, toneMapped: false })
};
Object.values(M).forEach((m) => { m.clippingPlanes = [planeSolid]; });
const QUIET = [[M.glass, 0.12], [M.screen, 0.22], [M.button, 0.4]];
QUIET.forEach(([m, k]) => { m.envMap = scene.environment; m.envMapIntensity = k; });

// a rounded rectangle's outline, with its outward normals
function outline(w, h, r, n = 14) {
  r = Math.max(r, 0.0005);
  const pts = [], cx = w / 2 - r, cy = h / 2 - r;
  [[cx, cy, 0], [-cx, cy, 1], [-cx, -cy, 2], [cx, -cy, 3]].forEach(([x, y, q]) => {
    for (let i = 0; i <= n; i++) {
      const a = (q + i / n) * Math.PI / 2;
      pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r, Math.cos(a), Math.sin(a)]);
    }
  });
  return pts;
}
// a closed solid lofted through rings of the rounded rectangle along z; each ring { inset, z, nxy, nz, shade }
function loft(w, h, r, rings, n = 14) {
  const pos = [], nor = [], col = [], idx = [];
  const m = outline(w, h, r, n).length;
  const put = (x, y, z, nx, ny, nz, s) => { pos.push(x, y, z); nor.push(nx, ny, nz); col.push(s, s, s); return pos.length / 3 - 1; };
  rings.forEach((g) => {
    const s = g.shade === undefined ? 1 : g.shade;
    outline(w - 2 * g.inset, h - 2 * g.inset, r - g.inset, n).forEach(([x, y, nx, ny]) => put(x, y, g.z, nx * g.nxy, ny * g.nxy, g.nz, s));
  });
  for (let k = 0; k < rings.length - 1; k++) for (let i = 0; i < m; i++) {
    const a = k * m + i, b = k * m + (i + 1) % m, c = (k + 1) * m + i, d = (k + 1) * m + (i + 1) % m;
    idx.push(a, c, b, b, c, d);
  }
  // the two flat ends, as fans, so a section through it is closed
  [[0, 1], [rings.length - 1, -1]].forEach(([ri, sign]) => {
    const g = rings[ri], c0 = put(0, 0, g.z, 0, 0, sign, 1), start = pos.length / 3;
    outline(w - 2 * g.inset, h - 2 * g.inset, r - g.inset, n).forEach(([x, y]) => put(x, y, g.z, 0, 0, sign, 1));
    for (let i = 0; i < m; i++) { const a = start + i, b = start + (i + 1) % m; if (sign > 0) idx.push(c0, a, b); else idx.push(c0, b, a); }
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  return geo;
}
function arcRings(zStart, bev, dir, k = 5) {           // from the flat end round to the wall (dir -1: from the front face going back)
  const out = [];
  for (let i = 0; i <= k; i++) {
    const a = i / k * Math.PI / 2;
    out.push({ inset: bev * (1 - Math.sin(a)), z: zStart + dir * bev * (1 - Math.cos(a)), nxy: Math.sin(a), nz: -dir * Math.cos(a) });
  }
  return out;
}
const lathe = (profile, seg = 96) => {
  const g = new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), seg);
  g.rotateX(Math.PI / 2);          // its axis along +z, base at z = 0
  return g;
};

const solid = new THREE.Group(); scene.add(solid);
const closed = [];                 // everything with a real inside, for the section and for the drawing's hidden lines
function add(geo, mat, x = 0, y = 0, z = 0) {
  const me = new THREE.Mesh(geo, mat); me.position.set(x, y, z); me.castShadow = true; me.receiveShadow = true; solid.add(me);
  const c = geo.clone(); c.translate(x, y, z); c.deleteAttribute('uv'); c.deleteAttribute('color');
  closed.push(c.index ? c.toNonIndexed() : c);
  return me;
}

// the body, its fillet, and a shadow gap where the two shells meet
const bodyGeo = loft(W, H, R, [
  ...arcRings(ZF, B, -1),
  { inset: 0, z: SEAM + 0.04, nxy: 1, nz: 0 },
  { inset: 0.0, z: SEAM + 0.016, nxy: 0.7, nz: -0.7 },
  { inset: 0.02, z: SEAM + 0.014, nxy: 1, nz: 0, shade: 0.12 },
  { inset: 0.02, z: SEAM - 0.014, nxy: 1, nz: 0, shade: 0.12 },
  { inset: 0.0, z: SEAM - 0.016, nxy: 0.7, nz: 0.7 },
  { inset: 0, z: SEAM - 0.04, nxy: 1, nz: 0 },
  ...arcRings(-ZF, B, 1).reverse()
]);
{ // a face very slightly crowned, in its normals only: a long lens otherwise sees one flat tone on it
  const p = bodyGeo.attributes.position, n = bodyGeo.attributes.normal, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) if (p.getZ(i) > ZF - 1e-4) {
    v.set(p.getX(i) * 0.13, p.getY(i) * 0.13, 1).normalize(); n.setXYZ(i, v.x, v.y, v.z);
  }
  // and the falloff of one big light across it, top left to bottom right, baked in the vertex colours
  const c = bodyGeo.attributes.color;
  for (let i = 0; i < p.count; i++) {
    const f = THREE.MathUtils.clamp(0.56 + (-p.getX(i) * 0.15 + p.getY(i) * 0.25), 0, 1);
    const s = 0.6 + 0.4 * f;
    c.setXYZ(i, c.getX(i) * s, c.getY(i) * s, c.getZ(i) * s * (1.0 + 0.03 * (1 - f)));
  }
}
add(bodyGeo, M.body);

// the screen: one sheet of glass, proud of the face by a hair, its corners concentric with the body's
const MARGIN = 0.14;
const SW = W - 2 * MARGIN, SH = 2.14, SX = 0, SY = H / 2 - MARGIN - SH / 2, SR = R - MARGIN;
{
  const g = loft(SW, SH, SR, [...arcRings(0.018, 0.008, -1, 3), { inset: 0, z: -0.02, nxy: 1, nz: 0 }, { inset: 0.002, z: -0.03, nxy: 1, nz: 0 }], 10);
  const gp = g.attributes.position, gn = g.attributes.normal, v = new THREE.Vector3();
  for (let i = 0; i < gp.count; i++) if (gp.getZ(i) > 0.0179) {       // the glass curves a little too: its reflection is a soft diagonal, not one flat tone
    v.set(gp.getX(i) * 0.2, gp.getY(i) * 0.2, 1).normalize(); gn.setXYZ(i, v.x, v.y, v.z);
  }
  add(g, M.screen, SX, SY, ZF);
}

// the band under it: lens, perforation, button, on one line
const BAND_Y = (SY - SH / 2 - H / 2) / 2;
const LX = -0.74, LY = BAND_Y, LR = 0.42;
add(lathe([[0, 0], [LR, 0], [LR, 0.075], [LR - 0.008, 0.086], [LR - 0.02, 0.09], [LR - 0.055, 0.09], [LR - 0.062, 0.085], [LR - 0.062, 0.03], [0, 0.03]]), M.barrel, LX, LY, ZF);
const LENS = (() => {                 // the glass, its coating painted, so a look into it has depth
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d'), m = 256;
  const g = x.createRadialGradient(m, m, 0, m, m, m);
  g.addColorStop(0, '#071c28'); g.addColorStop(0.3, '#082838'); g.addColorStop(0.62, '#0a2f42'); g.addColorStop(0.86, '#0c3a50'); g.addColorStop(1, '#0a1d28');
  x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  const ring = (r, w, col) => { x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.arc(m, m, r, 0, TAU); x.stroke(); };
  ring(250, 8, '#16323f'); ring(196, 3, 'rgba(0,207,255,.28)'); ring(128, 3, 'rgba(0,207,255,.3)'); ring(72, 10, '#06161f');
  x.fillStyle = '#071c28'; x.beginPath(); x.arc(m, m, 66, 0, TAU); x.fill();
  // the coating's two reflections
  x.globalCompositeOperation = 'lighter'; x.filter = 'blur(14px)';
  x.strokeStyle = 'rgba(0,207,255,.6)'; x.lineWidth = 24; x.beginPath(); x.arc(m, m, 165, Math.PI * 1.08, Math.PI * 1.46); x.stroke();
  x.strokeStyle = 'rgba(0,255,136,.34)'; x.lineWidth = 18; x.beginPath(); x.arc(m, m, 120, Math.PI * 0.16, Math.PI * 0.4); x.stroke();
  x.filter = 'blur(3px)'; x.fillStyle = 'rgba(255,255,255,.9)'; x.beginPath(); x.ellipse(m - 66, m - 92, 20, 10, -0.6, 0, TAU); x.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
})();
M.glass.emissiveMap = LENS;
{
  const q = LR - 0.058, rs = 0.86, cap = Math.asin(q / rs);
  const dome = new THREE.SphereGeometry(rs, 48, 10, 0, TAU, 0, cap);
  dome.rotateX(Math.PI / 2);
  dome.translate(0, 0, 0.03 - rs * Math.cos(cap));
  const p = dome.attributes.position, uv = dome.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / (2 * q) + 0.5, p.getY(i) / (2 * q) + 0.5);
  const base = new THREE.CircleGeometry(q, 48); base.rotateX(Math.PI); base.translate(0, 0, 0.03);
  add(mergeGeometries([dome.toNonIndexed(), base.toNonIndexed()]), M.glass, LX, LY, ZF);
  const ring = new THREE.Mesh(new THREE.RingGeometry(LR - 0.042, LR - 0.03, 96), M.ringG);
  ring.position.set(LX, LY, ZF + 0.0905); solid.add(ring);
}
// the one colour on the body
const BTX = 0.86, BTY = BAND_Y, BTR = 0.21;
add(lathe([[0, 0], [BTR, 0], [BTR, 0.05], [BTR - 0.008, 0.06], [BTR - 0.024, 0.064], [BTR * 0.5, 0.056], [0, 0.052]], 64), M.button, BTX, BTY, ZF);
// the speaker: a grid of holes
const HOLES = [];
{
  const cols = 7, rows = 5, step = 0.1, cx = 0.05;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) HOLES.push([cx + (i - (cols - 1) / 2) * step, BAND_Y + (j - (rows - 1) / 2) * step]);
  const inst = new THREE.InstancedMesh(new THREE.CircleGeometry(0.026, 12), M.hole, HOLES.length);
  const m = new THREE.Matrix4();
  HOLES.forEach(([x, y], i) => inst.setMatrixAt(i, m.makeTranslation(x, y, ZF + 0.0015)));
  solid.add(inst);
}
// a knurled wheel on its top edge
const KX = 0.8, KY = H / 2, KR = 0.21, KH = 0.15;
{
  const g = new THREE.LatheGeometry([[0, 0], [KR, 0], [KR, KH * 0.33], [KR, KH * 0.66], [KR, KH], [KR - 0.012, KH + 0.012], [0, KH + 0.012]].map(([r, y]) => new THREE.Vector2(r, y)), 192);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), r = Math.hypot(x, z);
    if (r > KR - 0.001 && y > 0.008 && y < KH - 0.001) {
      const a = Math.atan2(z, x), s = 1 - 0.03 * (0.5 + 0.5 * Math.cos(a * 40));
      pos.setXYZ(i, x * s, y, z * s);
    }
  }
  g.computeVertexNormals();
  add(g, M.knob, KX, KY - 0.002, -0.02);
}

// ---- what its screen says, painted once. Revealed left to right, nothing redrawn
const screenPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), -100);
const content = (() => {
  const w = 1200, h = Math.round(1200 * SH / SW), c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = '#000000'; x.fillRect(0, 0, w, h);
  const top = 300, bot = h - 70;
  x.strokeStyle = 'rgba(0,207,255,.14)'; x.lineWidth = 2;
  for (let i = 0; i < 5; i++) { const y = top + (bot - top) * i / 4; x.beginPath(); x.moveTo(60, y); x.lineTo(w - 60, y); x.stroke(); }
  // twelve candles, read off a rising line: one model, no hand-typed figures
  const N = 12, cw = (w - 130) / N;
  const path = [0.10, 0.17, 0.13, 0.26, 0.23, 0.37, 0.33, 0.48, 0.58, 0.54, 0.74, 0.92];
  let prev = 0.06;
  path.forEach((v, i) => {
    const y = (u) => bot - u * (bot - top), cx = 65 + cw * (i + 0.5);
    const up = v >= prev;
    x.strokeStyle = x.fillStyle = up ? '#00ff38' : '#ff3626';
    x.lineWidth = 7; x.beginPath(); x.moveTo(cx, y(Math.max(v, prev) + 0.035)); x.lineTo(cx, y(Math.min(v, prev) - 0.03)); x.stroke();
    x.beginPath(); x.roundRect(cx - cw * 0.3, Math.min(y(v), y(prev)), cw * 0.6, Math.max(10, Math.abs(y(v) - y(prev))), 5); x.fill();
    prev = v;
  });
  x.fillStyle = '#ffffff'; x.font = '400 158px "Archivo Black", sans-serif'; x.textBaseline = 'alphabetic';
  try { x.letterSpacing = '-2px'; } catch (e) {}
  x.fillText('UPTREND', 60, 208);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;

    const s = [...samples].sort((a, b) => a - b), q = (p) => s[Math.floor(p * (s.length - 1))] || 0;
    const gl = renderer.getContext(), dbg = gl.getExtension('WEBGL_debug_renderer_info');
    return { frames: s.length, p50: q(0.5), p95: q(0.95), p99: q(0.99), calls: renderer.info.render.calls, tris: renderer.info.render.triangles,
      gpu: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'n/a', buffer: [renderer.domElement.width, renderer.domElement.height] };
  }
};
requestAnimationFrame(tick);
</script>
</body>
