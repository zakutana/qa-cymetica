<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0e17; --panel: #0d1520; --panel2: #111a28; --sunk: #070b12;
    --ink: #E6EDF7; --ink2: #A9B8CC; --muted: #6F8199;
    --line: rgba(0,150,255,.15); --line2: rgba(0,150,255,.08);
    --cyan: #00cfff; --green: #00ff88; --blue: #3b82f6; --red: #ff4444;
    --num: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 Inter, system-ui, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
  header h1 span { color: var(--cyan); }
  header p { margin: 6px 0 0; color: var(--ink2); font: 600 12px var(--num); letter-spacing: .08em; text-transform: uppercase; }

  .dir { margin-top: 22px; padding: 22px 24px; border-radius: 24px; background: var(--panel); border: 1px solid var(--line); }
  .dir.today { border-style: dashed; }
  .dir h2 { margin: 0; display: flex; align-items: baseline; gap: 12px; font-size: 20px; font-weight: 800; }
  .dir h2 .n { font: 800 13px var(--num); color: var(--cyan); }
  .dir.today h2 .n { color: var(--muted); }
  .dir h2 .ct { margin-left: auto; font: 600 11px var(--num); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .dir .idea { margin: 4px 0 0; color: var(--ink2); font-size: 14px; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 28px; margin-top: 18px; align-items: center; }

  .ladder { display: grid; gap: 14px; }
  .ladder .r { display: flex; align-items: center; gap: 14px; }
  .ladder .r > b { flex: none; width: 44px; font: 700 11px var(--num); color: var(--muted); }
  .ladder .r .six { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  /* their "Your agents" row (.at-ar) */
  .ctx { display: grid; gap: 18px; min-width: 0; }
  .ar { display: grid; grid-template-columns: 42px minmax(0,1fr) minmax(0,1.1fr) 56px 84px; align-items: center; gap: 12px; padding: 8px 14px; min-height: 62px; border-radius: 16px; background: var(--panel2); border: 1px solid var(--line2); }
  .ar > .av { width: 42px; height: 42px; }
  .ar .nm b { display: block; font-weight: 700; font-size: 15px; color: #F3F7FC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ar .tb b { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: #F3F7FC; white-space: nowrap; }
  .ar .buy { font: 800 11.5px Inter, sans-serif; color: var(--bg); background: var(--blue); padding: 4px 8px; border-radius: 99px; }
  .ar .rk { font: 800 18px Inter, sans-serif; color: #F3F7FC; white-space: nowrap; }
  .ar .rk small { font-size: 13px; color: var(--muted); font-weight: 700; }
  .ar .roi { font: 800 19px Inter, sans-serif; text-align: right; color: var(--red); white-space: nowrap; }

  /* a simple oval table, six seats */
  .tbl { position: relative; width: 100%; max-width: 420px; aspect-ratio: 2 / 1.08; margin: 6px auto 18px; }
  .tbl .felt { position: absolute; left: 11%; right: 11%; top: 15%; bottom: 15%; border-radius: 999px; background: radial-gradient(ellipse at 50% 38%, rgba(0,207,255,.10), var(--sunk) 78%); box-shadow: 0 0 0 5px var(--sunk), 0 0 0 6.5px rgba(0,207,255,.45); }
  .tbl .felt::after { content: ""; position: absolute; inset: 12% 9%; border-radius: 999px; border: 1px dashed rgba(0,207,255,.18); }
  .tbl .felt span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 10px var(--num); letter-spacing: .14em; color: var(--muted); }
  .seat { position: absolute; width: 40px; height: 40px; transform: translate(-50%, -50%); z-index: 2; }
  .seat > .av { width: 100%; height: 100%; }
  .seat em { position: absolute; left: 50%; top: calc(100% + 4px); transform: translateX(-50%); width: max-content; padding: 0 5px; border-radius: 4px; font: 800 9px/1.5 var(--num); font-style: normal; color: var(--bg); background: var(--cyan); }

  .av { display: block; flex: none; }
  .s20 { width: 20px; height: 20px; } .s30 { width: 30px; height: 30px; } .s44 { width: 44px; height: 44px; } .s48 { width: 48px; height: 48px; } .s96 { width: 96px; height: 96px; }

  /* today: their .at-ava, verbatim */
  .at-ava { border-radius: 50%; color: var(--c, var(--cyan)); background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c, var(--cyan)) 24%, var(--panel)), var(--sunk) 72%); border: 1.5px solid color-mix(in srgb, var(--c, var(--cyan)) 75%, transparent); }
  .at-ava svg { display: block; width: 100%; height: 100%; }
  .at-ava.you { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,207,255,.22), 0 0 16px rgba(0,207,255,.6); }

  /* 3D heads: a calm dark round seat, a 1px ring in the bot's colour, the render inside */
  .hd { position: relative; border-radius: 50%; background: var(--sunk); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent); }
  .hd img { position: absolute; left: 50%; top: 50%; width: var(--k, 92%); height: var(--k, 92%); transform: translate(-50%, -51.5%); display: block; }
  .hd.you { box-shadow: inset 0 0 0 1px var(--cyan), 0 0 0 2px var(--bg), 0 0 0 3.5px var(--cyan), 0 0 16px rgba(0,207,255,.55); }
  .hd.s20.you { box-shadow: inset 0 0 0 1px var(--cyan), 0 0 0 1.5px var(--bg), 0 0 0 2.5px var(--cyan), 0 0 8px rgba(0,207,255,.55); }
  .hero { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 18px; }
  .hero .av { width: 96px; height: 96px; }

  @media (max-width: 900px) { .body { grid-template-columns: 1fr; gap: 22px; } }
  @media (max-width: 700px) {
    .wrap { padding: 22px 16px 48px; }
    header h1 { font-size: 24px; }
    .dir { padding: 16px; border-radius: 20px; }
    .dir h2 { flex-wrap: wrap; gap: 4px 10px; font-size: 18px; }
    .dir h2 .ct { margin-left: 0; width: 100%; }
    .hero { display: grid; grid-template-columns: repeat(3, 96px); justify-content: space-between; gap: 14px 0; }
    .ladder .r { flex-direction: column; align-items: flex-start; gap: 6px; }
    .ladder .r .six { gap: 6px; flex-wrap: nowrap; }
    .ar { grid-template-columns: 38px minmax(0,1fr) auto; grid-template-areas: "av nm roi" "av tb rk"; gap: 4px 10px; padding: 10px 12px; }
    .ar > .av { grid-area: av; width: 38px; height: 38px; }
    .ar .nm { grid-area: nm; min-width: 0; } .ar .tb { grid-area: tb; } .ar .roi { grid-area: roi; } .ar .rk { grid-area: rk; font-size: 15px; text-align: right; }
    .seat { width: 34px; height: 34px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<!-- Today: their six, verbatim -->
<symbol id="at-bot-a" viewBox="0 0 40 40"><path d="M20 13V9.4" stroke="currentColor" stroke-linecap="round" stroke-width="2.2"></path><circle cx="20" cy="7.8" fill="currentColor" r="2.3"></circle><rect fill="currentColor" fill-opacity=".18" height="18" rx="6" stroke="currentColor" stroke-width="2.2" width="21" x="9.5" y="13"></rect><circle cx="15.6" cy="21" fill="currentColor" r="2.6"></circle><circle cx="24.4" cy="21" fill="currentColor" r="2.6"></circle><path d="M16.2 26.4q3.8 2.4 7.6 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></symbol>
<symbol id="at-bot-b" viewBox="0 0 40 40"><path d="M14.2 13l-2.2-4.4M25.8 13l2.2-4.4" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path><circle cx="11.6" cy="7.9" fill="currentColor" r="1.9"></circle><circle cx="28.4" cy="7.9" fill="currentColor" r="1.9"></circle><rect fill="currentColor" fill-opacity=".18" height="18" rx="6" stroke="currentColor" stroke-width="2.2" width="21" x="9.5" y="13"></rect><rect fill="currentColor" height="5.6" rx="2.8" width="15.2" x="12.4" y="18.3"></rect><path d="M17 27.2h6" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></symbol>
<symbol id="at-bot-c" viewBox="0 0 40 40"><rect fill="currentColor" height="8" rx="1.5" width="3.4" x="5.6" y="18"></rect><rect fill="currentColor" height="8" rx="1.5" width="3.4" x="31" y="18"></rect><rect fill="currentColor" fill-opacity=".18" height="19" rx="5" stroke="currentColor" stroke-width="2.2" width="21" x="9.5" y="12"></rect><rect fill="currentColor" height="4.8" rx="1.1" width="4.8" x="13.2" y="17.4"></rect><rect fill="currentColor" height="4.8" rx="1.1" width="4.8" x="22" y="17.4"></rect><path d="M15.6 25.8v2.2M18.6 25.8v2.2M21.4 25.8v2.2M24.4 25.8v2.2" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"></path></symbol>
<symbol id="at-bot-d" viewBox="0 0 40 40"><path d="M20 12.6V8.6M16.8 8.6h6.4" stroke="currentColor" stroke-linecap="round" stroke-width="2.2"></path><rect fill="currentColor" fill-opacity=".18" height="18.4" rx="7" stroke="currentColor" stroke-width="2.2" width="21" x="9.5" y="12.6"></rect><circle cx="20" cy="20.6" fill="currentColor" fill-opacity=".3" r="5" stroke="currentColor" stroke-width="2"></circle><circle cx="20" cy="20.6" fill="currentColor" r="2.1"></circle><path d="M16.6 27.1h6.8" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></symbol>
<symbol id="at-bot-e" viewBox="0 0 40 40"><path d="M20 13V9l3.6-1.8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path><rect fill="currentColor" fill-opacity=".18" height="18" rx="6" stroke="currentColor" stroke-width="2.2" width="21" x="9.5" y="13"></rect><path d="M13.4 20.6h5M21.6 20.6h5" stroke="currentColor" stroke-linecap="round" stroke-width="2.8"></path><circle cx="20" cy="26.3" fill="currentColor" r="1.7"></circle></symbol>
<symbol id="at-bot-f" viewBox="0 0 40 40"><path d="M8.6 21.5a11.4 11.4 0 0 1 22.8 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.2"></path><rect fill="currentColor" fill-opacity=".18" height="17" rx="6" stroke="currentColor" stroke-width="2.2" width="18" x="11" y="14"></rect><rect fill="currentColor" height="8.4" rx="2" width="4.6" x="6.4" y="19"></rect><rect fill="currentColor" height="8.4" rx="2" width="4.6" x="29" y="19"></rect><circle cx="16.5" cy="21.6" fill="currentColor" r="2.3"></circle><circle cx="23.5" cy="21.6" fill="currentColor" r="2.3"></circle><path d="M17.2 26.6h5.6" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></symbol>
</defs>
</svg>

<div class="wrap">
  <header>
    <h1>Agent icons <span>3D heads</span></h1>
    <p>Today first · same 6 bots · rendered like the table · 20 / 30 / 44 / 48 / 96 px</p>
  </header>
  <main id="dirs"></main>
</div>

<script>
(function () {
  var COLS = ['#00cfff', '#00ff88', '#3b82f6', '#7FE6FF', '#66ffb8', '#93c5fd'];
  var L = ['a', 'b', 'c', 'd', 'e', 'f'];
  var DIRS = [
    { today: true, name: 'Today', box: 'Round · gradient · ring', idea: 'Six cartoon robot faces in glowing circles, as live now.' },
    { name: '3D heads', box: 'Dark round seat · 1px ring', hero: true,
      idea: 'The same six bots as chrome heads with a dark glass visor and LED eyes in their colour, rendered like the casino table.' }
  ];
  function ava(d, i, size, you) {
    var c = COLS[i], l = L[i];
    if (d.today) return '<span class="av at-ava ' + (size || '') + (you ? ' you' : '') + '" style="--c:' + c + '"><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#at-bot-' + l + '"/></svg></span>';
    return '<span class="av hd ' + (size || '') + (you ? ' you' : '') + '" style="--c:' + c + '"><img src="heads/' + l + '.webp" alt=""></span>';
  }
  var SEATS = [[30, 12], [70, 12], [94, 50], [70, 88], [30, 88], [6, 50]];
  var YOU = 4;
  document.getElementById('dirs').innerHTML = DIRS.map(function (d) {
    var ladder = [20, 30, 44, 48].map(function (s) {
      return '<div class="r"><b>' + s + ' px</b><div class="six">' + L.map(function (_, i) { return ava(d, i, 's' + s); }).join('') + '</div></div>';
    }).join('');
    var hero = '<div class="hero">' + L.map(function (_, i) { return ava(d, i, 's96'); }).join('') + '</div>';
    var row = '<div class="ar">' + ava(d, 0, '', true) + '<div class="nm"><b>casino RSI Sniper</b></div>' +
      '<div class="tb"><b><span class="buy">$50</span>Pro #91</b></div><div class="rk">#2<small>/6</small></div><div class="roi">−9.76%</div></div>';
    var seats = SEATS.map(function (p, i) {
      return '<span class="seat" style="left:' + p[0] + '%;top:' + p[1] + '%">' + ava(d, i, '', i === YOU) + (i === YOU ? '<em>YOU</em>' : '') + '</span>';
    }).join('');
    return '<section class="dir' + (d.today ? ' today' : '') + '"><h2><span class="n">' + (d.today ? 'NOW' : 'NEW') + '</span>' + d.name +
      '<span class="ct">' + d.box + '</span></h2><p class="idea">' + d.idea + '</p>' + hero +
      '<div class="body"><div class="ladder">' + ladder + '</div><div class="ctx">' + row +
      '<div class="tbl"><div class="felt"><span>PRO #91</span></div>' + seats + '</div></div></div></section>';
  }).join('');
})();
</script>
</body>
</html>
