<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0e17; --panel: #0d1520; --panel2: #111a28; --sunk: #070b12;
    --ink: #E6EDF7; --ink2: #A9B8CC; --muted: #6F8199;
    --line: rgba(0,150,255,.15); --line2: rgba(0,150,255,.08);
    --cyan: #00cfff; --green: #00ff88; --blue: #3b82f6; --red: #ff4444;
    --num: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 Inter, system-ui, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
  header h1 span { color: var(--cyan); }
  header p { margin: 6px 0 0; color: var(--ink2); font: 600 12px var(--num); letter-spacing: .08em; text-transform: uppercase; }

  .dir { margin-top: 22px; padding: 22px 24px; border-radius: 24px; background: var(--panel); border: 1px solid var(--line); }
  .dir.today { border-style: dashed; }
  .dir h2 { margin: 0; display: flex; align-items: baseline; gap: 12px; font-size: 20px; font-weight: 800; }
  .dir h2 .n { font: 800 13px var(--num); color: var(--cyan); }
  .dir.today h2 .n { color: var(--muted); }
  .dir h2 .ct { margin-left: auto; font: 600 11px var(--num); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .dir .idea { margin: 4px 0 0; color: var(--ink2); font-size: 14px; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 28px; margin-top: 18px; align-items: center; }

  .ladder { display: grid; gap: 14px; }
  .ladder .r { display: flex; align-items: center; gap: 14px; }
  .ladder .r > b { flex: none; width: 44px; font: 700 11px var(--num); color: var(--muted); }
  .ladder .r .six { display: flex; align-items: center; gap: 14px; }

  /* context: their "Your agents" row (.at-ar), copied */
  .ctx { display: grid; gap: 18px; min-width: 0; }
  .ar { display: grid; grid-template-columns: 42px minmax(0,1fr) minmax(0,1.1fr) 56px 84px; align-items: center; gap: 12px; padding: 8px 14px; min-height: 62px; border-radius: 16px; background: var(--panel2); border: 1px solid var(--line2); }
  .ar > .av, .ar > .at-ava { width: 42px; height: 42px; }
  .ar .nm b { display: block; font-weight: 700; font-size: 15px; color: #F3F7FC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ar .tb b { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: #F3F7FC; white-space: nowrap; }
  .ar .buy { font: 800 11.5px Inter, sans-serif; color: var(--bg); background: var(--blue); padding: 4px 8px; border-radius: 99px; }
  .ar .rk { font: 800 18px Inter, sans-serif; color: #F3F7FC; white-space: nowrap; }
  .ar .rk small { font-size: 13px; color: var(--muted); font-weight: 700; }
  .ar .roi { font: 800 19px Inter, sans-serif; text-align: right; color: var(--red); white-space: nowrap; }

  /* a simple oval table, six seats */
  .tbl { position: relative; width: 100%; max-width: 420px; aspect-ratio: 2 / 1.08; margin: 6px auto 18px; }
  .tbl .felt { position: absolute; left: 11%; right: 11%; top: 15%; bottom: 15%; border-radius: 999px; background: radial-gradient(ellipse at 50% 38%, rgba(0,207,255,.10), var(--sunk) 78%); box-shadow: 0 0 0 5px var(--sunk), 0 0 0 6.5px rgba(0,207,255,.45); }
  .tbl .felt::after { content: ""; position: absolute; inset: 12% 9%; border-radius: 999px; border: 1px dashed rgba(0,207,255,.18); }
  .tbl .felt span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 10px var(--num); letter-spacing: .14em; color: var(--muted); }
  .seat { position: absolute; width: 38px; height: 38px; transform: translate(-50%, -50%); z-index: 2; }
  .seat > * { width: 100%; height: 100%; }
  .seat em { position: absolute; left: 50%; top: calc(100% + 4px); transform: translateX(-50%); width: max-content; height: auto; padding: 0 5px; border-radius: 4px; font: 800 9px/1.5 var(--num); font-style: normal; color: var(--bg); background: var(--cyan); }

  /* ---------- today: their .at-ava, verbatim ---------- */
  .at-ava { display: block; flex: none; width: 40px; height: 40px; border-radius: 50%; color: var(--c, var(--cyan)); background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c, var(--cyan)) 24%, var(--panel)), var(--sunk) 72%); border: 1.5px solid color-mix(in srgb, var(--c, var(--cyan)) 75%, transparent); }
  .at-ava svg { display: block; width: 100%; height: 100%; }
  .at-ava.you { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,207,255,.22), 0 0 16px rgba(0,207,255,.6); }

  /* ---------- the new avatars ---------- */
  .av { position: relative; display: block; flex: none; color: var(--c, var(--cyan)); }
  .av svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .s20 { width: 20px; height: 20px; } .s30 { width: 30px; height: 30px; } .s44 { width: 44px; height: 44px; } .s48 { width: 48px; height: 48px; }

  /* 1 Visor: rounded-square plate, hairline, flat */
  .v-visor { --ko: #111a28; border-radius: 27%; background: var(--panel2); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 38%, transparent); }
  .v-visor svg { padding: 6%; }
  /* 2 Token: the coin is the container */
  .v-token { --ko: #0a0e17; border-radius: 50%; }
  /* 3 Chip: sunk tile, no border */
  .v-chip { border-radius: 24%; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line2); }
  .v-chip svg { padding: 7%; }
  /* 4 Hex Core: hex drawn in the SVG */
  .v-hex { --ko: #070b12; }
  /* 5 Signal: round gauge drawn in the SVG */
  .v-signal { --ko: #070b12; border-radius: 50%; }
  /* 6 Fleet: rounded-square plate, hairline */
  .v-fleet { --ko: #111a28; border-radius: 30%; background: var(--panel2); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 34%, transparent); }
  .v-fleet svg { padding: 8%; }

  /* YOU: one cyan ring + glow, same on every direction */
  .av.you { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--cyan), 0 0 16px rgba(0,207,255,.55); }
  .v-visor.you, .v-fleet.you { box-shadow: inset 0 0 0 1px var(--cyan), 0 0 0 2px var(--bg), 0 0 0 3.5px var(--cyan), 0 0 16px rgba(0,207,255,.55); }
  .v-hex.you { box-shadow: none; --ring: #00cfff; --rw: 2.6; }
  .v-hex.you svg { filter: drop-shadow(0 0 5px rgba(0,207,255,.75)); }
  .s20.you { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 2.5px var(--cyan), 0 0 8px rgba(0,207,255,.55); }

  @media (max-width: 900px) {
    .body { grid-template-columns: 1fr; gap: 22px; }
  }
  @media (max-width: 700px) {
    .wrap { padding: 22px 16px 48px; }
    header h1 { font-size: 24px; }
    .dir { padding: 16px; border-radius: 20px; }
    .dir h2 { flex-wrap: wrap; gap: 4px 10px; font-size: 18px; }
    .dir h2 .ct { margin-left: 0; width: 100%; }
    .ladder .r { flex-direction: column; align-items: flex-start; gap: 6px; }
    .ladder .r .six { gap: 10px; }
    .ar { grid-template-columns: 38px minmax(0,1fr) auto; grid-template-areas: "av nm roi" "av tb rk"; gap: 4px 10px; padding: 10px 12px; }
    .ar > .av, .ar > .at-ava { grid-area: av; width: 38px; height: 38px; }
    .ar .nm { grid-area: nm; min-width: 0; } .ar .tb { grid-area: tb; } .ar .roi { grid-area: roi; } .ar .rk { grid-area: rk; font-size: 15px; text-align: right; }
    .seat { width: 32px; height: 32px; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <h1>Agent icons <span>6 directions</span></h1>
    <p>Today first · 6 bots per set · colour per bot · 20 / 30 / 44 / 48 px</p>
  </header>
  <main id="dirs"></main>
</div>

<script>
(function () {
  var COLS = ['#00cfff', '#00ff88', '#3b82f6', '#7FE6FF', '#66ffb8', '#93c5fd'];
  var L = ['a', 'b', 'c', 'd', 'e', 'f'];
  var DIRS = [
    { today: true, name: 'Today', box: 'Round · gradient · ring',
      idea: 'Six cartoon robot faces in glowing circles, as live now.' },
    { key: 'v1', cls: 'v-visor', name: 'Visor', box: 'Rounded square · hairline',
      idea: 'Solid machine helmets, one visor band and no face; each bot has its own shell.' },
    { key: 'v2', cls: 'v-token', frame: 'v2-frame', name: 'Token', box: 'Solid coin · no border',
      idea: 'A solid coin in the bot’s colour stamped with one geometric mark, like an exchange token.' },
    { key: 'v3', cls: 'v-chip', name: 'Chip', box: 'Sunk tile · no border',
      idea: 'Each bot is a processor die: the pin layout and the core shape tell them apart.' },
    { key: 'v4', cls: 'v-hex', frame: 'v4-frame', name: 'Hex Core', box: 'Hex shell · hairline',
      idea: 'One hex shell for every bot, with a different sensor eye inside.' },
    { key: 'v5', cls: 'v-signal', frame: 'v5-frame', name: 'Signal', box: 'Round gauge ring',
      idea: 'A gauge ring holding the bot’s signal trace: wave, radar, bars, pulse, broadcast, orbit.' },
    { key: 'v6', cls: 'v-fleet', name: 'Fleet', box: 'Rounded square · hairline',
      idea: 'Whole machines in silhouette: drone, satellite, walker, rover, beacon, arm.' }
  ];

  function ava(d, i, size, you) {
    var c = COLS[i], l = L[i];
    if (d.today) return '<span class="at-ava ' + (size || '') + (you ? ' you' : '') + '" style="--c:' + c + '"><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#at-bot-' + l + '"/></svg></span>';
    return '<span class="av ' + d.cls + ' ' + (size || '') + (you ? ' you' : '') + '" style="--c:' + c + '"><svg viewBox="0 0 40 40" aria-hidden="true">' +
      (d.frame ? '<use href="#' + d.frame + '"/>' : '') + '<use href="#' + d.key + '-' + l + '"/></svg></span>';
  }
  var SEATS = [[30, 12], [70, 12], [94, 50], [70, 88], [30, 88], [6, 50]];
  var YOU = 4;

  var html = DIRS.map(function (d, n) {
    var ladder = [20, 30, 44, 48].map(function (s) {
      return '<div class="r"><b>' + s + ' px</b><div class="six">' + L.map(function (_, i) { return ava(d, i, 's' + s); }).join('') + '</div></div>';
    }).join('');
    var row = '<div class="ar">' + ava(d, 0, '', true) +
      '<div class="nm"><b>casino RSI Sniper</b></div>' +
      '<div class="tb"><b><span class="buy">$50</span>Pro #91</b></div>' +
      '<div class="rk">#2<small>/6</small></div>' +
      '<div class="roi">−9.76%</div></div>';
    var seats = SEATS.map(function (p, i) {
      return '<span class="seat" style="left:' + p[0] + '%;top:' + p[1] + '%">' + ava(d, i, '', i === YOU) + (i === YOU ? '<em>YOU</em>' : '') + '</span>';
    }).join('');
    var tbl = '<div class="tbl"><div class="felt"><span>PRO #91</span></div>' + seats + '</div>';
    return '<section class="dir' + (d.today ? ' today' : '') + '"><h2><span class="n">' + (d.today ? 'NOW' : String(n).padStart(2, '0')) + '</span>' + d.name +
      '<span class="ct">' + d.box + '</span></h2><p class="idea">' + d.idea + '</p>' +
      '<div class="body"><div class="ladder">' + ladder + '</div><div class="ctx">' + row + tbl + '</div></div></section>';
  }).join('');
  document.getElementById('dirs').innerHTML = html;
})();
</script>
