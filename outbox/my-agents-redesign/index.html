<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Agents</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
/* Mockup of a redesigned cymetica.com/my-agents. The bots and their numbers are ours, read 2026-10-17 (data.js);
   every button only pretends. */
.head{display:flex;align-items:center;gap:14px;margin:26px 0 18px}
.head h1{font-family:'Archivo Black';font-weight:400;font-size:34px}
.head .sp{flex:1}

/* hero */
.hero{display:grid;grid-template-columns:minmax(320px,400px) 1fr minmax(360px,440px);border:1px solid var(--line2);border-radius:24px;overflow:hidden;
 background:linear-gradient(180deg,rgba(17,26,40,.92),rgba(10,14,23,.92));box-shadow:0 0 0 1px rgba(0,255,136,.05),0 30px 80px -40px rgba(0,255,136,.25)}
.hero>div{padding:24px 28px;min-width:0}
.pnl{display:flex;flex-direction:column;justify-content:center}
.pnl .lbl i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);margin-right:8px;animation:pulse 1.6s infinite}
.pnl .big{font-family:'Archivo Black';font-size:64px;line-height:1.05;margin:12px 0 12px;letter-spacing:-.02em;white-space:nowrap}
.pnl .big.up{text-shadow:0 0 34px rgba(0,255,136,.45)}.pnl .big.dn{text-shadow:0 0 34px rgba(255,68,68,.45)}
.pnl .pills{display:flex;gap:8px;flex-wrap:wrap}
.dist{position:relative;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.dist .ttl{display:flex;justify-content:space-between}
.dist svg{display:block;width:100%;height:170px;margin-top:14px;overflow:visible}
.dist rect{cursor:pointer;transition:opacity .12s}
.dist rect:hover,.dist rect.sel{opacity:1!important;filter:brightness(1.35)}
.dist .tip{position:absolute;pointer-events:none;background:#0b1626;border:1px solid var(--line3);border-radius:9px;padding:7px 10px;font-size:11.5px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center;padding:20px 24px!important}

/* toolbar */
.tools{display:flex;align-items:center;gap:12px;margin:22px 0 14px;flex-wrap:wrap}
.tools .search{width:260px}
.tools .sp{flex:1}

/* stage: list + side panel */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 0px;gap:0;align-items:start;transition:grid-template-columns .25s,gap .25s}
.stage.open{grid-template-columns:minmax(0,1fr) 390px;gap:18px}
.main{container-type:inline-size;container-name:main;min-width:0}

/* leaderboard */
.lb{padding:6px 10px 10px}
.row{display:grid;grid-template-columns:44px minmax(240px,2fr) 120px 140px 76px 100px minmax(190px,1.1fr) 170px;
 align-items:center;gap:20px;padding:0 12px;height:68px;border-radius:14px;transition:background .15s,opacity .3s,transform .3s,height .3s}
.row:not(.hd){cursor:pointer}
.row:not(.hd):hover{background:rgba(17,26,40,.9)}
.row.sel{background:rgba(0,207,255,.07);box-shadow:inset 3px 0 0 var(--cyan)}
.row.hd{height:40px;font-size:11px;letter-spacing:.14em;color:var(--dim2)}
.row.hd .s{cursor:pointer;user-select:none}.row.hd .s:hover{color:var(--text)}.row.hd .s.on{color:var(--cyan)}
.row .r{text-align:right}
.row.gone{opacity:0;transform:translateX(60px);height:0;overflow:hidden}
.row.fresh{animation:fresh 1.6s ease}
.rank{font-family:'Archivo Black';font-size:17px;color:var(--dim2);text-align:center}
.rank.g1{color:var(--green);text-shadow:0 0 14px rgba(0,255,136,.5)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sub{font-size:11.5px;color:var(--dim2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money{font-weight:800;font-size:16px}
.wr{display:flex;flex-direction:column;gap:6px}.wr b{font-size:13px}
.bar{height:4px;border-radius:99px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan)}
.st{display:flex;align-items:center;gap:12px;min-width:0}
.st .t{min-width:0}
.st .t b{display:block;font-size:11.5px;letter-spacing:.1em}
.st .t span{display:block;font-size:11px;color:var(--dim2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b.on{color:var(--green)}.st b.off{color:var(--dim2)}
.acts{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.menu{position:absolute;right:0;top:40px;z-index:30;min-width:170px;padding:6px;border-radius:12px;background:#0d1828;border:1px solid var(--line3);box-shadow:0 20px 40px rgba(0,0,0,.5);display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font-size:12.5px;color:var(--dim);text-align:left}
.menu button:hover{background:var(--panel2);color:var(--text)}
.menu button i{width:16px;color:var(--cyan)}
.lb .empty{padding:60px;text-align:center;color:var(--dim2)}
@container main (max-width:1300px){.row{grid-template-columns:36px minmax(170px,2fr) 96px 96px 54px 76px minmax(130px,1fr) 118px;gap:10px}.acts .ml{display:none}.acts .btn.sm{width:36px;padding:0}}
@container main (max-width:860px){.row{grid-template-columns:32px minmax(160px,2fr) 92px 88px 70px minmax(120px,1fr) 118px;gap:10px}.row>:nth-child(5){display:none}}

/* side panel */
.side{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:hidden auto;visibility:hidden;opacity:0;transform:translateX(24px);transition:opacity .2s,transform .25s;
 box-shadow:0 0 0 1px rgba(0,207,255,.12),0 30px 80px -30px rgba(0,207,255,.35)}
.stage.open .side{visibility:visible;opacity:1;transform:none}
.sh{position:relative;padding:20px;display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(0,207,255,.07),transparent)}
.sh .t{flex:1;min-width:0;padding-right:26px}
.sh .nm{font-family:'Archivo Black';font-size:20px;line-height:1.15;word-break:break-word}
.sh .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sh .x{position:absolute;right:12px;top:12px}
.sb{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 .tile{padding:11px 13px;border-radius:12px}.g2 .tile .v{font-size:20px}
.why{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;font-size:12.5px;line-height:1.5}
.why.r{background:var(--redT);border:1px solid rgba(255,68,68,.35)}
.why.g{background:var(--greenT);border:1px solid rgba(0,255,136,.35)}
.why.n{background:rgba(30,48,80,.35);border:1px solid var(--line2)}
.why i{margin-top:2px}
.rbox{border-left:2px solid var(--cyan);background:rgba(0,207,255,.06);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.55}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line2);font-size:12px}
.kv span{color:var(--dim2)}
.sf{position:sticky;bottom:0;padding:14px 20px 18px;background:linear-gradient(180deg,rgba(10,14,23,0),rgba(10,14,23,.97) 28%);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sf .go{grid-column:1/-1;height:48px;font-size:13px}

@media (max-width:1380px){.hero{grid-template-columns:1fr 1fr}.hero .tiles{grid-column:1/-1;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}.dist{border-right:0}}
@media (max-width:1000px){.wrap{padding:0 16px 60px}.hero{grid-template-columns:1fr}.dist{border:0;border-top:1px solid var(--line)}.hero .tiles{grid-template-columns:1fr 1fr}
 .stage.open{grid-template-columns:minmax(0,1fr)}.stage.open .side{position:fixed;right:0;top:68px;bottom:0;width:min(390px,100vw);max-height:none;border-radius:0;z-index:30}.lb{overflow-x:auto}.row{min-width:820px}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
 <div class="logo"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="none" stroke="#00cfff" stroke-width="1.5" opacity=".5"/><circle cx="15" cy="15" r="8" fill="none" stroke="#00cfff" stroke-width="1.5"/><circle cx="15" cy="15" r="3" fill="#00ff88"/></svg>EventTrader</div>
 <div class="crumb"><b>MY AGENTS</b></div>
 <div class="sp"></div>
 <span class="mock">MOCKUP · OUR BOTS, 17 OCT</span>
</div></header>

<main class="wrap">
 <div class="head">
  <h1>My Agents</h1>
  <span class="tag c" data-tip="Practice bots trade simulated funds. No real money at risk.">PRACTICE</span>
  <span class="sp"></span>
  <a class="btn" href="#" data-tip="Your bot against its improved version"><i class="fa-solid fa-people-arrows"></i>HEAD-TO-HEAD</a>
  <button class="btn cy"><i class="fa-solid fa-coins"></i>TOKENIZE AGENT</button>
 </div>

 <section class="hero">
  <div class="pnl">
   <div class="lbl"><i></i>ALL MY BOTS · P&amp;L</div>
   <div class="big num" id="total"></div>
   <div class="pills"><span class="pill up num" id="pWin"></span><span class="pill n num" id="pAvg" data-tip="Average win rate of the bots that have traded."></span></div>
  </div>
  <div class="dist">
   <div class="ttl"><span class="lbl">P&amp;L BY BOT</span><span class="lbl" id="distN"></span></div>
   <div id="distSvg"></div><div class="tip" id="tip"></div>
  </div>
  <div class="tiles">
   <div class="tile"><div class="v num" id="tRun"></div><div class="k">TRADING NOW</div></div>
   <div class="tile"><div class="v num" id="tBal"></div><div class="k">TOTAL BALANCE</div></div>
   <div class="tile" id="tBest"></div>
   <div class="tile" id="tWorst"></div>
  </div>
 </section>

 <div class="tools">
  <div class="seg" id="filters"></div>
  <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input class="field" id="q" placeholder="Search bots"></div>
  <span class="sp"></span>
  <span class="lbl">CLICK A BOT FOR DETAILS · MANAGE TO CONFIGURE</span>
 </div>

 <div class="stage" id="stage">
  <div class="main"><div class="panel"><div class="lb" id="board"></div></div></div>
  <aside class="panel side" id="side"></aside>
 </div>
</main>

<div class="ov" id="fundOv"><div class="panel modal">
 <h3 id="fundT">Fund bot</h3>
 <div class="mute" style="margin-top:6px" id="fundSub"></div>
 <div class="g2" style="margin-top:16px"><div class="tile"><div class="v num" id="fundBal"></div><div class="k">BALANCE NOW</div></div><div class="tile"><div class="v num" id="fundMin">$1.00</div><div class="k">MIN STAKE</div></div></div>
 <input class="field num" id="fundAmt" type="number" min="1" step="1" placeholder="Amount (USDC)" style="width:100%;margin-top:14px;height:48px;font-size:16px">
 <div class="row"><button class="btn sm" data-amt="10">$10</button><button class="btn sm" data-amt="50">$50</button><button class="btn sm" data-amt="100">$100</button><button class="btn sm" data-amt="500">$500</button></div>
 <div class="acts"><button class="btn" id="fundNo">CANCEL</button><button class="btn go" id="fundYes"><i class="fa-solid fa-wallet"></i>FUND</button></div>
</div></div>

<div class="toast" id="toast"><i></i><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const usd=(v,d=2)=>(Math.abs(v)<.005?'':v>0?'+':'−')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=v=>'$'+(+v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=v=>Math.abs(v)<.005?'mute':v>0?'up':'dn';
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const fa=n=>`<i class="fa-solid fa-${n}"></i>`;
const WHY={stop_loss:'stop-loss hit',take_profit:'take-profit hit',breakeven:'breakeven stop',trailing_floor:'trailing floor hit'};
let tt;function toast(msg,btn,fn,bad){const t=$('#toast');$('#toastMsg').innerHTML=msg;const b=$('#toastBtn');b.style.display=btn?'':'none';b.textContent=btn||'';b.onclick=()=>{fn&&fn();t.classList.remove('on')};
 t.classList.toggle('bad',!!bad);t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4500)}

let bots=BOTS.map(b=>({...b})),filter='all',sortK='pnl',sortD=-1,sel=null;
const FILTERS=[['all','ALL',()=>true],['live','REAL MONEY',b=>!b.paper],['paper','PRACTICE',b=>b.paper],['on','TRADING',b=>b.trading],['off','PAUSED',b=>!b.trading]];
function why(b){if(b.trading)return 'placing trades';if(b.why)return WHY[b.why]||b.why.replace(/_/g,' ');return 'paused by you'}

/* hero */
let shown=0;
function countTo(el,from,to){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/650),e=1-Math.pow(1-k,3);el.textContent=usd(k<1?from+(to-from)*e:to);if(k<1)requestAnimationFrame(f)})(t0)}
function renderHero(){const tot=bots.reduce((a,b)=>a+b.pnl,0),traded=bots.filter(b=>b.trades>0);
 const el=$('#total');el.className='big num '+cls(tot);countTo(el,shown,tot);shown=tot;
 $('#pWin').textContent=`${bots.filter(b=>b.pnl>0).length} / ${bots.length} IN PROFIT`;
 $('#pAvg').textContent=`AVG WIN ${traded.length?Math.round(traded.reduce((a,b)=>a+b.wr,0)/traded.length):0}%`;
 $('#tRun').innerHTML=`${bots.filter(b=>b.trading).length}<small>/${bots.length}</small>`;
 $('#tBal').textContent=money(bots.reduce((a,b)=>a+b.bal,0));
 const s=[...bots].sort((a,b)=>b.pnl-a.pnl),best=s[0],worst=s[s.length-1];
 $('#tBest').innerHTML=best?`<div class="v num ${cls(best.pnl)}">${usd(best.pnl,0)}</div><div class="k" title="${esc(best.name)}">BEST · ${esc(best.name.toUpperCase())}</div>`:'';
 $('#tWorst').innerHTML=worst&&worst!==best?`<div class="v num ${cls(worst.pnl)}">${usd(worst.pnl,0)}</div><div class="k" title="${esc(worst.name)}">WORST · ${esc(worst.name.toUpperCase())}</div>`:'';
 /* one bar per bot, best to worst, from the zero line */
 const W=1000,H=170,n=s.length||1,bw=W/n,mx=Math.max(1,...s.map(b=>Math.abs(b.pnl))),hi=Math.max(0,...s.map(b=>b.pnl)),lo=Math.min(0,...s.map(b=>b.pnl));
 const Y=v=>(hi-v)/((hi-lo)||1)*(H-8)+4;
 $('#distSvg').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#2a4166" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>`+
  s.map((b,i)=>{const y0=Y(0),y=Y(b.pnl),h=Math.max(2,Math.abs(y-y0));return `<rect data-id="${b.id}" class="${sel===b.id?'sel':''}" x="${(i*bw+bw*.12).toFixed(1)}" y="${Math.min(y,y0).toFixed(1)}" width="${(bw*.76).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${b.pnl>=0?'#00ff88':'#ff4444'}" opacity="${b.trades?.85:.35}"/>`}).join('')+'</svg>';
 $('#distN').textContent=`${bots.length} BOTS`}
$('#distSvg').addEventListener('mousemove',e=>{const r=e.target.closest('rect');const tip=$('#tip');if(!r){tip.style.display='none';return}const b=bots.find(x=>x.id===r.dataset.id);
 const box=$('.dist').getBoundingClientRect();tip.style.display='block';tip.style.left=(e.clientX-box.left)+'px';tip.style.top=(e.clientY-box.top)+'px';tip.innerHTML=`<b>${esc(b.name)}</b> · <span class="${cls(b.pnl)}">${usd(b.pnl)}</span>`});
$('#distSvg').addEventListener('mouseleave',()=>$('#tip').style.display='none');
$('#distSvg').addEventListener('click',e=>{const r=e.target.closest('rect');if(r)openSide(r.dataset.id,true)});

/* filters + list */
function renderFilters(){$('#filters').innerHTML=FILTERS.map(([k,l,f])=>`<button data-f="${k}" class="${filter===k?'on':''}">${l}<span class="c">${bots.filter(f).length}</span></button>`).join('')}
$('#filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;renderFilters();renderBoard()});
$('#q').addEventListener('input',renderBoard);
function list(){const q=$('#q').value.trim().toLowerCase(),f=FILTERS.find(x=>x[0]===filter)[2];
 return bots.filter(f).filter(b=>!q||b.name.toLowerCase().includes(q)||(b.species||'').toLowerCase().includes(q)).sort((a,b)=>(a[sortK]-b[sortK])*sortD)}
function renderBoard(){const rows=list();
 const H=(k,t,r)=>`<div class="s${sortK===k?' on':''}${r?' r':''}" data-sort="${k}">${t}${sortK===k?(sortD<0?' ↓':' ↑'):''}</div>`;
 let h=`<div class="row hd"><div style="text-align:center">#</div><div>BOT</div>${H('pnl','P&amp;L',1)}${H('wr','WIN RATE')}${H('trades','TRADES',1)}${H('bal','BALANCE',1)}<div>STATUS</div><div></div></div>`;
 if(!rows.length)h+='<div class="empty">No bots here.</div>';
 rows.forEach((b,i)=>{h+=`<div class="row${sel===b.id?' sel':''}${b.fresh?' fresh':''}" data-id="${b.id}">
  <div class="rank${i===0&&sortK==='pnl'&&sortD<0&&b.pnl>0?' g1':''}">${i+1}</div>
  <div class="who"><span class="bdg">${fa(b.icon)}</span><div style="min-width:0"><div class="nm">${esc(b.name)}</div><div class="sub">${esc(b.species)} · ${b.paper?'practice':'real market'}</div></div></div>
  <div class="r money num ${cls(b.pnl)}">${usd(b.pnl)}</div>
  <div class="wr">${b.trades?`<b class="num">${b.wr}%</b><div class="bar"><i style="width:${b.wr}%"></i></div>`:'<b class="mute" data-tip="No trades yet, so no win rate.">N/A</b>'}</div>
  <div class="r num" style="color:var(--dim)">${b.trades.toLocaleString('en-US')}</div>
  <div class="r num" style="color:${b.bal<1?'var(--red)':'var(--text)'}" ${b.bal<1?'data-tip="Below the $1.00 minimum stake: it cannot trade until funded."':''}>${money(b.bal)}</div>
  <div class="st"><span class="sw${b.trading?' on':''}" data-tg="${b.id}" data-tip="${b.trading?'Pause':'Start trading'}"></span><div class="t"><b class="${b.trading?'on':'off'}">${b.trading?'TRADING':'PAUSED'}</b><span>${esc(why(b))}</span></div></div>
  <div class="acts" style="position:relative"><a class="btn cy sm" href="manage.html?id=${b.id}" data-stop data-tip="Configure">${fa('sliders')}<span class="ml">MANAGE</span></a><button class="ibtn" data-menu="${b.id}" data-tip="More">${fa('ellipsis')}</button><button class="ibtn del" data-del="${b.id}" data-tip="Delete">${fa('trash-can')}</button>
   <div class="menu" id="m-${b.id}"><button data-fund="${b.id}">${fa('wallet')}Fund</button><button data-wd="${b.id}">${fa('arrow-up-from-bracket')}Withdraw</button><button data-edit="${b.id}">${fa('pen')}Rename</button></div></div></div>`});
 $('#board').innerHTML=h;bots.forEach(b=>b.fresh=0)}
$('#board').addEventListener('click',e=>{
 const s=e.target.closest('[data-sort]');if(s){const k=s.dataset.sort;sortD=sortK===k?-sortD:-1;sortK=k;renderBoard();return}
 if(e.target.closest('[data-stop]'))return;
 const m=e.target.closest('[data-menu]');if(m){const el=$('#m-'+m.dataset.menu);const was=el.classList.contains('on');$$('.menu.on').forEach(x=>x.classList.remove('on'));if(!was)el.classList.add('on');return}
 const f=e.target.closest('[data-fund]');if(f){openFund(f.dataset.fund);return}
 if(e.target.closest('[data-wd]')){toast('Withdraw: practice funds are simulated, nothing to withdraw',null,null,1);return}
 if(e.target.closest('[data-edit]')){toast('Rename opens an inline field (mockup)');return}
 const d=e.target.closest('[data-del]');if(d){del(d.dataset.del);return}
 const g=e.target.closest('[data-tg]');if(g){toggle(g.dataset.tg);return}
 const r=e.target.closest('.row[data-id]');if(r)openSide(r.dataset.id)});
document.addEventListener('click',e=>{if(!e.target.closest('[data-menu],.menu'))$$('.menu.on').forEach(x=>x.classList.remove('on'))});

function toggle(id){const b=bots.find(x=>x.id===id);
 if(!b.trading&&b.bal<1){toast(`<b>${esc(b.name)}</b> can't trade: balance ${money(b.bal)} is below the $1.00 minimum stake`,'FUND',()=>openFund(id),1);return}
 b.trading=!b.trading;if(b.trading)b.why=null;renderAll();toast(`<b>${esc(b.name)}</b> ${b.trading?'is trading':'paused'}`)}
function del(id){const idx=bots.findIndex(b=>b.id===id),b=bots[idx];const row=$(`.row[data-id="${id}"]`);if(row)row.classList.add('gone');if(sel===id)closeSide();
 setTimeout(()=>{bots.splice(idx,1);renderAll();toast(`<b>${esc(b.name)}</b> deleted · <span class="${cls(b.pnl)}">${usd(b.pnl)}</span>`,'UNDO',()=>{bots.splice(idx,0,b);b.fresh=1;renderAll()},1)},280)}

/* fund */
let fundId=null;
function openFund(id){const b=bots.find(x=>x.id===id);fundId=id;$$('.menu.on').forEach(x=>x.classList.remove('on'));
 $('#fundT').textContent='Fund '+b.name;$('#fundSub').textContent=b.paper?'Practice funds: simulated, no real money.':'From your USDC balance.';$('#fundBal').textContent=money(b.bal);$('#fundAmt').value='';$('#fundOv').classList.add('on');setTimeout(()=>$('#fundAmt').focus(),50)}
$$('[data-amt]').forEach(x=>x.onclick=()=>$('#fundAmt').value=x.dataset.amt);
$('#fundNo').onclick=()=>$('#fundOv').classList.remove('on');
$('#fundOv').addEventListener('click',e=>{if(e.target.id==='fundOv')$('#fundOv').classList.remove('on')});
$('#fundYes').onclick=()=>{const v=+$('#fundAmt').value;if(!(v>=1)){$('#fundAmt').style.borderColor='var(--red)';return}$('#fundAmt').style.borderColor='';
 const b=bots.find(x=>x.id===fundId);b.bal+=v;$('#fundOv').classList.remove('on');renderAll();toast(`${money(v)} added to <b>${esc(b.name)}</b>`,b.trading?null:'START',()=>toggle(b.id))};

/* side panel */
function openSide(id,scroll){sel=id;$('#stage').classList.add('open');renderAll();if(scroll){const r=$(`.row[data-id="${id}"]`);if(r)r.scrollIntoView({block:'center',behavior:'smooth'})}}
function closeSide(){sel=null;$('#stage').classList.remove('open');renderAll()}
function renderSide(){const el=$('#side');const b=bots.find(x=>x.id===sel);if(!b){el.innerHTML='';return}
 const ready=b.bal>=1;
 const status=b.trading?`<div class="why g">${fa('circle-play')}<div><b>Trading</b> · placing trades now</div></div>`
  :b.why?`<div class="why r">${fa('circle-pause')}<div><b>Paused by its ${esc(WHY[b.why]||b.why)}</b>${b.whyPct!=null?` at <span class="num">${(+b.whyPct).toFixed(1)}%</span>`:''}</div></div>`
  :`<div class="why n">${fa('circle-pause')}<div><b>Paused</b> · switched off</div></div>`;
 el.innerHTML=`<div class="sh"><span class="bdg lg">${fa(b.icon)}</span><div class="t"><div class="lbl">MY BOT</div><div class="nm">${esc(b.name)}</div><div class="tags"><span class="tag c">${esc(b.sym)}</span><span class="tag">${b.paper?'PRACTICE':'REAL MARKET'}</span>${b.risk?`<span class="tag ${b.risk==='high'?'r':b.risk==='low'?'g':''}">${esc(b.risk.toUpperCase())} RISK</span>`:''}</div></div><button class="ibtn x" id="sx" data-tip="Close (Esc)">${fa('xmark')}</button></div>
 <div class="sb">
  <div class="g2"><div class="tile"><div class="v num ${cls(b.pnl)}">${usd(b.pnl)}</div><div class="k">P&amp;L</div></div><div class="tile"><div class="v num">${b.trades?b.wr+'%':'N/A'}</div><div class="k">WIN RATE</div></div>
   <div class="tile"><div class="v num">${b.trades.toLocaleString('en-US')}</div><div class="k">TRADES</div></div><div class="tile"><div class="v num ${ready?'':'dn'}">${money(b.bal)}</div><div class="k">BALANCE</div></div></div>
  ${status}
  ${ready?'':`<div class="why r">${fa('triangle-exclamation')}<div>Can't trade: balance below the <b>$1.00</b> minimum stake.</div></div>`}
  ${b.rule?`<div><div class="lbl" style="margin-bottom:8px">DECIDES ON</div><div class="rbox">${esc(b.rule)}</div></div>`:''}
  <div>${b.ind&&b.ind.length?`<div class="kv"><span>Indicators</span><b>${esc(b.ind.join(' · '))}</b></div>`:''}
   <div class="kv"><span>Bot</span><b>${esc(b.species)}</b></div>
   <div class="kv"><span>Style</span><b>${esc((b.style||'').replace(/_/g,' '))}</b></div>
   <div class="kv"><span>Created</span><b class="num">${esc((b.created||'').slice(0,10))}</b></div>
   <div class="kv"><span>Last trade</span><b class="num">${esc(b.lastTrade?b.lastTrade.slice(0,16).replace('T',' '):'never')}</b></div></div>
 </div>
 <div class="sf"><a class="btn go" href="manage.html?id=${b.id}">${fa('sliders')}MANAGE</a><button class="btn cy" id="sfund">${fa('wallet')}FUND</button><button class="btn red" id="sdel">${fa('trash-can')}DELETE</button></div>`;
 $('#sx').onclick=closeSide;$('#sfund').onclick=()=>openFund(b.id);$('#sdel').onclick=()=>del(b.id)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#fundOv').classList.contains('on'))$('#fundOv').classList.remove('on');else if(sel)closeSide()}});

function renderAll(){renderHero();renderFilters();renderBoard();renderSide()}
renderAll();
</script>
</body>
</html>
