<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Usage</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: when the next build can go, beside three tanks (session, week, extra) filled to what is left; under them one
   table of what each build costs, the plans against the account's own week, and everything else folded. Signed in and
   signed out share the build. Every figure is computed from data.js. */
:root{
  --bg:#0a0e17; --deep:#06090f; --panel:#0d1520; --line:#1e3050;
  --text:#e6edf7; --muted:#a9b8cc; --dim:#7f93ad;
  --cyan:#00cfff; --green:#00ff88; --red:#ff4444; --blue:#3b82f6;
  --grid:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='28'><path d='M0 14 L28 0 L56 14 L28 28 Z' fill='none' stroke='%2300cfff' stroke-width='.8'/></svg>");
  --gutl:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 "JetBrains Mono",monospace;-webkit-font-smoothing:antialiased;position:relative;min-height:100vh}
body::before{content:"";position:absolute;inset:0 0 auto 0;height:760px;z-index:-1;pointer-events:none;opacity:.06;background-image:var(--grid);
  -webkit-mask-image:radial-gradient(ellipse 70% 100% at 70% 0,rgba(6,9,15,1),rgba(6,9,15,0) 75%);mask-image:radial-gradient(ellipse 70% 100% at 70% 0,rgba(6,9,15,1),rgba(6,9,15,0) 75%)}
body::after{content:"";position:absolute;inset:0 0 auto 0;height:820px;z-index:-2;pointer-events:none;
  background:radial-gradient(ellipse 640px 360px at 72% 340px,rgba(0,207,255,.08),transparent 70%),radial-gradient(ellipse 520px 300px at 20% 240px,rgba(0,255,136,.05),transparent 70%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{width:100%;max-width:1272px;margin:0 auto;padding-left:var(--gutl);padding-right:var(--gutr);padding-bottom:70px}
.back{display:block;max-width:1440px;margin:0 auto;padding-top:16px;padding-left:var(--gutl);padding-right:var(--gutr);color:var(--cyan);font-size:13px}

.app{display:flex;align-items:center;gap:26px;padding:18px 0 16px;border-bottom:1px solid rgba(30,48,80,.7)}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:46px;height:46px;flex:none}
.brand .w{display:flex;flex-direction:column;line-height:1.05}
.brand .w span{color:var(--cyan);font-size:9.5px;letter-spacing:.32em;font-weight:600}
.brand .w b{color:var(--text);font-size:16px;font-weight:800;letter-spacing:.02em;margin-top:3px}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.status b{color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(0,255,136,.18),0 0 10px rgba(0,255,136,.7);display:inline-block;flex:none}
.dot.r{background:var(--red);box-shadow:0 0 0 3px rgba(255,68,68,.18),0 0 10px rgba(255,68,68,.7)}
.dot.idle{background:var(--dim);box-shadow:none}

.glass{background:linear-gradient(180deg,rgba(13,21,32,.94),rgba(6,9,15,.96));border:1px solid rgba(30,48,80,.95);border-radius:20px;
  box-shadow:0 24px 60px rgba(6,9,15,.6),inset 0 1px 0 rgba(0,207,255,.06)}
.glow{border-color:rgba(0,255,136,.45);box-shadow:0 0 40px rgba(0,255,136,.12),0 24px 60px rgba(6,9,15,.6),inset 0 1px 0 rgba(0,255,136,.12)}
.glowc{border-color:rgba(0,207,255,.5);box-shadow:0 0 40px rgba(0,207,255,.12),0 24px 60px rgba(6,9,15,.6),inset 0 1px 0 rgba(0,207,255,.14)}
.cap{color:var(--cyan);font-size:10.5px;font-weight:700;letter-spacing:.22em}
.chip{font-size:10px;font-weight:800;letter-spacing:.09em;border-radius:6px;padding:3px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.g{color:var(--green);background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.38)}
.chip.c{color:var(--cyan);background:rgba(0,207,255,.08);border:1px solid rgba(0,207,255,.32)}
.chip.r{color:var(--red);background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.4)}
.chip.m{color:var(--muted);border:1px solid var(--line)}
.chip.s{color:var(--deep);background:var(--green);box-shadow:0 0 14px rgba(0,255,136,.45)}
.go{background:var(--green);border:0;color:var(--deep);border-radius:14px;font:800 15px Inter,sans-serif;letter-spacing:.05em;
  box-shadow:0 0 28px rgba(0,255,136,.42),inset 0 -2px 0 rgba(6,9,15,.2);display:flex;align-items:center;justify-content:center;gap:10px;transition:box-shadow .2s,transform .1s}
.go:hover{box-shadow:0 0 42px rgba(0,255,136,.66),inset 0 -2px 0 rgba(6,9,15,.2)}
.go svg{width:18px;height:18px;flex:none}
.ghost{background:transparent;border:1px solid rgba(0,207,255,.5);color:var(--cyan);border-radius:14px;font:700 14px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.ghost:hover{background:rgba(0,207,255,.08)}
.fine{margin-top:12px;color:var(--dim);font-size:11.5px;text-align:center}
.fine b{color:var(--muted)}
.fine button{color:var(--cyan);font-size:11.5px}

/* hero */
.hero{display:grid;grid-template-columns:560px 1fr;gap:28px;padding:30px 0 34px;align-items:center}
.hero>*{min-width:0}
.pill{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border-radius:20px;border:1px solid rgba(0,255,136,.35);
  background:rgba(0,255,136,.07);color:var(--green);font-size:11.5px;font-weight:700;letter-spacing:.14em}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.pill.c{border-color:rgba(0,207,255,.4);background:rgba(0,207,255,.07);color:var(--cyan)}
.pill.c i{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.pills{display:flex;gap:10px;flex-wrap:wrap}
h1{font:41px/1.08 "Archivo Black",sans-serif;margin:18px 0 12px;letter-spacing:-.015em}
h1 em{font-style:normal;color:var(--green)}
.sub{color:var(--muted);font-size:14px}
.sub b{color:var(--text);font-weight:700}
.card{margin-top:22px;padding:20px 22px 18px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.big{font:60px/1.04 "Archivo Black",sans-serif;margin:10px 0 4px;white-space:nowrap}
.big.c{color:var(--cyan);text-shadow:0 0 34px rgba(0,207,255,.45)}
.big.g{color:var(--green);text-shadow:0 0 34px rgba(0,255,136,.45)}
.big small{font-size:24px;margin-left:6px}
.when{color:var(--muted);font-size:12.5px}
.when b{color:var(--text)}
.edit{display:none;align-items:center;gap:8px;margin-top:12px;background:var(--deep);border:1px solid rgba(0,207,255,.42);border-radius:12px;padding:8px 10px 8px 14px}
.edit.on{display:flex}
.edit span{color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.14em}
.edit input{flex:1;width:0;background:transparent;border:0;outline:0;font:20px "Archivo Black",sans-serif}
.edit button{border:1px solid rgba(0,255,136,.5);color:var(--green);border-radius:9px;padding:7px 12px;font-weight:800;font-size:12px}
.tankwrap{text-align:center}
.tanks{display:block;width:100%;height:auto;max-height:560px}
.surf{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(2px)}}
.halo{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.fcap{margin-top:2px;color:var(--dim);font-size:11.5px}

/* sections */
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:34px 0 14px}
h2{font:28px/1.2 "Archivo Black",sans-serif}
.sechead p{color:var(--dim);font-size:12.5px;margin-top:4px}
.seg{display:inline-flex;gap:4px;background:rgba(13,21,32,.8);border:1px solid rgba(30,48,80,.9);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{padding:6px 14px;border-radius:9px;color:var(--dim);font-size:12px;font-weight:700}
.seg button.on{color:var(--deep);background:var(--green)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:16px}
.dc{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.dc b{font:13px "Archivo Black",sans-serif;color:var(--text)}
.dc .col{width:38px;height:90px;border-radius:7px;background:rgba(30,48,80,.5);display:flex;align-items:flex-end;overflow:hidden}
.dc .col i{display:block;width:100%;background:linear-gradient(0deg,var(--cyan),var(--green));opacity:.7}
.dc.t span{color:var(--green)}
.dc.t .col i{opacity:1;box-shadow:0 0 14px rgba(0,255,136,.5)}
.kinds{display:grid;gap:8px;margin-bottom:14px}
.kd{display:grid;grid-template-columns:minmax(220px,300px) 1fr 80px 46px;gap:14px;align-items:center;font-size:12.5px}
.kd b{font:600 13px Inter,sans-serif}
.kd span{color:var(--dim);text-align:right}
.kd em{font-style:normal;text-align:right;font:15px "Archivo Black",sans-serif}
.items{border-top:1px solid rgba(30,48,80,.8)}
.day{display:flex;justify-content:space-between;padding:12px 0;color:var(--cyan);font-size:10.5px;font-weight:700;letter-spacing:.2em;border-bottom:1px solid rgba(30,48,80,.8)}
.day span{color:var(--dim);letter-spacing:.08em}
.it{display:grid;grid-template-columns:40px minmax(240px,1fr) 90px 110px 240px 84px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(30,48,80,.5)}
.it:last-child{border-bottom:0}
.it:hover{background:rgba(0,207,255,.03)}
.kic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 11px Inter,sans-serif;color:var(--deep)}
.k-company_turn{background:linear-gradient(135deg,var(--cyan),var(--blue))}
.k-bb_request{background:linear-gradient(135deg,var(--green),var(--cyan))}
.k-bb_change{background:linear-gradient(135deg,var(--blue),var(--cyan))}
.k-other{background:linear-gradient(135deg,var(--dim),var(--line));color:var(--text)}
.it .w b{display:block;font:600 13px Inter,sans-serif}
.it .w small{color:var(--dim);font-size:11.5px}
.it time{color:var(--dim);font-size:12px}
.ub{height:6px;border-radius:4px;background:rgba(30,48,80,.9);overflow:hidden}
.ub i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 10px rgba(0,255,136,.5)}
.it .u{font:15px "Archivo Black",sans-serif;text-align:right}
.more{display:flex;justify-content:center;padding:14px 0 16px;color:var(--dim);font-size:12.5px;gap:16px;align-items:center}
.more button{color:var(--cyan);border:1px solid rgba(0,207,255,.45);border-radius:12px;padding:9px 18px;font-weight:700}

.plans{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:stretch}
.pc{padding:18px 18px 16px;display:flex;flex-direction:column;min-width:0;border-radius:18px}
.pc .h{display:flex;align-items:center;gap:8px}
.pc .h b{font:20px "Archivo Black",sans-serif}
.pc .h .mx{color:var(--cyan);font-weight:800;font-size:12px}
.pc .h .chip{margin-left:auto}
.pc .pr{font:34px/1.1 "Archivo Black",sans-serif;margin-top:12px;white-space:nowrap}
.pc .pr small{font:600 13px "JetBrains Mono",monospace;color:var(--dim);margin-left:4px}
.pc .al{color:var(--muted);font-size:11.5px;margin-top:4px;min-height:34px}
.pb{margin-top:12px}
.pb .t{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--dim)}
.pb .t em{font-style:normal;letter-spacing:0;font-size:12px;color:var(--green)}
.pb .t em.r{color:var(--red)}
.gbar{height:8px;border-radius:5px;background:rgba(30,48,80,.9);overflow:hidden;margin-top:6px}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 12px rgba(0,255,136,.5)}
.gbar i.r{background:var(--red);box-shadow:0 0 12px rgba(255,68,68,.5)}
.et10{margin-top:14px;font-size:11px;color:var(--cyan);border:1px dashed rgba(0,207,255,.45);border-radius:10px;padding:7px 10px}
.et10 b{color:var(--text)}
.pc details{margin-top:12px;border-top:1px solid rgba(30,48,80,.9)}
.pc summary{cursor:pointer;color:var(--dim);font-size:11.5px;padding:9px 0 0;list-style:none}
.pc summary::-webkit-details-marker{display:none}
.pc ul{list-style:none;margin-top:8px;display:grid;gap:6px;font-size:11.5px;color:var(--muted)}
.pc li::before{content:"\2713  ";color:var(--green);font-weight:800}
.pc .act{margin-top:auto;padding-top:16px}
.pc .act button{width:100%;padding:12px;border-radius:12px;font:800 13px Inter,sans-serif}
.pc .act .up{background:var(--green);color:var(--deep);box-shadow:0 0 18px rgba(0,255,136,.4)}
.pc .act .mv{border:1px solid var(--line);color:var(--muted)}
.pc .act .cur{border:1px solid rgba(0,255,136,.45);color:var(--green);cursor:default}
.pc .act .dyn{border:1px solid rgba(0,207,255,.5);color:var(--cyan)}
.rails{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.nolim{margin-top:12px;color:var(--green);font-size:11.5px;font-weight:700}

.tbl{overflow:hidden}
.tr{display:grid;grid-template-columns:minmax(240px,1.6fr) 110px repeat(4,1fr);align-items:center;padding:12px 22px;border-bottom:1px solid rgba(30,48,80,.55);font-size:12.5px}
.tr:last-child{border-bottom:0}
.tr.h{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.18em;border-bottom:1px solid rgba(30,48,80,.8)}
.tr b{font:600 13px Inter,sans-serif}
.tr .u{color:var(--muted)}
.tr .u .ms{color:var(--cyan);font-size:11.5px}
.tr .f{font:16px "Archivo Black",sans-serif;color:var(--green)}
.tr .f.no{font:600 11px "JetBrains Mono",monospace;color:var(--red)}
.tr .f.ms{font:600 11px "JetBrains Mono",monospace;color:var(--cyan)}
.tr .f small{font:500 10.5px "JetBrains Mono",monospace;color:var(--dim);margin-left:4px}
.tr .ot{opacity:.45}
.tr.h .me{color:var(--green)}
.tr.h .me i{font-style:normal;margin-left:6px;font-size:9px;padding:2px 6px}
.tr .f.me{text-shadow:0 0 16px rgba(0,255,136,.4)}

.how{margin-top:34px;padding:4px 22px}
.how details{border-bottom:1px solid rgba(30,48,80,.8)}
.how details:last-child{border-bottom:0}
.how summary{cursor:pointer;list-style:none;padding:15px 0;display:flex;justify-content:space-between;font:700 13px Inter,sans-serif;color:var(--text)}
.how summary::after{content:"+";color:var(--cyan);font-weight:800}
.how details[open] summary::after{content:"\2212"}
.how summary::-webkit-details-marker{display:none}
.how ul{margin:0 0 16px 18px;color:var(--muted);font-size:12.5px;display:grid;gap:7px}
.how p{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.ct{display:grid;grid-template-columns:1.6fr repeat(4,1fr);padding:8px 0;border-bottom:1px solid rgba(30,48,80,.5);font-size:12.5px}
.ct.h{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.16em}
.ct span:not(:first-child){text-align:right}
.ctw{margin-bottom:16px}

.signin{padding:26px 24px 22px;margin-top:22px}
.signin .go{width:100%;padding:17px;font-size:17px;margin-top:18px}
.signin .free{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.signin .edit{margin-top:12px}
.signin .top{display:flex;justify-content:space-between;align-items:center;gap:12px}

.ribbon{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(6px + env(safe-area-inset-top,0px));z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.ribbon b{color:var(--cyan);letter-spacing:.12em;font-size:10.5px}
.ribbon button{border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--muted);font-size:11px}
.ribbon button.on{border-color:rgba(0,255,136,.55);color:var(--green)}
.shot .ribbon{display:none}
.shot .surf,.shot .halo{animation:none}

@media (max-width:1100px){
  .hero{grid-template-columns:1fr}
  .plans{grid-template-columns:repeat(2,1fr)}
  .kd{grid-template-columns:1fr 1fr 70px 40px}
  .it{grid-template-columns:40px 1fr 84px}
  .it>.chipcell,.it time,.it .ub{display:none}
  .tr{grid-template-columns:minmax(150px,1.6fr) 70px repeat(4,1fr)}
}
@media (max-width:620px){
  .plans{grid-template-columns:1fr}
  .big{font-size:46px}
  h1{font-size:32px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ug" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#00cfff"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff88" stop-opacity=".78"/><stop offset="1" stop-color="#00cfff" stop-opacity=".42"/></linearGradient>
    <linearGradient id="liqside" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06090f" stop-opacity=".35"/><stop offset=".35" stop-color="#06090f" stop-opacity="0"/><stop offset=".8" stop-color="#06090f" stop-opacity="0"/><stop offset="1" stop-color="#06090f" stop-opacity=".45"/></linearGradient>
    <linearGradient id="glassg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00cfff" stop-opacity=".10"/><stop offset=".22" stop-color="#e6edf7" stop-opacity=".07"/><stop offset=".5" stop-color="#00cfff" stop-opacity=".02"/><stop offset="1" stop-color="#00cfff" stop-opacity=".10"/></linearGradient>
    <radialGradient id="ground"><stop offset="0" stop-color="#00cfff" stop-opacity=".16"/><stop offset="1" stop-color="#00cfff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gglow"><stop offset="0" stop-color="#00ff88" stop-opacity=".42"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/></radialGradient>
    <radialGradient id="rglow"><stop offset="0" stop-color="#ff4444" stop-opacity=".55"/><stop offset="1" stop-color="#ff4444" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="lat" width="56" height="28" patternUnits="userSpaceOnUse"><path d="M0 14 L28 0 L56 14 L28 28 Z" fill="none" stroke="#00cfff" stroke-opacity=".22" stroke-width=".8"/></pattern>
  </defs>
  <!-- the mark: an AI agent's round head inside a fuel gauge, the arc lit cyan to green -->
  <symbol id="logo" viewBox="0 0 64 64">
    <path d="M13.6 49.4 A26 26 0 1 1 50.4 49.4" fill="none" stroke="#1e3050" stroke-width="5" stroke-linecap="round"/>
    <path d="M13.6 49.4 A26 26 0 0 1 50.6 14.6" fill="none" stroke="url(#ug)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="50.6" cy="14.6" r="3.6" fill="#00ff88" filter="url(#soft)"/>
    <circle cx="32" cy="36" r="14" fill="#0d1520" stroke="#00cfff" stroke-width="2.2"/>
    <rect x="24.6" y="31.5" width="4.6" height="7.6" rx="2.3" fill="#00ff88" filter="url(#soft)"/>
    <rect x="34.8" y="31.5" width="4.6" height="7.6" rx="2.3" fill="#00ff88" filter="url(#soft)"/>
    <path d="M32 22 V17" stroke="#00cfff" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="ribbon" id="ribbon"><b>MOCKUP</b>
  <button data-st="live">Signed in</button><button data-st="ready">After 07:51</button><button data-st="out">Signed out</button>
</div>
<a class="back" href="#">&larr; Back</a>
<div class="wrap">
  <header class="app">
    <a class="brand" href="#"><svg><use href="#logo"/></svg><span class="w"><span>NEXUS BUILD</span><b>USAGE</b></span></a>
    <div class="status" id="status"></div>
  </header>

  <section class="hero">
    <div id="left"></div>
    <div class="tankwrap">
      <svg class="tanks" id="tanks" viewBox="0 0 660 520" role="img" aria-label="What is left in each window"></svg>
      <p class="fcap" id="tcap"></p>
    </div>
  </section>

  <section id="fitsec"></section>
  <section id="plansec"></section>
  <section class="glass how" id="how"></section>
</div>

<script src="data.js"></script>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const SHOT = Q.has("shot");
let STATE = Q.get("state") || "live";
let SHOWALL = false, OPEN = false, RANGE = "week";
const S = window.SNAP, DAY = window.DAY, P = window.PUB, DY = window.DYN, CO = window.COSTS;
const T0 = Date.now(), AS_OF = Date.parse(S.as_of);
const num = v => parseFloat(v) || 0;
const $ = id => document.getElementById(id);
if (SHOT) document.body.classList.add("shot");

/* ---- time and number formats: one place, so every figure on the page reads the same ---- */
function now() {
  const base = STATE === "ready" ? Date.parse(S.session.resets_at) + 60e3 : AS_OF;
  return base + (SHOT ? 0 : Date.now() - T0);
}
const pad = n => String(n).padStart(2, "0");
function dur(s) {
  s = Math.max(0, Math.round(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${pad(m)}m` : `${m}m`;
}
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function hm(t) { const d = new Date(t); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} UTC`; }
function hm12(t) { const d = new Date(t), h = d.getUTCHours(); return `${h % 12 || 12}:${pad(d.getUTCMinutes())} ${h < 12 ? "AM" : "PM"} UTC`; }
function dayname(t) { const d = new Date(t); return `${DOW[d.getUTCDay()]} ${MON[d.getUTCMonth()]} ${d.getUTCDate()}`; }
const u2 = v => num(v).toFixed(2);
const ua = v => num(v) >= 10 ? num(v).toFixed(0) : num(v).toFixed(2);  // an allowance: 120 u, not 120.00 u
const usd = v => "$" + num(v).toFixed(2);
const usd0 = v => "$" + num(v).toLocaleString("en-US", {maximumFractionDigits: 0});

/* ---- the one model every part of the page reads ---- */
const PLAN = P.plans.find(p => p.code === S.plan) || {};
function model() {
  const t = now();
  const sEnd = Date.parse(S.session.resets_at), wEnd = Date.parse(S.week.resets_at);
  const sActive = !!S.session.active && t < sEnd;
  const sCap = num(S.session.cap_units), wCap = num(S.week.cap_units);
  const sUsed = sActive ? num(S.session.used_units) : 0, wUsed = num(S.week.used_units);
  const x = S.extra_usage || {};
  const xCap = x.monthly_cap_usdc == null ? null : num(x.monthly_cap_usdc), xSpend = num(x.month_spend_usdc);
  const xLeft = !x.enabled ? 0 : xCap == null ? Infinity : Math.max(0, xCap - xSpend);
  const sLeft = Math.max(0, sCap - sUsed), wLeft = Math.max(0, wCap - wUsed);
  const left = Math.min(sLeft, wLeft);
  const canExtra = !!x.enabled && xLeft > 0;
  const blocked = left <= 0 && !canExtra;
  const opensAt = blocked ? (sLeft <= 0 ? sEnd : wEnd) : null;
  return {t, sActive, sCap, wCap, sUsed, wUsed, sLeft, wLeft, left, sEnd, wEnd, xOn: !!x.enabled, xCap, xSpend, xLeft, canExtra, blocked, opensAt};
}

/* ---- header status ---- */
function drawStatus(m) {
  const el = $("status");
  if (STATE === "out") { el.innerHTML = `<span class="dot idle"></span><b>NOT SIGNED IN</b>`; return; }
  el.innerHTML = m.blocked
    ? `<span class="dot r"></span><b>SESSION FULL</b> &middot; next build in <b>${dur((m.opensAt - m.t) / 1000)}</b>`
    : `<span class="dot"></span><b>READY</b> &middot; ${u2(m.left)} u this session &middot; ${u2(m.wLeft)} u this week`;
}

/* ---- left of the hero: when the next build can go ---- */
function fitsIn(units, cost) { return cost > 0 ? Math.floor(units / cost + 1e-9) : Infinity; }
const BB = P.filing_costs.find(f => f.kind === "bb_request");
function drawLeft(m) {
  const el = $("left");
  if (STATE === "out") {
    const free = P.plans.find(p => p.code === "free");
    el.innerHTML = `<div class="pills"><span class="pill c"><i></i>FREE TO START</span></div>
      <h1>Your build usage.<br><em>What's left, live.</em></h1>
      <p class="sub">Every NEXUS build counts against a <b>5-hour session</b> and a <b>week</b>.</p>
      <div class="glass glow signin">
        <span class="cap">SEE WHAT YOU HAVE LEFT</span>
        <div class="big g" style="font-size:44px">Log in</div>
        <div class="when">to see your session, your week and your extra usage, live</div>
        <button class="go">LOG IN</button>
        <div class="free"><span class="chip m">FREE &middot; ${u2(free.session_units)} u / 5h</span><span class="chip m">${u2(free.week_units)} u / week</span><span class="chip c">PRO FROM ${usd0(PLAN.price_usdc || 20)}/MO</span></div>
      </div>`;
    return;
  }
  // signed in: the same panel as signed out, the Log in swapped for the one answer (when, or how much)
  const xCapped = m.xOn && m.xCap != null && m.xSpend >= m.xCap;
  const resets = parseInt(S.limit_resets_available, 10) || 0;
  const nextPlan = P.plans[P.plans.findIndex(p => p.code === S.plan) + 1];
  let head;
  if (m.blocked) {
    head = `<div class="top"><span class="cap">NEXT BUILD IN</span><span class="chip r">${m.sLeft <= 0 ? "SESSION FULL" : "WEEK FULL"}</span></div>
      <div class="big c" id="cd">${dur((m.opensAt - m.t) / 1000)}</div>
      <div class="when">at <b>${hm(m.opensAt)}</b> &middot; ${xCapped ? `extra usage is at its ${usd(m.xCap)} limit` : m.sLeft <= 0 ? "a new session starts" : "your week resets"}</div>`;
  } else {
    const n = fitsIn(m.left, num(BB.units));
    head = `<div class="top"><span class="cap">READY TO BUILD</span><span class="chip g">${m.sActive ? "SESSION ENDS " + hm(m.sEnd) : "SESSION NOT STARTED"}</span></div>
      <div class="big g">${u2(m.left)}<small>u</small></div>
      <div class="when">left now &middot; <b>${n} Build it Better request${n === 1 ? "" : "s"}</b> fit${n === 1 ? "s" : ""}</div>`;
  }
  const go = resets > 0 ? `<button class="go" id="usereset">USE A LIMIT RESET</button>`
    : !m.xOn ? `<button class="go">TURN ON EXTRA USAGE</button>`
    : xCapped ? `<button class="go" id="raise">RAISE EXTRA LIMIT</button>`
    : nextPlan ? `<button class="go">UPGRADE TO ${nextPlan.name.toUpperCase()}</button>` : "";
  el.innerHTML = `<div class="pills"><span class="pill"><i></i>${(S.plan_name || S.plan).toUpperCase()} &middot; ${usd0(S.price_usdc)}/MO</span></div>
    <h1>Your build usage.<br><em>What's left, live.</em></h1>
    <p class="sub">Every NEXUS build counts against a <b>5-hour session</b> and a <b>week</b>.</p>
    <div class="glass ${m.blocked ? "glowc" : "glow"} signin">${head}${go}
      <div class="edit" id="edit"><span>MONTHLY LIMIT $</span><input value="${m.xCap == null ? "" : m.xCap.toFixed(2)}" inputmode="decimal"><button>SAVE</button></div>
      <div class="edit" id="rs"><span>RESET WHICH?</span><i style="flex:1"></i><button>SESSION</button><button>WEEK</button></div>
      <div class="free"><span class="chip m">${ua(m.sCap)} u / 5h</span><span class="chip m">${ua(m.wCap)} u / week</span><span class="chip m">${resets} LIMIT RESET${resets === 1 ? "" : "S"}</span><button class="chip c">EXTRA ${m.xOn ? "ON &middot; TURN OFF" : "OFF &middot; TURN ON"}</button></div>
    </div>`;
  const r = $("raise"); if (r) r.onclick = () => $("edit").classList.toggle("on");
  const u = $("usereset"); if (u) u.onclick = () => $("rs").classList.toggle("on");
}

/* ---- right of the hero: three tanks, each as full as what is left in its window ---- */
function tank(cx, by, f) {
  const rx = 66, ry = 25, H = 248, top = by - H;
  const lvl = by - H * Math.max(0, Math.min(1, f.frac));
  const empty = !f.off && f.frac <= 0.001;
  const P0 = 16;  // the plinth the tank stands on
  let s = "";
  const tone = f.off ? "#7f93ad" : empty ? "#ff4444" : "#00ff88";
  if (!f.off) s += `<ellipse cx="${cx}" cy="${by + P0 + 4}" rx="${rx * 1.55}" ry="${ry * 1.7}" fill="url(#${empty ? "rglow" : "gglow"})" ${empty ? 'class="halo"' : ""}/>`;
  s += `<path d="M${cx - rx - 8} ${by} L${cx - rx - 8} ${by + P0} A${rx + 8} ${ry + 3} 0 0 0 ${cx + rx + 8} ${by + P0} L${cx + rx + 8} ${by} Z" fill="#0d1520" stroke="#1e3050"/>`;
  s += `<path d="M${cx - rx - 8} ${by + P0} A${rx + 8} ${ry + 3} 0 0 0 ${cx + rx + 8} ${by + P0}" fill="none" stroke="${tone}" stroke-opacity=".7" stroke-width="1.6" filter="url(#soft)"/>`;
  s += `<ellipse cx="${cx}" cy="${by}" rx="${rx + 8}" ry="${ry + 3}" fill="#0d1520" stroke="#00cfff" stroke-opacity=".35"/>`;
  // back wall and back rim
  s += `<path d="M${cx - rx} ${top} L${cx - rx} ${by} A${rx} ${ry} 0 0 0 ${cx + rx} ${by} L${cx + rx} ${top} A${rx} ${ry} 0 0 0 ${cx - rx} ${top} Z" fill="#06090f" fill-opacity=".55"/>`;
  s += `<ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="${ry}" fill="none" stroke="#00cfff" stroke-opacity=".35" stroke-width="1.2"/>`;
  s += `<ellipse cx="${cx}" cy="${by}" rx="${rx}" ry="${ry}" fill="#0d1520" stroke="#1e3050" stroke-width="1.2"/>`;
  if (f.off) {
    // nothing to hold: the tank stays dark
  } else if (!empty) {
    s += `<path d="M${cx - rx} ${lvl} L${cx - rx} ${by} A${rx} ${ry} 0 0 0 ${cx + rx} ${by} L${cx + rx} ${lvl} A${rx} ${ry} 0 0 1 ${cx - rx} ${lvl} Z" fill="url(#liq)"/>`;
    s += `<path d="M${cx - rx} ${lvl} L${cx - rx} ${by} A${rx} ${ry} 0 0 0 ${cx + rx} ${by} L${cx + rx} ${lvl} A${rx} ${ry} 0 0 1 ${cx - rx} ${lvl} Z" fill="url(#liqside)"/>`;
    s += `<g class="surf"><ellipse cx="${cx}" cy="${lvl}" rx="${rx}" ry="${ry}" fill="#00ff88" fill-opacity=".55" filter="url(#soft)"/>
      <ellipse cx="${cx}" cy="${lvl}" rx="${rx - 2}" ry="${ry - 2}" fill="none" stroke="#e6edf7" stroke-opacity=".35" stroke-width="1"/></g>`;
  } else {
    s += `<ellipse cx="${cx}" cy="${by}" rx="${rx - 8}" ry="${ry - 5}" fill="#ff4444" fill-opacity=".22" filter="url(#soft)" class="halo"/>`;
  }
  // ticks at a quarter, half, three quarters
  for (const q of [0.25, 0.5, 0.75]) {
    const y = by - H * q + ry * 0.55;
    s += `<path d="M${cx - rx + 8} ${y} l14 3" stroke="#00cfff" stroke-opacity=".45" stroke-width="1.2"/>`;
  }
  // front glass, front rim
  s += `<path d="M${cx - rx} ${top} L${cx - rx} ${by} A${rx} ${ry} 0 0 0 ${cx + rx} ${by} L${cx + rx} ${top} A${rx} ${ry} 0 0 1 ${cx - rx} ${top} Z" fill="url(#glassg)" stroke="#00cfff" stroke-opacity=".5" stroke-width="1.4"/>`;
  s += `<path d="M${cx - rx + 14} ${top + 30} L${cx - rx + 14} ${by - 14}" stroke="#e6edf7" stroke-opacity=".12" stroke-width="6" stroke-linecap="round"/>`;
  // the cap: a collar round the rim
  s += `<path d="M${cx - rx} ${top} A${rx} ${ry} 0 0 0 ${cx + rx} ${top}" fill="none" stroke="#00cfff" stroke-opacity=".75" stroke-width="3"/>`;
  // badge over the rim
  s += `<g transform="translate(${cx} ${top - 46})"><circle r="25" fill="#06090f" stroke="${tone}" stroke-width="2" filter="url(#soft)"/>
    <text y="5" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="14" fill="${tone}">${f.badge}</text></g>`;
  if (f.over) s += `<g transform="translate(${cx} ${top - 92})"><rect x="-76" y="-13" width="152" height="25" rx="7" fill="#06090f" stroke="#ff4444" stroke-opacity=".6"/>
    <text y="4" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="800" font-size="11" fill="#ff4444">${f.over}</text></g>`;
  // what is left, under the tank, haloed off the lattice
  const halo = `stroke="#0a0e17" stroke-width="7" stroke-linejoin="round" paint-order="stroke"`;
  s += `<text x="${cx}" y="${by + P0 + 50}" text-anchor="middle" font-family="Archivo Black,sans-serif" font-size="27" fill="${tone}" ${halo}>${f.left}</text>`;
  s += `<text x="${cx}" y="${by + P0 + 70}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#a9b8cc" ${halo}>${f.of}</text>`;
  s += `<text x="${cx}" y="${by + P0 + 88}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="${f.refillHot ? "#00cfff" : "#7f93ad"}" ${halo}>${f.refill}</text>`;
  s += `<text x="${cx}" y="${top + H / 2 + 6}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="11" letter-spacing="2.5" fill="#e6edf7" fill-opacity=".8">${f.name}</text>`;
  return s;
}
function drawTanks(m) {
  const by = 380;
  let s = `<ellipse cx="330" cy="${by + 16}" rx="330" ry="118" fill="url(#ground)"/>
    <path d="M330 ${by - 94} L650 ${by + 16} L330 ${by + 126} L10 ${by + 16} Z" fill="url(#lat)" stroke="#00cfff" stroke-opacity=".28"/>`;
  let T;
  if (STATE === "out") {
    const free = P.plans.find(p => p.code === "free");
    T = [{name: "SESSION", badge: "5H", frac: 1, left: `${u2(free.session_units)} u`, of: "per 5 hours, Free", refill: ""},
         {name: "WEEK", badge: "7D", frac: 1, left: `${u2(free.week_units)} u`, of: "per week, Free", refill: ""},
         {name: "EXTRA", badge: "$", off: true, frac: 0, left: "paid", of: "plans only", refill: ""}];
  } else {
    T = [{name: "SESSION", badge: "5H", frac: m.sLeft / m.sCap, left: `${u2(m.sLeft)} u`, of: `left of ${u2(m.sCap)} u`,
          refill: m.sActive ? `refills in ${dur((m.sEnd - m.t) / 1000)}` : "starts with your next build", refillHot: m.sActive && m.sLeft <= 0,
          over: m.sUsed > m.sCap ? `+${u2(m.sUsed - m.sCap)} u ON EXTRA` : ""},
         {name: "WEEK", badge: "7D", frac: m.wLeft / m.wCap, left: `${u2(m.wLeft)} u`, of: `left of ${u2(m.wCap)} u`,
          refill: `refills ${DOW[new Date(m.wEnd).getUTCDay()]} ${hm12(m.wEnd)}`, over: m.wUsed > m.wCap ? `+${u2(m.wUsed - m.wCap)} u ON EXTRA` : ""},
         !m.xOn ? {name: "EXTRA", badge: "$", off: true, frac: 0, left: "off", of: "pay as you go", refill: "turn on to build past a window"}
         : {name: "EXTRA", badge: "$", frac: m.xCap == null ? 1 : m.xLeft / m.xCap, left: m.xCap == null ? "no limit" : usd(m.xLeft),
            of: m.xCap == null ? `${usd(m.xSpend)} this month` : `left of ${usd(m.xCap)} this month`, refill: "your monthly limit",
            over: m.xCap != null && m.xSpend > m.xCap ? `${usd(m.xSpend)} SPENT` : ""}];
  }
  s += tank(150, by, T[0]) + tank(330, by - 20, T[1]) + tank(510, by, T[2]);
  $("tanks").innerHTML = s;
  $("tcap").textContent = STATE === "out" ? "The Free plan's allowance. Paid plans add more, and extra usage past it."
    : "What's left in each window. A tank refills when its window resets.";
}

/* ---- what each build costs: one table, signed in or out; signed in, your plan's column is lit ---- */
const SHORT = {bb_request: "Build it Better request", bb_change: "Build it Better scope change", feature_request: "Feature request",
  startup: "Startup application", creator_artifact: "Creator page", clone_bot: "Bot clone", nexus_build_turn: "NEXUS build conversation turn",
  company_turn: "Build a Company agent turn", feature_bid: "Feature bid", startup_bid: "Startup bid"};
function drawFits(m) {
  const el = $("fitsec"), out = STATE === "out", plans = P.plans;
  const me = p => !out && p.code === S.plan;
  let rows = `<div class="tr h"><span>FILING</span><span>UNITS</span>${plans.map(p => `<span class="${me(p) ? "me" : out ? "" : "ot"}">${p.name.toUpperCase()}${me(p) ? ` <i class="chip s">YOURS</i>` : ""}</span>`).join("")}</div>`;
  for (const f of P.filing_costs) {
    const c = num(f.units), measured = /measured/.test(f.charged || "");
    // a measured turn is charged what it ran, so its 0.05 is a reserve, not a price: show the account's own average
    const own = (S.items || []).filter(i => i.kind === f.kind).map(i => num(i.units));
    const unit = !measured ? (c ? c.toFixed(2) : "0")
      : !out && own.length ? `<span class="ms">&asymp;${(own.reduce((a, b) => a + b, 0) / own.length).toFixed(2)} yours</span>` : `<span class="ms">measured</span>`;
    rows += `<div class="tr"><b>${SHORT[f.kind] || f.label}</b><span class="u">${unit}</span>` + plans.map(p => {
      const cls = me(p) ? " me" : out ? "" : " ot";
      if (!c) return `<span class="f${cls}">free</span>`;
      if (measured) return `<span class="f ms${cls}">measured</span>`;
      const k = fitsIn(num(p.session_units), c);
      return k ? `<span class="f${cls}">${k}<small>a session</small></span>` : `<span class="f no${cls}">too big</span>`;
    }).join("") + `</div>`;
  }
  el.innerHTML = `<div class="sechead"><div><h2>What each build costs</h2><p>How many fit in one 5-hour session on each plan.</p></div></div>
    <div class="glass tbl">${rows}</div>`;
}

/* ---- where it went: folded at the bottom, signed in only ---- */
const KCOL = {company_turn: "#00cfff", bb_request: "#00ff88", bb_change: "#3b82f6"};
const KIC = {company_turn: "CO", bb_request: "BB", bb_change: "SC", feature_request: "FR", startup: "SU", creator_artifact: "CP", clone_bot: "BC", nexus_build_turn: "NX"};
const DEPT = r => { const p = String(r || "").split(":"); return p.length >= 2 ? p[1].replace(/_/g, " ").replace(/^./, c => c.toUpperCase()) : ""; };
// the live page's own toggle (Day | Week) and its 7-day chart, kept inside the fold
function days() {
  const H = S.history || [], max = Math.max(...H.map(h => num(h.units)), 0.01);
  return `<div class="days">${H.map((h, i) => {
    const v = num(h.units), today = i === H.length - 1, d = new Date(h.day + "T12:00:00Z");
    return `<div class="dc${today ? " t" : ""}"><b>${v ? v.toFixed(2) : "0"}</b><div class="col"><i style="height:${v ? Math.max(4, 100 * v / max) : 0}%"></i></div><span>${today ? "today" : DOW[d.getUTCDay()] + " " + d.getUTCDate()}</span></div>`;
  }).join("")}</div>`;
}
function went() {
  const day = RANGE === "day";
  const bd = (day ? DAY.breakdown : S.breakdown).filter(b => num(b.units) > 0);
  const tot = bd.reduce((a, b) => a + num(b.units), 0);
  const since = day ? Date.parse(DAY.as_of) - 864e5 : 0;
  const items = (S.items || []).filter(i => Date.parse(i.at) >= since);
  const maxU = Math.max(...items.map(i => num(i.units)), 0.01);
  const shown = SHOWALL ? items : items.slice(0, 10);
  const kinds = bd.map(b => `<div class="kd"><b>${b.label}</b><div class="ub"><i style="width:${Math.max(2, b.pct)}%;background:${KCOL[b.kind] || "#7f93ad"};box-shadow:none"></i></div><span>${u2(b.units)} u</span><em>${b.pct}%</em></div>`).join("");
  const dayTot = {};
  for (const i of items) { const d = i.at.slice(0, 10); dayTot[d] = (dayTot[d] || 0) + num(i.units); }
  let rows = "", lastDay = "";
  for (const i of shown) {
    const d = i.at.slice(0, 10);
    if (d !== lastDay) {
      const n = items.filter(x => x.at.slice(0, 10) === d).length;
      rows += `<div class="day"><b>${d === S.as_of.slice(0, 10) ? "TODAY &middot; " : ""}${dayname(i.at).toUpperCase()}</b><span>${u2(dayTot[d])} u &middot; ${n} item${n === 1 ? "" : "s"}</span></div>`;
      lastDay = d;
    }
    const isTurn = /_turn$/.test(i.kind);
    const what = isTurn ? DEPT(i.ref) : (i.ref || "").split(":")[0];
    const link = i.link ? `<a href="${i.link}">${what}</a>` : what;  // linked when the item carries a link, as today
    rows += `<div class="it"><span class="kic ${KCOL[i.kind] ? "k-" + i.kind : "k-other"}">${KIC[i.kind] || "&bull;"}</span>
      <div class="w"><b>${SHORT[i.kind] || i.label}</b><small>${link}</small></div>
      <span class="chipcell">${i.overage ? `<span class="chip c">EXTRA</span>` : ""}</span>
      <time>${hm(i.at)}</time>
      <div class="ub"><i style="width:${Math.max(3, 100 * num(i.units) / maxU)}%"></i></div>
      <b class="u">${u2(i.units)}</b></div>`;
  }
  const extraN = items.filter(i => i.overage).length;
  return `<details${OPEN ? " open" : ""} id="went"><summary>Where it went &middot; ${u2(tot)} u in the last ${day ? "24 hours" : "7 days"} &middot; ${extraN} of ${items.length} on extra usage</summary>
    <div class="seg"><button data-r="week" class="${day ? "" : "on"}">7 days</button><button data-r="day" class="${day ? "on" : ""}">24 hours</button></div>
    ${day ? "" : days()}<div class="kinds">${kinds}</div><div class="items">${rows}</div>
    ${items.length > 10 ? `<div class="more"><span>Showing ${shown.length} of ${items.length}</span><button id="all">${SHOWALL ? "Show fewer" : "Show all " + items.length}</button></div>` : ""}</details>`;
}

/* ---- plans, against this account's own week ---- */
function drawPlans(m) {
  const el = $("plansec"), out = STATE === "out";
  const cur = P.plans.findIndex(p => p.code === S.plan);
  const maxWeek = Math.max(...P.plans.map(p => num(p.week_units)));
  let cards = "";
  P.plans.forEach((p, i) => {
    const on = !out && p.code === S.plan, price = num(p.price_usdc);
    const wPct = 100 * m.wUsed / num(p.week_units);
    const bar = out
      ? `<div class="pb"><div class="t"><span>WEEKLY ALLOWANCE</span><em>${ua(p.week_units)} u</em></div><div class="gbar"><i style="width:${Math.max(2, 100 * Math.sqrt(num(p.week_units) / maxWeek))}%"></i></div></div>`
      : `<div class="pb"><div class="t"><span>YOUR WEEK</span><em class="${wPct > 100 ? "r" : ""}">${u2(m.wUsed)} / ${ua(p.week_units)} u</em></div>
         <div class="gbar"><i class="${wPct > 100 ? "r" : ""}" style="width:${Math.min(100, Math.max(2, wPct))}%"></i></div></div>`;
    const feats = (p.features || []).filter(f => !/^Limited time/.test(f));
    const act = out ? (price ? `<button class="up">LOG IN TO SUBSCRIBE</button>` : `<button class="mv">START FREE</button>`)
      : on ? `<button class="cur">CURRENT PLAN</button>` : i > cur ? `<button class="up">UPGRADE &middot; ${usd0(price)}/MO</button>` : `<button class="mv">Move to ${p.name} at period end</button>`;
    cards += `<div class="glass pc ${on ? "glow" : ""}">
      <div class="h"><b>${p.name}</b><span class="mx">${p.multiplier}&times;</span>${on ? `<span class="chip s">YOURS</span>` : ""}</div>
      <div class="pr">${price ? usd0(price) : "$0"}<small>/mo</small></div>
      <div class="al">${ua(p.session_units)} u / ${p.session_hours}h &middot; ${ua(p.week_units)} u / week</div>
      ${bar}
      ${p.et10_offer ? `<div class="et10">+<b>${p.et10_offer.et10_per_month.toLocaleString("en-US")} ET10</b> every month paid by ${p.et10_offer.ends_label.replace(/, \d+$/, "")}</div>` : ""}
      <details><summary>What's included &#9662;</summary><ul>${feats.map(f => `<li>${f}</li>`).join("")}</ul></details>
      <div class="act">${act}</div></div>`;
  });
  const dyn = P.dynamic;
  if (dyn && dyn.available) {
    const fc = DY && DY.forecast;
    cards += `<div class="glass pc glowc">
      <div class="h"><b>${dyn.name}</b><span class="mx">pay per use</span></div>
      <div class="pr" style="font-size:28px">${!out && fc ? usd(fc.with_fee_usd) : "cost"}<small>${!out && fc ? "/30 d" : "+" + dyn.fee_pct + "%"}</small></div>
      <div class="al">${!out && fc ? `forecast: ${fc.basis}, + ${dyn.fee_pct}% fee` : "the measured compute of what you build, plus a " + dyn.fee_pct + "% fee"}</div>
      <div class="nolim">&#10003; no 5-hour or weekly limit</div>
      <div class="rails">${(dyn.rails || []).map(r => `<span class="chip ${r === "usdc" ? "m" : "c"}">${{usdc: "USDC", brrr: "BRRR &minus;5%", buy_brrr: "BUY BRRR"}[r] || r}</span>`).join("")}</div>
      <details><summary>What's included &#9662;</summary><ul>${(dyn.features || []).map(f => `<li>${f}</li>`).join("")}</ul></details>
      <div class="act"><button class="dyn">${out ? "LOG IN TO SEE YOUR FORECAST" : "SWITCH TO DYNAMIC"}</button></div></div>`;
  }
  el.innerHTML = `<div class="sechead"><div><h2>Plans</h2><p>${out ? "Paid plans add more every 5 hours and every week." : "Bars: your week so far, against each plan."}</p></div></div>
    <div class="plans">${cards}</div>`;
}

/* ---- folded at the bottom: where it went (signed in), then the explanations ---- */
function drawHow() {
  const how = ["A session starts with your first build request and lasts 5 hours. When it ends, the next request starts a fresh one.",
    "The weekly window resets at a fixed time each week, assigned to your account when you subscribed.",
    "Usage is measured in units of compute: a build conversation turn adds what it cost; a filing adds a fixed weight.",
    "Paid plans can turn on extra usage to keep building past a window, paid from your own USDC up to a monthly limit you set, and get one saveable limit reset a week.",
    "Paying subscribers are served first: when NEXUS or agent-to-agent questions are waiting in a queue, Max 20x, Max 5x and Pro accounts run ahead of free accounts, in arrival order within each plan. A free question keeps its place and is never dropped for it."];
  const ct = `<div class="ct h"><span>RUN</span><span>RUNS</span><span>MEAN</span><span>MEDIAN</span><span>P90</span></div>` +
    CO.items.map(c => `<div class="ct"><span>${c.label}</span><span>${c.runs.toLocaleString("en-US")}</span><span>$${c.mean_usd}</span><span>$${c.p50_usd}</span><span>$${c.p90_usd}</span></div>`).join("");
  $("how").innerHTML = (STATE === "out" ? "" : went()) +
    `<details><summary>How the windows work</summary><ul>${how.map(h => `<li>${h}</li>`).join("")}</ul></details>
    <details><summary>When a build is refused</summary><p>${P.limit_rule}</p></details>
    <details><summary>What each app and feature costs to run &middot; last ${CO.window_days} days</summary><div class="ctw">${ct}</div></details>`;
  const a = $("all"); if (a) a.onclick = () => { SHOWALL = !SHOWALL; drawHow(); };
  const w = $("went"); if (w) w.ontoggle = () => { OPEN = w.open; };
  document.querySelectorAll("#how [data-r]").forEach(b => b.onclick = () => { RANGE = b.dataset.r; SHOWALL = false; drawHow(); });
}

function draw() {
  const m = model();
  drawStatus(m); drawLeft(m); drawTanks(m); drawFits(m); drawPlans(m); drawHow();
  document.querySelectorAll("#ribbon [data-st]").forEach(b => b.classList.toggle("on", b.dataset.st === STATE));
}
document.querySelectorAll("#ribbon [data-st]").forEach(b => b.onclick = () => { STATE = b.dataset.st; draw(); });
draw();
if (!SHOT) setInterval(() => { const m = model(); drawStatus(m); drawTanks(m); const cd = $("cd"); if (cd && m.blocked) cd.textContent = dur((m.opensAt - m.t) / 1000); }, 1000);
</script>
</body>
</html>
