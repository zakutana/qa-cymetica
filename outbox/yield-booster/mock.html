<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yield Booster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2306090f'/%3E%3Cpath d='M32 9C32 9 16 25 16 39a16 16 0 0 0 32 0C48 25 32 9 32 9Z' fill='%2300ff88'/%3E%3Cpath d='M24 41l8-8 8 8M24 50l8-8 8 8' fill='none' stroke='%2306090f' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Four steps on one page: pick a risk, an amount, the finder looks, the route flows through pipes. */
:root{
  --bg:#0a0e17; --deep:#06090f; --panel:#0d1520; --line:#1e3050;
  --text:#e6edf7; --muted:#a9b8cc; --dim:#7f93ad;
  --cyan:#00cfff; --green:#00ff88; --red:#ff4444; --blue:#3b82f6;
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font:13px/1.45 "JetBrains Mono",monospace;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden}
body::after{content:"";position:absolute;inset:0 0 auto 0;height:900px;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 700px 380px at 78% 260px,rgba(0,255,136,.07),transparent 70%),radial-gradient(ellipse 600px 340px at 18% 200px,rgba(0,207,255,.06),transparent 70%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--gut) 80px}

/* header: the mark, the name, where you are */
.app{display:flex;align-items:center;gap:28px;padding:18px 0 16px;border-bottom:1px solid rgba(30,48,80,.7)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand svg{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 12px rgba(0,255,136,.35))}
.brand .w{display:flex;flex-direction:column;line-height:1.05}
.brand .w span{color:var(--cyan);font-size:9.5px;letter-spacing:.32em;font-weight:600}
.brand .w b{font:19px "Archivo Black",sans-serif;letter-spacing:.01em;margin-top:4px}
.brand .w b em{font-style:normal;color:var(--green)}
.steps{display:flex;gap:4px;background:rgba(13,21,32,.8);border:1px solid rgba(30,48,80,.9);border-radius:12px;padding:4px}
.steps button{padding:8px 15px;border-radius:9px;color:var(--dim);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.steps button i{font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px}
.steps button.on{color:var(--deep);background:var(--green)}
.steps button.on i{border-color:var(--deep)}
.steps button.done{color:var(--muted)}
.steps button.done i{background:rgba(0,255,136,.15);border-color:rgba(0,255,136,.5);color:var(--green)}
.steps button[disabled]{cursor:default}
.trust{margin-left:auto;display:flex;gap:8px}
.chip{font-size:10px;font-weight:800;letter-spacing:.09em;border-radius:6px;padding:4px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.g{color:var(--green);background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.38)}
.chip.c{color:var(--cyan);background:rgba(0,207,255,.07);border:1px solid rgba(0,207,255,.32)}
.chip.r{color:var(--red);background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.45)}
.chip.m{color:var(--muted);border:1px solid var(--line)}
.chip svg{width:12px;height:12px}

.view{display:none;padding-top:34px}
.view.on{display:block;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}
h1{font:40px/1.05 "Archivo Black",sans-serif;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--green)}
.cap{color:var(--cyan);font-size:10.5px;font-weight:700;letter-spacing:.22em}
.tip{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-size:10px;font-weight:800;cursor:help;vertical-align:middle}
.tip:hover{color:var(--cyan);border-color:var(--cyan)}

/* the move: one assumption every figure is computed from */
.move{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.14em}
.seg{display:flex;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 13px;border-radius:7px;color:var(--muted);font-size:13px;font-weight:800;letter-spacing:0}
.seg button.on{background:rgba(0,207,255,.14);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(0,207,255,.5)}

/* step 1: four tiers */
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.tier{position:relative;text-align:left;border-radius:20px;padding:22px 22px 20px;background:linear-gradient(180deg,rgba(13,21,32,.95),rgba(6,9,15,.97));
  border:1px solid rgba(30,48,80,.95);box-shadow:0 24px 60px rgba(6,9,15,.55);transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column;min-height:290px}
.tier:hover{transform:translateY(-3px);border-color:rgba(0,255,136,.5);box-shadow:0 0 36px rgba(0,255,136,.12),0 24px 60px rgba(6,9,15,.55)}
.tier.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 44px rgba(0,255,136,.2),0 24px 60px rgba(6,9,15,.55)}
.tier .top{display:flex;justify-content:space-between;align-items:center}
.tier h3{font:21px "Archivo Black",sans-serif}
.bars{display:flex;gap:3px;align-items:flex-end}
.bars i{width:7px;border-radius:2px;background:var(--line)}
.bars i:nth-child(1){height:8px}.bars i:nth-child(2){height:12px}.bars i:nth-child(3){height:16px}.bars i:nth-child(4){height:20px}
.bars i.on{background:var(--green)}
.tier.t0 .bars i.on{background:var(--cyan)}
.tier .say{color:var(--dim);font-size:11.5px;margin-top:6px;min-height:34px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 16px;padding:14px 0;border-top:1px solid rgba(30,48,80,.7);border-bottom:1px solid rgba(30,48,80,.7)}
.pair small{display:block;color:var(--dim);font-size:9.5px;font-weight:700;letter-spacing:.16em}
.pair b{display:block;font:30px/1.15 "Archivo Black",sans-serif;margin:6px 0 2px;white-space:nowrap}
.pair span{font-size:11.5px;font-weight:700}
.pair .up b{color:var(--green);text-shadow:0 0 22px rgba(0,255,136,.35)}
.pair .up span{color:var(--green)}
.pair .dn b,.pair .dn span{color:var(--red)}
.pair .dn.flat b,.pair .dn.flat span{color:var(--muted)}
.pair .dn b{text-shadow:none}
.tier .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tier.t0 .pair .up b{color:var(--cyan);text-shadow:0 0 22px rgba(0,207,255,.3)}
.tier.t0 .pair .up span{color:var(--cyan)}
/* OG Gambler shines red */
.tier.t3{border-color:rgba(255,68,68,.55);box-shadow:0 0 40px rgba(255,68,68,.16),0 24px 60px rgba(6,9,15,.55)}
.tier.t3:hover{border-color:var(--red);box-shadow:0 0 52px rgba(255,68,68,.28),0 24px 60px rgba(6,9,15,.55)}
.tier.t3.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 60px rgba(255,68,68,.3)}
.tier.t3 h3{color:var(--red)}
.tier.t3 .bars i.on{background:var(--red)}
.tier.t3 .pair .up b{color:var(--red);text-shadow:0 0 18px rgba(255,68,68,.9),0 0 40px rgba(255,68,68,.5);animation:blaze 2.2s ease-in-out infinite}
.tier.t3 .pair .up span{color:var(--red)}
@keyframes blaze{50%{text-shadow:0 0 8px rgba(255,68,68,.6),0 0 18px rgba(255,68,68,.25)}}
.foot{margin-top:18px;color:var(--dim);font-size:11px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.foot b{color:var(--muted);font-weight:600}

/* step 2: the amount */
.amount{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;align-items:start}
.glass{background:linear-gradient(180deg,rgba(13,21,32,.94),rgba(6,9,15,.96));border:1px solid rgba(30,48,80,.95);border-radius:20px;box-shadow:0 24px 60px rgba(6,9,15,.6)}
.picked{padding:20px}
.picked h3{font:22px "Archivo Black",sans-serif;margin:8px 0 4px}
.picked.t3 h3{color:var(--red)}
.picked .pair{margin:14px 0 12px}
.link{color:var(--cyan);font-size:12px;font-weight:700}
.link:hover{text-decoration:underline}
.box{padding:26px}
.bigin{display:flex;align-items:center;gap:12px;margin-top:12px;background:var(--deep);border:1px solid rgba(0,207,255,.42);border-radius:16px;
  padding:10px 12px 10px 22px;box-shadow:0 0 0 4px rgba(0,207,255,.06),inset 0 2px 10px rgba(6,9,15,.8)}
.bigin input{font:46px/1.15 "Archivo Black",sans-serif;background:transparent;border:0;outline:0;flex:1;width:0;min-width:0;caret-color:var(--cyan)}
.token{display:inline-flex;align-items:center;gap:8px;background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.45);border-radius:99px;padding:7px 14px 7px 7px;font-weight:800;font-size:15px}
.token i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:14px;font-weight:800}
.quick{display:flex;gap:8px;margin-top:12px}
.quick button{border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--muted);font-weight:700;font-size:12.5px}
.quick button:hover,.quick button.on{border-color:rgba(0,207,255,.6);color:var(--cyan);background:rgba(0,207,255,.07)}
.month{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}
.month>div{border:1px solid rgba(30,48,80,.9);border-radius:14px;padding:14px 18px;background:rgba(6,9,15,.6)}
.month small{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.16em}
.month b{display:block;font:34px/1.2 "Archivo Black",sans-serif;margin-top:4px;white-space:nowrap}
.month span{font-size:12px;font-weight:700}
.month .up b,.month .up span{color:var(--green)}
.month .dn b,.month .dn span{color:var(--red)}
.month .dn.flat b,.month .dn.flat span{color:var(--muted)}
.go{width:100%;padding:19px;background:var(--green);color:var(--deep);border-radius:14px;font:800 17px Inter,sans-serif;letter-spacing:.06em;
  box-shadow:0 0 28px rgba(0,255,136,.42),inset 0 -2px 0 rgba(6,9,15,.2);display:flex;align-items:center;justify-content:center;gap:10px;transition:box-shadow .2s,transform .1s}
.go:hover{box-shadow:0 0 44px rgba(0,255,136,.66),inset 0 -2px 0 rgba(6,9,15,.2)}
.go:active{transform:translateY(1px)}
.go[disabled]{background:var(--line);color:var(--dim);box-shadow:none;cursor:default}
.go.red{background:var(--red);color:var(--text);box-shadow:0 0 30px rgba(255,68,68,.45)}
.go svg{width:20px;height:20px}

/* step 3: the finder */
.finder{display:grid;grid-template-columns:420px minmax(0,1fr);gap:28px;align-items:start}
.radar{padding:20px;text-align:center}
.radar svg{width:100%;height:auto;display:block}
.sweep{transform-origin:200px 200px;animation:spin 1.6s linear infinite}
.radar.done .sweep{animation:none;opacity:0;transition:opacity .4s}
@keyframes spin{to{transform:rotate(360deg)}}
.radar .p{transition:opacity .2s}
.radar .p circle.ring{fill:var(--deep);stroke:var(--line);stroke-width:1.5}
.radar .p.hit circle.ring{stroke:var(--green);filter:drop-shadow(0 0 6px rgba(0,255,136,.8))}
.ticker{margin-top:8px;height:20px;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker b{color:var(--green)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.counts div{border:1px solid rgba(30,48,80,.9);border-radius:14px;padding:12px 16px;background:rgba(6,9,15,.6)}
.counts small{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.16em}
.counts b{display:block;font:28px/1.2 "Archivo Black",sans-serif;margin-top:2px}
.counts .fitn b{color:var(--green)}
.rows{padding:6px 0}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 250px;gap:12px;align-items:center;padding:11px 20px;border-bottom:1px solid rgba(30,48,80,.55);animation:in .25s ease-out}
.rrow:last-child{border-bottom:0}
.rrow .lab{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .x{font:15px "Archivo Black",sans-serif;text-align:right}
.rrow .x.u{color:var(--green)}.rrow .x.d{color:var(--red)}
.rrow .v{justify-self:end}
.rrow.no{opacity:.62}
.rrow.no .lab{text-decoration:line-through;text-decoration-color:rgba(255,68,68,.6)}
.rrow.best{background:rgba(0,255,136,.07);box-shadow:inset 3px 0 0 var(--green)}
.rowh{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 250px;gap:12px;padding:12px 20px;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.16em;border-bottom:1px solid rgba(30,48,80,.8)}
.rowh span:nth-child(2),.rowh span:nth-child(3){text-align:right}
.rowh span:nth-child(4){text-align:right}
.found{display:none;margin-top:16px;align-items:center;gap:16px}
.found.on{display:flex;animation:in .3s ease-out}
.found .go{width:auto;padding:15px 26px}
.found .lab{flex:1;font:20px "Archivo Black",sans-serif}
.found .lab small{display:block;font:700 10px "JetBrains Mono",monospace;letter-spacing:.2em;color:var(--green);margin-bottom:4px}

/* step 4: the route as pipes */
.routehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.pipes{padding:18px 18px 8px;overflow:hidden}
.pipes svg{display:block;width:100%;height:auto}
.casing{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round}
.glasspipe{fill:none;stroke:var(--deep);stroke-linecap:round;stroke-linejoin:round}
.water{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len) var(--len);stroke-dashoffset:var(--len);
  animation:fill var(--dur) linear forwards;animation-delay:var(--t)}
@keyframes fill{to{stroke-dashoffset:0}}
.bubbles{fill:none;stroke:rgba(230,237,247,.75);stroke-linecap:round;stroke-dasharray:2 24;opacity:0;
  animation:flow 1.1s linear infinite,show .2s forwards;animation-delay:0s,calc(var(--t) + var(--dur))}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes show{to{opacity:1}}
.node{opacity:.35;animation:lit .4s forwards;animation-delay:var(--t)}
.node .card{fill:var(--panel);stroke:var(--line);stroke-width:1.5;transition:stroke .3s}
@keyframes lit{to{opacity:1}}
.node.lit .card{stroke:rgba(0,255,136,.6)}
.node .nm{font:15px "Archivo Black",sans-serif;fill:var(--text)}
.node .ac{font:600 12px "JetBrains Mono",monospace;fill:var(--muted)}
.node .ch{font:600 10.5px "JetBrains Mono",monospace;fill:var(--dim);letter-spacing:.06em}
.node .rt{font:800 13px "JetBrains Mono",monospace}
.rt.earn{fill:var(--green)}.rt.pay{fill:var(--red)}
.mono{font:800 15px Inter,sans-serif;fill:var(--text);text-anchor:middle;dominant-baseline:central}
.badge{opacity:0;animation:show .3s forwards;animation-delay:var(--t)}
.badge rect{fill:var(--deep);stroke:var(--cyan);stroke-width:1.5}
.badge text{font:800 14px "JetBrains Mono",monospace;fill:var(--cyan);text-anchor:middle;dominant-baseline:central}
.share{font:800 12px "JetBrains Mono",monospace;fill:var(--cyan);text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:6px;stroke-linejoin:round}
.tank .shell{fill:rgba(6,9,15,.9);stroke:var(--line);stroke-width:2}
.tank .liq{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:rise 1.4s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--t)}
@keyframes rise{to{transform:scaleY(1)}}
.tank .wave{animation:wave 2.4s linear infinite}
@keyframes wave{to{transform:translateX(-60px)}}
.tank text{text-anchor:middle}
.tank .k{font:700 10px "JetBrains Mono",monospace;letter-spacing:.18em;fill:var(--muted)}
.tank .v{font:26px "Archivo Black",sans-serif;fill:var(--text)}
.tank .figs{opacity:0;animation:show .4s forwards;animation-delay:var(--t)}

.outcome{display:grid;grid-template-columns:1fr 1fr 1fr 320px;gap:14px;margin-top:16px;align-items:stretch}
.outcome>div{border:1px solid rgba(30,48,80,.9);border-radius:16px;padding:16px 20px;background:rgba(6,9,15,.6)}
.outcome small{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.16em}
.outcome b{display:block;font:32px/1.2 "Archivo Black",sans-serif;margin-top:4px;white-space:nowrap}
.outcome span{font-size:12px;font-weight:700}
.outcome .up b,.outcome .up span{color:var(--green)}
.outcome .dn b,.outcome .dn span{color:var(--red)}
.outcome .dn.flat b,.outcome .dn.flat span{color:var(--muted)}
.outcome .lq b{color:var(--text)}
.outcome .lq span{color:var(--dim)}
.outcome .start{border:0;padding:0;background:none;display:flex;flex-direction:column;gap:10px}
.outcome .start .go{flex:1;font-size:22px}
.outcome .start .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.running{display:none}
.started .running{display:flex}
.started .notrun{display:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--deep);box-shadow:0 0 0 3px rgba(6,9,15,.25);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.back{display:flex;gap:18px;margin-top:16px}

/* the logo sheet (?logo=1) */
.sheet{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;padding:30px}
.sheet .big{width:260px;height:260px;filter:drop-shadow(0 0 40px rgba(0,255,136,.35))}
.sheet .wm{font:64px/1 "Archivo Black",sans-serif}
.sheet .wm em{font-style:normal;color:var(--green)}
.sheet .sizes{display:flex;gap:28px;align-items:flex-end;margin-top:30px}
.sheet .sizes div{text-align:center;color:var(--dim);font-size:11px}

/* frozen pictures: every animation at its end */
.shot *,.shot *::before,.shot *::after{animation-duration:0s!important;animation-delay:0s!important;transition:none!important}
.shot .bubbles{animation:none!important;opacity:1}
.shot .tier.t3 .pair .up b{animation:none!important}
.shot .sweep{display:none}

@media (max-width:1100px){
  .tiers{grid-template-columns:repeat(2,minmax(0,1fr))}
  .amount,.finder{grid-template-columns:minmax(0,1fr)}
  .outcome{grid-template-columns:1fr 1fr}
  .trust{display:none}
}
@media (max-width:640px){
  .tiers,.month,.counts{grid-template-columns:minmax(0,1fr)}
  .steps button span{display:none}
  h1{font-size:30px}
  .head{flex-direction:column;align-items:flex-start}
  .rrow,.rowh{grid-template-columns:minmax(0,1fr) 70px 70px}
  .rrow .v,.rowh span:nth-child(4){display:none}
  .outcome{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="brand" id="home" title="Yield Booster">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="ybg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#00cfff"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
        </defs>
        <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="#06090f" stroke="url(#ybg)" stroke-width="2"/>
        <path d="M32 9C32 9 16 25 16 39a16 16 0 0 0 32 0C48 25 32 9 32 9Z" fill="url(#ybg)"/>
        <path d="M24 41l8-8 8 8M24 50l8-8 8 8" fill="none" stroke="#06090f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="w"><span>CYMETICA</span><b>YIELD <em>BOOSTER</em></b></div>
    </div>
    <nav class="steps" id="steps">
      <button data-go="1"><i>1</i><span>Risk</span></button>
      <button data-go="2"><i>2</i><span>Amount</span></button>
      <button data-go="3"><i>3</i><span>Find</span></button>
      <button data-go="4"><i>4</i><span>Route</span></button>
    </nav>
    <div class="trust">
      <span class="chip g">NO KYC</span>
      <span class="chip c">VERIFIED DEFI ONLY</span>
    </div>
  </header>

  <!-- 1 -->
  <section class="view" id="v1">
    <div class="head">
      <div>
        <div class="cap">STEP 1</div>
        <h1>Pick your <em>risk</em></h1>
      </div>
      <div class="move">ETH / BTC MONTH <div class="seg" id="moves"></div>
        <span class="tip" title="Every figure on this page is computed from today's rates and this one move. Good month: ETH and BTC rise by it, rates stay as today. Bad month: they fall by it, every yield halves, borrowing costs the same.">i</span></div>
    </div>
    <div class="tiers" id="tiers"></div>
    <div class="foot" id="foot1"></div>
  </section>

  <!-- 2 -->
  <section class="view" id="v2">
    <div class="head"><div><div class="cap">STEP 2</div><h1>How much <em>USDC</em>?</h1></div></div>
    <div class="amount">
      <div class="glass picked" id="picked"></div>
      <div class="glass box">
        <div class="cap">YOU PUT IN</div>
        <label class="bigin"><input id="amt" inputmode="decimal" autocomplete="off" value="5,000"><span class="token"><i>$</i>USDC</span></label>
        <div class="quick" id="quick"></div>
        <div class="month" id="month2"></div>
        <button class="go" id="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>FIND THE BEST ROUTE</button>
      </div>
    </div>
  </section>

  <!-- 3 -->
  <section class="view" id="v3">
    <div class="head"><div><div class="cap">STEP 3</div><h1>Finding the <em>best route</em></h1></div></div>
    <div class="finder">
      <div class="glass radar" id="radar"></div>
      <div>
        <div class="counts" id="counts"></div>
        <div class="glass">
          <div class="rowh"><span>ROUTE</span><span>GOOD</span><span>BAD</span><span>VERDICT</span></div>
          <div class="rows" id="rows"></div>
        </div>
        <div class="found" id="found"></div>
      </div>
    </div>
  </section>

  <!-- 4 -->
  <section class="view" id="v4">
    <div class="head">
      <div><div class="cap">STEP 4 · YOUR ROUTE</div><h1 id="rtitle"></h1><div class="routehead" id="rchips"></div></div>
    </div>
    <div class="glass pipes" id="pipes"></div>
    <div class="outcome" id="outcome"></div>
    <div class="back"><button class="link" data-go="2">← Change amount</button><button class="link" data-go="1">← Change risk</button></div>
  </section>

  <!-- the logo, large -->
  <section class="view" id="vlogo">
    <div class="glass sheet" id="sheet"></div>
  </section>
</div>
<script src="data.js"></script>
<script src="yb-core.js"></script>
<script src="yb-ui.js"></script>
</body>
</html>
