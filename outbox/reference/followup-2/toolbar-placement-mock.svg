<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" role="img" aria-label="Apps tab header and toolbar: the Hyperliquid badge under Legend, the min revenue slider moved left and restyled">
  <!-- Placement mock for items 13 and 14. Fonts: Archivo Black, IBM Plex Mono, IBM Plex Sans (fall back to the system fonts). -->
  <defs>
    <path id="shield" d="M24 3Q100 30 176 3Q188 26 199 42C192 60 188 90 189 120C190 160 192 175 186 190C170 215 130 230 100 238C70 230 30 215 14 190C8 175 10 160 11 120C12 90 8 60 1 42Q12 26 24 3Z"/>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7d99"/><stop offset=".12" stop-color="#00cfff"/><stop offset=".27" stop-color="#d4fff6"/>
      <stop offset=".42" stop-color="#00ff88"/><stop offset=".56" stop-color="#007f55"/><stop offset=".72" stop-color="#00ff88"/>
      <stop offset=".86" stop-color="#b8ffe9"/><stop offset="1" stop-color="#0a8f9f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ffee"/><stop offset=".35" stop-color="#4af5a8"/><stop offset=".62" stop-color="#00c878"/><stop offset="1" stop-color="#00dd86"/>
    </linearGradient>
    <linearGradient id="seg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00cfff"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4fff6"/><stop offset=".55" stop-color="#00ff88"/><stop offset="1" stop-color="#00a86b"/></linearGradient>
    <clipPath id="faceClip"><use href="#shield" transform="translate(100 122) scale(.905) translate(-100 -122)"/></clipPath>
  </defs>

  <rect width="1100" height="250" fill="#0a0e17"/>
  <rect width="1100" height="130" fill="#0d1422"/>
  <rect y="130" width="1100" height="116" fill="#111a28"/>
  <rect y="129" width="1100" height="1" fill="#1b2d42"/>

  <!-- header: logo (item 1 replaces this text), meta, tabs, Legend -->
  <text x="32" y="50" font-family="Archivo Black, Arial Black, sans-serif" font-size="30" fill="#fff">Gem Screener</text>
  <text x="32" y="74" font-family="IBM Plex Sans, Arial, sans-serif" font-weight="700" font-size="15" fill="#00ff88">Revenue-driven research</text>
  <text x="1076" y="40" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="12" fill="#9fb0c3">Updated 3 h ago · 215 apps · 26 chains · ● Live</text>
  <g font-family="IBM Plex Sans, Arial, sans-serif" font-weight="700" font-size="14" fill="#7f93a8">
    <text x="32" y="112">Top Picks</text><text x="116" y="112" fill="#fff">Apps</text><text x="176" y="112">Chains</text><text x="240" y="112">Sectors</text>
  </g>
  <rect x="112" y="122" width="40" height="3" fill="#00cfff"/>
  <rect x="996" y="90" width="80" height="34" rx="6" fill="#0b1828" stroke="#1b2d42"/>
  <text x="1036" y="112" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="14" fill="#00cfff">Legend</text>

  <!-- toolbar: filters, search, count -->
  <rect x="32" y="150" width="290" height="40" rx="8" fill="#0a1220" stroke="#1b2d42"/>
  <g font-family="IBM Plex Mono, monospace" font-weight="700" font-size="12" fill="#9fb0c3">
    <rect x="36" y="154" width="98" height="32" rx="6" fill="#0f2236"/><text x="85" y="175" text-anchor="middle" fill="#00cfff">Vetted only</text>
    <text x="178" y="175" text-anchor="middle">Degen picks</text><text x="268" y="175" text-anchor="middle">All by upside</text>
  </g>
  <rect x="336" y="150" width="170" height="40" rx="8" fill="#0d1626" stroke="#1b2d42"/>
  <text x="372" y="175" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12.5" fill="#7f93a8">search name, symbol…</text>
  <rect x="518" y="154" width="84" height="32" rx="6" fill="#0a1220"/>
  <text x="560" y="175" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#fff"><tspan font-weight="700">74</tspan> <tspan fill="#7f93a8">projects</tspan></text>

  <!-- item 14: the min-revenue slider, moved left and restyled: 8 segments between 9 stops, lit up to the knob, a gem knob, the value in a pill -->
  <text x="640" y="174" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="10.5" letter-spacing="1.2" fill="#7f93a8">MIN. REVENUE / 30D</text>
  <g>
    <rect x="780" y="166" width="15" height="8" rx="4" fill="url(#seg)"/><rect x="798" y="166" width="15" height="8" rx="4" fill="url(#seg)"/>
    <rect x="816" y="166" width="15" height="8" rx="4" fill="url(#seg)"/><rect x="834" y="166" width="15" height="8" rx="4" fill="url(#seg)"/>
    <rect x="852" y="166" width="15" height="8" rx="4" fill="#1b2d42"/><rect x="870" y="166" width="15" height="8" rx="4" fill="#1b2d42"/>
    <rect x="888" y="166" width="15" height="8" rx="4" fill="#1b2d42"/><rect x="906" y="166" width="15" height="8" rx="4" fill="#1b2d42"/>
    <rect x="780" y="163" width="69" height="14" rx="7" fill="#00ff88" opacity=".08"/>
    <rect x="841.5" y="160" width="17" height="17" rx="4" transform="rotate(45 850 170)" fill="url(#knob)" stroke="#04332f" stroke-width="2"/>
  </g>
  <rect x="932" y="155" width="62" height="30" rx="8" fill="#0b1828" stroke="#00e0c8" stroke-width="1.5"/>
  <text x="963" y="175" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="13" fill="#fff">$100K</text>

  <!-- item 13: the badge under Legend, at the right end of the toolbar -->
  <svg x="1000" y="134" width="76" height="91" viewBox="-2 -2 204 244">
    <use href="#shield" fill="url(#rim)"/>
    <use href="#shield" transform="translate(100 122) scale(.935) translate(-100 -122)" fill="#04332f"/>
    <use href="#shield" transform="translate(100 122) scale(.915) translate(-100 -122)" fill="url(#rim)" opacity=".55"/>
    <use href="#shield" transform="translate(100 122) scale(.905) translate(-100 -122)" fill="url(#face)"/>
    <g clip-path="url(#faceClip)"><path d="M0 0H120L40 240H0Z" fill="#fff" opacity=".12"/></g>
    <circle cx="100" cy="64" r="28" fill="#06382d" stroke="#04271f" stroke-width="3.5"/>
    <circle cx="100" cy="64" r="23" fill="#0a3b36"/>
    <path d="M86 56c8 0 8 8 14 8s6-8 14-8c0 14-6 14-14 14s-14 0-14-14z" fill="#97fce4"/>
    <text x="100" y="140" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-size="58" fill="#04271f" letter-spacing="-1">35<tspan font-size="36" dy="-3">×</tspan></text>
    <text x="100" y="166" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="13.5" letter-spacing="3.2" fill="#04271f">REVENUE</text>
    <path d="M100 180l7 7-7 10-7-10z" fill="#06382d" stroke="#04271f" stroke-width="2"/>
  </svg>
</svg>
