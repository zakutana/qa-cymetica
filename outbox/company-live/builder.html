<body class="bd-page">
<!-- (no site bar: it is the site's, not the app's -- "ten vrchni panel nikde nedavej to neni soucast apky") -->
<main class="bz">
  <section class="panel stage bz-stage" id="stage">
    <!-- step 1: the station, turning; arrows either side of it to go through the seven, its name and colour under it -->
    <div class="bz-pv" id="b-prev"></div>
    <div class="bz-look" id="look">
      <button type="button" class="bz-arrow l" id="lk-prev" title="The station before"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="bz-arrow r" id="lk-next" title="The next station"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <!-- step 2: the office; the tour's bubble over its rooms -->
    <div class="office3d" id="office3d"></div>
    <div class="o3layer"></div>
    <div class="tip" hidden></div>
    <div class="bz-bub" id="bub" hidden></div>
    <div class="bz-veil on" id="veil"><div class="ldr"><i class="ld-halo"></i><i class="ld-beams"></i><i class="ld-ping"></i><i class="ld-ping p2"></i>
      <i class="ld-orbit o3"><b></b></i><i class="ld-orbit o2"><b></b></i><i class="ld-orbit o1"><b></b></i>
      <i class="ld-ring r3"></i><i class="ld-sun"><b></b><b></b></i>
      <div class="ld-what">PREPARING YOUR STATION</div><div class="ld-bar"></div></div></div>

    <section class="bz-card">
      <ol class="bz-steps" id="steps"><li data-s="1"><i>1</i>Name &amp; look</li><li data-s="2"><i>2</i>Start</li></ol>

      <div class="bz-st" data-st="1">
        <h2>Name it.</h2>
        <label class="field">NAME<input id="f-name" maxlength="40" placeholder="e.g. Moonshot Labs" autocomplete="off"></label>
        <label class="field" title="What everyone reads about it in the Universe">MISSION<input id="f-mission" maxlength="200" placeholder="What it is for, in one line" autocomplete="off"></label>
        <!-- its look: the station (the arrows by the ship go through the seven) and its colour -->
        <div class="bz-lkrow"><span class="bz-lkl">STATION</span><b id="lk-name"></b><span class="bz-lkn" id="lk-n"></span></div>
        <div class="bz-lkrow"><span class="bz-lkl">COLOUR</span><div class="accents" id="lk-acc"></div></div>
        <div class="switch" id="f-pub"></div>
      </div>

      <div class="bz-st" data-st="2" hidden>
        <h2>Start.</h2>
        <div class="bz-opts" id="opts"></div>
      </div>

      <div class="bz-nav"><button type="button" class="btn bz-back" id="b-back">← Back</button><span class="sp"></span><button type="button" class="bz-next" id="b-next">Next <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    </section>
  </section>
</main>

<script>
/* The mock's files with index.html's own cache key, read from it on every load (index.html changes the key with every
   edit; a key written here would go stale and run an older office than index.html does), ours fresh every load; the
   3D engine after them (a module inserted with them would not wait), then the stations over it (stations.js). */
(function (css, js) {
  var t = Date.now(), ours = /^(builder|start|stations|entry3d)\./;
  function go(v) {
    var q = '?v=' + v, src = function (f) { return f + (ours.test(f) ? '?t=' + t : q); }, left = css.length;
    var shown = function () { if (--left <= 0) document.documentElement.classList.remove('ld'); };
    css.forEach(function (f) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = src(f); l.onload = l.onerror = shown; document.head.appendChild(l); });
    var mod = function (f, next) { var m = document.createElement('script'); m.type = 'module'; m.src = src(f); if (next) m.onload = next; document.body.appendChild(m); };
    js.forEach(function (f, i) {
      var e = document.createElement('script'); e.src = src(f); e.async = false;
      if (i === js.length - 1) e.onload = function () { mod('u3d.js', function () { mod('stations.js'); }); };
      document.body.appendChild(e);
    });
    setTimeout(function () { document.documentElement.classList.remove('ld'); }, 1500);
  }
  fetch('index.html', { cache: 'no-store' }).then(function (r) { return r.text(); })
    .then(function (x) { var m = /u3d\.js\?v=([\w.-]+)/.exec(x); go(m ? m[1] : t); }, function () { go(t); });
})(['style.css', 'uv.css', 'builder.css'], ['data.js', 'uv-data.js', 'portfolio.js', 'sim.js', 'office.js', 'universe.js', 'cards.js', 'entry3d.js', 'builder.js']);
</script>
