<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tokenize your build: what the token earns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0a0e17; }
  svg { display: block; }
  .h { font-family: "Archivo Black", sans-serif; }
  .m { font-family: "JetBrains Mono", monospace; }
  .s { font-family: "Inter", system-ui, sans-serif; }
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00ff88"/>
    </marker>
    <marker id="arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00cfff"/>
    </marker>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00cfff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00cfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#00cfff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0a0e17"/>

  <!-- header -->
  <text x="80" y="92" class="m" font-size="20" font-weight="700" letter-spacing="4" fill="#00cfff">BUILD IT BETTER · TOKENIZE YOUR BUILD</text>
  <text x="80" y="160" class="h" font-size="56" fill="#E6EDF7">Who buys your build's <tspan fill="#00ff88">token?</tspan></text>
  <text x="80" y="204" class="s" font-size="24" fill="#A9B8CC">Today the owner earns only when someone trades it (1). Buybacks from 2 and 3 create the buyer.</text>

  <!-- source 1 -->
  <rect x="80" y="250" width="600" height="170" rx="18" fill="#0d1520" stroke="#00ff88" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="132" cy="302" r="26" fill="#00ff88"/>
  <text x="132" y="312" class="h" font-size="28" fill="#0a0e17" text-anchor="middle">1</text>
  <text x="178" y="312" class="h" font-size="28" fill="#E6EDF7">People trade the token</text>
  <text x="112" y="360" class="s" font-size="22" fill="#A9B8CC">Every trade on its curve pays a fee.</text>
  <rect x="112" y="378" width="148" height="28" rx="14" fill="#00ff88"/>
  <text x="186" y="398" class="m" font-size="15" font-weight="700" fill="#0a0e17" text-anchor="middle">LIVE TODAY</text>

  <!-- source 2 -->
  <rect x="80" y="450" width="600" height="170" rx="18" fill="#0d1520" stroke="#00cfff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="132" cy="502" r="26" fill="none" stroke="#00cfff" stroke-width="3"/>
  <text x="132" y="512" class="h" font-size="28" fill="#00cfff" text-anchor="middle">2</text>
  <text x="178" y="512" class="h" font-size="28" fill="#E6EDF7">Your product earns</text>
  <text x="112" y="560" class="s" font-size="22" fill="#A9B8CC">Subscriptions, fees: the app's own revenue.</text>
  <rect x="112" y="578" width="128" height="28" rx="14" fill="none" stroke="#00cfff" stroke-width="2"/>
  <text x="176" y="598" class="m" font-size="15" font-weight="700" fill="#00cfff" text-anchor="middle">PROPOSED</text>

  <!-- source 3 -->
  <rect x="80" y="650" width="600" height="170" rx="18" fill="#0d1520" stroke="#00cfff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="132" cy="702" r="26" fill="none" stroke="#00cfff" stroke-width="3"/>
  <text x="132" y="712" class="h" font-size="28" fill="#00cfff" text-anchor="middle">3</text>
  <text x="178" y="712" class="h" font-size="28" fill="#E6EDF7">Your product brings users</text>
  <text x="112" y="760" class="s" font-size="22" fill="#A9B8CC">They sign up through it and trade on EventTrader.</text>
  <rect x="112" y="778" width="128" height="28" rx="14" fill="none" stroke="#00cfff" stroke-width="2"/>
  <text x="176" y="798" class="m" font-size="15" font-weight="700" fill="#00cfff" text-anchor="middle">PROPOSED</text>

  <!-- arrows -->
  <path d="M680,335 L1000,335" stroke="#00ff88" stroke-width="4" fill="none" marker-end="url(#arG)"/>
  <text x="826" y="318" class="m" font-size="17" fill="#00ff88" text-anchor="middle">creator share of each fee</text>

  <path d="M680,535 C820,535 860,600 1000,600" stroke="#00cfff" stroke-width="4" fill="none" stroke-dasharray="12 8" marker-end="url(#arC)"/>
  <text x="830" y="512" class="m" font-size="17" fill="#00cfff" text-anchor="middle">a share of revenue</text>

  <path d="M680,735 C820,735 860,690 1000,690" stroke="#00cfff" stroke-width="4" fill="none" stroke-dasharray="12 8" marker-end="url(#arC)"/>
  <text x="840" y="778" class="m" font-size="17" fill="#00cfff" text-anchor="middle">a share of the fees</text>
  <text x="840" y="800" class="m" font-size="17" fill="#00cfff" text-anchor="middle">they pay trading</text>

  <!-- sink A: wallet -->
  <rect x="1010" y="250" width="510" height="170" rx="18" fill="#0d1520" stroke="#00ff88" stroke-opacity="0.55" stroke-width="2"/>
  <text x="1046" y="312" class="h" font-size="30" fill="#E6EDF7">Your wallet</text>
  <text x="1046" y="356" class="s" font-size="22" fill="#A9B8CC">Paid to the owner, trade by trade.</text>
  <text x="1046" y="394" class="m" font-size="18" fill="#6F8199">Share: shown here, set by EventTrader</text>

  <!-- sink B: buyback -->
  <rect x="1010" y="520" width="510" height="300" rx="18" fill="#0d1520" stroke="#00cfff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1046" y="582" class="h" font-size="30" fill="#E6EDF7">Token buyback</text>
  <text x="1046" y="624" class="s" font-size="22" fill="#A9B8CC">Bought on the market, on a schedule</text>
  <text x="1046" y="654" class="s" font-size="22" fill="#A9B8CC">everyone can check on-chain.</text>
  <circle cx="1270" cy="740" r="62" fill="url(#glow)"/>
  <circle cx="1270" cy="740" r="46" fill="#0a0e17" stroke="#00cfff" stroke-width="3"/>
  <text x="1270" y="748" class="h" font-size="20" fill="#00cfff" text-anchor="middle">$TKN</text>
  <path d="M1170,740 L1222,740" stroke="#00cfff" stroke-width="3" fill="none" marker-end="url(#arC)"/>
  <text x="1046" y="746" class="m" font-size="18" fill="#00ff88">demand</text>
  <path d="M1318,740 L1370,740" stroke="#00ff88" stroke-width="3" fill="none" marker-end="url(#arG)"/>
  <text x="1382" y="734" class="m" font-size="18" fill="#00ff88">holders</text>
  <text x="1382" y="758" class="m" font-size="18" fill="#00ff88">and owner</text>

  <!-- footer -->
  <text x="80" y="870" class="s" font-size="19" fill="#6F8199">A user counts as brought by a product when they sign up through its link. Shares are EventTrader's to set and show on this page. Not financial advice.</text>
</svg>
</body>
</html>
