<body class="xp q2">
<main class="xpage">
  <div class="xcrumb"><a href="#">← My Company</a><span>/</span><b>Quant Lab</b><span>·</span><a href="#" title="How models, skills, bots and this lab fit together">How it fits</a>
    <span class="sp"></span>
    <div class="q2-mode" role="tablist">
      <button data-mode="real" title="Our company's real last search (#3, 27 Oct), read from the lab's API">◉ Real</button>
      <button data-mode="sim" title="How ET-33142 is meant to work: whole bot setups searched, the winner starts as a paper bot with exactly that setup. Simulated numbers.">▶ Coming soon</button>
    </div>
  </div>

  <header class="q2-hero">
    <!-- the mark: an Erlenmeyer flask that is a radar scope. Inside, a faint grid of the setups tried, the sweep going
         round and the one green blip it keeps finding, a ring going out each time the sweep hits it. Our own, not the
         family's round head (the operator, 2026-10-30: "mas byt originalni a vymyslet nove"). -->
    <svg class="q2-logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="q2g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00cfff"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
        <radialGradient id="q2scope" cx="32" cy="40" r="27" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00ff88" stop-opacity=".2"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/></radialGradient>
        <linearGradient id="q2wedge" x1="32" y1="20" x2="46" y2="26" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00ff88" stop-opacity="0"/><stop offset="1" stop-color="#00ff88" stop-opacity=".55"/></linearGradient>
        <filter id="q2glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <clipPath id="q2in"><path d="M25 6V21.5L8.6 49.6Q6.6 53.3 9.4 56Q10.6 57 12.6 57H51.4Q53.4 57 54.6 56Q57.4 53.3 55.4 49.6L39 21.5V6Z"/></clipPath>

      <path d="M25 6V21.5L8.6 49.6Q6.6 53.3 9.4 56Q10.6 57 12.6 57H51.4Q53.4 57 54.6 56Q57.4 53.3 55.4 49.6L39 21.5V6Z" fill="#070b10"/>
      <g clip-path="url(#q2in)">
        <path d="M8 24H56M8 32H56M8 40H56M8 48H56M20 8V57M28 8V57M36 8V57M44 8V57" stroke="#00cfff" stroke-opacity=".14" stroke-width="1"/>
        <circle cx="32" cy="40" r="27" fill="url(#q2scope)"/>
        <g fill="#00cfff" fill-opacity=".42"><circle cx="21" cy="46" r="1.3"/><circle cx="27.5" cy="51.5" r="1.2"/><circle cx="36.5" cy="53" r="1.3"/><circle cx="45.5" cy="48" r="1.2"/><circle cx="23" cy="37.5" r="1.1"/><circle cx="33" cy="29" r="1.1"/><circle cx="40" cy="44.5" r="1.3"/><circle cx="30.5" cy="42.5" r="1.1"/></g>
        <g class="q2-sweep"><path d="M32 40V13A27 27 0 0 1 51.1 20.9Z" fill="url(#q2wedge)"/><path d="M32 40L51.1 20.9" stroke="#00ff88" stroke-width="1.6" stroke-linecap="round" filter="url(#q2glow)"/></g>
        <circle class="q2-ring" cx="41" cy="33" r="3" fill="none" stroke="#00ff88" stroke-width="1.2"/>
        <circle class="q2-blip" cx="41" cy="33" r="2.8" fill="#00ff88" filter="url(#q2glow)"/>
      </g>
      <path d="M25 6V21.5L8.6 49.6Q6.6 53.3 9.4 56Q10.6 57 12.6 57H51.4Q53.4 57 54.6 56Q57.4 53.3 55.4 49.6L39 21.5V6Z" fill="none" stroke="url(#q2g)" stroke-width="3" stroke-linejoin="round"/>

    <div class="q2-word">
      <h1><span class="q2-w1">QUANT</span><span class="q2-w2">LAB</span></h1>
      <p class="q2-tag">Finds bots that win on data they never saw</p>
    </div>
  </header>

  <section class="q2-score" id="score"></section>

  <section class="q2-reactor">
    <div class="q2-rail" id="rail"></div>
    <div class="q2-stage">
      <canvas id="rx"></canvas>
      <span class="q2-simtag" id="simtag" hidden>COMING SOON · SIMULATED</span>
    </div>
  </section>

  <section class="q2-block">
    <div class="q2-bh"><h2>🙈 BLIND TEST</h2><span class="q2-sub" id="toplabel"></span><span class="sp"></span>
      <span class="q2-legend"><i class="lg-held"></i>blind result <i class="lg-bar"></i>bar</span></div>
    <div class="q2-top" id="top"></div>
  </section>

  <section class="q2-block">
    <div class="q2-bh"><h2>🤖 BOTS</h2><div class="q2-rule" id="rule"></div><span class="sp"></span>
      <button class="q2-ib" title="Your rule: what a bot must hit, window after window, to go to the Trading desk">⚙️ Rule</button>
      <button class="q2-ib q2-gr" title="Clone a bot onto paper and let the lab judge it">➕ Add bot</button></div>
    <div class="q2-bots" id="bots"></div>
  </section>

  <footer class="q2-foot">
    <button class="q2-ib" id="memory" title="Every combination tried: model, market, settings, both periods, verdict">🗂 What was tested <b id="memn"></b></button>
    <button class="q2-ib" title="Everything the lab did, as a file">⬇ Log</button>
    <details class="q2-caps"><summary class="q2-ib" id="capsbtn">ⓘ Can tune / can't</summary><div class="q2-capbody" id="caps"></div></details>
    <span class="sp"></span>
    <span class="q2-paper" id="paper">📄 PAPER ONLY</span>
  </footer>
</main>
