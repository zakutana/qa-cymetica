  <header class="q2-hero">
    <!-- the mark, in the family of our Airdrop Farmer (outbox/airdrop-farms, #aflogo) and Agent Casino: a round head
         with a dashed inner ring and two green eyes, its theme on top. Here the head is a flask's bulb, the neck and
         two rising bubbles stand where the farmer's hat and sprout do, and the liquid's surface is an equity line going up. -->
    <svg class="q2-logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="q2g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00cfff"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
        <linearGradient id="q2h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff88"/><stop offset="1" stop-color="#00cfff"/></linearGradient>
        <linearGradient id="q2liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff88" stop-opacity=".42"/><stop offset="1" stop-color="#00cfff" stop-opacity=".06"/></linearGradient>
        <filter id="q2glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <clipPath id="q2bulb"><circle cx="32" cy="41" r="15.4"/></clipPath>
      </defs>
      <path d="M27 12V24.75A17 17 0 1 0 37 24.75V12" fill="#070b10" stroke="url(#q2g)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="32" cy="41" r="12" fill="none" stroke="#00cfff" stroke-opacity=".4" stroke-width="1" stroke-dasharray="1.6 2.6"/>
      <g clip-path="url(#q2bulb)">
        <path d="M14 54 21 50.5 26 52.5 32 48 37 49.5 43 45 50 42V60H14z" fill="url(#q2liq)"/>
        <path class="q2-eq" d="M14 54 21 50.5 26 52.5 32 48 37 49.5 43 45 50 42" fill="none" stroke="#00ff88" stroke-width="2" stroke-linejoin="round" filter="url(#q2glow)"/>
      </g>
      <g class="q2-eyes">
        <rect x="24.5" y="33" width="5" height="9" rx="2.5" fill="#00ff88" filter="url(#q2glow)"/>
        <rect x="34.5" y="33" width="5" height="9" rx="2.5" fill="#00ff88" filter="url(#q2glow)"/>
      </g>
      <rect x="23.5" y="8.5" width="17" height="4.6" rx="2.3" fill="url(#q2h)"/>
      <circle class="q2-bub" cx="30" cy="4.6" r="2.4" fill="#00ff88"/>
      <circle class="q2-bub b2" cx="35.6" cy="2.2" r="1.6" fill="#00cfff"/>
    </svg>
    <h1 class="q2-word" title="Finds bots that win on data they never saw"><span>QUANT</span><b>LAB</b></h1>

  <section class="q2-score" id="score"></section>

  <section class="q2-reactor">
    <div class="q2-rail" id="rail"></div>

  <section class="q2-block">

  <section class="q2-block">
    <div class="q2-bh"><h2>🤖 BOTS</h2><div class="q2-rule" id="rule"></div><span class="sp"></span>

    <div class="q2-bots" id="bots"></div>
  </section>

  <footer class="q2-foot">
    <button class="q2-ib" id="memory" title="Every combination tried: model, market, settings, both periods, verdict">🗂 What was tested <b id="memn"></b></button>
    <button class="q2-ib" title="Everything the lab did, as a file">⬇ Log</button>
    <details class="q2-caps"><summary class="q2-ib" id="capsbtn">ⓘ Can tune / can't</summary><div class="q2-capbody" id="caps"></div></details>
    <span class="sp"></span>
    <span class="q2-paper" id="paper">📄 PAPER ONLY</span>
