
            <div class="nx-fab">
                <button type="button" class="nexus-badge" title="Ask NEXUS" aria-label="Open NEXUS chat">
                    <span class="nx-fab-label">Ask NEXUS</span>
                    <span class="nx-logo">NX_MARK</span>
                </button>
            </div>
            <div class="nexus-panel" role="dialog" aria-label="NEXUS AI">
                <div class="nexus-resize-handle" data-x="1" data-y="1" title="Drag to resize"></div>
                <div class="nx-rz nx-rz-t" data-y="1"></div>
                <div class="nx-rz nx-rz-l" data-x="1"></div>
                <div class="nexus-panel-header">
                    <div class="nexus-panel-title">
                        <span class="nx-logo nx-logo-sm">NX_MARK</span>
                        <span id="nexusPanelTitleText">NEXUS AI</span>
                    </div>
                    <div class="nexus-panel-actions">
                        <button class="nexus-btn nexus-btn-sub" title="Nexus Subscription" aria-label="Nexus Subscription">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                            <span class="nexus-sub-label"></span>
                        </button>
                        <button class="nexus-btn nexus-btn-newchat" title="New Chat" aria-label="Start new chat">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
                        </button>
                        <button class="nexus-btn nx-more" title="More" aria-label="More" aria-haspopup="true" aria-expanded="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
                        </button>
                        <button class="nexus-btn nexus-btn-minimize" title="Minimize" aria-label="Minimize chat">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"></path></svg>
                        </button>
                        <button class="nexus-btn nexus-btn-close" title="Close" aria-label="Close chat">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                        </button>
                        <button class="nexus-btn nexus-btn-toggle" tabindex="-1" aria-hidden="true"></button>
                    </div>
                    <div class="nx-menu" role="menu" hidden>
                        <div id="nexus-lang-selector" class="language-selector compact dark"></div>
                        <button class="nexus-btn nx-mi nexus-btn-share" role="menuitem" title="Share this prompt as a link" aria-label="Share this prompt as a link">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                            <span>Share this prompt</span>
                        </button>
                        <button class="nexus-btn nx-mi nexus-btn-maximize" role="menuitem" title="Maximize" aria-label="Maximize chat">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>
                            <span>Maximize</span>
                        </button>
                        <button class="nexus-btn nx-mi nexus-btn-pin" role="menuitem" title="Pin as sidebar" aria-label="Pin as sidebar">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="M15 4v16"></path></svg>
                            <span>Pin as sidebar</span>
                        </button>
                    </div>
                </div>
                <div class="nexus-sub-panel" style="display:none;">
                    <div class="nexus-sub-panel-header">
                        <span>NEXUS AI Subscription</span>
                        <button class="nexus-sub-close" aria-label="Close">&times;</button>
                    </div>
                    <div class="nexus-sub-panel-body">
                        <div class="nexus-sub-loading">Loading...</div>
                    </div>
                </div>
                <div class="nexus-messages">NX_WELCOME_HTML</div>
                <div class="nexus-bar">
                    <div class="nexus-attachments-preview"></div>
                    <div class="nexus-selection-chip" hidden style="display:none;"></div>
                    <div class="nexus-input-wrap">
                        <textarea rows="1" class="nexus-input" aria-label="Message to NEXUS" placeholder="Ask anything..." autocomplete="off"></textarea>
                    </div>
                    <div class="nx-tools">
                        <input type="file" class="nexus-file-input" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime,application/pdf" multiple hidden />
                        <button class="nexus-btn nexus-btn-attach" title="Attach image or video" aria-label="Attach media">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l8-7.9"></path></svg>
                        </button>
                        <button class="nexus-btn nexus-btn-select" title="Select something on this page to ask NEXUS about it" aria-label="Select on page" aria-pressed="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg>
                        </button>
                        <button class="nexus-btn nexus-btn-mic nexus-hidden" title="Voice: press, speak, pause — it sends. Say 'stop listening' to end." aria-label="Voice input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"></path></svg>
                        </button>
                        <button class="nexus-btn nexus-btn-speak nexus-hidden" title="Read replies aloud" aria-label="Read replies aloud" aria-pressed="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a9 9 0 0 1 0 14"></path></svg>
                        </button>
                        <span class="nx-grow"></span>
                        <button class="nexus-btn nexus-btn-send" title="Send" aria-label="Send message" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
