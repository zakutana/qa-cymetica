<link rel="stylesheet" href="https://cymetica.com/static/css/nexus-subscription.css?v=20261022-1"><link rel="stylesheet" href="https://cymetica.com/static/css/nexus-chat.css?v=20261027-1"><div id="nexus-chat-widget"><div class="nexus-bar">
                <div class="nexus-badge" title="EventTrader NEXUS AI">E</div>
                <label class="nexus-toggle-switch" title="Enable Nexus AI (per-use billing)">
                    <input type="checkbox" class="nexus-toggle-checkbox">
                    <span class="nexus-toggle-slider"></span>
                </label>
                <input type="file" class="nexus-file-input" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime,application/pdf" multiple="" hidden="">
                <button class="nexus-btn nexus-btn-attach" title="Attach image or video" aria-label="Attach media">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 7.5l-5.793 5.793a2.5 2.5 0 01-3.535-3.535l5.793-5.793a1.5 1.5 0 012.121 2.121L6.293 11.88a.5.5 0 01-.707-.707L10.5 6.258" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </button>
                <button class="nexus-btn nexus-btn-select" title="Select something on this page to ask NEXUS about it" aria-label="Select on page" aria-pressed="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg>
                </button>
                <button class="nexus-btn nexus-btn-mic" title="Voice: press, speak, pause — it sends. Say 'stop listening' to end." aria-label="Voice input" style="display: flex;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
                </button>
                <button class="nexus-btn nexus-btn-speak nexus-speak-on" title="Replies are read aloud (click to mute)" aria-label="Read replies aloud" aria-pressed="true" style="display: flex;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a9 9 0 0 1 0 14"></path></svg>
                </button>
                <div class="nexus-input-wrap">
                    <textarea rows="1" class="nexus-input" aria-label="Message to NEXUS" placeholder="Ask anything… (per-use billing applies)" autocomplete="off" style="overscroll-behavior: contain;"></textarea>
                </div>
                <button class="nexus-btn nexus-btn-toggle" title="Expand chat" aria-label="Toggle chat panel">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 10l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </button>
                <button class="nexus-btn nexus-btn-send" title="Send" aria-label="Send message">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8l12-5-5 12-2-5-5-2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path></svg>
                </button>
            </div></div>
