<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -6 220 252" width="220" height="252" role="img" aria-label="Degen approved: a pick that passes all seven degen gates">
  <!-- The Degen picks badge frame: the gold sibling of the two benchmark badges.
       The round medallion (centre 100,110, radius 54) is left empty for an original 3D portrait (see SPEC.md, item 1).
       Fonts: Archivo Black, IBM Plex Mono. -->
  <defs>
    <path id="shield" d="M24 3Q100 30 176 3Q188 26 199 42C192 60 188 90 189 120C190 160 192 175 186 190C170 215 130 230 100 238C70 230 30 215 14 190C8 175 10 160 11 120C12 90 8 60 1 42Q12 26 24 3Z"/>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a00"/><stop offset=".13" stop-color="#ffcc00"/><stop offset=".28" stop-color="#fff6b0"/>
      <stop offset=".43" stop-color="#ffd400"/><stop offset=".57" stop-color="#a86e00"/><stop offset=".72" stop-color="#ffd400"/>
      <stop offset=".86" stop-color="#fff1a0"/><stop offset="1" stop-color="#9a6400"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3a8"/><stop offset=".35" stop-color="#ffd84a"/><stop offset=".62" stop-color="#f5b800"/><stop offset="1" stop-color="#ffcc22"/>
    </linearGradient>
    <radialGradient id="medal" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#5a3816"/><stop offset="1" stop-color="#1a0f05"/>
    </radialGradient>
    <clipPath id="faceClip"><use href="#shield" transform="translate(100 122) scale(.905) translate(-100 -122)"/></clipPath>
  </defs>

  <use href="#shield" fill="url(#rim)"/>
  <use href="#shield" transform="translate(100 122) scale(.935) translate(-100 -122)" fill="#5a3a00"/>
  <use href="#shield" transform="translate(100 122) scale(.915) translate(-100 -122)" fill="url(#rim)" opacity=".55"/>
  <use href="#shield" transform="translate(100 122) scale(.905) translate(-100 -122)" fill="url(#face)"/>
  <g clip-path="url(#faceClip)"><path d="M0 0H120L40 240H0Z" fill="#fff" opacity=".18"/></g>

  <!-- the medallion: the 3D portrait goes here, clipped to this circle -->
  <circle cx="100" cy="110" r="57" fill="#5a3a00"/>
  <circle id="portrait" cx="100" cy="110" r="54" fill="url(#medal)"/>
  <circle cx="100" cy="110" r="54" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- ribbon on top: DEGEN -->
  <path d="M0 22H200L190 35L200 48H0L10 35Z" fill="#2a1a06" stroke="#ffd400" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="100" y="42" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="19" letter-spacing="5" fill="#ffd400">DEGEN</text>

  <!-- banner below: APPROVED, with a check -->
  <path d="M-6 172H206L196 186L206 200H-6L4 186Z" fill="#2a1a06" stroke="#ffd400" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M26 186l5 5 10-11" fill="none" stroke="#ffd400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="192" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-size="17" letter-spacing="2" fill="#ffd400">APPROVED</text>

  <!-- the gem at the point -->
  <path d="M100 210l7 7-7 10-7-10z" fill="#5a3a00" stroke="#fff1a0" stroke-width="1.6"/>
</svg>
