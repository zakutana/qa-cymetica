<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airdrop Farmer</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e17; --deep:#06090f; --panel:#0d1520; --line:#1e3050;
  --text:#e6edf7; --muted:#a9b8cc; --dim:#7f93ad;
  --cyan:#00cfff; --green:#00ff88; --red:#ff4444; --blue:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 "JetBrains Mono",monospace;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 900px 420px at 18% 120px,rgba(0,255,136,.07),transparent 70%),
    radial-gradient(ellipse 700px 380px at 85% 80px,rgba(0,207,255,.06),transparent 70%),
    radial-gradient(rgba(0,207,255,.07) 1px,transparent 1.2px);
  background-size:auto,auto,22px 22px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.wrap{width:1240px;margin:0 auto;padding-bottom:64px}
.back{max-width:1440px;margin:0 auto;padding:16px 18px 0;color:var(--cyan);font-size:13px}

/* app header, as Agent Tournaments */
.app{display:flex;align-items:center;gap:26px;padding:18px 0 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:46px;height:46px;flex:none}
.brand .w{display:flex;flex-direction:column;line-height:1.05}
.brand .w span{color:var(--cyan);font-size:9.5px;letter-spacing:.32em;font-weight:600}
.brand .w b{color:var(--text);font-size:16px;font-weight:800;letter-spacing:.02em;margin-top:3px}
nav{display:flex;gap:6px}
nav a{text-decoration:none;padding:9px 14px;border-radius:9px;color:var(--dim);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;border:1px solid transparent}
nav a.on{color:var(--text);background:rgba(0,207,255,.10);border-color:rgba(0,207,255,.28)}
nav a i{font-style:normal;font-size:11px;color:var(--deep);background:var(--green);border-radius:9px;padding:1px 7px;font-weight:800}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.status b{color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(0,255,136,.18),0 0 10px rgba(0,255,136,.7);display:inline-block;flex:none}
.dot.idle{background:var(--dim);box-shadow:none}

/* hero */
.hero{display:grid;grid-template-columns:1fr 460px;gap:56px;padding:44px 0 40px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border-radius:20px;border:1px solid rgba(0,255,136,.35);
  background:rgba(0,255,136,.07);color:var(--green);font-size:11.5px;font-weight:700;letter-spacing:.14em}
h1{font:54px/1.06 "Archivo Black",sans-serif;margin:22px 0 18px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--green)}
.sub{font-size:17px;color:var(--muted)}
.sub b{color:var(--text);font-weight:700}

.card{background:linear-gradient(180deg,rgba(13,21,32,.96),rgba(6,9,15,.96));border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.cap{color:var(--cyan);font-size:10.5px;font-weight:700;letter-spacing:.22em}

/* the plan: one amount, one number, one button */
.plan{padding:24px 26px}
.bigin{display:flex;align-items:center;gap:12px;margin-top:12px;background:var(--deep);border:1px solid rgba(0,207,255,.45);border-radius:14px;
  padding:10px 12px 10px 18px;box-shadow:0 0 0 3px rgba(0,207,255,.08)}
.bigin input{font:44px/1.1 "Archivo Black",sans-serif;color:var(--text);background:transparent;border:0;outline:0;flex:1;min-width:0;caret-color:var(--cyan)}
.bigin span{color:var(--muted);font-weight:700;font-size:15px}
.max{border:1px solid rgba(0,207,255,.5);color:var(--cyan);border-radius:9px;padding:8px 12px;font-weight:800;font-size:12px;letter-spacing:.06em}
.max:hover{background:rgba(0,207,255,.1)}
.bal{margin-top:8px;color:var(--dim);font-size:11.5px}
.bal b{color:var(--muted);font-weight:600}
.youfarm{margin-top:22px}
.youfarm small{display:block;color:var(--muted);font-size:12.5px}
.youfarm b{display:block;font:40px/1.15 "Archivo Black",sans-serif;color:var(--green);text-shadow:0 0 26px rgba(0,255,136,.35);margin:2px 0;white-space:nowrap}
.youfarm span{color:var(--dim);font-size:12px}
.planline{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;color:var(--muted);min-height:20px}
.planline b{color:var(--text)}
.planline .over{color:var(--red);font-weight:700}
.bestbtn{color:var(--cyan);font-size:12px;font-weight:700}
.bestbtn:hover{text-decoration:underline}
.bestok{color:var(--green);font-size:12px;font-weight:700}
.go{background:var(--green);border:0;color:var(--deep);border-radius:12px;font:800 15px Inter,sans-serif;box-shadow:0 0 24px rgba(0,255,136,.38)}
.go:hover{box-shadow:0 0 34px rgba(0,255,136,.6)}
.go.big{width:100%;margin-top:16px;padding:17px;font-size:17px;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:10px}
.go svg{width:18px;height:18px;flex:none}
.ghost{background:transparent;border:1px solid rgba(0,207,255,.5);color:var(--cyan);padding:14px;border-radius:12px;font:700 14px Inter,sans-serif}
.fine{margin-top:11px;text-align:center;color:var(--dim);font-size:11px}

/* the list */
.sechead{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 16px}
.cap2{color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.2em}
h2{font:28px/1.2 "Archivo Black",sans-serif;margin-top:6px}
.search{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;color:var(--muted);font-size:12.5px;width:240px;outline:0}
.search::placeholder{color:var(--dim)}
.search:focus{border-color:rgba(0,207,255,.6)}
.table{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(10,14,23,.9)}
.rcols{display:grid;grid-template-columns:70px 360px 330px 150px 1fr 44px;align-items:center}
.thead{padding:11px 0;color:var(--dim);font-size:10.5px;letter-spacing:.12em;font-weight:700;background:var(--panel);border-bottom:1px solid var(--line)}
.frow{padding:14px 0;border-bottom:1px solid rgba(30,48,80,.7)}
.frow>div:first-child{padding-left:22px}
.frow.off .farm,.frow.off .sl,.frow.off .amt{opacity:.5}
.tg{width:38px;height:22px;border-radius:12px;background:var(--line);position:relative;display:block}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:left .12s}
.tg.on{background:rgba(0,255,136,.25);box-shadow:inset 0 0 0 1px rgba(0,255,136,.6)}
.tg.on::after{left:19px;background:var(--green);box-shadow:0 0 8px rgba(0,255,136,.8)}
.farm{display:flex;align-items:center;gap:12px;min-width:0}
.farm b{font-size:15px;white-space:nowrap}
.lg{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.c1{background:rgba(0,207,255,.14);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(0,207,255,.45)}
.c2{background:rgba(0,255,136,.12);color:var(--green);box-shadow:inset 0 0 0 1px rgba(0,255,136,.45)}
.c3{background:rgba(59,130,246,.16);color:var(--blue);box-shadow:inset 0 0 0 1px rgba(59,130,246,.5)}
.c4{background:rgba(127,147,173,.14);color:var(--muted);box-shadow:inset 0 0 0 1px rgba(127,147,173,.4)}
.chip{font-size:10px;font-weight:800;letter-spacing:.08em;border-radius:6px;padding:3px 7px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.g{color:var(--green);background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.35)}
.chip.c{color:var(--cyan);background:rgba(0,207,255,.08);border:1px solid rgba(0,207,255,.3)}
.chip.f{color:var(--green);border:1px dashed rgba(0,255,136,.55)}
.chip.r{color:var(--red);background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.35)}
.chip.m{color:var(--muted);border:1px solid var(--line)}
.chip.s{color:var(--deep);background:var(--green)}
.chip.lv{color:var(--green);background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.35)}
.chip.lv::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.sl{padding-right:34px}
.rng{position:relative;height:20px}
.rng .trk,.rng .fil{position:absolute;left:0;top:7px;height:6px;border-radius:4px}
.rng .trk{right:0;background:var(--line)}
.rng .fil{background:linear-gradient(90deg,var(--cyan),var(--green))}
.rng .recm{position:absolute;top:1px;width:2px;height:18px;background:var(--cyan);border-radius:1px;transform:translateX(-1px)}
.rng .recm::after{content:"";position:absolute;top:-5px;left:-3px;border:4px solid transparent;border-top-color:var(--cyan)}
.rng input{position:absolute;inset:0;width:100%;height:20px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;outline:0;cursor:pointer}
.rng input::-webkit-slider-runnable-track{height:20px;background:transparent}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:1px;border-radius:50%;background:var(--text);box-shadow:0 0 0 3px var(--green),0 0 12px rgba(0,255,136,.6);cursor:grab}
.rng input::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--text);box-shadow:0 0 0 3px var(--green)}
.frow.off .rng input::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--dim)}
.freeline{color:var(--dim);font-size:12px}
.amt{display:flex;align-items:center;gap:6px;background:var(--deep);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:126px}
.amt:focus-within{border-color:rgba(0,207,255,.6)}
.amt input{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:0;font-size:15px;font-weight:700;text-align:right;color:var(--text)}
.amt span{color:var(--dim);font-size:10px}
.amt.free{justify-content:center;border-style:dashed;border-color:rgba(0,255,136,.45);color:var(--green);font-weight:800;font-size:12px;letter-spacing:.08em}
.best{margin-top:5px;font-size:11px;height:16px;color:var(--dim)}
.best:empty{display:none}
.best .ok{color:var(--green);font-weight:700}
.best button{color:var(--cyan);font-size:11px;font-weight:700}
.best button:hover{text-decoration:underline}
.est b{font:21px/1.2 "Archivo Black",sans-serif;color:var(--green);white-space:nowrap}
.est b.dim{font:600 14px "JetBrains Mono",monospace;color:var(--dim)}
.est b.no{font:500 13px "JetBrains Mono",monospace;color:var(--dim)}
.chev{color:var(--dim);font-size:14px;text-align:center;width:26px;height:26px;border-radius:7px}
.chev:hover{background:rgba(0,207,255,.1);color:var(--cyan)}
.chev.open{color:var(--cyan)}
.frow.open{background:linear-gradient(180deg,rgba(0,207,255,.06),transparent);border-bottom:0}

/* simulator */
.sim{display:grid;grid-template-columns:1fr 400px;gap:26px;padding:4px 30px 24px 92px;border-bottom:1px solid rgba(30,48,80,.7);
  background:linear-gradient(180deg,transparent,rgba(0,207,255,.03))}
.sim .chart{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:10px 14px 4px}
.sim .chart svg{display:block;width:100%;height:auto;cursor:crosshair}
.sim svg text{font-family:"JetBrains Mono",monospace}
.out{display:flex;flex-direction:column;justify-content:center;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:18px 22px}
.out .h{color:var(--muted);font-size:12px}
.out .big{font:27px/1.2 "Archivo Black",sans-serif;margin:6px 0 2px;white-space:nowrap}
.out .big em{font-style:normal;color:var(--green)}
.out .bigl{color:var(--dim);font-size:11.5px}
.out dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:14px;font-size:12px}
.out dt{color:var(--dim)}
.out dd{text-align:right;color:var(--text);font-weight:600}
.how{margin-top:14px;font-size:11.5px;color:var(--cyan);cursor:help;align-self:flex-start;display:inline-flex;gap:7px;align-items:center}
.how i{font-style:normal;width:15px;height:15px;border-radius:50%;border:1px solid var(--cyan);display:grid;place-items:center;font-size:10px;font-weight:800}
.noest{grid-column:1/-1;display:flex;gap:16px;align-items:center;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:18px 22px;color:var(--muted);font-size:13px}
.noest b{font:18px "Archivo Black",sans-serif;color:var(--dim);white-space:nowrap}
.more{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;color:var(--dim);font-size:12px;background:var(--panel)}
.more span.btn{color:var(--cyan);border:1px solid rgba(0,207,255,.4);border-radius:8px;padding:6px 14px}

/* live farms: three numbers, the climb, the farms */
.ltiles{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:14px;margin-top:26px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 22px;position:relative;min-height:122px}
.tile small{display:block;color:var(--dim);font-size:10.5px;letter-spacing:.14em;font-weight:700}
.tile b{display:block;font:34px/1.25 "Archivo Black",sans-serif;margin-top:6px;white-space:nowrap}
.tile span{font-size:12px;color:var(--dim)}
.tile span em{font-style:normal;color:var(--green);font-weight:800}
.tile.hi{border-color:rgba(0,255,136,.5);background:linear-gradient(180deg,rgba(0,255,136,.1),var(--panel))}
.tile.hi b{color:var(--green);font-size:38px;text-shadow:0 0 26px rgba(0,255,136,.35)}
.claimbig{position:absolute;right:20px;bottom:20px;background:var(--green);color:var(--deep);font:800 13px Inter,sans-serif;letter-spacing:.05em;
  border-radius:10px;padding:10px 16px;box-shadow:0 0 22px rgba(0,255,136,.45)}
.chartc{margin-top:14px;padding:16px 22px 12px}
.chartc svg{display:block;width:100%;height:auto}
.ticker{display:flex;gap:18px;align-items:center;border-top:1px solid var(--line);margin-top:8px;padding-top:11px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.ticker .lab{color:var(--cyan);font-size:10.5px;letter-spacing:.14em;font-weight:700;flex:none}
.ticker .ev{display:inline-flex;gap:7px;align-items:center;flex:none}
.ticker .ev i{width:7px;height:7px;border-radius:50%;flex:none}
.ticker .ev time{color:var(--dim)}
.ticker .ev b{color:var(--text);font-weight:600}
.ticker .ev em{font-style:normal;color:var(--green)}
.lcols{display:grid;grid-template-columns:420px 130px 250px 210px 1fr;align-items:center}
.lrow{padding:14px 0;border-bottom:1px solid rgba(30,48,80,.7)}
.lrow>div:first-child,.lhead>div:first-child,.ltot>div:first-child{padding-left:22px}
.lhead{padding:11px 0;color:var(--dim);font-size:10.5px;letter-spacing:.12em;font-weight:700;background:var(--panel);border-bottom:1px solid var(--line)}
.lrow b{font-size:14px}
.pts b{font-size:14px}
.pts em{font-style:normal;color:var(--green);font-size:12px;margin-left:8px;font-weight:700}
.earn{font:16px "Archivo Black",sans-serif;color:var(--green);white-space:nowrap}
.earn.no{font:500 13px "JetBrains Mono",monospace;color:var(--dim)}
.acts{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding-right:20px}
.acts .claim{background:var(--green);color:var(--deep);font:800 12.5px Inter,sans-serif;border-radius:9px;padding:8px 14px;box-shadow:0 0 16px rgba(0,255,136,.4);white-space:nowrap}
.acts .stop{color:var(--dim);font:600 12px Inter,sans-serif;padding:7px 9px;border-radius:7px}
.acts .stop:hover{color:var(--red);background:rgba(255,68,68,.08)}
.ltot{padding:14px 0;background:var(--panel);font-weight:700}
.ltot .earn{font-size:17px}
.emptylive{padding:46px 20px;text-align:center;color:var(--muted);font-size:14px;margin-top:26px}
.emptylive b{display:block;font:24px "Archivo Black",sans-serif;color:var(--text);margin-bottom:8px}
.emptylive .go{margin-top:18px;padding:13px 24px}
.float{position:fixed;z-index:70;font:22px "Archivo Black",sans-serif;color:var(--green);pointer-events:none;text-shadow:0 0 16px rgba(0,255,136,.7);
  animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}

/* confirmation, toast, test ribbon */
.ov{position:fixed;inset:0;background:rgba(6,9,15,.8);display:grid;place-items:center;z-index:50}
.modal{width:520px;max-height:86vh;overflow:auto;padding:26px 28px}
.modal h3{font:26px "Archivo Black",sans-serif;margin:8px 0 2px}
.modal .mbig{font:34px/1.2 "Archivo Black",sans-serif;color:var(--green);text-shadow:0 0 24px rgba(0,255,136,.3);margin-top:14px}
.modal .mbigl{color:var(--dim);font-size:12px}
.modal details{margin-top:16px;border-top:1px solid var(--line)}
.modal summary{cursor:pointer;color:var(--cyan);font-size:12.5px;padding:10px 0;list-style:none}
.modal summary::-webkit-details-marker{display:none}
.modal .ln{display:grid;grid-template-columns:1fr 90px 140px;gap:8px;padding:7px 0;border-bottom:1px solid rgba(30,48,80,.6);font-size:12.5px}
.modal .ln span:nth-child(2){text-align:right;font-weight:700}
.modal .ln span:nth-child(3){text-align:right;color:var(--green)}
.modal .ln small{color:var(--dim)}
.modal .kv{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.modal .kv b{color:var(--text)}
.modal .lead{color:var(--dim);font-size:12px;margin-top:12px}
.modal .btns{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:18px}
.modal .btns .go{padding:15px;display:flex;align-items:center;justify-content:center;gap:9px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--panel);border:1px solid rgba(0,207,255,.5);color:var(--text);
  padding:10px 18px;border-radius:10px;font-size:13px;z-index:60;box-shadow:0 8px 30px rgba(6,9,15,.8)}
.ribbon{position:fixed;right:16px;top:6px;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;align-items:center}
.ribbon b{color:var(--cyan);letter-spacing:.12em;font-size:10.5px}
.ribbon button{border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--muted);font-size:11px}
.ribbon button.on{border-color:rgba(0,255,136,.55);color:var(--green)}

/* logo sheet */
.sheet{display:flex;gap:40px;align-items:center;justify-content:center;padding:60px 40px}
.sheet .bigl svg{width:300px;height:300px}
.sheet .wm{display:flex;align-items:center;gap:18px}
.sheet .wm svg{width:92px;height:92px}
.sheet .wm span{color:var(--cyan);font-size:19px;letter-spacing:.32em;font-weight:600;display:block}
.sheet .wm b{font-size:34px;font-weight:800;letter-spacing:.02em;display:block;margin-top:4px}
.sizes{display:flex;gap:22px;align-items:flex-end;margin-top:34px}
.sizes div{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--dim);font-size:11px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="afg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00cfff"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
    <linearGradient id="afh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff88"/><stop offset="1" stop-color="#00cfff"/></linearGradient>
    <filter id="afglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <symbol id="logo" viewBox="0 0 64 64">
    <circle cx="32" cy="41" r="17" fill="#06090f" stroke="url(#afg)" stroke-width="3"/>
    <circle cx="32" cy="41" r="12" fill="none" stroke="#00cfff" stroke-opacity=".4" stroke-width="1" stroke-dasharray="1.6 2.6"/>

<script>
/* Airdrop Farmer: the design and a local test version in one page.
   ?shot=1 is the state the Build it Better pictures show (render.py), computed by the same code: the Farms tab
   before Start, and Live farms after a 23-day run of that same plan. Without it every control works on test data
   kept in this browser only. Nothing here talks to any server. */
const Q = new URLSearchParams(location.search);
const SHOT = Q.has("shot");
let TAB = Q.get("tab") || "farms";
const KEY = "airdrop-farmer-test-v2";
const H = 6; // every estimate is over six months
const fmt = n => Math.round(n).toLocaleString("en-US");
const usd = n => "$" + fmt(n);
const r10 = n => Math.round(n / 10) * 10;
const money = n => n < 100 ? "$" + Math.round(n) : usd(r10(n)); // small amounts to the dollar
const kM = v => v >= 1e9 ? +(v / 1e9).toFixed(1) + "B" : Math.round(v / 1e6) + "M";
const logo = () => `<svg><use href="#logo"/></svg>`;
const BOLT = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 14h6.5L9.5 22 20 9.5h-6.6z"/></svg>`;
const $ = s => document.querySelector(s);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = SHOT ? mulberry32(7) : Math.random; // the pictures come out the same every run

/* ---------- farms: the examples from the live points programs, then test data ---------- */
// ref: the amount lo/hi (est. airdrop over 6 months) are given at; knee: above it each dollar earns 0.32x here.
// cf: fixed cost (gas) per 6 months; cp: cost per $1,000 per 6 months (fees, funding); ppw: points a week at ref.
// chip: the one thing a degen needs to know about the farm.
const FARMS = [
  {id: "arcus", c: "c1", ini: "AR", name: "Arcus", chip: ["TOKEN CONFIRMED", "g"], how: "Deposit", season: "Season 1", ref: 1000, knee: 1000, lo: 260, hi: 940, cf: 1, cp: 0, ppw: 1840, pool: .05, fdv: 250e6, live: {pts: 1}},
  {id: "variational", c: "c2", ini: "VA", name: "Variational", chip: ["TGE Q4 2026", "g"], how: "Trade", season: "TGE Q4 2026", ref: 800, knee: 800, lo: 180, hi: 720, cf: 0, cp: 42.5, ppw: 420, pool: .32, fdv: 60e6, live: {pts: 1, tge: 30, tk: "VAR", px: .45}},
  {id: "polymarket", c: "c3", ini: "PM", name: "Polymarket", chip: ["PAYS DAILY", "c"], how: "LP", season: "LP rewards", ref: 600, knee: 700, lo: 40, hi: 310, cf: 0, cp: 10, ppw: 0, pool: .05, fdv: 5e9, live: {daily: .0004, tk: "pUSD", px: 1}},
  {id: "lighter", c: "c1", ini: "LI", name: "Lighter", chip: ["PAYS WEEKLY", "c"], how: "Trade", season: "11M LIT pool", ref: 500, knee: 500, lo: 90, hi: 260, cf: 0, cp: 44, ppw: 0, pool: .011, fdv: 1.6e9, live: {weekly: .007, tk: "LIT", px: 1.92}},
  {id: "risex", c: "c2", ini: "RX", name: "RISEx", chip: ["POINTS LIVE", "c"], how: "Trade", season: "Season 1", ref: 400, knee: 400, lo: 70, hi: 410, cf: 0, cp: 42.5, ppw: 2730, pool: .08, fdv: 150e6, live: {pts: 1}},
  {id: "nado", c: "c3", ini: "NA", name: "Nado", chip: ["POINTS → INK", "g"], how: "Trade", season: "Season 2", ref: 400, knee: 350, lo: 60, hi: 300, cf: 0, cp: 40, ppw: 4270, pool: .04, fdv: 300e6, live: {pts: 1, tge: 45, tk: "INK", px: .12}},
  {id: "n1", c: "c4", ini: "N1", name: "N1", chip: ["POINTS LIVE", "c"], how: "Trade", season: "Season 1", ref: 300, knee: 300, lo: 30, hi: 250, cf: 0, cp: 43, ppw: 2400, pool: .06, fdv: 100e6, live: {pts: 1}},
  {id: "ostium", c: "c1", ini: "OS", name: "Ostium", chip: ["POINTS LIVE", "c"], how: "Trade", season: "Season 2", ref: 300, knee: 300, lo: 40, hi: 190, cf: 0, cp: 40, ppw: 980, pool: .05, fdv: 120e6, live: {pts: 1, cap0: .62, capDay: .0083}},
  {id: "base", c: "c3", ini: "BA", name: "Base", chip: ["SPECULATIVE", "m"], how: "Bridge", season: "no points program", lo: null, cf: 3, cp: 0, why: "no points program yet", live: {txs: 1.5}},
  {id: "pacifica", c: "c2", ini: "PA", name: "Pacifica", chip: ["POINTS LIVE", "c"], how: "Trade", season: "Season 1", ref: 250, knee: 250, lo: 20, hi: 140, cf: 0, cp: 40, ppw: 630, pool: .05, fdv: 80e6, live: {pts: 1}},
  {id: "arc", c: "c1", ini: "AC", name: "Arc Testnet", chip: ["FREE", "f"], how: "Testnet", season: "testnet", lo: null, free: 1, why: "no points rate published", live: {txs: 3}},
  {id: "axis", c: "c2", ini: "AX", name: "Axis Robotics", chip: ["FREE", "f"], how: "Tasks", season: "2-week epochs", lo: null, free: 1, why: "no points rate published", live: {tasks: 1, epoch: 14}},
];
// not listed: a farm with nothing to farm now (Extended, its points cap used up; Hyperliquid, no points phase)
if (!SHOT) { // test farms, so the list is long enough to try search and big budgets
  [["Lending", "Deposit", 0, [["Alpha", 400, .26], ["Beta", 600, .22], ["Gamma", 500, .19], ["Delta", 800, .16]]],
   ["Vault", "LP", 8, [["Alpha", 500, .24], ["Beta", 700, .2], ["Gamma", 400, .18], ["Delta", 900, .14]]],
   ["Chain", "Bridge", 4, [["Alpha", 300, .21], ["Beta", 400, .17], ["Gamma", 250, .15]]],
   ["Predict", "LP", 10, [["Alpha", 300, .2]]],
   ["Perp", "Trade", 40, [["Alpha", 400, .27], ["Beta", 300, .22]]],
  ].forEach(([label, how, cp, list], j) => list.forEach(([gr, knee, eff], i) => {
    const mid = (eff + cp / 1000) * knee;
    FARMS.push({id: (label + gr).toLowerCase(), c: ["c1", "c2", "c3", "c4"][(i + j) % 4], ini: label[0] + gr[0], name: label + " " + gr,
      chip: ["POINTS LIVE", "c"], how, season: "test data", ref: knee, knee, lo: r10(mid * .45), hi: r10(mid * 1.55), cf: cp ? 0 : 1, cp,
      ppw: knee * 3, pool: .05, fdv: 200e6, live: {pts: 1}, test: 1});
  }));
  [["Testnet Alpha", "Testnet"], ["Testnet Beta", "Testnet"], ["Tasks Alpha", "Tasks"]].forEach(([name, how], i) =>
    FARMS.push({id: name.replace(" ", "").toLowerCase(), c: ["c2", "c3", "c1"][i], ini: name[0] + name.split(" ")[1][0], name, chip: ["FREE", "f"],
      how, season: "test data", lo: null, free: 1, why: "no points rate published", live: how === "Tasks" ? {tasks: 1, epoch: 14} : {txs: 2}, test: 1}));
}
const BY = Object.fromEntries(FARMS.map(f => [f.id, f]));

/* ---------- the maths ---------- */
const g = (f, x) => Math.min(x, f.knee) + .32 * Math.max(0, x - f.knee);
function est(f, x, months = H) {
  if (f.lo == null || x <= 0) return null;
  const k = g(f, x) / g(f, f.ref) * months / 6;
  return {lo: f.lo * k, hi: f.hi * k};
}
const cost = (f, x, months = H) => f.free || x <= 0 ? 0 : (f.cf + (f.cp || 0) * x / 1000) * months / 6;
const midPer = (f, x) => { const e = est(f, x); return e ? (e.lo + e.hi) / 2 : 0; };
const eff = f => f.lo == null ? -1 : midPer(f, f.ref) / f.ref - (f.cp || 0) / 1000;
// best first: estimated farms by what a dollar earns, then free ones, then the rest, ending last
const rank = f => f.lo != null ? 1 - eff(f) : f.free ? 2 : f.chip[1] === "r" ? 4 : 3;
// the best split of a budget: a step at a time to the farm where the next dollar earns most, net of costs,
// at most 20% of the budget in one farm; a farm with no estimate gets nothing
function recommend(B) {
  const a = {}, ok = FARMS.filter(f => f.lo != null && !f.free);
  ok.forEach(f => a[f.id] = 0);
  const step = Math.max(50, Math.ceil(B / 400 / 50) * 50);
  let left = Math.floor(B / step) * step;
  while (left >= step) {
    let best = null, bm = .05;
    for (const f of ok) {
      if (a[f.id] + step > B * .2) continue;
      const m = (midPer(f, a[f.id] + step) - midPer(f, a[f.id])) / step - (f.cp || 0) / 1000;
      if (m > bm) { bm = m; best = f; }
    }
    if (!best) break;
    a[best.id] += step; left -= step;
  }
  return a;
}

/* ---------- state ---------- */
const DEFAULT = () => ({budget: 5000, balance: 7240, amt: {}, on: {}, last: {}, custom: false, open: null, q: "", farming: null, speed: 4});
let S = DEFAULT();
if (!SHOT) try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) S = Object.assign(DEFAULT(), s); } catch (e) {}
const save = () => { if (SHOT) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let REC = recommend(S.budget);
const rec = f => f.free ? 0 : (REC[f.id] || 0);
const amtOf = id => S.amt[id] || 0;
const allocated = () => FARMS.reduce((s, f) => s + (S.on[f.id] && !f.free ? amtOf(f.id) : 0), 0);
const liveSum = () => S.farming ? Object.values(S.farming.farms).reduce((s, l) => s + l.amount, 0) : 0;
// the list starts as the best split and follows the amount until the user changes a farm
function applyBest() {
  FARMS.forEach(f => { const r = rec(f); S.amt[f.id] = f.free ? 0 : r; S.on[f.id] = f.free ? true : r > 0; });
  S.custom = false;
}
if (!S.custom) applyBest();

function toast(t) {
  const el = $("#toast");
  el.innerHTML = `<div class="toast">${t}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.innerHTML = "", 2600);
}
function floatUp(x, y, text) {
  const el = document.createElement("div");
  el.className = "float"; el.textContent = text;
  el.style.left = x - 20 + "px"; el.style.top = y - 30 + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

/* ---------- header ---------- */
function header() {
  const n = S.farming ? Object.keys(S.farming.farms).length : 0;
  const status = n ? `<span class="dot"></span><b>FARMING</b> · ${n} farm${n > 1 ? "s" : ""} · ${usd(liveSum())} in` : `<span class="dot idle"></span><b>NOT FARMING</b>`;
  return `<header class="app">
    <a class="brand">${logo()}<div class="w"><span>AIRDROP</span><b>FARMER</b></div></a>
    <nav><a href="?tab=farms" data-tab="farms" class="${TAB === "farms" ? "on" : ""}">Farms</a><a href="?tab=live" data-tab="live" class="${TAB === "live" ? "on" : ""}">Live farms${n ? ` <i>${n}</i>` : ""}</a></nav>
    <div class="status" id="hstatus">${status}</div>
  </header>`;
}

/* ---------- Farms tab ---------- */
function farmsView() {
  const N = SHOT ? 412 : FARMS.length;
  return `<div class="back">← Back</div><div class="wrap">${header()}
  <section class="hero">
    <div>
      <div class="pill"><span class="dot"></span>${N} FARMS · ONE DEPOSIT</div>
      <h1>Deploy USDC.<br>Farm every airdrop.<br><em>Cymetica does the rest.</em></h1>
      <div class="sub">Chatbots explain airdrops. <b>Cymetica farms them.</b></div>
    </div>
    <div class="card plan">
      <div class="cap">HOW MUCH USDC?</div>
      <div class="bigin"><input id="budget" inputmode="decimal" autocomplete="off" value="${fmt(S.budget)}" aria-label="USDC to farm"><span>USDC</span><button class="max" data-act="max">MAX</button></div>
      <div class="bal">Balance <b id="bal">${fmt(S.balance)}</b> USDC</div>
      <div class="youfarm"><small>You farm ≈</small><b id="kest"></b><span>in airdrops over 6 months</span></div>
      <div class="planline"><span id="pline"></span><span id="bestslot"></span></div>
      <button class="go big" data-act="start" id="gobtn"></button>
      <div class="fine">Stop any farm any time</div>
    </div>
  </section>
  <div class="sechead">
    <div><div class="cap2">ALL FARMS</div><h2>${N} farms. Best first.</h2></div>
    <input id="q" class="search" placeholder="Search farms" value="${S.q}" aria-label="Search farms">
  </div>
  <div class="table">
    <div class="thead rcols"><div></div><div>FARM</div><div>DEPLOY</div><div>USDC</div><div>EST. AIRDROP · 6 MO</div><div></div></div>
    <div id="list"></div>
    <div class="more" id="more"></div>
  </div></div>`;
}

function visible() {
  const L = FARMS.filter(f => f.name.toLowerCase().includes(S.q.toLowerCase()));
  return L.sort((a, b) => rank(a) - rank(b));
}
const sstep = () => Math.max(50, Math.ceil(S.budget / 400 / 50) * 50);
const pct = v => Math.min(1, v / Math.max(S.budget, 1));
const pos = v => `calc(9px + (100% - 18px) * ${pct(v)})`;

function rowHTML(f) {
  const a = amtOf(f.id), on = !!S.on[f.id], r = rec(f), open = S.open === f.id;
  const sl = f.free ? `<div class="sl"><span class="freeline">no USDC needed</span></div>`
    : `<div class="sl"><div class="rng"><i class="trk"></i><i class="fil" style="width:${pos(a)}"></i>${r ? `<i class="recm" style="left:${pos(r)}" title="best ${usd(r)}"></i>` : ""}
        <input type="range" min="0" max="${S.budget}" step="${sstep()}" value="${a}" data-rng="${f.id}" aria-label="USDC into ${f.name}"></div></div>`;
  const field = f.free ? "" : `<div class="amt"><input data-amt="${f.id}" inputmode="decimal" value="${fmt(a)}" aria-label="${f.name} USDC"><span>USDC</span></div>`;
  return `<div class="frow rcols ${on ? "" : "off"} ${open ? "open" : ""}" data-row="${f.id}">
    <div><button class="tg ${on ? "on" : ""}" data-tog="${f.id}" aria-label="Farm ${f.name}"></button></div>
    <div class="farm"><span class="lg ${f.c}">${f.ini}</span><b>${f.name}</b><span class="chip ${f.chip[1]}">${f.chip[0]}</span></div>
    ${sl}
    <div>${field}<div class="best" id="best-${f.id}">${bestHTML(f)}</div></div>
    <div class="est" id="est-${f.id}">${estHTML(f)}</div>
    <div><button class="chev ${open ? "open" : ""}" data-open="${f.id}" aria-label="Simulator for ${f.name}">${open ? "▴" : "▾"}</button></div>
  </div>${open ? `<div class="sim" id="sim">${simHTML(f)}</div>` : ""}`;
}
// the best amount is the tick on the slider; spelled out only where the farm is off it
function bestHTML(f) {
  const r = rec(f), a = amtOf(f.id);
  if (f.free || !r || (a === r && S.on[f.id])) return "";
  return `<button data-use="${f.id}">best ${usd(r)}</button>`;
}
function estHTML(f) {
  if (f.lo == null) return `<b class="no">no estimate</b>`;
  const a = S.on[f.id] ? amtOf(f.id) : 0, e = est(f, a);
  if (!e) { const ep = est(f, rec(f) || f.ref); return `<b class="dim">${usd(r10(ep.lo))} – ${usd(r10(ep.hi))}</b>`; }
  return `<b>${usd(r10(e.lo))} – ${usd(r10(e.hi))}</b>`;
}

function renderList() {
  const L = visible();
  $("#list").innerHTML = L.length ? L.map(rowHTML).join("") : `<div class="more" style="background:none">No farm matches.</div>`;
  $("#more").innerHTML = SHOT ? `<span>Showing ${L.length} of 412 farms</span><span class="btn">Show 50 more</span>`
    : `<span>Showing ${L.length} of ${FARMS.length} farms</span><span>test data</span>`;
}

function planTotals() {
  let lo = 0, hi = 0, n = 0, a = 0, c = 0;
  FARMS.forEach(f => {
    if (!S.on[f.id]) return;
    const x = f.free ? 0 : amtOf(f.id), e = est(f, x);
    n++; a += x; c += Math.round(cost(f, x));
    if (e) { lo += r10(e.lo); hi += r10(e.hi); }
  });
  return {lo, hi, n, a, c};
}
// the big number counts to its new value
function tweenRange(el, lo, hi) {
  const from = el._v || [lo, hi]; el._v = [lo, hi];
  cancelAnimationFrame(el._raf);
  if (SHOT || (from[0] === lo && from[1] === hi)) { el.textContent = `${usd(lo)} – ${usd(hi)}`; return; }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 380), e = 1 - Math.pow(1 - k, 3);
    el.textContent = `${usd(from[0] + (lo - from[0]) * e)} – ${usd(from[1] + (hi - from[1]) * e)}`;
    if (k < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}
function updatePlan() {
  const t = planTotals();
  tweenRange($("#kest"), t.lo, t.hi);
  $("#pline").innerHTML = `<b>${t.n}</b> farms · <b>${usd(t.a)}</b> of ${usd(S.budget)}${t.a > S.budget ? ` <span class="over">over</span>` : ""}`;
  $("#bestslot").innerHTML = S.custom ? `<button class="bestbtn" data-act="best">↺ best split</button>` : `<span class="bestok">best split ✓</span>`;
  $("#bal").textContent = fmt(S.balance);
  $("#gobtn").innerHTML = BOLT + (S.farming ? "UPDATE FARMS" : "START FARMING");
}

// one row's moving parts, without redrawing the slider being dragged
function updateRow(id) {
  const f = BY[id], row = document.querySelector(`[data-row="${id}"]`);
  if (!row) return;
  const a = amtOf(id), on = !!S.on[id];
  row.classList.toggle("off", !on);
  row.querySelector(".tg").classList.toggle("on", on);
  const fil = row.querySelector(".fil"); if (fil) fil.style.width = pos(a);
  const rg = row.querySelector("[data-rng]"); if (rg && +rg.value !== a) rg.value = a;
  const fi = row.querySelector("[data-amt]"); if (fi && document.activeElement !== fi) fi.value = fmt(a);
  $("#best-" + id).innerHTML = bestHTML(f);
  $("#est-" + id).innerHTML = estHTML(f);
  if (S.open === id && $("#sim")) $("#sim").innerHTML = simHTML(f);
}

// set one farm's amount by hand, never past the budget
function setAmt(id, v, quiet) {
  const f = BY[id];
  if (f.free) return;
  v = Math.max(0, Math.round(v || 0));
  const room = S.budget - (allocated() - (S.on[id] ? amtOf(id) : 0));
  if (v > room) { v = Math.max(0, Math.floor(room)); if (!quiet) toast(`All your USDC is in farms: raise the amount or lower another farm`); }
  S.amt[id] = v; S.on[id] = v > 0; S.custom = true;
  if (v > 0) S.last[id] = v;
  updateRow(id); updatePlan(); save();
}

// typing moves the plan at once; on Enter, leaving the field or MAX the amount is held to the balance
function setBudget(B, commit) {
  B = Math.max(0, Math.round(B || 0));
  const most = Math.floor(S.balance + liveSum());
  if (commit && B > most) { B = most; toast(`Only ${usd(most)} USDC in your balance`); const el = $("#budget"); if (el) el.value = fmt(B); }
  S.budget = B;
  REC = recommend(B);
  if (!S.custom) applyBest();
  else if (commit && allocated() > B) {
    const k = B / allocated();
    FARMS.forEach(f => { if (S.on[f.id] && !f.free) { S.amt[f.id] = Math.floor(amtOf(f.id) * k); if (!S.amt[f.id]) S.on[f.id] = false; } });
    toast(`Your farms were scaled down to fit ${usd(B)}`);
  }
  renderList(); updatePlan(); save();
}

/* ---------- simulator: drag, see the airdrop ---------- */
function simHTML(f) {
  const a = S.on[f.id] ? amtOf(f.id) : 0, r = rec(f), B = Math.max(S.budget, 100);
  if (f.lo == null) return `<div class="noest"><b>No estimate</b><span>${f.name}: ${f.why}. ${f.free ? "It is free, so Cymetica farms it in case a token comes." : "Cymetica can farm it, but nothing would put a number on it."}</span></div>`;
  const W = 640, Hh = 196, L = 14, R = 14, T = 28, Bm = 26;
  const ymax = est(f, B).hi * 1.08;
  const x = v => L + v / B * (W - L - R), y = v => Hh - Bm - v / ymax * (Hh - T - Bm);
  const pts = []; for (let i = 0; i <= 60; i++) pts.push(B * i / 60);
  [f.knee, r, a].forEach(v => v > 0 && v < B && pts.push(v)); pts.sort((p, q) => p - q);
  const E = v => est(f, v) || {lo: 0, hi: 0}, M = v => (E(v).lo + E(v).hi) / 2;
  const band = pts.map(v => `${x(v)},${y(E(v).hi)}`).join(" ") + " " + pts.slice().reverse().map(v => `${x(v)},${y(E(v).lo)}`).join(" ");
  const line = pts.map(v => `${x(v)},${y(M(v))}`).join(" ");
  const right = r && x(r) > W - 150; // the one label in the chart, kept inside it
  const bestl = r ? `<line x1="${x(r)}" x2="${x(r)}" y1="${T - 6}" y2="${Hh - Bm}" stroke="#00cfff" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="${x(r) + (right ? -7 : 7)}" y="${T - 10}" fill="#00cfff" font-size="11" font-weight="700" text-anchor="${right ? "end" : "start"}">best ${usd(r)}</text>` : "";
  const dot = a > 0 ? `<circle cx="${x(a)}" cy="${y(M(a))}" r="7" fill="#06090f" stroke="#00ff88" stroke-width="3"/>` : "";
  const shown = a || r || f.ref, es = est(f, shown), fdvHi = f.fdv * f.hi / f.lo;
  const rate = f.ppw ? `<dt>Points a week</dt><dd>≈ ${fmt(f.ppw * g(f, shown) / g(f, f.ref))}</dd>`

    : f.live.daily ? `<dt>Paid every day</dt><dd>≈ ${(f.live.daily * shown).toFixed(2)} ${f.live.tk}</dd>` : "";

    + (f.knee < B ? ` Above ${usd(f.knee)} each dollar earns less here than in your next farm.` : "")
    + ` As of 21 Oct 14:05 UTC. ${f.test ? "Test data." : `${f.name} ${f.season} rules; FDV from comparable launches.`}`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" data-chart="${f.id}" data-l="${L}" data-w="${W - L - R}" data-vw="${W}">
      <line x1="${L}" x2="${W - R}" y1="${Hh - Bm}" y2="${Hh - Bm}" stroke="#1e3050"/>
      ${f.knee < B ? `<rect x="${x(f.knee)}" y="${T - 6}" width="${x(B) - x(f.knee)}" height="${Hh - Bm - T + 6}" fill="rgba(6,9,15,.45)"/>` : ""}
      <polygon points="${band}" fill="rgba(0,207,255,.14)"/><polyline points="${line}" fill="none" stroke="#00ff88" stroke-width="2.4"/>
      ${bestl}${dot}
      <text x="${L}" y="${Hh - 7}" fill="#7f93ad" font-size="10.5">$0</text>
      <text x="${W - R}" y="${Hh - 7}" fill="#7f93ad" font-size="10.5" text-anchor="end">${usd(B)}</text>
    </svg></div>
    <div class="out">
      <div class="h">If you deploy</div>
      <div class="big">${usd(shown)} → <em>${usd(r10(es.lo))} – ${usd(r10(es.hi))}</em></div>
      <div class="bigl">est. airdrop in 6 months</div>
      <dl>${rate}<dt>Token value at launch</dt><dd>$${kM(f.fdv)} – $${kM(fdvHi)}</dd></dl>

    </div>`;
}

/* ---------- start farming ---------- */
const FIRST = {Deposit: (n, f) => `Deposited ${n} into <b>${f}</b>`, Trade: (n, f) => `<b>${f}</b>: hedged positions opened, ${n}`,
  LP: (n, f) => `Quoting liquidity on <b>${f}</b> with ${n}`, Bridge: (n, f) => `Bridged ${n} to <b>${f}</b>`,
  Testnet: (n, f) => `<b>${f}</b>: testnet wallet set up`, Tasks: (n, f) => `<b>${f}</b>: first task started`};
const planLines = () => FARMS.filter(f => S.on[f.id]).sort((a, b) => rank(a) - rank(b)).map(f => ({f, a: f.free ? 0 : amtOf(f.id), e: est(f, f.free ? 0 : amtOf(f.id))}));
function openStart() {
  const L = planLines();
  if (!L.length) return toast("Switch on at least one farm");
  const t = planTotals(), need = t.a - liveSum();
  if (t.a > S.budget) return toast("Your farms add up to more than your amount");
  if (need > S.balance) return toast(`Not enough USDC: you need ${usd(need)}, the balance is ${usd(S.balance)}`);
  $("#modal").innerHTML = `<div class="ov" data-act="close"><div class="card modal">
    <div class="cap">${S.farming ? "UPDATE YOUR FARMS" : "START FARMING"}</div>
    <h3>${t.n} farms · ${usd(t.a)}</h3>

    <div class="mbigl">est. airdrops over 6 months</div>
    <details><summary>See the ${t.n} farms ▾</summary>
      ${L.map(l => `<div class="ln"><span>${l.f.name}</span><span>${l.f.free ? "free" : usd(l.a)}</span><span>${l.e ? `${usd(r10(l.e.lo))} – ${usd(r10(l.e.hi))}` : `<small>no estimate</small>`}</span></div>`).join("")}
    </details>
    <div class="kv"><span>Est. cost (fees, funding, gas)</span><b>${usd(t.c)}</b></div>
    <div class="kv"><span>Cymetica fee</span><b style="color:var(--dim)">set by Cymetica</b></div>
    <div class="lead">Cymetica's agent farms from one wallet with your USDC: deposits, hedged trades, quotes, bridges, points, claims.</div>
    <div class="btns"><button class="ghost" data-act="close">Cancel</button><button class="go" data-act="confirm">${BOLT}${S.farming ? "UPDATE FARMS" : "START FARMING"}</button></div>
    ${SHOT ? "" : `<div class="fine">Test data: no USDC moves, nothing leaves this page.</div>`}
  </div></div>`;
}
function feed(txt, c = "cyan", d) {
  const F = S.farming;
  F.feed.unshift({d: d == null ? F.day : d, txt, c});
  F.feed.sort((p, q) => q.d - p.d);
  F.feed.length = Math.min(F.feed.length, 40);
}
function startFarms() {
  if (!S.farming) S.farming = {day: 0, farms: {}, hist: [{d: 0, lo: 0, hi: 0}], feed: [], claimed: 0, cost: 0, claims: []};
  const F = S.farming;
  planLines().forEach(({f, a}) => {
    const l = F.farms[f.id];
    if (!l) {
      F.farms[f.id] = {amount: a, start: F.day, pts: 0, lo: 0, hi: 0, cost: 0, n: 0, claim: 0, week: 0, got: 0, cap: f.live.cap0 || 0, tge: f.live.tge ? F.day + f.live.tge : null, done: false};
      S.balance -= a;
      feed(FIRST[f.how](usd(a), f.name), "cyan");
    } else if (l.amount !== a) {
      S.balance -= a - l.amount;
      feed(`<b>${f.name}</b>: ${a > l.amount ? "added" : "withdrew"} ${usd(Math.abs(a - l.amount))}`, "cyan");
      l.amount = a;
    }
  });
  for (const id of Object.keys(F.farms)) if (!S.on[id]) stopFarm(id, true);
  if (S.farming && !Object.keys(S.farming.farms).length) S.farming = null;
}
function confirmStart() { startFarms(); $("#modal").innerHTML = ""; save(); go("live"); }
const tokAmt = (f, n) => f.live.tge ? fmt(n) : f.live.weekly ? n.toFixed(1) : n.toFixed(2);
const pendUsd = (f, l) => (l.claim + (l.week || 0)) * (f.live.px || 0);
const claimable = (f, l) => f.live.daily ? l.claim >= 1 : l.claim > 0;
function claimFarm(id) {
  const F = S.farming, l = F && F.farms[id], f = BY[id];
  if (!l || !claimable(f, l)) return 0;
  const v = l.claim * f.live.px;
  l.got += v; F.claimed += v; F.claims.push(F.day);
  feed(`Claimed <em>${tokAmt(f, l.claim)} ${f.live.tk}</em> (${money(v)}) from <b>${f.name}</b>`, "green");
  if (f.live.tge) l.done = true;
  l.claim = 0;
  return v;
}
function stopFarm(id, quiet) {
  const F = S.farming, l = F && F.farms[id];
  if (!l) return;
  if (l.claim > 0) claimFarm(id);
  const back = Math.max(0, l.amount - l.cost);
  S.balance += back;
  delete F.farms[id];
  S.on[id] = false; S.amt[id] = 0; S.custom = true;
  feed(`<b>${BY[id].name}</b> stopped: ${usd(back)} back to your balance`, "red");
  if (!Object.keys(F.farms).length) { S.farming = null; if (!quiet) toast("All farms stopped"); }
  else if (!quiet) toast(`${BY[id].name} stopped · ${usd(back)} back`);
}

/* ---------- the clock ---------- */
function advance(dd) {
  const F = S.farming;
  const d0 = F.day; F.day += dd;
  for (const [id, l] of Object.entries(F.farms)) {
    const f = BY[id], L = f.live;
    if (l.done) continue;
    const dc = cost(f, l.amount) / 180 * dd; l.cost += dc; F.cost += dc;
    let earning = !L.wait;
    if (L.cap0 != null) {
      const before = l.cap; l.cap = Math.min(1, l.cap + L.capDay * dd);
      if (before < .8 && l.cap >= .8) feed(`<b>${f.name}</b> ${Math.round(l.cap * 100)}% of its points cap used`, "red");
      if (before < 1 && l.cap >= 1) feed(`<b>${f.name}</b> points cap reached: stop it to free ${usd(l.amount)}`, "red");
      if (l.cap >= 1) earning = false;
    }
    if (earning && (L.pts || L.daily)) {
      if (L.pts) l.pts += (f.ppw || 0) / 7 * g(f, l.amount) / g(f, f.ref) * dd;
      const e = est(f, l.amount); l.lo += e.lo / 180 * dd; l.hi += e.hi / 180 * dd;
    }
    if (L.daily) l.claim += L.daily * l.amount * dd;
    if (L.weekly) l.week += L.weekly * l.amount / 7 * dd;
    if (L.txs || L.tasks) l.n += (L.txs || L.tasks) * dd;
  }
  for (let d = Math.floor(d0) + 1; d <= Math.floor(F.day); d++) {
    let gained = 0, k = 0;
    const log = (txt, c) => feed(txt, c, d - .46 + rnd() * .45); // late in the day just ended
    for (const [id, l] of Object.entries(F.farms)) {
      const f = BY[id], L = f.live;
      if (L.pts && !l.done && (L.cap0 == null || l.cap < 1)) { gained += (f.ppw || 0) / 7 * g(f, l.amount) / g(f, f.ref); k++; }
      if (L.weekly && (d - Math.ceil(l.start)) % 7 === 0) { l.claim += l.week; log(`<b>${f.name}</b> paid <em>${l.week.toFixed(1)} ${L.tk}</em>, ready to claim`, "green"); l.week = 0; }
      if (L.epoch && (d - Math.ceil(l.start)) % L.epoch === 0) log(`<b>${f.name}</b> epoch closed: ${Math.round(l.n)} tasks counted`, "blue");
      if (l.tge != null && !l.done && !l.claim && d >= l.tge) {
        const seed = (id.length * 97 + d * 13) % 100 / 100, v = l.lo + (l.hi - l.lo) * (.25 + .5 * seed);
        l.claim = v / L.px; l.lo = l.hi = 0;
        log(`<b>${L.tk}</b> launched: <em>${fmt(l.claim)} ${L.tk}</em> (${money(v)}) ready to claim`, "green");
      }
      if (f.how === "Trade" && L.pts && d % 3 === 0 && rnd() < .5) log(`<b>${f.name}</b> hedge rebalanced`, "cyan");
      if (L.daily && d % 2 === 0) log(`<b>${f.name}</b> quotes refreshed on ${4 + d % 5} markets`, "cyan");
    }
    if (k) log(`Points synced <em>+${fmt(gained)}</em> on ${k} farm${k > 1 ? "s" : ""}`, "green");
    F.hist.push({d, ...totals()});
  }
}
function totals() {
  const F = S.farming; let lo = 0, hi = 0;
  for (const [id, l] of Object.entries(F.farms)) { const p = pendUsd(BY[id], l); lo += l.lo + p; hi += l.hi + p; }
  return {lo: lo + F.claimed, hi: hi + F.claimed};
}

/* ---------- Live farms tab ---------- */
// how long ago, on the farm's own clock
function ago(d) {
  const m = Math.max(1, Math.round((S.farming.day - d) * 1440));
  return m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
}
function liveRow(id, l) {
  const f = BY[id], L = f.live, F = S.farming;
  let st = ["lv", "FARMING"], pts = "—", today = "";
  if (l.done) st = ["m", "CLAIMED"];
  else if (claimable(f, l)) st = ["s", "CLAIMABLE"];
  else if (L.cap0 != null && l.cap >= 1) st = ["m", "CAP REACHED"];
  else if (L.cap0 != null && l.cap >= .8) st = ["c", `CAP ${Math.round(l.cap * 100)}% USED`];
  else if (L.tge && l.tge - F.day <= 10) st = ["c", `TGE IN ${Math.max(1, Math.ceil(l.tge - F.day))} D`];
  else if (L.epoch) st = ["c", `EPOCH ENDS IN ${L.epoch - (Math.floor(F.day - l.start) % L.epoch)} D`];
  else if (L.txs && !f.free) st = ["m", "NO POINTS YET"];
  else if (L.wait) st = ["m", "WAITING"];
  const rate = f.ppw ? f.ppw / 7 * g(f, l.amount) / g(f, f.ref) : 0;
  const earning = !l.done && !(L.cap0 != null && l.cap >= 1);
  if (L.pts) { pts = `${fmt(l.pts)} pts`; today = earning ? `+${fmt(rate)}` : ""; }
  else if (L.daily) { pts = `${l.claim.toFixed(2)} ${L.tk}`; today = `+${(L.daily * l.amount).toFixed(2)}`; }
  else if (L.weekly) pts = `${l.week.toFixed(1)} ${L.tk} this week`;
  else if (L.txs) { pts = `${Math.floor(l.n)} txs`; today = `+${L.txs}`; }
  else if (L.tasks) { pts = `${Math.floor(l.n)} tasks`; today = `+${L.tasks}`; }
  const p = pendUsd(f, l), lo = l.lo + l.got + p, hi = l.hi + l.got + p;
  const earn = f.lo == null && !l.got && !p ? `<span class="earn no">no estimate</span>`

  const claim = claimable(f, l) ? `<button class="claim" data-claim="${id}">Claim ${tokAmt(f, l.claim)} ${L.tk}</button>` : "";
  return `<div class="lrow lcols">
    <div class="farm"><span class="lg ${f.c}">${f.ini}</span><b>${f.name}</b><span class="chip ${st[0]}">${st[1]}</span></div>
    <div><b>${l.amount ? usd(l.amount) : "free"}</b></div>
    <div class="pts"><b>${pts}</b>${today ? `<em>${today}</em>` : ""}</div>
    <div>${earn}</div>
    <div class="acts">${claim}<button class="stop" data-stop="${id}">Stop</button></div>
  </div>`;
}
function liveChart(F) {
  const W = 1196, Hh = 150, L = 4, R = 4, T = 12, B = 22;

  const line = hist.map(p => `${x(p.d)},${y((p.lo + p.hi) / 2)}`).join(" ");

    ${F.claims.map(d => `<line x1="${x(d)}" x2="${x(d)}" y1="${Hh - B}" y2="${Hh - B - 9}" stroke="#00ff88" stroke-width="2"/>`).join("")}

}
function liveView() {

  <div class="ltiles">

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-tog],[data-use],[data-open],[data-act],[data-speed]");
  if (!t || SHOT) return;
  const d = t.dataset;
  if (d.tab) return e.preventDefault(); // switched on pointerdown, below
  if (d.tog) {
    const f = BY[d.tog];
    S.custom = true;
    if (S.on[f.id]) { S.on[f.id] = false; if (!f.free) { S.last[f.id] = amtOf(f.id) || S.last[f.id]; S.amt[f.id] = 0; } updateRow(f.id); updatePlan(); save(); }
    else if (f.free) { S.on[f.id] = true; updateRow(f.id); updatePlan(); save(); }
    else {
      const room = S.budget - allocated();
      if (room < 1) return toast(`All your USDC is in farms: raise the amount or lower another farm`);
      setAmt(f.id, Math.min(rec(f) || S.last[f.id] || 300, room), true);
    }
    return;
  }
  if (d.use) return setAmt(d.use, rec(BY[d.use]));
  if (d.open) { S.open = S.open === d.open ? null : d.open; renderList(); save(); return; }
  if (d.speed != null) { S.speed = +d.speed; ribbon(); save(); return; }
  switch (d.act) {
    case "max": { const B = Math.floor(S.balance + liveSum()); $("#budget").value = fmt(B); setBudget(B, true); break; }
    case "best": applyBest(); renderList(); updatePlan(); save(); toast("Best split for " + usd(S.budget)); break;
    case "start": openStart(); break;
    case "close": if (e.target === t) $("#modal").innerHTML = ""; break;
    case "confirm": confirmStart(); break;
    case "stopall-ok": $("#modal").innerHTML = ""; Object.keys(S.farming.farms).forEach(id => stopFarm(id, true)); save(); toast("All farms stopped"); render(); break;
    case "reset": try { localStorage.removeItem(KEY); } catch (err) {} S = DEFAULT(); REC = recommend(S.budget); applyBest(); go("farms"); toast("Test reset"); break;
  }
});
// the live tab redraws twice a second, so the tabs and its buttons act on pointerdown
document.addEventListener("pointerdown", e => {
  if (SHOT || e.button) return;
  const svg = e.target.closest("svg[data-chart]");
  if (svg) { // click the simulator's chart to set the amount
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (+svg.dataset.vw / r.width);
    return setAmt(svg.dataset.chart, Math.max(0, Math.round((px - +svg.dataset.l) / +svg.dataset.w * S.budget / sstep()) * sstep()));
  }
  const t = e.target.closest("[data-tab],[data-claim],[data-stop],[data-act=claimall],[data-act=stopall]");
  if (!t) return;
  const d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.act === "stopall") return openStopAll();
  if (d.claim) { const v = claimFarm(d.claim); if (v) floatUp(e.clientX, e.clientY, "+" + money(v)); }
  else if (d.stop) stopFarm(d.stop);
  else if (d.act === "claimall") { const v = Object.keys(S.farming.farms).reduce((s, id) => s + claimFarm(id), 0); if (v) floatUp(e.clientX, e.clientY, "+" + money(v)); }
  save(); render();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.rng) { setAmt(t.dataset.rng, +t.value); if (+t.value !== amtOf(t.dataset.rng)) t.value = amtOf(t.dataset.rng); return; }
  if (t.dataset.amt) { setAmt(t.dataset.amt, +t.value.replace(/[^\d.]/g, "")); return; }
  if (t.id === "budget") { setBudget(+t.value.replace(/[^\d.]/g, ""), false); return; }
  if (t.id === "q") { S.q = t.value; renderList(); save(); }
});
document.addEventListener("focusout", e => {
  const t = e.target;
  if (t.dataset && t.dataset.amt) t.value = fmt(amtOf(t.dataset.amt));
  if (t.id === "budget") { t.value = fmt(S.budget); setBudget(S.budget, true); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("#modal").innerHTML = "";
  if (e.key === "Enter" && (e.target.id === "budget" || (e.target.dataset && e.target.dataset.amt))) e.target.blur();
});

// the test page fits a narrow window by scaling the whole page, so nothing scrolls sideways
const fit = () => { if (!SHOT) document.body.style.zoom = Math.min(1, innerWidth / 1300); };
addEventListener("resize", fit); fit();

let tick = 0;
setInterval(() => {
  if (SHOT || !S.farming || !S.speed) return;
  advance(.25 / S.speed);
  if (++tick % 2 === 0) {
    save();
    if (TAB === "live" && !$("#modal").innerHTML) $("#root").innerHTML = liveView();
    else if (TAB === "farms" && $("#hstatus")) $("#hstatus").innerHTML = `<span class="dot"></span><b>FARMING</b> · ${Object.keys(S.farming.farms).length} farms · ${usd(liveSum())} in`;
  }
}, 250);

// the pictures: the same plan before Start (Farms) and 23 days into it (Live farms), the weekly pays claimed on days 7 and 14
if (SHOT) {
  S.open = "arcus";
  if (TAB === "live") {
    startFarms();
    const runTo = d => { while (S.farming.day < d - 1e-9) advance(Math.min(.25, d - S.farming.day)); };
    runTo(7.4); claimFarm("lighter");
    runTo(14.4); claimFarm("lighter"); claimFarm("polymarket");
    runTo(23 + .6 / 24);
  }
}
render();
if (SHOT && Q.has("modal")) openStart();
</script>
</body>
