<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airdrop Farmer</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: the farm seen from above (light pillars, one per farm) beside the one amount; under it one ranked list. */
:root{
  --bg:#0a0e17; --deep:#06090f; --panel:#0d1520; --line:#1e3050;
  --text:#e6edf7; --muted:#a9b8cc; --dim:#7f93ad;
  --cyan:#00cfff; --green:#00ff88; --red:#ff4444; --blue:#3b82f6;
  --plots:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='28'><path d='M0 14 L28 0 L56 14 L28 28 Z' fill='none' stroke='%2300ff88' stroke-width='.8'/></svg>");
  --gutl:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 "JetBrains Mono",monospace;-webkit-font-smoothing:antialiased;position:relative;min-height:100vh}
/* the plot lattice of the farm, faint, behind the top of the page */
body::before{content:"";position:absolute;inset:0 0 auto 0;height:760px;z-index:-1;pointer-events:none;opacity:.07;background-image:var(--plots);
  -webkit-mask-image:radial-gradient(ellipse 70% 100% at 70% 0,rgba(6,9,15,1),rgba(6,9,15,0) 75%);mask-image:radial-gradient(ellipse 70% 100% at 70% 0,rgba(6,9,15,1),rgba(6,9,15,0) 75%)}
body::after{content:"";position:absolute;inset:0 0 auto 0;height:820px;z-index:-2;pointer-events:none;
  background:radial-gradient(ellipse 620px 360px at 74% 330px,rgba(0,255,136,.09),transparent 70%),radial-gradient(ellipse 520px 300px at 20% 240px,rgba(0,207,255,.05),transparent 70%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.wrap{width:100%;max-width:1272px;margin:0 auto;padding-left:var(--gutl);padding-right:var(--gutr);padding-bottom:70px}
.back{max-width:1440px;margin:0 auto;padding-top:16px;padding-left:var(--gutl);padding-right:var(--gutr);color:var(--cyan);font-size:13px}

.app{display:flex;align-items:center;gap:26px;padding:18px 0 16px;border-bottom:1px solid rgba(30,48,80,.7)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:46px;height:46px;flex:none}
.brand .w{display:flex;flex-direction:column;line-height:1.05}
.brand .w span{color:var(--cyan);font-size:9.5px;letter-spacing:.32em;font-weight:600}
.brand .w b{color:var(--text);font-size:16px;font-weight:800;letter-spacing:.02em;margin-top:3px}
nav{display:flex;gap:4px;background:rgba(13,21,32,.8);border:1px solid rgba(30,48,80,.9);border-radius:12px;padding:4px}
nav a{text-decoration:none;padding:8px 16px;border-radius:9px;color:var(--dim);font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
nav a.on{color:var(--deep);background:var(--green)}
nav a i{font-style:normal;font-size:11px;color:var(--deep);background:var(--cyan);border-radius:9px;padding:1px 7px;font-weight:800}
nav a.on i{background:var(--deep);color:var(--green)}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.status b{color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(0,255,136,.18),0 0 10px rgba(0,255,136,.7);display:inline-block;flex:none}
.dot.idle{background:var(--dim);box-shadow:none}

.glass{background:linear-gradient(180deg,rgba(13,21,32,.94),rgba(6,9,15,.96));border:1px solid rgba(30,48,80,.95);border-radius:20px;
  box-shadow:0 24px 60px rgba(6,9,15,.6),inset 0 1px 0 rgba(0,207,255,.06)}
.glow{border-color:rgba(0,255,136,.45);box-shadow:0 0 40px rgba(0,255,136,.12),0 24px 60px rgba(6,9,15,.6),inset 0 1px 0 rgba(0,255,136,.12)}
.cap{color:var(--cyan);font-size:10.5px;font-weight:700;letter-spacing:.22em}
.chip{font-size:10px;font-weight:800;letter-spacing:.09em;border-radius:6px;padding:3px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.g{color:var(--green);background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.38)}
.chip.c{color:var(--cyan);background:rgba(0,207,255,.08);border:1px solid rgba(0,207,255,.32)}
.chip.f{color:var(--deep);background:var(--green)}
.chip.m{color:var(--muted);border:1px solid var(--line)}
.chip.s{color:var(--deep);background:var(--green);box-shadow:0 0 14px rgba(0,255,136,.45)}
.chip.lv{color:var(--green);background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.38)}
.chip.lv::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.go{background:var(--green);border:0;color:var(--deep);border-radius:14px;font:800 15px Inter,sans-serif;letter-spacing:.05em;
  box-shadow:0 0 28px rgba(0,255,136,.42),inset 0 -2px 0 rgba(6,9,15,.2);display:flex;align-items:center;justify-content:center;gap:10px;transition:box-shadow .2s,transform .1s}
.go:hover{box-shadow:0 0 42px rgba(0,255,136,.66),inset 0 -2px 0 rgba(6,9,15,.2)}
.go:active{transform:translateY(1px)}
.go[disabled]{background:var(--line);color:var(--dim);box-shadow:none;cursor:default}
.go svg{width:18px;height:18px;flex:none}
.ghost{background:transparent;border:1px solid rgba(0,207,255,.5);color:var(--cyan);padding:14px;border-radius:14px;font:700 14px Inter,sans-serif}
.fine{margin-top:10px;color:var(--dim);font-size:11px;text-align:center}
.fine button{color:var(--dim);font-size:11.5px}
.fine button:hover{color:var(--red)}

/* hero: the amount on the left, the farm on the right */
.hero{display:grid;grid-template-columns:560px 1fr;gap:28px;padding:34px 0 40px;align-items:center}
.hero>*,.lhero>*{min-width:0}
.pill{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border-radius:20px;border:1px solid rgba(0,255,136,.35);
  background:rgba(0,255,136,.07);color:var(--green);font-size:11.5px;font-weight:700;letter-spacing:.14em}
h1{font:41px/1.08 "Archivo Black",sans-serif;margin:20px 0 14px;letter-spacing:-.015em}
h1 em{font-style:normal;color:var(--green)}
.sub{color:var(--muted);font-size:14px}
.sub b{color:var(--green)}
.plan{margin-top:24px;padding:20px 20px 18px}
.plan .top{display:flex;justify-content:space-between;align-items:center}
.bestok{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.08em}
.bestbtn{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.08em}
.bestbtn:hover{text-decoration:underline}
.bigin{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--deep);border:1px solid rgba(0,207,255,.42);border-radius:14px;
  padding:8px 10px 8px 18px;box-shadow:0 0 0 4px rgba(0,207,255,.06),inset 0 2px 10px rgba(6,9,15,.8)}
.bigin input{font:38px/1.15 "Archivo Black",sans-serif;color:var(--text);background:transparent;border:0;outline:0;flex:1;width:0;min-width:0;caret-color:var(--cyan)}
.token{display:inline-flex;align-items:center;gap:7px;background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.4);border-radius:99px;padding:6px 11px 6px 6px;font-weight:800;font-size:13px}
.token i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--text);display:grid;place-items:center;font-size:12px;font-weight:800}
.max{border:1px solid rgba(0,207,255,.5);color:var(--cyan);border-radius:10px;padding:9px 12px;font-weight:800;font-size:12px;letter-spacing:.06em}
.max:hover{background:rgba(0,207,255,.1)}
.bal{margin-top:8px;color:var(--dim);font-size:11.5px}
.bal b{color:var(--muted);font-weight:600}
.you{margin:18px 0 14px}
.you small{display:block;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.2em}
.you b{display:block;font:44px/1.12 "Archivo Black",sans-serif;color:var(--green);text-shadow:0 0 30px rgba(0,255,136,.42);white-space:nowrap;margin:4px 0 2px}
.you span{color:var(--muted);font-size:12px}
.plan .go{width:100%;padding:17px;font-size:17px}
.fieldwrap{position:relative;text-align:center}
.field{display:block;width:100%;height:auto;max-height:540px}
.field .ready .halo{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.fcap{margin-top:4px;color:var(--dim);font-size:11.5px}

/* the ranked list */
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:6px 0 14px}
h2{font:28px/1.2 "Archivo Black",sans-serif}
.sechead p{color:var(--dim);font-size:12.5px;margin-top:4px}
.search{border:1px solid rgba(30,48,80,.9);background:rgba(13,21,32,.9);border-radius:12px;padding:11px 16px;color:var(--muted);font-size:13px;width:260px;outline:0}
.search::placeholder{color:var(--dim)}
.search:focus{border-color:rgba(0,207,255,.6)}
.list{overflow:hidden}
.cols{display:grid;grid-template-columns:62px minmax(220px,1fr) 360px 150px 240px 64px;align-items:center}
.rowh{padding:12px 22px;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.18em;border-bottom:1px solid rgba(30,48,80,.8)}
.row{padding:16px 22px;border-bottom:1px solid rgba(30,48,80,.55);transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(0,207,255,.03)}
.rank{font:22px "Archivo Black",sans-serif;color:var(--line)}
.row.on .rank{color:var(--muted)}
.row.on .rank.top{color:var(--green);text-shadow:0 0 16px rgba(0,255,136,.4)}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.who>div{min-width:0}
.who b{display:block;font:18px/1.2 "Archivo Black",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .chip{margin-top:5px}
.logo{width:46px;height:46px;border-radius:14px;flex:none;position:relative;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--text);overflow:hidden;
  box-shadow:0 0 0 1px rgba(30,48,80,.95)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.row.on .logo{box-shadow:0 0 0 2px rgba(0,255,136,.55),0 0 18px rgba(0,255,136,.25)}
.o1{background:linear-gradient(135deg,var(--cyan),var(--blue))}
.o2{background:linear-gradient(135deg,var(--green),var(--cyan))}
.o3{background:linear-gradient(135deg,var(--blue),var(--cyan))}
.o4{background:linear-gradient(135deg,var(--dim),var(--line))}
.logo.o1,.logo.o2{color:var(--deep)}
.row.off .who,.row.off .plant,.row.off .amt{opacity:.5}
.plant{padding-right:30px}
.trk{position:relative;height:30px}
.trk .bar,.trk .fil{position:absolute;left:0;top:11px;height:8px;border-radius:5px}
.trk .bar{right:0;background:rgba(30,48,80,.9);box-shadow:inset 0 1px 2px rgba(6,9,15,.9)}
.trk .fil{background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 14px rgba(0,255,136,.45)}
.row.off .trk .fil{box-shadow:none}
.trk .notch{position:absolute;top:-6px;width:2px;height:28px;background:var(--cyan);transform:translateX(-1px);border-radius:1px;opacity:.9}
.trk .notch em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.14em;color:var(--cyan);margin-bottom:1px}
.trk input{position:absolute;inset:0;width:100%;height:30px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;outline:0;cursor:pointer}
.trk input::-webkit-slider-runnable-track{height:30px;background:transparent}
.trk input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:4px;border-radius:50%;background:var(--text);box-shadow:0 0 0 4px var(--green),0 0 18px rgba(0,255,136,.7);cursor:grab}
.trk input::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--text);box-shadow:0 0 0 4px var(--green)}
.row.off .trk input::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--dim)}
.freepill{display:inline-block;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.1em;border:1px dashed rgba(0,255,136,.5);border-radius:10px;padding:8px 14px}
.amt{display:flex;align-items:center;gap:6px;background:var(--deep);border:1px solid rgba(30,48,80,.95);border-radius:12px;padding:9px 12px;width:134px}
.amt:focus-within{border-color:rgba(0,207,255,.7)}
.amt input{flex:1;width:0;min-width:0;background:transparent;border:0;outline:0;font:16px "Archivo Black",sans-serif;text-align:right;color:var(--text)}
.amt span{color:var(--dim);font-size:10px;font-weight:700}
.usebest{display:block;margin-top:5px;color:var(--cyan);font-size:11px;font-weight:700}
.usebest:hover{text-decoration:underline}
.est b{display:block;font:25px/1.15 "Archivo Black",sans-serif;color:var(--green);white-space:nowrap}
.row.on .est b{text-shadow:0 0 22px rgba(0,255,136,.35)}
.est b.dim{font:600 15px "JetBrains Mono",monospace;color:var(--dim)}
.est b.no{font:500 14px "JetBrains Mono",monospace;color:var(--dim)}
.est small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px}
.tg{width:46px;height:26px;border-radius:14px;background:var(--line);position:relative;display:block;margin-left:auto;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:left .15s}
.tg.on{background:rgba(0,255,136,.25);box-shadow:inset 0 0 0 1px rgba(0,255,136,.6)}
.tg.on::after{left:23px;background:var(--green);box-shadow:0 0 10px rgba(0,255,136,.8)}
.more{display:flex;justify-content:center;margin-top:18px;color:var(--dim);font-size:12.5px;gap:16px;align-items:center}
.more span.btn{color:var(--cyan);border:1px solid rgba(0,207,255,.45);border-radius:12px;padding:10px 20px;font-weight:700}

/* live farms */
.lhero{display:grid;grid-template-columns:500px 1fr;gap:36px;margin-top:28px;align-items:center}
.earnp{padding:24px 24px 18px}
.earnp .big{font:58px/1.05 "Archivo Black",sans-serif;color:var(--green);text-shadow:0 0 36px rgba(0,255,136,.45);margin-top:8px;white-space:nowrap}
.earnp .today{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.earnp .today em{font-style:normal;font-weight:800;color:var(--deep);background:var(--green);border-radius:99px;padding:3px 10px;box-shadow:0 0 16px rgba(0,255,136,.4)}
.earnp .go{width:100%;margin-top:22px;padding:18px;font-size:17px}
.chartp{margin-top:18px;padding:18px 22px 12px}
.chartp svg{display:block;width:100%;height:auto;margin-top:6px}
.ticker{display:flex;gap:20px;align-items:center;border-top:1px solid rgba(30,48,80,.8);margin-top:10px;padding-top:12px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,rgba(6,9,15,1) 88%,rgba(6,9,15,0));mask-image:linear-gradient(90deg,rgba(6,9,15,1) 88%,rgba(6,9,15,0))}
.ticker .ev{display:inline-flex;gap:7px;align-items:center;flex:none}
.ticker .ev i{width:7px;height:7px;border-radius:50%;flex:none}
.ticker .ev time{color:var(--dim)}
.ticker .ev b{color:var(--text);font-weight:600}
.ticker .ev em{font-style:normal;color:var(--green)}
.lcols{display:grid;grid-template-columns:minmax(240px,1fr) 120px 340px 230px 230px;align-items:center}
.lrow{padding:16px 22px;border-bottom:1px solid rgba(30,48,80,.55)}
.lrow:last-child{border-bottom:0}
.lrow.ready{background:linear-gradient(90deg,rgba(0,255,136,.07),transparent 60%)}
.cell small{display:block;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.16em}
.cell b{font:16px "Archivo Black",sans-serif}
.growth{padding-right:30px}
.gbar{height:8px;border-radius:5px;background:rgba(30,48,80,.9);overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 12px rgba(0,255,136,.5)}
.growth small{display:block;margin-top:7px;color:var(--dim);font-size:11px}
.growth small em{font-style:normal;color:var(--green);font-weight:700}
.acts{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.acts .harv{background:var(--green);color:var(--deep);font:800 13px Inter,sans-serif;border-radius:11px;padding:10px 15px;box-shadow:0 0 18px rgba(0,255,136,.45);white-space:nowrap}
.acts .stop{color:var(--dim);font:600 12px Inter,sans-serif;padding:8px 10px;border-radius:9px}
.acts .stop:hover{color:var(--red);background:rgba(255,68,68,.08)}
.emptylive{padding:54px 20px;text-align:center;color:var(--muted);font-size:14px;margin-top:28px}
.emptylive b{display:block;font:26px "Archivo Black",sans-serif;color:var(--text);margin-bottom:8px}
.emptylive .go{margin:20px auto 0;padding:14px 26px;display:inline-flex}
.float{position:fixed;z-index:70;font:24px "Archivo Black",sans-serif;color:var(--green);pointer-events:none;text-shadow:0 0 18px rgba(0,255,136,.75);animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translateY(-80px);opacity:0}}

/* confirmation, toast, test ribbon */
.ov{position:fixed;inset:0;background:rgba(6,9,15,.82);display:grid;place-items:center;z-index:50;backdrop-filter:blur(3px)}
.modal{width:520px;max-height:88vh;overflow:auto;padding:26px 28px}
.modal h3{font:26px "Archivo Black",sans-serif;margin:8px 0 0}
.modal .mnum{margin:16px 0 4px;font:40px/1.1 "Archivo Black",sans-serif;color:var(--green);text-shadow:0 0 30px rgba(0,255,136,.4)}
.modal .mnuml{color:var(--muted);font-size:12px}
.modal details{margin-top:16px;border-top:1px solid rgba(30,48,80,.9)}
.modal summary{cursor:pointer;color:var(--cyan);font-size:12.5px;padding:11px 0;list-style:none}
.modal summary::-webkit-details-marker{display:none}
.modal .ln{display:grid;grid-template-columns:1fr 90px 150px;gap:8px;padding:7px 0;border-bottom:1px solid rgba(30,48,80,.6);font-size:12.5px}
.modal .ln span:nth-child(2){text-align:right;font-weight:700}
.modal .ln span:nth-child(3){text-align:right;color:var(--green)}
.modal .ln small{color:var(--dim)}
.modal .kv{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid rgba(30,48,80,.9);font-size:12.5px;color:var(--muted)}
.modal .kv b{color:var(--text)}
.modal .lead{color:var(--dim);font-size:12px;margin-top:12px;line-height:1.55}
.modal .btns{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:18px}
.modal .btns .go{padding:15px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid rgba(0,207,255,.5);color:var(--text);
  padding:11px 18px;border-radius:12px;font-size:13px;z-index:60;box-shadow:0 10px 34px rgba(6,9,15,.85);max-width:calc(100vw - 32px)}
.ribbon{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(6px + env(safe-area-inset-top,0px));z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;align-items:center}
.ribbon b{color:var(--cyan);letter-spacing:.12em;font-size:10.5px}
.ribbon button{border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--muted);font-size:11px}
.ribbon button.on{border-color:rgba(0,255,136,.55);color:var(--green)}

.sheet{display:flex;gap:40px;align-items:center;justify-content:center;padding:60px 40px}
.sheet .bigl svg{width:300px;height:300px}
.sheet .wm{display:flex;align-items:center;gap:18px}
.sheet .wm svg{width:92px;height:92px}
.sheet .wm span{color:var(--cyan);font-size:19px;letter-spacing:.32em;font-weight:600;display:block}
.sheet .wm b{font-size:34px;font-weight:800;letter-spacing:.02em;display:block;margin-top:4px}
.sizes{display:flex;gap:22px;align-items:flex-end;margin-top:34px}
.sizes div{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--dim);font-size:11px}

@media (max-width:1100px){
