<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airdrop Farmer</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e17; --deep:#06090f; --panel:#0d1520; --line:#1e3050;
  --text:#e6edf7; --muted:#a9b8cc; --dim:#7f93ad;
  --cyan:#00cfff; --green:#00ff88; --red:#ff4444; --blue:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 "JetBrains Mono",monospace;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 900px 420px at 18% 120px,rgba(0,255,136,.07),transparent 70%),
    radial-gradient(ellipse 700px 380px at 85% 80px,rgba(0,207,255,.06),transparent 70%),
    radial-gradient(rgba(0,207,255,.07) 1px,transparent 1.2px);
  background-size:auto,auto,22px 22px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.wrap{width:1240px;margin:0 auto;padding-bottom:56px}
.back{max-width:1440px;margin:0 auto;padding:16px 18px 0;color:var(--cyan);font-size:13px}

/* app header, as Agent Tournaments */
.app{display:flex;align-items:center;gap:26px;padding:18px 0 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:46px;height:46px;flex:none}
.brand .w{display:flex;flex-direction:column;line-height:1.05}
.brand .w span{color:var(--cyan);font-size:9.5px;letter-spacing:.32em;font-weight:600}
.brand .w b{color:var(--text);font-size:16px;font-weight:800;letter-spacing:.02em;margin-top:3px}
nav{display:flex;gap:6px}
nav a{text-decoration:none;padding:9px 14px;border-radius:9px;color:var(--dim);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;border:1px solid transparent}
nav a.on{color:var(--text);background:rgba(0,207,255,.10);border-color:rgba(0,207,255,.28)}
nav a i{font-style:normal;font-size:11px;color:var(--deep);background:var(--green);border-radius:9px;padding:1px 7px;font-weight:800}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.status b{color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(0,255,136,.18),0 0 10px rgba(0,255,136,.7);display:inline-block;flex:none}
.dot.idle{background:var(--dim);box-shadow:none}

/* hero */
.hero{display:grid;grid-template-columns:1fr 470px;gap:48px;padding:40px 0 34px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border-radius:20px;border:1px solid rgba(0,255,136,.35);
  background:rgba(0,255,136,.07);color:var(--green);font-size:11.5px;font-weight:700;letter-spacing:.14em}
h1{font:54px/1.06 "Archivo Black",sans-serif;margin:22px 0 18px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--green)}
.sub{font-size:17px;color:var(--muted)}
.sub b{color:var(--text);font-weight:700}

.card{background:linear-gradient(180deg,rgba(13,21,32,.96),rgba(6,9,15,.96));border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.cap{color:var(--cyan);font-size:10.5px;font-weight:700;letter-spacing:.22em}
.plan label{display:block;color:var(--dim);font-size:11.5px;margin:14px 0 6px}
.bigin{display:flex;align-items:baseline;gap:10px;background:var(--deep);border:1px solid rgba(0,207,255,.45);border-radius:12px;padding:10px 16px;
  box-shadow:0 0 0 3px rgba(0,207,255,.08)}
.bigin input{font:40px/1 "Archivo Black",sans-serif;color:var(--text);background:transparent;border:0;outline:0;flex:1;min-width:0;caret-color:var(--cyan)}
.bigin span{color:var(--muted);font-weight:700;font-size:15px}
.quick{display:flex;justify-content:space-between;align-items:center;margin-top:9px;color:var(--dim);font-size:11.5px}
.quick b{color:var(--muted);font-weight:600}
.quick .q{display:flex;gap:6px}
.quick .q button{border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--muted);font-size:11.5px}
.quick .q button:hover{border-color:rgba(0,207,255,.5);color:var(--cyan)}
.alloc{margin-top:16px}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:5px;transition:width .15s}
.alloc .r{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--muted)}
.alloc .r b{color:var(--text)}
.kpis{display:grid;grid-template-columns:.7fr 1.6fr .8fr;gap:10px;margin-top:16px}
.kpis div{background:rgba(30,48,80,.35);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.kpis small{display:block;color:var(--dim);font-size:10.5px}
.kpis b{font:21px/1.25 "Archivo Black",sans-serif;white-space:nowrap}
.g{color:var(--green)}
.btns{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin-top:16px}
.ghost,.go{font:700 14px Inter,sans-serif;border-radius:11px}
.ghost{background:transparent;border:1px solid rgba(0,207,255,.5);color:var(--cyan);padding:13px}
.ghost:hover{background:rgba(0,207,255,.08)}
.go{background:var(--green);border:0;color:var(--deep);padding:13px;font-size:15.5px;box-shadow:0 0 22px rgba(0,255,136,.35)}
.go:hover{box-shadow:0 0 30px rgba(0,255,136,.55)}
.fine{margin-top:11px;text-align:center;color:var(--dim);font-size:11px}

/* list */
.sechead{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.cap2{color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.2em}
h2{font:28px/1.2 "Archivo Black",sans-serif;margin-top:6px}
.tools{display:flex;gap:10px;align-items:center}
.sel,.search{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;color:var(--muted);font-size:12px}
.sel select{appearance:none;background:transparent;border:0;outline:0;color:var(--muted);font-size:12px;cursor:pointer}
.sel select option{background:var(--panel)}
.search{width:220px;outline:0}
.search::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);border-radius:20px;padding:6px 13px;color:var(--muted);font-size:12px;background:rgba(13,21,32,.8)}
.chips button b{color:var(--text);margin-left:5px}
.chips button.on{border-color:rgba(0,207,255,.55);color:var(--cyan);background:rgba(0,207,255,.08)}
.chips button.free b{color:var(--green)}

.table{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(10,14,23,.9)}
.cols{display:grid;grid-template-columns:60px 228px 96px 206px 240px 122px 112px 150px 26px;align-items:center;column-gap:0}
.thead{padding:11px 0;color:var(--dim);font-size:10.5px;letter-spacing:.12em;font-weight:700;background:var(--panel);border-bottom:1px solid var(--line)}
.thead>div:first-child{padding-left:18px}
.frow{padding:12px 0;border-bottom:1px solid rgba(30,48,80,.7)}
.frow>div:first-child{padding-left:18px}
.frow.off .farm,.frow.off .how,.frow.off .tok,.frow.off .sl,.frow.off .amt,.frow.off .rec{opacity:.55}
.tg{width:36px;height:20px;border-radius:12px;background:var(--line);position:relative;display:block}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:left .12s}
.tg.on{background:rgba(0,255,136,.25);box-shadow:inset 0 0 0 1px rgba(0,255,136,.6)}
.tg.on::after{left:19px;background:var(--green);box-shadow:0 0 8px rgba(0,255,136,.8)}
.farm{display:flex;align-items:center;gap:11px}
.lg{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.c1{background:rgba(0,207,255,.14);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(0,207,255,.45)}
.c2{background:rgba(0,255,136,.12);color:var(--green);box-shadow:inset 0 0 0 1px rgba(0,255,136,.45)}
.c3{background:rgba(59,130,246,.16);color:var(--blue);box-shadow:inset 0 0 0 1px rgba(59,130,246,.5)}
.c4{background:rgba(127,147,173,.14);color:var(--muted);box-shadow:inset 0 0 0 1px rgba(127,147,173,.4)}
.farm b{font-size:14px;display:block}
.farm small,.tok small,.est small{color:var(--dim);font-size:11px;display:block}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;border:1px solid var(--line);color:var(--muted)}
.tag.free{color:var(--green);border-color:rgba(0,255,136,.4)}
.tok b{font-size:12.5px;font-weight:600}
.tok b.y{color:var(--green)}
.tok b.n{color:var(--muted)}
.tok b.w{color:var(--red)}
.sl{padding-right:22px}
.rng{position:relative;height:18px}
.rng .trk,.rng .fil{position:absolute;left:0;top:6px;height:6px;border-radius:4px}
.rng .trk{right:0;background:var(--line)}
.rng .fil{background:linear-gradient(90deg,var(--cyan),var(--green))}
.rng .recm{position:absolute;top:0;width:2px;height:18px;background:var(--cyan);border-radius:1px;transform:translateX(-1px)}
.rng .recm::after{content:"";position:absolute;top:-5px;left:-3px;border:4px solid transparent;border-top-color:var(--cyan)}
.rng input{position:absolute;inset:0;width:100%;height:18px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;outline:0;cursor:pointer}
.rng input::-webkit-slider-runnable-track{height:18px;background:transparent}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:1px;border-radius:50%;background:var(--text);box-shadow:0 0 0 3px var(--green),0 0 12px rgba(0,255,136,.6);cursor:grab}
.rng input::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--text);box-shadow:0 0 0 3px var(--green)}
.frow.off .rng input::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--dim)}
.dis{height:6px;margin:6px 0;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.scale{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;margin-top:7px}
.amt{display:flex;align-items:center;gap:6px;background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:108px}
.amt:focus-within{border-color:rgba(0,207,255,.6)}
.amt input{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:0;font-size:14px;font-weight:700;text-align:right;color:var(--text)}
.amt span{color:var(--dim);font-size:10px}
.amt.free{justify-content:center;border-style:dashed;color:var(--green);font-weight:800;font-size:12px}
.rec{display:flex;align-items:center;gap:7px;padding-left:4px}
.rec b{color:var(--cyan);font-size:13.5px}
.rec .use{font-size:10.5px;border:1px solid rgba(0,207,255,.4);color:var(--cyan);border-radius:6px;padding:1px 6px}
.rec .use:hover{background:rgba(0,207,255,.12)}
.rec .ok{color:var(--green);font-size:12px}
.rec .none{color:var(--dim)}
.est b{font-size:14px;color:var(--green)}
.est b.no{color:var(--dim);font-weight:500;font-size:12.5px}
.chev{color:var(--dim);font-size:14px;text-align:center;width:22px;height:22px;border-radius:6px}
.chev:hover{background:rgba(0,207,255,.1);color:var(--cyan)}
.chev.open{color:var(--cyan)}
.frow.open{background:linear-gradient(180deg,rgba(0,207,255,.06),transparent);border-bottom:0}

/* simulator */
.sim{display:grid;grid-template-columns:1fr 372px;gap:26px;padding:6px 24px 22px 78px;border-bottom:1px solid rgba(30,48,80,.7);
  background:linear-gradient(180deg,transparent,rgba(0,207,255,.03))}
.sim .chart{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:14px 16px 8px}
.sim .chart svg{cursor:crosshair}
.sim .ct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sim .ct b{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.sim .ct span{font-size:11px;color:var(--dim)}
.sim svg text{font-family:"JetBrains Mono",monospace}
.out{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.out .h{color:var(--muted);font-size:12px}
.out .h b{color:var(--text)}
.out .big{font:30px/1.15 "Archivo Black",sans-serif;color:var(--green);margin:6px 0 2px}
.out .big.no{color:var(--dim);font-size:22px}
.out .bigl{color:var(--dim);font-size:11px}
.out dl{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin-top:12px;font-size:12px}
.out dt{color:var(--dim)}
.out dd{text-align:right;color:var(--text);font-weight:600}
.hz{display:flex;gap:6px;margin-top:12px}
.hz button{flex:1;text-align:center;border:1px solid var(--line);border-radius:7px;padding:5px 0;font-size:11.5px;color:var(--muted)}
.hz button.on{border-color:rgba(0,255,136,.55);color:var(--green);background:rgba(0,255,136,.07)}
.asof{margin-top:10px;font-size:10.5px;color:var(--dim)}
.noest{display:flex;flex-direction:column;justify-content:center;height:100%;min-height:200px;padding:0 20px;color:var(--muted);font-size:13px;gap:8px}
.noest b{font:20px "Archivo Black",sans-serif;color:var(--dim)}
.more{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:var(--dim);font-size:12px;background:var(--panel)}
.more span.btn{color:var(--cyan);border:1px solid rgba(0,207,255,.4);border-radius:8px;padding:6px 14px}

/* live farms */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:26px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.tile small{display:block;color:var(--dim);font-size:10.5px;letter-spacing:.1em;font-weight:700}
.tile b{display:block;font:25px/1.3 "Archivo Black",sans-serif;margin-top:4px;white-space:nowrap}
.tile span{font-size:11px;color:var(--dim)}
.tile.hi b{font-size:20px;line-height:1.55}
.tile.hi{border-color:rgba(0,255,136,.45);background:linear-gradient(180deg,rgba(0,255,136,.08),var(--panel))}
.mid{display:grid;grid-template-columns:1fr 400px;gap:16px;margin-top:16px}
.feed.wide .it{grid-template-columns:76px 12px 1fr}
.lrow .farm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.feed .it{display:grid;grid-template-columns:44px 18px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid rgba(30,48,80,.6);font-size:12px}
.feed .it:last-child{border-bottom:0}
.feed .t{color:var(--dim)}
.feed .ic{width:8px;height:8px;border-radius:50%;margin-top:5px}
.feed .it b{color:var(--text);font-weight:600}
.feed .it em{font-style:normal;color:var(--green)}
.feed .empty{color:var(--dim);padding:14px 0}
.lcols{display:grid;grid-template-columns:250px 190px 100px 70px 210px 170px 1fr;align-items:center}
.lrow{padding:12px 0;border-bottom:1px solid rgba(30,48,80,.7)}
.lrow>div:first-child,.lhead>div:first-child,.ltot>div:first-child{padding-left:18px}
.lhead{padding:11px 0;color:var(--dim);font-size:10.5px;letter-spacing:.12em;font-weight:700;background:var(--panel);border-bottom:1px solid var(--line)}
.st{font-size:10.5px;font-weight:800;letter-spacing:.08em;border-radius:6px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}
.st.f{color:var(--green);background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.35)}
.st.f::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.st.c{color:var(--deep);background:var(--green)}
.st.s{color:var(--cyan);background:rgba(0,207,255,.08);border:1px solid rgba(0,207,255,.35)}
.st.r{color:var(--red);background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.35)}
.st.m{color:var(--muted);border:1px solid var(--line)}
.lrow small,.ltot small{display:block;color:var(--dim);font-size:11px}
.pts b{font-size:13.5px}
.pts em{font-style:normal;color:var(--green);font-size:11.5px;margin-left:6px}
.acts{display:flex;gap:8px;justify-content:flex-end;padding-right:18px}
.acts button{font:700 12px Inter,sans-serif;border-radius:8px;padding:6px 12px;border:1px solid var(--line);color:var(--muted)}
.acts button.claim{background:var(--green);color:var(--deep);border-color:var(--green);box-shadow:0 0 14px rgba(0,255,136,.35)}
.acts button.stop{color:var(--red);border-color:rgba(255,68,68,.4)}
.acts button.stop:hover{background:rgba(255,68,68,.1)}
.ltot{padding:14px 0;background:var(--panel);font-weight:700}
.ltot b{font-size:14px}
.emptylive{padding:46px 20px;text-align:center;color:var(--muted);font-size:14px}
.emptylive b{display:block;font:24px "Archivo Black",sans-serif;color:var(--text);margin-bottom:8px}
.emptylive button{margin-top:18px;padding:12px 22px}

/* modal, toast, test ribbon (the local test page only) */
.ov{position:fixed;inset:0;background:rgba(6,9,15,.78);display:grid;place-items:center;z-index:50}
.modal{width:560px;max-height:84vh;overflow:auto}
.modal h3{font:24px "Archivo Black",sans-serif;margin:8px 0 4px}
.modal .lead{color:var(--muted);font-size:12.5px}
.modal .lines{margin-top:14px;border-top:1px solid var(--line)}
.modal .ln{display:grid;grid-template-columns:1fr 100px 140px;gap:8px;padding:8px 0;border-bottom:1px solid rgba(30,48,80,.6);font-size:12.5px}
.modal .ln span:nth-child(2){text-align:right;font-weight:700}
.modal .ln span:nth-child(3){text-align:right;color:var(--green)}
.modal .ln.tot{font-weight:800;border-bottom:0}
.modal .ln small{color:var(--dim)}
.modal .btns{margin-top:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--panel);border:1px solid rgba(0,207,255,.5);color:var(--text);
  padding:10px 18px;border-radius:10px;font-size:13px;z-index:60;box-shadow:0 8px 30px rgba(6,9,15,.8)}
.ribbon{position:fixed;right:16px;top:6px;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;align-items:center}
.ribbon b{color:var(--cyan);letter-spacing:.12em;font-size:10.5px}
.ribbon button{border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--muted);font-size:11px}
.ribbon button.on{border-color:rgba(0,255,136,.55);color:var(--green)}

/* logo sheet */
.sheet{display:flex;gap:40px;align-items:center;justify-content:center;padding:60px 40px}
.sheet .bigl svg{width:300px;height:300px}
.sheet .wm{display:flex;align-items:center;gap:18px}
.sheet .wm svg{width:92px;height:92px}
.sheet .wm span{color:var(--cyan);font-size:19px;letter-spacing:.32em;font-weight:600;display:block}
.sheet .wm b{font-size:34px;font-weight:800;letter-spacing:.02em;display:block;margin-top:4px}
.sizes{display:flex;gap:22px;align-items:flex-end;margin-top:34px}
.sizes div{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--dim);font-size:11px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="afg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00cfff"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
    <linearGradient id="afh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff88"/><stop offset="1" stop-color="#00cfff"/></linearGradient>
    <filter id="afglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <symbol id="logo" viewBox="0 0 64 64">
    <circle cx="32" cy="41" r="17" fill="#06090f" stroke="url(#afg)" stroke-width="3"/>
    <circle cx="32" cy="41" r="12" fill="none" stroke="#00cfff" stroke-opacity=".4" stroke-width="1" stroke-dasharray="1.6 2.6"/>
    <rect x="24.5" y="37" width="5" height="9" rx="2.5" fill="#00ff88" filter="url(#afglow)"/>

<script>
/* Airdrop Farmer, the design and a local test version in one page.
   ?shot=1 freezes the state the Build it Better pictures show (render.py); without it every control works on test
   data, kept in this browser only. Nothing here talks to any server. */
const Q = new URLSearchParams(location.search);
const SHOT = Q.has("shot");
let TAB = Q.get("tab") || "farms";
const KEY = "airdrop-farmer-test-v1";
const fmt = n => Math.round(n).toLocaleString("en-US");
const usd = n => "$" + fmt(n);
const r10 = n => Math.round(n / 10) * 10;
const money = n => n < 100 ? "$" + Math.round(n) : usd(r10(n)); // small live amounts to the dollar
const kfmt = v => v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0).replace(/\.0$/, "") + "K" : String(v);
const logo = () => `<svg><use href="#logo"/></svg>`;
const $ = s => document.querySelector(s);

/* ---------- farms (examples from the live points programs; the rest is test data) ---------- */
// ref: the amount lo/hi (est. airdrop over 6 months) are given at; knee: above it each dollar earns 0.32x here.
// cf: fixed cost (gas) per 6 months; cp: cost per $1,000 per 6 months (fees, funding); ppw: points a week at ref.
const FARMS = [
  {id: "arcus", c: "c1", ini: "AR", name: "Arcus", cat: "perp", sub: "Perp DEX · dYdX Labs", how: "Deposit", tok: "Token confirmed", tc: "y", season: "Season 1 · to H1 2027", ref: 1000, knee: 1000, lo: 260, hi: 940, cf: 1, cp: 0, ppw: 1840, pool: .05, fdv: 250e6, ends: 240, live: {pts: 1}},
  {id: "variational", c: "c2", ini: "VA", name: "Variational", cat: "perp", sub: "Perp DEX", how: "Trade", tok: "VAR · 32% airdrop", tc: "y", season: "TGE Q4 2026", ref: 800, knee: 800, lo: 180, hi: 720, cf: 0, cp: 42.5, ppw: 420, pool: .32, fdv: 60e6, ends: 70, live: {pts: 1, tge: 30, tk: "VAR", px: .45}},
  {id: "polymarket", c: "c3", ini: "PM", name: "Polymarket", cat: "pred", sub: "Prediction", how: "LP", tok: "No token yet", tc: "n", season: "$75K / day LP rewards", ref: 600, knee: 700, lo: 40, hi: 310, cf: 0, cp: 10, note: "+ pUSD rewards", ppw: 0, pool: .05, fdv: 5e9, ends: 300, live: {daily: .0004, tk: "pUSD", px: 1}},
  {id: "lighter", c: "c1", ini: "LI", name: "Lighter", cat: "perp", sub: "Perp DEX", how: "Trade", tok: "11M LIT pool", tc: "y", season: "weekly payout", ref: 500, knee: 500, lo: 90, hi: 260, cf: 0, cp: 44, ppw: 0, pool: .011, fdv: 1.6e9, ends: 300, live: {weekly: .007, tk: "LIT", px: 1.92}},
  {id: "risex", c: "c2", ini: "RX", name: "RISEx", cat: "perp", sub: "Perp DEX", how: "Trade", tok: "No token yet", tc: "n", season: "Season 1 · to Q2 2027", ref: 400, knee: 400, lo: 70, hi: 410, cf: 0, cp: 42.5, ppw: 2730, pool: .08, fdv: 150e6, ends: 220, live: {pts: 1}},
  {id: "nado", c: "c3", ini: "NA", name: "Nado", cat: "perp", sub: "Perp DEX · Ink", how: "Trade", tok: "Points → INK", tc: "y", season: "Season 2", ref: 400, knee: 350, lo: 60, hi: 300, cf: 0, cp: 40, ppw: 4270, pool: .04, fdv: 300e6, ends: 90, live: {pts: 1, tge: 45, tk: "INK", px: .12}},
  {id: "n1", c: "c4", ini: "N1", name: "N1", cat: "perp", sub: "Perp DEX", how: "Trade", tok: "No token yet", tc: "n", season: "Season 1", ref: 300, knee: 300, lo: 30, hi: 250, cf: 0, cp: 43, ppw: 2400, pool: .06, fdv: 100e6, ends: 200, live: {pts: 1}},
  {id: "ostium", c: "c1", ini: "OS", name: "Ostium", cat: "perp", sub: "Perp DEX", how: "Trade", tok: "Points live", tc: "n", season: "Season 2 · 25M cap", ref: 300, knee: 300, lo: 40, hi: 190, cf: 0, cp: 40, ppw: 980, pool: .05, fdv: 120e6, ends: 45, live: {pts: 1, cap0: .62, capDay: .0083}},
  {id: "base", c: "c3", ini: "BA", name: "Base", cat: "chain", sub: "L2 · Coinbase", how: "Bridge", tok: "Exploring a token", tc: "n", season: "no points program", lo: null, cf: 3, cp: 0, why: "no points program", ends: 365, live: {txs: 1.5}},
  {id: "pacifica", c: "c2", ini: "PA", name: "Pacifica", cat: "perp", sub: "Perp DEX", how: "Trade", tok: "Points live", tc: "n", season: "Season 1", ref: 250, knee: 250, lo: 20, hi: 140, cf: 0, cp: 40, ppw: 630, pool: .05, fdv: 80e6, ends: 180, live: {pts: 1}},
  {id: "arc", c: "c1", ini: "AC", name: "Arc Testnet", cat: "testnet", sub: "Circle · USDC gas", how: "Testnet", tok: "No token yet", tc: "n", season: "testnet, free", lo: null, free: 1, why: "no points rate", ends: 365, live: {txs: 3}},
  {id: "axis", c: "c2", ini: "AX", name: "Axis Robotics", cat: "tasks", sub: "Tasks", how: "Tasks", tok: "No token yet", tc: "n", season: "2-week epochs", lo: null, free: 1, why: "no points rate", ends: 14, live: {tasks: 1, epoch: 14}},
  {id: "extended", c: "c4", ini: "EX", name: "Extended", cat: "perp", sub: "Perp DEX", how: "Trade", tok: "Cap 99% used", tc: "w", season: "69.2M of 70M points", lo: null, cf: 0, cp: 40, why: "points nearly gone", ends: 1, live: {cap0: .99, capDay: .01}},
  {id: "hyperliquid", c: "c4", ini: "HL", name: "Hyperliquid", cat: "perp", sub: "Perp DEX", how: "Trade", tok: "No Season 2 announced", tc: "n", season: "no points phase", lo: null, cf: 0, cp: 40, why: "nothing to farm now", ends: 365, live: {wait: 1}},
];
// test farms, so the list is long enough to try filters, sort and big budgets
const CAT = {perp: "Perp DEX", pred: "Prediction", lend: "Lending", lp: "LP vaults", chain: "Chains", testnet: "Testnets · free", tasks: "Tasks · free"};
[["lend", "Lending", "Deposit", 0, [["Alpha", 400, .26], ["Beta", 600, .22], ["Gamma", 500, .19], ["Delta", 800, .16]]],
 ["lp", "Vault", "LP", 8, [["Alpha", 500, .24], ["Beta", 700, .2], ["Gamma", 400, .18], ["Delta", 900, .14]]],
 ["chain", "Chain", "Bridge", 4, [["Alpha", 300, .21], ["Beta", 400, .17], ["Gamma", 250, .15]]],
 ["pred", "Predict", "LP", 10, [["Alpha", 300, .2]]],
 ["perp", "Perp", "Trade", 40, [["Alpha", 400, .27], ["Beta", 300, .22]]],
].forEach(([cat, label, how, cp, list], j) => list.forEach(([g, knee, eff], i) => {
  const mid = (eff + cp / 1000) * knee;
  FARMS.push({id: (label + g).toLowerCase(), c: ["c1", "c2", "c3", "c4"][(i + j) % 4], ini: label[0] + g[0], name: label + " " + g,
    cat, sub: (cat === "lp" ? "LP vault" : CAT[cat].replace(/s$/, "")) + " · test farm", how, tok: "No token yet", tc: "n", season: "test data",
    ref: knee, knee, lo: r10(mid * .45), hi: r10(mid * 1.55), cf: cp ? 0 : 1, cp, ppw: knee * 3, pool: .05, fdv: 200e6, ends: 100 + 20 * i, live: {pts: 1}, test: 1});
}));
[["testnet", "Testnet Alpha"], ["testnet", "Testnet Beta"], ["tasks", "Tasks Alpha"]].forEach(([cat, name], i) =>
  FARMS.push({id: name.replace(" ", "").toLowerCase(), c: ["c2", "c3", "c1"][i], ini: name[0] + name.split(" ")[1][0], name, cat,
    sub: (cat === "tasks" ? "Tasks" : "Testnet") + " · test farm", how: cat === "tasks" ? "Tasks" : "Testnet", tok: "No token yet", tc: "n",
    season: "free, test data", lo: null, free: 1, why: "no points rate", ends: 300, live: cat === "tasks" ? {tasks: 1, epoch: 14} : {txs: 2}, test: 1}));
const BY = Object.fromEntries(FARMS.map(f => [f.id, f]));

/* ---------- the maths ---------- */
const g = (f, x) => Math.min(x, f.knee) + .32 * Math.max(0, x - f.knee);
function est(f, x, months) {
  if (f.lo == null || x <= 0) return null;
  const k = g(f, x) / g(f, f.ref) * months / 6;
  return {lo: f.lo * k, hi: f.hi * k};
}
const cost = (f, x, months) => f.free || x <= 0 ? 0 : (f.cf + (f.cp || 0) * x / 1000) * months / 6;
const midPer = (f, x) => { const e = est(f, x, 6); return e ? (e.lo + e.hi) / 2 : 0; };
// recommended amounts for a budget: $50 at a time to the farm where the next dollar earns most, net of costs,
// at most 20% of the budget in one farm; a farm with no estimate gets nothing
function recommend(B) {
  const a = {}, ok = FARMS.filter(f => f.lo != null && !f.free);
  ok.forEach(f => a[f.id] = 0);
  const step = Math.max(50, Math.ceil(B / 400 / 50) * 50);
  let left = Math.floor(B / step) * step;
  while (left >= step) {
    let best = null, bm = .05;
    for (const f of ok) {
      if (a[f.id] + step > B * .2) continue;
      const m = (midPer(f, a[f.id] + step) - midPer(f, a[f.id])) / step - (f.cp || 0) / 1000;
      if (m > bm) { bm = m; best = f; }
    }
    if (!best) break;
    a[best.id] += step; left -= step;
  }
  return a;
}

/* ---------- state ---------- */
const DEFAULT = () => ({budget: 5000, balance: 7240, horizon: 6, amt: {}, on: {}, last: {}, open: null, cat: "all", sort: "eff", q: "",
  farming: null, speed: 4, tokens: {}});
let S = DEFAULT();
if (SHOT) {
  Object.assign(S, {open: "arcus", sort: "none", amt: {arcus: 1000, variational: 800, polymarket: 600, lighter: 500, risex: 400, nado: 400, n1: 300, ostium: 300, base: 300, pacifica: 250}});
  ["arcus", "variational", "polymarket", "lighter", "risex", "nado", "n1", "ostium", "base", "pacifica", "arc", "axis"].forEach(id => S.on[id] = true);
} else {
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) S = Object.assign(DEFAULT(), s); } catch (e) {}
}
const save = () => { if (SHOT) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let REC = recommend(S.budget);
const rec = f => f.free ? 0 : (REC[f.id] || 0);
const amtOf = id => S.amt[id] || 0;
const allocated = () => FARMS.reduce((s, f) => s + (S.on[f.id] ? amtOf(f.id) : 0), 0);
const liveSum = () => S.farming ? Object.values(S.farming.farms).reduce((s, l) => s + l.amount, 0) : 0;

function toast(t) {
  const el = $("#toast");
  el.innerHTML = `<div class="toast">${t}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.innerHTML = "", 2600);
}

/* ---------- header ---------- */
function header() {
  const n = S.farming ? Object.keys(S.farming.farms).length : 0;
  const status = SHOT ? `<span class="dot"></span><b>FARMING</b> · 12 farms · $4,850 in`
    : n ? `<span class="dot"></span><b>FARMING</b> · ${n} farm${n > 1 ? "s" : ""} · ${usd(liveSum())} in` : `<span class="dot idle"></span><b>NOT FARMING</b>`;
  const badge = SHOT ? 12 : n;
  return `<header class="app">
    <a class="brand">${logo()}<div class="w"><span>AIRDROP</span><b>FARMER</b></div></a>
    <nav><a href="?tab=farms" data-tab="farms" class="${TAB === "farms" ? "on" : ""}">Farms</a><a href="?tab=live" data-tab="live" class="${TAB === "live" ? "on" : ""}">Live farms${badge ? ` <i>${badge}</i>` : ""}</a></nav>
    <div class="status" id="hstatus">${status}</div>
  </header>`;
}

/* ---------- Farms tab ---------- */
function farmsView() {
  const N = SHOT ? 412 : FARMS.length;
  return `<div class="back">← Back</div><div class="wrap">${header()}
  <section class="hero">
    <div>
      <div class="pill"><span class="dot"></span>${N} FARMS · ONE DEPOSIT</div>
      <h1>Deploy USDC.<br>Farm every airdrop.<br><em>Cymetica does the rest.</em></h1>
      <div class="sub">Chatbots explain airdrops. <b>Cymetica farms them.</b></div>
    </div>
    <div class="card plan">
      <div class="cap">YOUR FARM PLAN</div>
      <label for="budget">USDC to farm</label>
      <div class="bigin"><input id="budget" inputmode="decimal" autocomplete="off" value="${fmt(S.budget)}"><span>USDC</span></div>
      <div class="quick"><span>Balance <b id="bal">${fmt(S.balance)}</b> USDC</span><span class="q">${[25, 50, 75, 100].map(p => `<button data-pct="${p}">${p === 100 ? "Max" : p + "%"}</button>`).join("")}</span></div>
      <div class="alloc"><div class="bar"><i id="abar"></i></div><div class="r"><span>Allocated <b id="alloc"></b> of <span id="abud"></span></span><span id="aleft"></span></div></div>
      <div class="kpis"><div><small>Farms on</small><b id="kon"></b></div><div><small id="khz"></small><b class="g" id="kest"></b></div><div><small>Est. cost</small><b id="kcost"></b></div></div>
      <div class="btns"><button class="ghost" data-act="rec">Use recommended</button><button class="go" data-act="start" id="gobtn"></button></div>
      <div class="fine">Stop any farm any time · USDC back to your balance</div>
    </div>
  </section>
  <div class="sechead">
    <div><div class="cap2">ALL FARMS</div><h2>${N} farms. Toggle, size, start.</h2></div>
    <div class="tools"><label class="sel">Sort: <select id="sort">
      ${[["eff", "est. airdrop per $"], ["rec", "recommended"], ["on", "switched on first"], ["ends", "ending soon"], ["name", "name A–Z"]].map(([v, t]) => `<option value="${v}" ${S.sort === v || (SHOT && v === "eff") ? "selected" : ""}>${t}</option>`).join("")}
      </select> ▾</label><input id="q" class="search" placeholder="⌕ Search farms" value="${S.q}"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="table">
    <div class="thead cols"><div>ON</div><div>FARM</div><div>HOW</div><div>TOKEN</div><div>DEPLOY</div><div>USDC</div><div>RECOMMENDED</div><div id="esthead">EST. AIRDROP · ${S.horizon} MO</div><div></div></div>
    <div id="list"></div>
    <div class="more" id="more"></div>
  </div></div>`;
}

const SHOT_COUNTS = {all: 412, perp: 96, pred: 14, lend: 71, lp: 124, chain: 69, testnet: 22, tasks: 16};
function chips() {
  const cnt = c => SHOT ? SHOT_COUNTS[c] : c === "all" ? FARMS.length : FARMS.filter(f => f.cat === c).length;
  $("#chips").innerHTML = [["all", "All"], ...Object.entries(CAT)].map(([c, t]) =>
    `<button data-cat="${c}" class="${S.cat === c ? "on" : ""} ${c === "testnet" || c === "tasks" ? "free" : ""}">${t}<b>${cnt(c)}</b></button>`).join("");
}

function visible() {
  let L = FARMS.filter(f => (S.cat === "all" || f.cat === S.cat) && f.name.toLowerCase().includes(S.q.toLowerCase()));
  if (SHOT) return L.slice(0, 14);
  const eff = f => f.lo == null ? -1 : midPer(f, f.ref) / f.ref - (f.cp || 0) / 1000;
  const by = {eff: (a, b) => eff(b) - eff(a), rec: (a, b) => rec(b) - rec(a), on: (a, b) => (+!!S.on[b.id] - +!!S.on[a.id]) || eff(b) - eff(a),
    ends: (a, b) => a.ends - b.ends, name: (a, b) => a.name.localeCompare(b.name)}[S.sort];
  return by ? L.sort(by) : L;
}

const pct = v => Math.min(1, v / Math.max(S.budget, 1));
const pos = v => `calc(8px + (100% - 16px) * ${pct(v)})`;

function rowHTML(f) {
  const a = amtOf(f.id), on = !!S.on[f.id], r = rec(f), open = S.open === f.id;
  const slider = f.free ? `<div class="sl"><div class="dis"></div><div class="scale"><span>no USDC needed</span><span></span></div></div>`
    : `<div class="sl"><div class="rng"><i class="trk"></i><i class="fil" style="width:${pos(a)}"></i>${r ? `<i class="recm" style="left:${pos(r)}"></i>` : ""}
        <input type="range" min="0" max="${S.budget}" step="50" value="${a}" data-rng="${f.id}" aria-label="USDC into ${f.name}"></div>
        <div class="scale"><span>0</span><span>${kfmt(S.budget / 2)}</span><span>${kfmt(S.budget)}</span></div></div>`;
  return `<div class="frow cols ${on ? "" : "off"} ${open ? "open" : ""}" data-row="${f.id}">
    <div><button class="tg ${on ? "on" : ""}" data-tog="${f.id}" aria-label="Farm ${f.name}"></button></div>
    <div class="farm"><span class="lg ${f.c}">${f.ini}</span><div><b>${f.name}</b><small>${f.sub}</small></div></div>
    <div class="how"><span class="tag ${f.free ? "free" : ""}">${f.how}</span></div>
    <div class="tok"><b class="${f.tc}">${f.tok}</b><small>${f.season}</small></div>
    ${slider}
    <div>${f.free ? `<div class="amt free">FREE</div>` : `<div class="amt"><input data-amt="${f.id}" inputmode="decimal" value="${fmt(a)}" aria-label="${f.name} USDC"><span>USDC</span></div>`}</div>
    <div class="rec" id="rec-${f.id}">${recHTML(f)}</div>
    <div class="est" id="est-${f.id}">${estHTML(f)}</div>
    <div><button class="chev ${open ? "open" : ""}" data-open="${f.id}" aria-label="Simulator">${open ? "▴" : "▾"}</button></div>
  </div>${open ? `<div class="sim" id="sim">${simHTML(f)}</div>` : ""}`;
}
function recHTML(f) {
  const r = rec(f), a = amtOf(f.id);
  if (f.free) return `<span class="ok">free</span>`;
  if (!r) return `<b class="none">—</b>`;
  return a === r && S.on[f.id] ? `<b>${usd(r)}</b><span class="ok">✓</span>` : `<b>${usd(r)}</b><button class="use" data-use="${f.id}">use</button>`;
}
function estHTML(f) {
  const a = S.on[f.id] ? amtOf(f.id) : 0;
  if (f.lo == null) return `<b class="no">no estimate</b><small>${f.why}</small>`;
  const e = est(f, a, S.horizon), c = cost(f, a, S.horizon);
  if (!e) { const p = rec(f) || f.ref, ep = est(f, p, S.horizon); return `<b class="no">${usd(r10(ep.lo))} – ${usd(r10(ep.hi))}</b><small>if ${usd(p)}</small>`; }
  const note = f.note || (f.how === "Deposit" || f.how === "Bridge" ? `gas ≈ ${usd(c)}` : `fees ≈ ${usd(c)}`);
  return `<b>${usd(r10(e.lo))} – ${usd(r10(e.hi))}</b><small>${note}</small>`;
}

function renderList() {
  const L = visible();
  $("#list").innerHTML = L.length ? L.map(rowHTML).join("") : `<div class="more" style="background:none">No farm matches.</div>`;
  $("#more").innerHTML = SHOT ? `<span>Showing 14 of 412 farms</span><span class="btn">Show 50 more</span>`
    : `<span>Showing ${L.length} of ${FARMS.length} farms</span><span>test data</span>`;
  $("#esthead").textContent = `EST. AIRDROP · ${S.horizon} MO`;
}

function updatePlan() {
  const B = S.budget, A = allocated();
  let lo = 0, hi = 0, c = 0, n = 0;
  FARMS.forEach(f => {
    if (!S.on[f.id]) return;
    n++;
    const e = est(f, amtOf(f.id), S.horizon);
    if (e) { lo += r10(e.lo); hi += r10(e.hi); }
    c += Math.round(cost(f, amtOf(f.id), S.horizon));
  });
  $("#abar").style.width = (B ? Math.min(100, A / B * 100) : 0) + "%";
  $("#alloc").textContent = usd(A);
  $("#abud").textContent = usd(B);
  $("#aleft").textContent = A > B ? `${usd(A - B)} over` : `${usd(B - A)} left`;
  $("#kon").textContent = n;
  $("#khz").textContent = `Est. airdrops · ${S.horizon} mo`;
  $("#kest").textContent = lo || hi ? `${usd(lo)} – ${usd(hi)}` : "$0";
  $("#kcost").textContent = usd(c);
  $("#bal").textContent = fmt(S.balance);
  $("#gobtn").innerHTML = S.farming ? "▶&nbsp; Update farms" : "▶&nbsp; Start farming";
}

// one row's moving parts, without redrawing the slider being dragged
function updateRow(id) {
  const f = BY[id], row = document.querySelector(`[data-row="${id}"]`);
  if (!row) return;
  const a = amtOf(id), on = !!S.on[id];
  row.classList.toggle("off", !on);
  row.querySelector(".tg").classList.toggle("on", on);
  const fil = row.querySelector(".fil"); if (fil) fil.style.width = pos(a);
  const rg = row.querySelector("[data-rng]"); if (rg && +rg.value !== a) rg.value = a;
  const fi = row.querySelector("[data-amt]"); if (fi && document.activeElement !== fi) fi.value = fmt(a);
  $("#rec-" + id).innerHTML = recHTML(f);
  $("#est-" + id).innerHTML = estHTML(f);
  if (S.open === id && $("#sim")) $("#sim").innerHTML = simHTML(f);
}

// set one farm's amount, never past the budget
function setAmt(id, v, quiet) {
  const f = BY[id];
  if (f.free) return;
  v = Math.max(0, Math.round(v || 0));
  const room = S.budget - (allocated() - (S.on[id] ? amtOf(id) : 0));
  if (v > room) { v = Math.max(0, Math.floor(room / 50) * 50); if (!quiet) toast(`Budget full: raise <b>USDC to farm</b> to add more`); }
  S.amt[id] = v;
  S.on[id] = v > 0;
  if (v > 0) S.last[id] = v;
  updateRow(id); updatePlan(); save();
}

// while typing the plan may read "over"; on Enter, leaving the field or a % button it is scaled to fit
function setBudget(B, commit) {
  B = Math.max(0, Math.round(B || 0));
  const most = Math.floor(S.balance + liveSum());
  if (commit && B > most) { B = most; toast(`Only ${usd(most)} USDC available`); const el = $("#budget"); if (el) el.value = fmt(B); }
  S.budget = B;
  REC = recommend(B);
  const A = allocated();
  if (commit && A > B && A > 0) { // the plan never adds up to more than the budget: scale it down
    const k = B / A;
    FARMS.forEach(f => { if (S.on[f.id] && !f.free) { S.amt[f.id] = Math.floor(amtOf(f.id) * k / 50) * 50; if (!S.amt[f.id]) S.on[f.id] = false; } });
    toast(`Amounts scaled down to fit ${usd(B)}`);
  }
  renderList(); updatePlan(); save();
}

/* ---------- simulator ---------- */
// an axis of at most five round steps
function niceAxis(v) {
  const step = [50, 100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000, 20000, 25000, 50000, 1e5, 2e5, 2.5e5, 5e5, 1e6].find(s => v / s <= 5) || 1e6;
  return {max: Math.max(step, Math.ceil(v / step) * step), step};
}

  for (let i = 0; i <= 5; i++) { const v = B * i / 5; grid += `<text x="${x(v)}" y="${Hh - 10}" fill="#7f93ad" font-size="10" text-anchor="middle">${v ? kfmt(Math.round(v)) : 0}</text>`; }
  const ea = E(a), eB = E(B), pe = est(f, a || r || f.ref, H);
  const share = pe.lo / (f.pool * f.fdv) * 100, fdvHi = f.fdv * f.hi / f.lo;

    <text x="${(x(f.knee) + x(B)) / 2}" y="${T + 44}" fill="#7f93ad" font-size="10.5" text-anchor="middle">above ${usd(f.knee)} each dollar earns less here</text>
    <text x="${(x(f.knee) + x(B)) / 2}" y="${T + 58}" fill="#7f93ad" font-size="10.5" text-anchor="middle">than in your next farm</text>` : "";

        <dt>Your share of the points</dt><dd>≈ ${share.toFixed(4)} %</dd>

const kM = v => v >= 1e9 ? +(v / 1e9).toFixed(1) + "B" : Math.round(v / 1e6) + "M";

/* ---------- start farming ---------- */
const FIRST = {Deposit: (n, f) => `Deposited ${n} into <b>${f}</b>`, Trade: (n, f) => `<b>${f}</b>: hedged positions opened, ${n}`,
  LP: (n, f) => `Quoting liquidity on <b>${f}</b> with ${n}`, Bridge: (n, f) => `Bridged ${n} to <b>${f}</b>`,
  Testnet: (n, f) => `<b>${f}</b>: testnet wallet set up`, Tasks: (n, f) => `<b>${f}</b>: first task started`};
function planLines() {
  return FARMS.filter(f => S.on[f.id]).map(f => ({f, a: f.free ? 0 : amtOf(f.id), e: est(f, amtOf(f.id), S.horizon)}));
}
function openStart() {
  const L = planLines();
  if (!L.length) return toast("Switch on at least one farm");
  const A = L.reduce((s, l) => s + l.a, 0), need = A - liveSum();
  if (A > S.budget) return toast("The plan is over the budget");
  if (need > S.balance) return toast(`Not enough USDC: you need ${usd(need)}, the balance is ${usd(S.balance)}`);
  let lo = 0, hi = 0, c = 0;
  L.forEach(l => { if (l.e) { lo += r10(l.e.lo); hi += r10(l.e.hi); } c += Math.round(cost(l.f, l.a, S.horizon)); });
  $("#modal").innerHTML = `<div class="ov" data-act="close"><div class="card modal">
    <div class="cap">${S.farming ? "UPDATE YOUR FARMS" : "START FARMING"}</div>
    <h3>${L.length} farms · ${usd(A)}</h3>
    <div class="lead">Cymetica's agent deposits, trades hedged, quotes, bridges, claims and syncs points from one farm wallet with your USDC. Stop any farm any time.</div>
    <div class="lines">${L.map(l => `<div class="ln"><span>${l.f.name} <small>· ${l.f.how}</small></span><span>${l.f.free ? "free" : usd(l.a)}</span><span>${l.e ? `${usd(r10(l.e.lo))} – ${usd(r10(l.e.hi))}` : `<small>no estimate</small>`}</span></div>`).join("")}
      <div class="ln tot"><span>Est. airdrops · ${S.horizon} mo</span><span>${usd(A)}</span><span>${usd(lo)} – ${usd(hi)}</span></div>
      <div class="ln"><span>Est. cost (fees, funding, gas)</span><span></span><span style="color:var(--text)">${usd(c)}</span></div>
      <div class="ln"><span>Cymetica fee</span><span></span><span style="color:var(--dim)">set by Cymetica</span></div>
    </div>
    <div class="btns"><button class="ghost" data-act="close">Cancel</button><button class="go" data-act="confirm">${S.farming ? "Update farms" : "▶&nbsp; Start farming"}</button></div>
    <div class="fine">Test data: no USDC moves, nothing leaves this page.</div>
  </div></div>`;
}
function feed(txt, c = "cyan", d) {
  const F = S.farming;
  F.feed.unshift({d: d == null ? F.day : d, txt, c});
  F.feed.sort((p, q) => q.d - p.d);
  F.feed.length = Math.min(F.feed.length, 40);
}
function confirmStart() {
  if (!S.farming) S.farming = {day: 0, farms: {}, hist: [{d: 0, lo: 0, hi: 0}], feed: [], claimed: 0, cost: 0, claims: [], lastDay: 0};
  const F = S.farming;
  planLines().forEach(({f, a}) => {
    const l = F.farms[f.id];
    if (!l) {
      F.farms[f.id] = {amount: a, start: F.day, pts: 0, lo: 0, hi: 0, cost: 0, n: 0, claim: 0, week: 0, cap: f.live.cap0 || 0, tge: f.live.tge ? F.day + f.live.tge : null, done: false};
      S.balance -= a;
      feed(FIRST[f.how](usd(a), f.name), "cyan");
    } else if (l.amount !== a) {
      S.balance -= a - l.amount;
      feed(`<b>${f.name}</b>: ${a > l.amount ? "added" : "withdrew"} ${usd(Math.abs(a - l.amount))}`, "cyan");
      l.amount = a;
    }
  });
  for (const id of Object.keys(F.farms)) if (!S.on[id]) stopFarm(id, true);
  if (S.farming && !Object.keys(S.farming.farms).length) S.farming = null;
  $("#modal").innerHTML = "";
  save();
  go("live");
}
function stopFarm(id, quiet) {
  const F = S.farming, l = F && F.farms[id];
  if (!l) return;
  if (l.claim > 0) claimFarm(id);
  const back = Math.max(0, l.amount - l.cost);
  S.balance += back;
  delete F.farms[id];
  S.on[id] = false; S.amt[id] = 0;
  feed(`<b>${BY[id].name}</b> stopped: ${usd(back)} back to your balance`, "red");
  if (!Object.keys(F.farms).length) { S.farming = null; if (!quiet) toast("All farms stopped"); }
  else if (!quiet) toast(`${BY[id].name} stopped · ${usd(back)} back`);
}
const tokAmt = (f, n) => f.live.tge ? fmt(n) : f.live.weekly ? n.toFixed(1) : n.toFixed(2);
function claimFarm(id) {
  const F = S.farming, l = F.farms[id], f = BY[id];
  if (!l || !l.claim) return;
  const v = l.claim * f.live.px;
  S.tokens[f.live.tk] = (S.tokens[f.live.tk] || 0) + l.claim;
  F.claimed += v; F.claims.push(F.day);
  feed(`Claimed <em>${tokAmt(f, l.claim)} ${f.live.tk}</em> (${usd(v)}) from <b>${f.name}</b>`, "green");
  if (f.live.tge) { l.done = true; l.lo = l.hi = 0; }
  l.claim = 0;
}

/* ---------- the clock: one test day every few seconds ---------- */
function advance(dd) {
  const F = S.farming;
  const d0 = F.day; F.day += dd;
  for (const [id, l] of Object.entries(F.farms)) {
    const f = BY[id], L = f.live;
    if (l.done) continue;
    const dc = cost(f, l.amount, 6) / 180 * dd; l.cost += dc; F.cost += dc;
    let earning = true;
    if (L.cap0 != null) {
      const before = l.cap; l.cap = Math.min(1, l.cap + L.capDay * dd);
      if (before < .8 && l.cap >= .8) feed(`<b>${f.name}</b> ${Math.round(l.cap * 100)}% of its points cap used`, "red");
      if (before < 1 && l.cap >= 1) feed(`<b>${f.name}</b> points cap reached: it earns nothing more, stop it to free ${usd(l.amount)}`, "red");
      if (l.cap >= 1) earning = false;
    }
    if (L.wait) earning = false;
    if (earning && L.pts) {
      l.pts += (f.ppw || 0) / 7 * g(f, l.amount) / g(f, f.ref) * dd;
      const e = est(f, l.amount, 6); l.lo += e.lo / 180 * dd; l.hi += e.hi / 180 * dd;
    }
    if (L.daily) { const e = est(f, l.amount, 6); l.lo += e.lo / 180 * dd; l.hi += e.hi / 180 * dd; l.claim += L.daily * l.amount * dd; }
    if (L.weekly) l.week += L.weekly * l.amount / 7 * dd;
    if (L.txs) l.n += L.txs * dd;
    if (L.tasks) l.n += L.tasks * dd;
  }
  // whole days
  for (let d = Math.floor(d0) + 1; d <= Math.floor(F.day); d++) {
    let gained = 0, k = 0;
    const log = (txt, c) => feed(txt, c, d - 1 + .2 + Math.random() * .75); // during the day just ended
    for (const [id, l] of Object.entries(F.farms)) {
      const f = BY[id], L = f.live;
      if (L.pts && !l.done && (L.cap0 == null || l.cap < 1)) { gained += (f.ppw || 0) / 7 * g(f, l.amount) / g(f, f.ref); k++; }
      if (L.weekly && (d - Math.ceil(l.start)) % 7 === 0) { l.claim += l.week; log(`<b>${f.name}</b> weekly payout ready: <em>${l.week.toFixed(1)} ${L.tk}</em>`, "green"); l.week = 0; }
      if (L.epoch && (d - Math.ceil(l.start)) % L.epoch === 0) log(`<b>${f.name}</b> epoch closed: ${Math.round(l.n)} tasks counted`, "blue");
      if (l.tge != null && !l.done && !l.claim && d >= l.tge) {
        const seed = (id.length * 97 + d * 13) % 100 / 100, v = l.lo + (l.hi - l.lo) * (.25 + .5 * seed);
        l.claim = v / L.px; l.lo = l.hi = v;
        log(`<b>${L.tk}</b> launched: <em>${fmt(l.claim)} ${L.tk}</em> (${usd(v)}) ready to claim on <b>${f.name}</b>`, "green");
      }
      if (f.how === "Trade" && L.pts && d % 3 === 0 && Math.random() < .5) log(`<b>${f.name}</b> hedge rebalanced, funding ${Math.random() < .5 ? "+" : "−"}$${(Math.random() * 3).toFixed(2)}`, "cyan");
      if (L.daily && d % 2 === 0) log(`<b>${f.name}</b> quotes refreshed on ${4 + d % 5} markets`, "cyan");
    }
    if (k) log(`Points synced: <em>+${fmt(gained)}</em> across ${k} farm${k > 1 ? "s" : ""}`, "green");
    F.hist.push({d, ...totals()});
  }
}
function totals() {
  const F = S.farming; let lo = 0, hi = 0;
  for (const [id, l] of Object.entries(F.farms)) { const f = BY[id]; if (!l.done) { lo += l.lo; hi += l.hi; } if (f.live.weekly) { lo += (l.claim + l.week) * f.live.px; hi += (l.claim + l.week) * f.live.px; } }
  return {lo: lo + F.claimed, hi: hi + F.claimed};
}

/* ---------- Live farms tab ---------- */
function liveVM() {
  if (SHOT) return SHOT_VM;
  const F = S.farming;
  if (!F) return null;
  const T = totals(), stamp = d => `D${Math.floor(d) + 1} ${String(Math.floor(d % 1 * 24)).padStart(2, "0")}:${String(Math.floor(d * 1440 % 60)).padStart(2, "0")}`;
  const rows = Object.entries(F.farms).map(([id, l]) => {
    const f = BY[id], L = f.live, days = Math.floor(F.day - l.start);
    let st = ["f", "FARMING"], pts = "", today = "", estv, claim = "";

    else if (L.tge && l.tge - F.day <= 7) st = ["s", `TGE IN ${Math.max(1, Math.ceil(l.tge - F.day))} D`];
    else if (L.epoch) st = ["s", `EPOCH ENDS IN ${L.epoch - (Math.floor(F.day - l.start) % L.epoch)} D`];
    else if (L.txs && !f.free) st = ["m", "ACTIVE · NO POINTS"];
    else if (L.wait) st = ["m", "WAITING · NO POINTS"];
    else if (L.daily && l.claim >= 1) st = ["c", "CLAIMABLE"];
    const rate = (f.ppw || 0) / 7 * g(f, l.amount) / g(f, f.ref || 1);
    if (L.pts) { pts = `${fmt(l.pts)} pts`; today = l.done || (L.cap0 != null && l.cap >= 1) ? "" : `+${fmt(rate)}`; }
    else if (L.daily) { pts = `${l.claim.toFixed(2)} ${L.tk}`; today = `+${(L.daily * l.amount).toFixed(2)}`; }
    else if (L.weekly) { pts = `${l.week.toFixed(1)} ${L.tk} this week`; }

    else if (L.daily) estv = `${money(l.lo)} – ${money(l.hi)}`;
    else if (l.tge != null && l.claim) estv = `${fmt(l.claim)} ${L.tk}`;

    else estv = `${money(l.lo)} – ${money(l.hi)}`;
    if ((L.daily ? l.claim >= 1 : l.claim > 0) && (L.weekly || L.daily || L.tge)) claim = `Claim ${tokAmt(f, l.claim)} ${L.tk}`;
    return {id, c: f.c, ini: f.ini, name: f.name, sub: `${f.how} · ${f.season.split(" · ")[0]}`, st, amt: l.amount, free: f.free, days, pts, today, est: estv, claim};
  });
  const ptsToday = Object.entries(F.farms).reduce((s, [id, l]) => { const f = BY[id]; return s + (f.live.pts && !l.done && (f.live.cap0 == null || l.cap < 1) ? (f.ppw || 0) / 7 * g(f, l.amount) / g(f, f.ref) : 0); }, 0);
  const tok = Object.keys(S.tokens).filter(k => S.tokens[k] > 0);
  return {
    tiles: {in: liveSum(), plan: S.budget, running: rows.filter(r => r.st[1] !== "CLAIMED").length, claimable: rows.filter(r => r.claim).length,
      lo: T.lo, hi: T.hi, claimed: F.claimed, claimedNote: tok.length ? tok.join(" + ") : "nothing yet", cost: F.cost, days: Math.floor(F.day), since: "you started"},
    hist: F.hist.concat([{d: F.day, ...T}]), claims: F.claims, now: F.day,
    feed: F.feed.slice(0, 6).map(e => ({t: stamp(e.d), c: e.c, html: e.txt})),

  };
}

  // every figure is the plan's own: 6-month estimates x days farmed / 180, points at each farm's weekly rate
  const hist = []; for (let d = 0; d <= 23; d++) { const k = Math.pow(d / 23, 1.1); hist.push({d, lo: 110 * k, hi: 400 * k}); }
  return {
    tiles: {in: 4850, plan: 5000, running: 12, claimable: 2, lo: 110, hi: 400, claimed: 13, claimedNote: "7 LIT", cost: 17, days: 23, since: "since 29 Sep"},
    hist, claims: [7, 14], now: 23, start: "29 Sep", axis: {max: 500, step: 100},
    feed: [
      {t: "14:05", c: "green", html: "Points synced: <em>+1,896</em> across 7 farms"},
      {t: "13:40", c: "cyan", html: "<b>Variational</b> long hedged with a <b>Lighter</b> short, $400 each"},
      {t: "11:15", c: "green", html: "<b>Lighter</b> weekly payout ready: <em>3.5 LIT</em>"},
      {t: "09:30", c: "cyan", html: "Polymarket quotes refreshed on 6 markets"},
      {t: "08:00", c: "blue", html: "Axis Robotics: 1 task done, epoch ends Fri"},
      {t: "07:12", c: "red", html: "<b>Ostium</b> 81% of its points cap used"}],
    rows: [
      R("arcus", "c1", "AR", "Arcus", "Deposit · Season 1", ["f", "FARMING"], 1000, 21, "5,520 pts", "+263", "$30 – $110"),
      R("variational", "c2", "VA", "Variational", "Trade · TGE Q4 2026", ["f", "FARMING"], 800, 23, "1,380 pts", "+60", "$20 – $90"),
      R("lighter", "c1", "LI", "Lighter", "Trade · weekly LIT", ["c", "CLAIMABLE"], 500, 23, "1.0 LIT this week", "", "3.5 LIT", "Claim 3.5 LIT"),
      R("polymarket", "c3", "PM", "Polymarket", "LP · daily pUSD", ["c", "CLAIMABLE"], 600, 23, "5.52 pUSD", "+0.24", "$5 – $40", "Claim 5.52 pUSD"),
      R("risex", "c2", "RX", "RISEx", "Trade · Season 1", ["f", "FARMING"], 400, 23, "8,970 pts", "+390", "$10 – $50"),
      R("nado", "c3", "NA", "Nado", "Trade · Season 2", ["f", "FARMING"], 400, 19, "11,590 pts", "+610", "$5 – $30"),
      R("ostium", "c1", "OS", "Ostium", "Trade · Season 2", ["s", "CAP 81% USED"], 300, 23, "3,220 pts", "+140", "$5 – $25"),
      R("n1", "c4", "N1", "N1", "Trade · Season 1", ["f", "FARMING"], 300, 16, "5,490 pts", "+343", "$5 – $20"),
      R("base", "c3", "BA", "Base", "Bridge · 34 txs", ["m", "ACTIVE · NO POINTS"], 300, 23, "34 txs", "+2", "no estimate"),
      R("pacifica", "c2", "PA", "Pacifica", "Trade · Season 1", ["f", "FARMING"], 250, 12, "1,080 pts", "+90", "$1 – $9"),
      R("arc", "c1", "AC", "Arc Testnet", "Testnet · free", ["f", "FARMING"], 0, 23, "69 txs", "+3", "no estimate"),
      R("axis", "c2", "AX", "Axis Robotics", "Tasks · free", ["s", "EPOCH ENDS FRI"], 0, 23, "18 tasks", "+1", "no estimate")],
    tot: {amt: 4850, today: 1896, lo: 110, hi: 400, anyClaim: true},
  };
})();

function liveChart(vm) {
  const W = 800, H = 262, L = 50, R = 24, T = 14, B = 28;
  const N = Math.max(10, Math.ceil(vm.now)), ax = vm.axis || niceAxis(Math.max(100, ...vm.hist.map(h => h.hi)) * 1.08), maxv = ax.max;
  const x = d => L + d / N * (W - L - R), y = v => H - B - v / maxv * (H - T - B);
  let g = "";
  for (let v = 0; v <= maxv; v += ax.step) { g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#1e3050"/><text x="${L - 8}" y="${y(v) + 4}" fill="#7f93ad" font-size="10" text-anchor="end">$${v ? kfmt(Math.round(v)) : 0}</text>`; }
  const ticks = SHOT ? [0, 5, 10, 15, 20, 23] : [0, Math.round(N / 4), Math.round(N / 2), Math.round(N * 3 / 4), N];
  ticks.forEach((d, i) => g += `<text x="${x(d)}" y="${H - 9}" fill="#7f93ad" font-size="10" text-anchor="${i === ticks.length - 1 ? "end" : i ? "middle" : "start"}">${i === 0 ? (vm.start || "start") : i === ticks.length - 1 && SHOT ? "today" : "day " + d}</text>`);
  const h = vm.hist, last = h[h.length - 1];
  const band = h.map(p => `${x(p.d)},${y(p.hi)}`).join(" ") + " " + h.slice().reverse().map(p => `${x(p.d)},${y(p.lo)}`).join(" ");
  const midl = h.map(p => `${x(p.d)},${y((p.lo + p.hi) / 2)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}
    <polygon points="${band}" fill="rgba(0,207,255,.14)"/>
    <polyline points="${midl}" fill="none" stroke="#00ff88" stroke-width="2.4"/>
    <circle cx="${x(last.d)}" cy="${y((last.lo + last.hi) / 2)}" r="5" fill="#00ff88"/>
    <text x="${Math.min(x(last.d), W - R) - 10}" y="${Math.max(T + 10, y(last.hi) - 6)}" fill="#e6edf7" font-size="11" font-weight="700" text-anchor="end">${money(last.lo)} – ${money(last.hi)} earned so far</text>
    ${vm.claims.map(d => `<line x1="${x(d)}" x2="${x(d)}" y1="${y(0)}" y2="${y(0) - 10}" stroke="#00ff88" stroke-width="2"/>`).join("")}
    ${vm.claims.length ? `<text x="${x(vm.claims[Math.floor(vm.claims.length / 2)])}" y="${y(0) - 14}" fill="#7f93ad" font-size="9.5" text-anchor="middle">claims</text>` : ""}
  </svg>`;
}

function liveView() {
  const vm = liveVM();
  if (!vm) return `<div class="back">← Back</div><div class="wrap">${header()}
    <div class="card emptylive" style="margin-top:26px"><b>No farms running yet</b>Pick farms and an amount on the Farms tab, then press Start farming.<br>
    <button class="go" data-tab="farms">Go to Farms</button></div></div>`;
  const t = vm.tiles;
  const rows = vm.rows.map(r => `<div class="lrow lcols">
      <div class="farm"><span class="lg ${r.c}">${r.ini}</span><div><b>${r.name}</b><small>${r.sub}</small></div></div>
      <div><span class="st ${r.st[0]}">${r.st[1]}</span></div>
      <div><b>${r.amt ? usd(r.amt) : "free"}</b></div>
      <div>${r.days} d</div>
      <div class="pts"><b>${r.pts}</b>${r.today ? `<em>${r.today} today</em>` : ""}</div>
      <div>${r.est === "no estimate" ? `<span style="color:var(--dim)">no estimate</span>` : r.est === "claimed" ? `<span style="color:var(--muted)">claimed</span>` : `<b class="g">${r.est}</b>`}</div>
      <div class="acts">${r.claim ? `<button class="claim" data-claim="${r.id}">${r.claim}</button>` : ""}<button class="stop" data-stop="${r.id}">Stop</button></div>
    </div>`).join("");
  return `<div class="back">← Back</div><div class="wrap">${header()}
  <div class="tiles">
    <div class="tile"><small>IN FARMS</small><b>${usd(t.in)}</b><span>of ${usd(t.plan)} plan</span></div>
    <div class="tile"><small>FARMS RUNNING</small><b>${t.running}</b><span>${t.claimable} claimable</span></div>
    <div class="tile hi"><small>EST. AIRDROPS</small><b class="g">${money(t.lo)}–${money(t.hi)}</b><span>earned so far</span></div>
    <div class="tile"><small>CLAIMED</small><b>${usd(t.claimed)}</b><span>${t.claimedNote}</span></div>
    <div class="tile"><small>COST SO FAR</small><b>${usd(t.cost)}</b><span>fees, funding, gas</span></div>
    <div class="tile"><small>DAYS FARMING</small><b>${t.days}</b><span>${t.since}</span></div>
  </div>
  <div class="mid">
    <div class="card" style="padding:16px 18px 10px"><div class="cap" style="margin-bottom:8px">EST. AIRDROP VALUE EARNED</div>${liveChart(vm)}</div>
    <div class="card feed ${SHOT ? "" : "wide"}" style="padding:16px 18px">
      <div class="cap" style="margin-bottom:6px">WHAT CYMETICA DID ${SHOT ? "TODAY" : "LATELY"}</div>
      ${vm.feed.length ? vm.feed.map(e => `<div class="it"><span class="t">${e.t}</span><i class="ic" style="background:var(--${e.c})"></i><span>${e.html}</span></div>`).join("") : `<div class="empty">Starting…</div>`}
    </div>
  </div>
  <div class="table" style="margin-top:16px">
    <div class="lhead lcols"><div>FARM</div><div>STATUS</div><div>IN</div><div>DAYS</div><div>POINTS</div><div>EST. AIRDROP</div><div></div></div>
    ${rows}
    <div class="ltot lcols"><div>Total · ${vm.rows.length} farms</div><div></div><div><b>${usd(vm.tot.amt)}</b></div><div></div><div><small>+${fmt(vm.tot.today)} pts today</small></div><div><b class="g">${money(vm.tot.lo)} – ${money(vm.tot.hi)}</b></div><div class="acts">${vm.tot.anyClaim ? `<button class="claim" data-act="claimall">Claim all</button>` : ""}<button class="stop" data-act="stopall">Stop all</button></div></div>
  </div></div>`;
}

/* ---------- logo sheet ---------- */
function sheet() {
  const sz = n => logo().replace("<svg", `<svg style="width:${n}px;height:${n}px"`);
  return `<div class="sheet"><div class="bigl">${logo()}</div>
    <div><div class="wm">${logo()}<div><span>AIRDROP</span><b>FARMER</b></div></div>
      <div class="sizes">${[64, 40, 24, 16].map(n => `<div>${sz(n)}${n}</div>`).join("")}</div></div></div>`;
}

/* ---------- wiring ---------- */
function ribbon() {
  if (SHOT) return;
  $("#ribbon").innerHTML = `<div class="ribbon"><b>TEST DATA</b><span>nothing leaves this page</span>
    <span>1 day =</span>${[[4, "4 s"], [1, "1 s"], [0, "pause"]].map(([v, t]) => `<button data-speed="${v}" class="${S.speed === v ? "on" : ""}">${t}</button>`).join("")}
    <button data-act="reset">Reset</button></div>`;
}
function render() {
  if (TAB === "logo") { $("#root").innerHTML = sheet(); return; }
  if (TAB === "live") { $("#root").innerHTML = liveView(); ribbon(); return; }
  $("#root").innerHTML = farmsView();
  chips(); renderList(); updatePlan(); ribbon();
}
function go(tab) {
  TAB = tab;
  const u = new URL(location.href); u.searchParams.set("tab", tab); history.replaceState(null, "", u);
  render(); scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-tog],[data-use],[data-open],[data-cat],[data-pct],[data-hz],[data-act],[data-speed]");
  if (!t || SHOT) return;
  const d = t.dataset;
  if (d.tab) return e.preventDefault(); // switched on pointerdown, below
  if (d.tog) {
    const f = BY[d.tog];
    if (S.on[f.id]) { S.on[f.id] = false; if (!f.free) { S.last[f.id] = amtOf(f.id) || S.last[f.id]; S.amt[f.id] = 0; } updateRow(f.id); updatePlan(); save(); }
    else if (f.free) { S.on[f.id] = true; updateRow(f.id); updatePlan(); save(); }
    else {
      const room = S.budget - allocated();
      if (room < 50) return toast(`Budget full: raise <b>USDC to farm</b> or lower another farm`);
      setAmt(f.id, Math.min(rec(f) || S.last[f.id] || 300, Math.floor(room / 50) * 50), true);
    }
    return;
  }
  if (d.use) return setAmt(d.use, rec(BY[d.use]));
  if (d.open) { S.open = S.open === d.open ? null : d.open; renderList(); save(); return; }
  if (d.cat) { S.cat = d.cat; chips(); renderList(); save(); return; }
  if (d.pct) { const B = Math.floor((S.balance + liveSum()) * d.pct / 100); $("#budget").value = fmt(B); return setBudget(B, true); }
  if (d.hz) { S.horizon = +d.hz; renderList(); updatePlan(); save(); return; }
  if (d.speed != null) { S.speed = +d.speed; ribbon(); save(); return; }
  switch (d.act) {
    case "rec":
      FARMS.forEach(f => { if (f.free) S.on[f.id] = true; else { S.amt[f.id] = rec(f); S.on[f.id] = rec(f) > 0; } });
      renderList(); updatePlan(); save(); toast("Recommended amounts set for " + usd(S.budget)); break;
    case "start": openStart(); break;
    case "close": if (e.target === t) $("#modal").innerHTML = ""; break;
    case "confirm": confirmStart(); break;
    case "stopall-ok": $("#modal").innerHTML = ""; Object.keys(S.farming.farms).forEach(id => stopFarm(id, true)); save(); toast("All farms stopped"); render(); break;
    case "reset": try { localStorage.removeItem(KEY); } catch (err) {} S = DEFAULT(); REC = recommend(S.budget); go("farms"); toast("Test reset"); break;
  }
});
// the live tab redraws twice a second, so the tabs and its buttons act on pointerdown
document.addEventListener("pointerdown", e => {
  const t = e.target.closest("[data-tab],[data-claim],[data-stop],[data-act=claimall],[data-act=stopall]");
  if (!t || SHOT || e.button) return;
  const d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.claim) { claimFarm(d.claim); toast("Claimed"); }
  else if (d.stop) stopFarm(d.stop);
  else if (d.act === "claimall") { Object.keys(S.farming.farms).forEach(claimFarm); toast("Everything claimable claimed"); }
  else if (d.act === "stopall") return openStopAll();
  save(); render();
});
function openStopAll() {
  $("#modal").innerHTML = `<div class="ov" data-act="close"><div class="card modal" style="width:440px"><div class="cap">STOP ALL</div>
    <h3>Stop every farm?</h3><div class="lead">Anything claimable is claimed first, positions are closed and about ${usd(Object.values(S.farming.farms).reduce((s, l) => s + Math.max(0, l.amount - l.cost), 0))} goes back to your balance.</div>
    <div class="btns"><button class="ghost" data-act="close">Cancel</button><button class="go" style="background:var(--red);box-shadow:none;color:var(--text)" data-act="stopall-ok">Stop all</button></div></div></div>`;
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.rng) {
    const id = t.dataset.rng, f = BY[id];
    setAmt(id, +t.value);
    if (+t.value !== amtOf(id)) t.value = amtOf(id);
    return;
  }
  if (t.dataset.amt) { const v = +t.value.replace(/[^\d.]/g, ""); setAmt(t.dataset.amt, v); return; }
  if (t.id === "budget") { const v = +t.value.replace(/[^\d.]/g, ""); setBudget(v, false); return; }
  if (t.id === "q") { S.q = t.value; renderList(); save(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "sort") { S.sort = e.target.value; renderList(); save(); }
});
document.addEventListener("focusout", e => {
  const t = e.target;
  if (t.dataset && t.dataset.amt) t.value = fmt(amtOf(t.dataset.amt));
  if (t.id === "budget") { t.value = fmt(S.budget); setBudget(S.budget, true); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("#modal").innerHTML = "";
  if (e.key === "Enter" && (e.target.id === "budget" || (e.target.dataset && e.target.dataset.amt))) e.target.blur();
});
document.addEventListener("pointerdown", e => {
  const svg = e.target.closest("svg[data-chart]");
  if (!svg || SHOT) return;
  const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (svg.viewBox.baseVal.width / r.width);
  const v = (px - +svg.dataset.l) / +svg.dataset.w * S.budget;
  setAmt(svg.dataset.chart, Math.max(0, Math.round(v / 50) * 50));
});

// the test page fits a narrow window by scaling the whole page, so nothing scrolls sideways
const fit = () => { if (!SHOT) document.body.style.zoom = Math.min(1, innerWidth / 1300); };
addEventListener("resize", fit); fit();

let tick = 0;
setInterval(() => {
  if (SHOT || !S.farming || !S.speed) return;
  advance(.25 / S.speed);
  if (++tick % 2 === 0) {
    save();
    if (TAB === "live" && !$("#modal").innerHTML) $("#root").innerHTML = liveView();
    else if (TAB === "farms" && $("#hstatus")) $("#hstatus").innerHTML = `<span class="dot"></span><b>FARMING</b> · ${Object.keys(S.farming.farms).length} farms · ${usd(liveSum())} in`;
  }
}, 250);

render();
</script>
