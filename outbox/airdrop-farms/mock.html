<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airdrop Farmer</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e17; --deep:#06090f; --panel:#0d1520; --line:#1e3050;
  --text:#e6edf7; --muted:#a9b8cc; --dim:#7f93ad;
  --cyan:#00cfff; --green:#00ff88; --red:#ff4444; --blue:#3b82f6;
  --weave:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='42' height='24.25'><path d='M0 12.12 L7 0 H21 L28 12.12 L21 24.25 H7 Z M28 12.12 H42' fill='none' stroke='%2300ff88' stroke-width='1'/></svg>");
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 "JetBrains Mono",monospace;-webkit-font-smoothing:antialiased;position:relative;min-height:100vh}
/* the honeycomb weave of Agent Tournaments, behind the top of the page only */
body::before{content:"";position:absolute;inset:0 0 auto 0;height:900px;z-index:-1;pointer-events:none;opacity:.07;background-image:var(--weave);
  -webkit-mask-image:linear-gradient(to bottom,rgba(6,9,15,1) 0,rgba(6,9,15,1) 55%,rgba(6,9,15,0) 100%);mask-image:linear-gradient(to bottom,rgba(6,9,15,1) 0,rgba(6,9,15,1) 55%,rgba(6,9,15,0) 100%)}
body::after{content:"";position:absolute;inset:0 0 auto 0;height:900px;z-index:-2;pointer-events:none;
  background:radial-gradient(ellipse 760px 420px at 22% 260px,rgba(0,255,136,.07),transparent 70%),radial-gradient(ellipse 620px 380px at 80% 220px,rgba(0,207,255,.06),transparent 70%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.wrap{width:1240px;margin:0 auto;padding-bottom:70px}
.back{max-width:1440px;margin:0 auto;padding:16px 18px 0;color:var(--cyan);font-size:13px}

/* app header, as Agent Tournaments */
.app{display:flex;align-items:center;gap:26px;padding:18px 0 16px;border-bottom:1px solid rgba(30,48,80,.7)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:46px;height:46px;flex:none}
.brand .w{display:flex;flex-direction:column;line-height:1.05}
.brand .w span{color:var(--cyan);font-size:9.5px;letter-spacing:.32em;font-weight:600}
.brand .w b{color:var(--text);font-size:16px;font-weight:800;letter-spacing:.02em;margin-top:3px}
nav{display:flex;gap:6px}
nav a{text-decoration:none;padding:9px 14px;border-radius:9px;color:var(--dim);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;border:1px solid transparent}
nav a.on{color:var(--text);background:rgba(0,207,255,.10);border-color:rgba(0,207,255,.28)}
nav a i{font-style:normal;font-size:11px;color:var(--deep);background:var(--green);border-radius:9px;padding:1px 7px;font-weight:800}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.status b{color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(0,255,136,.18),0 0 10px rgba(0,255,136,.7);display:inline-block;flex:none}
.dot.idle{background:var(--dim);box-shadow:none}

/* surfaces: one radius scale (12 / 18 / 22), glass over the weave, a soft lift */
.glass{background:linear-gradient(180deg,rgba(13,21,32,.92),rgba(6,9,15,.94));border:1px solid rgba(30,48,80,.9);border-radius:22px;
  box-shadow:0 24px 60px rgba(6,9,15,.55),inset 0 1px 0 rgba(0,207,255,.06);backdrop-filter:blur(10px)}
.glow{border-color:rgba(0,255,136,.42);box-shadow:0 0 0 1px rgba(0,255,136,.06),0 0 36px rgba(0,255,136,.10),0 24px 60px rgba(6,9,15,.55),inset 0 1px 0 rgba(0,255,136,.10)}
.cap{color:var(--cyan);font-size:10.5px;font-weight:700;letter-spacing:.22em}
.lab{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.2em}
.chip{font-size:10px;font-weight:800;letter-spacing:.09em;border-radius:99px;padding:3px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.g{color:var(--green);background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.38)}
.chip.c{color:var(--cyan);background:rgba(0,207,255,.08);border:1px solid rgba(0,207,255,.32)}
.chip.f{color:var(--deep);background:var(--green)}
.chip.m{color:var(--muted);border:1px solid var(--line)}
.chip.s{color:var(--deep);background:var(--green);box-shadow:0 0 14px rgba(0,255,136,.45)}
.chip.lv{color:var(--green);background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.38)}
.chip.lv::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.go{background:var(--green);border:0;color:var(--deep);border-radius:14px;font:800 15px Inter,sans-serif;letter-spacing:.05em;
  box-shadow:0 0 28px rgba(0,255,136,.42),inset 0 -2px 0 rgba(6,9,15,.18);display:flex;align-items:center;justify-content:center;gap:10px;transition:box-shadow .2s,transform .1s}
.go:hover{box-shadow:0 0 40px rgba(0,255,136,.65),inset 0 -2px 0 rgba(6,9,15,.18)}
.go:active{transform:translateY(1px)}
.go svg{width:18px;height:18px;flex:none}
.ghost{background:transparent;border:1px solid rgba(0,207,255,.5);color:var(--cyan);padding:14px;border-radius:14px;font:700 14px Inter,sans-serif}

/* hero */
.hero{display:grid;grid-template-columns:1fr 470px;gap:52px;padding:40px 0 46px;align-items:start}
.pill{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border-radius:20px;border:1px solid rgba(0,255,136,.35);
  background:rgba(0,255,136,.07);color:var(--green);font-size:11.5px;font-weight:700;letter-spacing:.14em}
h1{font:56px/1.04 "Archivo Black",sans-serif;margin:22px 0 26px;letter-spacing:-.015em}
h1 em{font-style:normal;color:var(--green)}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.info div{background:linear-gradient(180deg,rgba(13,21,32,.9),rgba(6,9,15,.9));border:1px solid rgba(30,48,80,.9);border-radius:18px;padding:16px 18px}
.info small{display:block;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.2em}
.info b{display:block;font:30px/1.2 "Archivo Black",sans-serif;color:var(--green);margin:8px 0 6px}
.info b.c{color:var(--cyan)}
.info span{color:var(--muted);font-size:12px;line-height:1.5}
.steps{display:flex;align-items:center;gap:10px;margin-top:24px;color:var(--muted);font-size:13px}
.steps i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--cyan);color:var(--deep);display:inline-grid;place-items:center;font-weight:800;font-size:11px;margin-right:6px}
.steps em{font-style:normal;color:var(--dim)}
.sub{margin-top:18px;color:var(--muted);font-size:13px}
.sub b{color:var(--green)}

/* the plan card: one amount, the felt with one number, one button */
.plan{padding:22px 22px 20px}
.plan .top{display:flex;justify-content:space-between;align-items:center}
.bestok{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.08em}
.bestbtn{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.08em}
.bestbtn:hover{text-decoration:underline}
.bigin{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--deep);border:1px solid rgba(0,207,255,.42);border-radius:16px;
  padding:9px 10px 9px 18px;box-shadow:0 0 0 4px rgba(0,207,255,.06),inset 0 2px 10px rgba(6,9,15,.8)}
.bigin input{font:40px/1.15 "Archivo Black",sans-serif;color:var(--text);background:transparent;border:0;outline:0;flex:1;min-width:0;caret-color:var(--cyan)}
.token{display:inline-flex;align-items:center;gap:7px;background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.4);border-radius:99px;padding:6px 11px 6px 6px;font-weight:800;font-size:13px}
.token i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--text);display:grid;place-items:center;font-size:12px;font-weight:800}
.max{border:1px solid rgba(0,207,255,.5);color:var(--cyan);border-radius:10px;padding:9px 12px;font-weight:800;font-size:12px;letter-spacing:.06em}
.max:hover{background:rgba(0,207,255,.1)}
.bal{margin-top:8px;color:var(--dim);font-size:11.5px;display:flex;justify-content:space-between}
.bal b{color:var(--muted);font-weight:600}
/* the felt: Agent Tournaments' table cloth, here the plot the money grows on */
.felt{position:relative;margin-top:16px;height:178px;border-radius:999px;border:2px solid rgba(0,255,136,.55);
  background:radial-gradient(ellipse at 50% 40%,rgba(0,255,136,.10),rgba(6,9,15,.6) 70%);
  box-shadow:0 0 30px rgba(0,255,136,.16),inset 0 0 40px rgba(0,255,136,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.felt::before{content:"";position:absolute;inset:0;opacity:.14;background-image:var(--weave);
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(6,9,15,.1) 35%,rgba(6,9,15,1) 80%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(6,9,15,.1) 35%,rgba(6,9,15,1) 80%)}
.felt::after{content:"";position:absolute;inset:9% 6%;border-radius:999px;border:1px solid rgba(0,255,136,.16);pointer-events:none}
.felt small{position:relative;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.24em}
.felt b{position:relative;font:44px/1.15 "Archivo Black",sans-serif;color:var(--green);text-shadow:0 0 30px rgba(0,255,136,.45);margin:4px 0 2px;white-space:nowrap}
.felt span{position:relative;color:var(--cyan);font-size:12px;font-weight:600}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.boxes div{background:rgba(6,9,15,.7);border:1px solid rgba(30,48,80,.9);border-radius:12px;padding:9px 6px;text-align:center}
.boxes small{display:block;color:var(--dim);font-size:9.5px;font-weight:700;letter-spacing:.2em}
.boxes b{display:block;font:17px/1.35 "Archivo Black",sans-serif;color:var(--text);white-space:nowrap}
.boxes b.g{color:var(--green)}
.boxes b.c{color:var(--cyan)}
.plan .go{width:100%;margin-top:14px;padding:17px;font-size:17px}
.fine{margin-top:10px;text-align:center;color:var(--dim);font-size:11px}

/* farms */
.sechead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}
h2{font:30px/1.2 "Archivo Black",sans-serif;display:flex;align-items:center;gap:12px}
h2 i{font:800 12px Inter,sans-serif;font-style:normal;background:var(--cyan);color:var(--deep);border-radius:99px;padding:3px 9px}
.sechead p{color:var(--dim);font-size:12.5px;margin-top:4px}
.search{border:1px solid rgba(30,48,80,.9);background:rgba(13,21,32,.9);border-radius:12px;padding:11px 16px;color:var(--muted);font-size:13px;width:260px;outline:0}
.search::placeholder{color:var(--dim)}
.search:focus{border-color:rgba(0,207,255,.6)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.fcard{padding:18px 18px 16px;transition:border-color .2s,box-shadow .2s,opacity .2s}
.fcard.off{opacity:.62}
.fhead{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;flex:none;position:relative;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--text);overflow:hidden;
  box-shadow:0 0 0 2px rgba(30,48,80,.9),0 0 18px rgba(0,207,255,.12)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.o1{background:linear-gradient(135deg,var(--cyan),var(--blue))}
.o2{background:linear-gradient(135deg,var(--green),var(--cyan))}
.o3{background:linear-gradient(135deg,var(--blue),var(--cyan))}
.o4{background:linear-gradient(135deg,var(--dim),var(--line))}
.logo.o2,.logo.o1{color:var(--deep)}
.fname{min-width:0;flex:1}
.fname b{display:block;font:18px/1.2 "Archivo Black",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname .chip{margin-top:5px}
.tg{width:44px;height:26px;border-radius:14px;background:var(--line);position:relative;display:block;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:left .15s}
.tg.on{background:rgba(0,255,136,.25);box-shadow:inset 0 0 0 1px rgba(0,255,136,.6)}
.tg.on::after{left:21px;background:var(--green);box-shadow:0 0 10px rgba(0,255,136,.8)}
.dial{display:block;width:100%;height:auto;margin:6px 0 2px;touch-action:none}
.dial .knob{cursor:grab}
.dial text{font-family:"JetBrains Mono",monospace}
.dial text.num{font-family:"Archivo Black",sans-serif}
.fboxes{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.fboxes>div{background:rgba(6,9,15,.7);border:1px solid rgba(30,48,80,.9);border-radius:12px;padding:8px 6px 7px;text-align:center;min-width:0}
.fboxes small{display:block;color:var(--dim);font-size:9px;font-weight:700;letter-spacing:.18em;white-space:nowrap}
.fboxes b{display:block;font:15px/1.4 "Archivo Black",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fboxes b.g{color:var(--green)}
.fboxes b.c{color:var(--cyan)}
.fboxes .in{border-color:rgba(0,207,255,.45);background:rgba(0,207,255,.05)}
.fboxes .in:focus-within{border-color:rgba(0,207,255,.8);box-shadow:0 0 0 3px rgba(0,207,255,.1)}
.fboxes input{width:100%;background:transparent;border:0;outline:0;text-align:center;font:15px/1.4 "Archivo Black",sans-serif;color:var(--text)}
.fboxes button.use{font:15px/1.4 "Archivo Black",sans-serif;color:var(--cyan)}
.fboxes button.use:hover{text-decoration:underline}
.more{display:flex;justify-content:center;margin-top:22px;color:var(--dim);font-size:12.5px;gap:16px;align-items:center}
.more span.btn{color:var(--cyan);border:1px solid rgba(0,207,255,.45);border-radius:12px;padding:10px 20px;font-weight:700}

/* live farms */
.lhero{display:grid;grid-template-columns:1fr 410px;gap:18px;margin-top:28px}
.lhero>*{min-width:0}
.earn{padding:22px 24px 16px}
.earn .row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.earn .big{font:56px/1.05 "Archivo Black",sans-serif;color:var(--green);text-shadow:0 0 34px rgba(0,255,136,.4);margin-top:8px;white-space:nowrap}
.earn .today{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.earn .today em{font-style:normal;font-weight:800;color:var(--deep);background:var(--green);border-radius:99px;padding:3px 10px;box-shadow:0 0 16px rgba(0,255,136,.4)}
.earn .kpis{display:flex;gap:26px;text-align:right}
.earn .kpis b{display:block;font:22px/1.3 "Archivo Black",sans-serif}
.earn svg{display:block;width:100%;height:auto;margin-top:14px}
.ticker{display:flex;gap:20px;align-items:center;border-top:1px solid rgba(30,48,80,.8);margin-top:10px;padding-top:12px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,rgba(6,9,15,1) 88%,rgba(6,9,15,0));mask-image:linear-gradient(90deg,rgba(6,9,15,1) 88%,rgba(6,9,15,0))}
.ticker .ev{display:inline-flex;gap:7px;align-items:center;flex:none}
.ticker .ev i{width:7px;height:7px;border-radius:50%;flex:none}
.ticker .ev time{color:var(--dim)}
.ticker .ev b{color:var(--text);font-weight:600}
.ticker .ev em{font-style:normal;color:var(--green)}
.claimc{padding:22px 22px 20px;display:flex;flex-direction:column}
.claimc .felt{height:170px}
.claimc .go{margin-top:16px;padding:16px;font-size:16px}
.claimc .go[disabled]{background:var(--line);color:var(--dim);box-shadow:none;cursor:default}
.lcard{padding:18px 18px 16px;display:flex;flex-direction:column}
.lcard .stop{margin-left:auto;color:var(--dim);font:600 12px Inter,sans-serif;padding:6px 9px;border-radius:8px;align-self:flex-start}
.lcard .stop:hover{color:var(--red);background:rgba(255,68,68,.08)}
.lcard .claim{margin-top:10px;background:var(--green);color:var(--deep);font:800 13.5px Inter,sans-serif;border-radius:12px;padding:11px;box-shadow:0 0 18px rgba(0,255,136,.4)}
.lcard .noclaim{margin-top:10px;text-align:center;color:var(--dim);font-size:11.5px;padding:11px;border:1px dashed rgba(30,48,80,.9);border-radius:12px}
.emptylive{padding:54px 20px;text-align:center;color:var(--muted);font-size:14px;margin-top:28px}
.emptylive b{display:block;font:26px "Archivo Black",sans-serif;color:var(--text);margin-bottom:8px}
.emptylive .go{margin:20px auto 0;padding:14px 26px;display:inline-flex}
.float{position:fixed;z-index:70;font:24px "Archivo Black",sans-serif;color:var(--green);pointer-events:none;text-shadow:0 0 18px rgba(0,255,136,.75);animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translateY(-80px);opacity:0}}

/* confirmation, toast, test ribbon */
.ov{position:fixed;inset:0;background:rgba(6,9,15,.82);display:grid;place-items:center;z-index:50;backdrop-filter:blur(3px)}
.modal{width:520px;max-height:88vh;overflow:auto;padding:26px 28px}
.modal h3{font:26px "Archivo Black",sans-serif;margin:8px 0 0}
.modal .felt{height:150px}
.modal details{margin-top:14px;border-top:1px solid rgba(30,48,80,.9)}
.modal summary{cursor:pointer;color:var(--cyan);font-size:12.5px;padding:11px 0;list-style:none}
.modal summary::-webkit-details-marker{display:none}
.modal .ln{display:grid;grid-template-columns:1fr 90px 150px;gap:8px;padding:7px 0;border-bottom:1px solid rgba(30,48,80,.6);font-size:12.5px}
.modal .ln span:nth-child(2){text-align:right;font-weight:700}
.modal .ln span:nth-child(3){text-align:right;color:var(--green)}
.modal .ln small{color:var(--dim)}
.modal .kv{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid rgba(30,48,80,.9);font-size:12.5px;color:var(--muted)}
.modal .kv b{color:var(--text)}
.modal .lead{color:var(--dim);font-size:12px;margin-top:12px;line-height:1.55}
.modal .btns{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:18px}
.modal .btns .go{padding:15px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--panel);border:1px solid rgba(0,207,255,.5);color:var(--text);
  padding:11px 18px;border-radius:12px;font-size:13px;z-index:60;box-shadow:0 10px 34px rgba(6,9,15,.85)}
.ribbon{position:fixed;right:16px;top:6px;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;align-items:center}
.ribbon b{color:var(--cyan);letter-spacing:.12em;font-size:10.5px}
.ribbon button{border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--muted);font-size:11px}
.ribbon button.on{border-color:rgba(0,255,136,.55);color:var(--green)}

/* logo sheet */
.sheet{display:flex;gap:40px;align-items:center;justify-content:center;padding:60px 40px}
.sheet .bigl svg{width:300px;height:300px}
.sheet .wm{display:flex;align-items:center;gap:18px}
.sheet .wm svg{width:92px;height:92px}
.sheet .wm span{color:var(--cyan);font-size:19px;letter-spacing:.32em;font-weight:600;display:block}
.sheet .wm b{font-size:34px;font-weight:800;letter-spacing:.02em;display:block;margin-top:4px}
.sizes{display:flex;gap:22px;align-items:flex-end;margin-top:34px}
.sizes div{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--dim);font-size:11px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="afg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00cfff"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
    <linearGradient id="afh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff88"/><stop offset="1" stop-color="#00cfff"/></linearGradient>
    <filter id="afglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <!-- the dial -->

<script>
/* Airdrop Farmer: the design and a local test version in one page.
   ?shot=1 is the state the Build it Better pictures show (render.py), computed by the same code: the Farms tab
   before Start, and Live farms after a 23-day run of that same plan. Without it every control works on test data
   kept in this browser only. Nothing here talks to any server; the farm logos load from DefiLlama's icon CDN. */
const Q = new URLSearchParams(location.search);
const SHOT = Q.has("shot");
let TAB = Q.get("tab") || "farms";
const KEY = "airdrop-farmer-test-v3";
const H = 6;     // every estimate is over six months
const E = .7;    // a bigger wallet gets less per dollar: most airdrops flatten whales
const FIX = 5;   // gas to enter a farm, so the best split does not scatter $50 bets
const fmt = n => Math.round(n).toLocaleString("en-US");
const usd = n => "$" + fmt(n);
const r10 = n => Math.round(n / 10) * 10;
const money = n => n < 100 ? "$" + Math.round(n) : usd(r10(n)); // small amounts to the dollar
const rng = (lo, hi, sep = " – ") => Math.round(lo) === Math.round(hi) ? money(lo) : money(lo) + sep + money(hi);
const kM = v => v >= 1e9 ? +(v / 1e9).toFixed(1) + "B" : Math.round(v / 1e6) + "M";
const logoSvg = () => `<svg><use href="#logo"/></svg>`;
const BOLT = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 14h6.5L9.5 22 20 9.5h-6.6z"/></svg>`;
const $ = s => document.querySelector(s);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = SHOT ? mulberry32(7) : Math.random; // the pictures come out the same every run
const ICON = s => `https://icons.llamao.fi/icons/protocols/${s}?w=96`;

/* ---------- farms: the examples from the live points programs, then test data ---------- */
// ref: the amount lo/hi (est. airdrop over 6 months) are given at; cf: gas per 6 months; cp: fees and funding per
// $1,000 per 6 months; ppw: points a week at ref; chip: the one thing a degen needs to know about the farm.
const FARMS = [
  {id: "arcus", o: "o1", ini: "AR", icon: "arcus-perps", name: "Arcus", chip: ["TOKEN CONFIRMED", "g"], how: "Deposit", season: "Season 1", ref: 1000, lo: 260, hi: 940, cf: 1, cp: 0, ppw: 1840, pool: .05, fdv: 250e6, live: {pts: 1}},
  {id: "variational", o: "o2", ini: "VA", icon: "variational", name: "Variational", chip: ["TGE Q4 2026", "g"], how: "Trade", season: "TGE Q4 2026", ref: 800, lo: 180, hi: 720, cf: 0, cp: 42.5, ppw: 420, pool: .32, fdv: 60e6, live: {pts: 1, tge: 30, tk: "VAR", px: .45}},
  {id: "polymarket", o: "o3", ini: "PM", icon: "polymarket-international", name: "Polymarket", chip: ["PAYS DAILY", "c"], how: "LP", season: "LP rewards", ref: 600, lo: 40, hi: 310, cf: 0, cp: 10, ppw: 0, pool: .05, fdv: 5e9, live: {daily: .0004, tk: "pUSD", px: 1}},
  {id: "lighter", o: "o1", ini: "LI", icon: "lighter-perps", name: "Lighter", chip: ["PAYS WEEKLY", "c"], how: "Trade", season: "11M LIT pool", ref: 500, lo: 90, hi: 260, cf: 0, cp: 44, ppw: 0, pool: .011, fdv: 1.6e9, live: {weekly: .007, tk: "LIT", px: 1.92}},
  {id: "risex", o: "o2", ini: "RX", icon: "risex", name: "RISEx", chip: ["POINTS LIVE", "c"], how: "Trade", season: "Season 1", ref: 400, lo: 70, hi: 410, cf: 0, cp: 42.5, ppw: 2730, pool: .08, fdv: 150e6, live: {pts: 1}},
  {id: "nado", o: "o3", ini: "NA", icon: "nado-perps", name: "Nado", chip: ["POINTS → INK", "g"], how: "Trade", season: "Season 2", ref: 400, lo: 60, hi: 300, cf: 0, cp: 40, ppw: 4270, pool: .04, fdv: 300e6, live: {pts: 1, tge: 45, tk: "INK", px: .12}},
  {id: "n1", o: "o4", ini: "N1", icon: "n1-exchange-perps", name: "N1", chip: ["POINTS LIVE", "c"], how: "Trade", season: "Season 1", ref: 300, lo: 30, hi: 250, cf: 0, cp: 43, ppw: 2400, pool: .06, fdv: 100e6, live: {pts: 1}},
  {id: "ostium", o: "o1", ini: "OS", icon: "ostium", name: "Ostium", chip: ["POINTS LIVE", "c"], how: "Trade", season: "Season 2", ref: 300, lo: 40, hi: 190, cf: 0, cp: 40, ppw: 980, pool: .05, fdv: 120e6, live: {pts: 1, cap0: .62, capDay: .0083}},
  {id: "base", o: "o3", ini: "BA", icon: "base-app", name: "Base", chip: ["SPECULATIVE", "m"], how: "Bridge", season: "no points program", lo: null, cf: 3, cp: 0, why: "no points program yet", live: {txs: 1.5}},
  {id: "pacifica", o: "o2", ini: "PA", icon: "pacifica-perps", name: "Pacifica", chip: ["POINTS LIVE", "c"], how: "Trade", season: "Season 1", ref: 250, lo: 20, hi: 140, cf: 0, cp: 40, ppw: 630, pool: .05, fdv: 80e6, live: {pts: 1}},
  {id: "arc", o: "o1", ini: "AC", name: "Arc Testnet", chip: ["FREE", "f"], how: "Testnet", season: "testnet", lo: null, free: 1, why: "no points rate published", live: {txs: 3}},
  {id: "axis", o: "o2", ini: "AX", name: "Axis Robotics", chip: ["FREE", "f"], how: "Tasks", season: "2-week epochs", lo: null, free: 1, why: "no points rate published", live: {tasks: 1, epoch: 14}},
];
// not listed: a farm with nothing to farm now (Extended, its points cap used up; Hyperliquid, no points phase)
if (!SHOT) { // test farms, so the list is long enough to try search and big amounts
  [["Lending", "Deposit", 0, [["Alpha", 400, .26], ["Beta", 600, .22], ["Gamma", 500, .19], ["Delta", 800, .16]]],
   ["Vault", "LP", 8, [["Alpha", 500, .24], ["Beta", 700, .2], ["Gamma", 400, .18], ["Delta", 900, .14]]],
   ["Chain", "Bridge", 4, [["Alpha", 300, .21], ["Beta", 400, .17], ["Gamma", 250, .15]]],
   ["Predict", "LP", 10, [["Alpha", 300, .2]]],
   ["Perp", "Trade", 40, [["Alpha", 400, .27], ["Beta", 300, .22]]],
  ].forEach(([label, how, cp, list], j) => list.forEach(([gr, ref, eff], i) => {
    const mid = (eff + cp / 1000) * ref;
    FARMS.push({id: (label + gr).toLowerCase(), o: ["o1", "o2", "o3", "o4"][(i + j) % 4], ini: label[0] + gr[0], name: label + " " + gr,
      chip: ["POINTS LIVE", "c"], how, season: "test data", ref, lo: r10(mid * .45), hi: r10(mid * 1.55), cf: cp ? 0 : 1, cp,
      ppw: ref * 3, pool: .05, fdv: 200e6, live: {pts: 1}, test: 1});
  }));
  [["Testnet Alpha", "Testnet"], ["Testnet Beta", "Testnet"], ["Tasks Alpha", "Tasks"]].forEach(([name, how], i) =>
    FARMS.push({id: name.replace(" ", "").toLowerCase(), o: ["o2", "o3", "o1"][i], ini: name[0] + name.split(" ")[1][0], name, chip: ["FREE", "f"],
      how, season: "test data", lo: null, free: 1, why: "no points rate published", live: how === "Tasks" ? {tasks: 1, epoch: 14} : {txs: 2}, test: 1}));
}
const BY = Object.fromEntries(FARMS.map(f => [f.id, f]));

/* ---------- the maths ---------- */
const curve = (f, x) => Math.pow(Math.max(0, x) / f.ref, E);
function est(f, x, months = H) {
  if (f.lo == null || x <= 0) return null;
  const k = curve(f, x) * months / 6;
  return {lo: f.lo * k, hi: f.hi * k};
}
const cost = (f, x, months = H) => f.free || x <= 0 ? 0 : (f.cf + (f.cp || 0) * x / 1000) * months / 6;
// what a farm brings in six months: the airdrop, plus what it pays out daily on the way (Polymarket's LP rewards)
function estPlan(f, x) {
  const e = est(f, x);
  if (!e) return null;
  const p = f.live.daily ? f.live.daily * x * 180 : 0;
  return {lo: e.lo + p, hi: e.hi + p};
}
const midAt = (f, x) => { const e = estPlan(f, x); return e ? (e.lo + e.hi) / 2 : 0; };
const weekly = (f, x) => midAt(f, x) / 180 * 7 / f.live.px; // a weekly payer pays its estimate out week by week
const ptsWeek = (f, x) => (f.ppw || 0) * x / f.ref; // points are linear in what is deposited
const eff = f => f.lo == null ? -1 : midAt(f, f.ref) / f.ref - (f.cp || 0) / 1000;
// best first: estimated farms by what a dollar earns, then free ones, then the rest
const rank = f => f.lo != null ? 1 - eff(f) : f.free ? 2 : 3;
// the best split of an amount: a first ticket, then a step at a time, always to the farm where the next dollar
// earns most net of costs and gas, at most 20% of the amount in one farm; a farm with no estimate gets nothing
function recommend(B) {
  const a = {}, ok = FARMS.filter(f => f.lo != null && !f.free);
  ok.forEach(f => a[f.id] = 0);
  const step = Math.max(10, Math.ceil(B / 500 / 10) * 10), t0 = Math.max(step, Math.round(B * .05 / 10) * 10);
  let left = B;
  while (left >= step) {
    let best = null, bm = .05, add = 0;
    for (const f of ok) {
      const d = a[f.id] ? step : t0;
      if (d > left || a[f.id] + d > B * .2) continue;
      const m = (midAt(f, a[f.id] + d) - midAt(f, a[f.id]) - (a[f.id] ? 0 : FIX)) / d - (f.cp || 0) / 1000;
      if (m > bm) { bm = m; best = f; add = d; }
    }
    if (!best) break;
    a[best.id] += add; left -= add;
  }
  for (const id in a) a[id] = Math.round(a[id] / 10) * 10;
  return a;
}

/* ---------- state ---------- */
const DEFAULT = () => ({budget: 5000, balance: 7240, amt: {}, on: {}, last: {}, custom: false, q: "", farming: null, speed: 4});
let S = DEFAULT();
if (!SHOT) try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) S = Object.assign(DEFAULT(), s); } catch (e) {}
const save = () => { if (SHOT) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let REC = recommend(S.budget);
const rec = f => f.free ? 0 : (REC[f.id] || 0);
const amtOf = id => S.amt[id] || 0;
const planSum = () => FARMS.reduce((s, f) => s + (S.on[f.id] && !f.free ? amtOf(f.id) : 0), 0);
const liveSum = () => S.farming ? Object.values(S.farming.farms).reduce((s, l) => s + l.amount, 0) : 0;
const maxAmt = () => Math.floor(S.balance + liveSum()); // every farm can take up to all your USDC
// the list starts as the best split of the amount and follows it while you type
function applyBest() {
  FARMS.forEach(f => { const r = rec(f); S.amt[f.id] = f.free ? 0 : r; S.on[f.id] = f.free ? true : r > 0; });
  S.custom = false;
}
if (!S.custom) applyBest();

function toast(t) {
  const el = $("#toast");
  el.innerHTML = `<div class="toast">${t}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.innerHTML = "", 2600);
}
function floatUp(x, y, text) {
  const el = document.createElement("div");
  el.className = "float"; el.textContent = text;
  el.style.left = x - 24 + "px"; el.style.top = y - 34 + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}
const logo = f => `<span class="logo ${f.o}">${f.icon ? `<img src="${ICON(f.icon)}" alt="" onerror="this.remove()">` : ""}${f.icon ? "" : f.ini}</span>`;

/* ---------- header ---------- */
function header() {
  const n = S.farming ? Object.keys(S.farming.farms).length : 0;
  const status = n ? `<span class="dot"></span><b>FARMING</b> · ${n} farm${n > 1 ? "s" : ""} · ${usd(liveSum())} in` : `<span class="dot idle"></span><b>NOT FARMING</b>`;
  return `<header class="app">
    <a class="brand">${logoSvg()}<div class="w"><span>AIRDROP</span><b>FARMER</b></div></a>
    <nav><a href="?tab=farms" data-tab="farms" class="${TAB === "farms" ? "on" : ""}">Farms</a><a href="?tab=live" data-tab="live" class="${TAB === "live" ? "on" : ""}">Live farms${n ? ` <i>${n}</i>` : ""}</a></nav>
    <div class="status" id="hstatus">${status}</div>
  </header>`;
}

/* ---------- the dial: a 270° ring, the amount on a square-root scale so small and big bets both fit ---------- */
const D = {w: 364, h: 214, cx: 182, cy: 112, r: 88, a0: 135, sweep: 270};
const frac = v => Math.sqrt(Math.min(1, Math.max(0, v) / Math.max(1, maxAmt())));
const pt = t => { const a = (D.a0 + D.sweep * t) * Math.PI / 180; return [D.cx + D.r * Math.cos(a), D.cy + D.r * Math.sin(a)]; };
function arcPath(t0, t1) {
  if (t1 - t0 < .0005) return "";
  const [x0, y0] = pt(t0), [x1, y1] = pt(t1), big = (t1 - t0) * D.sweep > 180 ? 1 : 0;
  return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${D.r} ${D.r} 0 ${big} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
function feltSvg(dim) {
  return `<circle cx="${D.cx}" cy="${D.cy}" r="${D.r - 16}" fill="#06090f"/>
    <circle cx="${D.cx}" cy="${D.cy}" r="${D.r - 16}" fill="url(#hexp)" opacity="${dim ? .12 : .3}"/>
    <circle cx="${D.cx}" cy="${D.cy}" r="${D.r - 16}" fill="url(#feltfade)"/>
    <circle cx="${D.cx}" cy="${D.cy}" r="${D.r - 16}" fill="url(#feltglow)"/>
    <circle cx="${D.cx}" cy="${D.cy}" r="${D.r - 24}" fill="none" stroke="#00ff88" stroke-opacity="${dim ? .06 : .14}"/>`;
}
const fitNum = s => s.length <= 9 ? 27 : s.length <= 11 ? 24 : s.length <= 13 ? 21 : 18;
// a big number with a haze behind it: the glow without blurring the digits
const bigText = (txt, size, color, y = D.cy + 12) =>
  (color === "#00ff88" ? `<text class="num" x="${D.cx}" y="${y}" text-anchor="middle" fill="#00ff88" font-size="${size}" opacity=".55" filter="url(#haze)">${txt}</text>` : "")
  + `<text class="num" x="${D.cx}" y="${y}" text-anchor="middle" fill="${color}" font-size="${size}">${txt}</text>`;
// the gauge's scale: faint ticks round the ring, every ninth a little longer
function ticks() {
  let s = "";
  for (let i = 0; i <= 27; i++) {
    const a = (D.a0 + D.sweep * i / 27) * Math.PI / 180, r1 = D.r + 13, r2 = D.r + (i % 9 ? 17 : 21);
    s += `<line x1="${(D.cx + r1 * Math.cos(a)).toFixed(1)}" y1="${(D.cy + r1 * Math.sin(a)).toFixed(1)}" x2="${(D.cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(D.cy + r2 * Math.sin(a)).toFixed(1)}" stroke="#7f93ad" stroke-opacity="${i % 9 ? .22 : .4}" stroke-width="1.5" stroke-linecap="round"/>`;
  }
  return s;
}
// what the dial shows in its middle and on its ring
function dialSvg(f, mode) {
  const on = !!S.on[f.id], a = on ? amtOf(f.id) : 0, r = rec(f);
  let ring = "", center;
  if (f.free) {
    ring = `<path d="${arcPath(0, 1)}" stroke="#00ff88" stroke-opacity="${on ? .55 : .2}" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="2 9"/>`;
    center = `<text x="${D.cx}" y="${D.cy - 18}" text-anchor="middle" fill="#7f93ad" font-size="9.5" font-weight="700" letter-spacing="2.2">NO USDC NEEDED</text>
      ${bigText("FREE", 32, on ? "#00ff88" : "#7f93ad", D.cy + 14)}
      <text x="${D.cx}" y="${D.cy + 34}" text-anchor="middle" fill="#00cfff" font-size="10.5" font-weight="600">no estimate</text>`;
  } else {
    const t = frac(a), tr = r ? frac(r) : null, e = estPlan(f, a), shown = e ? null : estPlan(f, r || f.ref);
    ring = `<path d="${arcPath(0, 1)}" stroke="#1e3050" stroke-width="10" stroke-linecap="round" fill="none"/>
      ${t > 0 ? `<path class="fillarc" d="${arcPath(0, t)}" stroke="url(#arc)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#soft)"/>` : ""}
      ${tr != null ? (() => { const [x, y] = pt(tr), ang = D.a0 + D.sweep * tr; return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang + 90})"><path d="M0 -12 L5 -20 L-5 -20 Z" fill="#00cfff"/></g>`; })() : ""}
      ${(() => { const [x, y] = pt(t); return `<g class="knob"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="#e6edf7" stroke="${on ? "#00ff88" : "#7f93ad"}" stroke-width="4" ${on ? 'filter="url(#soft)"' : ""}/></g>`; })()}`;
    const txt = f.lo == null ? "no estimate" : e ? rng(e.lo, e.hi, "–") : rng(shown.lo, shown.hi, "–");
    const col = f.lo == null || !e ? "#7f93ad" : "#00ff88";
    center = `<text x="${D.cx}" y="${D.cy - 18}" text-anchor="middle" fill="#7f93ad" font-size="9.5" font-weight="700" letter-spacing="2.2">EST. AIRDROP</text>
      ${f.lo == null ? `<text x="${D.cx}" y="${D.cy + 10}" text-anchor="middle" fill="#7f93ad" font-size="15">no estimate</text>` : bigText(txt, fitNum(txt), col)}
      <text x="${D.cx}" y="${D.cy + 34}" text-anchor="middle" fill="#00cfff" font-size="10.5" font-weight="600">${f.lo == null ? f.why : e ? "in 6 months" : `if ${usd(r || f.ref)}`}</text>`;
  }
  return `<svg class="dial" viewBox="0 0 ${D.w} ${D.h}" data-dial="${f.id}">${ticks()}${feltSvg(!on)}${ring}${center}</svg>`;
}

/* ---------- Farms tab ---------- */
function farmsView() {
  const N = SHOT ? 412 : FARMS.length;
  return `<div class="back">← Back</div><div class="wrap">${header()}
  <section class="hero">
    <div>
      <div class="pill"><span class="dot"></span>${N} FARMS · ONE DEPOSIT</div>
      <h1>Deploy USDC.<br>Farm every airdrop.<br><em>Cymetica does the rest.</em></h1>
      <div class="info">
        <div><small>FARMS</small><b>${N}</b><span>Every live points program, testnet and task.</span></div>
        <div><small>THE SPLIT</small><b class="c">Auto</b><span>Your USDC goes where a dollar farms most.</span></div>
        <div><small>WALLETS</small><b>1</b><span>Your USDC. No sybil. Every farm's rules kept.</span></div>
      </div>
      <div class="steps"><span><i>1</i>type an amount</span><em>›</em><span><i>2</i>start farming</span><em>›</em><span><i>3</i>claim</span></div>
      <div class="sub">Chatbots explain airdrops. <b>Cymetica farms them.</b></div>
    </div>
    <div class="glass glow plan">
      <div class="top"><span class="cap">YOUR FARM PLAN</span><span id="bestslot"></span></div>
      <div class="bigin"><input id="budget" inputmode="decimal" autocomplete="off" value="${fmt(S.budget)}" aria-label="USDC to farm"><span class="token"><i>$</i>USDC</span><button class="max" data-act="max">MAX</button></div>

// one card's moving parts, without redrawing the input being typed in
function updateCard(id) {

function planTotals() {
  let lo = 0, hi = 0, n = 0, a = 0, c = 0, tok = 0;
  FARMS.forEach(f => {
    if (!S.on[f.id]) return;
    const x = f.free ? 0 : amtOf(f.id), e = estPlan(f, x);
    n++; a += x; c += Math.round(cost(f, x));
    if (f.chip[1] === "g") tok++;

// the big number counts to its new value
function tweenRange(el, lo, hi) {

  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 420), e = 1 - Math.pow(1 - k, 3);
    el.textContent = rng(from[0] + (lo - from[0]) * e, from[1] + (hi - from[1]) * e);

// set one farm's amount by hand: anything up to all your USDC. The plan's total follows; once all of it is in

let moved = {usd: 0, n: new Set()};
function setAmt(id, v, quiet) {
  const f = BY[id];

  v = Math.max(0, Math.round(v || 0));
  let over = planSum() - (S.on[id] ? amtOf(id) : 0) + v - maxAmt();
  if (over > 0) {
    const others = FARMS.filter(g => g.id !== id && S.on[g.id] && !g.free && amtOf(g.id) > 0).sort((a, b) => rank(b) - rank(a));
    for (const g of others) {
      if (over <= 0) break;
      const take = Math.min(amtOf(g.id), over);
      S.amt[g.id] -= take; if (!S.amt[g.id]) S.on[g.id] = false;
      over -= take; moved.usd += take; moved.n.add(g.id);
      updateCard(g.id);
    }
    if (over > 0) { v -= over; if (!quiet) toast(`That is all your USDC: ${usd(maxAmt())}`); }
  }
  S.amt[id] = v; S.on[id] = v > 0; S.custom = true;
  if (v > 0) S.last[id] = v;
  S.budget = planSum();
  updateCard(id); updatePlan(); save();
  if (!quiet) tellMoved(f);
}
function tellMoved(f) {

  moved = {usd: 0, n: new Set()};
}
// typing an amount means "split it for me"; on Enter, leaving the field or MAX it is held to the balance
function setBudget(B, commit) {
  B = Math.max(0, Math.round(B || 0));
  const most = maxAmt();
  if (commit && B > most) { B = most; toast(`Only ${usd(most)} USDC in your balance`); }
  S.budget = B; REC = recommend(B); applyBest();
  renderList(); updatePlan(); save();
}

/* ---------- start farming ---------- */
const FIRST = {Deposit: (n, f) => `Deposited ${n} into <b>${f}</b>`, Trade: (n, f) => `<b>${f}</b>: hedged positions opened, ${n}`,
  LP: (n, f) => `Quoting liquidity on <b>${f}</b> with ${n}`, Bridge: (n, f) => `Bridged ${n} to <b>${f}</b>`,

const planLines = () => FARMS.filter(f => S.on[f.id]).sort((a, b) => rank(a) - rank(b)).map(f => ({f, a: f.free ? 0 : amtOf(f.id), e: estPlan(f, f.free ? 0 : amtOf(f.id))}));
function openStart() {
  const L = planLines();

  $("#modal").innerHTML = `<div class="ov" data-act="close"><div class="glass glow modal">
    <div class="cap">${S.farming ? "UPDATE YOUR FARMS" : "START FARMING"}</div>

    <details><summary>See the ${t.n} farms ▾</summary>
      ${L.map(l => `<div class="ln"><span>${l.f.name}</span><span>${l.f.free ? "free" : usd(l.a)}</span><span>${l.e ? rng(l.e.lo, l.e.hi) : `<small>no estimate</small>`}</span></div>`).join("")}
    </details>
    <div class="kv"><span>Est. cost (fees, funding, gas)</span><b>${usd(t.c)}</b></div>
    <div class="kv"><span>Cymetica fee</span><b style="color:var(--dim)">set by Cymetica</b></div>
    <div class="lead">Cymetica's agent farms from one wallet with your USDC: deposits, hedged trades, quotes, bridges, points, claims.</div>
    <div class="btns"><button class="ghost" data-act="close">Cancel</button><button class="go" data-act="confirm">${BOLT}${S.farming ? "UPDATE FARMS" : "START FARMING"}</button></div>
    ${SHOT ? "" : `<div class="fine">Test data: no USDC moves, nothing leaves this page.</div>`}
  </div></div>`;
}
function feed(txt, c = "cyan", d) {
  const F = S.farming;
  F.feed.unshift({d: d == null ? F.day : d, txt, c});
  F.feed.sort((p, q) => q.d - p.d);
  F.feed.length = Math.min(F.feed.length, 40);
}
function startFarms() {
  if (!S.farming) S.farming = {day: 0, farms: {}, hist: [{d: 0, lo: 0, hi: 0}], feed: [], claimed: 0, cost: 0, claims: []};
  const F = S.farming;
  planLines().forEach(({f, a}) => {
    const l = F.farms[f.id];
    if (!l) {
      F.farms[f.id] = {amount: a, start: F.day, pts: 0, lo: 0, hi: 0, cost: 0, n: 0, claim: 0, week: 0, got: 0, cap: f.live.cap0 || 0, tge: f.live.tge ? F.day + f.live.tge : null, done: false};
      S.balance -= a;
      feed(FIRST[f.how](usd(a), f.name), "cyan");
    } else if (l.amount !== a) {
      S.balance -= a - l.amount;
      feed(`<b>${f.name}</b>: ${a > l.amount ? "added" : "withdrew"} ${usd(Math.abs(a - l.amount))}`, "cyan");
      l.amount = a;
    }
  });
  for (const id of Object.keys(F.farms)) if (!S.on[id]) stopFarm(id, true);
  if (S.farming && !Object.keys(S.farming.farms).length) S.farming = null;
}
function confirmStart() { startFarms(); $("#modal").innerHTML = ""; save(); go("live"); }
const tokAmt = (f, n) => f.live.tge ? fmt(n) : f.live.weekly ? n.toFixed(1) : n.toFixed(2);
const pendUsd = (f, l) => (l.claim + (l.week || 0)) * (f.live.px || 0);
const claimable = (f, l) => f.live.daily ? l.claim >= 1 : l.claim > 0;
function claimFarm(id) {
  const F = S.farming, l = F && F.farms[id], f = BY[id];
  if (!l || !claimable(f, l)) return 0;
  const v = l.claim * f.live.px;
  l.got += v; F.claimed += v; F.claims.push(F.day);
  feed(`Claimed <em>${tokAmt(f, l.claim)} ${f.live.tk}</em> (${money(v)}) from <b>${f.name}</b>`, "green");
  if (f.live.tge) l.done = true;
  l.claim = 0;
  return v;
}
function stopFarm(id, quiet) {
  const F = S.farming, l = F && F.farms[id];
  if (!l) return;
  if (l.claim > 0) claimFarm(id);
  const back = Math.max(0, l.amount - l.cost);
  S.balance += back;
  delete F.farms[id];
  S.on[id] = false; S.amt[id] = 0; S.custom = true;
  feed(`<b>${BY[id].name}</b> stopped: ${usd(back)} back to your balance`, "red");
  if (!Object.keys(F.farms).length) { S.farming = null; if (!quiet) toast("All farms stopped"); }
  else if (!quiet) toast(`${BY[id].name} stopped · ${usd(back)} back`);
  S.budget = planSum();
}

/* ---------- the clock ---------- */
function advance(dd) {
  const F = S.farming;
  const d0 = F.day; F.day += dd;
  for (const [id, l] of Object.entries(F.farms)) {
    const f = BY[id], L = f.live;
    if (l.done) continue;
    const dc = cost(f, l.amount) / 180 * dd; l.cost += dc; F.cost += dc;
    let earning = !L.wait;
    if (L.cap0 != null) {
      const before = l.cap; l.cap = Math.min(1, l.cap + L.capDay * dd);
      if (before < .8 && l.cap >= .8) feed(`<b>${f.name}</b> ${Math.round(l.cap * 100)}% of its points cap used`, "red");
      if (before < 1 && l.cap >= 1) feed(`<b>${f.name}</b> points cap reached: stop it to free ${usd(l.amount)}`, "red");
      if (l.cap >= 1) earning = false;
    }
    if (earning && (L.pts || L.daily)) {
      if (L.pts) l.pts += ptsWeek(f, l.amount) / 7 * dd;
      const e = est(f, l.amount); l.lo += e.lo / 180 * dd; l.hi += e.hi / 180 * dd;
    }
    if (L.daily) l.claim += L.daily * l.amount * dd;
    if (L.weekly) l.week += weekly(f, l.amount) / 7 * dd;
    if (L.txs || L.tasks) l.n += (L.txs || L.tasks) * dd;
  }
  for (let d = Math.floor(d0) + 1; d <= Math.floor(F.day); d++) {
    let gained = 0, k = 0;
    const log = (txt, c) => feed(txt, c, d - .46 + rnd() * .45); // late in the day just ended
    for (const [id, l] of Object.entries(F.farms)) {
      const f = BY[id], L = f.live;
      if (L.pts && !l.done && (L.cap0 == null || l.cap < 1)) { gained += ptsWeek(f, l.amount) / 7; k++; }
      if (L.weekly && (d - Math.ceil(l.start)) % 7 === 0) { l.claim += l.week; log(`<b>${f.name}</b> paid <em>${l.week.toFixed(1)} ${L.tk}</em>, ready to claim`, "green"); l.week = 0; }
      if (L.epoch && (d - Math.ceil(l.start)) % L.epoch === 0) log(`<b>${f.name}</b> epoch closed: ${Math.round(l.n)} tasks counted`, "blue");
      if (l.tge != null && !l.done && !l.claim && d >= l.tge) {
        const seed = (id.length * 97 + d * 13) % 100 / 100, v = l.lo + (l.hi - l.lo) * (.25 + .5 * seed);
        l.claim = v / L.px; l.lo = l.hi = 0;
        log(`<b>${L.tk}</b> launched: <em>${fmt(l.claim)} ${L.tk}</em> (${money(v)}) ready to claim`, "green");
      }
      if (f.how === "Trade" && L.pts && d % 3 === 0 && rnd() < .5) log(`<b>${f.name}</b> hedge rebalanced`, "cyan");
      if (L.daily && d % 2 === 0) log(`<b>${f.name}</b> quotes refreshed on ${4 + d % 5} markets`, "cyan");
    }
    if (k) log(`Points synced <em>+${fmt(gained)}</em> on ${k} farm${k > 1 ? "s" : ""}`, "green");
    F.hist.push({d, ...totals()});
  }
}
function totals() {
  const F = S.farming; let lo = 0, hi = 0;
  for (const [id, l] of Object.entries(F.farms)) { const p = pendUsd(BY[id], l); lo += l.lo + p; hi += l.hi + p; }
  return {lo: lo + F.claimed, hi: hi + F.claimed};
}
// where the running plan lands at six months: what is earned plus the plan's estimate for the days left,
// so on day 0 it is exactly the number the Farms tab showed at Start
function projection() {
  const F = S.farming, T = totals(); let lo = T.lo, hi = T.hi;
  for (const [id, l] of Object.entries(F.farms)) {
    const f = BY[id], e = estPlan(f, l.amount), left = Math.max(0, 180 - (F.day - l.start)) / 180;
    if (e && !l.done && !(f.live.cap0 != null && l.cap >= 1)) { lo += e.lo * left; hi += e.hi * left; }
  }
  return {lo, hi};
}

/* ---------- Live farms tab ---------- */
function ago(d) {
  const m = Math.round((S.farming.day - d) * 1440);
  return m < 2 ? "just now" : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
}
function liveStatus(f, l) {
  const L = f.live, F = S.farming;
  if (l.done) return ["m", "CLAIMED"];
  if (claimable(f, l)) return ["s", "CLAIMABLE"];
  if (L.cap0 != null && l.cap >= 1) return ["m", "CAP REACHED"];
  if (L.cap0 != null && l.cap >= .8) return ["c", `CAP ${Math.round(l.cap * 100)}% USED`];
  if (L.tge && l.tge - F.day <= 10) return ["c", `TGE IN ${Math.max(1, Math.ceil(l.tge - F.day))} D`];

}
// a live farm's ring: how far into its six months it is, what it has earned in the middle

function liveChart(F, P) {
  const W = 760, Hh = 168, L = 2, R = 2, T = 26, B = 22;
  const hist = F.hist.concat([{d: F.day, ...totals()}]), now = hist[hist.length - 1];
  const top = Math.max(50, P.hi) * 1.08;
  const x = d => L + Math.min(180, d) / 180 * (W - L - R), y = v => Hh - B - v / top * (Hh - T - B);
  const mid = p => (p.lo + p.hi) / 2;
  const area = `M${x(0)} ${y(0)} ` + hist.map(p => `L${x(p.d).toFixed(1)} ${y(mid(p)).toFixed(1)}`).join(" ") + ` L${x(now.d).toFixed(1)} ${y(0)} Z`;
  const line = hist.map((p, i) => `${i ? "L" : "M"}${x(p.d).toFixed(1)} ${y(mid(p)).toFixed(1)}`).join(" ");
  const pm = (P.lo + P.hi) / 2;
  const band = `M${x(now.d)} ${y(now.hi)} L${x(180)} ${y(P.hi)} L${x(180)} ${y(P.lo)} L${x(now.d)} ${y(now.lo)} Z`;
  const nx = x(now.d), right = nx > W - 200;
  return `<svg viewBox="0 0 ${W} ${Hh}">
    <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="#1e3050"/>
    <path d="${band}" fill="url(#projfill)"/>
    <path d="M${nx} ${y(mid(now))} L${x(180)} ${y(pm)}" stroke="#00cfff" stroke-width="2" stroke-dasharray="5 6" fill="none" stroke-opacity=".8"/>
    <path d="${area}" fill="url(#earnfill)"/>
    <path d="${line}" stroke="#00ff88" stroke-width="3" fill="none" filter="url(#soft)"/>
    ${F.claims.map(d => `<circle cx="${x(d)}" cy="${y(mid(hist.reduce((b, p) => Math.abs(p.d - d) < Math.abs(b.d - d) ? p : b, hist[0])))}" r="3.5" fill="#e6edf7"/>`).join("")}
    <circle cx="${nx}" cy="${y(mid(now))}" r="12" fill="#00ff88" fill-opacity=".18"/><circle cx="${nx}" cy="${y(mid(now))}" r="5.5" fill="#00ff88" filter="url(#soft)"/>
    <circle cx="${x(180)}" cy="${y(pm)}" r="5" fill="#06090f" stroke="#00cfff" stroke-width="2"/>
    <text x="${x(180) - 4}" y="${Math.max(12, y(P.hi) - 8)}" text-anchor="end" fill="#00cfff" font-size="12" font-weight="700">6 months ≈ ${rng(P.lo, P.hi)}</text>
    <text x="${L}" y="${Hh - 5}" fill="#7f93ad" font-size="11">${SHOT ? "28 Sep" : "start"}</text>
    ${nx > 90 ? `<text x="${nx + (right ? -8 : 8)}" y="${Hh - 5}" text-anchor="${right ? "end" : "start"}" fill="#00ff88" font-size="11" font-weight="700">now</text>` : ""}
    <text x="${W - R}" y="${Hh - 5}" text-anchor="end" fill="#7f93ad" font-size="11">${SHOT ? "27 Mar" : "6 months"}</text>
  </svg>`;
}
function liveView() {
  const F = S.farming;
  if (!F) return `<div class="back">← Back</div><div class="wrap">${header()}
    <div class="glass emptylive"><b>Nothing farming yet</b>Type an amount on the Farms tab and press Start farming.<br>
    <button class="go" data-tab="farms">${BOLT}GO TO FARMS</button></div></div>`;
  const T = totals(), P = projection(), ids = Object.keys(F.farms).sort((a, b) => rank(BY[a]) - rank(BY[b]));
  let perDay = 0, ready = 0;
  ids.forEach(id => {
    const f = BY[id], l = F.farms[id], L = f.live;
    if (claimable(f, l)) ready += l.claim * L.px;
    if (l.done || (L.cap0 != null && l.cap >= 1)) return;
    const e = est(f, l.amount); if (e && (L.pts || L.daily)) perDay += (e.lo + e.hi) / 2 / 180;
    if (L.daily) perDay += L.daily * l.amount;
    if (L.weekly) perDay += weekly(f, l.amount) / 7 * L.px;
  });
  const seen = new Set(), ev = F.feed.filter(e => { const k = e.txt.replace(/<[^>]+>/g, "").split(/[:+\d]/)[0]; return !seen.has(k) && seen.add(k); })
    .slice(0, 3).map(e => `<span class="ev"><i style="background:var(--${e.c})"></i><time>${ago(e.d)}</time><span>${e.txt}</span></span>`).join("");
  return `<div class="back">← Back</div><div class="wrap">${header()}
  <div class="lhero">
    <div class="glass glow earn">
      <div class="row">
        <div><span class="cap">EARNED SO FAR</span><div class="big">${rng(T.lo, T.hi)}</div><div class="today"><em>+${money(perDay)} today</em>day ${Math.floor(F.day)} of your 6 months</div></div>
      </div>
      ${liveChart(F, P)}
      <div class="ticker"><span class="cap">CYMETICA 24/7</span>${ev}</div>
    </div>
    <div class="glass claimc">
      <span class="cap">READY TO CLAIM</span>
      <div class="felt"><small>CLAIM NOW</small><b>${money(ready)}</b><span>${ready > 0 ? "tokens waiting for you" : "nothing yet"}</span></div>
      <button class="go" data-act="claimall" ${ready > 0 ? "" : "disabled"}>${BOLT}CLAIM ALL</button>
      <div class="boxes"><div><small>IN FARMS</small><b>${usd(liveSum())}</b></div><div><small>FARMS</small><b>${ids.length}</b></div><div><small>CLAIMED</small><b class="g">${money(F.claimed)}</b></div></div>
      <div class="fine" style="margin-top:auto;padding-top:12px"><button class="stopall" data-act="stopall" style="color:var(--dim);font-size:11.5px">Stop all farms</button></div>
    </div>
  </div>
  <div class="sechead" style="margin-top:34px"><div><h2>Live now <i>${ids.length}</i></h2></div></div>
  <div class="grid">${ids.map(id => liveCard(id, F.farms[id])).join("")}</div>
  </div>`;
}

/* ---------- logo sheet ---------- */
function sheet() {
  const sz = n => logoSvg().replace("<svg", `<svg style="width:${n}px;height:${n}px"`);
  return `<div class="sheet"><div class="bigl">${logoSvg()}</div>
    <div><div class="wm">${logoSvg()}<div><span>AIRDROP</span><b>FARMER</b></div></div>
      <div class="sizes">${[64, 40, 24, 16].map(n => `<div>${sz(n)}${n}</div>`).join("")}</div></div></div>`;
}

/* ---------- wiring ---------- */
function ribbon() {
  if (SHOT) return;
  $("#ribbon").innerHTML = `<div class="ribbon"><b>TEST DATA</b><span>nothing leaves this page</span>
    <span>1 day =</span>${[[4, "4 s"], [1, "1 s"], [0, "pause"]].map(([v, t]) => `<button data-speed="${v}" class="${S.speed === v ? "on" : ""}">${t}</button>`).join("")}
    <button data-act="reset">Reset</button></div>`;
}
function render() {
  if (TAB === "logo") { $("#root").innerHTML = sheet(); return; }
  if (TAB === "live") { $("#root").innerHTML = liveView(); ribbon(); return; }
  $("#root").innerHTML = farmsView();
  renderList(); updatePlan(); ribbon();
}
function go(tab) {
  TAB = tab;
  const u = new URL(location.href); u.searchParams.set("tab", tab); history.replaceState(null, "", u);
  render(); scrollTo(0, 0);
}
function openStopAll() {
  $("#modal").innerHTML = `<div class="ov" data-act="close"><div class="glass modal" style="width:440px"><div class="cap">STOP ALL</div>
    <h3>Stop every farm?</h3><div class="lead">Anything claimable is claimed first, positions are closed and about ${usd(Object.values(S.farming.farms).reduce((s, l) => s + Math.max(0, l.amount - l.cost), 0))} goes back to your balance.</div>
    <div class="btns"><button class="ghost" data-act="close">Cancel</button><button class="go" style="background:var(--red);box-shadow:none;color:var(--text)" data-act="stopall-ok">STOP ALL</button></div></div></div>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-tog],[data-use],[data-act],[data-speed]");
  if (!t || SHOT) return;
  const d = t.dataset;
  if (d.tab) return e.preventDefault(); // switched on pointerdown, below
  if (d.tog) {
    const f = BY[d.tog];
    if (S.on[f.id]) { S.on[f.id] = false; S.custom = true; if (!f.free) { S.last[f.id] = amtOf(f.id) || S.last[f.id]; S.amt[f.id] = 0; } S.budget = planSum(); updateCard(f.id); updatePlan(); save(); }
    else if (f.free) { S.on[f.id] = true; S.custom = true; updateCard(f.id); updatePlan(); save(); }
    else setAmt(f.id, Math.min(rec(f) || S.last[f.id] || 300, maxAmt()));
    return;
  }
  if (d.use) return setAmt(d.use, rec(BY[d.use]));
  if (d.speed != null) { S.speed = +d.speed; ribbon(); save(); return; }
  switch (d.act) {
    case "max": setBudget(maxAmt(), true); break;
    case "best": REC = recommend(S.budget); applyBest(); renderList(); updatePlan(); save(); toast("Best split for " + usd(S.budget)); break;
    case "start": openStart(); break;
    case "close": if (e.target === t) $("#modal").innerHTML = ""; break;
    case "confirm": confirmStart(); break;
    case "stopall-ok": $("#modal").innerHTML = ""; Object.keys(S.farming.farms).forEach(id => stopFarm(id, true)); save(); toast("All farms stopped"); render(); break;
    case "reset": try { localStorage.removeItem(KEY); } catch (err) {} S = DEFAULT(); REC = recommend(S.budget); applyBest(); go("farms"); toast("Test reset"); break;
  }
});
// drag a ring: the amount follows the pointer round the dial
let drag = null;
function dialAmount(svg, e) {
  const r = svg.getBoundingClientRect(), sx = D.w / r.width;
  const px = (e.clientX - r.left) * sx - D.cx, py = (e.clientY - r.top) * sx - D.cy;
  let a = Math.atan2(py, px) * 180 / Math.PI; if (a < 0) a += 360;
  let t = ((a - D.a0) % 360 + 360) % 360 / D.sweep;
  if (t > 1) t = t - 1 < (360 / D.sweep - 1) / 2 ? 1 : 0; // in the gap at the bottom: the nearer end
  const v = maxAmt() * t * t;
  return v < 1000 ? Math.round(v / 10) * 10 : v < 5000 ? Math.round(v / 50) * 50 : Math.round(v / 100) * 100;
}
// the live tab redraws twice a second, so the tabs and its buttons act on pointerdown
document.addEventListener("pointerdown", e => {
  if (SHOT || e.button) return;
  const svg = e.target.closest("svg[data-dial]");
  if (svg && !BY[svg.dataset.dial].free) { drag = svg.dataset.dial; svg.setPointerCapture && svg.setPointerCapture(e.pointerId); setAmt(drag, dialAmount(svg, e), true); e.preventDefault(); return; }
  const t = e.target.closest("[data-tab],[data-claim],[data-stop],[data-act=claimall],[data-act=stopall]");
  if (!t) return;
  const d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.act === "stopall") return openStopAll();
  if (d.claim) { const v = claimFarm(d.claim); if (v) floatUp(e.clientX, e.clientY, "+" + money(v)); }
  else if (d.stop) stopFarm(d.stop);
  else if (d.act === "claimall") { if (!S.farming) return; const v = Object.keys(S.farming.farms).reduce((s, id) => s + claimFarm(id), 0); if (v) floatUp(e.clientX, e.clientY, "+" + money(v)); }
  save(); render();
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const svg = document.querySelector(`svg[data-dial="${drag}"]`);
  if (svg) setAmt(drag, dialAmount(svg, e), true);
});
document.addEventListener("pointerup", () => { if (drag) tellMoved(BY[drag]); drag = null; });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.amt) { setAmt(t.dataset.amt, +t.value.replace(/[^\d.]/g, "")); return; }
  if (t.id === "budget") { setBudget(+t.value.replace(/[^\d.]/g, ""), false); return; }
  if (t.id === "q") { S.q = t.value; renderList(); save(); }
});
document.addEventListener("focusout", e => {
  const t = e.target;
  if (t.dataset && t.dataset.amt) t.value = fmt(amtOf(t.dataset.amt));
  if (t.id === "budget") { if (S.budget > maxAmt()) setBudget(S.budget, true); t.value = fmt(S.budget); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("#modal").innerHTML = "";
  if (e.key === "Enter" && (e.target.id === "budget" || (e.target.dataset && e.target.dataset.amt))) e.target.blur();
});

// the test page fits a narrow window by scaling the whole page, so nothing scrolls sideways
const fit = () => { if (!SHOT) document.body.style.zoom = Math.min(1, innerWidth / 1300); };
addEventListener("resize", fit); fit();

let tick = 0;
setInterval(() => {
  if (SHOT || !S.farming || !S.speed) return;
  advance(.25 / S.speed);
  if (++tick % 2 === 0) {
    save();
    if (TAB === "live" && !$("#modal").innerHTML) $("#root").innerHTML = liveView();
    else if (TAB === "farms" && $("#hstatus")) $("#hstatus").innerHTML = `<span class="dot"></span><b>FARMING</b> · ${Object.keys(S.farming.farms).length} farms · ${usd(liveSum())} in`;
  }
}, 250);

// the pictures: the same plan before Start (Farms) and 23 days into it (Live farms), the weekly pays claimed on days 7 and 14
if (SHOT && TAB === "live") {
  startFarms();
  const runTo = d => { while (S.farming.day < d - 1e-9) advance(Math.min(.25, d - S.farming.day)); };
  runTo(7.4); claimFarm("lighter");
  runTo(14.4); claimFarm("lighter"); claimFarm("polymarket");
  runTo(23 + .6 / 24);
}
render();
if (SHOT && Q.has("modal")) openStart();
</script>
</body>
</html>
