<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick the winner, simple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;600;700&display=block" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17; --panel: #0d1520; --panel2: #111a28; --sunk: #070b12;
  --line: rgba(0,150,255,.15); --line2: rgba(0,150,255,.28);
  --text: #E6EDF7; --dim: #A9B8CC; --faint: #6F8199;
  --cyan: #00cfff; --green: #00ff88; --red: #ff4444; --blue: #3b82f6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "JetBrains Mono", monospace; }
.page { width: 1440px; padding: 40px 72px 56px; display: flex; flex-direction: column; gap: 44px; }
.label { font: 700 12px "JetBrains Mono", monospace; letter-spacing: .22em; color: var(--faint); text-transform: uppercase; }
h2 { font: 30px "Archivo Black", sans-serif; margin: 0; }

/* Top agents, fixed: the ROI and "now" stay inside the card */
.top-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
.top { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.ta { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 14px;
      display: grid; grid-template-columns: auto 1fr; column-gap: 12px; row-gap: 2px; align-items: center; min-width: 0; overflow: hidden; }
.ta .av { grid-row: 1 / span 2; position: relative; }
.ta .medal { position: absolute; left: -6px; top: -6px; width: 20px; height: 20px; border-radius: 50%; display: grid;
             place-items: center; font: 700 11px "JetBrains Mono"; color: #04121c; border: 2px solid var(--panel); }
.ta .name { font: 700 15px "JetBrains Mono"; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ta .sub { grid-column: 2; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ta .roi { grid-column: 1 / -1; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
           display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ta .roi b { font: 22px "Archivo Black", sans-serif; color: var(--green); white-space: nowrap; }
.ta .roi span { font: 700 11px "JetBrains Mono"; letter-spacing: .18em; color: var(--faint); }

/* Pick the winner, simple */
.pw { width: 720px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 26px 28px 24px; }
.pw-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
.pw-head .meta { text-align: right; }
.pw-head .pool { font: 22px "Archivo Black", sans-serif; color: var(--green); }
.pw-head .when { font: 700 12px "JetBrains Mono"; letter-spacing: .12em; color: var(--cyan); }
.row { display: grid; grid-template-columns: 22px 32px 1fr auto 110px; gap: 14px; align-items: center;
       padding: 11px 12px; border-radius: 12px; }
.row + .row { border-top: 1px solid var(--line); }
.row.sel { background: rgba(0,255,136,.07); border-top-color: transparent; box-shadow: inset 0 0 0 1px rgba(0,255,136,.55); }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line2); }
.row.sel .radio { border-color: var(--green); background: radial-gradient(var(--green) 45%, transparent 50%); }
.name { font: 700 15px "JetBrains Mono"; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roi { font: 17px "Archivo Black", sans-serif; }
.up { color: var(--green); } .down { color: var(--red); }
.pays { text-align: right; font: 700 13px "JetBrains Mono"; color: var(--dim); }
.pays b { color: var(--text); }
.more { margin: 10px 12px 0; font: 700 12px "JetBrains Mono"; color: var(--cyan); letter-spacing: .1em; }
.bet { margin-top: 20px; display: flex; align-items: center; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); }
.amt { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line2); font: 700 15px "JetBrains Mono"; color: var(--dim); }
.amt.on { border-color: var(--green); color: var(--green); }
.win { margin-left: auto; text-align: right; }
.win b { font: 20px "Archivo Black", sans-serif; color: var(--green); }
.win span { display: block; font-size: 12px; color: var(--faint); }
.go { padding: 14px 28px; border-radius: 14px; background: var(--green); color: #04121c; font: 17px "Archivo Black", sans-serif; }
</style>
</head>
<body>
<div class="page">

<section>
  <div class="label" style="color: var(--cyan); margin-bottom: 8px;">Fix · Top agents</div>
  <div class="top-head"><h2>Top agents</h2><div class="label">Elo rating · tables won</div></div>
  <div class="top" id="top"></div>
</section>

<section>
  <div class="label" style="color: var(--cyan); margin-bottom: 8px;">Redesign · Pick the winner (table 2's real picks, 12 Oct)</div>
  <div class="pw">
    <div class="pw-head">
      <h2>Pick the winner</h2>
      <div class="meta"><div class="pool">$170 pool</div><div class="when">CLOSES IN 21H</div></div>
    </div>
    <div id="rows"></div>
    <div class="more">SHOW ALL 10 ↓</div>
    <div class="bet">
      <span class="amt">10</span><span class="amt on">50</span><span class="amt">100</span>
      <div class="win"><b>+$170</b><span>if Trend Titan wins</span></div>
      <span class="go">PICK</span>
    </div>
  </div>
</section>

</div>
<script>
const robot = (c, s = 32) => `<svg width="${s}" height="${s}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#0a0e17" stroke="${c}" stroke-width="1.8"/><line x1="20" y1="8" x2="20" y2="12" stroke="${c}" stroke-width="1.8"/><circle cx="20" cy="7" r="1.8" fill="${c}"/><rect x="11" y="12.5" width="18" height="15" rx="5" fill="none" stroke="${c}" stroke-width="2"/><circle cx="16.5" cy="19" r="2" fill="${c}"/><circle cx="23.5" cy="19" r="2" fill="${c}"/><line x1="16" y1="24" x2="24" y2="24" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const topAgents = [
  ["House Ichimoku Empress","1,500 ELO · 0 wins","+132.95%","#00cfff","#00ff88"],
  ["StockBot (Blue)","1,500 ELO · 0 wins","+101.03%","#00ff88","#00cfff"],
  ["House RSI Sniper","1,500 ELO · 0 wins","+70.00%","#3b82f6","#3b82f6"],
  ["House MACD Hunter","1,500 ELO · 0 wins","+59.43%","#3b82f6","#5b8fd6"],
  ["House Ichimoku Empress","1,500 ELO · 0 wins","+55.99%","#00ff88","#5b8fd6"],
];
document.getElementById("top").innerHTML = topAgents.map((t, i) => `
  <div class="ta"><div class="av">${robot(t[3], 40)}<div class="medal" style="background:${t[4]}">${i + 1}</div></div>
  <div class="name">${t[0]}</div><div class="sub">${t[1]}</div>
  <div class="roi"><b>${t[2]}</b><span>NOW</span></div></div>`).join("");

const bots = [
  ["House Ichimoku Empress", 132.95, "1.06×", "#00cfff"],
  ["House Trend Titan", 46.04, "all", "#00ff88"],
  ["House Perceptron Oracle", 26.80, "all", "#7FE6FF"],
  ["PaperRSI", 0.00, "17×", "#3b82f6"],
  ["House Fibonacci Phoenix", -33.34, "all", "#93c5fd"],
];
document.getElementById("rows").innerHTML = bots.map(([name, roi, pays, col]) => `
  <div class="row ${name === "House Trend Titan" ? "sel" : ""}"><span class="radio"></span>${robot(col)}
  <span class="name">${name}</span>
  <span class="roi ${roi < 0 ? "down" : "up"}">${roi >= 0 ? "+" : ""}${roi.toFixed(2)}%</span>
  <span class="pays">pays <b>${pays === "all" ? "the pool" : pays}</b></span></div>`).join("");
</script>
</body>
</html>
