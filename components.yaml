# components.yaml -- SINGLE SOURCE OF TRUTH
#
# Consumed by, established by grep on 2026-09-20 rather than by memory:
#   qa/safety.py         -- endpoint rules, executable_params, probe_only floors
#   qa/config.py         -- base_urls()
#   qa/fingerprint.py    -- the discovery corpus (through registry.raw)
#   qa/report_plugin.py  -- hashed into a run's tree fingerprint
#   tests/conftest.py    -- collection-time tag validation
#
# This list said `qa/components.py -- the component registry the dashboard
# renders` from the day it was written until 2026-09-20. No such module has
# ever existed in this tree, and the two modules that do read the file were
# not named. A header that invents its own consumer is the sharpest kind of
# stale: it is the first thing a reader believes about the file.
#
# Rules of the file:
#   * An endpoint with no rule is DENIED for any non-read method. Default-deny.
#   * executable_params must be declared BEFORE an endpoint can be probed.
#   * probe_only: true is a hard floor -- no MUTATE test may target it, ever,
#     even with --allow-mutate. This is where money-moving endpoints live.

version: 1

base_urls:
  web: https://cymetica.com
  rest: https://cymetica.com
  mcp: https://cymetica.com/mcp/v1
  chain_rpc: https://rpc.mainnet.chain.robinhood.com

# ---------------------------------------------------------------------------
# Platform fingerprint corpus
#
# Cymetica exposes no build identifier: openapi.json pins info.version to a
# static "0.1.0", /api/v1/build-stats returns aggregate telemetry rather than a
# revision, and no response carries an x-build header. So we compute our own
# fingerprint over the documents that DO change when they ship.
#
# Any change to this corpus demotes every GREEN component to AMBER. That is the
# mechanism by which a silent deploy invalidates every prior verification
# without anyone having to remember to do it.
# ---------------------------------------------------------------------------
fingerprint:
  parts:
    - {kind: http, path: /.well-known/mcp.json}
    - {kind: http, path: /.well-known/agent-card.json}
    - {kind: http, path: /.well-known/agent-skills.json}
    - {kind: http, path: /.well-known/ai-plugin.json}
    - {kind: http, path: /.well-known/udc.json}
    - {kind: http, path: /openapi.json}
    # The one they tell outside agents to import, and the bigger of the two by
    # far: 49 paths against openapi.json's 13. It was not watched, and on
    # 2026-09-07 they shipped 11 KB of new response and request schemas into it
    # overnight -- a substantive change to the machine-readable API surface --
    # and the fingerprint did not move. Every run that day carried
    # sha256:381e671ceab01 before and after. A corpus that misses the document
    # under the most active development is a silent-deploy detector with the
    # deploys taken out.
    - {kind: http, path: /openapi-public.json}
    - {kind: http, path: /llms.txt}
    - {kind: mcp_tool_names, auth: none}
  # JSON pointers stripped before hashing. Too aggressive and we go blind to
  # real changes -- `qa-cli fingerprint explain` prints exactly what was hashed.
  volatile_keys:
    - timestamp
    - generated_at
    - server_time
    - as_of
    - uptime_seconds
    - request_id

