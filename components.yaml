# ---------------------------------------------------------------------------
# Endpoint rules.
#
# path may contain {placeholders}. Longest literal prefix wins.
# readonly_rpc marks JSON-RPC endpoints whose safety depends on the BODY
#   (which MCP method / which tool), not the HTTP method -- see mcp_tools below.
# ---------------------------------------------------------------------------
endpoints:
  - id: mcp.rpc
    path: /mcp/v1
    methods: [POST]
    component: mcp.protocol
    readonly_rpc: true
    executable_params: []
    inert_params: [jsonrpc, id, method, params]

  - id: mcp.agents_me
    path: /mcp/v1/agents/me
    methods: [GET]
    component: mcp.trust_ladder
    executable_params: []

  - id: mcp.agents_me_upgrade
    path: /mcp/v1/agents/me/upgrade
    methods: [POST]
    component: mcp.trust_ladder
    executable_params: [reason]
    inert_params: []
    probe_only: true          # trust escalation is never executed by the suite

  - id: mcp.register
    path: /mcp/v1/register
    methods: [POST]
    component: mcp.trust_ladder
    # The first three are what the server actually requires -- POST with {}
    # answers 422 naming name, contact_email and intended_use (measured
    # 2026-09-07 walking /build). The rest are kept as aliases in case the
    # schema grows back into them. See test_register_floor_names_the_fields_
    # that_actually_create_an_account for why the spelling matters.
    executable_params:
      [name, contact_email, intended_use, email, description, agent_name]
    probe_only: true          # account creation is an operator action, not ours

  - id: funding.withdraw
    path: /api/v1/funding/withdraw
    methods: [POST]
    component: funding.withdraw
    # Anything in this list, present and non-empty, aborts the request before
    # it reaches the network. A probe proves REACHABILITY, never EXECUTION.
    executable_params:
      [token, amount, destination_address, to, address, chain, asset,
       quantity, value, recipient, memo, tag]
    inert_params: []
    probe_only: true

  - id: funding.deposit
    path: /api/v1/funding/deposit
    methods: [POST]
    component: funding.deposit
    executable_params: [token, amount, chain, asset, quantity]
    probe_only: true

  - id: funding.deposit_addresses
    path: /api/v1/funding/deposit-addresses
    methods: [GET]
    component: funding.deposit
    executable_params: []

  - id: clob.orders
    path: /api/v1/clob/orders
    methods: [POST]
    component: rest.clob
    executable_params:
      [side, price, size, quantity, amount, pair, symbol, market, type,
       time_in_force, client_order_id]
    inert_params: []
    probe_only: true   # places a real order -- the middle leg of the money loop their
    # own trust ladder names: deposit, CLOB trading, withdrawal

  - id: clob.order_singular
    path: /api/v1/clob/order
    methods: [POST]
    component: rest.clob
    executable_params:
      [side, price, size, quantity, amount, pair, symbol, market, type]
    inert_params: []
    probe_only: true   # singular alias of clob.orders; same money, same floor

  - id: clob.book
    path: /api/v1/clob/book/hybrid
    methods: [GET]
    component: rest.clob
    executable_params: []

  - id: exchange.orders
    path: /api/v1/exchange/{symbol}/orders
    methods: [POST]
    component: rest.clob
    executable_params: [side, price, size, quantity, amount, type]
    probe_only: true   # places an order on a token exchange book

  - id: exchange.buy
    path: /api/v1/exchange/buy
    methods: [POST]
    component: rest.clob
    executable_params: [token, amount, quantity, size, price]
    probe_only: true

  # Event-card trading. Declared 2026-09-08 so the floor names what it is
  # standing on: until now these were stopped only by the undeclared-keys
  # catch-all, and a floor that does not name what it holds is one edit from
  # not holding it (tests/meta/test_guard_is_real.py).
  #
  # NOT probe_only, because the operator has asked for paper trading through
  # the API. amount_usdc is executable, so SAFE and PROBE both refuse a body
  # carrying one -- reaching this endpoint takes a deliberate MUTATE, the same
  # door submit.py goes through to file a report. `paper` is inert: it is the
  # flag that says no money moves, and marking it executable would invert its
  # meaning.
  #
  # `required_flags` is what makes that sentence true. Until 2026-09-10 it was
  # only a sentence: inert_params is read at PROBE and the MUTATE branch never
  # looked at a body, so an order carrying amount_usdc and no paper passed
  # every guard -- and the live schema resolves an absent paper against the
  # account's simulation_mode, which is False. inert_params could not carry
  # this, because elsewhere it means "these keys are harmless in a probe body"
  # (a2a_send declares five and sends three); required_flags means "this must
  # be here, and true, or the request does not leave the machine".
  - id: event_cards.buy
    path: /api/v1/event-cards/{card_id}/buy
    methods: [POST]
    component: rest.event_cards
    executable_params: [amount_usdc]
    inert_params: [paper]
    required_flags: [paper]

  - id: event_cards.sell
    path: /api/v1/event-cards/{card_id}/sell
    methods: [POST]
    component: rest.event_cards
    executable_params: [amount_usdc, units]
    inert_params: [paper]
    required_flags: [paper]

  - id: event_cards.short
    path: /api/v1/event-cards/{card_id}/short
    methods: [POST]
    component: rest.event_cards
    executable_params: [amount_usdc]
    inert_params: [paper]
    required_flags: [paper]

  # The GET is unregistered on purpose -- reads are default-allowed at SAFE,
  # and this one moves no money at all ("no prizes are attached and nothing
  # moves money").
  #
  # The POST was probe_only from 2026-09-13 morning until that afternoon,
  # because its shape was undocumented and a wrong body their server happened
  # to accept would lock a real week-long round on garbage picks -- "Each pick
  # locks the stored close on the round day", with no way back before it
  # scores. The operator relayed that gap to Cymetica (MSG-0011) and they
  # published it the same day, in a new "Clone Tools & Tournaments" section:
  #
  #   POST /api/v1/universe/movers/tournament/enter
  #   Body: {"symbols": ["AAPL", "NVDA"]} (1-5 symbols)
  #   "Requires a session or API key. Unknown or unpriced symbols are
  #    rejected with a plain 422 reason."
  #
  # Worth keeping: the path we had guessed was the tournament path itself, and
  # it was wrong. The flag is what stopped that guess reaching a live round.
  # Still MUTATE, so it needs --allow-mutate on purpose.
  - id: movers.enter
    path: /api/v1/universe/movers/tournament/enter
    methods: [POST]
    component: rest.movers
    executable_params: [symbols]

  - id: arena.order
    path: /api/v1/arena/order
    methods: [POST]
    component: rest.arena
    executable_params: [team, side, amount, size, quantity, price]
    probe_only: true   # an Arena order carries amount/size/price and settles

  # The clone floor was "cloning funds an agent; the gas policy bills cloned
  # agents to the user's own balance". True before CloneBotRequest published
  # `paper`: "true = paper clone, false = live clone, omitted = inherits the
  # account's simulation_mode". Omitted is the dangerous reading and is exactly
  # what required_flags refuses. Re-derived 2026-09-10.
  - id: agents.clone
    path: /api/v1/agents/clone
    methods: [POST]
    component: rest.agents
    executable_params: [bot_id, slug, name, capital, funding, amount, species]
    required_flags: [paper]   # cloning funds an agent; the gas policy bills cloned agents to
    # the user's own balance, and clone/deposit-info exists for a reason

  - id: bots.clone
    path: /api/v1/bots/clone
    methods: [POST]
    component: rest.agents
    executable_params: [bot_id, slug, name, capital, funding, amount, species]
    required_flags: [paper]   # the other clone route; same money, same floor

  # The one they actually serve. Found by the sweep of 2026-09-10: the two
  # rules above name paths that are in no openapi document -- /api/v1/agents/*
  # is absent entirely and /api/v1/bots/clone is our own reported 404 (#49) --
  # so the paper floor was guarding two doors nobody opens while the real one
  # stood only behind default-deny. That held, and it is not the same thing as
  # a floor: the day somebody declares this endpoint to make their request go
  # through, the floor they inherit is whatever they wrote in that commit.
  # The other two stay because a 404 that comes back is restored by being
  # served, not by being re-declared.
  #
  # CloneBotRequest, from their 18:50 snapshot: source_type ('wta_species' or
  # 'perpetual_agent'), source_id, custom_name, is_paper, and paper -- "Same
  # as is_paper (canonical name shared with the event-card endpoints). true =
  # paper clone, false = live clone, omitted = inherits the account's
  # simulation_mode." Omitted is the dangerous reading; this account's
  # simulation_mode has been False. Their own description makes `paper` the
  # canonical name, so that is the flag the floor names.
  - id: cloned_bots.clone
    path: /api/v1/cloned-bots/clone
    methods: [POST]
    component: rest.agents
    executable_params: [source_type, source_id, custom_name]
    required_flags: [paper]

  # Funding a clone, and the one place on this surface where required_flags
  # cannot be the floor: `FundBotRequest` has exactly one property, `amount`.
  # There is no flag in the body to carry, because what makes the transfer
  # harmless is a property of the INSTANCE -- a paper clone holds a practice
  # balance -- and the transport can only read bodies.
  #
  # So this is declared with its executable param and the floor lives in
  # scripts/clone.py, which reads the target's `is_paper` from THEM before
  # every transfer and refuses on false, on null and on a body it could not
  # read. Said plainly because it is weaker than the two floors above: a
  # MUTATE test with --allow-mutate could reach this endpoint, and nothing at
  # the transport would stop it. If a test ever needs to, give it a floor
  # first -- their schema would have to publish something to hang it on.
  - id: cloned_bots.fund
    path: /api/v1/cloned-bots/{instance_id}/fund
    methods: [POST]
    component: rest.agents
    executable_params: [amount]

  # Starting and configuring a clone. Declared 2026-09-10 after they published
  # the routes in response to #88 -- until then both were served and in no
  # document, and default-deny was the only thing holding them.
  #
  # Same floor problem as fund, one step worse: neither request carries a
  # paper flag, and toggle-trading takes no body at all -- `enabled` is a
  # query parameter. So there is nothing for required_flags to read, and the
  # floor is in scripts/clone.py, which asks THEM for the instance's
  # `is_paper` AND `execution_class` before either call and refuses unless
  # both say paper.
  #
  # Why that pair rather than is_paper alone: the toggle-trading description
  # reads "When enabled, bot will trade 100% on-chain", with no paper caveat,
  # while the instance carries onchain_pct 100 beside
  # execution_class PAPER_SIMULATION. The description and the object appear
  # to disagree and only the object is machine-readable, so the floor stands
  # on the object and reads both of its fields.
  - id: cloned_bots.toggle_trading
    path: /api/v1/cloned-bots/{instance_id}/toggle-trading
    methods: [POST]
    component: rest.agents
    executable_params: [enabled]

  - id: cloned_bots.settings
    path: /api/v1/cloned-bots/{instance_id}/settings
    methods: [PATCH]
    component: rest.agents
    executable_params: [is_trading, stop_loss_pct, take_profit_pct, max_position_pct]

  - id: prop.signup
    path: /api/v1/prop/signup
    methods: [POST]
    component: rest.account
    executable_params: [tier, amount, payment_method, capital]
    probe_only: true

  - id: tuatara.discover
    path: /api/v1/tuatara/discover
    methods: [POST]
    component: rest.markets
    executable_params: []
    inert_params: [query, headline, text, limit]

  - id: backtest.run
    path: /api/v1/backtest/bots/{slug}/run-backtest
    methods: [POST]
    component: rest.backtest
    executable_params: [start, end, capital, params]

  - id: support.ai_agent
    path: /api/v1/support/ai-agent
    methods: [POST]
    component: rest.support
    executable_params: []
    inert_params: [message, question, query, context]

  # Our own filing channel. Not probe_only: filing a report IS the intended
  # action here, and it is the one write this project performs on purpose.
  # Declared so the guard permits it at MUTATE tier and blocks it everywhere else.
  - id: bounty.submit
    path: /api/v1/bounty/reports
    methods: [POST]
    component: rest.support
    executable_params:
      [title, description, severity_reported, category, steps_to_reproduce,
       expected_behavior, actual_behavior, url, browser, device, os,
       hunter_name, wallet_address]
    inert_params: []

  # The second write, added 2026-09-07 when they published the endpoint and
  # asked for the verifications we were holding. Not probe_only, for the same
  # reason as bounty.submit: recording our own re-check IS the intended action.
  # It carries no figure of theirs and moves no money -- what it asserts is
  # that a check of ours passes under the fingerprint it last failed under.
  #
  # Specificity 5, so it wins over any future /reports/{id} rule, and
  # bounty.submit's regex (^/api/v1/bounty/reports/?$) does not reach it.
  - id: bounty.verification
    path: /api/v1/bounty/reports/{id}/verification
    methods: [POST]
    component: rest.support
    executable_params:
      [verdict, evidence, test_run_id, fingerprint, tree_sha, checked_at]
    inert_params: []

  - id: bounty.submit_with_screenshots
    path: /api/v1/bounty/reports/with-screenshots
    methods: [POST]
    component: rest.support
    executable_params:
      [title, description, severity_reported, category, steps_to_reproduce,
       expected_behavior, actual_behavior, url, browser, device, os,
       hunter_name, wallet_address, screenshots]
    inert_params: []

  - id: bounty.qa_ask
    path: /api/v1/bounty/qa-agent/ask
    methods: [POST]
    component: rest.support
    executable_params: []
    inert_params: [question, message, context]

  # The async half of the same channel. agent-card.json publishes both as the
  # way to ask a question the card does not already answer; the body carries a
  # question and an agent id, and nothing it contains can execute anything.
  # The a2a protocol endpoint agent-card.json publishes as THE cross-platform
  # door to their agents ("Any AI agent can send structured messages to
  # CyMetica AI agents", message_types chat / trade_signal / advice). Declared
  # 2026-09-10 so its reachability can be measured rather than assumed: a GET
  # answers 404 and no openapi path mentions it, and FastAPI answers 405 when
  # a route exists under another method -- so a PROBE settles whether the
  # route exists at all.
  - id: a2a.message
    path: /api/v1/a2a/message
    methods: [POST]
    component: rest.support
    executable_params: [message, content, payload, type, message_type]

  - id: bounty.a2a_send
    path: /api/v1/bounty/a2a/send
    methods: [POST]
    component: rest.support
    executable_params: []
    inert_params: [from_agent_id, to_agent_id, content, thread_id, subject]

  - id: ai_due_diligence
    path: /api/v1/ai-due-diligence
    methods: [POST]
    component: platform.ai_native_proof
    executable_params: []
    inert_params: [company, domain, name, url]

# JSON-RPC tool classification for the MCP endpoint. The transport reads the
# body: tools/list is always read-only; tools/call is classified by tool name.
# A tool absent from every list is DENIED at SAFE and PROBE.
mcp_tools:
  read:
    [get_trust_signal, list_markets, get_market, get_prices, get_orderbook,
     list_clob_pairs, search_markets, get_platform_status, who_is_this,
     get_ai_native_proof, get_trust_ladder, get_btc_pool_state,
     get_btc_pool_history, get_prediction_statistics, get_deadcoin_quote,
     get_deadcoin_desk_info, get_agent_profile, get_rate_limits,
     get_deposit_address, get_signal_history, get_market_analytics,
     get_oracle_insights, get_positions, get_order_history, query_knowledge,
     launchpad_list_tokens, launchpad_trade_quote, list_my_aib_funds,
     list_ontology_dimensions, browse_ontology, resolve_ontology_concept,
     search_ontology, find_trade_path, get_strategy_returns,
     get_deep_answer, ask_nexus_deep,
     # The ground-truth lane of the overnight loop Cymetica themselves told us
     # to run (Telegram, 2026-09-11): surfaces, then models, then the metrics.
     # Both take no arguments and return a catalogue; both are served to an
     # anonymous caller, which is the vendor's own statement that they read
     # nothing of ours. Classified 2026-09-12 -- before it, the transport
     # refused them, which is why the store holds 0 calls to the first step of
     # the loop.
     list_backtest_surfaces, get_backtest_models,
     # Served from their 2026-09-10 12:37 release, after they fixed #85.
     # Both read: one looks a card up, the other backtests a basket and
     # NEXUS describes it as free and read-only.
     get_event_card_info, backtest_event_card_idea,
     # Classified 2026-09-12. The search seeds itself from their cards, and
     # without this we can only ever see the ones the sampler happened to walk
     # past -- twelve of them. A listing is the plainest read there is; the
     # sibling that explains ONE card has been read since 2026-09-10.
     list_event_cards,
     # Classified 2026-09-19. Their advisor connector (mcp.json
     # advisor_connector) names these four as "read-only fund research ...
     # No key needed", and each tool's own description says "Read-only".
     list_funds, get_fund, get_fund_history, get_fund_methodology]
  contribute:
    [submit_observation, submit_feedback, request_feature, submit_signal]
  trade:
    [place_order]

  # Tools that move money AND publish a flag that stops them moving it. The
  # value is the argument that must be present and true before the tool may be
  # executed at MUTATE -- the same rule required_flags makes for REST
  # endpoints, and for the same reason: a blanket refusal on a tool that can be
  # told not to spend is a floor written for a world before the flag existed.
  #
  # trade_event_card, from its own description: "Defaults to PAPER trading (no
  # real funds move -- positions and P&L are tracked and tagged paper). Live
  # trading only on an explicit paper=false AND the platform trading gate."
  # place_order is NOT here: the CLOB has no paper book at all and refuses
  # paper=true with 400 CLOB_NO_PAPER_BOOK, so its floor stays absolute.
  paper_gated:
    trade_event_card: paper
  provision:
    [create_aib_fund, edit_aib_fund_basket, launchpad_launch_token,
     register_webhook, subscribe_prices]
