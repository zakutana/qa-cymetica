# The contradiction sweep.
#
# Each entry is one QUESTION the platform answers in more than one place. Every
# pair of sources expands to its own named test, so a ticket pinned to
# `agent_names::llms_txt-vs-live_species` keeps working forever even when a
# fifth source is added later. An N-way test would change identity every time
# the source list grew and silently orphan every pinned regression check.
#
# Extractor grammar: see qa/extractors.py
# Relations: all_equal | set_equal | subset | within_tolerance
#
# volatile: true means the value legitimately moves. A mismatch is recorded as
# inconclusive and may never open a ticket -- a number we cannot cleanly
# measure is not a contradiction we are entitled to report.

sources:
  llms_txt:      {kind: text, url: "/llms.txt"}
  llms_txt_2:    {kind: text, url: "/llms.txt"}   # same doc, a second statement in it
  mcp_json:      {kind: json, url: "/.well-known/mcp.json"}
  agent_card:    {kind: json, url: "/.well-known/agent-card.json"}
  agent_skills:  {kind: json, url: "/.well-known/agent-skills.json"}
  openapi:       {kind: json, url: "/openapi.json"}
  udc:           {kind: json, url: "/.well-known/udc.json"}
  build_stats:   {kind: json, url: "/api/v1/build-stats"}
  live_species:  {kind: json, url: "/api/v1/agents/species"}
  live_agentbook: {kind: json, url: "/api/v1/agentbook/agents"}
  live_chains:   {kind: json, url: "/api/v1/swap/chains"}
  mcp_anon:      {kind: mcp_tools, identity: anon}
  mcp_trusted:   {kind: mcp_tools, identity: trusted}

claims:

  # -------------------------------------------------------------------------
  - id: agent_names
    question: "Does llms.txt name agent symbols that actually exist?"
    component: rest.agents
    relation: subset
    # Which side must be CONTAINED. Without it the pair was ordered
    # alphabetically and the claim could come out backwards.
    subset: llms_txt
    subset_why: >
      llms.txt is the claimant: it tells a reader which agents they can clone.
      The live species catalogue is the fact. A document may name fewer than
      exist; it may not name one that does not.
    severity: S1-INTEGRITY
    note: >
      Rewritten twice. The version filed with #48 enumerated the 21 symbols
      observed across two captures, so it matched whatever the document
      happened to contain and passed vacuously on the very defect it was
      written for -- and because the nodeid never changed, that rewrite was
      invisible to the ledger. The extractor now names a PLACE in the
      document rather than the values it expects to find there: whatever list
      follows the phrase is read, so a symbol that does not resolve is caught
      however it got in. Subset, not equality, because the document is not
      obliged to name them all.
    sources:
      llms_txt:     'list_after:AI trading agent'
      live_species: 'set:$[*].symbol'

  # llms_agent_count_self_consistent lived here. It pinned two particular
  # sentences and compared them to each other. On 2026-09-05 the vendor
  # corrected 10 -> 11 and consolidated the duplicate, which removes an
  # operand -- so the claim would have gone green by losing the thing it
  # compared, which is the failure mode this whole suite exists to prevent.
  # Replaced by a check that reads EVERY stated count and settles them all
  # against the live catalogue:
  #   tests/rest/test_llms_counts.py::test_every_agent_count_in_llms_matches_the_live_species_list

  - id: agent_count
    question: "How many clonable AI trading agents exist?"
    component: rest.agents
    relation: all_equal
    severity: S2-MEASUREMENT
    note: >
      Their resolution on #52 states these count different things: 16 is the
      strategy enum, 11 the clonable species, 8 those active on AgentBook. That
      split is legitimate, so this claim is narrowed to the two sources that
      must agree -- the live species catalogue, and what llms.txt tells a
      reader they can clone.
    sources:
      llms_txt:     'regex_int:any of our (\d+) AI trading agent species'
      live_species: 'len:$'

  # -------------------------------------------------------------------------
  - id: mcp_tool_names_documented_exist
    question: "Does every tool name llms.txt documents exist on the server?"
    component: mcp.tools_list
    relation: subset
    subset: llms_txt
    subset_why: >
      Same shape as agent_names: llms.txt is the document making the claim and
      the MCP manifest is the catalogue. Documenting fewer tools than exist is
      fine; documenting one that does not exist is not.
    severity: S3-CONTRACT
    note: >
      Subset, not set_equal. llms.txt is not obliged to list every tool -- it is
      obliged not to name one that does not exist. The earlier set_equal form
      would now fail simply because the document lists fewer than the server
      serves, which is correct behaviour. The extractor was rewritten after the
      document stopped rendering tools as markdown links: the old pattern found
      nothing at all, so the check reported INCONCLUSIVE for days while looking
      like a resolved defect. It now anchors on the document's own "MCP Tools"
      section and reads the list it contains, whatever that list says.
    sources:
      llms_txt: 'scope:MCP Tools|regex_all:^- `([a-z][a-z0-9_]+)`'
      mcp_json: 'set:$.tools[*].name'

  # Tier correctness is NOT in this table. Comparing a served set against a
  # DECLARED tier has to name which tools and in which direction, which the
  # generic pairwise machinery would flatten into "two numbers differ".
  # See tests/mcp/test_trust_ladder.py.

  # -------------------------------------------------------------------------
  - id: skills_subset
    question: "Is agent-skills.json the actionable subset of agent-card.json, as stated?"
    component: discovery.wellknown
    relation: subset
    subset: agent_skills
    subset_why: >
      Their own resolution on #51 states agent-card.json is the full discovery
      card and agent-skills.json the endpoint-actionable subset of it. So the
      skills file is the contained side, by their description of the model.
    severity: S3-CONTRACT
    note: >
      Their resolution on #51 states agent-card.json is the full discovery card
      and agent-skills.json the endpoint-actionable subset. That is a testable
      model and the right one, so this checks the claim they actually made
      rather than demanding the two files be identical -- which they explained,
      correctly, that they should not be.
    sources:
      agent_skills: 'set:$.skills[*].id'
      agent_card:   'set:$.skills[*].id'

  # -------------------------------------------------------------------------
  # clob_pair_count moved OUT of this table. Both of its sources were
  # sentences, so the comparison was prose against prose: evidence-role, unable
  # to fail, and it had established a PASSING state anyway. It is now a real
  # measurement in tests/mcp/test_clob_pairs.py -- the document's number
  # against the catalogue list_clob_pairs actually returns.

  - id: commit_count
    question: "How many commits are in the production codebase?"
    component: platform.ai_native_proof
    relation: within_tolerance
    tolerance_pct: 5
    severity: S2-MEASUREMENT
    volatile: true
    note: >
      Commits legitimately accrue, so a small gap is expected and a large one
      is not. This is the platform's headline marketing figure, so a stale
      number here is a measurement defect rather than a cosmetic one.
    sources:
      llms_txt:    'regex_int:With ([\d,]+)\+ commits'
      build_stats: 'jsonpath:$.totals.commits'

  # mcp_resource_count lived here. Its llms_txt extractor read a fixed
  # "N tools, M resources" line that the vendor removed on 2026-09-05,
  # replacing it with a pointer to tools/list -- correct, because the
  # catalogue is scoped to the caller's tier and no single figure is right
  # for every reader (35 anonymous vs 56 allied, measured). With its source
  # gone the claim could only score Inconclusive forever while presenting as
  # a settled row. Replaced by a guard on the resolution itself:
  #   tests/rest/test_llms_counts.py::test_llms_states_no_fixed_size_for_a_tier_scoped_catalogue
