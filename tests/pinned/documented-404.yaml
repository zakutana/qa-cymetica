# Paths the platform documented and did not serve, pinned on 2026-09-04.
#
# Why this file exists, stated plainly: the reachability percentages on the
# dashboard were computed over whatever the vendor documented AT THAT MOMENT.
# Between the two inventory captures the documentation went from 141 paths to
# 114, and all 26 of these disappeared from it. Not one was fixed in place.
# The board turned green in eight sections because the denominator shrank.
#
# A population that moves cannot measure a fix. So the population is frozen
# here, in the repository, at the moment the finding was made -- and each path
# gets its own collectible check, which can come back one of three ways:
#
#   still documented, still 404  -> FAIL. The defect stands.
#   still documented, now served -> PASS. Fixed in place. This is the only
#                                  thing that counts as a fix.
#   no longer documented         -> INCONCLUSIVE, with the reason spelled out:
#                                  removed from documentation, not fixed in
#                                  place. Never a pass. Deleting the promise
#                                  is a legitimate resolution, but it is the
#                                  vendor's decision to announce, not a
#                                  measurement we may quietly bank.
#
# `source` is the document that made the promise; the check reads that
# document to decide which of the three cases applies.
#
# WHAT HAPPENS TO THE THIRD CASE -- operator's standing rule, 2026-09-08:
#
#     "Jestli neco v dokumentaci neni tak to netestuj. Dej to bojem a kdyz se
#      treba znova objevi tak to obnovis. Testujem jen to co je viditelne ne
#      nejake historicke veci, jejich platforma je ve vyvoji a bude se casto
#      menit."
#
# So INCONCLUSIVE is a waiting room, not a resting place. A pin that reaches
# it is RETIRED by a retire_check event, with the reason recorded -- and if
# the path reappears in their documentation, the pin is restored the same way.
#
# That does not undo the reason this file exists; it is the point of it. The
# audit finding was that the denominator shrank SILENTLY. Retiring by an event
# shrinks it loudly: the path is named, the reason is written, and the ledger
# can show what left and why. What we must never do is let a path fall out of
# the count because nobody looked.
#
# Done once already: 23 of the 26 were retired on 2026-09-08, all of them
# still answering 404 and none of them promised anywhere any more. Three
# remain, each renamed to a path that IS served.

